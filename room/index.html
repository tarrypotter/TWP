<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="실 예약">
<meta name="theme-color" content="#07090a">
<meta name="format-detection" content="telephone=no">
<title>실 예약 · 세종월드교회 · 대전자성교회</title>
<link rel="stylesheet" href="./style.css?v=1">
<style>
  .auth .body .seg { margin: 0 0 16px; }
  .auth .btn.block { margin-top: 18px; }
  .signup-preview { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(143,217,194,.08); border: 1px solid rgba(143,217,194,.22); font-size: 11.5px; color: var(--brand-2); }
  .signup-preview b { color: var(--brand); }
</style>
</head>
<body>
<div id="app"><div class="loading"><i class="spin"></i><span>불러오는 중…</span></div></div>
<div class="toast" id="toast"></div>

<!-- 관리자 PIN -->
<section class="sheet fit" id="sheetPin" aria-hidden="true">
  <div class="sheet-hdr"><b>관리자 모드</b><button class="btn sm ghost" data-act="closeSheet" style="margin-left:auto" type="button">닫기</button></div>
  <div class="sheet-body">
    <div class="pin-wrap">
      <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
      <div class="pin-msg" id="pinMsg">관리자 PIN을 눌러 주세요</div>
      <div class="pad" id="pinPad">
        <button class="pad-key" type="button" data-pin="1">1</button>
        <button class="pad-key" type="button" data-pin="2">2</button>
        <button class="pad-key" type="button" data-pin="3">3</button>
        <button class="pad-key" type="button" data-pin="4">4</button>
        <button class="pad-key" type="button" data-pin="5">5</button>
        <button class="pad-key" type="button" data-pin="6">6</button>
        <button class="pad-key" type="button" data-pin="7">7</button>
        <button class="pad-key" type="button" data-pin="8">8</button>
        <button class="pad-key" type="button" data-pin="9">9</button>
        <button class="pad-key wide" type="button" data-pin="clear">지움</button>
        <button class="pad-key" type="button" data-pin="0">0</button>
        <button class="pad-key wide" type="button" data-pin="del">⌫</button>
      </div>
      <p class="tiny muted" style="text-align:center;line-height:1.7">처음 PIN은 <b style="color:var(--brand-2)">0000</b>입니다.<br>설정에서 바꿀 수 있어요.</p>
    </div>
  </div>
</section>

<!-- 거절 사유 -->
<section class="sheet fit" id="sheetReject" aria-hidden="true">
  <div class="sheet-hdr"><b>거절 사유</b><button class="btn sm ghost" data-act="closeSheet" style="margin-left:auto" type="button">닫기</button></div>
  <div class="sheet-body">
    <div class="chips wrap" id="rejectChips" style="padding:0 0 6px"></div>
    <label class="field" style="margin-top:8px"><span>사유 (직접 적어도 돼요)</span>
      <input class="input" id="rejectText" maxlength="60" placeholder="예: 그 시간에 다른 모임이 잡혀 있어요">
    </label>
  </div>
  <div class="sheet-foot"><button class="btn danger block" data-act="doReject" type="button">이 요청 거절하기</button></div>
</section>

<!-- 확인 -->
<section class="sheet fit" id="sheetConfirm" aria-hidden="true">
  <div class="sheet-hdr"><b id="confirmTitle">확인</b><button class="btn sm ghost" data-act="closeSheet" style="margin-left:auto" type="button">닫기</button></div>
  <div class="sheet-body"><p class="small sub" id="confirmDesc" style="line-height:1.7"></p></div>
  <div class="sheet-foot">
    <button class="btn block ghost" data-act="closeSheet" type="button">그만두기</button>
    <button class="btn block danger" data-act="doConfirm" type="button" id="confirmOk" style="margin-top:8px">확인</button>
  </div>
</section>

<!-- PIN 변경 -->
<section class="sheet fit" id="sheetPinChange" aria-hidden="true">
  <div class="sheet-hdr"><b>관리자 PIN 변경</b><button class="btn sm ghost" data-act="closeSheet" style="margin-left:auto" type="button">닫기</button></div>
  <div class="sheet-body">
    <label class="field"><span>새 PIN (숫자 4자리)</span>
      <input class="input" id="newPin1" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">
    </label>
    <label class="field"><span>한 번 더</span>
      <input class="input" id="newPin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">
    </label>
    <p class="hint" id="pinChangeMsg"></p>
  </div>
  <div class="sheet-foot"><button class="btn primary block" data-act="doPinChange" type="button">PIN 바꾸기</button></div>
</section>

<script type="module">
import {
  db, COLL, CHURCHES, CHURCH_ORDER, ROOMS, roomOf, roomsOf, floorsOf, churchName,
  pad, fmt, toMin, DAY_START, DAY_END, SPAN, LAST_START,
  todayStr, addDays, nowMin, dayName, dayLabel, dateLabel,
  STATUS, isLive, spans, busyOf,
  profileOf, ageTag, giLine, acctOf, acctProblem, pwProblem, newSalt, pwHashOf,
  getPinConfig, checkPin, savePin, esc, peopleText,
  collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, where, onSnapshot
} from './core.js';

/* ================= 상태 ================= */
const S = {
  ready: false,
  user: null,
  church: 'sejong',
  view: 'home',          // home | room | my | admin | settings
  roomId: null,
  date: todayStr(),
  bookings: [],
  form: { start: '10:00', end: '11:00', people: 2, reason: '' },
  pick: null,
  floor: 'all',
  admin: false,
  adminChurch: 'all',
  adminStatus: 'pending',
  adminDate: todayStr(),
  authTab: 'login',
  dirty: false
};

const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer;
function toast(msg, top) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('top', !!top || !!document.querySelector('.sheet.open'));
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function openSheet(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
  document.body.classList.add('sheet-open');
}
function closeSheet(el) {
  const s = el && el.classList ? el : null;
  document.querySelectorAll('.sheet.open').forEach(x => {
    x.classList.remove('open');
    x.setAttribute('aria-hidden', 'true');
  });
  document.body.classList.remove('sheet-open');
}
function closeAllSheets() { closeSheet(); }

/* ================= 세션 ================= */
const SKEY = 'room.session.v1';
const PKEY = 'room.profile.v1';
const AKEY = 'room.admin.v1';

function saveSession() {
  try {
    localStorage.setItem(SKEY, JSON.stringify({ acct: S.user.acct, church: S.church }));
    localStorage.setItem(PKEY, JSON.stringify(S.user));
  } catch (e) { }
}
function clearSession() {
  try { localStorage.removeItem(SKEY); localStorage.removeItem(PKEY); sessionStorage.removeItem(AKEY); } catch (e) { }
}

/* ================= 데이터 ================= */
let unsubBookings = null;

function startLive() {
  if (unsubBookings) { try { unsubBookings(); } catch (e) { } }
  const d0 = todayStr();
  const d1 = addDays(13);
  const q = query(collection(db, COLL.bookings), where('date', '>=', d0), where('date', '<=', d1));
  unsubBookings = onSnapshot(q, snap => {
    S.bookings = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (!S.ready) { S.ready = true; }
    softRender();
  }, err => {
    console.warn('bookings', err);
    toast('예약 현황을 불러오지 못했어요');
  });
}

function softRender() {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { S.dirty = true; return; }
  render();
}
document.addEventListener('focusout', () => {
  if (S.dirty) { S.dirty = false; setTimeout(render, 0); }
});

/* ================= 계산 ================= */
function roomState(room, date) {
  const d = date || todayStr();
  const list = busyOf(S.bookings, room.id, d);
  const t = nowMin();
  const isToday = d === todayStr();
  const cur = isToday ? list.find(b => b.status === 'approved' && toMin(b.start) <= t && t < toMin(b.end)) : null;
  const next = list.filter(b => toMin(b.start) > t || !isToday).sort((a, b) => toMin(a.start) - toMin(b.start))[0];
  const waiting = list.some(b => b.status === 'pending');
  const count = list.filter(b => b.status === 'approved').length;
  if (cur) return { k: 'busy', label: '사용 중', text: cur.end + '까지 · ' + esc(cur.name) };
  if (waiting) return { k: 'wait', label: '요청 대기', text: next ? '다음 ' + next.start + '–' + next.end : '오늘 남은 예약 없음' };
  return { k: 'free', label: '비어 있음', text: count ? (next ? '다음 ' + next.start + '–' + next.end : '오늘 예약 ' + count + '건') : '오늘 예약 없음' };
}

function myBookings() {
  if (!S.user) return [];
  return S.bookings.filter(b => b.acct === S.user.acct);
}
function pendingAll() {
  return S.bookings.filter(b => b.status === 'pending');
}
function monthDayShort(s) { return (+s.slice(5, 7)) + '/' + (+s.slice(8, 10)); }

/* ================= 화면 조각 ================= */
function dayStrip(date, act) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(i));
  return '<div class="days">' + days.map(s => {
    const on = s === date;
    return '<button type="button" class="day' + (on ? ' on' : '') + (s === todayStr() ? ' today' : '') + '" data-act="' + act + '" data-date="' + s + '">'
      + '<small>' + (s === todayStr() ? '오늘' : dayName(s)) + '</small><b>' + (+s.slice(8)) + '</b></button>';
  }).join('') + '</div>';
}

function timeline(list, opts) {
  const mini = !!(opts && opts.mini);
  const date = (opts && opts.date) || S.date;
  const bars = list.map(b => {
    const l = Math.max(0, (toMin(b.start) - DAY_START) / SPAN * 100);
    const w = Math.max(0.8, (toMin(b.end) - toMin(b.start)) / SPAN * 100);
    return '<i class="tl-bar ' + (b.status === 'pending' ? 'pending' : '') + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></i>';
  }).join('');
  const t = nowMin();
  const showNow = date === todayStr() && t >= DAY_START && t <= DAY_END;
  const nowLine = (!mini && showNow) ? '<i class="tl-now" style="left:' + ((t - DAY_START) / SPAN * 100).toFixed(2) + '%"></i>' : '';
  if (mini) return '<div class="tl mini">' + bars + '</div>';
  return '<div class="tl-wrap"><div class="tl">' + bars + nowLine + '</div>'
    + '<div class="tl-ticks"><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>23</span></div>'
    + '<div class="tl-legend"><span><i class="a"></i>승인</span><span><i class="p"></i>요청중</span><span><i class="n"></i>현재 시각</span></div></div>';
}

function statusPill(b) {
  return '<span class="pill ' + b.status + '">' + STATUS[b.status] + '</span>';
}

function bkgCard(b, opts) {
  const o = opts || {};
  const room = roomOf(b.roomId);
  const mine = S.user && b.acct === S.user.acct;
  const dim = b.status === 'rejected' || b.status === 'cancelled';
  let h = '<article class="bkg' + (mine ? ' mine' : '') + (dim ? ' dim' : '') + '">';
  if (o.showRoom) h += '<div class="bkg-room">' + esc(churchName(b.church)) + ' · ' + esc(room ? room.floor : '') + ' · ' + esc(b.roomName || (room && room.name) || '') + '</div>';
  h += '<div class="bkg-top"><span class="bkg-time">' + b.start + '–' + b.end + '</span>'
    + '<span class="bkg-who">' + esc(b.name || '') + (b.giTag ? ' · ' + esc(b.giTag) : '') + '</span>'
    + statusPill(b) + '</div>';
  h += '<div class="bkg-reason">' + esc(b.reason || '') + '</div>';
  h += '<div class="bkg-meta"><span>' + peopleText(b.people) + '</span><span>·</span><span>' + dateLabel(b.date) + '</span>' + (mine ? '<span class="badge">내 예약</span>' : '') + '</div>';
  if (b.rejectReason) h += '<div class="bkg-note">거절 사유 · ' + esc(b.rejectReason) + '</div>';
  const acts = [];
  if (o.admin && b.status === 'pending') {
    acts.push('<button class="btn ok sm" type="button" data-act="approve" data-id="' + b.id + '">승인</button>');
    acts.push('<button class="btn danger sm" type="button" data-act="rejectOpen" data-id="' + b.id + '">거절</button>');
  } else if (o.admin && b.status === 'approved') {
    acts.push('<button class="btn ghost sm" type="button" data-act="adminCancel" data-id="' + b.id + '">승인 취소</button>');
  } else if (!o.admin && mine && (b.status === 'pending' || b.status === 'approved')) {
    acts.push('<button class="btn ghost sm" type="button" data-act="myCancel" data-id="' + b.id + '">' + (b.status === 'pending' ? '요청 취소' : '예약 취소') + '</button>');
  }
  if (acts.length) h += '<div class="acts">' + acts.join('') + '</div>';
  return h + '</article>';
}

/* ================= 인증 화면 ================= */
function authView() {
  const tab = S.authTab;
  let h = '<div class="auth">';
  h += '<div class="auth-mark">🏛</div>';
  h += '<h1>실 <em>예약</em></h1>';
  h += '<p class="lead">세종월드교회 · 대전자성교회의 모임 공간을<br>한눈에 보고, 원하는 시간에 신청하세요.</p>';
  h += '<div class="body">';
  h += '<div class="seg"><button type="button" class="' + (tab === 'login' ? 'on' : '') + '" data-act="authTab" data-tab="login">로그인</button>'
    + '<button type="button" class="' + (tab === 'signup' ? 'on' : '') + '" data-act="authTab" data-tab="signup">처음이에요</button></div>';

  if (tab === 'login') {
    h += '<label class="field" style="margin-top:0"><span>아이디</span><input class="input" id="lid" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="영문·숫자·한글 2~16자"></label>';
    h += '<label class="field"><span>비밀번호</span><input class="input" id="lpw" type="password" autocomplete="current-password" placeholder="4자 이상"></label>';
    h += '<button class="btn primary block" type="button" data-act="login">들어가기</button>';
    h += '<p class="hint" id="authMsg" style="text-align:center"></p>';
  } else {
    h += '<label class="field" style="margin-top:0"><span>아이디</span><input class="input" id="sid" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="영문·숫자·한글 2~16자"></label>';
    h += '<label class="field"><span>비밀번호</span><input class="input" id="spw" type="password" autocomplete="new-password" placeholder="4자 이상"></label>';
    h += '<label class="field"><span>이름</span><input class="input" id="sname" placeholder="예: 이태웅"></label>';
    h += '<label class="field"><span>나이</span><input class="input" id="sage" type="number" inputmode="numeric" min="1" max="120" placeholder="숫자만 (예: 29)"></label>';
    h += '<div class="signup-preview" id="signupPreview">나이를 적으면 기수와 부서가 자동으로 정해져요.</div>';
    h += '<div class="field"><span>주로 쓰는 교회</span><div class="seg" style="margin:0">'
      + CHURCH_ORDER.map(c => '<button type="button" class="' + (S.church === c ? 'on' : '') + '" data-act="signupChurch" data-church="' + c + '">' + CHURCHES[c].name + '</button>').join('')
      + '</div></div>';
    h += '<button class="btn primary block" type="button" data-act="signup">가입하고 시작하기</button>';
    h += '<p class="hint" id="authMsg" style="text-align:center"></p>';
  }
  h += '</div>';
  h += '<div class="foot">예약 요청은 관리자가 확인한 뒤 승인됩니다.<br>세종월드교회 · 대전자성교회</div>';
  return h + '</div>';
}

function previewText(age) {
  const a = Number(age) || 0;
  if (!a) return '나이를 적으면 기수와 부서가 자동으로 정해져요.';
  if (a >= 37) return '<b>' + a + '세</b> · 청년처 (기수 표시 없이 나이로 보여요)';
  const p = profileOf(a);
  return '<b>' + p.gi + '기</b> · ' + p.dept + ' <span class="muted">(' + a + '세)</span>';
}

/* ================= 홈 ================= */
function homeView() {
  const rooms = roomsOf(S.church);
  const floors = floorsOf(S.church);
  const free = rooms.filter(r => roomState(r).k === 'free').length;
  const todayApproved = S.bookings.filter(b => b.date === todayStr() && b.status === 'approved' && b.church === S.church);
  const pending = S.bookings.filter(b => b.status === 'pending' && b.church === S.church);
  const mine = myBookings().filter(b => b.status === 'approved' && b.date >= todayStr());

  let h = '<div class="seg">' + CHURCH_ORDER.map(c =>
    '<button type="button" class="' + (S.church === c ? 'on' : '') + '" data-act="church" data-church="' + c + '">' + CHURCHES[c].name + '</button>').join('') + '</div>';

  h += '<section class="hero"><span class="h-kicker">ROOM RESERVATION</span>'
    + '<b>오늘 ' + free + '개 실이 비어 있어요</b>'
    + '<p>' + esc(CHURCHES[S.church].name) + ' · ' + dateLabel(todayStr()) + '</p>'
    + '<div class="hero-row"><span class="hero-chip">오늘 승인 <b>' + todayApproved.length + '</b></span>'
    + '<span class="hero-chip">요청 대기 <b>' + pending.length + '</b></span>'
    + '<span class="hero-chip">내 예약 <b>' + mine.length + '</b></span></div></section>';

  h += '<div class="chips">' + ['all'].concat(floors).map(f =>
    '<button type="button" class="chip ' + (S.floor === f ? 'on' : '') + '" data-act="floor" data-floor="' + esc(f) + '">' + (f === 'all' ? '전체' : esc(f)) + '</button>').join('') + '</div>';

  const shown = floors.filter(f => S.floor === 'all' || S.floor === f);
  shown.forEach(f => {
    const list = rooms.filter(r => r.floor === f);
    h += '<div class="floor-head"><b>' + esc(f) + '</b><span class="line"></span><em>' + list.length + '개 실</em></div>';
    list.forEach(r => {
      const st = roomState(r);
      const todayList = busyOf(S.bookings, r.id, todayStr());
      h += '<button type="button" class="room-card" data-act="openRoom" data-id="' + r.id + '">'
        + '<div class="room-top"><span class="room-name">' + esc(r.name) + '</span><span class="pill ' + st.k + '">' + st.label + '</span></div>'
        + '<div class="room-meta"><span>' + esc(r.floor) + '</span><span class="dot"></span><span>' + st.text + '</span></div>'
        + (todayList.length ? '<div class="room-mini">' + timeline(todayList, { mini: true }) + '</div>' : '')
        + '</button>';
    });
  });
  h += '<p class="note">실을 누르면 날짜별 예약 현황과 <b>예약 요청</b>을 볼 수 있어요. 겹치는 시간은 미리 막아 둡니다.</p>';
  return h;
}

/* ================= 실 상세 ================= */
function roomView() {
  const room = roomOf(S.roomId);
  if (!room) return '<div class="empty"><b>실을 찾을 수 없어요</b></div>';
  const st = roomState(room, S.date);
  const list = busyOf(S.bookings, room.id, S.date);

  let h = '<section class="hero" style="margin-top:14px"><span class="h-kicker">' + esc(CHURCHES[room.church].name) + ' · ' + esc(room.floor) + '</span>'
    + '<b>' + esc(room.name) + '</b>'
    + '<p>' + (S.date === todayStr() ? '오늘' : dateLabel(S.date)) + ' 기준 · 승인된 예약과 요청중인 시간이 표시됩니다</p>'
    + '<div class="hero-row"><span class="pill ' + st.k + '">' + st.label + '</span>'
    + (list.length ? '<span class="hero-chip">이 날 예약 <b>' + list.filter(b => b.status === 'approved').length + '</b></span>' : '')
    + '</div></section>';

  h += dayStrip(S.date, 'day');
  h += '<div class="sec-title"><b>예약 현황</b><span>' + dateLabel(S.date) + '</span></div>';
  h += timeline(list, { date: S.date });

  if (!list.length) {
    h += '<div class="empty" style="padding:24px 20px 8px"><b>이 날은 예약이 없어요</b><span>비어 있는 시간에 요청해 보세요.</span></div>';
  } else {
    list.forEach(b => { h += bkgCard(b, { showRoom: false }); });
  }

  if (!S.admin) h += requestForm(room, list);
  else h += '<p class="note">관리자 모드입니다. 요청은 <b>관리자</b> 탭에서 승인·거절할 수 있어요.</p>';
  return h;
}

function requestForm(room, list) {
  const f = S.form;
  const s = toMin(f.start), e = toMin(f.end);
  let problem = '';
  if (!(e > s)) problem = '종료 시간은 시작 시간보다 늦어야 해요';
  else if (S.date === todayStr() && s < nowMin()) problem = '이미 지난 시간이에요. 지금 이후로 골라 주세요';
  else {
    const clash = list.find(b => spans(b, { start: f.start, end: f.end }));
    if (clash) problem = clash.status === 'approved'
      ? '이 시간에는 이미 승인된 예약이 있어요 (' + clash.start + '–' + clash.end + ')'
      : '이 시간에는 처리 중인 요청이 있어요 (' + clash.start + '–' + clash.end + ')';
  }
  const dur = e - s;

  let h = '<section class="panel"><div class="panel-head"><b>예약 요청</b><span>' + (dur > 0 ? (dur >= 60 ? Math.floor(dur / 60) + '시간' + (dur % 60 ? ' ' + (dur % 60) + '분' : '') : dur + '분') : '') + '</span></div>';

  h += '<div class="tpair">'
    + timeBox('시작', 'start', f.start)
    + timeBox('종료', 'end', f.end)
    + '</div>';
  if (S.pick) h += pickList(S.pick, list);

  h += '<label class="field"><span>모임 사유</span><input class="input" id="fReason" maxlength="40" placeholder="예: 청년3부 성경공부" value="' + esc(f.reason) + '"></label>';

  h += '<div class="field"><span>함께하는 인원 (본인 포함)</span><div class="stepper">'
    + '<button type="button" data-act="people" data-d="-1">−</button><b id="peopleN">' + f.people + '명</b><button type="button" data-act="people" data-d="1">+</button>'
    + '</div></div>';

  h += '<p class="hint ' + (problem ? 'warn' : '') + '">' + (problem ? esc(problem) : (S.user ? esc(giLine(S.user)) + '으로 요청돼요 · 관리자 승인 후 확정' : '관리자 승인 후 확정')) + '</p>';
  h += '<button class="btn primary block" type="button" data-act="submit"' + (problem ? ' disabled' : '') + '>이 시간으로 요청하기</button>';
  return h + '</section>';
}

function timeBox(label, key, value) {
  const open = S.pick === key;
  return '<button type="button" class="timebox ' + (open ? 'open' : '') + '" data-act="pick" data-key="' + key + '">'
    + '<small>' + label + '</small><span class="tv">' + value + '<i>' + (open ? '▲' : '▼') + '</i></span></button>';
}

function pickList(key, list) {
  const f = S.form;
  const s = toMin(f.start);
  const out = [];
  if (key === 'start') {
    for (let m = DAY_START; m <= LAST_START; m += 30) {
      const past = S.date === todayStr() && m <= nowMin();
      const clash = list.find(b => toMin(b.start) <= m && m < toMin(b.end));
      out.push({ t: fmt(m), label: fmt(m), dis: past || !!clash, why: clash ? (clash.status === 'approved' ? '예약 있음' : '요청중') : (past ? '지난 시간' : '') });
    }
  } else {
    for (let m = s + 30; m <= DAY_END; m += 30) {
      const clash = list.find(b => toMin(b.start) < m && s < toMin(b.end));
      out.push({ t: fmt(m), label: fmt(m), dis: !!clash, why: clash ? (clash.status === 'approved' ? '예약 있음' : '요청중') : '' });
    }
  }
  return '<div class="tlist">' + out.map(o =>
    '<button type="button" class="trow ' + (o.t === f[key] ? 'on' : '') + '" data-act="setTime" data-key="' + key + '" data-t="' + o.t + '"' + (o.dis ? ' disabled' : '') + '>'
    + '<span>' + o.label + '</span>' + (o.why ? '<em>' + o.why + '</em>' : (o.t === f[key] ? '<b>✓</b>' : '')) + '</button>').join('') + '</div>';
}

async function doLogin() {
  const id = acctOf($('#lid') && $('#lid').value);
  const pw = ($('#lpw') && $('#lpw').value) || '';
  const msg = $('#authMsg');
  const p1 = acctProblem(id); const p2 = pwProblem(pw);
  if (p1 || p2) { if (msg) { msg.textContent = p1 || p2; msg.classList.add('warn'); } return; }
  const btn = document.querySelector('[data-act="login"]');
  if (btn) btn.disabled = true;
  if (msg) { msg.textContent = '확인 중…'; msg.classList.remove('warn'); }
  try {
    const snap = await getDoc(doc(db, COLL.members, id));
    if (!snap.exists()) throw new Error('id');
    const d = snap.data();
    const hash = await pwHashOf(id, d.salt, pw);
    if (hash !== d.hash) throw new Error('pw');
    S.user = {
      acct: id, name: d.name || '', age: Number(d.age) || 0,
      gi: Number(d.gi) || 0, dept: d.dept || '', senior: !!d.senior, church: d.church || 'sejong'
    };
    S.church = d.church || 'sejong';
    saveSession();
    startLive();
    go('home');
    toast(d.name + '님 반갑습니다');
  } catch (e) {
    if (msg) { msg.textContent = '아이디 또는 비밀번호가 맞지 않아요'; msg.classList.add('warn'); }
    if (btn) btn.disabled = false;
  }
}

async function doSignup() {
  const id = acctOf($('#sid') && $('#sid').value);
  const pw = ($('#spw') && $('#spw').value) || '';
  const name = (($('#sname') && $('#sname').value) || '').trim();
  const age = Number(($('#sage') && $('#sage').value) || 0);
  const msg = $('#authMsg');
  const err = acctProblem(id) || pwProblem(pw) || (!name ? '이름을 적어 주세요' : '') || (!age || age < 1 || age > 120 ? '나이를 숫자로 적어 주세요' : '');
  if (err) { if (msg) { msg.textContent = err; msg.classList.add('warn'); } return; }
  const btn = document.querySelector('[data-act="signup"]');
  if (btn) btn.disabled = true;
  if (msg) { msg.textContent = '가입 중…'; msg.classList.remove('warn'); }
  try {
    const ref = doc(db, COLL.members, id);
    const snap = await getDoc(ref);
    if (snap.exists()) { if (msg) { msg.textContent = '이미 쓰고 있는 아이디예요'; msg.classList.add('warn'); } if (btn) btn.disabled = false; return; }
    const salt = newSalt();
    const p = profileOf(age);
    const data = {
      acct: id, name, age, gi: p.gi, dept: p.dept, senior: p.senior,
      salt, hash: await pwHashOf(id, salt, pw), church: S.church,
      createdAt: Date.now(), updatedAt: Date.now()
    };
    await setDoc(ref, data);
    S.user = { acct: id, name, age, gi: p.gi, dept: p.dept, senior: p.senior, church: S.church };
    saveSession();
    startLive();
    go('home');
    toast(name + '님, 가입했어요');
  } catch (e) {
    console.warn(e);
    if (msg) { msg.textContent = '가입하지 못했어요. 잠시 뒤 다시 해 주세요'; msg.classList.add('warn'); }
    if (btn) btn.disabled = false;
  }
}

async function submitRequest() {
  if (!S.user) return;
  const room = roomOf(S.roomId);
  const f = S.form;
  const reason = (f.reason || '').trim();
  if (!reason) { toast('모임 사유를 적어 주세요'); const el = $('#fReason'); if (el) el.focus(); return; }
  if (toMin(f.end) <= toMin(f.start)) { toast('종료 시간을 다시 골라 주세요'); return; }
  if (S.date === todayStr() && toMin(f.start) < nowMin()) { toast('이미 지난 시간이에요'); return; }

  const btn = document.querySelector('[data-act="submit"]');
  if (btn) btn.disabled = true;
  try {
    /* 최신 상태로 한 번 더 겹침 확인 (다른 사람이 방금 요청했을 수 있어요) */
    const snap = await getDocs(query(collection(db, COLL.bookings), where('date', '==', S.date)));
    const fresh = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    const clash = fresh.filter(b => b.roomId === room.id && isLive(b) && spans(b, { start: f.start, end: f.end }));
    if (clash.length) {
      toast('방금 다른 예약이 들어왔어요. 시간을 다시 골라 주세요');
      if (btn) btn.disabled = false;
      return;
    }
    const me = S.user;
    await addDoc(collection(db, COLL.bookings), {
      church: room.church, roomId: room.id, roomName: room.name, floor: room.floor,
      date: S.date, start: f.start, end: f.end, people: Number(f.people) || 1,
      reason, acct: me.acct, name: me.name, gi: me.gi || 0, dept: me.dept || '',
      giTag: giLine(me), status: 'pending',
      createdAt: Date.now(), updatedAt: Date.now()
    });
    S.form = { start: '10:00', end: '11:00', people: 2, reason: '' };
    S.pick = null;
    go('my');
    toast('요청을 보냈어요. 관리자 승인을 기다려 주세요');
  } catch (e) {
    console.warn(e);
    toast('요청을 보내지 못했어요. 잠시 뒤 다시 해 주세요');
    if (btn) btn.disabled = false;
  }
}

/* PIN */
let pinBuf = '';
function pinRender() {
  const dots = document.querySelectorAll('#pinDots i');
  dots.forEach((d, i) => d.classList.toggle('on', i < pinBuf.length));
}
async function pinPush(k) {
  if (k === 'clear') { pinBuf = ''; pinRender(); return; }
  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); pinRender(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k;
  pinRender();
  if (pinBuf.length === 4) {
    const msg = $('#pinMsg');
    msg.classList.remove('warn');
    msg.textContent = '확인 중…';
    const ok = await checkPin(pinBuf);
    if (ok) {
      S.admin = true;
      try { sessionStorage.setItem(AKEY, '1'); } catch (e) { }
      pinBuf = '';
      pinRender();
      closeAllSheets();
      msg.textContent = '관리자 PIN을 눌러 주세요';
      go('admin');
      toast('관리자 모드로 들어왔어요');
    } else {
      pinBuf = '';
      pinRender();
      msg.textContent = 'PIN이 맞지 않아요';
      msg.classList.add('warn');
    }
  }
}

/* ================= 이벤트 ================= */
document.addEventListener('click', async e => {
  const pinBtn = e.target.closest('[data-pin]');
  if (pinBtn) { pinPush(pinBtn.dataset.pin); return; }

  const rj = e.target.closest('[data-reject]');
  if (rj) {
    const t = $('#rejectText');
    if (t) t.value = rj.dataset.reject;
    document.querySelectorAll('#rejectChips .chip').forEach(c => c.classList.toggle('on', c === rj));
    return;
  }

  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;

  if (a === 'closeSheet') { closeAllSheets(); return; }
  if (a === 'authTab') { S.authTab = b.dataset.tab; render(); return; }
  if (a === 'signupChurch') { S.church = b.dataset.church; render(); return; }
  if (a === 'login') { doLogin(); return; }
  if (a === 'signup') { doSignup(); return; }

  if (a === 'church') { S.church = b.dataset.church; S.floor = 'all'; saveSession(); render(); return; }
  if (a === 'floor') { S.floor = b.dataset.floor; render(); return; }
  if (a === 'tab') {
    const t = b.dataset.tab;
    if (t === 'admin' && !S.admin) { pinBuf = ''; pinRender(); $('#pinMsg').textContent = '관리자 PIN을 눌러 주세요'; openSheet('sheetPin'); return; }
    go(t); return;
  }
  if (a === 'goAdmin') { go('admin'); return; }
  if (a === 'openRoom') {
    const id = b.dataset.id;
    S.roomId = id; S.view = 'room'; S.date = todayStr(); S.pick = null;
    S.form = { start: '10:00', end: '11:00', people: 2, reason: '' };
    render();
    const m = document.querySelector('.main'); if (m) m.scrollTop = 0;
    return;
  }
  if (a === 'back') {
    if (S.view === 'room') { S.view = 'home'; S.roomId = null; render(); }
    else go('home');
    return;
  }
  if (a === 'day') { S.date = b.dataset.date; S.pick = null; render(); return; }
  if (a === 'adminDay') { S.adminDate = b.dataset.date; render(); return; }
  if (a === 'adminChurch') { S.adminChurch = b.dataset.church; render(); return; }
  if (a === 'adminStatus') { S.adminStatus = b.dataset.status; render(); return; }

  if (a === 'pick') { S.pick = S.pick === b.dataset.key ? null : b.dataset.key; render(); return; }
  if (a === 'setTime') {
    const k = b.dataset.key, t = b.dataset.t;
    S.form[k] = t;
    if (k === 'start' && toMin(S.form.end) <= toMin(t)) {
      S.form.end = fmt(Math.min(DAY_END, toMin(t) + 60));
    }
    S.pick = null; render(); return;
  }
  if (a === 'people') {
    const d = Number(b.dataset.d);
    S.form.people = Math.max(1, Math.min(99, (Number(S.form.people) || 1) + d));
    render(); return;
  }
  if (a === 'submit') { submitRequest(); return; }

  if (a === 'approve') {
    const id = b.dataset.id;
    const bk = S.bookings.find(x => x.id === id);
    if (bk) {
      const fresh = S.bookings.filter(x => x.id !== id && x.roomId === bk.roomId && x.date === bk.date && x.status === 'approved' && spans(x, bk));
      if (fresh.length) { toast('같은 시간에 이미 승인된 예약이 있어요'); return; }
    }
    setStatus(id, 'approved'); return;
  }
  if (a === 'rejectOpen') { openReject(b.dataset.id); return; }
  if (a === 'doReject') {
    const reason = (($('#rejectText') && $('#rejectText').value) || '').trim() || '관리자 판단으로 거절';
    const id = rejectId;
    closeAllSheets();
    if (id) setStatus(id, 'rejected', { rejectReason: reason });
    return;
  }
  if (a === 'adminCancel') {
    const id = b.dataset.id;
    askConfirm('승인을 취소할까요?', '이 예약은 취소로 바뀌고 성도 화면에도 바로 반영됩니다.', '승인 취소', () => setStatus(id, 'cancelled', { cancelledBy: 'admin' }));
    return;
  }
  if (a === 'myCancel') {
    const id = b.dataset.id;
    const bk = S.bookings.find(x => x.id === id);
    askConfirm(bk && bk.status === 'pending' ? '요청을 취소할까요?' : '예약을 취소할까요?', (bk ? bk.roomName + ' · ' + bk.start + '–' + bk.end + '\n' : '') + '취소하면 되돌릴 수 없어요.', '취소하기', () => setStatus(id, 'cancelled', { cancelledBy: 'user' }));
    return;
  }
  if (a === 'doConfirm') { closeAllSheets(); const fn = confirmAction; confirmAction = null; if (fn) fn(); return; }

  if (a === 'openPin') { pinBuf = ''; pinRender(); $('#pinMsg').textContent = '관리자 PIN을 눌러 주세요'; openSheet('sheetPin'); return; }
  if (a === 'openPinChange') {
    $('#newPin1').value = ''; $('#newPin2').value = ''; $('#pinChangeMsg').textContent = '';
    openSheet('sheetPinChange'); return;
  }
  if (a === 'doPinChange') {
    const p1 = ($('#newPin1').value || '').trim();
    const p2 = ($('#newPin2').value || '').trim();
    const msg = $('#pinChangeMsg');
    if (!/^\d{4}$/.test(p1)) { msg.textContent = '숫자 4자리로 정해 주세요'; msg.classList.add('warn'); return; }
    if (p1 !== p2) { msg.textContent = '두 번 넣은 PIN이 달라요'; msg.classList.add('warn'); return; }
    try {
      await savePin(p1);
      closeAllSheets();
      toast('관리자 PIN을 바꿨어요');
    } catch (e) {
      msg.textContent = '저장하지 못했어요. 잠시 뒤 다시 해 주세요'; msg.classList.add('warn');
    }
    return;
  }
  if (a === 'adminExit') {
    S.admin = false;
    try { sessionStorage.removeItem(AKEY); } catch (e) { }
    toast('관리자 모드를 끝냈어요');
    go('home');
    return;
  }
  if (a === 'logout') {
    askConfirm('로그아웃할까요?', '다음에 같은 아이디로 다시 들어올 수 있어요.', '로그아웃', () => {
      clearSession(); S.user = null; S.admin = false; S.bookings = [];
      if (unsubBookings) { try { unsubBookings(); } catch (e) { } }
      S.authTab = 'login'; render();
    });
    return;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'fReason') { S.form.reason = t.value; return; }
  if (t.id === 'sage') {
    const box = $('#signupPreview');
    if (box) box.innerHTML = previewText(t.value);
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!S.user) {
    if (e.target.id === 'lid' || e.target.id === 'lpw') { e.preventDefault(); doLogin(); }
  } else if (e.target.id === 'fReason') { e.target.blur(); }
});

/* 확대·이중 탭 방지 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTap = 0;
document.addEventListener('touchend', e => {
  const n = Date.now();
  if (n - lastTap < 320 && !e.target.closest('input,textarea,select,.tlist')) e.preventDefault();
  lastTap = n;
}, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ================= 시작 ================= */
(async function boot() {
  const adminQ = /(\?|&)admin=1/.test(location.search);
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { }
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { }

  if (sess && sess.acct) {
    /* 세션이 있으면 회원 문서로 프로필을 새로 읽어 옵니다 */
    try {
      const snap = await getDoc(doc(db, COLL.members, sess.acct));
      if (snap.exists()) {
        const d = snap.data();
        S.user = { acct: sess.acct, name: d.name || '', age: Number(d.age) || 0, gi: Number(d.gi) || 0, dept: d.dept || '', senior: !!d.senior, church: d.church || 'sejong' };
        S.church = d.church || sess.church || 'sejong';
      } else if (cached && cached.acct === sess.acct) {
        S.user = cached; S.church = sess.church || cached.church || 'sejong';
      }
    } catch (e) {
      if (cached && cached.acct === sess.acct) { S.user = cached; S.church = sess.church || cached.church || 'sejong'; }
    }
  }

  try { S.admin = sessionStorage.getItem(AKEY) === '1'; } catch (e) { }

  if (S.user) {
    startLive();
    const h = (location.hash || '').replace('#', '');
    S.view = ['home', 'my', 'admin', 'settings'].includes(h) ? h : 'home';
    if (S.view === 'admin' && !S.admin) S.view = 'home';
    render();
    if (adminQ && !S.admin) { pinBuf = ''; pinRender(); openSheet('sheetPin'); }
  } else {
    render();
  }
})();
</script>
