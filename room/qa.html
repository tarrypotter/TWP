<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실 예약 · 모바일 확인</title>
<style>
  html,body{margin:0;background:#1a1d1e;font:13px/1.4 -apple-system,system-ui,sans-serif;color:#8b9895}
  .wrap{display:flex;gap:24px;padding:20px;align-items:flex-start;justify-content:center}
  .col{display:flex;flex-direction:column;gap:8px;align-items:center}
  .cap{font-size:11px;letter-spacing:.08em}
  iframe{border:0;width:390px;height:844px;background:#07090a;border-radius:22px;box-shadow:0 30px 60px -30px #000}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  const p = new URLSearchParams(location.search);
  const v = p.get('v') || 'guest';
  const src = v === 'admin' ? './index.html?admin=1#admin' : './index.html';
  document.getElementById('wrap').innerHTML =
    '<div class="col"><span class="cap">390 × 844 · ' + v + '</span><iframe id="fr" src="' + src + '"></iframe></div>';
</script>
</body>
</html>
