<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실 예약 · 모바일 확인</title>
<style>
  html,body{margin:0;background:#141718}
  .wrap{display:flex;justify-content:center;padding:14px}
  iframe{border:0;width:390px;height:844px;background:#07090a;border-radius:22px;box-shadow:0 30px 60px -30px #000}
</style>
</head>
<body>
<div class="wrap"><iframe id="fr" title="실 예약 미리보기" src="./qa-frame.html"></iframe></div>
<script>
  const p = new URLSearchParams(location.search);
  const v = p.get('v') || 'home';
  const q = v === 'jaseong' ? '?temple=jaseong' : '';
  const h = v === 'admin' ? '#admin' : (v === 'settings' ? '#settings' : '');
  document.getElementById('fr').src = './qa-frame.html' + q + h;
</script>
</body>
</html>
