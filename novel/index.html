var DEFAULTS={uiTheme:'auto',theme:'cream',font:'serif',fs:18,lh:1.9,margin:22,chrome:false,seen:false};
var SET=Object.assign({},DEFAULTS);
function loadSettings(){
  try{ var raw=JSON.parse(localStorage.getItem(SET_KEY)||'{}'); SET=Object.assign({},DEFAULTS,raw||{}); }catch(e){ SET=Object.assign({},DEFAULTS); }
}
function saveSettings(){
  try{ localStorage.setItem(SET_KEY,JSON.stringify(SET)); }catch(e){}
}
function resolvedUiTheme(){
  if(SET.uiTheme==='dark') return 'dark';
  if(SET.uiTheme==='light') return 'light';
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light';
}
function applyUiTheme(){
  var t=resolvedUiTheme();
  document.documentElement.setAttribute('data-theme',t);
  var meta=$('#metaTheme'); if(meta) meta.setAttribute('content', t==='dark'?'#0C0C0D':'#F1ECE2');
}
if(window.matchMedia){
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(SET.uiTheme==='auto') applyUiTheme(); }); }catch(e){}
}

/* ---------------- storage (IndexedDB with memory fallback) ---------------- */
var DB_NAME='abyssal-grimoire', DB_VER=1, STORES=['works','progress','marks','bookmarks','shelf','ratings','sessions'];
var _dbp=null, _mem=null;

function memStore(){
  if(_mem) return _mem;
  _mem={};
  STORES.forEach(function(s){ _mem[s]=new Map(); });
  return _mem;
}
function idbOpen(){
  if(_dbp) return _dbp;
  _dbp=new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('no-idb')); return; }
    var r;
    try{ r=indexedDB.open(DB_NAME,DB_VER); }catch(e){ rej(e); return; }
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains('works')) db.createObjectStore('works',{keyPath:'id'});
      if(!db.objectStoreNames.contains('progress')) db.createObjectStore('progress',{keyPath:'workId'});
      if(!db.objectStoreNames.contains('marks')){ var m=db.createObjectStore('marks',{keyPath:'id'}); m.createIndex('workId','workId'); }
      if(!db.objectStoreNames.contains('bookmarks')){ var b=db.createObjectStore('bookmarks',{keyPath:'id'}); b.createIndex('workId','workId'); }
      if(!db.objectStoreNames.contains('shelf')) db.createObjectStore('shelf',{keyPath:'workId'});
      if(!db.objectStoreNames.contains('ratings')) db.createObjectStore('ratings',{keyPath:'workId'});
      if(!db.objectStoreNames.contains('sessions')){ var s=db.createObjectStore('sessions',{keyPath:'id',autoIncrement:true}); s.createIndex('date','date'); }
    };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error||new Error('idb-open-failed')); };
    r.onblocked=function(){ rej(new Error('idb-blocked')); };
  }).catch(function(e){ console.warn('[AG] IndexedDB unavailable, using memory store',e); return null; });
  return _dbp;
}
function wrap(req){ return new Promise(function(res,rej){ req.onsuccess=function(){res(req.result)}; req.onerror=function(){rej(req.error)}; }); }

var DB={
  ready:function(){ return idbOpen(); },
  all:function(store){
    return idbOpen().then(function(db){
      if(!db) return Array.from(memStore()[store].values());
      return wrap(db.transaction(store,'readonly').objectStore(store).getAll());
    });
  },
  get:function(store,key){
    return idbOpen().then(function(db){
      if(!db) return memStore()[store].get(key);
      return wrap(db.transaction(store,'readonly').objectStore(store).get(key));
    });
  },
  put:function(store,val){
    return idbOpen().then(function(db){
      if(!db){ var k=val.workId||val.id; memStore()[store].set(k,val); return val; }
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readwrite');
        t.objectStore(store).put(val);
        t.oncomplete=function(){ res(val); };
        t.onerror=function(){ rej(t.error); };
      });
    });
  },
  del:function(store,key){
    return idbOpen().then(function(db){
      if(!db){ memStore()[store].delete(key); return; }
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readwrite'); t.objectStore(store).delete(key);
        t.oncomplete=function(){res()}; t.onerror=function(){rej(t.error)};
      });
    });
  },
  clear:function(store){
    return idbOpen().then(function(db){
      if(!db){ memStore()[store].clear(); return; }
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readwrite'); t.objectStore(store).clear();
        t.oncomplete=function(){res()}; t.onerror=function(){rej(t.error)};
      });
    });
  },
  bulk:function(store,arr){
    return idbOpen().then(function(db){
      if(!db){ arr.forEach(function(v){ memStore()[store].set(v.workId||v.id,v); }); return; }
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readwrite'), os=t.objectStore(store);
        arr.forEach(function(v){ os.put(v); });
        t.oncomplete=function(){res()}; t.onerror=function(){rej(t.error)};
      });
    });
  }
};

  $('#toastTxt').textContent=msg;

/* ---------------- dialog ---------------- */
var _dlgInst=null;
function dlgEl(){ return $('#dlg'); }
function dialog(opts){
  return new Promise(function(resolve){
    var d=$('#dlg'), body=$('#dlgBody'), foot=$('#dlgFoot');
    body.innerHTML=
      (opts.kicker?'<div class="m-k">'+esc(opts.kicker)+'</div>':'')+
      (opts.title?'<div class="m-t">'+esc(opts.title)+'</div>':'')+
      (opts.sub?'<div class="m-s">'+esc(opts.sub)+'</div>':'')+
      (opts.body||'');
    foot.innerHTML=
      '<button class="btn-line" data-dlg="0">'+esc(opts.cancel||'취소')+'</button>'+
      '<button class="'+(opts.danger?'btn-blood':'btn-ink')+'" data-dlg="1">'+esc(opts.ok||'확인')+'</button>';
    var settled=false;
    function done(v){ if(settled) return; settled=true; resolve(v); }
    foot.querySelector('[data-dlg="0"]').onclick=function(){ done(null); _dlgInst && _dlgInst.hide(); };
    foot.querySelector('[data-dlg="1"]').onclick=function(){
      var val = opts.onOk ? opts.onOk(body) : true;
      if(val===false) return;
      done(val===undefined?true:val);
      _dlgInst && _dlgInst.hide();
    };
    d.addEventListener('hidden.bs.modal',function once(){ d.removeEventListener('hidden.bs.modal',once); done(null); },{once:true});
    _dlgInst = _dlgInst || new bootstrap.Modal(d,{backdrop:true,keyboard:true});
    _dlgInst.show();
    setTimeout(function(){
      var f=body.querySelector('textarea,input'); if(f){ try{ f.focus(); }catch(e){} }
    },260);
  });
}
function confirmBox(title,sub,okLabel,danger){
  return dialog({kicker:'확인',title:title,sub:sub,ok:okLabel||'확인',cancel:'취소',danger:!!danger}).then(function(v){ return !!v; });
}

function coverHTML(w,opts){
  opts=opts||{};

  var raw=String(c.mark||'');
  var mark=esc(raw);
  var n=Array.from(raw).length||1;
  var size = n<=1?46 : n===2?32 : n===3?23 : n===4?19 : 15;
  var style='background:'+esc(c.bg||'#333')+';color:'+esc(c.fg||'#fff');
  var cls='cov '+(c.motif?('m-'+c.motif):'');
  var inner='<i class="cov-frame"></i>'+
    '<div class="cov-kick">'+esc((w.genre||'')+(opts.tagExtra?' · '+opts.tagExtra:''))+'</div>'+
    '<div class="cov-mark'+(c.vert?' vert':'')+'" style="font-size:'+size+'cqw">'+mark+'</div>';
  if(opts.title!==false){ inner+='<div class="cov-auth">'+esc(w.author||'')+'</div>'; }
  return '<div class="'+cls+'" style="'+style+'">'+inner+'</div>';
}

/* ---------------- zipper: safe area / zoom lock ---------------- */
function hardenViewport(){
  // iOS ignores user-scalable=no; block pinch & double-tap zoom explicitly.
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
  document.addEventListener('wheel',function(e){ if(e.ctrlKey) e.preventDefault(); },{passive:false});
  document.addEventListener('dblclick',function(e){
    if(e.target.closest('input,textarea,.r-body')) return;
    e.preventDefault();
  },{passive:false});
  var lastTouchEnd=0;
  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-lastTouchEnd<=320 && e.touches.length===0){
      var t=e.target;
      if(t && !t.closest('input,textarea,select,.r-body')) e.preventDefault();
    }
    lastTouchEnd=now;
  },{passive:false});
  document.addEventListener('touchstart',function(e){
    if(e.touches.length>1 && !e.target.closest('.r-body')) e.preventDefault();
  },{passive:false});
}

var MOODS=['전체','서늘함','웃김','뭉클함','기묘함','따뜻함'];
var SORTS=['인기','최신','최근 읽은'];

/* ---------------- helpers ---------------- */
function progressOf(id){ return S.progress[id]||null; }
function percentOf(id){ var p=progressOf(id); return p?clamp(Math.round(p.percent||0),0,100):0; }
function isFav(id){ return !!(S.shelf[id] && S.shelf[id].favorite); }
function favCount(w){ return (w.likes||0) + (isFav(w.id)?1:0); }
function ratingAvg(w){
  var base=(w.rating||0), bc=(w.ratingCount||0), mine=S.ratings[w.id];
  if(!mine) return {avg:base,count:bc,txt:bc?base.toFixed(1):'—'};
  var c=bc+1, a=(base*bc+mine.value)/c;
  return {avg:a,count:c,txt:a.toFixed(1)};
}
function lastReadable(){
  var best=null;
  Object.keys(S.progress).forEach(function(k){
    var p=S.progress[k]; if(!p || (p.percent||0)>=98) return;
    if(!best || (p.updatedAt||0) > (best.updatedAt||0)) best=p;
  });
  return best && AG.workById(best.workId) ? best : null;
}
function chapterLen(ch){
  var c=0; ch.paragraphs.forEach(function(p){ c+=plain(p).length; });
  return c;
}
function firstSentence(w){
  var p=w.chapters && w.chapters[0] && w.chapters[0].paragraphs[0] || '';
  p=plain(p);
  var m=p.match(/^(.{10,90}?[.?!”"])\s/);
  return m?m[1]:p.slice(0,88)+(p.length>88?'…':'');
}
function snippet(w,q){
  var ql=q.toLowerCase(), i;
  for(var ci=0;ci<w.chapters.length;ci++){
    var ps=w.chapters[ci].paragraphs;
    for(var pi=0;pi<ps.length;pi++){
      var t=plain(ps[pi]);
      i=t.toLowerCase().indexOf(ql);
      if(i>=0){
        var s=Math.max(0,i-26);
        return (s>0?'…':'')+hl(t.slice(s,s+64),q)+(t.length>s+64?'…':'');
      }
    }
  }
  return hl(w.blurb||'',q);
}
function hl(text,q){
  var e=esc(text); if(!q) return e;
  var qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return e.replace(new RegExp(qe,'gi'),function(m){ return '<mark>'+m+'</mark>'; }); }catch(err){ return e; }
}
function sortWorks(arr){
  var s=S.filter.sort;
  var out=arr.slice();
  if(s==='최신') out.sort(function(a,b){ return String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')); });
  else if(s==='최근 읽은') out.sort(function(a,b){
    var pa=progressOf(a.id), pb=progressOf(b.id);
    return (pb?(pb.updatedAt||0):0)-(pa?(pa.updatedAt||0):0) || b.reads-a.reads;
  });
  else out.sort(function(a,b){ return (b.reads||0)-(a.reads||0); });
  return out;
}
function filtered(){
  var f=S.filter;
  return sortWorks(S.works.filter(function(w){
    return (f.genre==='전체'||w.genre===f.genre) && (f.mood==='전체'||w.mood===f.mood);
  }));
}

function renderSearch(){
  var q=S.q.trim();
  var body=$('#searchBody');
  var clear=$('#qClear'); if(clear) clear.hidden=!q;
  if(!q){

    S.works.forEach(function(w){ (w.tags||[]).forEach(function(t){ tags[t]=(tags[t]||0)+1; }); });

/* ---------------- editor ---------------- */
function blankEditor(prompt){
  return {id:null,title:'',author:'@',genre:'미스터리',mood:'서늘함',blurb:'',pal:0,motif:'rule',
          chapters:[{title:'1장',text:prompt||''}]};
}
function openEditor(id,prompt){
  var w=id?AG.workById(id):null;
  if(w && !w.seed){
    S.editor={id:w.id,title:w.title,author:w.author,genre:w.genre,mood:w.mood,blurb:w.blurb,
      pal:palIndex(w.cover&&w.cover.bg), motif:(w.cover&&w.cover.motif)||'rule',
      chapters:w.chapters.map(function(c){ return {title:c.title, text:c.paragraphs.join('\n\n')}; })};
  }else{
    S.editor=blankEditor(prompt);
  }
  AG.views.go('editor');
}
function palIndex(bg){
  for(var i=0;i<PALETTES.length;i++) if(PALETTES[i].bg===bg) return i;
  return 0;
}
function renderEditor(){
  var e=S.editor; if(!e){ AG.views.go('studio',null,{replace:true}); return; }

      (e.chapters.length>1?'<button class="icobtn" data-delchap="'+i+'" aria-label="장 삭제"><svg><use href="#i-x"/></svg></button>':'')+
      '</div><input class="inp" data-field="ctitle" placeholder="장 제목" value="'+esc(c.title)+'" style="margin-bottom:8px">'+
      '<textarea class="ta" data-field="ctext" rows="7" placeholder="본문. 빈 줄로 문단을 나눕니다.">'+esc(c.text)+'</textarea>'+
      '<div class="counter">'+countChars(c.text)+'자 · '+countParas(c.text)+'문단</div></div>';

function countChars(t){ return plainLen(t); }
function plainLen(t){ return (t||'').replace(/\s+$/,'').length; }
function countParas(t){ return (t||'').split(/\n\s*\n/).filter(function(x){ return x.trim(); }).length; }
function totalChars(){ return S.editor.chapters.reduce(function(a,c){ return a+plainLen(c.text); },0); }
function bindEditor(){
  var e=S.editor;
  $('#edTitle').addEventListener('input',function(){ e.title=this.value; });
  $('#edAuthor').addEventListener('input',function(){ e.author=this.value||'@'; });
  $('#edGenre').addEventListener('change',function(){ e.genre=this.value; });
  $('#edMood').addEventListener('change',function(){ e.mood=this.value; });
  $('#edBlurb').addEventListener('input',function(){ e.blurb=this.value; });
  $$('#edPals .pal').forEach(function(b){
    b.addEventListener('click',function(){
      e.pal=+b.getAttribute('data-pal');
      $$('#edPals .pal').forEach(function(x){ x.classList.toggle('is-on',x===b); });
    });
  });
  $$('#edChaps [data-field="ctitle"]').forEach(function(inp,i){
    inp.addEventListener('input',function(){ e.chapters[i].title=this.value; });
  });
  $$('#edChaps [data-field="ctext"]').forEach(function(ta,i){
    ta.addEventListener('input',function(){
      e.chapters[i].text=this.value;
      var box=ta.closest('.chap-box');
      box.querySelector('.counter').textContent=countChars(this.value)+'자 · '+countParas(this.value)+'문단';
      $('#edTotal').textContent=totalChars()+'자';
    });
  });
  $$('#edChaps [data-delchap]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=+b.getAttribute('data-delchap');
      if(e.chapters.length<=1) return;
      e.chapters.splice(i,1); renderEditor();
    });
  });
}
function saveEditor(){
  var e=S.editor;
  var title=(e.title||'').trim();
  var chaps=e.chapters.map(function(c){
    return {title:(c.title||'').trim()||'제목 없음', paragraphs:c.text.split(/\n\s*\n/).map(function(s){ return s.trim(); }).filter(Boolean)};
  }).filter(function(c){ return c.paragraphs.length; });
  if(!title){ toast('제목을 적어 주세요'); $('#edTitle') && $('#edTitle').focus(); return; }
  if(!chaps.length){ toast('본문이 비어 있습니다'); return; }
  var chars=0; chaps.forEach(function(c){ c.paragraphs.forEach(function(p){ chars+=plain(p).length; }); });
  var pal=PALETTES[e.pal]||PALETTES[0];
  var now=Date.now();
  var w={
    id:e.id||('mine-'+AG.uid()), seed:false,
    title:title, author:(e.author||'@').trim()||'@', genre:e.genre, mood:e.mood,
    tags:[e.genre,e.mood], blurb:(e.blurb||'').trim()||'한 줄 소개가 아직 없습니다.',
    cover:{bg:pal.bg,fg:pal.fg,mark:markOf(title),motif:e.motif},
    chapters:chaps, chars:chars, readMin:Math.max(1,Math.round(chars/520)),
    rating:0, ratingCount:0, likes:0, reads:0,
    publishedAt:AG.todayKey(), createdAt:e.id?(AG.workById(e.id)||{}).createdAt||now:now, updatedAt:now
  };
  w.first=plain(chaps[0].paragraphs[0]);
  DB.put('works',w).then(function(){
    return reloadWorks();
  }).then(function(){
    S.editor=null;
    toast(e.id?'수정해 봉인했습니다':'봉인했습니다');
    AG.views.go('detail',w.id,{replace:true});
  }).catch(function(err){ console.warn(err); toast('저장에 실패했습니다'); });
}
function plain(s){ return String(s||'').replace(/\*\*/g,''); }
function markOf(t){
  var s=plain(t).replace(/\s/g,'');
  if(!s) return '無';
  if(/^[0-9A-Za-z:]+$/.test(s)) return s.slice(0,4);
  return Array.from(s)[0];
}
function reloadWorks(){
  return DB.all('works').then(function(all){
    S.works=all.slice().sort(function(a,b){ return String(a.publishedAt||'').localeCompare(String(b.publishedAt||'')); });
    S.mine=S.works.filter(function(w){ return !w.seed; }).sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
    AG.refreshBadges && AG.refreshBadges();
  });
}
function deleteWork(id){
  var w=AG.workById(id); if(!w) return;
  AG.confirmBox('이 단편을 지울까요?','"'+w.title+'"과 그 작품에 남긴 형광펜·진행률이 함께 사라집니다.','지우기',true).then(function(ok){
    if(!ok) return;
    DB.del('works',id).then(function(){
      return Promise.all([
        DB.del('progress',id).catch(function(){}),
        DB.del('shelf',id).catch(function(){}),
        DB.del('ratings',id).catch(function(){})
      ]);
    }).then(function(){
      var gone=S.marks.filter(function(m){ return m.workId===id; });
      S.marks=S.marks.filter(function(m){ return m.workId!==id; });
      return Promise.all(gone.map(function(m){ return DB.del('marks',m.id).catch(function(){}); }));
    }).then(function(){
      return reloadWorks();
    }).then(function(){
      history.length>1 ? history.back() : AG.views.go('studio',null,{replace:true});
      toast('지웠습니다');
    });
  });
}

/* ---------------- backup ---------------- */
function exportJSON(){
  Promise.all([DB.all('marks'),DB.all('bookmarks'),DB.all('sessions')]).then(function(res){
    var data={
      app:'ABYSSAL GRIMOIRE', format:'grimoire-backup', version:1, exportedAt:new Date().toISOString(),
      works:S.mine, progress:Object.keys(S.progress).map(function(k){ return S.progress[k]; }),
      marks:res[0], bookmarks:res[1], sessions:res[2],
      shelf:Object.keys(S.shelf).map(function(k){ return S.shelf[k]; }),
      ratings:Object.keys(S.ratings).map(function(k){ return S.ratings[k]; }),
      settings:AG.SET()
    };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='abyssal-grimoire-'+AG.todayKey()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
    toast('JSON으로 내보냈습니다');
  });
}
function importJSON(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var data;
      try{ data=JSON.parse(fr.result); }catch(e){ toast('JSON을 읽을 수 없습니다'); return; }
      if(!data || data.format!=='grimoire-backup'){ toast('이 앱의 백업 파일이 아닙니다'); return; }
      AG.confirmBox('백업을 복원할까요?',
        '작품 '+(data.works||[]).length+'편, 형광펜 '+((data.marks||[]).length)+'개, 진행률 '+((data.progress||[]).length)+'개를 이 브라우저에 합칩니다. 같은 항목은 최신 것으로 덮어씁니다.',
        '복원').then(function(ok){
          if(!ok) return;
          restore(data).then(function(){
            toast('복원했습니다');
            location.hash='#/library';
            AG.applyRoute();
          });
        });
    };
    fr.readAsText(f);
  };
  inp.click();
}
function restore(data){
  var jobs=[];
  (data.works||[]).forEach(function(w){ if(!w.seed) jobs.push(DB.put('works',w)); });
  (data.progress||[]).forEach(function(p){ if(p.workId) jobs.push(DB.put('progress',p)); });
  (data.marks||[]).forEach(function(m){ if(m.id) jobs.push(DB.put('marks',m)); });
  (data.bookmarks||[]).forEach(function(b){ if(b.id) jobs.push(DB.put('bookmarks',b)); });
  (data.shelf||[]).forEach(function(s){ if(s.workId) jobs.push(DB.put('shelf',s)); });
  (data.ratings||[]).forEach(function(r){ if(r.workId) jobs.push(DB.put('ratings',r)); });
  (data.sessions||[]).forEach(function(s){ if(s.date) jobs.push(DB.put('sessions',s)); });
  if(data.settings) { try{ localStorage.setItem('ag.settings.v1',JSON.stringify(Object.assign({},AG.SET(),data.settings))); }catch(e){} }
  return Promise.all(jobs).then(function(){ return AG.reloadAll(true); });
}

function resetAll(){
  AG.confirmBox('기록을 전부 지울까요?','내가 쓴 작품, 형광펜, 별점, 진행률이 모두 사라집니다. 되돌릴 수 없습니다.','전부 지우기',true).then(function(ok){
    if(!ok) return;
    var stores=['works','progress','marks','bookmarks','shelf','ratings','sessions'];
    Promise.all(stores.map(function(s){ return DB.clear(s); })).then(function(){
      try{ localStorage.removeItem('ag.seedVersion'); localStorage.removeItem('ag.recent'); }catch(e){}
      return AG.reloadAll(true);
    }).then(function(){
      toast('초기화했습니다');
      location.hash='#/home'; AG.applyRoute();
    });
  });
}

window.AG.studio={ renderStudio:renderStudio, renderSettings:renderSettings, renderEditor:renderEditor,
  openEditor:openEditor, saveEditor:saveEditor, deleteWork:deleteWork, exportJSON:exportJSON, importJSON:importJSON,
  resetAll:resetAll, blankEditor:blankEditor, PROMPTS:PROMPTS, reloadWorks:reloadWorks };
})();

  el.style.setProperty('--r-fs', th.fs+'px');
  el.style.setProperty('--r-lh', String(th.lh));
  el.style.setProperty('--r-mx', th.margin+'px');
  el.style.setProperty('--r-font', th.font==='sans'?'var(--ui)':'var(--serif)');
  document.body.setAttribute('data-chrome', th.chrome?'off':'on');
  syncSettingUI();
}
function syncSettingUI(){
  var th=cfg();
  $$('#setTheme button').forEach(function(b){ b.classList.toggle('is-on',b.getAttribute('data-th')===th.theme); });
  $$('#setFont button').forEach(function(b){ b.classList.toggle('is-on',b.getAttribute('data-f')===th.font); });
  var fv=$('#fsVal'), lv=$('#lhVal'), mg=$('#setMargin'), cs=$('#setChrome');
  if(fv) fv.textContent=th.fs;
  if(lv) lv.textContent=th.lh.toFixed(1);
  if(mg) mg.value=th.margin;
  if(cs) cs.classList.toggle('is-on',!!th.chrome);
}

function markKey(ci,pi){ return ci+':'+pi; }
function marksFor(workId){
  var map={};
  S.marks.forEach(function(m){ if(m.workId===workId) map[markKey(m.chapterIndex,m.pIndex)]=m; });
  return map;
}
function hlCss(c){
  return c===2 ? 'rgba(243,179,162,.72)' : c===3 ? 'rgba(169,214,190,.78)' : 'rgba(242,218,114,.75)';
}

function renderChapter(restoreRatio){
  var w=S.reader.work; if(!w) return;
  var ci=clamp(S.reader.ch,0,w.chapters.length-1);
  var ch=w.chapters[ci];
  var mk=marksFor(w.id);
  var body=$('#rBody');
  var ratio = restoreRatio==null ? 0 : restoreRatio;

  var html='<div class="r-head"><div class="r-kicker">'+esc(w.genre)+' · '+esc(w.mood)+'</div>'+
    '<h1 class="r-h1">'+esc(w.title)+'</h1>'+
    '<div class="r-h2"><span>'+esc(w.author)+'</span><i class="dot"></i><span>약 '+minRead(w)+'분</span><i class="dot"></i><span>'+w.chapters.length+'장 중 '+(ci+1)+'장</span></div></div>';
  if(w.chapters.length>1){ html+='<div class="r-ch"><b>'+(ci+1<10?'0':'')+(ci+1)+' · '+esc(ch.title)+'</b></div>'; }
  ch.paragraphs.forEach(function(p,i){
    var t=String(p);
    if(t.trim()==='· · ·' || t.trim()==='· · ·'){
      html+='<div class="r-scene"><i></i><i></i><i></i></div>';
      return;
    }
    var m=mk[markKey(ci,i)];
    var inner=rich(t);
    if(m){
      var noteBtn = m.note ? '<button class="memo-dot" data-memo="'+ci+':'+i+'" aria-label="메모 보기">✎</button>' : '';
      inner='<span class="hl hl-'+(m.color||1)+'">'+inner+'</span>'+noteBtn;
    }
    html+='<p class="r-p" data-p="'+i+'">'+inner+'</p>';
  });

  var next=w.chapters[ci+1], prev=ci>0?w.chapters[ci-1]:null;
  html+='<div class="r-end">';
  if(!next){
    var r=AG.views.ratingAvg(w), mine=S.ratings[w.id];
    html+='<div class="r-end-t">여기서 이야기가 끝납니다</div>'+
      '<div class="r-end-s">'+esc(w.title)+' · '+esc(w.author)+'</div>'+
      '<div class="rate" data-ratefor="'+esc(w.id)+'" style="justify-content:center;margin-top:16px">'+
        [1,2,3,4,5].map(function(i){ return '<button data-star="'+i+'" aria-label="별점 '+i+'"><svg class="'+(mine&&i<=mine.value?'on':'')+'"><use href="#i-star"/></svg></button>'; }).join('')+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--r-sub);margin-top:6px">'+(mine?'내 별점 '+mine.value+' · ':'')+'평균 '+r.txt+'</div>'+
      '<button class="btn-line btn-sm" data-finish="1" style="margin-top:14px">완독으로 표시</button>';
    var others=S.works.filter(function(x){ return x.id!==w.id; });
    if(others.length){
      var nw=others[Math.floor(Math.random()*others.length)];
      html+='<button class="r-next" data-open2="'+esc(nw.id)+'">'+coverHTML(nw,{title:false})+
        '<span class="r-next-b"><span class="r-next-k">다음 단편</span><span class="r-next-t">'+esc(nw.title)+'</span></span></button>';
    }
  }else{
    html+='<div class="r-end-t">'+(ci+1)+'장 끝</div><div class="r-end-s">'+esc(next.title)+'</div>'+
      '<button class="btn-ink" data-next="1">다음 장<svg style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2"><use href="#i-fwd"/></svg></button>';
  }
  html+='</div>';

  body.innerHTML='<div class="r-wrap">'+html+'</div>';
  S.reader.chStart=Date.now();
  $('#rTitle').textContent=w.title;
  $('#rChapter').textContent=(w.chapters.length>1?((ci+1)+'/'+w.chapters.length+' · '+ch.title):('단편 · 약 '+minRead(w)+'분'));
  var bmBtn=$('#rBm'); bmBtn.classList.toggle('is-on', hasBookmark(ci));
  body.scrollTop=0;
  if(ratio>0){
    R.suppressScroll=true;
    requestAnimationFrame(function(){
      var max=body.scrollHeight-body.clientHeight;
      body.scrollTop=Math.round(max*ratio);
      setTimeout(function(){ R.suppressScroll=false; },60);
    });
  }
  updateProgressUI();
}
function hasBookmark(ci){
  return S.bookmarks.some(function(b){ return b.workId===S.reader.work.id && b.chapterIndex===ci; });
}

function computeProgress(){
  var w=S.reader.work, body=$('#rBody');
  var max=body.scrollHeight-body.clientHeight;
  var scrollable=max>60;
  var ratio = scrollable ? clamp(body.scrollTop/max,0,1) : 0.55;
  var total=w.chapters.length;
  var percent=clamp(((S.reader.ch+ratio)/total)*100,0,100);
  return {ratio:ratio, percent:percent, scrollable:scrollable, max:max};
}
function updateProgressUI(){
  var p=computeProgress();
  $('#rProg').style.width=p.percent.toFixed(1)+'%';
  $('#rPct').textContent=Math.round(p.percent)+'%';
  $('#rOf').textContent=(S.reader.ch+1)+'/'+S.reader.work.chapters.length;
}
function saveProgress(force){
  var w=S.reader.work; if(!w) return;
  var p=computeProgress();
  var rec=S.progress[w.id]||{workId:w.id};
  var isLast=S.reader.ch>=w.chapters.length-1;
  var dwell=(Date.now()-(S.reader.chStart||Date.now()))/1000;
  var atEnd=isLast && ((p.scrollable && p.ratio>0.94) || (!p.scrollable && dwell>40));
  var finished = atEnd || p.percent>=97.5 || (rec.finished && p.percent>=90);
  rec.chapterIndex=S.reader.ch;
  rec.ratio=p.ratio;
  rec.percent=Math.max(p.percent, rec.percent||0, 0);
  if(finished){ rec.percent=100; rec.finished=true; rec.finishedAt=rec.finishedAt||Date.now(); }
  rec.updatedAt=Date.now();
  S.progress[w.id]=rec;
  DB.put('progress',rec).catch(function(){});
  try{ localStorage.setItem('ag.last',JSON.stringify({workId:w.id,chapterIndex:S.reader.ch,at:Date.now()})); }catch(e){}
  AG.refreshBadges && AG.refreshBadges();
}

/* -------- sessions -------- */
function flushSession(final){
  if(!R.open || !S.reader.work) return;
  var now=Date.now();
  var sec=Math.round((now-R.t0)/1000);
  if(sec<4){ R.t0=now; return; }
  R.t0=now;
  var rec={id:AG.todayKey()+'|'+S.reader.work.id, date:AG.todayKey(), workId:S.reader.work.id,
           seconds:(function(){ var cur=S.sessions.filter(function(s){ return s.id===AG.todayKey()+'|'+S.reader.work.id; })[0]; return (cur?cur.seconds:0)+sec; })()};
  var i=S.sessions.findIndex(function(s){ return s.id===rec.id; });
  if(i>=0) S.sessions[i]=rec; else S.sessions.push(rec);
  DB.put('sessions',rec).catch(function(){});
}

/* -------- open / close -------- */
function show(id,ch,pIdx){
  var w=AG.workById(id);
  if(!w){ toast('작품을 찾을 수 없습니다'); return; }
  var ci=clamp((ch==null?0:+ch),0,w.chapters.length-1);
  var alreadyOpen=$('#reader').classList.contains('is-open');
  if(alreadyOpen && S.reader.work && S.reader.work.id===id && S.reader.ch===ci){ return; }
  var sameWork = alreadyOpen && S.reader.work && S.reader.work.id===id;
  var prog=S.progress[id];
  var ratio = 0;
  if(!sameWork && prog && prog.chapterIndex===ci) ratio=prog.ratio||0;
  S.reader.work=w; S.reader.ch=ci; S.reader.sel=null;
  applyReaderSettings();
  renderChapter(ratio);
  if(pIdx!=null && !sameWork){
    setTimeout(function(){
      var el=$$('.r-p[data-p="'+pIdx+'"]',$('#rBody'))[0];
      if(el){ el.scrollIntoView({block:'center'}); S.reader.sel={ch:ci,p:+pIdx}; selectParagraph(el); }
    },120);
  }
  $('#reader').classList.add('is-open');
  $('#reader').setAttribute('aria-hidden','false');
  document.body.setAttribute('data-lock','1');
  $('#rSel').classList.remove('is-on');
  if(!R.open){
    R.open=true; R.t0=Date.now();
    clearInterval(R.timer);
    R.timer=setInterval(function(){ flushSession(); saveProgress(); },20000);
    saveProgress();
    if(!localStorage.getItem('ag.hint')){
      setTimeout(function(){ toast('본문을 누르면 형광펜 · 빈 곳을 누르면 메뉴가 접힙니다',3200); },700);
      try{ localStorage.setItem('ag.hint','1'); }catch(e){}
    }
  }
}
function hide(){
  if(!R.open) return;
  saveProgress(true); flushSession(true);
  clearInterval(R.timer); R.timer=null; R.open=false;
  $('#reader').classList.remove('is-open');
  $('#reader').setAttribute('aria-hidden','true');
  document.body.removeAttribute('data-lock');
  document.body.setAttribute('data-chrome','on');
  AG.refreshBadges && AG.refreshBadges();
  var done=S.progress[S.reader.work?S.reader.work.id:''];
  if(done && done.percent>=97.5 && !done._celebrated){
    done._celebrated=true;
    toast('완독했습니다 · 서재에 봉인됨');
  }
}
function back(){
  if(location.hash.indexOf('#/read/')===0){ history.back(); }
  else hide();
}
function goCh(n){
  var w=S.reader.work; if(!w) return;
  var ci=clamp(n,0,w.chapters.length-1);
  if(ci===S.reader.ch){ $('#rBody').scrollTo({top:0,behavior:'smooth'}); return; }
  S.reader.ch=ci;
  location.replace('#/read/'+w.id+'/'+ci);
  renderChapter(0);
  $('#rBody').scrollTo({top:0});
}

/* -------- selection & marks -------- */
function selectParagraph(pEl){
  $$('.r-p.is-sel').forEach(function(x){ x.classList.remove('is-sel'); });
  if(!pEl) return;
  pEl.classList.add('is-sel');
  S.reader.sel={ch:S.reader.ch, p:+pEl.getAttribute('data-p'), el:pEl};
  var m=S.marks.filter(function(x){ return x.workId===S.reader.work.id && x.chapterIndex===S.reader.ch && x.pIndex===S.reader.sel.p; })[0];
  S.reader.color = m?m.color:1;
  $$('#rSel .sw').forEach(function(b){ b.classList.toggle('is-on',+b.getAttribute('data-hl')===S.reader.color); });
  $('#rSel').classList.add('is-on');
}
function clearSel(){
  $$('.r-p.is-sel').forEach(function(x){ x.classList.remove('is-sel'); });
  S.reader.sel=null;
  $('#rSel').classList.remove('is-on');
}
function markAt(){
  var sel=S.reader.sel; if(!sel) return null;
  return S.marks.filter(function(x){ return x.workId===S.reader.work.id && x.chapterIndex===sel.ch && x.pIndex===sel.p; })[0]||null;
}
function paragraphText(ci,pi){
  var ch=S.reader.work.chapters[ci]; if(!ch) return '';
  return plain(ch.paragraphs[pi]||'');
}
function persistMark(m){
  var i=S.marks.findIndex(function(x){ return x.id===m.id; });
  if(i>=0) S.marks[i]=m; else S.marks.push(m);
  return DB.put('marks',m);
}
function removeMark(m){
  S.marks=S.marks.filter(function(x){ return x.id!==m.id; });
  return DB.del('marks',m.id);
}
function setColor(c){
  var sel=S.reader.sel; if(!sel) return;
  var m=markAt();
  if(m && m.color===c){
    removeMark(m).then(function(){ rerenderKeepScroll(); toast('형광펜을 지웠습니다'); });
    return;
  }
  if(m){ m.color=c; persistMark(m).then(function(){ rerenderKeepScroll(); toast('형광펜 색을 바꿨습니다'); }); }
  else {
    var nm={id:AG.uid(), workId:S.reader.work.id, chapterIndex:sel.ch, pIndex:sel.p,
            text:paragraphText(sel.ch,sel.p), color:c, note:'', createdAt:Date.now()};
    persistMark(nm).then(function(){ rerenderKeepScroll(); toast('형광펜을 그었습니다'); });
  }
}
function rerenderKeepScroll(){
  var body=$('#rBody'), top=body.scrollTop;
  var sel=S.reader.sel;
  renderChapter(0);
  body.scrollTop=top;
  if(sel){
    var el=$$('.r-p[data-p="'+sel.p+'"]',body)[0];
    if(el){ selectParagraph(el); }
  }
  AG.refreshBadges && AG.refreshBadges();
}
function openMemo(pi){
  var sel=S.reader.sel || {ch:S.reader.ch,p:pi};
  var m=S.marks.filter(function(x){ return x.workId===S.reader.work.id && x.chapterIndex===sel.ch && x.pIndex===sel.p; })[0]
       || S.marks.filter(function(x){ return x.workId===S.reader.work.id && x.chapterIndex===(+($('#rBody').dataset.ch||sel.ch)) && x.pIndex===pi; })[0];
  var text=m?m.note:'';
  AG.dialog({
    kicker:'독서 메모', title:'한 줄 메모',
    sub:paragraphText(sel.ch,sel.p).slice(0,52)+(paragraphText(sel.ch,sel.p).length>52?'…':''),
    body:'<textarea class="ta m-area" id="memoTa" maxlength="240" placeholder="이 문단에 남길 생각">'+esc(text)+'</textarea>',
    ok:'남기기', cancel:'취소',
    onOk:function(body){
      var v=body.querySelector('#memoTa').value.trim();
      var cur=markAt();
      if(!v){
        if(cur && !cur.note){ return true; }
        if(cur){ cur.note=''; persistMark(cur).then(function(){ rerenderKeepScroll(); }); return true; }
        return true;
      }
      var base=cur||{id:AG.uid(),workId:S.reader.work.id,chapterIndex:sel.ch,pIndex:sel.p,
        text:paragraphText(sel.ch,sel.p),color:S.reader.color||1,createdAt:Date.now()};
      base.note=v;
      persistMark(base).then(function(){ rerenderKeepScroll(); toast('메모를 남겼습니다'); });
      return true;
    }
  });
}
function addBookmarkFromScroll(){
  var body=$('#rBody'), ps=$$('.r-p',body);
  var top=body.getBoundingClientRect().top+80;
  var target=ps[0];
  for(var i=0;i<ps.length;i++){ if(ps[i].getBoundingClientRect().top>=top){ target=ps[i]; break; } }
  if(!target) return;
  addBookmark(+target.getAttribute('data-p'));
}
function addBookmark(pi){
  var w=S.reader.work, ci=S.reader.ch;
  var exists=S.bookmarks.filter(function(b){ return b.workId===w.id && b.chapterIndex===ci && b.pIndex===pi; })[0];
  if(exists){ toast('이미 책갈피를 꽂았습니다'); return; }
  var bm={id:AG.uid(),workId:w.id,chapterIndex:ci,pIndex:pi,text:paragraphText(ci,pi).slice(0,120),createdAt:Date.now()};
  S.bookmarks.push(bm);
  DB.put('bookmarks',bm).then(function(){
    $('#rBm').classList.add('is-on');
    toast('책갈피를 꽂았습니다');
    clearSel();
  });
}
function toggleChrome(){
  var th=cfg(); th.chrome=!th.chrome; AG.saveSettings();
  document.body.setAttribute('data-chrome',th.chrome?'off':'on');
  var sw=$('#setChrome'); if(sw) sw.classList.toggle('is-on',th.chrome);
}

function renderToc(){
  var w=S.reader.work; if(!w) return;
  var p=S.progress[w.id];
  $('#tocBody').innerHTML=w.chapters.map(function(c,i){
    var read=p && (p.chapterIndex>i || (p.chapterIndex===i&&(p.percent||0)>=97));
    return '<button class="toc-i'+(read?' is-read':'')+(i===S.reader.ch?' is-sel':'')+'" data-goto="'+i+'">'+
      '<span class="toc-no">'+(i+1<10?'0':'')+(i+1)+'</span><span class="toc-n">'+esc(c.title)+'</span>'+
      '<span class="toc-l">'+(i===S.reader.ch?Math.round(computeProgress().percent)+'%':'')+'</span></button>';
  }).join('');
}

/* -------- bind -------- */
function bind(){
  $('#rBack').addEventListener('click',back);
  $('#rBm').addEventListener('click',function(){
    if(hasBookmark(S.reader.ch)){ toast('이 장에는 이미 책갈피가 있습니다'); return; }
    addBookmarkFromScroll();
  });
  $('#rMore').addEventListener('click',function(){ renderToc(); bootstrap.Offcanvas.getOrCreateInstance($('#shToc')).show(); });
  $('#rToc').addEventListener('click',function(){ renderToc(); bootstrap.Offcanvas.getOrCreateInstance($('#shToc')).show(); });
  $('#rSet').addEventListener('click',function(){ syncSettingUI(); bootstrap.Offcanvas.getOrCreateInstance($('#shSet')).show(); });

  var body=$('#rBody');
  body.addEventListener('click',function(e){
    if(e.target.closest('[data-memo]')){
      var k=e.target.closest('[data-memo]').getAttribute('data-memo').split(':');
      S.reader.sel={ch:+k[0],p:+k[1]};
      openMemo(+k[1]);
      return;
    }
    if(e.target.closest('[data-next]')){ goCh(S.reader.ch+1); return; }
    if(e.target.closest('[data-finish]')){
      var w=S.reader.work, rec=S.progress[w.id]||{workId:w.id};
      rec.percent=100; rec.finished=true; rec.finishedAt=Date.now(); rec.updatedAt=Date.now();
      rec.chapterIndex=w.chapters.length-1; rec.ratio=1;
      S.progress[w.id]=rec; DB.put('progress',rec);
      AG.refreshBadges && AG.refreshBadges();
      toast('완독으로 표시했습니다');
      return;
    }
    if(e.target.closest('[data-open2]')){ AG.views.go('detail',e.target.closest('[data-open2]').getAttribute('data-open2')); return; }
    if(e.target.closest('.rate')) return;
    var p=e.target.closest('.r-p');
    if(p){
      if(p.classList.contains('is-sel')){ clearSel(); return; }
      selectParagraph(p);
      return;
    }
    clearSel();
    toggleChrome();
  });

  body.addEventListener('scroll',function(){
    if(R.suppressScroll) return;
    clearTimeout(R.scrollT);
    R.scrollT=setTimeout(function(){ updateProgressUI(); saveProgress(); },420);
  },{passive:true});

  $('#rSel').addEventListener('click',function(e){
    var sw=e.target.closest('.sw');
    if(sw){ setColor(+sw.getAttribute('data-hl')); return; }
    if(e.target.closest('#selMemo')){ openMemo(); return; }
    if(e.target.closest('#selMark')){ if(S.reader.sel) addBookmark(S.reader.sel.p); return; }
    if(e.target.closest('#selClose')){ clearSel(); return; }
  });

  $('#setTheme').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var th=cfg(); th.theme=b.getAttribute('data-th'); AG.saveSettings(); applyReaderSettings();
  });
  $('#setFont').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var th=cfg(); th.font=b.getAttribute('data-f'); AG.saveSettings(); applyReaderSettings();
  });
  $('#shSet').addEventListener('click',function(e){
    var b=e.target.closest('[data-step]'); if(!b) return;
    var th=cfg(), dir=+b.getAttribute('data-dir');
    if(b.getAttribute('data-step')==='fs'){ th.fs=clamp(th.fs+dir*1,13,28); }
    else { th.lh=clamp(Math.round((th.lh+dir*0.1)*10)/10,1.3,2.6); }
    AG.saveSettings(); applyReaderSettings();
  });
  $('#setMargin').addEventListener('input',function(){
    var th=cfg(); th.margin=+this.value; AG.saveSettings(); applyReaderSettings();
  });
  $('#setChrome').addEventListener('click',function(){ toggleChrome(); });
  $('#shToc').addEventListener('click',function(e){
    var b=e.target.closest('[data-goto]'); if(!b) return;
    bootstrap.Offcanvas.getOrCreateInstance($('#shToc')).hide();
    goCh(+b.getAttribute('data-goto'));
  });
}

window.AG.reader={ show:show, hide:hide, back:back, bind:bind, isOpen:function(){ return R.open; },
  applySettings:applyReaderSettings, goCh:goCh, saveProgress:saveProgress };
})();

(function(){

  var sc=$('#'+({home:'homeScroll',search:'searchScroll',library:'libScroll',studio:'studioScroll',settings:'setScroll',detail:'dtScroll',editor:'edScroll'})[v]);
  if(sc){
    var restore = (v===prevView && mem[v]!= null);
    sc.scrollTop = restore ? mem[v] : 0;
  }
  prevView=v;
}
function applyRoute(){
  var r=parseHash();
  var old=S.route; S.route=r;
  if(r.view==='read'){ AG.reader.show(r.id, r.ch==null?0:+r.ch, r.p==null?null:+r.p); return; }
  AG.reader.hide();
  // remember scroll of the view we leave
  var cur=$('.view.is-on');
  if(cur){
    var vv=cur.getAttribute('data-view');
    var sc=$('#'+({home:'homeScroll',search:'searchScroll',library:'libScroll',studio:'studioScroll',settings:'setScroll',detail:'dtScroll',editor:'edScroll'})[vv]);
    if(sc) mem[vv]=sc.scrollTop;
  }
  showView(r.view, r.id);
}

/* ---------------- data ---------------- */
function toMap(arr,key){ var m={}; (arr||[]).forEach(function(x){ if(x&&x[key]!=null) m[x[key]]=x; }); return m; }
function seedIfNeeded(){
  var cur=localStorage.getItem('ag.seedVersion');
  if(cur===String(AG.SEED.version)) return Promise.resolve(false);
  var works=AG.SEED.works;
  return DB.bulk('works',works).then(function(){
    try{ localStorage.setItem('ag.seedVersion',String(AG.SEED.version)); }catch(e){}
    return true;
  });
}
function reloadAll(reseed){
  var pre = reseed ? seedIfNeeded() : Promise.resolve(false);
  return pre.then(function(){ return Promise.all([DB.all('works'),DB.all('progress'),DB.all('marks'),DB.all('bookmarks'),
                      DB.all('shelf'),DB.all('ratings'),DB.all('sessions')]).then(function(res){
    var w=res[0]||[], p=res[1]||[], m=res[2]||[], b=res[3]||[], sh=res[4]||[], ra=res[5]||[], se=res[6]||[];
    S.works=w.slice().sort(function(a,x){ return String(a.publishedAt||'').localeCompare(String(x.publishedAt||'')); });
    S.mine=S.works.filter(function(x){ return !x.seed; }).sort(function(a,x){ return (x.updatedAt||x.createdAt||0)-(a.updatedAt||a.createdAt||0); });
    S.progress=toMap(p,'workId');
    S.marks=m;
    S.bookmarks=b;
    S.shelf=toMap(sh,'workId');
    S.ratings=toMap(ra,'workId');
    S.sessions=se;
    refreshBadges();
    return true;
  }); });
}
function refreshBadges(){
  var dot=$('#libDot');
  if(!dot) return;
  var busy=Object.keys(S.progress).some(function(k){ var p=S.progress[k]; return p && (p.percent||0)<98; });
  dot.hidden=!busy;
}

/* ---------------- favourites & ratings ---------------- */
function toggleFav(id){
  var cur=S.shelf[id];
  if(cur && cur.favorite){
    S.shelf[id]={workId:id,favorite:false,addedAt:cur.addedAt||Date.now()};
    DB.put('shelf',S.shelf[id]);
    toast('찜을 풀었습니다');
  }else{
    S.shelf[id]={workId:id,favorite:true,addedAt:Date.now()};
    DB.put('shelf',S.shelf[id]);
    toast('찜했습니다');
  }
  $$('[data-fav="'+id+'"]').forEach(function(b){ b.classList.toggle('is-on', !!(S.shelf[id]&&S.shelf[id].favorite)); });
  refreshBadges();
}
function setRating(id,v){
  S.ratings[id]={workId:id,value:v,at:Date.now()};
  DB.put('ratings',S.ratings[id]);
  $$('[data-ratefor="'+id+'"] [data-star]').forEach(function(b){
    b.querySelector('svg').classList.toggle('on', +b.getAttribute('data-star')<=v);
  });
  $$('[data-ratefor="'+id+'"]').forEach(function(r){ r.classList.add('is-mine'); });
  var holder=$$('[data-ratefor="'+id+'"]')[0];
  if(holder){
    var lab=holder.parentElement.querySelector('.dt-rate-l b');
    if(lab) lab.textContent='내 별점 '+v;
  }
  toast(v+'점을 남겼습니다');
  if(S.route.view==='detail') setTimeout(function(){ AG.views.renderDetail(S.route.id); },340);
}

/* ---------------- global events ---------------- */
function bindGlobal(){
  document.addEventListener('click',function(e){
    var t=e.target;

    var nav=t.closest('[data-nav]');
    if(nav){ AG.reader.hide(); AG.views.go(nav.getAttribute('data-nav')); return; }

    var read=t.closest('[data-read]');
    if(read){
      var rid=read.getAttribute('data-read'), rch=read.getAttribute('data-ch')||'0';
      var rp=read.getAttribute('data-p');
      var target='#/read/'+rid+'/'+rch+(rp!=null?('/'+rp):'');
      if(location.hash===target){ applyRoute(); } else { location.hash=target; }
      return;
    }
    var open=t.closest('[data-open]');
    if(open){ AG.views.go('detail', open.getAttribute('data-open')); return; }

    var g=t.closest('[data-genre]');
    if(g){ var gv=g.getAttribute('data-genre'); S.filter.genre=(S.filter.genre===gv?'전체':gv); AG.views.renderHome(); return; }
    var mo=t.closest('[data-mood]');
    if(mo){ var mv=mo.getAttribute('data-mood'); S.filter.mood=(S.filter.mood===mv?'전체':mv); AG.views.renderHome(); return; }
    var so=t.closest('[data-sort]');
    if(so){ S.filter.sort=so.getAttribute('data-sort'); AG.views.renderHome(); return; }

    var lib=t.closest('[data-lib]');
    if(lib){ S.libTab=lib.getAttribute('data-lib'); AG.views.renderLibrary(); var ls=$('#libScroll'); if(ls) ls.scrollTop=0; return; }

    var fav=t.closest('[data-fav]');
    if(fav){ toggleFav(fav.getAttribute('data-fav')); return; }

    var star=t.closest('[data-star]');
    if(star){ var holder=star.closest('[data-ratefor]'); if(holder){ setRating(holder.getAttribute('data-ratefor'), +star.getAttribute('data-star')); return; } }

    var dbm=t.closest('[data-delbm]');
    if(dbm){
      var bid=dbm.getAttribute('data-delbm');
      S.bookmarks=S.bookmarks.filter(function(x){ return x.id!==bid; });
      DB.del('bookmarks',bid).then(function(){ AG.views.renderLibrary(); toast('책갈피를 지웠습니다'); });
      return;
    }
    var dm=t.closest('[data-delmark]');
    if(dm){
      var mid=dm.getAttribute('data-delmark');
      var mm=S.marks.filter(function(x){ return x.id===mid; })[0];
      if(mm){
        AG.confirmBox('이 문장을 지울까요?','형광펜과 메모가 함께 사라집니다.','지우기',true).then(function(ok){
          if(!ok) return;
          S.marks=S.marks.filter(function(x){ return x.id!==mid; });
          DB.del('marks',mid).then(function(){ AG.views.renderLibrary(); toast('지웠습니다'); });
        });
      }
      return;
    }

    var ed=t.closest('[data-edit]');
    if(ed){ AG.studio.openEditor(ed.getAttribute('data-edit')); return; }
    var del=t.closest('[data-del]');
    if(del){ AG.studio.deleteWork(del.getAttribute('data-del')); return; }

    var qc=t.closest('[data-q]');
    if(qc){ S.q=qc.getAttribute('data-q'); $('#q').value=S.q; AG.views.pushRecent(S.q); AG.views.renderSearch(); return; }

    var act=t.closest('[data-act]');
    if(act){
      var a=act.getAttribute('data-act');
      if(a==='back'){ if(history.length>1) history.back(); else AG.views.go('home',null,{replace:true}); }
      else if(a==='share'){
        var w=AG.workById(S.route.id);
        var txt=(w?w.title+' — ':'')+'ABYSSAL GRIMOIRE';
        if(navigator.share){ navigator.share({title:'ABYSSAL GRIMOIRE',text:txt}).catch(function(){}); }
        else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ toast('제목을 복사했습니다'); }).catch(function(){ toast(txt); }); }
        else toast(txt);
      }
      else if(a==='uiTheme'){
        var th=AG.SET();
        th.uiTheme = AG.resolvedUiTheme()==='dark' ? 'light':'dark';
        AG.saveSettings(); AG.applyUiTheme();
        if(S.route.view==='home') AG.views.renderHome();
      }
      else if(a==='export'){ AG.studio.exportJSON(); }
      else if(a==='import'){ AG.studio.importJSON(); }
      else if(a==='reset'){ AG.studio.resetAll(); }
      else if(a==='promptStart'){ AG.studio.openEditor(null, act.parentElement.querySelector('.u-serif').textContent); }
      else if(a==='promptRoll'){ AG.studio.renderStudio(); }
      else if(a==='addChap'){ S.editor.chapters.push({title:(S.editor.chapters.length+1)+'장',text:''}); AG.studio.renderEditor(); }
      else if(a==='edBack'){ leaveEditor(); }
      else if(a==='clearRecent'){ try{ localStorage.removeItem('ag.recent'); }catch(err){} AG.views.renderSearch(); toast('최근 검색을 지웠습니다'); }
      else if(a==='copyWork'){
        var src=AG.workById(act.getAttribute('data-id'));
        if(src){
          var copy=JSON.parse(JSON.stringify(src));
          copy.id='mine-'+AG.uid(); copy.seed=false; copy.title=src.title+' (내 사본)'; copy.createdAt=Date.now(); copy.updatedAt=Date.now();
          copy.rating=0; copy.ratingCount=0; copy.likes=0; copy.reads=0;
          DB.put('works',copy).then(function(){ return reloadAll(); }).then(function(){ AG.studio.openEditor(copy.id); });
        }
      }
      return;
    }

    var ui=t.closest('[data-ui]');
    if(ui){ var st=AG.SET(); st.uiTheme=ui.getAttribute('data-ui'); AG.saveSettings(); AG.applyUiTheme(); AG.studio.renderSettings(); return; }
    var rt=t.closest('[data-readertheme]');
    if(rt){ var s2=AG.SET(); s2.theme=rt.getAttribute('data-readertheme'); AG.saveSettings(); AG.studio.renderSettings(); return; }
    var sf=t.closest('[data-setfont] button');
    if(sf){ var s3=AG.SET(); s3.font=sf.getAttribute('data-f'); AG.saveSettings(); AG.studio.renderSettings(); return; }
    var ss=t.closest('[data-setstep]');
    if(ss){
      var st4=AG.SET(), dir=+ss.getAttribute('data-dir'), key=ss.getAttribute('data-setstep');
      if(key==='fs') st4.fs=AG.clamp(st4.fs+dir,13,28);
      if(key==='lh') st4.lh=AG.clamp(Math.round((st4.lh+dir*0.1)*10)/10,1.3,2.6);
      if(key==='margin') st4.margin=AG.clamp(st4.margin+dir,14,40);
      AG.saveSettings(); AG.studio.renderSettings(); return;
    }
  });

  // search input
  var q=$('#q');
  if(q){
    var run=AG.debounce(function(){
      S.q=q.value;
      AG.views.renderSearch();
      if(S.q.trim()) AG.views.pushRecent(S.q);
    },180);
    q.addEventListener('input',function(){ run(); var c=$('#qClear'); if(c) c.hidden=!q.value; });
    q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ q.blur(); } });
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('#qClear')){ var qq=$('#q'); qq.value=''; S.q=''; AG.views.renderSearch(); qq.focus(); }
  });

  // studio / editor buttons
  document.addEventListener('click',function(e){
    if(e.target.closest('#fabNew')){ AG.studio.openEditor(null,''); return; }
    if(e.target.closest('#edSave')){ e.preventDefault(); AG.studio.saveEditor(); return; }
    if(e.target.closest('#edCancel')){ leaveEditor(); return; }
  });

  window.addEventListener('hashchange',function(){ applyRoute(); });
  window.addEventListener('pagehide',function(){ AG.reader.saveProgress(true); });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden') AG.reader.saveProgress(true);
  });
}
function leaveEditor(){
  var e=S.editor;
  if(!e){ AG.views.go('studio',null,{replace:true}); return; }
  var has=(e.title&&e.title.trim())||e.chapters.some(function(c){ return c.text.trim(); });
  if(!has){ S.editor=null; AG.views.go('studio',null,{replace:true}); return; }
  AG.confirmBox('작성을 그만둘까요?','저장하지 않은 내용은 사라집니다.','그만두기',true).then(function(ok){
    if(!ok) return;
    S.editor=null;
    AG.views.go('studio',null,{replace:true});
  });
}

/* ---------------- pwa ---------------- */
function registerPWA(){
  var http=/^https?:/.test(location.protocol);
  if(!http) return;
  try{
    var l=document.createElement('link'); l.rel='manifest'; l.href='./manifest.json';
    document.head.appendChild(l);
    var ic=document.createElement('link'); ic.rel='apple-touch-icon'; ic.sizes='180x180'; ic.href='./apple-touch-icon.png';
    document.head.appendChild(ic);
  }catch(e){}
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
}

/* ---------------- boot ---------------- */
function hideSplash(){
  var s=$('#splash');
  if(!s) return;
  s.classList.add('is-gone');
  setTimeout(function(){ s.style.display='none'; },620);
}
function boot(){
  AG.loadSettings();
  AG.applyUiTheme();
  AG.hardenViewport();
  AG.reader.bind();
  bindGlobal();
  DB.ready().then(function(){
    return seedIfNeeded();
  }).then(function(){
    return reloadAll();
  }).then(function(){
    applyRoute();
    setTimeout(hideSplash, 820);
    registerPWA();
  }).catch(function(err){
    console.warn('[AG] boot',err);
    applyRoute();
    hideSplash();
  });
}
AG.applyRoute=applyRoute;
AG.reloadAll=reloadAll;
AG.refreshBadges=refreshBadges;
AG.go=function(v,id,o){ AG.views.go(v,id,o); };
window.addEventListener('load',function(){ if(!window.__agBooted){ window.__agBooted=true; } });
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();

</script>
</body>
