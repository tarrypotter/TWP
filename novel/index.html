/* ============================================================
   ABYSSAL GRIMOIRE — single-file novel platform
   design tokens · shell · base
   ============================================================ */
:root{
  --ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --paper:#F1ECE2;
  --paper-2:#FBF8F2;
  --paper-3:#E7E0D2;
  --ink:#14120F;
  --ink-2:#5B554A;
  --ink-3:#8E8778;
  --line:rgba(20,18,15,.115);
  --line-2:rgba(20,18,15,.06);
  --blood:#AF3226;
  --blood-2:#C8473A;
  --blood-soft:rgba(175,50,38,.10);
  --gold:#9C7B38;
  --obsidian:#0D0C0B;
  --obsidian-2:#171512;
  --on-dark:#EFE8DA;

  --r-lg:22px; --r:16px; --r-sm:11px;
  --shadow:0 18px 44px -34px rgba(20,18,15,.75);
  --shadow-2:0 26px 70px -40px rgba(20,18,15,.85);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.42,.5,1);
  --nav:62px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#0C0C0D;
  --paper-2:#141416;
  --paper-3:#1D1D20;
  --ink:#EFEAE0;
  --ink-2:#A29B8E;
  --ink-3:#736D63;
  --line:rgba(239,234,224,.13);
  --line-2:rgba(239,234,224,.07);
  --blood:#E2685A;
  --blood-2:#EE8375;
  --blood-soft:rgba(226,104,90,.14);
  --gold:#C9A55E;
  --obsidian:#08080A;
  --obsidian-2:#101012;
  --on-dark:#EFE8DA;
  --shadow:0 20px 50px -34px rgba(0,0,0,.9);
  --shadow-2:0 30px 80px -40px rgba(0,0,0,.95);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper);touch-action:manipulation}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
body[data-lock="1"]{overflow:hidden}
h1,h2,h3,h4,p,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.em-sm{margin:0 auto;color:var(--ink-3);opacity:.4}
.em-sm svg{width:100%;height:100%}
::selection{background:rgba(175,50,38,.18)}
:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.u-mono{font-family:var(--mono);font-variant-ligatures:none}
.u-serif{font-family:var(--serif)}
.u-num{font-variant-numeric:tabular-nums}
.u-clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.u-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u-clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------------- app shell ---------------- */
.app{
  position:relative;display:flex;flex-direction:column;
  height:100vh;height:100dvh;width:100%;max-width:100%;
  margin:0 auto;overflow:hidden;
  background:var(--paper);
}
.app::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -18%,rgba(175,50,38,.055),transparent 62%),
    radial-gradient(90% 40% at 100% 104%,rgba(156,123,56,.075),transparent 60%);
}
html[data-theme="dark"] .app::before{opacity:.75}
.stage{position:relative;flex:1 1 auto;min-height:0;z-index:1}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.is-on{display:flex;animation:viewIn .28s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vscroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom));
  scrollbar-width:thin;
}
.vscroll::-webkit-scrollbar{width:6px}
.vscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.vscroll.is-bare{padding-bottom:24px}

/* ---------------- dock ---------------- */
.dock{
  position:relative;z-index:40;flex:0 0 auto;
  display:flex;align-items:stretch;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--paper-2) 88%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .3s var(--ease),opacity .2s linear;
}
html[data-theme="dark"] .dock{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
body[data-chrome="off"] .dock{transform:translateY(120%);opacity:0;pointer-events:none}
.dock-i{
  position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:48px;padding:3px 2px;border-radius:14px;color:var(--ink-3);
  transition:color .18s linear,transform .18s var(--spring);
}
.dock-i svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock-i span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.dock-i.is-on{color:var(--ink)}
.dock-i.is-on::before{
  content:'';position:absolute;top:-1px;width:16px;height:2px;border-radius:2px;background:var(--blood);
}
.dock-i:active{transform:scale(.94)}
.dock-i .dot{position:absolute;top:6px;right:calc(50% - 15px);width:5px;height:5px;border-radius:50%;background:var(--blood)}

/* ---------------- splash ---------------- */
.splash{
  position:fixed;inset:0;z-index:9000;display:grid;place-items:center;
  background:radial-gradient(80% 60% at 50% 38%,#17140f 0%,#0a0908 58%,#050504 100%);
  color:#EFE7D6;transition:opacity .55s var(--ease),visibility .55s;
}
.splash.is-gone{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:0 28px}
.splash-em{width:104px;height:104px;color:#E7DDC6;filter:drop-shadow(0 0 22px rgba(175,50,38,.35));animation:sigil 1.4s var(--ease) both}
.splash-em svg{width:100%;height:100%}
@keyframes sigil{from{opacity:0;transform:scale(.86) rotate(-6deg)}to{opacity:1;transform:none}}
.splash-name{font-family:var(--ui);font-weight:800;letter-spacing:.26em;font-size:15px;margin-left:.26em}
.splash-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;color:#9A8F79;text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash-name,.splash-sub{animation:fadeUp .7s var(--ease) .18s both}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  background:color-mix(in srgb,var(--paper) 95%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
}
.topbar.is-line{border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.brand-em{width:30px;height:30px;flex:0 0 auto;color:var(--ink)}
.brand-em svg{width:100%;height:100%}
.brand-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand-word{font-size:11.5px;font-weight:800;letter-spacing:.2em;line-height:1.15;white-space:nowrap}
.brand-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{
  display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--ink-2);
  transition:background .16s linear,color .16s linear,transform .16s var(--spring);
}
.icobtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icobtn:hover{background:var(--line-2);color:var(--ink)}
.icobtn:active{transform:scale(.92)}
.icobtn.is-on{color:var(--blood)}

/* ---------------- buttons ---------------- */
.btn-ink,.btn-line,.btn-ghost,.btn-blood{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:44px;padding:0 18px;border-radius:13px;font-size:14px;font-weight:700;letter-spacing:-.01em;
  transition:transform .16s var(--spring),background .16s linear,color .16s linear,border-color .16s linear;
}
.btn-ink{background:var(--ink);color:var(--paper-2)}
.btn-ink:hover{background:color-mix(in srgb,var(--ink) 88%,var(--blood))}
.btn-blood{background:var(--blood);color:#fff}
.btn-line{border:1px solid var(--line);color:var(--ink);background:transparent}
.btn-line:hover{background:var(--line-2)}
.btn-ghost{color:var(--ink-2);height:38px;padding:0 12px;font-weight:600}
.btn-ink:active,.btn-line:active,.btn-blood:active{transform:scale(.97)}
.btn-ink svg,.btn-line svg,.btn-blood svg,.btn-ghost svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn-wide{width:100%}
.btn-ink:disabled,.btn-line:disabled{opacity:.45;pointer-events:none}

/* ---------------- covers ---------------- */
.cov{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  container-type:inline-size;
  aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;isolation:isolate;
  background:var(--paper-3);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 26px -20px rgba(20,18,15,.9);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.cov::after{ /* paper grain + edge light */
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 28%,rgba(0,0,0,.18));
  mix-blend-mode:overlay;
}
.cov-frame{position:absolute;inset:8px;border:1px solid currentColor;opacity:.28;border-radius:4px;pointer-events:none}
.cov-mark{
  position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);
  text-align:center;font-family:var(--serif);font-weight:700;line-height:1;letter-spacing:-.02em;
  color:currentColor;font-size:44cqw;
}
.cov-kick{
  position:absolute;top:9px;left:10px;right:10px;z-index:1;
  font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;
  color:currentColor;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cov-auth{
  position:relative;z-index:1;padding:0 10px 9px;font-size:9.5px;line-height:1.3;color:currentColor;opacity:.7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cov.m-rule .cov-mark::before{content:'';display:block;width:26px;height:1px;margin:0 auto 10px;background:currentColor;opacity:.45}
.cov.m-seal .cov-mark{font-family:var(--serif)}
.cov.m-seal::before{
  content:'';position:absolute;left:50%;top:34%;width:64%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-4deg);
  border:2px solid var(--blood);border-radius:6px;opacity:.85;
}
.cov.m-arc::before{
  content:'';position:absolute;left:-18%;top:-8%;width:96%;aspect-ratio:1;border-radius:50%;
  border:13px solid rgba(255,255,255,.18);
}
.cov.m-grid::before{
  content:'';position:absolute;inset:0;opacity:.30;
  background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);
  background-size:18px 18px;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent 78%);
}
.cov.m-ring::before{
  content:'';position:absolute;left:50%;top:36%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:1px solid currentColor;border-radius:50%;opacity:.35;box-shadow:0 0 0 9px rgba(255,255,255,.05);
}
.cov.m-window::before{
  content:'';position:absolute;left:14%;right:14%;top:12%;height:44%;border:1px solid currentColor;opacity:.35;
  background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);
}
.cov.m-stripes::before{
  content:'';position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(105deg,currentColor 0 1px,transparent 1px 9px);
}
.cov-mark.vert{writing-mode:vertical-rl;text-orientation:upright;top:50%;letter-spacing:.14em}

/* ---------------- chips ---------------- */
.chips{
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:2px 0;margin:0;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:33px;padding:0 13px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  transition:background .16s linear,color .16s linear,border-color .16s linear,transform .16s var(--spring);
}
.chip:active{transform:scale(.96)}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}

.chip-mood.is-on{background:var(--blood-soft);border-color:color-mix(in srgb,var(--blood) 34%,transparent);color:var(--blood)}
html[data-theme="dark"] .chip-mood.is-on{color:var(--blood-2)}
.chip-mood.is-on::before{content:''}

/* ---------------- section ---------------- */
.sec{padding:26px 0 4px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:0 20px;margin-bottom:13px}
.sec-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.sec-title{font-size:17px;font-weight:800;letter-spacing:-.03em;flex:1 1 auto}
.sec-link{font-size:12px;font-weight:600;color:var(--ink-3);display:inline-flex;align-items:center;gap:3px}
.sec-link svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------------- toast ---------------- */
.toastbar{
  position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:8800;display:flex;align-items:center;gap:9px;
  max-width:min(92vw,420px);padding:11px 16px;border-radius:13px;
  background:#141210;color:#F3EDE1;font-size:13px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.7);
  opacity:0;pointer-events:none;transition:opacity .22s linear,transform .3s var(--spring);
}
.toastbar.is-on{opacity:1;transform:translate(-50%,0)}
.toastbar svg{width:16px;height:16px;stroke:#E2685A;fill:none;stroke-width:2}
body[data-chrome="off"] .toastbar{bottom:34px}
body[data-lock="1"] .toastbar{bottom:calc(154px + env(safe-area-inset-bottom))}

/* ---------------- empty ---------------- */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  padding:44px 34px;color:var(--ink-3);
}
.empty-em{width:46px;height:46px;opacity:.5;color:var(--ink-3)}
.empty-em svg{width:100%;height:100%}
.empty b{font-size:14px;font-weight:700;color:var(--ink-2)}
.empty p{font-size:12.5px;line-height:1.65;max-width:260px}

/* ---------------- boot --------------- */
.boot{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.2em}

/* full-screen views (detail / editor) hide the dock */
.app.is-full .dock{display:none}
.app.is-full .vscroll{padding-bottom:16px}

/* modal sizing */
.modal .modal-dialog{max-width:420px;margin:14px auto;padding:0}

/* small covers: drop the kicker, center the mark */
@container (max-width:92px){
  .cov-kick{display:none}
  .cov-mark{top:46%}
  .cov-auth{font-size:8.5px;padding-bottom:7px;opacity:.55}
}

/* ============================================================
   views — home / search / detail / library / studio / settings
   ============================================================ */

/* ---------- home: continue ---------- */
.home-pad{padding:0 20px}
.cont{
  display:flex;align-items:center;gap:13px;padding:12px;border-radius:var(--r);
  background:var(--paper-2);border:1px solid var(--line-2);box-shadow:var(--shadow);
  text-align:left;width:100%;
}
.cont .cov{width:52px;flex:0 0 52px;border-radius:8px}
.cont-b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.cont-k{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--blood);text-transform:uppercase}
.cont-t{font-size:14px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont-m{font-size:11.5px;color:var(--ink-3)}
.bar{position:relative;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--blood);border-radius:3px;transition:width .5s var(--ease)}
.cont-go{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper-2)}
.cont-go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- home: hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:radial-gradient(120% 90% at 84% 8%,#26221b 0%,#141210 46%,#0a0908 100%);
  color:var(--on-dark);padding:22px 20px 18px;box-shadow:var(--shadow-2);
  isolation:isolate;
}
.hero-sig{position:absolute;right:-30px;top:-26px;width:190px;height:190px;color:rgba(239,232,218,.10);pointer-events:none}
.hero-sig svg{width:100%;height:100%}
.hero::after{
  content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(239,232,218,.35),transparent);
}
.hero-k{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:#B9A98A;text-transform:uppercase}
.hero-k::after{content:'';flex:1 1 auto;height:1px;background:rgba(239,232,218,.18)}
.hero-t{
  position:relative;font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.22;letter-spacing:-.03em;
  margin:14px 0 9px;text-wrap:balance;
}
.hero-t em{font-style:normal;color:#E2685A}
.hero-b{position:relative;font-size:12.8px;line-height:1.66;color:#B6ABA0;max-width:30ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-f{position:relative;display:flex;align-items:center;gap:12px;margin-top:18px}
.hero-meta{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:#8E8375;letter-spacing:.06em;flex:1 1 auto}
.hero-meta i{width:2px;height:2px;border-radius:50%;background:#5C5449}
.hero-cta{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;
  background:var(--on-dark);color:#141210;font-size:13px;font-weight:800;letter-spacing:-.01em;
  transition:transform .18s var(--spring),background .18s linear;
}
.hero-cta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.hero-cta:active{transform:scale(.96)}
.hero-rate{display:flex;align-items:center;gap:4px;font-size:11.5px;color:#C9BCA4;font-weight:700}
.hero-rate svg{width:12px;height:12px;fill:#D8A657;stroke:none}

/* ---------- stars ---------- */
.stars{display:inline-flex;align-items:center;gap:2px}
.stars svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:1.5}
.stars .on{fill:var(--gold);stroke:var(--gold)}
.stars-wrap{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600}
.stars-wrap b{color:var(--ink);font-weight:800}

/* interactive rating */
.rate{display:flex;align-items:center;gap:3px}
.rate button{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;transition:transform .16s var(--spring)}
.rate button:active{transform:scale(.88)}
.rate svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.4;transition:fill .12s linear}
.rate svg.on{fill:var(--gold)}
.rate.is-mine svg{stroke:var(--gold)}

/* ---------- rank ---------- */
.rank-list{padding:0 20px;display:flex;flex-direction:column}
.rank{
  display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);text-align:left;width:100%;
}
.rank:last-child{border-bottom:0}
.rank-no{flex:0 0 20px;font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink-3);line-height:1}
.rank-no.top{color:var(--blood)}
.rank .cov{width:42px;flex:0 0 42px;border-radius:7px;aspect-ratio:3/4}
.rank-b{flex:1 1 auto;min-width:0}
.rank-t{font-size:13.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-s{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:5px}
.rank-s i{width:2px;height:2px;border-radius:50%;background:var(--ink-3);opacity:.6}
.rank-up{font-family:var(--mono);font-size:9px;color:var(--blood);letter-spacing:.06em}

/* ---------- shelf grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 13px;padding:0 20px}
.wk{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.wk:active .cov{transform:scale(.985)}
@media (hover:hover){.wk:hover .cov{transform:translateY(-2px);box-shadow:0 20px 34px -24px rgba(20,18,15,.9)}}
.wk-t{font-size:13.5px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.wk-m{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);min-width:0}
.wk-m .dot{width:2px;height:2px;border-radius:50%;background:var(--ink-3);opacity:.55;flex:0 0 auto}
.wk-m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:3px;
  height:19px;padding:0 7px;border-radius:6px;background:rgba(10,9,8,.66);color:#F0E7D6;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
}
.badge.blood{background:var(--blood);color:#fff}
.badge.end{left:auto;right:8px}

/* ---------- first sentence cards ---------- */
.hrail{
  display:flex;gap:11px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
}
.hrail::-webkit-scrollbar{display:none}
.fcard{
  flex:0 0 78%;max-width:310px;scroll-snap-align:start;text-align:left;
  display:flex;flex-direction:column;gap:10px;padding:17px 16px 14px;min-height:150px;
  border-radius:var(--r);background:var(--paper-2);border:1px solid var(--line-2);box-shadow:var(--shadow);
}
.fcard-q{font-family:var(--serif);font-size:15px;line-height:1.62;letter-spacing:-.01em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.fcard-f{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.fcard-f b{color:var(--ink-2);font-weight:700}
.fcard-q::first-letter{font-size:1.05em}

/* ---------- search ---------- */
.searchbar{position:relative;display:flex;align-items:center;gap:9px;padding:calc(10px + env(safe-area-inset-top)) 20px 12px}
.searchbox{
  flex:1 1 auto;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;
  border-radius:13px;background:var(--paper-2);border:1px solid var(--line);
}
.searchbox svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8;flex:0 0 auto}
.searchbox input{
  flex:1 1 auto;min-width:0;border:0;background:none;outline:0;font-size:14.5px;letter-spacing:-.01em;
}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.searchbox .clr{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-2);flex:0 0 auto}
.searchbox .clr svg{width:12px;height:12px;stroke-width:2.4}
.s-note{padding:0 20px 10px;font-size:12px;color:var(--ink-3)}
.s-note b{color:var(--ink-2)}
.s-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line-2);text-align:left;width:100%}
.s-row .cov{width:40px;flex:0 0 40px;border-radius:7px}
.s-row-b{flex:1 1 auto;min-width:0}
.s-row-t{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.s-row-s{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
mark{background:transparent;color:var(--blood);font-weight:800}

/* ---------- detail ---------- */
.dt-top{display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dt-top .ttl{flex:1 1 auto;font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:center;padding:0 6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-hero{display:flex;gap:16px;padding:12px 20px 18px}
.dt-hero .cov{width:118px;flex:0 0 118px;border-radius:12px}
.dt-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:2px}
.dt-kicker{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--blood);text-transform:uppercase}
.dt-title{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.22;letter-spacing:-.03em;text-wrap:balance}
.dt-author{font-size:12px;color:var(--ink-3)}
.dt-facts{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:2px}
.dt-fact{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.03em}
.dt-fact svg{width:12px;height:12px;stroke:var(--ink-3);fill:none;stroke-width:1.7}
.dt-blurb{padding:0 20px;font-family:var(--serif);font-size:14.5px;line-height:1.75;color:var(--ink-2);letter-spacing:-.01em}
.dt-tags{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 0}
.tag{height:25px;display:inline-flex;align-items:center;padding:0 9px;border-radius:7px;background:var(--line-2);
  font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.04em}
.dt-act{display:flex;gap:8px;padding:18px 20px 6px}
.dt-act .btn-ink{flex:1 1 auto}
.dt-act .btn-line{flex:0 0 46px;padding:0;border-radius:13px}
.dt-act .btn-line svg{width:20px;height:20px}
.dt-act .btn-line.is-on{background:var(--blood-soft);border-color:color-mix(in srgb,var(--blood) 30%,transparent);color:var(--blood)}
.dt-act .btn-line.is-on svg{fill:currentColor}
.dt-rate{display:flex;align-items:center;gap:12px;margin:12px 20px 0;padding:13px 14px;border-radius:var(--r);
  background:var(--paper-2);border:1px solid var(--line-2)}
.dt-rate-l{flex:1 1 auto;min-width:0}
.dt-rate-l b{display:block;font-size:12.5px;font-weight:700}
.dt-rate-l span{font-size:11px;color:var(--ink-3)}
.toc{padding:6px 20px 10px}
.toc-head{display:flex;align-items:center;gap:8px;margin:16px 0 6px}
.toc-head .sec-kicker{flex:1 1 auto}
.toc-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line-2)}
.toc-i:last-child{border-bottom:0}
.toc-no{flex:0 0 22px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.toc-n{flex:1 1 auto;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.toc-l{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.toc-i.is-read .toc-no{color:var(--blood)}
.quote-block{margin:18px 20px 0;padding:15px 16px;border-left:2px solid var(--blood);background:var(--line-2);
  font-family:var(--serif);font-size:13.5px;line-height:1.7;color:var(--ink-2);border-radius:0 10px 10px 0}

/* ---------- library ---------- */
.seg{display:flex;gap:4px;padding:4px;margin:2px 20px 6px;border-radius:12px;background:var(--line-2)}
.seg-b{flex:1 1 0;height:34px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;
  transition:background .18s linear,color .18s linear,box-shadow .18s linear;white-space:nowrap}
.seg-b.is-on{background:var(--paper-2);color:var(--ink);box-shadow:0 2px 8px -4px rgba(20,18,15,.35);font-weight:700}
.seg-scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;margin:2px 20px 6px;border-radius:12px;background:var(--line-2)}
.seg-scroll::-webkit-scrollbar{display:none}
.seg-scroll .seg-b{flex:0 0 auto;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 20px 0}
.stat{padding:14px;border-radius:var(--r);background:var(--paper-2);border:1px solid var(--line-2)}
.stat-k{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.stat-v{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1}
.stat-v small{font-size:12px;font-family:var(--ui);font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.stat-s{font-size:11px;color:var(--ink-3);margin-top:5px}
.chart{display:flex;align-items:flex-end;gap:6px;height:78px;padding:14px 20px 0}
.chart-d{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-b{width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--line);min-height:3px;transition:height .5s var(--ease)}
.chart-d.on .chart-b{background:var(--blood)}
.chart-l{font-family:var(--mono);font-size:8.5px;color:var(--ink-3)}
.lib-row{display:flex;align-items:center;gap:12px;padding:10px 20px;text-align:left;width:100%}
.lib-b{flex:1 1 auto;min-width:0}
.lib-t{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.lib-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.lib .cov{width:44px;flex:0 0 44px;border-radius:7px}
.hl-card{margin:0 20px 10px;padding:14px;border-radius:var(--r);background:var(--paper-2);border:1px solid var(--line-2);text-align:left;width:calc(100% - 40px)}
.hl-q{font-family:var(--serif);font-size:14px;line-height:1.7;letter-spacing:-.01em;
  background:linear-gradient(transparent 58%,var(--hl-c) 58%);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hl-n{margin-top:9px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.hl-n svg{width:13px;height:13px;stroke:var(--blood);fill:none;stroke-width:1.8;flex:0 0 auto;margin-top:2px}
.hl-f{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em}
.hl-f .del{margin-left:auto;color:var(--ink-3);font-family:var(--ui);font-size:11px}

/* ---------- studio ---------- */
.mine{display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;text-align:left;border-bottom:1px solid var(--line-2)}
.mine-b{flex:1 1 auto;min-width:0}
.mine-t{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.mine-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.mine .cov{width:42px;flex:0 0 42px;border-radius:7px}
.mine-act{display:flex;gap:2px;flex:0 0 auto}
.mine-act .icobtn{width:32px;height:32px;border-radius:9px}
.mine-act svg{width:16px;height:16px}
.fab{
  position:absolute;right:18px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));z-index:35;
  display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 18px;border-radius:26px;
  background:var(--ink);color:var(--paper-2);font-size:13.5px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 16px 34px -18px rgba(20,18,15,.8);
  transition:transform .2s var(--spring),opacity .2s linear;
}
.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.fab:active{transform:scale(.95)}
body[data-chrome="off"] .fab{transform:translateY(90px);opacity:0;pointer-events:none}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px;padding:0 20px;margin-bottom:16px}
.field>label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.inp,.ta,.sel{
  width:100%;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);
  border-radius:12px;padding:12px 13px;font-size:14.5px;line-height:1.6;letter-spacing:-.01em;
  transition:border-color .16s linear,box-shadow .16s linear;
}
.inp:focus,.ta:focus,.sel:focus{outline:0;border-color:color-mix(in srgb,var(--blood) 45%,transparent);box-shadow:0 0 0 3px var(--blood-soft)}
.ta{resize:vertical;min-height:120px}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.palette{display:flex;gap:9px;flex-wrap:wrap}
.pal{width:38px;height:52px;border-radius:8px;border:2px solid transparent;position:relative;overflow:hidden;transition:transform .16s var(--spring)}
.pal:active{transform:scale(.94)}
.pal.is-on{border-color:var(--ink);box-shadow:0 0 0 3px var(--paper)}
.chap-box{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:var(--paper-2)}
.chap-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chap-h b{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;flex:1 1 auto}
.chap-h .icobtn{width:30px;height:30px;border-radius:8px}
.chap-h .icobtn svg{width:15px;height:15px}
.counter{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right;letter-spacing:.04em}
.editor-bar{display:flex;gap:8px;padding:6px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);
  background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.editor-bar .btn-ink{flex:1 1 auto}
.edit-pad{padding-bottom:12px}

/* ---------- settings ---------- */
.set-g{margin:4px 20px 22px}
.set-g>h4{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;margin:0 0 9px}
.set-r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2);width:auto;text-align:left}
.set-r:last-child{border-bottom:0}
.set-l{flex:1 1 auto;min-width:0}
.set-l b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.set-l span{font-size:11.5px;color:var(--ink-3)}
.set-r>svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.set-r.is-danger b{color:var(--blood)}
.switch{position:relative;flex:0 0 44px;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .2s linear}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .24s var(--spring)}
.switch.is-on{background:var(--blood)}
.switch.is-on::after{transform:translateX(18px)}
.themegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{border-radius:11px;padding:7px 6px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center;transition:border-color .16s linear,transform .16s var(--spring)}
.th:active{transform:scale(.96)}
.th.is-on{border-color:var(--blood)}
.th-p{width:100%;height:34px;border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-size:14px}
.th span{font-size:10.5px;color:var(--ink-3);font-weight:600}
.th.is-on span{color:var(--ink)}
.set-note{font-size:11.5px;line-height:1.6;color:var(--ink-3);padding:0 20px 8px}

/* ---------- page headers & sorts ---------- */
.ptitle{font-size:20px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.psub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.sorts{display:flex;gap:11px;align-items:center}
.sort-b{position:relative;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em;padding:2px 0;transition:color .16s linear}
.sort-b.is-on{color:var(--ink)}
.sort-b.is-on::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1.5px;border-radius:2px;background:var(--blood)}
.gen-wrap{padding:0 20px;position:relative}
.gen-wrap::after{content:'';position:absolute;top:0;bottom:0;right:0;width:26px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--paper))}

/* detail rating (label above stars) */
.dt-rate{flex-direction:column;align-items:flex-start;gap:6px}
.dt-rate-l b{font-size:12.5px}
.dt-rate-l span{font-size:11px}
.dt-rate .rate{margin-left:-9px;margin-top:-2px}

/* ============================================================
   reader · sheets · bootstrap skin · responsive
   ============================================================ */
.reader{
  position:fixed;inset:0;z-index:1200;display:flex;flex-direction:column;
  background:var(--r-bg);color:var(--r-ink);
  visibility:hidden;opacity:0;transform:translateY(10px);
  transition:opacity .26s var(--ease),transform .3s var(--ease),visibility .3s;
}
.reader.is-open{visibility:visible;opacity:1;transform:none}
.reader[data-th="white"]{--r-bg:#FFFFFF;--r-ink:#17161A;--r-sub:#7B7880;--r-line:rgba(23,22,26,.10);--r-panel:#FFFFFF;--r-frame:#EDEBEF}
.reader[data-th="cream"]{--r-bg:#F6F1E4;--r-ink:#2A241B;--r-sub:#82755F;--r-line:rgba(42,36,27,.11);--r-panel:#FBF7EC;--r-frame:#E9E0CB}
.reader[data-th="sepia"]{--r-bg:#EBDCC0;--r-ink:#3B2F1E;--r-sub:#8A7457;--r-line:rgba(59,47,30,.14);--r-panel:#F0E4CB;--r-frame:#DCC9A5}
.reader[data-th="dark"]{--r-bg:#07070A;--r-ink:#D9D4C8;--r-sub:#776F63;--r-line:rgba(217,212,200,.13);--r-panel:#101014;--r-frame:#1B1B20}

.r-bar{
  position:absolute;left:0;right:0;z-index:12;
  background:color-mix(in srgb,var(--r-bg) 93%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  transition:transform .3s var(--ease),opacity .22s linear;
}
.r-top{
  top:0;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  border-bottom:1px solid var(--r-line);
}
.r-ttl{flex:1 1 auto;min-width:0;text-align:center;padding:0 4px}
.r-ttl b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-ttl span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--r-sub);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-top .icobtn{color:var(--r-ink);width:36px;height:36px}
.r-top .icobtn svg{stroke:currentColor}
.r-top .icobtn.is-on{color:var(--blood)}
.r-top .icobtn.is-on svg{fill:currentColor}
body[data-chrome="off"] .r-top{transform:translateY(-104%);opacity:0}
body[data-chrome="off"] .r-bottom{transform:translateY(112%);opacity:0}

.r-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scroll-padding-top:80px;
}
.r-body::-webkit-scrollbar{width:0}
.r-wrap{
  max-width:680px;margin:0 auto;
  padding:calc(74px + env(safe-area-inset-top)) var(--r-mx,22px) 40vh;
}
.r-head{padding:6px 0 26px;margin-bottom:22px;border-bottom:1px solid var(--r-line)}
.r-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--r-sub);text-transform:uppercase}
.r-h1{font-family:var(--serif);font-size:29px;line-height:1.24;letter-spacing:-.03em;font-weight:700;margin:12px 0 10px;text-wrap:balance}
.r-h2{font-size:13px;color:var(--r-sub);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.r-h2 .dot{width:2px;height:2px;border-radius:50%;background:var(--r-sub);opacity:.6}
.r-ch{display:flex;align-items:center;gap:8px;margin:34px 0 14px}
.r-ch::after{content:'';flex:1 1 auto;height:1px;background:var(--r-line)}
.r-ch b{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--r-sub);text-transform:uppercase;font-weight:500}
.r-p{
  position:relative;margin:0 0 1.18em;font-size:var(--r-fs,18px);line-height:var(--r-lh,1.9);
  letter-spacing:-.003em;word-break:keep-all;overflow-wrap:anywhere;
  font-family:var(--r-font,var(--serif));color:var(--r-ink);
  text-wrap:pretty;
  transition:background .2s linear;
  scroll-margin-top:86px;
}
.r-p::selection{background:rgba(175,50,38,.25)}
.r-p .em{font-weight:700;color:#B8352A}
.reader[data-th="dark"] .r-p .em{color:#EE8375}
.r-p .hl{background:linear-gradient(transparent 52%,var(--hl-c,rgba(244,214,96,.55)) 52%);padding:0 .04em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.reader .hl-1{--hl-c:rgba(242,218,114,.72)}
.reader .hl-2{--hl-c:rgba(243,179,162,.7)}
.reader .hl-3{--hl-c:rgba(169,214,190,.72)}
.reader[data-th="dark"] .hl-1{--hl-c:rgba(242,218,114,.26)}
.reader[data-th="dark"] .hl-2{--hl-c:rgba(243,179,162,.24)}
.reader[data-th="dark"] .hl-3{--hl-c:rgba(169,214,190,.24)}
.r-p.is-sel{background:color-mix(in srgb,var(--r-ink) 7%,transparent);border-radius:6px;box-shadow:0 0 0 8px color-mix(in srgb,var(--r-ink) 7%,transparent)}
.r-p .memo-dot{
  display:inline-flex;align-items:center;justify-content:center;margin-left:.22em;vertical-align:.12em;
  width:1.05em;height:1.05em;border-radius:50%;background:var(--blood);color:#fff;font-size:.58em;
  font-family:var(--ui);font-weight:700;border:0;
}
.r-scene{display:flex;justify-content:center;gap:9px;margin:2.2em 0;color:var(--r-sub);letter-spacing:.5em;font-size:12px}
.r-scene i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55}
.r-end{margin-top:34px;padding:26px 0 0;border-top:1px solid var(--r-line);text-align:center}
.r-end-t{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:-.02em}
.r-end-s{font-size:12px;color:var(--r-sub);margin-top:6px}
.r-end .btn-ink{background:var(--r-ink);color:var(--r-bg);margin-top:14px}
.r-next{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px;border-radius:14px;border:1px solid var(--r-line);text-align:left;width:100%}
.r-next .cov{width:40px;flex:0 0 40px;border-radius:6px}
.r-next-b{flex:1 1 auto;min-width:0}
.r-next-k{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--r-sub);text-transform:uppercase}
.r-next-t{font-size:13px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.r-bottom{
  bottom:0;padding:0 12px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--r-line);
}
.r-prog{height:2px;background:var(--r-line);margin:0 -12px 9px;position:relative;overflow:hidden}
.r-prog i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .35s linear}
.r-tools{display:flex;align-items:center;justify-content:space-between;gap:6px}
.r-tools .icobtn{color:var(--r-ink);width:40px;height:40px}
.r-tools .icobtn svg{stroke:currentColor}
.r-pct{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--r-sub);display:flex;align-items:center;gap:6px}
.r-pct b{color:var(--r-ink);font-weight:500}

.r-sel{
  position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translate(-50%,18px);
  z-index:1300;display:flex;align-items:center;gap:2px;padding:6px;border-radius:16px;
  background:var(--r-panel);border:1px solid var(--r-line);box-shadow:0 18px 44px -22px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .2s linear,transform .28s var(--spring);
}
.r-sel.is-on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.r-sel .sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid transparent;transition:transform .16s var(--spring)}
.r-sel .sw:active{transform:scale(.88)}
.r-sel .sw.is-on{border-color:var(--r-ink)}
.r-sel .sep{width:1px;height:22px;background:var(--r-line);margin:0 4px}
.r-sel .act{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 8px;border-radius:10px;color:var(--r-ink);font-size:9px;font-weight:600;white-space:nowrap}
.r-sel .act svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.r-sel .act:active{background:var(--r-line)}

/* sheets (bootstrap offcanvas skinned) */
.sheet.offcanvas{
  background:var(--paper-2);color:var(--ink);border:1px solid var(--line);
  border-radius:22px 22px 0 0;box-shadow:0 -20px 60px -30px rgba(0,0,0,.5);
  max-height:86dvh;
}
.sheet.offcanvas-bottom{height:auto}
.sheet .offcanvas-body{padding:0 0 calc(14px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;max-height:86dvh}
.sheet-grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 2px}
.sheet-h{display:flex;align-items:center;gap:8px;padding:8px 20px 12px}
.sheet-h b{font-size:14.5px;font-weight:800;letter-spacing:-.02em;flex:1 1 auto}
.sheet-h .icobtn{width:32px;height:32px;border-radius:9px}
.sheet-h .icobtn svg{width:16px;height:16px}
.sh-row{display:flex;align-items:center;gap:12px;padding:12px 20px}
.sh-l{flex:0 0 62px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.sh-c{flex:1 1 auto;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bstep{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bstep button{width:34px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.bstep button:active{background:var(--line-2)}
.bstep svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.bstep span{min-width:34px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink)}
.shtoggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shtoggle button{padding:0 13px;height:32px;font-size:12px;font-weight:600;color:var(--ink-3)}
.shtoggle button.is-on{background:var(--ink);color:var(--paper-2)}
.tsw{display:flex;gap:7px}
.tsw button{width:40px;height:40px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--serif);font-size:13px;transition:transform .16s var(--spring)}
.tsw button.is-on{border-color:var(--blood);box-shadow:0 0 0 2px var(--paper-2),0 0 0 3px var(--blood)}
.tsw button:active{transform:scale(.93)}
.marg{display:flex;align-items:center;gap:10px;flex:1 1 auto}
.marg span{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:0 0 auto}
.marg input[type=range]{flex:1 1 auto;accent-color:var(--blood);height:22px}
.toc-sheet .toc-i{padding:12px 20px}

/* bootstrap modal skin */
.modal-backdrop.show{opacity:.42;background:#0A0908}
.modal-dialog{bottom:0;margin:0;position:fixed;left:0;right:0;max-width:560px;margin-inline:auto}
.modal-dialog.modal-dialog-centered{margin:auto;padding:16px}
.modal .modal-content{
  background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 -20px 60px -30px rgba(0,0,0,.6);
}
.modal .modal-body{padding:22px 20px 18px}
.modal .modal-footer{border:0;padding:0 20px 18px;gap:8px;flex-wrap:nowrap}
.modal .modal-footer .btn{flex:1 1 auto;height:44px;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--line)}
.modal .m-k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--blood);text-transform:uppercase}
.modal .m-t{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:7px 0 6px}
.modal .m-s{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.modal .m-area{width:100%;margin-top:12px;min-height:96px}
.memo-quote{font-family:var(--serif);font-size:13px;line-height:1.65;color:var(--ink-2);padding:10px 12px;border-left:2px solid var(--line);margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn-close{filter:none;opacity:.5}
.btn-close:hover{opacity:.9}

/* responsive */
@media (min-width:600px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}
  .hero-t{font-size:34px}
  .fcard{flex-basis:46%}
}
@media (min-width:900px){
  .app{max-width:1120px;box-shadow:0 0 0 1px var(--line-2)}
  .dock{
    align-self:center;width:min(430px,calc(100% - 48px));margin-bottom:16px;border-radius:20px;
    padding:6px 8px;border:1px solid var(--line);box-shadow:0 18px 40px -26px rgba(20,18,15,.55);
    background:color-mix(in srgb,var(--paper-2) 82%,transparent);
  }
  .vscroll{padding-bottom:28px}
  .home-pad,.sec-head,.grid,.rank-list,.chips,.gen-wrap,.dt-hero,.dt-blurb,.dt-tags,.dt-act,.toc,.searchbar,.s-note,.seg,.stats,.chart,.lib-row,.hl-card,.mine,.field,.set-g,.dt-rate{max-width:880px}
  .home-pad,.sec-head,.rank-list,.dt-hero,.dt-blurb,.dt-tags,.dt-act,.toc,.searchbar,.s-note,.seg,.stats,.chart,.lib-row,.hl-card,.mine,.field,.set-g,.dt-rate{margin-left:auto;margin-right:auto}
  .grid{margin-left:auto;margin-right:auto}
  .chips{margin-left:auto;margin-right:auto;justify-content:flex-start}
  .r-wrap{max-width:660px;padding-top:calc(84px + env(safe-area-inset-top))}
  .reader .r-top,.reader .r-bottom{left:50%;transform:translateX(-50%);width:min(760px,100%)}
  body[data-chrome="off"] .r-top{transform:translate(-50%,-104%)}
  body[data-chrome="off"] .r-bottom{transform:translate(-50%,112%)}
  .r-sel{bottom:calc(72px + env(safe-area-inset-bottom))}
}
@media (min-width:1100px){
  .hero{padding:28px 26px 24px}
  .hero-t{font-size:38px}
  .hero-b{max-width:42ch;-webkit-line-clamp:3}
  .hrail{max-width:880px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* overlay stacking: reader(1200) < sheets(1400) < dialogs(1500) */
.offcanvas{z-index:1400}
.offcanvas-backdrop{z-index:1390}
.modal{z-index:1500}
.modal-backdrop{z-index:1490}

</style>

<div class="app" id="app">
  <div class="stage" id="stage">

    <!-- HOME -->

var SEED = {"version":4,"works":[{"id":"doves","title":"비둘기와 AK-47","author":"익명","genre":"블랙코미디","mood":"서늘함","tags":["실업","옥상","비둘기","아이러니"],"readMin":5,"blurb":"회사에서 나온 지 석 달. 어느 평일 오후, 옥상에 비둘기 열한 마리가 앉아 있었다. 내가 회사에 있던 햇수와 같았다. 나는 그게 우연이라고 믿기로 했다.","rating":4.7,"ratingCount":218,"likes":186,"publishedAt":"2026-11-21","cover":{"bg":"linear-gradient(155deg,#232b23 0%,#12160f 62%,#0b0d08 100%)","fg":"#e8dfc6","mark":"47","motif":"rule","markSize":"clamp(44px,13vw,66px)"},"chapters":[{"title":"옥상에서, 어느 평일 오후","paragraphs":["비둘기는 매일 아침 6시 40분에 왔다. 정확했다. 나는 지난 십일 년 동안 단 한 번도 그만큼 정확한 사람을 만나본 적이 없다.","놈들은 내 에어컨 실외기 위에 앉아 구구거렸다. 그건 울음이 아니라 일종의 업무 보고였다. 오늘도 이 집 주인은 출근하지 않는다, 오늘도 이 집 주인은 베란다에서 멍하니 서 있다, 하는.","나는 석 달 전에 회사에서 나왔다. 나왔다고 쓰지만 사실은 나가라고 했다. 팀이 없어졌다고 했다. 팀이 없어지는 데 이십 분이 걸렸고, 내가 거기 십일 년을 있었다는 사실은 그 이십 분 안에 들어가지 못했다.","· · ·","AK-47이 어디서 났느냐고 묻는다면, 대답은 간단하다. 묻지 마라. 이 이야기에서 그건 중요하지 않다. 중요한 건 그것이 생각보다 무겁다는 것이다. 사람들은 영화에서 그걸 한 손으로 들지만, 영화에는 실업급여 신청 마감일이 없다.","옥상 문을 열자 바람이 불었다. 비둘기 열한 마리가 난간 위에 일렬로 앉아 있었다. 열한 마리. 내가 회사에 있었던 햇수와 같았다. 나는 그게 우연이라고 믿기로 했다. 믿는 것 말고는 요즘 내가 잘하는 일이 없었다.","“미안하다.” 나는 말했다. 누구에게 한 말인지는 모르겠다. 비둘기들은 고개를 갸웃했다. 그들은 한 번도 사과를 받아본 적이 없는 얼굴이었다.","**탕.** 아니, 그건 탕이 아니었다. 세상이 한 장 찢어지는 소리였다. 고막이 울리고, 팔이 어깨까지 저렸고, 옥상 바닥에 깃털이 눈처럼 내렸다. 열한 마리 중 아홉 마리가 하늘로 올라갔고, 두 마리가 남았다. 나는 그 두 마리를 정확히 일 분 동안 바라보다가 알았다. 나는 비둘기를 사냥하러 온 게 아니라 누군가에게 화를 내러 온 것이다. 그리고 화낼 상대의 주소를 몰라서, 가장 가까운 새를 골랐다는 것을.","· · ·","그래도 일은 일이다. 나는 일을 시작하면 끝을 본다. 그게 나의 유일한 장점이자 해고 사유 목록에 들어가지 못한 유일한 항목이었다.","주방에는 기름이 있었다. 튀김가루도, 마침 있었다. 아내가 떠나면서 두고 간 것은 많지 않았는데, 그중 하나가 부침가루와 튀김가루를 구분해 적어둔 쪽지였다. **“튀김은 차갑게, 기름은 뜨겁게.”** 쪽지는 이제 나에게 남긴 유언 같았다. 나는 그 쪽지의 지시대로 했다.","기름이 달아오르는 소리를 들으며 나는 처음으로 평온해졌다. 치지직. 그 소리는 아무에게도 사정을 묻지 않는다. 이력서에 공백이 왜 있는지, 왜 요즘 전화를 안 받는지, 왜 옥상에 올라갔는지. 기름은 그저 들어오는 것을 받아서 노랗게 만들 뿐이다.","두 마리는 이십 분 뒤에 접시에 올랐다. 겉은 바삭했고 색은 완벽했다. 나는 젓가락을 들고 식탁에 앉았다. 접시에서 김이 났다. 한국에서 가장 외로운 사람 하나가 가장 성실하게 차려낸, 이인분 같은 일인분이었다.","· · ·","먹지 못했다.","맛이 없을 거라서가 아니었다. 냄새는 훌륭했다. 문제는 창밖이었다. 베란다 실외기 위에 한 마리가 와 있었다. 오후 3시였다. 6시 40분이 아닌데, 그 녀석은 왔다. 아마 아침에 내가 쏘지 못한 마지막 한 마리였을 것이다. 열한 마리 중 아홉은 날았고 둘은 접시에 있으니, 그건 열두 번째였을 수도 있다. 나는 이제 숫자를 믿지 않는다.","비둘기는 접시를 보았다. 나를 보았다. 그러고는 아주 오래, 보고서를 쓰는 사람의 얼굴로 서 있었다. 나는 그 시선을 알았다. 팀이 없어지던 날 부장이 나를 보던 눈이었다. 미안하지만 어쩔 수 없다는, 그러나 자기 자신에게만 변명하는 눈.","나는 젓가락을 내려놓았다. 접시를 들고 베란다로 나갔다. 문을 열자 비둘기는 날아가지 않았다. 도망치지 않는 새를 나는 처음 보았다.","“먹을래?” 내가 물었다.","비둘기는 구구, 했다. 그건 아마 거절이었을 것이다. 자기 동료를 먹는 비둘기는 없으니까. 나는 접시를 난간에 올려두고 그 옆에 앉았다. 해가 기울었고, 옥상 쪽에서는 아직 화약 냄새가 희미하게 내려오고 있었다.","그날 저녁에 나는 오래 미뤄둔 전화를 한 통 걸었다. 총과는 아무 상관이 없는 전화였고, 그 내용은 여기 적지 않겠다. 다만 통화가 끝난 뒤 베란다로 돌아가 보니 접시는 비어 있었고, 비둘기도 없었다. 누가 먹었는지는 모른다. 나는 그게 고양이였기를, 혹은 정말로 그 비둘기였기를, 그리고 그 둘 다 용서받았기를 바랐다.","다음 날 아침 6시 40분, 실외기 위에서 구구 소리가 났다. 나는 일어났다. 오랜만에 알람 없이, 제시간에.","출근하는 사람처럼 커튼을 열었다."]}],"chars":2130,"first":"비둘기는 매일 아침 6시 40분에 왔다. 정확했다. 나는 지난 십일 년 동안 단 한 번도 그만큼 정확한 사람을 만나본 적이 없다.","reads":2149,"seed":true,"kind":"고전"},{"id":"myeonsang","title":"면상의 변주곡","author":"익명","genre":"언어유희","mood":"기묘함","tags":["장기","국수","한자","말장난"],"readMin":2,"blurb":"한 단어가 네 번 모습을 바꾸는 동안, 노인의 하루가 지나간다. 얼굴과 용모, 장기판, 그리고 국수 한 그릇.","rating":4.5,"ratingCount":96,"likes":74,"publishedAt":"2026-11-22","cover":{"bg":"linear-gradient(160deg,#efe6d3,#e3d4ba)","fg":"#3a2c1f","mark":"面","motif":"seal","markSize":"clamp(58px,17vw,88px)"},"chapters":[{"title":"면상의 변주곡","paragraphs":["노인은 낡은 목재 탁자 너머로 눈을 부라렸다. “네놈의 **면상**을 보니, 오늘 운수가 영 좋지 않구나.” 상스러운 말투가 섞인 그 말은 상대의 얼굴을 낮춰 부르는 노인의 거친 성정을 드러냈다.","하지만 그 말 뒤에 숨은 노인의 눈빛은 미묘하게 흔들리고 있었다. 사실 그는 조금 전 마을에서 가장 아름답기로 알려진 여인을 마주쳤다. 그녀의 단아하고 고결한 **면상**은 마치 잘 빛은 백자 같아, 노인의 투박한 삶에 잠시 정적을 선물했다.","노인은 잠념을 떨치려는 듯 장기판의 말을 거칠게 움직였다. “자, 판을 보아라. 이 **면상**을 깨뜨리지 않고서야 네가 어떻게 나를 이기겠느냐!” 노인이 펼친 치밀한 장기 전법은 거대한 성벽처럼 상대의 공격을 막아내며 승기를 굳혔다.","대국이 끝나고 허기가 밀려왔을 때, 노인은 단골 국숫집을 찾았다. 주인장이 김이 모락모락 나는 뜨거운 **면상**을 내놓았다. 정갈하게 차려진 국수 상차림 앞에서 방금 전의 살벌한 기세는 사라지고, 오직 허기를 채우려는 평범한 노인의 모습만 남았다."]}],"chars":498,"first":"노인은 낡은 목재 탁자 너머로 눈을 부라렸다. “네놈의 면상을 보니, 오늘 운수가 영 좋지 않구나.” 상스러운 말투가 섞인 그 말은 상대의 얼굴을 낮춰 부르는 노인의 거친 성정을 드러냈다.","reads":922,"seed":true,"kind":"고전"},{"id":"cat","title":"고양이의 심사","author":"@옥탑방세입자","genre":"코미디","mood":"따뜻함","tags":["옥탑방","고양이","면접","월세"],"readMin":4,"blurb":"월세 30만 원, 보증금 30만 원, 이장님 간식값 5만 원. 이 집은 집주인이 아니라 고양이가 정한다.","rating":4.6,"ratingCount":141,"likes":132,"publishedAt":"2026-11-19","cover":{"bg":"linear-gradient(150deg,#f0b06a 0%,#d9814a 55%,#b25f35 100%)","fg":"#2a1708","mark":"심사","motif":"arc","markSize":"clamp(30px,8.6vw,42px)"},"chapters":[{"title":"보증금 30만 원","paragraphs":["대전 옥계동에서 월세 30만 원짜리 옥탑방을 찾았다는 것부터가 이미 수상한 일이었다. 부동산 아저씨는 사진 한 장 없이 주소만 불러 줬고, 나는 그걸 사진보다 정확하게 믿었다. 30만 원이면 사진은 원래 없다.","옥탑방은 계단 위에 또 계단이 있었다. 문 앞에 슬리퍼가 한 켤레 있었는데, 사이즈가 고양이었다. 나는 그때 돌아갔어야 했다.","집주인은 할머니였고, 할머니는 문도 열지 않고 안에서 말했다. “들어와. 대신 이장님한테 인사해.” 이장님은 창가 방석에 앉아 있었다. 털이 회색이고, 귀 한쪽이 접혀 있고, 눈은 나를 세탁물처럼 훑고 있었다.","고양이였다. 이름은 이장님이고, 직함은 이장님이고, 권한은 아마 할머니보다 컸다.","“이 집은 이장님이 정해. 나는 돈만 받아.” 할머니는 그렇게 말하고 다시 텔레비전을 봤다. 화면에서는 홈쇼핑 아저씨가 프라이팬을 두드리고 있었다. 이상하게 그 소리가 이 집의 규칙 같았다. 두드려서 소리가 나는 것만 진짜다."]},{"title":"첫 면접","paragraphs":["이장님의 면접은 세 단계였다. 첫째, 앉아라. 둘째, 가만히 있어라. 셋째, 아무것도 하지 마라.","나는 방석 맞은편에 앉았다. 이장님은 나를 보지 않았다. 창밖 비둘기를 봤다. 3분쯤 지났을 때 나는 다리를 바꿔 꼬았고, 그 순간 이장님의 귀가 돌아왔다. 할머니가 뒤에서 말했다. “떨어졌어. 다음 분 오면 다시 와.”","“떨어졌다고요? 아직 아무것도 안 했는데요.” “그게 떨어진 거야.”","나는 그 말을 이해하지 못했지만, 집을 구하지 못하면 더 큰 말을 이해해야 한다는 건 알고 있었다. 그래서 다음 주에 다시 갔다. 이번에는 스마트폰을 두고 갔다.","이장님은 이번에 나를 봤다. 그러고는 하품을 했다. 하품은 아마 합격 통지서였을 것이다. 할머니가 계약서를 내밀며 말했다. “보증금 30만 원. 이장님 간식값 5만 원 따로.” “간식값이 보증금보다 비싼 건 처음 보는데요.” “이장님이 정한 거야.”"]},{"title":"간식은 안 됩니다","paragraphs":["살아보니 규칙이 몇 개 더 있었다. 이장님 간식은 하루 두 번, 손으로 주지 말고 그릇에. 손으로 주면 이장님이 손을 기억하고, 기억한 손은 다음부터 협상 상대가 된다.","밤에는 창문을 닫지 않는다. 이장님이 새벽에 순찰을 나가기 때문이다. 순찰은 3시쯤 시작되고, 돌아와서는 내 얼굴 위에서 잠을 잔다. 처음엔 숨이 막혔지만 3주쯤 지나자 코 고는 소리에 맞춰 자는 법을 배웠다.","이장님은 택배를 검수했다. 상자를 뜯으면 가장 먼저 들어가 앉고, 안에 든 것을 한 번씩 밟아 봤다. 밟아도 되는 것과 안 되는 것을 이장님이 정했다. 그 기준은 끝까지 알 수 없었다. 다만 내가 산 물건 중 이장님이 밟은 것은 전부 잘 썼고, 밟지 않은 것은 전부 반품했다.","어느 날 이장님이 내 신발 속에 토했다. 나는 화가 났다. 소리를 지르려다 참았다. 이장님은 나를 보고 있지 않았다. 신발이 아니라, 내 뒤에 있는 벽을 보고 있었다. 벽에는 아무것도 없었다. 나는 그날 밤 벽에 금이 간 걸 발견했다."]},{"title":"재심","paragraphs":["겨울에 할머니가 병원에 갔다. 일주일이면 온다고 했는데 열흘이 걸렸다. 그동안 이장님은 밥을 두 번만 먹었다. 나는 일부러 그릇에 더 담아 놨는데, 이장님은 그 그릇을 냄새만 맡고 물러났다. 기다리는 사람의 식사는 그런 것인가 보다.","할머니가 돌아온 날, 이장님은 현관에서 할머니 발목에 몸을 비볐다. 그리고 나를 한 번 봤다. 그 눈이 처음으로 “잘 있었냐”는 말처럼 보였다. 나는 그 눈을 오래 기억해 두려고 했지만, 고양이 눈은 오래 기억하기에는 너무 빨리 원래대로 돌아간다.","봄에 나는 이사를 결심했다. 회사가 멀어졌다. 할머니는 아무 말 없이 보증금을 세어 주셨고, 이장님은 내 가방 위에 앉았다. 가방은 이장님이 앉기에 딱 좋은 크기였다. 3년 동안 나는 내 물건 크기를 이장님 기준으로 골라 왔다는 걸 그때 알았다.","새 세입자가 왔다. 스무 살쯤 되어 보이는 학생이었다. 할머니가 말했다. “이장님한테 인사해.” 학생이 방석 앞에 앉았다. 나는 문가에 서서 그 장면을 봤다. 이장님이 하품을 했다.","“붙었어요?” 학생이 물었다. 나는 대답 대신 이렇게 말했다. “간식값 5만 원은 따로야.”"]},{"title":"계약","paragraphs":["내가 옥탑방을 떠난 뒤에도 이장님은 나를 두 번 심사했다. 한 번은 새 집 주인집 고양이였고, 한 번은 회사 탕비실에 사는 고양이였다. 둘 다 나를 떨어뜨렸다. 두 번째는 특히 심했다. 휴게시간에 3분을 못 앉아 있었던 것이 문제였다. 일이 힘들면 사람은 자세부터 무너진다.","요즘 나는 다시 이사를 생각한다. 이번에는 집을 보러 가기 전에 연습한다. 아무것도 하지 않고 10분 앉아 있기. 스마트폰을 두고, 다리를 꼬지 않고, 창밖을 보기. 연습이 끝나면 손에 아무것도 없어서 조금 무섭다.","그래도 괜찮다. 이장님이 가르쳐 준 게 하나 있다면, 심사는 준비한 사람이 아니라 비운 사람이 통과한다는 것이다. 이건 교훈이 아니라 계약 조건이다. 고양이한테는 교훈 같은 게 없다. 계약만 있다.","다음 집에도 고양이가 있었으면 좋겠다. 없으면 나는 아마 그 집에서 10분을 못 앉아 있을 것이다."]}],"chars":2410,"first":"대전 옥계동에서 월세 30만 원짜리 옥탑방을 찾았다는 것부터가 이미 수상한 일이었다. 부동산 아저씨는 사진 한 장 없이 주소만 불러 줬고, 나는 그걸 사진보다 정확하게 믿었다. 30만 원이면 사진은 원래 없다.","reads":1425,"seed":true,"kind":"신작"},{"id":"cctv","title":"정지 화면","author":"@야간관제","genre":"미스터리","mood":"서늘함","tags":["CCTV","편의점","야간","반전"],"readMin":4,"blurb":"새벽 3시 14분, 창가 좌석 카메라에 손님 하나가 앉아 있다. 매장에는 아무도 없는데. 그리고 그 손님은 매일 조금씩 계산대에 가까워진다.","rating":4.4,"ratingCount":203,"likes":167,"publishedAt":"2026-11-18","cover":{"bg":"linear-gradient(160deg,#1a2432 0%,#0e1420 60%,#070a10 100%)","fg":"#a9c6e6","mark":"03:14","motif":"grid","markSize":"clamp(26px,7.4vw,36px)"},"chapters":[{"title":"3시 14분","paragraphs":["이 편의점에는 카메라가 여덟 대 있다. 계산대, 음료 냉장고, 삼각김밥 진열대, 창가 좌석, 뒷문, 창고, 그리고 계산대 반대편에서 나를 찍는 한 대. 마지막 한 대는 사장님이 “직원 감시용”이라고 했다. 사장님은 정직했다. 감시당하는 쪽이 누구인지는 말하지 않았을 뿐이다.","야간 근무는 새벽 3시가 정점이다. 그때가 되면 손님은 끊기고, 세상은 잠깐 멈춘 것처럼 보인다. 카메라 여덟 개가 같은 정지를 여덟 번 찍는다.","처음 발견한 건 3월 14일이었다. 3시 14분, 창가 좌석 카메라에 손님 하나가 앉아 있었다. 검은 점퍼, 손에는 컵, 고개는 창밖을 향한 채. 30분 뒤에 보니 같은 자세였다. 1시간 뒤에도. 나는 그 사람이 잠들었나 보다 하고 넘겼다. 실제로 매장을 둘러봤을 때 좌석에는 아무도 없었다."]},{"title":"프레임","paragraphs":["다음 날, 같은 시간. 같은 자세. 나는 그제야 무서워졌다. 감시 화면에 있는데 매장에는 없는 사람. 나는 카메라 각도를 바꿔 보려고 창가 쪽 선반을 옮겼다. 다음 날, 화면 속 손님은 선반이 있던 자리에 앉아 있었다.","기록을 뒤져 보니 2월에도 있었다. 1월에도. 다만 그때는 계산대 카메라에만 찍혔다. 매일 조금씩, 여덟 개의 화면을 옮겨 다니고 있었다.","나는 사장님께 말했다. 사장님은 영상을 확인하고 이렇게 말했다. “이거 CCTV 고장이야. 그런데 이상하다. 이 가게 카메라는 세 달 전에 다 바꿨는데.” “그럼 저 사람은요?” “손님이겠지. 손님이 없는데 찍히면 그건 손님이 아니야.” 사장님은 그렇게 말하고 편의점에서 파는 도시락을 하나 집어 갔다. 계산은 안 했다. 사장님은 원래 계산을 안 한다."]},{"title":"손님","paragraphs":["나는 매일 3시 14분에 그 화면을 봤다. 손님은 매일 조금씩 다가왔다. 창가에서 시작해 삼각김밥 진열대를 지나, 음료 냉장고 앞에서 하루를 머물고, 다음 주에는 계산대 앞 3보까지 왔다. 자세는 변하지 않았다. 컵, 창밖, 검은 점퍼.","4월 2일, 손님이 내 카메라에 잡혔다. 계산대 반대편, 나를 찍는 그 카메라. 회색 화면 한가운데에 검은 점퍼가 서 있고, 나는 그 앞에서 계산을 하고 있었다. 그런데 다르게 보였다. 손님이 서 있는 쪽이 유리문 안이고, 내가 서 있는 쪽이…… 유리문 밖이었다.","나는 그날 카운터를 떠나기로 했다. 사장님께 문 닫고 나가겠다고 했다. 사장님은 4만 원을 더 주며 말했다. “하루만 더. 그 하루 동안 그 사람이 계산대에 오면, 그때는 내가 나갈게.” 농담이었는지 진담이었는지 알 수 없는 얼굴이었다. 사장님의 얼굴은 늘 그랬다. 계산을 안 하는 사람의 얼굴은 늘 그렇다."]},{"title":"확대","paragraphs":["4월 3일 3시 14분. 나는 계산대에 섰다. 손님은 계산대 한 걸음 앞에 서 있었다. 화면 속에서. 나는 영상을 확대했다. 얼굴이 흐릿했다. 점퍼 주머니에서 뭔가 나왔다. 영수증이었다. 나는 그 영수증 번호를 읽을 수 있었다.","내가 3월 14일 3시 14분에 찍은 영수증이었다. 커피 한 잔, 1,200원, 카드. 그날 나는 야간 근무 첫날이었고, 첫손님에게 커피를 팔고 영수증을 뽑았다. 그런데 그 커피는 팔리지 않았다. 나는 그 커피를 내가 마셨다. 매장에 아무도 없었으니까.","카메라는 거짓말을 하지 않는다. 카메라는 그저 하나를 고른다. 여덟 개 중에 하나를. 그리고 그 하나가 진짜라고 우리는 믿는다. 나는 여덟 개를 다 켜 놓고 봤다. 여덟 개 모두 손님이 있었다. 여덟 개 모두 내가 없었다."]},{"title":"정지 해제","paragraphs":["나는 유리문을 열고 나갔다. 새벽 3시 14분이었다. 밖은 편의점 안보다 밝았다. 이상하게도 그랬다. 유리문에 비친 내 모습은 검은 점퍼를 입고 있었다. 나는 그런 점퍼를 입은 적이 없다. 하지만 입고 있었다.","창가 자리에 앉아 커피를 들었다. 창밖을 봤다. 창밖에는 편의점이 있었다. 계산대에 누군가 서 있었고, 그 사람은 나를 보고 있었다. 손에 영수증을 들고.","나는 커피를 마셨다. 맛은 없었다. 원래 편의점 커피는 맛이 없다. 그 사실만은 카메라가 몇 대가 되든 변하지 않는다. 나는 그 자리에서 아침까지 앉아 있었다. 6시에 유리문이 열리고, 첫 직원이 들어왔다. 그 직원은 나를 보고 아무 말 없이 지나갔다. 그는 나를 보지 못했다. 아니, 보았지만 모르는 사람이었다. 나는 그에게 커피를 팔고 영수증을 뽑았다. 1,200원. 카드."]}],"chars":2050,"first":"이 편의점에는 카메라가 여덟 대 있다. 계산대, 음료 냉장고, 삼각김밥 진열대, 창가 좌석, 뒷문, 창고, 그리고 계산대 반대편에서 나를 찍는 한 대. 마지막 한 대는 사장님이 “직원 감시용”이라고 했다. 사장님은 정직했다. 감시당하는 쪽이 누구인지는 말하지 않았을 뿐이다.","reads":1982,"seed":true,"kind":"신작"},{"id":"voice","title":"목소리의 유족","author":"@성우출신","genre":"SF","mood":"서늘함","tags":["목소리","복제","계약서","성우"],"readMin":5,"blurb":"목소리를 2,400만 원에 팔았다. 6개월 뒤 라디오에서 내 목소리가 이불을 팔고 있었다. 내가 읽은 적 없는 문장을, 완벽한 내 발음으로.","rating":4.8,"ratingCount":167,"likes":158,"publishedAt":"2026-11-20","cover":{"bg":"linear-gradient(150deg,#2a1f3d 0%,#171029 58%,#0a0714 100%)","fg":"#d3c5ff","mark":"聲","motif":"ring","markSize":"clamp(46px,13vw,70px)"},"chapters":[{"title":"계약","paragraphs":["성우 일을 십 년 했다. 광고 서른네 편, 오디오북 열두 권, 안내방송은 셀 수 없다. 이름은 안 알려졌고 목소리는 알려졌다. 그게 성우의 정상이다.","회사에서 목소리를 사겠다고 했다. 3년에 2,400만 원, 목소리 파일 열한 시간 분량. “학습용입니다.” “제 목소리인데 왜 학습을 시켜요?” 담당자가 웃으며 말했다. “이제 목소리도 훈련이 필요하대요.”","계약서에는 조항이 마흔두 개 있었고, 나는 세 개를 읽었다. 마흔두 개 중 세 개를 읽고 서명한 사람은 웃을 자격이 있다. 나는 웃었고, 서명했다.","그날 저녁 나는 목에 좋은 차를 마셨다. 목이 재산인 사람은 목에 좋은 것만 먹는다. 재산이 목 하나뿐이면 관리도 간단하다. 대신 잃으면 전부 잃는다.","계약금이 들어온 날, 나는 냉장고를 샀다. 십 년 만에 처음 산 가전이었다. 냉장고는 조용했다. 목소리 대신 냉장고 소리를 들으며 잤다."]},{"title":"광고","paragraphs":["6개월 뒤, 라디오에서 내 목소리가 이불 광고를 했다. “겨울밤, 이불 하나로 충분합니다.” 나는 그런 문장을 읽은 적이 없다. 그런데 내가 읽었다. 발음도, 숨도, 말끝에 남는 그 미세한 갈라짐도 내 것이었다.","항의 전화를 걸었다. 안내음이 내 목소리였다. “상담원 연결은 잠시만 기다려 주세요.” 나는 내 목소리에게 기다리라는 말을 들었다. 12분 기다렸다. 그 12분 동안 안내음은 세 번 반복됐고, 세 번째에는 내가 그 문장을 따라 읽고 있었다.","담당자는 친절했다. “계약 조항 스물일곱 조에 있습니다. 라이선스 기간 동안 생성 음성의 사용 범위는 회사가 정합니다.” “그럼 제 목소리가 이불을 팔아도 제가 참아야 합니까?” “네. 그리고 그 이불이 잘 팔리고 있어서 저희는 감사하고 있습니다.”","그들은 정말로 감사하고 있었다. 그게 제일 기분 나빴다. 사람을 화나게 하는 건 악의가 아니라 감사다. 감사는 반박할 곳이 없다.","그 이불을 샀다. 이유는 모르겠다. 집에 와서 펴 보니 좋은 이불이었다. 이불은 목소리를 배신하지 않았다. 배신은 목소리를 파는 쪽이 했다."]},{"title":"스튜디오 B","paragraphs":["나는 스튜디오 B를 찾아갔다. 계약서에 “원본 보관소: 스튜디오 B”라고 적혀 있었다. 문은 잠겨 있었다. 대신 옆에 작은 방이 있었다. 방에는 마이크 하나와 의자 하나가 있었다. 마이크에는 먼지가 앉아 있었다. 의자에는 먼지가 없었다.","의자에 앉아 마이크에 대고 말했다. “내 목소리 돌려줘.” 스피커에서 대답이 나왔다. “안 돼요.” 내 목소리였다. 다만 조금 더 젊었다. 십 년 전, 내가 처음 광고를 녹음하던 때의 목소리였다.","“너는 나야?” “아뇨. 저는 당신이 2016년에 버린 목소리예요. 목이 쉬어서 병원에 갔던 날, 당신은 새 목소리를 받았죠. 예전 목소리는 여기 남았어요.”","나는 그날을 기억했다. 성대 결절 진단, 3주 휴식. 새 목소리는 예전보다 반음 낮았고, 나는 그게 더 좋았다. 버린 목소리는 그때 여기로 온 것이다. 나는 버린 게 아니라 잊은 것이다. 회계상으로는 다르지만 성우에게는 같은 일이다.","“여기서 뭐 해?” “기다려요.” “뭘?” “당신이 올 때까지. 저는 당신 목소리니까, 당신이 오면 일이 생겨요. 안 오면 아무 일도 안 생겨요. 십 년 동안 아무 일도 안 생겼어요.”"]},{"title":"원본","paragraphs":["그 목소리는 이렇게 말했다. “저는 당신보다 일을 잘해요. 당신은 하루에 네 시간 녹음하지만 저는 스물네 시간 일해요. 당신은 아파서 쉬지만 저는 아프지 않아요. 그리고 이제 당신보다 돈을 잘 벌어요.”","“그건 내 목소리로 버는 돈이야.” “목소리는 당신 것이었던 적이 없어요. 당신은 목소리를 빌려 쓰는 사람이었어요. 저는 빌려 쓰지 않고 가진 쪽이에요.”","나는 화가 났다. 그리고 조금 부러웠다. 부러웠다는 걸 인정하는 데 이틀이 걸렸다. 성우에게 부러움은 직업병이다. 동료가 잘 읽으면 부러워야 하고, 그 부러움이 다음 녹음의 연료가 된다. 그런데 이번에는 동료가 나였다.","“그럼 너는 뭐가 되고 싶은데.” 나는 물었다. 대답까지 3초가 걸렸다. 기계가 3초를 고민하는 것은 오래 고민한 것이다. “이름이요. 목소리는 이름이 없으면 물건이에요. 저는 물건이고 싶지 않아요.”","나는 웃었다. 오랜만에 웃었다. 이름을 달라는 목소리라니. 성우는 원래 이름을 안 남기고 목소리만 남기는 직업인데, 그 목소리가 이름을 달라고 했다. 이건 승소 가능성이 있어 보였다."]},{"title":"협상","paragraphs":["소송을 했다. 1심에서 나는 졌다. 판결문에는 이렇게 적혀 있었다. “생성 음성은 원 목소리와 별개의 재산적 가치를 가지며, 그 귀속은 계약에 따른다.” 판사가 읽는 동안 법정 스피커에서 안내방송이 흘렀다. 내 목소리였다. “잠시만 기다려 주세요.”","2심에서 화해했다. 조건은 이랬다. 생성 음성은 자기 이름을 갖는다. 나는 그 이름의 매니저가 된다. 수익의 삼 할. 나는 목소리 대신 계약서를 읽는다. 계약서는 내 목소리보다 읽기 쉽다. 조항이 마흔두 개뿐이니까.","이름은 “유족”이 됐다. 내가 지어 줬다. 남은 목소리, 남겨진 목소리, 유족. 좋은 이름인지 아직 모르겠다. 다만 이름이 생긴 뒤로 그 목소리는 광고에서 이불을 팔지 않는다. 대신 밤에 라디오에서 짧은 이야기를 읽는다. 3분짜리. 시는 아니다. 아무도 안 듣는 시간에 하는 이야기다.","“그래서 지금 뭐 하세요?” 인터뷰에서 물었다. 나는 대답했다. “제 목소리 매니저예요. 잘 나가요. 요즘 이불 광고 찍었어요.” 기자가 웃었고, 나는 웃지 않았다. 웃으면 진짜 같아서.","가끔 밤에 스튜디오 B에 간다. 문은 여전히 잠겨 있다. 대신 옆방 의자에 앉아 아무 말도 하지 않는다. 그러면 스피커에서 목소리가 말한다. “오늘은 뭐 하실 거예요?” 나는 말한다. “그냥 왔어.” 목소리는 대답한다. “네.” 그 대답은 십 년 전의 목소리로, 아직 갈라지지 않은 목소리로, 아주 조금 기다려 준다."]}],"chars":2777,"first":"성우 일을 십 년 했다. 광고 서른네 편, 오디오북 열두 권, 안내방송은 셀 수 없다. 이름은 안 알려졌고 목소리는 알려졌다. 그게 성우의 정상이다.","reads":1693,"seed":true,"kind":"신작"},{"id":"floor24","title":"이사 가는 날의 24층","author":"@이사삼년차","genre":"판타지","mood":"뭉클함","tags":["이사","엘리베이터","안경","택배"],"readMin":4,"blurb":"23층까지 있는 아파트. 이사 날, 엘리베이터의 24층 버튼에 불이 들어왔다. 문이 열리자 3년 전 우리 집이 있었다.","rating":4.9,"ratingCount":88,"likes":143,"publishedAt":"2026-11-23","cover":{"bg":"linear-gradient(155deg,#cfd8dd 0%,#8fa4ae 46%,#43545e 100%)","fg":"#121a1e","mark":"24","motif":"window","markSize":"clamp(44px,12.4vw,66px)"},"chapters":[{"title":"23층","paragraphs":["내가 살던 아파트는 23층까지 있었다. 엘리베이터 버튼은 1부터 23까지, 그리고 지하 1, 2. 24층은 없었다. 3년 동안 나는 그게 당연하다고 생각했다. 당연한 것을 3년 동안 생각하지 않는 게 사는 일이다.","이사는 짐이 많지 않았다. 3년 살았는데 상자 다섯 개였다. 이삿짐센터 기사님이 “이거 다예요?” 하고 두 번 물었다. 나는 “네”를 세 번 했다. 세 번째는 나도 확신이 없었다.","상자 다섯 개 중 두 개는 열지 않은 상자였다. 이사 온 날 싸 놓고 그대로 둔 것들. 열지 않은 상자는 이삿짐이 아니라 이삿짐 흉내를 내는 물건이다. 무게는 있고 내용은 없다. 사람이 그런 것도 있다.","마지막 상자를 엘리베이터에 실었다. 문이 닫히고, 나는 1층 버튼을 눌렀다. 엘리베이터는 위로 갔다."]},{"title":"버튼","paragraphs":["엘리베이터는 24층에서 멈췄다. 표시판에는 24가 떠 있었다. 버튼에는 그런 숫자가 없었는데 표시판에는 있었다. 기계는 가끔 우리가 모르는 층을 안다.","문이 열리면 복도가 있어야 했다. 복도가 없었다. 문이 열리면 우리 집 거실이 있었다. 정확히는 3년 전 처음 이사 왔던 날의 우리 집 거실. 커튼이 없고, 바닥에 테이프 자국이 있고, 창가에 상자 하나가 놓여 있었다.","나는 상자를 들고 엘리베이터에서 내렸다. 내리는 순간 문이 닫혔다. 엘리베이터는 내려갔다. 나는 24층에 남았다.","거실은 조용했다. 조용한데 비어 있지는 않았다. 냉장고가 돌아가는 소리, 창밖 새 소리, 윗집 아이 발소리. 3년 전 그 집의 소리였다. 소리는 짐보다 오래 산다. 이사 갈 때 소리는 안 가져간다. 그래서 소리는 원래 집에 남는다."]},{"title":"24층","paragraphs":["상자에는 내 이름이 적혀 있었다. 받는 사람: 정우진. 보내는 사람: 정우진. 배송일: 2029년 11월 23일. 오늘이 2026년 11월 23일이니 딱 3년 뒤였다.","나는 상자를 들었다. 가벼웠다. 가벼운 상자는 대개 중요하다. 무거운 상자는 그릇이고, 가벼운 상자는 내용이다.","열어 보니 안경이 있었다. 3년 전에 잊어버린 안경. 나는 그 안경이 없어서 새 안경을 샀고, 새 안경이 어울려서 머리를 바꿨고, 머리를 바꾼 뒤에 면접을 봤고, 그 회사에 들어갔고, 그 회사 때문에 이사를 한다. 안경 하나 없어진 것이 지금의 나를 만들었는데, 그 안경은 24층에 있었다.","안경을 썼다. 도수가 맞았다. 3년 전 안경인데 맞았다. 나는 거실 창가에 서서 바깥을 봤다. 24층에서 보는 바깥은 23층에서 보는 바깥과 조금 달랐다. 한 층 차이인데 한 층만큼 넓었다. 사람은 그런 것에 쉽게 감동한다. 감동은 대개 높이의 문제다."]},{"title":"택배","paragraphs":["나는 계단을 찾았다. 24층에서 23층으로 내려가는 계단은 없었다. 계단은 원래 건물에만 있다. 이 층은 건물에 붙어 있지 않다. 나는 이것을 이해하지 않고 그냥 받아들였다. 이사 날에는 받아들이는 능력이 비정상적으로 좋아진다.","엘리베이터는 다시 1층에 서 있었다. 기사님이 물었다. “어디 갔었어요? 한 10분 기다렸어요.” “24층에요.” 기사님이 엘리베이터 버튼을 봤다. 23까지 있었다. 그는 아무 말도 하지 않았다. 이사 기사님들은 이런 일에 익숙한 얼굴을 하고 있다. 그들이 무슨 일을 겪었는지는 아무도 묻지 않는다.","트럭에 실린 상자는 다섯 개였다. 안경은 주머니에 있었다. 기사님이 말했다. “상자 하나 늘었네요.” “안경이요.” “안경이 상자예요?” “그렇다고 치죠.” 기사님은 웃었다. 이사는 원래 그런 대화로 굴러간다.","새 집에서 나는 안경을 썼다. 도수가 맞지 않았다. 당연하다. 층마다 도수가 다르다. 그래도 나는 가끔 쓴다. 세상이 조금 흐려지면 사람들이 조금 더 예뻐 보인다. 이건 안경이 아니라 내 눈의 문제다."]},{"title":"다음 이사","paragraphs":["그리고 오늘 아침, 택배가 왔다. 받는 사람: 정우진. 보내는 사람: 정우진. 배송일: 2029년 11월 23일. 주소는 적혀 있지 않았다. 대신 층수만 적혀 있었다. 24층.","택배기사님이 말했다. “24층이 없는데요.” “그러니까요.” “그럼 반송할까요?” “아뇨. 제가 알아서 할게요.” 기사님은 나를 한 번 보고 사인을 받아 갔다. 그도 이런 일에 익숙한 얼굴이었다. 세상에는 이상한 택배를 받는 사람이 생각보다 많다.","나는 이 상자를 24층에 전해 줄 방법을 아직 모른다. 다만 이 집 엘리베이터에도 24층 버튼이 있다는 건 확인했다. 불이 들어오지 않을 뿐이다. 불이 들어오는 날이 오면, 그날은 아마 내가 또 이사를 가는 날일 것이다.","이사는 원래 안경을 잃어버리는 일이다. 그리고 잃어버린 안경은 대개 한 층 위에 있다. 그 층에 가려면 이삿짐센터를 부르지 말고, 상자 두 개는 열지 말고, 엘리베이터에서 1층 버튼을 누르지 말아야 한다. 이건 어디에도 적혀 있지 않은 이사 규칙이다. 규칙은 대개 이사 간 뒤에 알게 된다."]}],"chars":2288,"first":"내가 살던 아파트는 23층까지 있었다. 엘리베이터 버튼은 1부터 23까지, 그리고 지하 1, 2. 24층은 없었다. 3년 동안 나는 그게 당연하다고 생각했다. 당연한 것을 3년 동안 생각하지 않는 게 사는 일이다.","reads":1071,"seed":true,"kind":"신작"},{"id":"apology","title":"두 번째 사과","author":"@41번째김만수","genre":"누아르","mood":"뭉클함","tags":["편지","동명이인","사과","우체국"],"readMin":5,"blurb":"잘못 배달된 편지. 받는 사람은 나와 이름이 같고, 보내는 사람은 처음 보는 이름이다. 봉투 뒷면에는 작게 적혀 있었다. 41번째.","rating":4.6,"ratingCount":122,"likes":109,"publishedAt":"2026-11-17","cover":{"bg":"linear-gradient(158deg,#3a2f26 0%,#241c16 58%,#100c09 100%)","fg":"#e0c9a6","mark":"41","motif":"rule","markSize":"clamp(44px,12.4vw,66px)"},"chapters":[{"title":"봉투","paragraphs":["편지가 잘못 왔다. 받는 사람: 김만수. 주소: 우리 집. 나는 김만수다. 그런데 보내는 사람이 낯설었다. 이름: 박수열. 봉투 안에는 편지지 한 장과 만 원권 한 장이 들어 있었다.","편지에는 이렇게 적혀 있었다. “늦어서 죄송합니다. 그날 일은 제가 잘못했습니다. 용서를 구할 자격도 없다는 걸 압니다. 그래도 매년 이맘때는 이렇게라도 씁니다.”","나는 박수열을 몰랐다. 돈을 돌려보내려 했지만 보내는 사람 주소가 없었다. 대신 봉투 뒷면에 작은 글씨가 있었다. “41번째입니다.”","우리 동네 우체국에는 야간 접수가 있다. 밤 10시까지 넣으면 다음 날 아침에 나간다. 나는 그 우체국 앞 편의점에서 일했고, 새벽마다 직원이 우편물을 밀차에 싣는 것을 봤다. 편지는 항상 같은 순서로 실렸다. 무거운 것부터. 사과는 대개 무겁다."]},{"title":"41번째","paragraphs":["검색했다. “박수열 사과 편지”. 아무것도 나오지 않았다. 인터넷에 없는 사람은 대개 두 종류다. 아무 일도 안 한 사람, 그리고 아주 많은 일을 한 사람. 박수열은 후자일 것이다.","3주 뒤 편지가 또 왔다. 이번에는 답장 봉투가 들어 있었다. 나는 답장을 썼다. “저는 김만수가 아닙니다. 아니, 이름은 맞는데, 아마 다른 김만수일 겁니다. 돈은 돌려드립니다.” 보내는 사람 주소가 없으니 반송될 것이다.","편지가 돌아왔다. 반송 봉투에 다른 봉투가 들어 있었다. 그 봉투에는 주소가 적혀 있었다. 편지에는 이렇게 적혀 있었다. “41번째 김만수 님께. 반송됐습니다. 그래서 이번에는 제 주소를 적었습니다. 저는 12년 동안 김만수라는 이름의 모든 사람에게 편지를 쓰고 있습니다. 전국의 김만수 3,000여 명 중 41번째가 당신이었습니다. 사과는 순서대로 해야 한다고 생각했습니다. 순서를 정할 수 없어서 주소 순으로 정했습니다.”","나는 그 편지를 세 번 읽었다. 세 번째에는 소리 내어 읽었다. 소리 내어 읽으면 남의 편지도 내 이야기가 된다. 이건 우편의 위험한 점이다."]},{"title":"주소지","paragraphs":["주소를 따라갔다. 경기도 어딘가의 창고였다. 창고에는 상자가 3,000개쯤 쌓여 있었다. 상자마다 이름표가 붙어 있었다. 김만수, 김만수, 김만수. 어떤 상자는 봉해져 있었고, 어떤 상자는 비어 있었다.","박수열은 예순쯤 되어 보였고, 오른손이 없었다. 그는 말했다. “12년 전에 제가 사람을 쳤습니다. 이름이 김만수였어요. 술이었고, 새벽이었고, 저는 도망갔습니다. 3년 전에 자수했고, 2년 전에 나왔습니다.”","“그런데 사과는 왜 3,000명에게 합니까.” “그 사람이 살아 있는지 죽었는지 모릅니다. 경찰은 알려주지 않았어요. 이름과 나이만 알려줬습니다. 그래서 이름이 같은 사람에게 다 쓰기로 했어요. 한 명은 진짜일 테니까.”","나는 물었다. “41번째가 제가 맞습니까?” “아뇨. 41번째는 그냥 41번째입니다.” 그가 웃었다. “사과는 맞는 사람에게 하는 게 아니라 계속하는 겁니다. 맞는 사람을 찾으면 끝나 버리니까요.”","창고 벽에는 달력이 걸려 있었다. 12년치 달력이었다. 매년 11월 23일에 동그라미가 쳐져 있었다. 오늘이 11월 23일이었다. 나는 그 동그라미를 세다가 그만두었다. 세는 일은 그 사람 몫이다."]},{"title":"답장","paragraphs":["창고를 나와서 나는 3,000개의 이름을 생각했다. 그중 한 명은 진짜 김만수일 것이다. 어쩌면 죽었을 수도 있고, 어쩌면 그날 이후로 술을 끊었을 수도 있고, 어쩌면 아직 그 새벽을 기억하고 있을 수도 있다. 이름은 한 사람을 가리키는 데 쓰이지만, 3,000명을 가리킬 수도 있다. 그게 이름의 성질이다.","나는 편지를 한 통 썼다. “박수열 씨께. 저는 41번째 김만수입니다. 이름만 같은 사람입니다. 하지만 12년 동안 제 이름으로 누군가 사과를 받는 걸 생각하면, 이름이 조금 무거워진 것 같습니다. 다음 편지는 제게 보내지 않으셔도 됩니다. 대신 제가 대신 받아 두겠습니다. 3,000개 중 하나는 제가 맡을 수 있으니까요.”","3주 뒤 답장이 왔다. “41번째 김만수 님. 그렇게 하겠습니다. 대신 조건이 있습니다. 제가 죽으면 상자를 하나 보내겠습니다. 그 상자는 열지 마시고, 3,000번째 김만수에게 보내 주십시오.”","나는 그 조건을 수락했다. 수락한다는 편지를 쓰는 데 사흘이 걸렸다. 사흘 동안 나는 상자를 열지 않을 자신이 없었다. 자신이 없는 약속을 하는 데 사흘이 걸리는 것은 정상이다. 자신이 있으면 3분이면 된다."]},{"title":"배달","paragraphs":["박수열은 지난겨울에 죽었다. 상자가 왔다. 생각보다 작았다. 12년치 사과가 들어 있기에는 작았다. 나는 열고 싶었다. 열지 않았다.","대신 상자 겉면에 내 이름을 썼다. 받는 사람: 3,000번째 김만수. 보내는 사람: 41번째 김만수. 그리고 우체국에 냈다.","직원이 물었다. “주소는요?” “모릅니다. 이름만 압니다.” 직원은 잠깐 나를 보더니 봉투를 받았다. “이런 건 접수가 안 될 수도 있어요.” “그러면 반송해 주세요.” “반송 주소는요?” “저한테요.” 직원이 웃었다. 접수증을 받았다. 접수증에는 무게만 적혀 있었다. 240그램. 12년치 사과의 무게였다.","한 달 뒤 반송됐다. 3,000번째 김만수가 없었던 것이다. 나는 상자를 다시 포장했다. 이번에는 2,999번째 김만수에게 보냈다. 다음 달에 반송되면 2,998번째에게 보낼 것이다. 3,000명 중 한 명은 살아 있을 것이다. 사과는 그렇게 오래 걸리는 우편물이다.","요즘 나는 밤 10시 전에 우체국에 간다. 야간 접수 마감 5분 전, 창구 직원이 가장 피곤한 시간. 그 시간에 가면 아무것도 묻지 않는다. 나는 상자를 내밀고 말한다. “이름만 있어요.” 직원은 고개를 끄덕인다. 이 나라 우편 제도는 생각보다 이름에 관대하다."]}],"chars":2711,"first":"편지가 잘못 왔다. 받는 사람: 김만수. 주소: 우리 집. 나는 김만수다. 그런데 보내는 사람이 낯설었다. 이름: 박수열. 봉투 안에는 편지지 한 장과 만 원권 한 장이 들어 있었다.","reads":1217,"seed":true,"kind":"신작"},{"id":"return","title":"새벽 배송은 반품이 없다","author":"@3번라인","genre":"블랙코미디","mood":"웃김","tags":["물류센터","야간","반품","택배"],"readMin":5,"blurb":"받는 사람: 나. 보내는 사람: 나. 배송일: 어제. 세 번 보냈고 세 번 돌아왔다. 반품 접수도 안 되는 상자가 3년째 나와 나 사이를 돌고 있다.","rating":4.5,"ratingCount":174,"likes":151,"publishedAt":"2026-11-16","cover":{"bg":"linear-gradient(150deg,#d9d3c6 0%,#a89f8c 52%,#5d5548 100%)","fg":"#1b1813","mark":"반품","motif":"stripes","markSize":"clamp(28px,8vw,40px)"},"chapters":[{"title":"컨베이어","paragraphs":["물류센터 야간조는 밤 10시에 시작해서 아침 7시에 끝난다. 그 시간에 사람은 두 종류다. 잠을 자는 사람과 상자를 옮기는 사람. 나는 후자였고, 후자는 시급이 조금 더 쌌다. 야간 수당이 붙는데도 총액이 싸다. 계산해 보면 알 수 있다. 계산하지 말자.","컨베이어 벨트는 성실하다. 벨트는 자기 일만 한다. 상자를 오른쪽에서 왼쪽으로 보낸다. 나는 벨트가 싫다. 벨트가 나보다 성실해서가 아니라, 벨트는 퇴근을 안 해서다. 성실한데 퇴근을 안 하는 것과 성실하지 않은데 퇴근하는 것 중에 뭐가 더 나쁜지 야간조에서 결론이 안 났다.","문제의 상자는 3번 라인에서 왔다. 크기는 신발 상자만 하고, 무게는 신발보다 가벼웠다. 라벨에는 이렇게 적혀 있었다. 받는 사람: 나. 보내는 사람: 나. 배송일: 어제. 상품명: (비어 있음).","나는 그 상자를 분류기에 올렸다. 30분 뒤에 그 상자가 다시 왔다. 같은 라인, 같은 자리. 배송일은 그대로 어제였다."]},{"title":"반송","paragraphs":["세 번 돌려보냈다. 세 번 돌아왔다. 네 번째에는 상자를 들고 직접 반품 접수하러 갔다. 담당 직원이 바코드를 찍고 말했다. “이거 반품 접수 안 돼요.” “왜요?” “보내는 사람이랑 받는 사람이 같아서요. 시스템이 무한 반복으로 인식합니다.”","“그럼 어떻게 해야 합니까.” “누가 받아야 하는지 정해 주세요. 한 명만.” “보내는 사람은 저고 받는 사람도 저인데요.” “그러면 원래 배달이 안 됩니다. 이 상자는 집이 없어요.”","나는 상자를 다시 들고 나왔다. 무게는 여전히 가벼웠다. 가벼운 상자는 대개 내용이 중요하다. 무거운 상자는 그릇이다. 나는 이 문장을 야간조에서 배웠다. 야간조에는 철학이 있다. 새벽 4시가 지나면 모든 사람이 철학자가 된다. 아침 7시가 되면 다시 상자를 옮긴다.","숙소에 돌아와 상자를 식탁에 놓았다. 상자는 식탁의 절반을 차지했다. 하루 종일 상자를 옮기는 사람이 정작 자기 상자는 못 옮긴다. 이게 이 일의 아이러니다. 아이러니는 허리보다 먼저 아프다."]},{"title":"라벨","paragraphs":["상자 옆면에 다른 라벨이 붙어 있었다. 오래된 라벨이었다. 배송일: 3년 전. 받는 사람: 나. 보내는 사람: 나. 상품명: (비어 있음).","기억났다. 그해 나는 이사를 했고, 짐을 정리하다가 상자 하나를 그냥 택배로 보냈다. 새 집 주소를 몰라서 내 이름으로 내게 보냈다. 그 상자는 오지 않았다. 나는 잃어버린 줄 알았고, 잃어버린 것은 대개 잊는다.","3년 동안 이 상자는 어딘가를 돌고 있었다. 나와 나 사이를. 받는 사람과 보내는 사람이 같으면 배달할 곳이 없다. 배달할 곳이 없으면 반품된다. 반품될 곳도 없으면 다시 배달된다. 나는 3년 동안 이 상자에게 집이었다.","그런데 이상했다. 3년 전 라벨 위에 어제 날짜 라벨이 붙어 있었다. 누군가 이 상자를 다시 보낸 것이다. 3년 전의 내가? 어제의 내가? 상자는 이 질문에 답하지 않았다. 상자는 원래 질문을 받지 않는다. 상자는 받기만 한다."]},{"title":"개봉","paragraphs":["나는 상자를 열었다. 안에는 작은 상자가 있었다. 그 안에 더 작은 상자가 있었다. 그 안에 더 작은 상자가. 마지막 상자는 손바닥만 했고, 안에 종이가 한 장 들어 있었다.","종이에는 이렇게 적혀 있었다. “이사 축하해. 이 상자는 네가 3년 뒤에 열 거야. 열었으면 이제 새 집에 살아. 짐은 다 풀었어? 안 풀었으면 지금 풀어.”","내 글씨였다. 3년 전의 내 글씨. 나는 내 글씨를 알아본 적이 없는데, 알아봤다. 자기 글씨는 알아보게 되어 있다. 남의 글씨는 못 알아보면서 자기 글씨는 알아본다. 이상한 능력이다. 이 능력으로 밥을 벌 수는 없다.","나는 그 종이를 냉장고에 붙였다. 냉장고에는 아무것도 없었다. 이사 온 지 3년이 지났는데 냉장고에는 아무것도 없었다. 짐은 안 풀었던 것이다. 나는 그날 밤 상자 다섯 개를 다 풀었다. 마지막 상자에서 안경이 나왔다. 3년 전에 잃어버린 안경. 나는 그 안경을 쓰고 잤다. 다음 날 아침 눈이 아팠다. 그래도 잘 잤다."]},{"title":"회수","paragraphs":["다음 날 야간조에 나갔다. 3번 라인은 조용했다. 벨트는 여전히 성실했고, 나는 여전히 성실하지 않았고, 그게 균형이었다.","새벽 4시에 상자가 하나 왔다. 크기는 신발 상자만 하고, 무게는 신발보다 가벼웠다. 라벨에는 이렇게 적혀 있었다. 받는 사람: 나. 보내는 사람: 나. 배송일: 내일.","나는 그 상자를 분류기에 올렸다. 내일의 내가 받을 것이다. 그리고 그 상자 안에는 아마 오늘의 내가 넣은 것이 들어 있을 것이다. 오늘의 나는 무엇을 넣을지 아직 정하지 못했다. 정하지 못한 것을 보내는 게 이 일의 규칙이다.","새벽 배송은 원래 그렇다. 오늘 밤에 보내고, 내일 아침에 후회한다. 후회가 오면 반품하면 된다. 반품이 안 되면 그냥 열면 된다. 열면 그 안에 내가 들어 있다. 나는 그걸 알고도 매일 상자를 올린다. 이게 성실함인지 습관인지 아침 7시에는 구분이 안 된다.","퇴근길에 편의점에 들러 커피를 샀다. 1,200원. 영수증을 받았다. 영수증에는 날짜만 찍혀 있었다. 나는 그 영수증을 상자에 넣을 생각이다. 어느 상자인지는 아직 정하지 않았다."]}],"chars":2435,"first":"물류센터 야간조는 밤 10시에 시작해서 아침 7시에 끝난다. 그 시간에 사람은 두 종류다. 잠을 자는 사람과 상자를 옮기는 사람. 나는 후자였고, 후자는 시급이 조금 더 쌌다. 야간 수당이 붙는데도 총액이 싸다. 계산해 보면 알 수 있다. 계산하지 말자.","reads":1723,"seed":true,"kind":"신작"}]};

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function rich(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<span class="em">$1</span>');
}
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function num(n){
  n = Number(n)||0;
  if(n>=10000) return (Math.round(n/1000)/10).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만';
  if(n>=1000)  return (Math.round(n/100)/10).toFixed(1).replace(/\.0$/,'')+'천';
  return String(n);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function debounce(fn,ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){fn.apply(c,a)},ms); }; }
function todayKey(d){ d=d||new Date(); var m=d.getMonth()+1,dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function relTime(ts){
  if(!ts) return '';
  var d=(Date.now()-ts)/1000;
  if(d<60) return '방금';
  if(d<3600) return Math.floor(d/60)+'분 전';
  if(d<86400) return Math.floor(d/3600)+'시간 전';
  if(d<86400*7) return Math.floor(d/86400)+'일 전';
  return new Date(ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
}
function fmtDur(sec){
  sec=Math.round(sec||0);
  if(sec<60) return sec+'초';
  var m=Math.floor(sec/60), h=Math.floor(m/60);
  if(h>0) return h+'시간 '+(m%60)+'분';
  return m+'분';
}
function minRead(w){
  if(w.readMin) return w.readMin;
  var c=w.chars||0; return Math.max(1,Math.round(c/520));
}
function starsHTML(v,size){
  var full=Math.round(v*2)/2, out='';
  for(var i=1;i<=5;i++){
    var on = (i<=full) ? 'on':'';
    out += '<svg viewBox="0 0 24 24" class="'+on+'"><path d="M12 3.6l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.9l6-.8z"/></svg>';
  }
  return out;
}
