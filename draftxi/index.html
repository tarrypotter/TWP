/* ---------- KST 출석 · 퀘스트 ---------- */
function freshQuests(){
  return {day:kstDay(), week:kstWeekKey(), month:kstMonthKey(),
    today:Q_ZERO(Q_TODAY), weekC:Q_ZERO(Q_WEEK), monthC:Q_ZERO(Q_MONTH),
    chal:Q_ZERO(Q_CHAL),
    tk:{g11:0, g1:0}, tkw:{g11:0, g1:0, cupWin:0},
    claimed:{day:{}, week:{}, month:{}, chal:{}, tk:{}, tkw:{}}, login:{last:'', streak:0, tks:0},
    rep:Q_ZERO(Q_REP)};
}
function ensureQuests(){
  if(!S.q || typeof S.q !== 'object') S.q = freshQuests();
  const q = S.q;
  if(!q.today || typeof q.today !== 'object') q.today = {};
  if(!q.weekC || typeof q.weekC !== 'object') q.weekC = {};
  if(!q.monthC || typeof q.monthC !== 'object') q.monthC = {};
  Q_TODAY.forEach(k => { q.today[k] = Math.max(0, Math.round(+q.today[k] || 0)); });
  Q_WEEK.forEach(k => { q.weekC[k] = Math.max(0, Math.round(+q.weekC[k] || 0)); });
  Q_MONTH.forEach(k => { q.monthC[k] = Math.max(0, Math.round(+q.monthC[k] || 0)); });
  if(!q.rep || typeof q.rep !== 'object') q.rep = {};
  Q_REP.forEach(k => { q.rep[k] = Math.max(0, Math.round(+q.rep[k] || 0)); });
  if(!q.chal || typeof q.chal !== 'object') q.chal = {};
  Q_CHAL.forEach(k => { q.chal[k] = Math.max(0, Math.round(+q.chal[k] || 0)); });
  if(!q.claimed || typeof q.claimed !== 'object') q.claimed = {day:{}, week:{}, month:{}};
  q.claimed.day ||= {}; q.claimed.week ||= {}; q.claimed.month ||= {}; q.claimed.chal ||= {};
  q.claimed.tk ||= {}; q.claimed.tkw ||= {};
  if(!q.chal || typeof q.chal !== 'object') q.chal = {low:0, band:0, dog:0};
  if(!q.tk || typeof q.tk !== 'object') q.tk = {g11:0, g1:0};
  if(!q.tkw || typeof q.tkw !== 'object') q.tkw = {g11:0, g1:0, cupWin:0};
  ['tk','tkw'].forEach(sc => { if(!q[sc]) q[sc] = {}; });
  ['g11','g1'].forEach(k => { q.tk[k] = Math.max(0, Math.round(+q.tk[k] || 0)); });
  ['g11','g1','cupWin'].forEach(k => { q.tkw[k] = Math.max(0, Math.round(+q.tkw[k] || 0)); });
  if(!q.login || typeof q.login !== 'object') q.login = {last:'', streak:0};
  if(!q.rep || typeof q.rep !== 'object') q.rep = {games:0, wins:0};
  const d = kstDay(), w = kstWeekKey(), m = kstMonthKey();
  if(q.day !== d){ q.day = d; q.today = Q_ZERO(Q_TODAY); q.chal = Q_ZERO(Q_CHAL); q.claimed.day = {}; q.claimed.chal = {}; q.claimed.tk = {}; q.tk = {g11:0, g1:0}; }
  if(q.week !== w){ q.week = w; q.weekC = Q_ZERO(Q_WEEK); q.claimed.week = {}; q.claimed.tkw = {}; q.tkw = {g11:0, g1:0, cupWin:0}; }
  if(q.month !== m){ q.month = m; q.monthC = Q_ZERO(Q_MONTH); q.claimed.month = {}; }
  return q;
}
function questAdd(kind, n){
  const q = ensureQuests(), inc = n || 1;
  if(kind === 'draft') q.today.draft += inc;
  else if(kind === 'game'){ q.today.games += inc; q.rep.games += inc; }
  else if(kind === 'win'){ q.today.win += inc; q.weekC.win += inc; q.monthC.win += inc; q.rep.wins += inc; }
  else if(kind === 'ranked'){ q.weekC.ranked += inc; }
  else if(kind === 'buff'){ q.weekC.buff += inc; q.monthC.buf += inc; q.today.buff += inc; }
  else if(kind === 'big') q.today.big += inc;
  else if(kind === 'chemi') q.today.chemi += inc;
  else if(kind === 'dwin') q.today.dwin += inc;
  else if(kind === 'allstar') q.weekC.allstar += inc;
  else if(kind === 'cupwin'){ q.weekC.cupWin += inc; q.monthC.cupWin += inc; q.tkw.cupWin += inc; }
  else if(kind === 'cuptac') q.weekC.cupTac += inc;
  else if(kind === 'ko') q.weekC.ko += inc;
  else if(kind === 'crit') q.weekC.crit += inc;
  else if(kind === 'burn') q.chal.burn += inc;
  /* 패스 티켓 미션 카운터 */
  else if(kind === 'g11'){ q.tk.g11 += inc; q.tkw.g11 += inc; q.monthC.games += inc; }
  else if(kind === 'g1'){ q.tk.g1 += inc; q.tkw.g1 += inc; q.monthC.dgames += inc; q.rep.duels += inc; }
}
function claimQuest(scope, id){
  const q = ensureQuests();
  const item = (QUESTS[scope] || {items:[]}).items.find(x => x.id === id);
  if(!item) return;
  if(scope === 'rep'){
    const key = repKeyOf(item);
    if((+q.rep[key] || 0) < item.goal) return;
    q.rep[key] = Math.max(0, (+q.rep[key] || 0) - item.goal);
  } else {
    if(q.claimed[scope][id] || item.get(q) < item.goal) return;
    q.claimed[scope][id] = 1;
  }
  if(item.ticket){ addTickets(item.ticket); save(); toast('🎫 +' + item.ticket + '장 · ' + item.name); render(true); return; }
  addCoins(item.coin); save();
  toast('+' + fmt(item.coin) + ' 코인 · ' + item.name);
  render(true);
}
function claimCount(){
  const q = ensureQuests();
  let n = q.login.last !== kstDay() ? 1 : 0;
  ['day','week','month','chal','tk','tkw'].forEach(sc => {
    QUESTS[sc].items.forEach(it => { if(!q.claimed[sc][it.id] && it.get(q) >= it.goal) n++; });
  });
  QUESTS.rep.items.forEach(it => { n += repQueue(it, q); });
  return n;
}
/* 퀘스트 보상 일괄 수령 — 출석은 따로, 퀘스트만 한 번에 */
const QALL_SCOPES = ['day','week','month','chal','tk','tkw'];
function bulkPending(){
  const q = ensureQuests();
  let coins = 0, tickets = 0, n = 0;
  QALL_SCOPES.forEach(sc => {
    QUESTS[sc].items.forEach(it => {
      if(q.claimed[sc][it.id] || it.get(q) < it.goal) return;
      if(it.ticket) tickets += it.ticket; else coins += it.coin;
      n++;
    });
  });
  /* 반복 퀘스트는 쌓인 사이클만큼 전부 계산한다 */
  QUESTS.rep.items.forEach(it => {
    const cyc = repQueue(it, q);
    if(!cyc) return;
    if(it.ticket) tickets += it.ticket * cyc; else coins += it.coin * cyc;
    n += cyc;
  });
  return {coins, tickets, n};
}
function claimAllQuests(){
  const q = ensureQuests();
  let coins = 0, tickets = 0, n = 0;
  QALL_SCOPES.forEach(sc => {
    QUESTS[sc].items.forEach(it => {
      if(q.claimed[sc][it.id] || it.get(q) < it.goal) return;
      q.claimed[sc][it.id] = 1;
      if(it.ticket) tickets += it.ticket; else coins += it.coin;
      n++;
    });
  });
  /* 반복 퀘스트는 쌓인 만큼(여러 사이클) 한 번에 전부 받는다 — 남은 카운트가 있어도 다음 탭을 기다리지 않는다 */
  QUESTS.rep.items.forEach(it => {
    const key = repKeyOf(it);
    for(let cyc = repQueue(it, q); cyc > 0; cyc--){
      q.rep[key] = Math.max(0, (+q.rep[key] || 0) - it.goal);
      if(it.ticket) tickets += it.ticket; else coins += it.coin;
      n++;
    }
  });
  if(!n){ toast('받을 보상이 없습니다'); return; }
  if(coins) addCoins(coins);
  if(tickets) addTickets(tickets);
  save(); paintHud();
  toast('보상 ' + n + '건 · +' + fmt(coins) + ' 코인' + (tickets ? ' · 🎫 +' + tickets + '장' : ''));
  render(true);
}
function attNext(){
  const q = ensureQuests();
  const done = q.login.last === kstDay();
  const streak = done ? (q.login.streak || 0) : ((q.login.last === kstDay(-1)) ? (q.login.streak || 0) + 1 : 1);
  return {done, streak, coin: ATT_REWARD[Math.min(streak, 7) - 1]};
}

/* ---------- opponents ---------- */
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 9973; return h; }
function opponentOf(club){
  const o = OPP[club];
  const h = hashOf(club);
  const dAtt = ((h % 7) - 3) * 0.5, dDef = (((h>>3) % 7) - 3) * 0.5;
  return {club, league:o.l, base:o.o, att:o.o + 1.5 + dAtt, mid:o.o + ((h%5)-2)*0.35, def:o.o + 1 + dDef, xi:o.xi};
}
/* ---------- 친선전 난이도 5단계 · 상대 OVR 뻥튀기 ---------- */
function fboostVal(){ const n = Math.round(+S.fboost || 0); return (isFinite(n) && n > 0) ? n : 0; }
function fdiffVal(){ const v = Math.round(+U.friendly.diff || 0); return FDIFF.some(d => d.v === v) ? v : 0; }
function fdiffOf(){ return FDIFF.filter(d => d.v === fdiffVal())[0] || FDIFF[1]; }
function fdiffHint(d){
  if(fboostVal()) return d.n + ' · 상대 OVR은 직접 입력값 그대로' + (d.ai ? ' · AI가 하프타임에 전술까지 바꿉니다' : '');
  const ovr = d.v === 0 ? '클럽 기본 OVR' : '상대 OVR ' + (d.v > 0 ? '+' : '') + d.v;
  return d.n + ' · ' + ovr + (d.ai ? ' · AI가 하프타임에 전술까지 바꿉니다' : ' · AI 전술 고정');
}
/* 입력한 OVR이 있으면 전 클럽을 그 OVR로 올린다 (상한 없음) */
function friendlyOpp(club){
  const o = opponentOf(club);
  const t = fboostVal();
  if(!t) return o;
  const add = t - o.base;
  return {...o, base:t, att:o.att + add, mid:o.mid + add, def:o.def + add, fb:t};
}
function mixOpponent(){
  const xi = [];
  const roles = ['GK','CB','CB','LB','RB','DM','CM','AM','LW','ST','RW'];
  const used = new Set();
  for(const r of roles){
    const cand = P.map((p,i)=>i).filter(i => !used.has(i) && (posOf(i) === r || (r==='ST' && posOf(i)==='SS')));
    const i = cand.length ? pick(cand) : 0;
    used.add(i); xi.push([P[i][0], r]);
  }
  const base = 85 + Math.round(rnd(-2, 3));
  return {club:'유럽 믹스', league:'MIX', base, att: base+1, mid: base, def: base+1, xi, mix:true};
}
function randomClub(){
  const keys = Object.keys(OPP);
  return pick(keys);
}
function rankedTarget(rating){
  return clamp(80 + (rating - 1000) * 0.022, 74, 132);
}
function rankedOpponent(target){
  let best = null, bd = 99;
  for(const k of Object.keys(OPP)){
    const d = Math.abs(OPP[k].o - Math.min(target, 90));
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}
function opponentFor(mode){
  if(mode === 'normal') return Math.random() < 0.28 ? mixOpponent() : opponentOf(randomClub());
  if(mode === 'ranked') {
    const target = rankedTarget(S.rank.r);
    const o = opponentOf(rankedOpponent(target));
    const boost = Math.max(0, target - o.base) + rnd(-1, 1.5);
    const prof = aiProfile(tierOf(S.rank.r).idx);
    const b2 = boost + prof.ovr;
    return {...o, base: Math.round(o.base + b2), att:o.att + b2, mid:o.mid + b2, def:o.def + b2, cond:prof.cond, ai:prof};
  }
  return null;
}

/* 경기 결과 정산 — 라이브 1경기와 5·10경기 스킵이 같이 쓴다 */
function settleMatch(M){
  if(!M) return 'd';
  M.over = true;
  const res = M.me > M.op ? 'w' : M.me === M.op ? 'd' : 'l';
  const base = MODES[M.mode].coins[res === 'w' ? 0 : res === 'd' ? 1 : 2];
  const gd = Math.abs(M.me - M.op);
  let coins = base + (res === 'w' ? gd * 35 : 0);
  if(M.mode === 'ranked'){
    const oppOvr = Math.round(M.opp.base);
    const delta = res === 'w' ? Math.round(clamp(21 + (oppOvr - M.t.ovr) * 1.3, 14, 48))
      : res === 'd' ? Math.round(clamp(2 + (oppOvr - M.t.ovr) * 0.4, -6, 10))
      : -Math.round(clamp(10 + (M.t.ovr - oppOvr) * 0.8, 5, 26));
    M.ratingDelta = delta;
    S.rank.r = Math.max(0, S.rank.r + delta);
    S.rank[res] = (S.rank[res] || 0) + 1;
  }
  if(M.burn){ M.coinBase = coins; coins = Math.round(coins * BURN_COIN); M.burnBonus = coins - M.coinBase; }
  M.coins = coins;
  S.record[res] = (S.record[res] || 0) + 1;
  S.matches = (S.matches || 0) + 1;
  ensureQuests();
  questAdd('game', 1);
  questAdd('g11', 1);
  if(M.mode === 'ranked') questAdd('ranked', 1);
  if(res === 'w') questAdd('win', 1);
  if(res === 'w'){
    const qq = ensureQuests();
    if(M.info && M.info.low >= 11) qq.chal.low += 1;
    if(M.info && M.info.band) qq.chal.band += 1;
    if(Math.round(M.opp.base) > M.t.ovr) qq.chal.dog += 1;
    if(M.me >= 4) questAdd('big', 1);
    if(M.burn) questAdd('burn', 1);
  }
  if(M.chemi && M.chemi.add >= SYNERGY_ADD) questAdd('chemi', 1);
  if(M.chemi && M.chemi.add >= ALLSTAR_ADD) questAdd('allstar', 1);
  M.mvp = pickMVP(M);
  S.recent = [{m:M.mode, o:M.opp.club, me:M.me, op:M.op, res}].concat(S.recent || []).slice(0,4);
  S.coins += coins;
  if(M.t.ovr > (S.bestTeam.ovr || 0)) S.bestTeam = {ovr: M.t.ovr, f: M.f || ''};
  /* 임대 스쿼드는 이 경기로 계약 종료 */
  M.expired = true;
  M.res = res;
  S.squad = null; S.formation = null; S.draft = null;
  return res;
}

/* ---------- 패스 티켓 · 초고속 5·10경기 ---------- */
/* 매 슬롯 포지션별 최고 OVR(현재 버프 반영) 자동 드래프트 */
function autoDraftSquad(){
  const f = pick(FORM_KEYS);
  const used = new Set();
  const ovr = i => ovrOf({i, b:baseOvrOf(i)});
  const picks = FORMS[f].map(s => {
    const role = s[0];
    const pool = P.map((p, i) => i).filter(i => !used.has(i));
    const exact = pool.filter(i => posOf(i) === role || (role === 'ST' && posOf(i) === 'SS'));
    const near = pool.filter(i => NEAR[role].includes(posOf(i)));
    const same = pool.filter(i => grp(posOf(i)) === grp(role));
    const cand = exact.length ? exact : near.length ? near : same.length ? same : pool;
    const best = cand.slice().sort((a, b) => ovr(b) - ovr(a) || baseOvrOf(b) - baseOvrOf(a))[0];
    used.add(best);
    return {i:best, b:baseOvrOf(best), c:0};
  });
  S.squad = picks; S.formation = f;
  S.squadInfo = {low:0, band:bandOfSquad(picks)};
  S.draft = null;
  picks.forEach(updateBest);
  ensureQuests(); questAdd('draft', 1);
  return {f, picks};
}

  const M = {mode, opp, t:team, f:S.formation, info:S.squadInfo, drain:0, tac:tacKey, burn:burning,

    goals:[], rating:0, coins:0, diff:0, myName:'임대 XI', roster:null, roundName:'', quick:true};
  M.chemi = synergyOf(S.squad);

}

/* 경기 MVP — 컨디션·득점·OVR·결과 반영 */
function pickMVP(M){
  if(!M) return null;
  const tally = {};
  (M.goals || []).forEach(g => { if(g.side === 'me') tally[g.name] = (tally[g.name] || 0) + 1; });
  const e = (M.roster && M.roster.length)
    ? M.roster.map(x => ({name:x.name, role:x.role, ovr:x.ovr, c:0}))
    : squadEntries().map(x => ({name:P[x.inst.i][0], role:x.role, ovr:ovrOf(x.inst), c:(x.c || 0)}));
  if(!e.length) return null;
  const gd = M.me - M.op;
  let best = null;
  e.forEach(x => {
    const goals = tally[x.name] || 0;
    const g = cupGrp(x.role);
    const fit = g === 'FW' ? 1 : g === 'MF' ? 0.6 : 0.3;
    const sc = x.ovr * 0.5 + (x.c || 0) * 2.8 + goals * 14 + gd * 1.4 + fit * 3 + Math.random() * 3;
    if(!best || sc > best.sc) best = {name:x.name, role:x.role, ovr:x.ovr, goals, c:x.c || 0, sc};
  });
  if(!best) return null;
  let rating = 6.4 + best.goals * 1.1 + (best.c || 0) * 0.25 + (gd > 0 ? 0.6 : gd < 0 ? -0.4 : 0) + Math.min(1.2, (best.ovr - 70) * 0.025);
  rating = Math.round(Math.max(5.5, Math.min(10, rating)) * 10) / 10;
  return {...best, rating};
}

function duelPickOpp(target, skip){
  let best = null;

/* 배틀용 스탯 — HP·공격·수비·스피드 */

/* 1대1 대전 상태 빌드 — 라이브·스킵이 같이 쓴다 */
function duelSetup(kind){

  const cur = growCur();
  if(!cur){ toast('먼저 키울 선수를 뽑으세요'); return null; }
  if(kind === 'invite' && !U.ace){ toast('받은 1대1 초대가 없습니다'); return null; }
  const burnOn = burnState().on;
  const a = {i:cur.i, name:P[cur.i][0], role:posOf(cur.i), lv:growLv(), ovr:Math.round(ovrGrow(aceInst())) + (burnOn ? BURN_OVR : 0), cond:0};
  let b;
  if(kind === 'invite') b = {...U.ace};
  else {
    const target = a.ovr + (kind === 'ranked' ? clamp((tierOf(duelRec().r).idx - 2) * 3, -10, 14) : 0) + Math.round(Math.random() * 6 - 3);
    b = duelPickOpp(target, cur.i);

    turn:1, over:false, busy:false, auto:false,
    dmgMe:0, dmgOp:0, critMe:0, critOp:0, coins:0, ratingDelta:0, how:'ko',

/* ---------- 계산 ---------- */
function duelStrike(M, isMe, mv){
  const A = isMe ? M.a : M.b, B = isMe ? M.b : M.a;
  const SA = isMe ? M.ms : M.os, SB = isMe ? M.os : M.ms;
  const out = {miss:false, dmg:0, crit:false, eff:1, lvBonus:1, heal:0, guard:false, buff:''};
  if(mv.guard){
    const before = SA.hp;
    SA.hp = Math.min(SA.max, SA.hp + Math.round(SA.max * (mv.heal || .12)));
    out.heal = Math.round(SA.hp - before);
    SA.defMul = clamp(SA.defMul + .12, .7, 1.4);
    out.guard = true;
    return out;
  }
  if(mv.self) Object.keys(mv.self).forEach(k => {
    const v = mv.self[k];
    if(k === 'atk') SA.atkMul = clamp(SA.atkMul + .12 * v, .7, 1.4);
    else SA.defMul = clamp(SA.defMul + .12 * v, .7, 1.4);
  });
  if(mv.foe) Object.keys(mv.foe).forEach(k => {
    const v = mv.foe[k];
    if(k === 'atk') SB.atkMul = clamp(SB.atkMul + .1 * v, .7, 1.4);
  });
  const dodge = clamp(.05 + (SB.spd - SA.spd) * .004, .03, .2);
  const hitChance = clamp((mv.acc || 95) / 100 - dodge, .45, .99);
  if(Math.random() >= hitChance){ out.miss = true; return out; }
  const pow = mv.sig ? duelSigPow(A) : mv.p;
  const atk = SA.atk * SA.atkMul, def = Math.max(1, SB.def * SB.defMul);
  let dmg = pow * ((atk / (atk + def)) * 2) * rnd(.9, 1.1);
  out.eff = (DUEL_EFF[grp(A.role)] || {})[grp(B.role)] || 1;
  dmg *= out.eff;
  out.lvBonus = 1 + clamp(Math.round(A.lv || 0), 0, GROW_MAX) * .025;
  dmg *= out.lvBonus;
  out.crit = Math.random() < (mv.crit || .1);
  if(out.crit) dmg *= 1.65;
  out.dmg = Math.max(3, Math.round(dmg));
  SB.hp = Math.max(0, SB.hp - out.dmg);
  if(isMe){ M.dmgMe += out.dmg; if(out.crit) M.critMe += 1; }
  else { M.dmgOp += out.dmg; if(out.crit) M.critOp += 1; }
  return out;
}
function duelAiPick(M, isMe){
  const SA = isMe ? M.ms : M.os;
  const moves = isMe ? M.mMoves : M.oMoves;
  const cd = isMe ? M.mCd : M.oCd;
  let best = 0, bestSc = -1;
  moves.forEach((mv, k) => {
    if(mv.sig && (cd[k] || 0) > 0) return;
    let sc;
    if(mv.guard) sc = (SA.hp / SA.max < .42 ? 52 : 10) + Math.random() * 14;
    else {
      const p = mv.sig ? duelSigPow(isMe ? M.a : M.b) : mv.p;
      sc = p * (mv.acc || 95) / 100 + Math.random() * 15;
      if(mv.foe) sc += 9;
      if(mv.self) sc += 6;
      if(mv.sig) sc += 12;
    }
    if(sc > bestSc){ bestSc = sc; best = k; }
  });
  return best;
}

      else if(out.eff <= .95) tags.push('<em>효과가 별로였다…</em>');

      duelPop(isMe ? 'bPopOp' : 'bPopMe', '-' + out.dmg, false);

/* 스피드가 높은 쪽이 먼저 움직인다 */
function duelFirstSide(M){

}

function duelPlayerMove(idx, auto){
  const M = U.match;

  const mv = M.mMoves[idx];

    const [isMe, mvIdx] = order[k];
    duelAct(M, isMe, mvIdx, () => {
      if(!U.match || U.match !== M || M.over) return;

function duelSimRest(M){

      const isMe = side === 'me';
      const k = duelAiPick(M, isMe);
      const mv = (isMe ? M.mMoves : M.oMoves)[k];
      if(mv && mv.sig) (isMe ? M.mCd : M.oCd)[k] = DUEL_SIG_CD;
      duelStrike(M, isMe, mv);
      if(M.ms.hp <= 0 || M.os.hp <= 0){ finishDuel(); return; }
    }
    M.turn += 1;
    ['mCd', 'oCd'].forEach(k => M[k].forEach((v, n) => { if(v > 0) M[k][n] = v - 1; }));
    if(M.turn > DUEL_MAX_TURN){ finishDuel(); return; }
  }

function duelSimFast(M){

    for(const side of order){
      const isMe = side === 'me';
      const k = duelAiPick(M, isMe);
      const mv = (isMe ? M.mMoves : M.oMoves)[k];
      if(mv && mv.sig) (isMe ? M.mCd : M.oCd)[k] = DUEL_SIG_CD;
      duelStrike(M, isMe, mv);
      if(M.ms.hp <= 0 || M.os.hp <= 0) return;
    }
    M.turn += 1;
    ['mCd', 'oCd'].forEach(k => M[k].forEach((v, n) => { if(v > 0) M[k][n] = v - 1; }));
    if(M.turn > DUEL_MAX_TURN) return;
  }
}
function duelSkip(kind, n){

/* 1대1 정산 — 라이브 배틀과 5·10경기 스킵이 같이 쓴다 */
function settleDuel(M){
  if(!M || !M.duel) return 'd';
  M.over = true; M.busy = false;
  const mr = M.ms.hp / Math.max(1, M.ms.max), orr = M.os.hp / Math.max(1, M.os.max);
  let res;
  if(M.os.hp <= 0 && M.ms.hp <= 0){ res = 'd'; M.how = 'ko'; }
  else if(M.os.hp <= 0){ res = 'w'; M.how = 'ko'; }
  else if(M.ms.hp <= 0){ res = 'l'; M.how = 'ko'; }
  else {
    const d = mr - orr;
    res = d >= .08 ? 'w' : d <= -.08 ? 'l' : 'd';
    M.how = 'judge';
  }
  M.res = res;
  const base = M.kind === 'ranked' ? (res === 'w' ? 260 : res === 'd' ? 90 : 40) : (res === 'w' ? 190 : res === 'd' ? 70 : 30);
  const speed = Math.max(0, DUEL_MAX_TURN - M.turn) * (res === 'w' ? 7 : 2);
  M.coins = base + speed + (res === 'w' ? Math.round(mr * 120) : 0);
  const d1 = duelRec();
  d1[res] = (d1[res] || 0) + 1;

      : res === 'd' ? 2 : -Math.round(clamp(8 + (M.a.ovr - M.b.ovr) * .6, 4, 20));
    M.ratingDelta = delta;
    d1.r = Math.max(0, d1.r + delta);
  }
  if(M.burn){ M.coinBase = M.coins; M.coins = Math.round(M.coins * BURN_COIN); M.burnBonus = M.coins - M.coinBase; }
  S.coins += M.coins;
  ensureQuests(); questAdd('game', 1); questAdd('g1', 1);
  if(res === 'w') questAdd('win', 1);

/* ---------- 패스 티켓 · 드래프트 엘리트 리롤 ---------- */
function draftTargetClub(){
  const picks = (S.draft && S.draft.picks) || [];
  const tally = {};
  picks.forEach(p => { const c = P[p.i] ? P[p.i][1] : ''; if(c) tally[c] = (tally[c] || 0) + 1; });
  const club = Object.keys(tally).sort((a,b) => tally[b] - tally[a])[0] || '';
  if(club) return club;
  const tb = S.tbuf || {};
  return Object.keys(tb).filter(c => (tb[c] || 0) > 0).sort((a,b) => tb[b] - tb[a])[0] || '';
}
function eliteOptions(f, slotIdx, taken){
  const role = FORMS[f][slotIdx][0];
  const used = new Set(taken);
  const pool = P.map((p,i)=>i).filter(i => !used.has(i))
    .filter(i => posOf(i) === role || (role==='ST'&&posOf(i)==='SS') || NEAR[role].includes(posOf(i)) || grp(posOf(i)) === grp(role));
  const target = draftTargetClub();
  const byBase = list => list.slice().sort((a,b) => baseOvrOf(b) - baseOvrOf(a) || ovrOf({i:b,b:baseOvrOf(b)}) - ovrOf({i:a,b:baseOvrOf(a)}));
  const out = [];
  const takeI = i => { if(i != null && out.indexOf(i) < 0) out.push(i); };
  /* 1) 지금 모으는 팀컬러 클럽에서 최고 기본 OVR */
  if(target) byBase(pool.filter(i => P[i][1] === target)).slice(0, 1).forEach(takeI);
  /* 2) 기본 84+ 중 최고 — 최소 2명은 88~95 보장 */
  for(const i of byBase(pool.filter(i => baseOvrOf(i) >= 84))){ if(out.length >= 2) break; takeI(i); }
  if(out.length < 2) for(const i of byBase(pool)){ if(out.length >= 2) break; takeI(i); }
  const opts = out.map(i => ({i, b: clamp(Math.max(baseOvrOf(i), 88 + Math.floor(Math.random() * 4)), 88, 95), c: rollCond(), elite:true}));
  const rest = sampleOptions(f, slotIdx, taken.concat(opts.map(o => o.i)));
  rest.forEach(o => { if(opts.length < DRAFT_OPTS && !opts.some(x => x.i === o.i)) opts.push(o); });
  return opts.slice(0, DRAFT_OPTS).sort((a,b) => ovrOf(b) - ovrOf(a) || b.b - a.b);
}
function eliteReroll(){
  if(!S.draft) return;
  if(ticketCount() < ELITE_TICKET){ toast('패스 티켓이 ' + (ELITE_TICKET - ticketCount()) + '장 부족합니다'); return; }
  spendTickets(ELITE_TICKET);
  S.draft.opts = eliteOptions(S.draft.f, S.draft.picks.length, S.draft.picks.map(p => p.i));
  save(); render();
  toast('🎫 엘리트 리롤 · 기본 88~95 후보 확보');
}

function duelRec(){

function growPickNew(){
  const L = growList();

  while(used.has(i) && guard++ < 220) i = Math.floor(Math.random() * P.length);

function growAdd(i){

  growSaveActive();

function growRelease(k){

  } else { S.grow.i = null; S.grow.lv = 0; S.grow.idx = 0; }

function growAttempt(){
  const cur = growCur();
  if(!cur){ toast('먼저 키울 선수를 뽑으세요'); return; }
  const lv = growLv();
  if(lv >= GROW_MAX){ toast('이미 +' + GROW_MAX + '강입니다'); return; }
  const t = growStep(lv), prot = !!S.grow.prot, safe = !!S.grow.safe;
  const price = t.cost + (prot ? PROT_COST : 0);
  if(safe && ticketCount() < SAFE_TICKET){ toast('패스 티켓이 ' + (SAFE_TICKET - ticketCount()) + '장 부족합니다'); return; }
  if(S.coins < price){ toast('코인이 ' + fmt(price - S.coins) + ' 부족합니다'); return; }
  S.coins -= price;
  if(safe) S.tickets = ticketCount() - SAFE_TICKET;
  const rate = safe ? Math.min(98, t.p + 6) : t.p;
  const ok = Math.random() * 100 < rate;
  let out;
  if(ok){
    S.grow.lv = lv + 1;
    const prev = Math.max(0, Math.round(+S.grow.best || 0));
    if(lv + 1 > prev) S.grow.best = lv + 1;
    out = {res:'ok', from:lv, to:lv+1, msg:'성공! +' + (lv+1) + '강'};
    if(lv + 1 >= 10 && lv + 1 > prev) out.msg += lv + 1 >= 15 ? ' · 👑 최고 기록 +15강!' : ' · 🥇 최고 기록 +' + (lv+1) + '강 돌파!';
  }
  else if(safe){
    out = {res:'keep', from:lv, to:lv, msg:'🎫 완전 보호 발동 · +' + lv + '강 그대로 유지'};
  }
  else if(prot){
    if(Math.random() < 0.55){ out = {res:'keep', from:lv, to:lv, msg:'보호카드 발동 · +' + lv + '강 유지'}; }
    else {
      const to = Math.max(0, lv - (1 + Math.floor(Math.random() * 7)));
      S.grow.lv = to;
      out = {res:'drop', from:lv, to, msg:'보호 하락 · +' + lv + ' → +' + to + '강'};
    }
  } else {
    S.grow.lv = 0;
    out = {res:'boom', from:lv, to:0, msg:'터졌습니다 · 0강' };
  }
  out.lv = S.grow.lv;
  S.grow.last = out;
  growSaveActive();
  save(); paintHud(); renderGrow(true);
  if(out.res === 'ok'){
    popFx('+' + out.to + '강');
    if(out.to >= 10 && /최고 기록/.test(out.msg)) toast(out.msg.slice(out.msg.indexOf('·') + 2));
    else if(out.to === 10 || out.to === 15) toast((out.to >= 15 ? '👑 ' : '🥇 ') + '최고 강화 +' + out.to + '강 달성');
  }
  else if(out.res === 'boom') popFx('0강');
}

function addTick(ev, silent){
  const host = $('#tkHost'); if(!host) return;
  const el = document.createElement('div');
  el.className = 'tk ' + (ev.cls || '');
  el.innerHTML = `<div class="mm">${esc(ev.mm || '—')}</div><div class="tx">${esc(ev.text)}${ev.score?`<div class="mono" style="font-size:10px;color:var(--lime);margin-top:2px">${esc(ev.score)}</div>`:''}</div>`;
  if(silent) el.style.animation = 'none';
  host.prepend(el);
  while(host.children.length > 24) host.lastChild.remove();
}
function paintMatch(){
  const M = U.match; if(!M) return;
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('mMe', M.me); set('mOp', M.op);
  if(M.half){ set('mMin', 'HT'); set('mHalf', ''); }
  else { set('mMin', M.min + "'"); set('mHalf', M.min <= 45 ? '전반' : '후반'); }
  const c = condOf(M.t.cond || 0);
  set('mCond', '컨디션 ' + c.n + ' ' + c.s);
  if(M.cupMode){
    const ed = cupEdge(M.tac || 'balance', M.cupOppTac || 'balance');
    set('mTac', '· 상대 ' + CUP_TACTS[M.cupOppTac || 'balance'].name + (ed > 0 ? ' · 상성 우위' : ed < 0 ? ' · 상성 열세' : ''));
  } else {
    set('mTac', (M.opp && M.opp.ai && M.opp.ai.tactic && M.opp.ai.tactic !== 'probe') ? '· 상대 ' + AI_TACTICS[M.opp.ai.tactic].name : '');
  }
  const pv = document.getElementById('mTacPrev');
  if(pv) pv.innerHTML = cupTacLineHTML(M.cupOppTac || 'balance');
  document.querySelectorAll('#mTacBar .tacbtn').forEach(b => b.classList.toggle('on', b.dataset.k === (M.tac || S.tactic || 'balance')));
  const hb = document.getElementById('mHalfBox');
  if(hb){
    hb.style.display = M.half ? 'block' : 'none';
    if(M.half) paintHalf();
  }
  set('sPoss', M.poss + '%'); set('sShots', M.shotsMe + ' - ' + M.shotsOp);
  const mom = M.t.att - M.opp.def > 2 ? '압도' : M.t.att - M.opp.def > -2 ? '팽팽' : '열세';
  set('sMom', mom); set('mCount', M.ev.length + '개');
  const bar = document.getElementById('mBar'); if(bar) bar.style.width = clamp(M.min / 90 * 100, 0, 100) + '%';
}

function goalsCard(M){
  const g = (M.goals || []).slice().sort((a, b) => a.min - b.min);
  if(!g.length) return '<div class="glist"><div class="gline empty"><span class="nm">득점 없이 경기가 끝났습니다</span></div></div>';
  /* 다득점이어도 높이 고정 · 안쪽 스크롤, 잘라내지 않는다 */
  const rows = g.map(x => `<div class="gline ${x.side === 'me' ? 'me' : 'op'}">
      <span class="mm">${esc(x.mm)}</span><span class="dot"></span>
      <span class="nm">${esc(x.name)}</span>

const BUF_SEGS = [{k:'pos', n:'포지션'}, {k:'team', n:'팀컬러'}, {k:'player', n:'선수별'}];
function pbufLv(i){ return Math.max(0, Math.round(+(((S.pbuf || {})[String(i)])) || 0)); }
function tbufLv(club){ return Math.min(TBUF_MAX, Math.max(0, Math.round(+(((S.tbuf || {})[club])) || 0))); }
function pbufTotal(){ const m = S.pbuf || {}; return Object.keys(m).reduce((s,k) => s + Math.max(0, Math.round(+m[k] || 0)), 0); }
function tbufTotal(){ const m = S.tbuf || {}; return Object.keys(m).reduce((s,k) => s + Math.max(0, Math.round(+m[k] || 0)), 0); }
function clubPool(){
  const m = {};
  P.forEach(p => {
    const c = p[1]; if(!c) return;
    if(!m[c]) m[c] = {club:c, league:p[2], n:0, best:0};
    m[c].n++; m[c].best = Math.max(m[c].best, p[4]);
  });
  return Object.keys(m).map(c => m[c]).sort((a,b) => b.n - a.n || b.best - a.best || a.club.localeCompare(b.club));
}
function buyTeamBuf(club, n){
  if(!club || !clubPool().some(c => c.club === club)) return;
  const L = tbufLv(club);
  if(L >= TBUF_MAX){ toast(club + ' 팀컬러는 최대 +' + TBUF_MAX + '입니다'); return; }
  const step = Math.min(Math.max(1, Math.round(n || 1)), TBUF_MAX - L);
  const price = tbufCostN(L, step);
  if(S.coins < price){ toast('코인이 ' + fmt(price - S.coins) + ' 부족합니다'); return; }
  S.coins -= price;
  S.tbuf = S.tbuf || {}; S.tbuf[club] = L + step;
  ensureQuests(); questAdd('buff', step);
  save(); paintHud(); refreshBuff();
  toast(club + ' 팀컬러 +' + S.tbuf[club] + ' · 이 클럽 선수 전원 OVR +' + S.tbuf[club]);
  popFx('팀컬러 +' + S.tbuf[club]);
}
function buyPlayerBuf(i, n){

            <div class="q-bar"><s style="width:${clamp(v / it.goal * 100, 0, 100)}%"></s></div></div>

    ${sec('day')}${sec('week')}${sec('month')}${sec('chal')}${sec('tk')}${sec('tkw')}${sec('rep')}`;
}

/* ---------- grow board ---------- */
function growHTML(){
  const g = S.grow || {};
  const picked = g.i != null && g.i >= 0 && g.i < P.length;
  const roster = growList(), ridx = growIdx();
  const head = `<div class="eyebrow">TRAIN · 0 → +${GROW_MAX}강</div>
    <div class="between"><h2 class="title">선수 키우기</h2><span class="tiny">보관함 ${roster.length}/${GROW_SLOTS}</span></div>
    <div class="groster" style="margin-top:10px">
      ${roster.map((x, k) => `<button class="gchip ${k === ridx && picked ? 'on' : ''}" data-act="grow-switch" data-k="${k}">
        <b>${esc(P[x.i][0])}</b><small>+${x.lv}강 · ${posOf(x.i)}</small></button>`).join('')}
      <button class="gchip add" data-act="grow-pick">＋ 새 선수<small>${roster.length}/${GROW_SLOTS}</small></button>
    </div>`;
  if(!picked){
    return `${head}
    <div class="sect grow-empty"><div class="empty"><div class="ic">🔨</div><b>키울 선수를 뽑아주세요</b>
      <div class="muted">${P.length}명 중 원하는 만큼 데려와 보관함(${GROW_SLOTS}명)에 두고, 탭해서 전환하며 0강부터 +15강까지 키웁니다. 지금 고른 선수 1명이 1대1 대결에 그대로 출전합니다.</div>
      <button class="btn primary" style="margin:14px auto 0;width:200px" data-act="grow-pick">선수 뽑기</button></div></div>`;
  }
  const lv = growLv(), sp = posOf(g.i), base = baseOvrOf(g.i), bl = S.buf[grp(sp)] || 0;
  const inst = {i:g.i, b:base, lv, c:0};
  const ovr = ovrGrow(inst), st = statsGrow(inst);
  const nm = P[g.i][0], club = P[g.i][1], lg = P[g.i][2];
  const step = growStep(Math.min(lv, GROW_MAX - 1));
  const prot = !!g.prot, safe = !!g.safe, done = lv >= GROW_MAX;
  const price = done ? 0 : step.cost + (prot ? PROT_COST : 0);
  const rate = safe ? Math.min(98, step.p + 6) : step.p;
  const segs = Array.from({length:GROW_MAX}, (_,k) => `<i class="${k<lv?'on':''}"></i>`).join('');
  const labels = labelsOf(sp);
  const rows = labels.map((a,k) => `<div class="stat">
      <div class="lb">${a}</div><div class="vl">${st[k]}</div>
      <div class="tr"><s style="width:${clamp((st[k]-40)*1.1,4,100)}%"></s></div>
      <div class="tiny" style="width:34px;text-align:right;color:var(--dim)">+${lv*GROW_STEP + bl}</div>
    </div>`).join('');
  const res = g.last ? `<div class="gr-res ${g.last.res}">${esc(g.last.msg)}</div>` : '';
  const bestLv = Math.max(0, Math.round(+g.best || 0));
  const honor = bestLv >= 10 ? `<div class="honor ${bestLv >= 15 ? 'top' : ''}">${bestLv >= 15 ? '👑' : '🥇'} 최고 기록 <b>+${bestLv}강</b>${bestLv >= 15 ? ' · 명예의 전당' : ''}</div>` : '';
  return `${head}
  ${honor}
  <div class="gr-hero" style="margin-top:11px">
    <div class="between">
      <div style="min-width:0">
        <div class="eyebrow">${sp} · ${esc(LG[lg]||lg)}</div>
        <div class="nm">${esc(nm)}</div>
        <div class="tiny" style="margin-top:3px">${esc(club)} · 기본 ${base} · 강화 +${lv*GROW_STEP} · 버프 +${bl}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto"><div class="ovr">${ovr}</div>
        <div class="gr-lv" style="margin-top:4px">+${lv}강</div></div>
    </div>
    <div class="gr-seg">${segs}</div>
  </div>
  <div class="stack" style="margin-top:11px">
    <button class="gr-go" data-act="grow-try" ${done ? 'disabled' : ''}>
      ${done ? '최대 +15강 달성' : '+' + (lv+1) + '강 도전'}
      <small>${done ? '다른 선수를 뽑아 다시 키우세요' : fmt(price) + '코인' + (safe ? ' + 🎫' + SAFE_TICKET : '') + ' · 성공 ' + rate + '%' + (safe ? ' · 완전 보호' : prot ? ' · 보호카드' : '')}</small>
    </button>
    <div class="row" style="gap:6px;justify-content:center;flex-wrap:wrap">
      <button class="chip ${prot?'on':''}" data-act="grow-prot">🛡 보호카드 ${prot?'ON':'OFF'} · ${fmt(PROT_COST)}</button>
      <button class="chip tk ${safe?'on':''}" data-act="grow-safe">🎫 완전 보호 ${safe?'ON':'OFF'} · ${SAFE_TICKET}장</button>
      <button class="chip" data-act="grow-release" data-k="${ridx}">방출</button>
    </div>
    ${res}
  </div>
  <div class="card" style="padding:6px 13px;margin-top:11px">${rows}</div>
  <div class="tiny" style="margin-top:9px;line-height:1.6">성공하면 +${GROW_STEP}씩 능력치가 오릅니다. 보호카드 없이 실패하면 0강으로 초기화, 켜고 실패하면 55% 유지 · 45%는 1~7강 하락. 🎫 완전 보호는 실패해도 100% 유지 + 성공률 +6%p.</div>
  <div class="sect stack">
    <div class="sect-h"><div class="eyebrow g">키운 선수로 1대1 대결</div><div class="tiny">1대1 전적 ${duelRecordText()}</div></div>
    <div class="duelcard">
      <div class="dc-l"><span>1 VS 1 · MY PICK</span><b>${esc(nm)}</b><small>${sp} · ${esc(club)}</small></div>
      <div class="dc-r"><b>${ovr}</b><span>+${lv}강</span></div>
    </div>
    <div class="tiny" style="margin-top:-4px">기술 4개를 주고받는 턴제 배틀. 상대 HP를 먼저 0으로 만들면 승리. 일반전은 실력이 비슷한 선수를, 랭킹전은 내 레이팅에 맞는 선수를 데려옵니다.</div>
    <div class="duelmodes">
      <button class="dmode" data-act="grow-duel" data-mode="normal"><span class="ic">⚔️</span><b>1대1 일반</b><small>비슷한 실력</small></button>
      <button class="dmode hot" data-act="grow-duel" data-mode="ranked"><span class="ic">🏆</span><b>1대1 랭킹</b><small>레이팅 매칭</small></button>
      <button class="dmode" data-act="grow-duel" data-mode="invite" ${U.ace?'':'disabled'}><span class="ic">🤝</span><b>1대1 초대</b><small>${U.ace ? esc(U.ace.name) + ' +' + U.ace.lv + '강' : '받은 초대 없음'}</small></button>
    </div>
    <div class="tkcard" style="margin-top:2px">
      <div class="hd"><b>⚡ 패스 티켓 초고속</b><span class="tiny" style="color:var(--amber)">🎫 ${fmt(ticketCount())}장</span></div>
      <div class="tiny" style="margin-top:3px">지금 키우는 선수로 연속 대결하고 한 번에 결과를 봅니다</div>
      <div class="skrow"><span class="lb">⚔️ 일반전</span>
        <button class="chip tk ${ticketCount()<1?'poor':''}" data-act="duel-skip-run" data-mode="normal" data-n="5">⚡ 5경기 <b>🎫1</b></button>
        <button class="chip tk ${ticketCount()<2?'poor':''}" data-act="duel-skip-run" data-mode="normal" data-n="10">⚡ 10경기 <b>🎫2</b></button>
      </div>
      <div class="skrow"><span class="lb">🏆 AI 랭킹전</span>
        <button class="chip tk ${ticketCount()<1?'poor':''}" data-act="duel-skip-run" data-mode="ranked" data-n="5">⚡ 5경기 <b>🎫1</b></button>
        <button class="chip tk ${ticketCount()<2?'poor':''}" data-act="duel-skip-run" data-mode="ranked" data-n="10">⚡ 10경기 <b>🎫2</b></button>
      </div>
    </div>
    <button class="btn dark wide" data-act="grow-invite">🔗 이 선수로 1대1 초대 링크 복사</button>
    <div class="row" style="gap:6px">
      <button class="btn dark" style="flex:1" data-act="grow-pick">🎲 새 선수 뽑기</button>
      <button class="btn dark" style="flex:1" data-act="grow-scout">🔎 지정 스카우트 🎫${SCOUT_TICKET}</button>
    </div>
    <div class="tiny" style="text-align:center">보관함 ${roster.length}/${GROW_SLOTS}</div>
  </div>`;
}

/* ---------- ranking ---------- */
function tierOf(r){
  let t = TIERS[0];
  for(const x of TIERS) if(r >= x.min) t = x;
  const i = TIERS.indexOf(t);
  return {...t, idx:i, next:TIERS[i+1] || null};
}
function recordText(){ return `${S.rank.w}승 ${S.rank.d}무 ${S.rank.l}패`; }
function duelWr(){ const d = duelRec(), n = d.w + d.d + d.l; return n ? '승률 ' + Math.round(d.w / n * 100) + '%' : '기록 없음'; }
function shareText(){
  const t = tierOf(S.rank.r);
  const lgCups = S.leagueCups || [], lgUnder = lgCups.filter(x => x.under).length;
  const total = S.record.w + S.record.d + S.record.l;
  const wr = total ? Math.round(S.record.w / total * 100) : 0;
  const tOvr = S.bestTeam.ovr || (teamStats() ? teamStats().ovr : 0) || '-';
  return '⚽ DRAFT XI 26/27\n'
    + '식별코드 #' + S.code + '\n'
    + 'AI 랭킹전 ' + t.n + ' ' + S.rank.r + '점 (' + recordText() + ')\n'
    + '총 버프 Lv ' + fmt(totalBuf()) + ' · ' + bufLine() + '\n'
    + '최고 팀 OVR ' + tOvr + (S.bestTeam.f ? ' (' + S.bestTeam.f + ')' : '') + '\n'
    + (S.grow && S.grow.best ? '최고 강화 +' + S.grow.best + '강' + (S.grow.best >= 10 ? ' 🥇' : '') + '\n' : '')
    + '레전드 컵 ' + tCups('cup').length + '회 우승' + (tRec('cup').n ? ' (' + tRec('cup').w + '승 ' + tRec('cup').l + '패)' : '') + '\n'
    + '🌍 26/27 국대전 ' + tCups('nat').length + '회 우승' + (tRec('nat').n ? ' (' + tRec('nat').w + '승 ' + tRec('nat').l + '패)' : '') + '\n'
    + '🏅 레전드 국대전 ' + tCups('natleg').length + '회 우승' + (tRec('natleg').n ? ' (' + tRec('natleg').w + '승 ' + tRec('natleg').l + '패)' : '') + '\n'
    + '26/27 리그 ' + lgCups.length + '회 우승' + (lgUnder ? ' (언더독 ' + lgUnder + '회 🐴)' : '') + (S.leagueRec && S.leagueRec.n ? ' (' + S.leagueRec.w + '승 ' + S.leagueRec.d + '무 ' + S.leagueRec.l + '패)' : '') + '\n'
    + '11대11 경기 ' + S.matches + '회 · 승률 ' + wr + '%\n'
    + '패스 티켓 ' + ticketCount() + '장\n'
    + '키우기 1대1 ' + duelRecordText() + ' · 레이팅 ' + duelRec().r;
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if(ev.target && ev.target.id === 'sheetHost'){ $('#sheetHost').classList.remove('on'); return; }
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'start-draft'){ startDraft(); }
  else if(act === 'reroll'){
    if(!S.draft) return;

    S.draft.opts = sampleOptions(S.draft.f, S.draft.picks.length, S.draft.picks.map(p=>p.i));

  }
  else if(act === 'elite-reroll'){ eliteReroll(); }

    const k = +el.dataset.k;
    if(S.draft && S.draft.opts[k]) choosePick(S.draft.opts[k]);
  }
  else if(act === 'player'){ openPlayer(+el.dataset.k); }
  else if(act === 'close-sheet'){ $('#sheetHost').classList.remove('on'); }
  else if(act === 'sheet-buff'){ $('#sheetHost').classList.remove('on'); U.match = null; U.tab='upgrade'; render(); }

  }

  }
  else if(act === 'tactic'){ setTactic(el.dataset.k); }
  else if(act === 'go-stadium'){ if(U.match && U.match.timer) clearInterval(U.match.timer); U.match=null; U.tab='stadium'; render(); }
  else if(act === 'go-upgrade'){ if(U.match && U.match.timer) clearInterval(U.match.timer); U.match=null; U.tab='upgrade'; render(); }
  else if(act === 'mode'){

    if(m === 'friendly'){ U.friendly.open = true; render(); }

  }
  else if(act === 'start-ranked'){ $('#sheetHost').classList.remove('on'); startMatch('ranked', opponentFor('ranked')); }
  else if(act === 'start-drain'){ $('#sheetHost').classList.remove('on'); startMatch('ranked', opponentFor('ranked'), {drain:true}); }
  else if(act === 'play-invite'){ if(U.invite){ U.match = null; startMatch('invite', opponentFromInvite(U.invite)); } }
  else if(act === 'copy-invite'){ copyInvite(); }
  else if(act === 'cancel-invite'){ U.invite = null; try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} render(); }

  else if(act === 'qall'){ claimAllQuests(); }
  else if(act === 'qatt'){ claimAtt(); }
  else if(act === 'care'){ openCareSheet(); }

  else if(act === 'grow-pick'){ growPickNew(); }

  }
  else if(act === 'confirm-grow-release'){
    $('#sheetHost').classList.remove('on');
    const k = PEND_REL; PEND_REL = null;
    if(k != null && growList()[k]) growRelease(k);
  }
  else if(act === 'confirm-grow-pick'){ $('#sheetHost').classList.remove('on'); growPickNew(); }
  else if(act === 'grow-try'){ growAttempt(); }
  else if(act === 'grow-prot'){ if(S.grow){ S.grow.prot = !S.grow.prot; if(S.grow.prot) S.grow.safe = false; save(); renderGrow(true); } }
  else if(act === 'grow-safe'){ if(S.grow){ S.grow.safe = !S.grow.safe; if(S.grow.safe) S.grow.prot = false; save(); renderGrow(true); } }
  else if(act === 'grow-scout'){ openScoutSheet(); }
  else if(act === 'scout-lg'){ U.scout = Object.assign({}, U.scout || {}, {lg:el.dataset.l}); openScoutSheet(); }

  else if(act === 'scout-go'){ scoutPick(); }
  else if(act === 'skip-run'){ startSkip(el.dataset.mode, +el.dataset.n); }
  else if(act === 'skip-again'){ startSkip(el.dataset.mode, +el.dataset.n); }
  else if(act === 'skip-close'){ U.skip = null; U.tab = 'stadium'; render(); }
  else if(act === 'duel-skip-run'){ duelSkip(el.dataset.mode, +el.dataset.n); }
  else if(act === 'grow-duel'){ startDuel(el.dataset.mode); }
  else if(act === 'duel-move'){ duelPlayerMove(+el.dataset.k); }

  }

  else if(act === 'quit-duel'){ U.match = null; U.tab = 'grow'; render(); }
  else if(act === 'grow-invite'){ copyGrowInvite(); }
  else if(act === 'backup'){ openBackupSheet(); }
  else if(act === 'backup-download'){ downloadBackup(); }
  else if(act === 'backup-copy'){ copyBackup(); }
  else if(act === 'backup-import-text'){ const t = document.getElementById('impText'); importJSON(t ? t.value : ''); }

  else if(act === 'fdiff'){ U.friendly.diff = +el.dataset.v; S.fdiff = U.friendly.diff; save(); render(); }
  else if(act === 'fb-set'){ S.fboost = Math.max(1, Math.round(+el.dataset.n || 0)); save(); render(); }

  else if(act === 'fav-only'){ U.favOnly = !U.favOnly; refreshBuff(); }

  else if(act === 'play-friendly'){
    const club = el.dataset.c;
    const o = friendlyOpp(club);
    startMatch('friendly', o);
  }
  else if(act === 'skip'){
    const m = U.match; if(!m || m.over) return;
    clearInterval(m.timer); m.timer = null;
    m.half = false;
    while(m.min < 90 && !m.over){
      m.min += 5;
      if(m.min >= 90){ finishMatch(); break; }
      if(m.min === 45){ pushEvent({type:'half', mm:"45'", text:'전반 종료. ' + scoreText(m) + '.', cls:'half'}); aiHalftime(m); continue; }
      simulateMinute(m);
    }
    paintMatch();
  }
  else if(act === 'next-draft'){
    if(U.match && U.match.timer) clearInterval(U.match.timer);
    U.match = null;
    startDraft();
  }
  else if(act === 'quit-match'){
    if(U.match && !U.match.over && (U.match.mode === 'cup' || U.match.mode === 'nat' || U.match.mode === 'natleg'))

    else if(U.match && !U.match.over && U.match.mode === 'league')
      openConfirm('리그 경기를 나갈까요?', '진행 중인 경기는 기록되지 않고 같은 라운드에 다시 들어갈 수 있습니다.', '나가기', 'confirm-quit');
    else if(U.match && !U.match.over) openConfirm('중계를 나갈까요?', '진행 중인 경기는 기록되지 않습니다.', '나가기', 'confirm-quit');
    else { U.match = null; U.tab='stadium'; render(); }
  }
  else if(act === 'confirm-quit'){
    $('#sheetHost').classList.remove('on');
    const wasLg = U.match && U.match.mode === 'league';
    if(U.match && U.match.timer) clearInterval(U.match.timer);
    U.match = null;
    if(wasLg){ U.tab = 'cup'; U.contest = 'league'; } else U.tab = 'stadium';
    render();
  }
  else if(act === 'confirm-cup-forfeit'){ $('#sheetHost').classList.remove('on'); tourForfeit(U.match && U.match.tk ? U.match.tk : (U.contest || 'cup')); }
  else if(act === 'tour-open'){ tourOpen(el.dataset.k === 'nat' ? 'nat' : el.dataset.k === 'natleg' ? 'natleg' : 'cup', +el.dataset.size === 16 ? 16 : 32); }
  else if(act === 'tour-reroll'){ tourReroll(U.contest || 'cup'); }
  else if(act === 'tour-care'){ tourCare(el.dataset.k === 'nat' ? 'nat' : el.dataset.k === 'natleg' ? 'natleg' : (U.contest || 'cup'), el.dataset.c); }
  else if(act === 'cup-tactic'){ setCupTactic(el.dataset.k); }
  else if(act === 'tour-cancel'){ const k = U.contest || 'cup'; tSelSet(k, null); U.tourPick = null; if(k === 'cup') U.cupSel = null; save(); render(); }
  else if(act === 'tour-pick'){ const k = U.contest || 'cup'; const o = tSelGet(k); if(o) tourStart(k, el.dataset.id, o.size); }
  else if(act === 'tour-play'){ tourPlay(el.dataset.k === 'nat' ? 'nat' : el.dataset.k === 'natleg' ? 'natleg' : (U.contest || 'cup')); }
  else if(act === 'tour-round'){ U.cupR = +el.dataset.r; render(); }
  else if(act === 'tour-next'){ U.match = null; const k = U.contest || 'cup'; const c = tGet(k); U.cupR = (c && !c.done) ? c.round : null; U.tab = 'cup'; render(); }
  else if(act === 'tour-new'){ const k = el.dataset.k === 'nat' ? 'nat' : el.dataset.k === 'natleg' ? 'natleg' : (U.contest || 'cup'); U.match = null; tSet(k, null); tSelSet(k, null); tCareSet(k, 0); U.cupSel = null; U.tourPick = null; U.cupR = 0; U.tab = 'cup'; U.contest = k; save(); render(); }
  else if(act === 'tour-abandon'){ const k = el.dataset.k === 'nat' ? 'nat' : el.dataset.k === 'natleg' ? 'natleg' : (U.contest || 'cup'); U.confirmTour = k; openConfirm(tmeta(k).name + '을 포기할까요?', '진행 중인 대진이 사라집니다. 코인과 우승 기록은 남습니다.', '포기', 'confirm-tour-abandon'); }
  else if(act === 'confirm-tour-abandon'){ $('#sheetHost').classList.remove('on'); const k = U.confirmTour || U.contest || 'cup'; U.match = null; tSet(k, null); tSelSet(k, null); tCareSet(k, 0); U.cupSel = null; U.tourPick = null; U.cupR = 0; U.tab = 'cup'; U.contest = k; save(); render(); toast(tmeta(k).name + ' 포기'); }
  else if(act === 'tour-history'){ openTourHistory(el.dataset.k || 'all'); }
  else if(act === 'contest-seg'){
    const k = el.dataset.k;
    U.contest = (k === 'league' || k === 'nat' || k === 'natleg') ? k : 'cup';
    if(U.contest === 'league' && S.leagueSel) U.lgSel = S.leagueSel;
    if(U.contest === 'cup' && tSelGet('cup')){ U.tourPick = 'cup'; U.cupSel = tSelGet('cup'); }
    render();
  }
  else if(act === 'lg-open'){ lgOffer(); }
  else if(act === 'lg-reroll'){ lgReroll(); }
  else if(act === 'lg-pick'){ lgStart(el.dataset.c); }
  else if(act === 'lg-cancel'){ S.leagueSel = null; U.lgSel = null; S.leagueCare = 0; save(); render(); }
  else if(act === 'lg-play'){ lgPlay(); }
  else if(act === 'lg-care'){ lgCare(el.dataset.k); }
  else if(act === 'lg-rest'){ lgRestRound(); }
  else if(act === 'lg-next'){ U.match = null; U.tab = 'cup'; U.contest = 'league'; render(); }
  else if(act === 'lg-new'){ U.match = null; S.league = null; S.leagueSel = null; U.lgSel = null; S.leagueCare = 0; save(); lgOffer(); }
  else if(act === 'lg-history'){ openLeagueHistory(); }
  else if(act === 'lg-joker-pick'){ lgJokerPick(+el.dataset.k); }
  else if(act === 'lg-joker-skip'){ lgJokerSkip(); }
  else if(act === 'pen-dir'){
    penTake(el.dataset.k);
    if(U.match && U.match.pen && !U.match.pen.done) renderPenalty();
  }
  else if(act === 'pen-auto'){ penAuto(); }
  else if(act === 'lg-abandon'){ openConfirm('26/27 리그를 포기할까요?', '진행 중인 시즌이 사라집니다. 리그 우승 기록은 남습니다.', '포기', 'confirm-lg-abandon'); }
  else if(act === 'confirm-lg-abandon'){
    $('#sheetHost').classList.remove('on');
    if(U.match && U.match.timer) clearInterval(U.match.timer);
    U.match = null; S.league = null; S.leagueSel = null; U.lgSel = null; S.leagueCare = 0;
    U.tab = 'cup'; U.contest = 'league'; save(); render(); toast('26/27 리그 포기');

  else if(act === 'quit-result'){ U.match = null; U.tab='stadium'; render(); }

  else if(act === 'resume-draft'){ U.tab='squad'; render(); }
  else if(act === 'go-squad'){ U.tab='squad'; render(); }
  else if(act === 'go-ranking'){ if(U.match && U.match.timer) clearInterval(U.match.timer); U.match = null; U.tab='ranking'; render(); }
  else if(act === 'go-grow'){ U.tab='grow'; render(); }
  else if(act === 'copy'){ copyShare(); }
  else if(act === 'reset'){ openConfirm('전체 초기화', '스쿼드, 코인, 전적, 식별코드까지 모두 지워집니다.', '모두 지우기', 'confirm-reset'); }
  else if(act === 'confirm-reset'){
    $('#sheetHost').classList.remove('on');

});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t && t.id === 'impFile' && t.files && t.files.length){
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    try{ r.readAsText(t.files[0]); }catch(e){ toast('파일을 읽을 수 없습니다'); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(!t || !t.dataset || !t.dataset.srch) return;
  if(t.dataset.srch === 'fb'){
    /* 상대 OVR 직접 입력 — 상한 없음, 빈 칸이면 기본 */
    const raw = String(t.value == null ? '' : t.value).replace(/[^0-9]/g, '');
    const n = raw ? Number(raw) : 0;
    if(!raw) S.fboost = 0;
    else if(isFinite(n) && n >= 1) S.fboost = Math.floor(n);
    save(); paintFriendly();
    return;
  }
  if(t.dataset.srch === 'team') U.bufQ = t.value;
  else U.pbufQ = t.value;
  const host = document.getElementById('bufList');
  if(host) host.innerHTML = bufListRows();
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  if(U.match && !U.match.over){ toast('경기 중에는 이동할 수 없습니다'); return; }
  const k = b.dataset.tab;
  if(k === 'menu'){ openMenuSheet(); return; }
  $('#sheetHost').classList.remove('on');
  U.match = null; U.skip = null;
  U.tab = k; render();
}));
function closeSheetNav(k){
  $('#sheetHost').classList.remove('on');
  if(U.match && U.match.timer) clearInterval(U.match.timer);
  U.match = null; U.tab = k; render();
}
$('#codePill').addEventListener('click', () => {
  copyText('#' + S.code).then(()=>toast('식별코드 복사됨'), ()=>toast('#' + S.code));
});
$('#firePill').addEventListener('click', () => openBurnSheet());
setInterval(burnTick, 1000);

function copyText(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove(); return Promise.resolve();
}
function copyShare(){ copyText(shareText()).then(()=>toast('전적 문구를 복사했습니다'), ()=>toast('복사 실패')); }

/* ---------- zoom / gesture guard ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, {passive:false});
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['+','-','=','0'].includes(e.key)) e.preventDefault(); });

/* ---------- boot ---------- */
U.invite = parseInvite(typeof location !== 'undefined' ? location.hash : '');
U.ace = parseAceInvite(typeof location !== 'undefined' ? location.hash : '');
if(U.invite) toast('초대 대결 도착 · #' + U.invite.code);
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('hashchange', () => { U.invite = parseInvite(location.hash); U.ace = parseAceInvite(location.hash); render(); });
}
/* 실제 보이는 높이(비주얼 뷰포트)로 앱 높이를 맞춰 iOS·인앱 브라우저 툴바에서도 하단이 잘리지 않게 한다 */
function fitApp(){
  const vv = window.visualViewport;
  const h = Math.round((vv && vv.height) ? vv.height : window.innerHeight);
  if(h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
  if(typeof layoutPitch === 'function') layoutPitch();
}
fitApp();
['resize','orientationchange','pageshow'].forEach(ev => window.addEventListener(ev, fitApp));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fitApp);
  window.visualViewport.addEventListener('scroll', fitApp);
}
