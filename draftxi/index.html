<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DRAFT XI 26/27 · 드래프트 축구 시뮬</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d0b">
<meta name="description" content="매 경기 새로 뽑는 임대 드래프트 · 포지션별 무제한 영구 버프로 유럽 5대 리그 26/27 선수들과 붙는 축구 시뮬레이션.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DRAFT XI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cdf95f'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230a120c'%3ED%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#070d0b; --bg2:#0a120f; --card:#0f1a16; --card2:#14221c; --card3:#192a22;
  --line:#1d3128; --line2:#2b4438;
  --ink:#edf6f0; --sub:#8ba399; --dim:#5e7469;
  --lime:#cdf95f; --lime2:#a9e12f; --amber:#ffb43a; --red:#ff5b45; --sky:#63d7ff; --gold:#f5c96a;
  --navh:58px; --barh:54px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#030605}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:800}
.app{position:relative;width:100%;max-width:390px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#0f2019 0%,#070d0b 60%,#050a08 100%);overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:7px;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;border-bottom:1px solid var(--line);
  background:rgba(7,13,11,.94);backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;overflow:hidden}
.bname{overflow:hidden;text-overflow:ellipsis}
.mark{width:27px;height:27px;border-radius:9px;background:var(--lime);color:#07120a;display:grid;place-items:center;
  font-weight:900;font-size:14px;letter-spacing:-.04em;box-shadow:0 0 0 1px #eaffbd inset,0 3px 10px rgba(205,249,95,.18)}
.bname{font-size:14px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.bname i{color:var(--lime);font-style:normal}
.season{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line2);
  border-radius:5px;padding:2px 4px;margin-left:1px}
.hud{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.pill{display:flex;align-items:center;gap:5px;height:29px;padding:0 8px;min-width:0;border-radius:9px;background:var(--card2);
  border:1px solid var(--line2);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px rgba(205,249,95,.7)}
.pill.code{color:var(--sub);font-size:11px;background:transparent;max-width:96px;padding:0 6px}
.pill b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.code b{color:var(--ink);font-weight:700}
/* 패스 티켓 — 코인 옆 제2 재화 */
.pill.tk{padding:0 7px;gap:4px;background:rgba(255,180,58,.11);border-color:rgba(255,180,58,.4)}
.pill.tk .ic{font-size:11px;line-height:1}
.pill.tk b{color:var(--amber)}
.pill.tk.zero{opacity:.55;background:var(--card2);border-color:var(--line2)}
.pill.tk.zero b{color:var(--sub)}
.chip.tk{background:rgba(255,180,58,.11);border-color:rgba(255,180,58,.42);color:var(--amber)}
.chip.tk b{color:var(--amber);font-family:var(--mono);font-size:11px}
.chip.tk.on{background:var(--amber);border-color:var(--amber);color:#1b1204}
.chip.tk.poor{opacity:.45}
.chip.tk:disabled{opacity:.4}
/* 스킵·티켓 카드 */
.burn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(255,255,255,.03);font-size:10px;font-weight:800;letter-spacing:-.02em;min-width:0}
.burn b{font-size:10.5px;color:var(--sub);white-space:nowrap}
.burn span{flex:1 1 auto;min-width:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burn small{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.burn.on{border-color:rgba(255,120,60,.6);background:linear-gradient(100deg,rgba(255,120,60,.22),rgba(255,180,58,.06))}
.burn.on b{color:#ff8a5c}
.burn.on span{color:#ffcf9e}
.burn.on small{color:#ff9c6b}
.tkcard{border-radius:14px;border:1px solid rgba(255,180,58,.32);background:linear-gradient(160deg,rgba(255,180,58,.09),rgba(255,180,58,.02));padding:11px 12px}
.tkcard .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tkcard .hd b{font-size:12px;letter-spacing:-.02em}
.skrow{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}
.skrow .lb{flex:0 0 auto;width:66px;font-size:10.5px;font-weight:900;letter-spacing:-.03em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skrow .chip{flex:1 1 0;min-width:0;justify-content:center;height:33px;padding:0 6px;font-size:11px;white-space:nowrap}
.tkmission{border-radius:12px;border:1px solid rgba(255,180,58,.3);background:rgba(255,180,58,.05);padding:9px 11px;display:flex;align-items:center;gap:9px}
.tkmission .ic{flex:0 0 auto;font-size:15px}
.tkmission .tx{flex:1 1 auto;min-width:0}
.tkmission b{font-size:11.5px;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkmission small{font-size:9.5px;color:var(--dim);font-weight:800}

/* ---------- main scroll area ---------- */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 12px calc(18px + env(safe-area-inset-bottom));scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* ---------- bottom tabs ---------- */
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:rgba(8,15,12,.97);
  backdrop-filter:blur(12px);z-index:20}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;
  padding:5px 0 4px;-webkit-tap-highlight-color:transparent;
  color:var(--dim);font-size:9px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;transition:color .15s}
.tab span:not(.badge){white-space:nowrap}
.tab:active{opacity:.65}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--lime)}
.tab.on:before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:26px;height:2px;
  background:var(--lime);border-radius:0 0 3px 3px;box-shadow:0 0 10px rgba(205,249,95,.6)}
.tab .badge{position:absolute;top:8px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--lime);color:#0a120c;font-size:9px;font-weight:900;display:grid;place-items:center}

/* ---------- tactics ---------- */
.tacbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
.tacbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 3px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--sub);transition:all .15s}
.tacbtn b{font-size:10px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.tacbtn small{font-size:7.5px;font-weight:800;letter-spacing:-.02em;color:var(--dim);white-space:nowrap}
.tacbtn.on{background:rgba(205,249,95,.14);border-color:rgba(205,249,95,.55);color:var(--lime);box-shadow:0 0 0 1px rgba(205,249,95,.18) inset}
.tacbtn.on small{color:#a9e12f}
.hbtop{display:flex;align-items:baseline;gap:7px;font-size:11px;font-weight:800}

/* ---------- box score · MVP ---------- */
.boxscore{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.bscol{background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:11px;padding:8px 9px;min-width:0}
.bshead{font-size:9px;font-weight:800;letter-spacing:-.02em;color:var(--dim);display:flex;justify-content:space-between;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.bshead b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.bshead.mine b{color:var(--lime)}
.bsrow{display:flex;gap:6px;align-items:baseline;padding:3px 0;border-top:1px solid rgba(255,255,255,.04);min-width:0}
.bsrow:first-of-type{border-top:0}
.bsrow .mm{flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--lime);width:22px}
.bsrow .nm{font-size:10.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsrow.empty .nm{color:var(--dim);font-weight:700}
.mvp{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;
  background:linear-gradient(100deg,rgba(205,249,95,.13),rgba(205,249,95,.03));border:1px solid rgba(205,249,95,.4)}
.mvpic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:rgba(205,249,95,.16);color:var(--lime)}
.mvp .nm{font-size:13px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvpr{flex:0 0 auto;text-align:right}
.mvpr b{font-family:var(--mono);font-size:21px;font-weight:800;letter-spacing:-.06em;color:var(--lime);line-height:1}
.mvpr small{display:block;font-size:7px;font-weight:800;letter-spacing:.12em;color:var(--dim);margin-top:2px}
.honor{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:-.02em;
  padding:8px 11px;border-radius:10px;color:#ffe8a3;
  background:linear-gradient(100deg,rgba(255,196,60,.18),rgba(255,196,60,.05));border:1px solid rgba(255,196,60,.45);
  animation:grpop .35s ease both}
.honor b{font-family:var(--mono);font-size:12px;color:#ffd97a}
.honor.top{background:linear-gradient(100deg,rgba(255,224,120,.3),rgba(255,160,60,.12));border-color:rgba(255,224,120,.75);
  box-shadow:0 0 18px rgba(255,200,70,.25);color:#fff3c4}

/* ---------- 1대1 턴제 배틀 ---------- */
main.duel{padding:10px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;overflow:hidden}
.dh{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 1px;min-height:30px}
.dh-l{flex:1 1 auto;min-width:0}
.dh .eyebrow{font-size:9px;letter-spacing:.13em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .tiny{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .chip{flex:0 0 auto;height:28px;padding:0 9px;font-size:10.5px}
.dh .chip:active{transform:scale(.97)}

.stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 8px 7px;
  border-radius:16px;border:1px solid #24402f;overflow:hidden;
  background:radial-gradient(120% 78% at 50% 44%,#16291f 0%,#0d1814 58%,#0a120e 100%)}
.arena{position:relative;flex:1 1 auto;min-height:0}
.arena:before{content:"";position:absolute;left:50%;top:50%;width:226px;height:226px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(205,249,95,.09);box-shadow:0 0 0 24px rgba(205,249,95,.022),0 0 0 54px rgba(205,249,95,.012)}
.vsmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;
  font-family:var(--mono);font-size:15px;font-weight:900;letter-spacing:.18em;color:rgba(205,249,95,.22)}
.arena:after{content:"";position:absolute;left:4%;right:4%;bottom:9%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent)}
.fighter{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px}
.fighter .av{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:29px;line-height:1;
  background:radial-gradient(circle at 34% 26%,#2c4c39,#0d1b15 74%);border:2px solid #43724f;
  box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(205,249,95,.1);animation:bob 3.4s ease-in-out infinite}
.fighter .av b{position:absolute;right:-8px;bottom:-2px;height:17px;min-width:23px;padding:0 4px;border-radius:9px;
  display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:900;
  background:#0b1a12;border:1px solid #46774f;color:var(--lime)}
.fighter.op{right:2px;top:0}
.fighter.op .av{border-color:#6d463b;background:radial-gradient(circle at 34% 26%,#4a2f28,#170f0c 74%);
  box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(255,120,90,.1);animation-delay:-1.7s}
.fighter.op .av b{border-color:#7d4f42;color:#ffb59f;background:#1a0f0c}
.fighter.me{left:2px;bottom:0}
.fighter .lb{font-size:8.5px;font-weight:900;letter-spacing:.02em;color:#c3d8cb;text-shadow:0 1px 4px #000;white-space:nowrap}
.fighter.op .lb{color:#e6c3b9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fighter.act .av{animation:lunge .42s ease}
@keyframes lunge{0%{transform:none}45%{transform:translateX(var(--lx,9px)) scale(1.06)}100%{transform:none}}
.fighter.op.act .av{--lx:-9px}
.fighter.hit .av{animation:hit .44s ease}
@keyframes hit{0%,100%{transform:none}18%{transform:translateX(-6px) rotate(-4deg)}38%{transform:translateX(5px) rotate(3deg)}58%{transform:translateX(-4px)}78%{transform:translateX(3px)}}
.pop2{position:absolute;left:50%;top:6px;margin-left:-28px;width:56px;text-align:center;z-index:6;
  font-family:var(--mono);font-size:19px;font-weight:900;letter-spacing:-.05em;color:#ff9c86;
  text-shadow:0 2px 10px rgba(0,0,0,.85);opacity:0;pointer-events:none}
.pop2.mine{color:var(--lime)}
.pop2.on{animation:popup .82s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translateY(6px) scale(.82)}22%{opacity:1;transform:translateY(-2px) scale(1.1)}68%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-24px) scale(.95)}}

.bcard{flex:0 0 auto;width:calc(100% - 30px);padding:6px 9px 7px;border-radius:11px;
  border:1px solid #2c4a3a;background:linear-gradient(120deg,rgba(17,31,25,.97),rgba(11,21,17,.94))}
.bcard.op{align-self:flex-end;border-color:#5a3a31}
.bcard.me{align-self:flex-start;border-color:#3d6a3a}
.bcard .pc-h{display:flex;align-items:center;gap:5px;min-width:0}
.bcard .pc-side{flex:0 0 auto;font-size:7.5px;font-weight:900;letter-spacing:.1em;padding:1px 4px;border-radius:4px;
  background:rgba(255,255,255,.07);color:#9db4a8}
.bcard.me .pc-side{color:var(--lime);background:rgba(205,249,95,.13)}
.bcard.op .pc-side{color:#ffb3a3;background:rgba(255,120,90,.13)}
.bcard .pc-n{font-size:12.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .pc-ovr{flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--lime)}
.bcard.op .pc-ovr{color:#ffb59f}
.bcard .pc-m{display:flex;align-items:center;gap:4px;margin:1px 0 4px;font-size:8.5px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .pc-m b{color:#cfe3d6}
.bcard .pc-m .lv{color:var(--amber);font-family:var(--mono);font-weight:800}
.bcard .pc-m .st{margin-left:auto;flex:0 0 auto;font-size:7.5px;font-weight:900;letter-spacing:.02em;color:var(--sky)}
.bcard .hp{height:7px;border-radius:4px;background:#16261e;border:1px solid #22392d;overflow:hidden}
.bcard .hp i{display:block;height:100%;width:100%;border-radius:3px;
  background:linear-gradient(90deg,#5fd35a,#a9f06a);transition:width .5s cubic-bezier(.25,.9,.3,1),background .3s}
.bcard.warn .hp i{background:linear-gradient(90deg,#f0b23c,#ffd479)}
.bcard.low .hp i{background:linear-gradient(90deg,#ff6f52,#ff4d3d);animation:hpwarn .9s infinite}
@keyframes hpwarn{50%{opacity:.55}}
.bcard .pc-hp{display:flex;justify-content:space-between;gap:6px;margin-top:2px;
  font-family:var(--mono);font-size:9px;font-weight:800;color:var(--sub)}
.bcard .pc-hp b{color:var(--ink);font-weight:800}
.bcard.low .pc-hp b{color:#ff8f7a}

.turnbar{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.turnbar .tb{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--lime)}
.turnbar .tb small{color:var(--dim);font-size:8.5px;letter-spacing:0}
.tbseg{flex:1 1 auto;display:flex;gap:2px;min-width:0}
.tbseg i{flex:1 1 0;height:3px;border-radius:2px;background:#1e3327}
.tbseg i.on{background:#3f6a44}
.tbseg i.now{background:var(--lime);box-shadow:0 0 6px rgba(205,249,95,.5)}
.chip.auto{flex:0 0 auto;height:26px;padding:0 8px;font-size:10px}
.chip.auto.on{background:rgba(205,249,95,.16);border-color:rgba(205,249,95,.6);color:var(--lime)}

.moves{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mv{display:flex;align-items:center;gap:7px;padding:7px 8px;min-width:0;border-radius:11px;
  border:1px solid var(--line2);background:linear-gradient(150deg,#15241d,#0e1a15);text-align:left;
  transition:transform .08s,border-color .15s}
.mv:active{transform:scale(.975);border-color:var(--lime)}
.mv .ic{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;
  background:rgba(205,249,95,.1);border:1px solid rgba(205,249,95,.22)}
.mv .tx{flex:1 1 auto;min-width:0}
.mv .tx b{display:block;font-size:10.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .tx small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv.sig{border-color:#6a4a2a;background:linear-gradient(150deg,#2a1f14,#150f0b)}
.mv.sig .ic{background:rgba(255,180,58,.13);border-color:rgba(255,180,58,.35)}
.mv.sig .tx b{color:#ffd79a}
.mv.sig .tx small{color:#c39a63}
.mv:disabled{opacity:.42}
.mv:disabled .ic{border-color:var(--line2);background:rgba(255,255,255,.04)}

.blog{flex:0 0 auto;height:92px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:6px 7px;
  border-radius:11px;border:1px solid var(--line);background:rgba(9,17,14,.8);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.blog::-webkit-scrollbar{display:none}
.bl{display:flex;gap:6px;align-items:flex-start;animation:blin .22s ease-out}
@keyframes blin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.bl .t{flex:0 0 auto;width:18px;font-family:var(--mono);font-size:8px;font-weight:800;color:var(--dim);padding-top:2px}
.bl .x{flex:1 1 auto;min-width:0;font-size:10px;line-height:1.42;color:#c7dbcf;letter-spacing:-.01em}
.bl .x b{color:var(--ink);font-weight:900}
.bl .x em{font-style:normal;display:inline-block;margin-left:3px;padding:0 4px;border-radius:4px;
  font-size:8px;font-weight:900;letter-spacing:0;background:rgba(205,249,95,.14);color:var(--lime)}
.bl .d{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:900;color:#ff8f7a;padding-top:1px}
.bl.crit .x em{background:rgba(255,180,58,.18);color:var(--amber)}
.bl.crit .d{color:#ffb43a}
.bl.eff .x em{background:rgba(99,215,255,.16);color:var(--sky)}
.bl.miss .x{color:#8fa79b}
.bl.miss .x em{background:rgba(255,255,255,.08);color:var(--sub)}
.bl.heal .x em{background:rgba(120,230,140,.16);color:#8ef0a6}
.bl.start .x{color:#eaffc4;font-weight:800}

.result .hpres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.hpres > div{padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.hpres span{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpres b{display:block;font-family:var(--mono);font-size:12.5px;margin-top:1px;letter-spacing:-.03em;white-space:nowrap}
.hpres .bar{height:4px;border-radius:2px;background:#1b2f24;margin-top:4px;overflow:hidden;padding:0;border:0}
.hpres .bar i{display:block;height:4px;border-radius:2px;background:linear-gradient(90deg,#5fd35a,#a9f06a)}
.hpres .bar.low i{background:linear-gradient(90deg,#ff6f52,#ff4d3d)}
.hpres .bar.mid i{background:linear-gradient(90deg,#f0b23c,#ffd479)}
.result .dstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dstats div{padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.dstats span{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.dstats b{display:block;font-family:var(--mono);font-size:14px;margin-top:1px;letter-spacing:-.03em}
.dstats small{display:block;font-size:8.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 키우기 보관함 ---------- */
.groster{display:flex;gap:6px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.groster::-webkit-scrollbar{display:none}
.gchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:9px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--sub);transition:all .15s}
.gchip b{font-size:10px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;max-width:104px;overflow:hidden;text-overflow:ellipsis}
.gchip small{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--dim);letter-spacing:-.02em}
.gchip.on{background:rgba(205,249,95,.14);border-color:rgba(205,249,95,.55);color:var(--lime)}
.gchip.on small{color:#a9e12f}
.gchip.add{border-style:dashed;color:var(--dim);align-items:center;justify-content:center;white-space:nowrap}

/* ---------- generic ---------- */
.eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}
.eyebrow.g{color:var(--dim)}
h2.title{font-size:22px;font-weight:900;letter-spacing:-.045em;line-height:1.22;margin:5px 0 0}
h3.sub{font-size:14px;font-weight:900;letter-spacing:-.02em}
.muted{color:var(--sub);font-size:11.5px;line-height:1.55;letter-spacing:-.005em}
.tiny{font-size:10px;color:var(--dim);letter-spacing:.01em}
.card{background:linear-gradient(180deg,#101c17,#0c1613);border:1px solid var(--line);border-radius:15px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.sect{margin-top:20px}
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:9px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:31px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  color:var(--sub);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;letter-spacing:-.01em}
.chip.on{background:var(--lime);border-color:var(--lime);color:#0a120c}
.chip:active{transform:scale(.97)}
.btn{height:47px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  font-size:13.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn.primary{background:linear-gradient(180deg,#dcff7c,#b9ea3c);border-color:#e2ff9a;color:#0a1409;
  box-shadow:0 6px 20px rgba(180,235,60,.16)}
.btn.dark{background:var(--card);border-color:var(--line2)}
.btn.sm{height:37px;border-radius:10px;font-size:12px;padding:0 12px}
.btn:disabled{opacity:.4;filter:none}
.btn.wide{width:100%}
.hr{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:5px;background:var(--card3);
  color:var(--sub);font-size:9.5px;font-weight:800;letter-spacing:.02em}
.tag.lime{background:rgba(205,249,95,.13);color:var(--lime)}
.tag.amber{background:rgba(255,180,58,.13);color:var(--amber)}
.tag.red{background:rgba(255,91,69,.14);color:var(--red)}
.tag.sky{background:rgba(99,215,255,.13);color:var(--sky)}

/* ---------- hero / empty ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(140% 100% at 78% -10%,#1d3a2b 0%,#0d1915 55%,#0a1310 100%);padding:18px 16px 16px}
.hero:after{content:"";position:absolute;right:-52px;top:-46px;width:170px;height:170px;border-radius:50%;
  border:1px solid rgba(205,249,95,.16);box-shadow:0 0 0 24px rgba(205,249,95,.04),0 0 0 52px rgba(205,249,95,.025)}
.hero h2{font-size:25px;line-height:1.16;letter-spacing:-.055em;margin:7px 0 0;font-weight:900}
.hero h2 em{font-style:normal;color:var(--lime)}
.hero p{font-size:11.5px;color:var(--sub);line-height:1.6;margin:8px 0 0;max-width:270px;letter-spacing:-.01em}
.hero .facts{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap;position:relative;z-index:1}
.fact{border:1px solid var(--line2);background:rgba(6,12,10,.4);border-radius:8px;padding:5px 7px;font-size:9.5px;
  color:var(--sub);font-weight:800;letter-spacing:.01em}
.fact b{color:var(--ink)}

.empty{border:1px dashed var(--line2);border-radius:16px;padding:22px 16px;text-align:center;background:rgba(12,22,18,.5)}
.empty .ic{font-size:26px;line-height:1}
.empty b{display:block;font-size:14px;margin:8px 0 3px;letter-spacing:-.02em}
.empty .muted{max-width:240px;margin:0 auto}

/* ---------- draft ---------- */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.prog{display:flex;gap:3px}
.prog i{display:block;width:9px;height:3px;border-radius:2px;background:#233a30}
.prog i.on{background:var(--lime)}
.prog i.now{background:var(--amber)}

.mini{position:relative;border-radius:14px;overflow:hidden;border:1px solid #1b4531;height:136px;
  background:repeating-linear-gradient(0deg,#113326 0 19px,#0e2c21 19px 38px)}
.mini .line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.13)}
.mini .circ{position:absolute;left:50%;top:50%;width:54px;height:54px;border:1px solid rgba(255,255,255,.13);border-radius:50%;transform:translate(-50%,-50%)}
.mini .box{position:absolute;left:50%;transform:translateX(-50%);width:64px;height:22px;border:1px solid rgba(255,255,255,.13)}
.mini .box.t{top:0;border-top:0}.mini .box.b{bottom:0;border-bottom:0}
.mini .mdot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#0b1712;
  border:1.5px solid #2e5641;color:#7d9b8b;font-size:8px;font-weight:800;display:grid;place-items:center}
.mini .mdot.f{border-color:var(--lime);color:var(--lime);background:#0f2419}
.mini .mdot.n{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,58,.16);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(255,180,58,.18)}50%{box-shadow:0 0 0 6px rgba(255,180,58,.05)}}

.picks{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.pick{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 11px;border-radius:13px;text-align:left;
  border:1px solid var(--line);background:linear-gradient(100deg,#12201a,#0d1814);transition:transform .09s,border-color .15s}
.pick:active{transform:scale(.985);border-color:var(--lime)}
.pick .ovr{flex:0 0 auto;width:46px;text-align:center}
.pick .ovr b{display:block;font-family:var(--mono);font-size:23px;font-weight:800;line-height:1;letter-spacing:-.06em}
.pick .ovr small{display:block;font-size:8px;letter-spacing:.12em;color:var(--dim);margin-top:2px;font-weight:800}
.pick .who{flex:1 1 auto;min-width:0}
.pick .nm{display:flex;align-items:baseline;gap:4px;font-size:12.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .nm .cond{flex:0 0 auto;font-size:10px;font-weight:900;letter-spacing:0}
.pick .cl{font-size:9.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .bars{display:flex;gap:3px;margin-top:5px}
.pick .bars i{display:block;height:3px;flex:1;border-radius:2px;background:#20362b;overflow:hidden}
.pick .bars i s{display:block;height:100%;background:var(--lime);text-decoration:none}
.pick .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pick .go{width:23px;height:23px;border-radius:7px;background:var(--card3);display:grid;place-items:center;color:var(--lime);font-size:12px;font-weight:900}
.pick .pos{position:absolute;top:-1px;right:56px;font-size:8.5px;font-weight:900;letter-spacing:.06em;color:var(--dim)}
.pick.off .ovr b{color:var(--amber)}

/* ---------- squad ---------- */
.teamhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border-radius:15px;
  background:linear-gradient(120deg,#16281f,#0d1713 70%);border:1px solid var(--line)}
.teamhead .ovr{text-align:right}
.teamhead .ovr b{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:-.07em;line-height:1}
.teamhead .ovr small{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--dim);font-weight:800;margin-top:3px}
.teamhead .nm{font-size:15px;font-weight:900;letter-spacing:-.03em}

.pitch{position:relative;border-radius:16px;overflow:hidden;border:1px solid #1b4531;aspect-ratio:.74;
  background:repeating-linear-gradient(0deg,#123527 0 26px,#0f2e22 26px 52px);box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.pitch .pl-line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.15)}
.pitch .pl-circ{position:absolute;left:50%;top:50%;width:74px;height:74px;border:1px solid rgba(255,255,255,.15);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .pl-box{position:absolute;left:50%;transform:translateX(-50%);width:46%;height:12%;border:1px solid rgba(255,255,255,.15)}
.pitch .pl-box.t{top:0;border-top:0}.pitch .pl-box.b{bottom:0;border-bottom:0}
.pitch .pl-arc{position:absolute;left:50%;top:12%;width:60px;height:30px;border:1px solid rgba(255,255,255,.15);border-bottom:0;border-radius:30px 30px 0 0;transform:translateX(-50%)}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:64px;gap:2px;z-index:2}
.pdot .bead{width:32px;height:32px;border-radius:50%;background:#0a1611;border:1.5px solid var(--lime);color:var(--lime);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:800;
  box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(205,249,95,.08)}
.pdot.off .bead{border-color:var(--amber);color:var(--amber);border-style:dashed}
.pdot.empty .bead{border-color:#38604a;color:#436a52;border-style:dashed;background:transparent}
.pdot .pn{font-size:8.5px;font-weight:800;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;
  color:#d7e9de;text-shadow:0 1px 3px #000;letter-spacing:-.02em}
.pdot .pp{font-size:7.5px;color:#7fa590;font-weight:800;letter-spacing:.05em}
.pdot:active .bead{transform:scale(.94)}

.linesum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.linesum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px}
.linesum span{display:block;font-size:8.5px;letter-spacing:.11em;color:var(--dim);font-weight:800}
.linesum b{display:block;font-family:var(--mono);font-size:16px;font-weight:800;margin-top:1px}

/* ---------- stadium ---------- */
.mode{position:relative;display:block;width:100%;text-align:left;padding:13px 13px;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(115deg,#12201a,#0c1613);overflow:hidden}
.mode:active{transform:scale(.99)}
.mode .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--card3);border:1px solid var(--line2)}
.mode .ttl{font-size:14.5px;font-weight:900;letter-spacing:-.03em}
.mode .dsc{font-size:10.5px;color:var(--sub);margin-top:2px;letter-spacing:-.01em;line-height:1.45}
.mode .rw{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.mode.hot{border-color:#3d6a3a;background:linear-gradient(115deg,#1a2e1c,#0d1713)}
.mode.hot:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(205,249,95,.14),transparent 70%)}

.opps{display:flex;flex-direction:column;gap:7px}
.opp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.opp .cr{width:30px;height:30px;border-radius:9px;background:var(--card3);display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;font-weight:800;color:var(--lime)}
.opp .nm{flex:1 1 auto;min-width:0;font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .ov{font-family:var(--mono);font-size:12px;color:var(--sub);font-weight:700}
.opp .pl{width:52px;height:29px;border-radius:8px;background:var(--lime);color:#0a120c;font-size:11px;font-weight:900;display:grid;place-items:center}

/* ---------- 레전드 컵 · 메뉴 ---------- */
.cupvs{position:relative;padding:13px;border-radius:16px;border:1px solid #4b5f2d;overflow:hidden;
  background:linear-gradient(135deg,#20301a,#0d1713 72%)}
.cupvs:after{content:"";position:absolute;right:-34px;top:-38px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,201,106,.16),transparent 70%)}
.cupvs .ttl{font-size:16px;font-weight:900;letter-spacing:-.035em;margin-top:6px;line-height:1.25}
.cupvs .ttl i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--gold);margin-right:6px;letter-spacing:0}
.cupvs .st{font-size:10.5px;color:var(--sub);margin-top:5px;line-height:1.5;letter-spacing:-.01em}
.cupvs .stars{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.cupvs .btn{margin-top:11px}
.cupcard{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.cupcard .lc{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:rgba(245,201,106,.13);border:1px solid rgba(245,201,106,.35);color:var(--gold)}
.cupcard .tx{flex:1 1 auto;min-width:0}
.cupcard .tx b{display:block;font-size:12.5px;font-weight:900;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cupcard .tx span{display:block;font-size:9.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cupcard .ov{flex:0 0 auto;font-family:var(--mono);font-size:13px;font-weight:800;color:var(--gold)}
.pick3{display:flex;flex-direction:column;gap:8px}
.pick3 .btn{margin-top:9px}
.cupick{position:relative;padding:12px 13px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(120deg,#15241c,#0c1613)}
.cupick:active{transform:scale(.99)}
.cupick .hd{display:flex;align-items:baseline;gap:7px;min-width:0}
.cupick .hd b{font-size:14px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cupick .hd i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.cupick .ov{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:15px;font-weight:800;color:var(--lime)}
.cupick .st{font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5;letter-spacing:-.01em;padding-right:34px}
.cupick .stars{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.cupick .go{margin-top:9px;width:100%;height:38px;border-radius:10px;background:var(--lime);color:#0a120c;font-size:12px;font-weight:900;display:grid;place-items:center}
.xi{display:flex;flex-direction:column;gap:3px}
.xr{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.028);border:1px solid #16281f}
.xr .ps{flex:0 0 auto;width:26px;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.02em}
.xr .nm{flex:1 1 auto;min-width:0;font-size:11px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr b{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--sub)}
.ties{display:flex;flex-direction:column;gap:5px}
.tie{padding:6px 7px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.tie.mine{border-color:#3d6a3a;background:linear-gradient(100deg,#17281a,#0d1713)}
.tie.live{border-color:rgba(245,201,106,.6);box-shadow:0 0 0 1px rgba(245,201,106,.15) inset}
.tie .tr{display:flex;align-items:center;gap:7px;padding:3px 3px;border-radius:6px;min-width:0}
.tie .tr .nm{flex:1 1 auto;min-width:0;font-size:11px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.tie .tr i{flex:0 0 auto;font-style:normal;font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--dim);opacity:.6;min-width:12px;text-align:right}
.tie .tr.w i{color:var(--lime);opacity:.85}
.tie .tr b{flex:0 0 auto;min-width:11px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--dim)}
.tie .tr.w .nm{color:var(--lime)}
.tie .tr.w b{color:var(--lime)}
.tie .tr.me .nm{color:#eaffc4}
.tie .tr.me b{color:var(--ink)}
.tie .tf{margin-top:2px;padding:0 3px;text-align:right;font-size:8.5px;font-weight:800;color:var(--amber);letter-spacing:.01em}
.tie .tf.wait{color:var(--dim)}
.path{display:flex;flex-direction:column;gap:4px}
.path .pr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.path .pr .rd{flex:0 0 auto;width:30px;font-size:9px;font-weight:800;color:var(--dim)}
.path .pr .op{flex:1 1 auto;min-width:0;font-size:10.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cond{font-family:var(--mono);font-size:9.5px;font-weight:900;letter-spacing:-.02em}
.halfbox{margin-top:9px;padding:9px 11px;border-radius:10px;border:1px solid #3d6a3a;
  background:rgba(205,249,95,.08);text-align:center;font-size:11px;font-weight:800;color:var(--lime);letter-spacing:-.01em}
.pop{position:fixed;z-index:120;font-family:var(--mono);font-size:14px;font-weight:800;color:var(--lime);
  pointer-events:none;animation:pop .8s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes pop{0%{opacity:0;transform:translateY(4px) scale(.9)}30%{opacity:1;transform:translateY(-10px) scale(1.05)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

/* ---------- ranking ---------- */
.tier{border-radius:16px;border:1px solid var(--line);padding:15px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#17281f,#0b1512)}
.tier:after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(205,249,95,.10),transparent 70%)}
.tier .badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:.08em}
.tier .rt{font-family:var(--mono);font-size:38px;font-weight:800;letter-spacing:-.08em;line-height:1;margin-top:9px}
.tier .rt small{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-left:9px;vertical-align:2px}
.tierp{height:5px;border-radius:3px;background:#1b2f24;margin-top:11px;overflow:hidden}
.tierp i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8ecf36,var(--lime));transition:width .3s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.gcard span{display:block;font-size:8.5px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.gcard b{display:block;font-family:var(--mono);font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.04em}
.gcard small{display:block;font-size:9.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder{display:flex;flex-direction:column;gap:4px}
.lad{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;background:rgba(15,26,22,.6);border:1px solid transparent}
.lad.on{background:#17291f;border-color:#31543c}
.lad .d{width:8px;height:8px;border-radius:50%}
.lad .n{flex:1 1 auto;min-width:0;font-size:11px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad .r{font-family:var(--mono);font-size:10px;color:var(--dim)}
.lad.on .r{color:var(--lime)}
.share{background:#0c1713;border:1px dashed var(--line2);border-radius:11px;padding:10px 11px;font-size:10.5px;line-height:1.7;
  color:#b9cdc2;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}

/* ---------- sheet / toast ---------- */
.sheet-host{position:absolute;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(3,7,5,.66);backdrop-filter:blur(3px)}
.sheet-host.on{display:flex;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:#0e1a15;border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet .grab{width:34px;height:3px;border-radius:2px;background:#2b4438;margin:0 auto 12px}
.toast{position:absolute;left:50%;bottom:calc(var(--navh) + 22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#1b2f22;border:1px solid #3a6045;color:var(--ink);font-size:11.5px;font-weight:800;padding:9px 14px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.flag{font-size:10px;color:var(--dim);letter-spacing:.02em}
.spark{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--lime);margin-right:4px;vertical-align:1px}
@media (min-width:430px){
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(90% 60% at 50% 0%,#0c1a13 0%,#050a07 62%,#030605 100%)}
  .app{height:min(844px,100dvh);border-radius:26px;border:1px solid #1e332a;
    box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.025) inset}
}
@media (max-width:360px){.hero h2{font-size:22px}.pick .ovr b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.segwrap{position:sticky;top:-12px;z-index:7;margin:-2px -12px 11px;padding:10px 12px 9px;
  background:linear-gradient(180deg,var(--bg) 76%,rgba(7,13,11,.9))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:#0b1512;border:1px solid var(--line)}
.seg button{height:33px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--sub);

.seg button small{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--dim)}

.seg button.on small{color:var(--lime)}

.slist{display:flex;flex-direction:column;gap:6px}

.srow.on{border-color:#3d6a3a}

  })) : [];

    c.coins = Math.max(0, Math.round(+c.coins || 0));
    c.done = !!c.done;
    c.result = (c.result === 'champion' || c.result === 'out') ? c.result : null;
    const names = CUP_ROUNDS[sz];

      name: names[i] || String(r.name || ''),

        a: String(t.a), b: String(t.b),
        sa: (typeof t.sa === 'number' && isFinite(t.sa)) ? t.sa : null,
        sb: (typeof t.sb === 'number' && isFinite(t.sb)) ? t.sb : null,
        win: (t.win === t.a || t.win === t.b) ? String(t.win) : null,
        pens: (typeof t.pens === 'string') ? t.pens.slice(0, 9) : null,
        mine: !!t.mine, forfeit: !!t.forfeit

    })) : [];
    if(!c.my || !c.rounds.length || !c.rounds[0].ties.length) s.cup = null;
    else {

  if(s.cupSel && typeof s.cupSel === 'object'){
    const off = Array.isArray(s.cupSel.offers) ? s.cupSel.offers.map(String).filter(id => !!cupById(id)).slice(0, 3) : [];
    const sz = s.cupSel.size === 16 ? 16 : 32;
    if(off.length === 3) s.cupSel = {size:sz, offers:off, rerolled:!!s.cupSel.rerolled};
    else s.cupSel = null;
  } else s.cupSel = null;
  return s;
}

/* ---------- player math ---------- */
function baseStats(inst){
  const sp = posOf(inst.i), g = grp(sp), o = baseOf(inst), w = WEIGHTS[g];
  const raw = OFFS[g].map(v => o + v);
  const wsum = raw.reduce((s,v,k) => s + v*w[k], 0);
  const delta = wsum - o;
  return raw.map(v => Math.max(25, Math.round(v - delta)));
}
function bufLvOf(inst){ return (S.buf && S.buf[grp(posOf(inst.i))]) || 0; }
function pbufOf(inst){ return Math.max(0, Math.round(+(((S.pbuf || {})[String(inst.i)])) || 0)); }
function tbufOf(inst){
  const c = P[inst.i] ? P[inst.i][1] : '';
  const v = (c && S.tbuf) ? S.tbuf[c] : 0;
  return Math.min(TBUF_MAX, Math.max(0, Math.round(+v || 0)));
}
function buffParts(inst){
  return {pos:bufLvOf(inst), team:tbufOf(inst), player:pbufOf(inst), grow:(inst.lv || 0) * GROW_STEP};
}
function statsOf(inst){
  const b = baseStats(inst), p = buffParts(inst);

}
/* 1대1 키우기는 포지션 버프·강화만 — 팀컬러·선수 버프는 11대11 전용 */

}

}

function clubTally(sq){

function aggregate(e, syn){

  const df = e.filter(x => grp(x.role) === 'DF').map(x => x.ovr);

  const fw = e.filter(x => grp(x.role) === 'FW').map(x => x.ovr);
  const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : 60;
  const def = avg(df)*0.78 + (gk.length ? gk[0]*0.22 : 60*0.22);
  const cond = e.length ? e.reduce((s,x) => s + (typeof x.c === 'number' ? x.c : 0), 0) / e.length : 0;
  return {ovr: Math.round(e.reduce((s,x)=>s+x.ovr,0)/11) + add, att: avg(fw) + add, mid: avg(mf) + add,
    def: def + add, gk: gk[0] || 60, cond, entries:e, syn: add};
}

/* ---------- draft ---------- */
function startDraft(){
  const f = pick(FORM_KEYS);

function slotOrder(f){
  const idx = FORMS[f].map((s,i)=>i);
  const order = ['GK','DF','MF','FW'];
  return idx.sort((a,b) => order.indexOf(grp(FORMS[f][a][0])) - order.indexOf(grp(FORMS[f][b][0])) || a-b);
}
function sampleOptions(f, slotIdx, taken){
  const role = FORMS[f][slotIdx][0];
  const used = new Set(taken);
  const all = P.map((p,i)=>i).filter(i => !used.has(i));
  const exact = all.filter(i => posOf(i) === role || (role==='ST'&&posOf(i)==='SS'));
  const near = all.filter(i => NEAR[role].includes(posOf(i)));
  const group = all.filter(i => grp(posOf(i)) === grp(role));
  const chosen = [];
  pickBiased(exact, DRAFT_OPTS - chosen.length, chosen);
  if(chosen.length < DRAFT_OPTS) pickBiased(near, DRAFT_OPTS - chosen.length, chosen);
  if(chosen.length < DRAFT_OPTS) pickBiased(group, DRAFT_OPTS - chosen.length, chosen);
  /* 최종 적용 OVR(기본+포지션+팀컬러+선수 버프) 높은 순으로 정렬 */
  return chosen.slice(0, DRAFT_OPTS).map(i => ({i, b: rollBase(i), c: rollCond()}))
    .sort((a, b) => ovrOf(b) - ovrOf(a) || b.b - a.b);
}
function pickBiased(list, k, out){
  const pool = list.filter(i => !out.includes(i));
  for(let n=0; n<k && pool.length; n++){
    const sorted = pool.slice().sort((a,b) => baseOvrOf(b) - baseOvrOf(a));
    const idx = Math.min(sorted.length-1, Math.floor(Math.pow(Math.random(), 1.55) * sorted.length));
    const v = sorted[idx];
    out.push(v); pool.splice(pool.indexOf(v), 1);
  }
}
function bandOfSquad(squad){

  if(bs.every(v => v >= 70 && v <= 79)) return '70';
  if(bs.every(v => v >= 80 && v <= 89)) return '80';
  if(bs.every(v => v >= 90)) return '90';
  return null;
}

}

/* ---------- 친구 대결 초대 (URL 해시) ---------- */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(str){
  let t = String(str || '').replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function inviteURL(squadArg, formArg){

}
function parseInvite(hash){

function ensureQuests(){
  if(!S.q || typeof S.q !== 'object') S.q = freshQuests();
  const q = S.q;
  if(!q.today || typeof q.today !== 'object') q.today = {};
  if(!q.weekC || typeof q.weekC !== 'object') q.weekC = {};
  if(!q.monthC || typeof q.monthC !== 'object') q.monthC = {};
  Q_TODAY.forEach(k => { q.today[k] = Math.max(0, Math.round(+q.today[k] || 0)); });
  Q_WEEK.forEach(k => { q.weekC[k] = Math.max(0, Math.round(+q.weekC[k] || 0)); });
  Q_MONTH.forEach(k => { q.monthC[k] = Math.max(0, Math.round(+q.monthC[k] || 0)); });
  if(!q.rep || typeof q.rep !== 'object') q.rep = {};
  Q_REP.forEach(k => { q.rep[k] = Math.max(0, Math.round(+q.rep[k] || 0)); });
  if(!q.chal || typeof q.chal !== 'object') q.chal = {};
  Q_CHAL.forEach(k => { q.chal[k] = Math.max(0, Math.round(+q.chal[k] || 0)); });
  if(!q.claimed || typeof q.claimed !== 'object') q.claimed = {day:{}, week:{}, month:{}};
  q.claimed.day ||= {}; q.claimed.week ||= {}; q.claimed.month ||= {}; q.claimed.chal ||= {};
  q.claimed.tk ||= {}; q.claimed.tkw ||= {};
  if(!q.chal || typeof q.chal !== 'object') q.chal = {low:0, band:0, dog:0};
  if(!q.tk || typeof q.tk !== 'object') q.tk = {g11:0, g1:0};
  if(!q.tkw || typeof q.tkw !== 'object') q.tkw = {g11:0, g1:0, cupWin:0};
  ['tk','tkw'].forEach(sc => { if(!q[sc]) q[sc] = {}; });
  ['g11','g1'].forEach(k => { q.tk[k] = Math.max(0, Math.round(+q.tk[k] || 0)); });
  ['g11','g1','cupWin'].forEach(k => { q.tkw[k] = Math.max(0, Math.round(+q.tkw[k] || 0)); });
  if(!q.login || typeof q.login !== 'object') q.login = {last:'', streak:0};
  if(!q.rep || typeof q.rep !== 'object') q.rep = {games:0, wins:0};
  const d = kstDay(), w = kstWeekKey(), m = kstMonthKey();
  if(q.day !== d){ q.day = d; q.today = Q_ZERO(Q_TODAY); q.chal = Q_ZERO(Q_CHAL); q.claimed.day = {}; q.claimed.chal = {}; q.claimed.tk = {}; q.tk = {g11:0, g1:0}; }
  if(q.week !== w){ q.week = w; q.weekC = Q_ZERO(Q_WEEK); q.claimed.week = {}; q.claimed.tkw = {}; q.tkw = {g11:0, g1:0, cupWin:0}; }
  if(q.month !== m){ q.month = m; q.monthC = Q_ZERO(Q_MONTH); q.claimed.month = {}; }
  return q;
}
function questAdd(kind, n){
  const q = ensureQuests(), inc = n || 1;
  if(kind === 'draft') q.today.draft += inc;
  else if(kind === 'game'){ q.today.games += inc; q.rep.games += inc; }
  else if(kind === 'win'){ q.today.win += inc; q.weekC.win += inc; q.monthC.win += inc; q.rep.wins += inc; }
  else if(kind === 'ranked'){ q.weekC.ranked += inc; }
  else if(kind === 'buff'){ q.weekC.buff += inc; q.monthC.buf += inc; q.today.buff += inc; }
  else if(kind === 'big') q.today.big += inc;
  else if(kind === 'chemi') q.today.chemi += inc;
  else if(kind === 'dwin') q.today.dwin += inc;
  else if(kind === 'allstar') q.weekC.allstar += inc;
  else if(kind === 'cupwin'){ q.weekC.cupWin += inc; q.monthC.cupWin += inc; q.tkw.cupWin += inc; }
  else if(kind === 'cuptac') q.weekC.cupTac += inc;
  else if(kind === 'ko') q.weekC.ko += inc;
  else if(kind === 'crit') q.weekC.crit += inc;
  else if(kind === 'burn') q.chal.burn += inc;
  /* 패스 티켓 미션 카운터 */
  else if(kind === 'g11'){ q.tk.g11 += inc; q.tkw.g11 += inc; q.monthC.games += inc; }
  else if(kind === 'g1'){ q.tk.g1 += inc; q.tkw.g1 += inc; q.monthC.dgames += inc; q.rep.duels += inc; }
}
function claimQuest(scope, id){
  const q = ensureQuests();
  const item = (QUESTS[scope] || {items:[]}).items.find(x => x.id === id);
  if(!item) return;
  if(scope === 'rep'){
    if(item.get(q) < item.goal) return;
    q.rep[id === 'w2' ? 'wins' : 'games'] -= item.goal;
  } else {
    if(q.claimed[scope][id] || item.get(q) < item.goal) return;
    q.claimed[scope][id] = 1;
  }
  if(item.ticket){ addTickets(item.ticket); save(); toast('🎫 +' + item.ticket + '장 · ' + item.name); render(); return; }
  addCoins(item.coin); save();
  toast('+' + fmt(item.coin) + ' 코인 · ' + item.name);
  render();
}
function claimCount(){
  const q = ensureQuests();
  let n = q.login.last !== kstDay() ? 1 : 0;
  ['day','week','month','chal','tk','tkw'].forEach(sc => {
    QUESTS[sc].items.forEach(it => { if(!q.claimed[sc][it.id] && it.get(q) >= it.goal) n++; });
  });
  QUESTS.rep.items.forEach(it => { if(it.get(q) >= it.goal) n++; });
  return n;
}
function attNext(){
  const q = ensureQuests();
  const done = q.login.last === kstDay();
  const streak = done ? (q.login.streak || 0) : ((q.login.last === kstDay(-1)) ? (q.login.streak || 0) + 1 : 1);
  return {done, streak, coin: ATT_REWARD[Math.min(streak, 7) - 1]};
}
function claimAtt(){
  const q = ensureQuests();
  if(q.login.last === kstDay()){ toast('오늘 출석은 이미 받았습니다'); return; }
  q.login.streak = (q.login.last === kstDay(-1)) ? (q.login.streak || 0) + 1 : 1;
  q.login.last = kstDay();
  const coin = ATT_REWARD[Math.min(q.login.streak, 7) - 1];
  addCoins(coin); addTickets(1);
  save();
  toast('출석 ' + q.login.streak + '일차 · +' + fmt(coin) + ' 코인 · 🎫 +1');
  render();
}

/* ---------- opponents ---------- */
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 9973; return h; }
function opponentOf(club){
  const o = OPP[club];
  const h = hashOf(club);
  const dAtt = ((h % 7) - 3) * 0.5, dDef = (((h>>3) % 7) - 3) * 0.5;
  return {club, league:o.l, base:o.o, att:o.o + 1.5 + dAtt, mid:o.o + ((h%5)-2)*0.35, def:o.o + 1 + dDef, xi:o.xi};
}
function mixOpponent(){
  const xi = [];
  const roles = ['GK','CB','CB','LB','RB','DM','CM','AM','LW','ST','RW'];
  const used = new Set();
  for(const r of roles){
    const cand = P.map((p,i)=>i).filter(i => !used.has(i) && (posOf(i) === r || (r==='ST' && posOf(i)==='SS')));
    const i = cand.length ? pick(cand) : 0;
    used.add(i); xi.push([P[i][0], r]);
  }
  const base = 85 + Math.round(rnd(-2, 3));
  return {club:'유럽 믹스', league:'MIX', base, att: base+1, mid: base, def: base+1, xi, mix:true};
}
function randomClub(){
  const keys = Object.keys(OPP);
  return pick(keys);
}
function rankedTarget(rating){
  return clamp(80 + (rating - 1000) * 0.022, 74, 132);
}
function rankedOpponent(target){
  let best = null, bd = 99;
  for(const k of Object.keys(OPP)){
    const d = Math.abs(OPP[k].o - Math.min(target, 90));
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}
function opponentFor(mode){
  if(mode === 'normal') return Math.random() < 0.28 ? mixOpponent() : opponentOf(randomClub());
  if(mode === 'ranked') {
    const target = rankedTarget(S.rank.r);
    const o = opponentOf(rankedOpponent(target));
    const boost = Math.max(0, target - o.base) + rnd(-1, 1.5);
    const prof = aiProfile(tierOf(S.rank.r).idx);
    const b2 = boost + prof.ovr;
    return {...o, base: Math.round(o.base + b2), att:o.att + b2, mid:o.mid + b2, def:o.def + b2, cond:prof.cond, ai:prof};
  }
  return null;
}


/* ---------- 레전드 컵 (11대11 시즌 토너먼트) ---------- */
function cupRoundNames(size){ return CUP_ROUNDS[size === 16 ? 16 : 32]; }
function cupById(id){ for(const t of CUP_T) if(t.id === id) return t; return null; }
function cupLabel(id, short){ const t = cupById(id); if(!t) return '—'; return t.s + ' ' + (short ? t.sn : t.n); }
function cupShuffle(a){ const r = a.slice(); for(let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const x = r[i]; r[i] = r[j]; r[j] = x; } return r; }
function cupOffer(n){ return cupShuffle(CUP_T.map(t => t.id)).slice(0, n || 3); }
function cupPlOvr(t, i){
  const role = t.xi[i][1];
  const off = {GK:-1, SW:-2, CB:-3, LB:-2, RB:-2, RWB:-2, LWB:-2, DM:-1, CM:1, AM:2, RM:1, LM:1, LW:2, RW:2, RF:2, LF:2, CF:3, ST:3, SS:2}[role];
  const h = (hashOf(t.id + ':' + i) % 5) - 2;
  return clamp(Math.round(cupLv(t) + (off == null ? 0 : off) + h), 62, 99);
}
function cupRoster(t){ return t.xi.map((p, i) => ({name:p[0], role:p[1], ovr:cupPlOvr(t, i)})); }
function cupSide(t){
  const e = cupRoster(t), avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 60;
  const gk = e.filter(x => cupGrp(x.role) === 'GK')[0];
  const df = e.filter(x => cupGrp(x.role) === 'DF'), mf = e.filter(x => cupGrp(x.role) === 'MF'), fw = e.filter(x => cupGrp(x.role) === 'FW');
  return {ovr:cupLv(t), att:avg(fw.map(x => x.ovr)), mid:avg(mf.map(x => x.ovr)),
    def:avg(df.map(x => x.ovr)) * 0.78 + (gk ? gk.ovr : 60) * 0.22, cond:0, entries:e, syn:0, name:t.s + ' ' + t.n};
}
function cupGrp(role){ return CUP_GRP[role] || grp(role); }
function cupOpp(t, round){
  const s = cupSide(t);
  return {club:t.s + ' ' + t.n, league:'LEGEND', base:cupLv(t), att:s.att + 0.6, mid:s.mid, def:s.def + 0.4,
    xi:t.xi.map(p => [p[0], p[1]]), legend:t.id, cupTac:CUP_TAC_OF[t.id] || 'balance',
    ai:aiProfile(Math.min(9, 2 + (round || 0)))};
}
function cupStart(myId, size){
  const t = cupById(myId); if(!t) return;
  const n = size === 16 ? 16 : 32;
  const rest = cupShuffle(CUP_T.map(x => x.id).filter(id => id !== myId)).slice(0, n - 1);
  const field = cupShuffle([myId].concat(rest));
  const ties = [];
  for(let i = 0; i < field.length; i += 2) ties.push({a:field[i], b:field[i + 1], sa:null, sb:null, win:null, pens:null});
  S.cup = {size:n, totals:Math.round(Math.log(n) / Math.log(2)), my:myId, round:0,
    rounds:[{name:cupRoundNames(n)[0], ties}], done:false, result:null, coins:0, at:Date.now()};
  S.cupSel = null; S.cupCare = 0;
  U.cupSel = null; U.cupR = 0;
  save(); U.tab = 'cup'; render();
  toast('🏆 ' + n + '강 시작 · ' + t.s + ' ' + t.n);
}
/* 티켓 1장 · 대회당 1회 팀 리롤 */
function cupReroll(){
  const sel = S.cupSel || U.cupSel;
  if(!sel){ toast('팀 선택 화면이 아닙니다'); return; }
  if(sel.rerolled){ toast('이번 대회 리롤은 이미 사용했습니다'); return; }
  if(ticketCount() < CUP_REROLL_TICKET){ toast('패스 티켓이 ' + (CUP_REROLL_TICKET - ticketCount()) + '장 부족합니다'); return; }
  spendTickets(CUP_REROLL_TICKET);
  sel.offers = cupOffer(3); sel.rerolled = true;
  S.cupSel = sel; U.cupSel = sel;
  save(); render();
  toast('🎫' + CUP_REROLL_TICKET + ' · 다른 3팀으로 교체 · 이번 대회 1회 한정');
}
function cupOpen(size){
  const n = size === 16 ? 16 : 32;
  if(!S.cup) S.cup = null;
  const cur = S.cupSel;
  const ok = cur && cur.size === n && Array.isArray(cur.offers) && cur.offers.length === 3 && cur.offers.every(id => !!cupById(id));
  if(!ok) S.cupSel = {size:n, offers:cupOffer(3), rerolled:false};
  U.match = null; U.cupSel = S.cupSel; U.tab = 'cup';
  save(); render();
}
function cupCare(kind){
  const c = S.cup;
  if(!c || c.done){ toast('진행 중인 대회가 없습니다'); return; }
  const care = clamp(Math.round(+S.cupCare || 0), 0, 2);
  const v = kind === 'max' ? 2 : 1;
  if(care >= v){ toast(care >= 2 ? '이미 최상 컨디션입니다' : '이미 컨디션을 올렸습니다'); return; }
  const cost = kind === 'max' ? CARE.max.cost : CARE.lift.cost;
  if(S.coins < cost){ toast('코인이 ' + fmt(cost - S.coins) + ' 부족합니다'); return; }
  S.coins -= cost; S.cupCare = v; save(); paintHud(); render();
  toast('컨디션 ' + (v >= 2 ? '최상' : '좋음') + ' · 이번 경기 한정');
}
function cupMyTie(){
  const c = S.cup; if(!c || c.done) return null;
  const rd = c.rounds[c.round]; if(!rd) return null;
  return rd.ties.filter(t => t.a === c.my || t.b === c.my)[0] || null;
}
function cupMyOpp(){ const t = cupMyTie(); if(!t || !S.cup) return null; return cupById(t.a === S.cup.my ? t.b : t.a); }
function cupPlay(){
  const c = S.cup; if(!c || c.done) return;
  const tie = cupMyTie(); if(!tie) return;
  const myT = cupById(c.my), opT = cupById(tie.a === c.my ? tie.b : tie.a);
  if(!myT || !opT) return;
  const side = cupSide(myT);
  startMatch('cup', cupOpp(opT, c.round), {team:side, myName:myT.s + ' ' + myT.n, roster:side.entries, round:cupRoundNames(c.size)[c.round]});
}
function cupSimTie(t){
  if(t.win) return;
  const A = cupById(t.a), B = cupById(t.b);
  if(!A && !B) return;
  if(!A || !B){ t.win = A ? t.a : t.b; t.sa = A ? 3 : 0; t.sb = B ? 3 : 0; return; }
  const d = clamp((A.ovr - B.ovr) * 0.55, -9, 9);
  const ga = Math.max(0, Math.round(1.15 + d * 0.16 + rnd(-0.9, 0.9)));
  const gb = Math.max(0, Math.round(1.15 - d * 0.16 + rnd(-0.9, 0.9)));
  t.sa = ga; t.sb = gb;
  if(ga === gb){
    const pw = clamp(0.5 + (A.ovr - B.ovr) * 0.02, 0.34, 0.66);
    const Awin = Math.random() < pw;
    t.pens = Awin ? '5-4' : '4-5';
    t.win = Awin ? t.a : t.b;
  } else t.win = ga > gb ? t.a : t.b;
}
function cupResolveRound(c){
  const rd = c.rounds[c.round]; if(!rd) return;
  rd.ties.forEach(t => { if(!t.win) cupSimTie(t); });
  if(c.round < c.totals - 1 && !c.rounds[c.round + 1]){
    const ties = [];
    for(let i = 0; i < rd.ties.length; i += 2) ties.push({a:rd.ties[i].win, b:rd.ties[i + 1] ? rd.ties[i + 1].win : null, sa:null, sb:null, win:null, pens:null});
    c.rounds.push({name:cupRoundNames(c.size)[c.round + 1], ties});
  }
}
function cupSimRest(c){
  while(c.round < c.totals - 1){ cupResolveRound(c); c.round += 1; }
  cupResolveRound(c);
}
function cupCoins(remaining, gd){ return (CUP_COINS[clamp(remaining, 1, 5)] || 200) + (gd > 0 ? gd * 30 : 0); }
function cupExitCoins(remaining){ return Math.round((CUP_COINS[clamp(remaining, 1, 5)] || 200) * 0.25); }
function penShoot(M){
  const d = (M.t.ovr - M.opp.base) * 0.012;
  const myP = clamp(0.72 + d, 0.55, 0.88), opP = clamp(0.72 - d, 0.55, 0.88);
  let me = 0, op = 0;
  for(let i = 0; i < 5; i++){ if(Math.random() < myP) me++; if(Math.random() < opP) op++; }
  let guard = 0;
  while(me === op && guard < 40){ if(Math.random() < myP) me++; if(Math.random() < opP) op++; guard++; }
  if(me === op){ me++; }
  return {me, op};
}
function cupWin(M, c, tie){
  const myT = cupById(c.my), opT = cupById(tie.a === c.my ? tie.b : tie.a);
  const rec = {at:Date.now(), size:c.size, team: myT ? myT.s + ' ' + myT.n : '', ovr: myT ? cupLv(myT) : 0,
    opp: opT ? opT.s + ' ' + opT.n : '', me:M.me, op:M.op, pens: M.pens ? M.pens.me + '-' + M.pens.op : '',
    mvp: M.mvp ? M.mvp.name : '', coins: c.coins || 0};
  S.cups = [rec].concat(S.cups || []).slice(0, 30);
  if(!S.cupRec) S.cupRec = {n:0, w:0, l:0};
  c.done = true; c.result = 'champion';
}
function finishCupMatch(M){
  const c = S.cup;
  if(!c || c.done){ U.match = null; U.tab = 'cup'; render(); return; }
  const rd = c.rounds[c.round];
  const tie = rd ? rd.ties.filter(t => t.a === c.my || t.b === c.my)[0] : null;
  if(!tie){ U.match = null; U.tab = 'cup'; render(); return; }
  const myA = tie.a === c.my;
  let pens = null, res;
  if(M.me === M.op){ pens = penShoot(M); res = pens.me > pens.op ? 'w' : 'l'; }
  else res = M.me > M.op ? 'w' : 'l';
  tie.sa = myA ? M.me : M.op; tie.sb = myA ? M.op : M.me;
  tie.pens = pens ? (myA ? pens.me + '-' + pens.op : pens.op + '-' + pens.me) : null;
  tie.win = res === 'w' ? c.my : (myA ? tie.b : tie.a);
  tie.mine = true;
  M.pens = pens; M.res = res;
  M.mvp = pickMVP(M);
  const remaining = c.totals - c.round;
  M.coins = res === 'w' ? cupCoins(remaining, Math.abs(M.me - M.op)) : cupExitCoins(remaining);
  if(M.burn){ M.coinBase = M.coins; M.coins = Math.round(M.coins * BURN_COIN); M.burnBonus = M.coins - M.coinBase; }
  S.cupCare = 0;
  S.coins += M.coins; c.coins = (c.coins || 0) + M.coins;
  if(!S.cupRec) S.cupRec = {n:0, w:0, l:0};
  S.cupRec.n += 1; S.cupRec[res] = (S.cupRec[res] || 0) + 1;
  ensureQuests(); questAdd('game', 1); questAdd('g11', 1); if(res === 'w') questAdd('win', 1);
  if(res === 'w'){ questAdd('cupwin', 1); if(M.cupChanged) questAdd('cuptac', 1); }
  if(res === 'w' && c.round >= c.totals - 1) cupWin(M, c, tie);
  else if(res === 'w'){ cupResolveRound(c); c.round += 1; }
  else { cupResolveRound(c); cupSimRest(c); c.done = true; c.result = 'out'; }
  save(); paintHud(); renderCupResult(M);
}
function cupForfeit(){
  const c = S.cup, M = U.match;
  if(M && M.timer) clearInterval(M.timer);
  if(!c || c.done){ U.match = null; U.tab = 'cup'; render(); return; }
  const rd = c.rounds[c.round];
  const tie = rd ? rd.ties.filter(t => t.a === c.my || t.b === c.my)[0] : null;
  if(tie){ tie.win = tie.a === c.my ? tie.b : tie.a; tie.forfeit = true; tie.mine = true; }
  if(!S.cupRec) S.cupRec = {n:0, w:0, l:0};
  S.cupRec.n += 1; S.cupRec.l += 1;
  if(M) M.over = true;
  cupResolveRound(c); cupSimRest(c); c.done = true; c.result = 'out';
  U.match = null; U.tab = 'cup'; save(); render(); toast('레전드 컵 기권');
}
function cupTieRow(t){
  const wA = t.win && t.win === t.a, wB = t.win && t.win === t.b;
  const c = S.cup;
  const mine = c && (t.a === c.my || t.b === c.my);
  const live = mine && c && !c.done && c.rounds[c.round] && c.rounds[c.round].ties.indexOf(t) >= 0 && !t.win;
  const A = cupById(t.a), B = cupById(t.b);
  return `<div class="tie ${mine ? 'mine' : ''} ${live ? 'live' : ''}">
    <div class="tr ${wA ? 'w' : ''} ${t.a === c.my ? 'me' : ''}"><span class="nm">${esc(cupLabel(t.a, true))}</span><i>${A ? A.ovr : ''}</i><b>${t.sa == null ? '–' : t.sa}</b></div>
    <div class="tr ${wB ? 'w' : ''} ${t.b === c.my ? 'me' : ''}"><span class="nm">${esc(cupLabel(t.b, true))}</span><i>${B ? B.ovr : ''}</i><b>${t.sb == null ? '–' : t.sb}</b></div>
    ${t.forfeit ? '<div class="tf">몰수</div>' : t.pens ? `<div class="tf">승부차기 ${esc(t.pens)}</div>` : (!t.win ? '<div class="tf wait">예정</div>' : '')}
  </div>`;
}
function cupPathRows(c){
  const rows = [];
  for(let i = 0; i < c.rounds.length; i++){
    const t = c.rounds[i].ties.filter(x => x.a === c.my || x.b === c.my)[0];
    if(!t) continue;
    const myA = t.a === c.my, opp = cupLabel(myA ? t.b : t.a, true);

    const sc = t.sa == null ? '' : (myA ? t.sa + ':' + t.sb : t.sb + ':' + t.sa);

/* ---------- match simulation ---------- */
function startMatch(mode, opp, opts){
  const custom = (opts && opts.team) ? opts.team : null;
  const t = custom || teamStats();
  if(!t){ toast('먼저 드래프트로 스쿼드를 만드세요'); U.tab='squad'; render(); return; }
  let team = t, drain = 0;
  if(opts && opts.drain){
    if(drainLeft() <= 0){ toast('오늘 전력 흡수 5회를 다 썼습니다'); return; }
    if(S.coins < DRAIN_COST){ toast('코인이 ' + fmt(DRAIN_COST - S.coins) + ' 부족합니다'); return; }
    S.coins -= DRAIN_COST;
    drainInfo().used += 1;
    drain = DRAIN_BOOST;
    team = {...t, ovr: t.ovr + drain, att: t.att + drain, mid: t.mid + drain, def: t.def + drain};
    opp = {...opp, base: Math.max(0, opp.base - drain), att: opp.att - drain, mid: opp.mid - drain, def: opp.def - drain};
    save(); paintHud();
  }
  const cupMode = mode === 'cup';
  const burning = burnState().on;
  const tacKey = cupMode ? (S.cupTac || 'balance') : (S.tactic || 'balance');
  if(cupMode){
    team = {...team, cond: clamp(Math.round(+S.cupCare || 0), 0, 2)};
  } else {
    team = applyTactic(team, tacKey);
    if(burning) team = {...team, ovr:team.ovr + BURN_OVR, att:team.att + BURN_OVR, mid:(team.mid || 0) + BURN_OVR, def:team.def + BURN_OVR};
  }
  U.match = {mode, opp, t: team, f:S.formation, info:S.squadInfo, drain, tac:tacKey, min:0, me:0, op:0, ev:[], shotsMe:0, shotsOp:0, poss:50,
    over:false, timer:null, goals:[], rating:0, coins:0, diff:U.friendly.diff || 0, burn:burning,

function settleMatch(M){
  if(!M) return 'd';
  M.over = true;
  const res = M.me > M.op ? 'w' : M.me === M.op ? 'd' : 'l';
  const base = MODES[M.mode].coins[res === 'w' ? 0 : res === 'd' ? 1 : 2];
  const gd = Math.abs(M.me - M.op);
  let coins = base + (res === 'w' ? gd * 35 : 0);
  if(M.mode === 'ranked'){
    const oppOvr = Math.round(M.opp.base);
    const delta = res === 'w' ? Math.round(clamp(21 + (oppOvr - M.t.ovr) * 1.3, 14, 48))
      : res === 'd' ? Math.round(clamp(2 + (oppOvr - M.t.ovr) * 0.4, -6, 10))
      : -Math.round(clamp(10 + (M.t.ovr - oppOvr) * 0.8, 5, 26));
    M.ratingDelta = delta;
    S.rank.r = Math.max(0, S.rank.r + delta);
    S.rank[res] = (S.rank[res] || 0) + 1;
  }
  if(M.burn){ M.coinBase = coins; coins = Math.round(coins * BURN_COIN); M.burnBonus = coins - M.coinBase; }
  M.coins = coins;
  S.record[res] = (S.record[res] || 0) + 1;
  S.matches = (S.matches || 0) + 1;
  ensureQuests();
  questAdd('game', 1);
  questAdd('g11', 1);
  if(M.mode === 'ranked') questAdd('ranked', 1);
  if(res === 'w') questAdd('win', 1);
  if(res === 'w'){
    const qq = ensureQuests();
    if(M.info && M.info.low >= 11) qq.chal.low += 1;
    if(M.info && M.info.band) qq.chal.band += 1;
    if(Math.round(M.opp.base) > M.t.ovr) qq.chal.dog += 1;
    if(M.me >= 4) questAdd('big', 1);
    if(M.burn) questAdd('burn', 1);
  }
  if(M.chemi && M.chemi.add >= SYNERGY_ADD) questAdd('chemi', 1);

    const exact = pool.filter(i => posOf(i) === role || (role === 'ST' && posOf(i) === 'SS'));
    const near = pool.filter(i => NEAR[role].includes(posOf(i)));
    const same = pool.filter(i => grp(posOf(i)) === grp(role));
    const cand = exact.length ? exact : near.length ? near : same.length ? same : pool;
    const best = cand.slice().sort((a, b) => ovr(b) - ovr(a) || baseOvrOf(b) - baseOvrOf(a))[0];

/* 경기 MVP — 컨디션·득점·OVR·결과 반영 */
function pickMVP(M){
  if(!M) return null;
  const tally = {};
  (M.goals || []).forEach(g => { if(g.side === 'me') tally[g.name] = (tally[g.name] || 0) + 1; });
  const e = (M.roster && M.roster.length)
    ? M.roster.map(x => ({name:x.name, role:x.role, ovr:x.ovr, c:0}))
    : squadEntries().map(x => ({name:P[x.inst.i][0], role:x.role, ovr:ovrOf(x.inst), c:(x.c || 0)}));
  if(!e.length) return null;
  const gd = M.me - M.op;
  let best = null;
  e.forEach(x => {
    const goals = tally[x.name] || 0;
    const g = cupGrp(x.role);
    const fit = g === 'FW' ? 1 : g === 'MF' ? 0.6 : 0.3;
    const sc = x.ovr * 0.5 + (x.c || 0) * 2.8 + goals * 14 + gd * 1.4 + fit * 3 + Math.random() * 3;
    if(!best || sc > best.sc) best = {name:x.name, role:x.role, ovr:x.ovr, goals, c:x.c || 0, sc};
  });
  if(!best) return null;
  let rating = 6.4 + best.goals * 1.1 + (best.c || 0) * 0.25 + (gd > 0 ? 0.6 : gd < 0 ? -0.4 : 0) + Math.min(1.2, (best.ovr - 70) * 0.025);
  rating = Math.round(Math.max(5.5, Math.min(10, rating)) * 10) / 10;
  return {...best, rating};
}

/* ---------- 키우기 1대1 · 턴제 배틀 ---------- */
const DUEL_MAX_TURN = 20;   /* 최대 턴 */
const DUEL_STEP = 560;      /* 한 수 간격(ms) */
const DUEL_SIG_CD = 3;      /* 각성 필살기 쿨다운(턴) */
const DUEL_ROLE_IC = {GK:'🧤', DF:'🛡', MF:'🎯', FW:'⚽'};
const DUEL_HP_MUL = {GK:1.18, DF:1.1, MF:1.0, FW:0.9};
const DUEL_ATK = {GK:-5, DF:-1, MF:3, FW:6};
const DUEL_DEF = {GK:8, DF:6, MF:1, FW:-4};
const DUEL_SPD = {GK:-8, DF:-2, MF:2, FW:8};
/* 상성 — 공격하는 쪽 포지션 → 수비하는 쪽 포지션 피해 배율 */
const DUEL_EFF = {
  FW:{DF:1.2, GK:1.25, MF:1.05, FW:1.0},
  MF:{DF:1.1, GK:1.05, MF:1.0, FW:1.1},
  DF:{FW:1.15, MF:1.0, DF:1.0, GK:1.0},
  GK:{FW:1.0, MF:0.95, DF:1.0, GK:1.0}
};
/* 기술 3종 + 각성 필살기 — 포지션마다 손맛이 다르게 */
const DUEL_SET = {
  FW:[{n:'전광석화 드리블', ic:'⚡', tag:'돌파', p:24, acc:97, crit:.16},
      {n:'감아차기 슛', ic:'🌀', tag:'슛', p:31, acc:90, crit:.12},
      {n:'발리슛', ic:'💥', tag:'슛', p:36, acc:81, crit:.10}],
  MF:[{n:'스루패스 돌파', ic:'🎯', tag:'돌파', p:25, acc:96, crit:.14},
      {n:'중거리 포', ic:'🚀', tag:'슛', p:32, acc:88, crit:.11},
      {n:'전방 압박', ic:'🪤', tag:'압박', p:14, acc:100, crit:.05, foe:{atk:-1}}],
  DF:[{n:'철벽 태클', ic:'🧱', tag:'태클', p:26, acc:95, crit:.12, self:{def:1}},
      {n:'몸싸움', ic:'💪', tag:'경합', p:21, acc:97, crit:.10, self:{atk:1}},
      {n:'세트피스 헤더', ic:'🗿', tag:'슛', p:34, acc:83, crit:.14}],
  GK:[{n:'펀칭 클리어', ic:'✊', tag:'선방', p:24, acc:96, crit:.12},
      {n:'역습 롱패스', ic:'📡', tag:'패스', p:30, acc:90, crit:.10},
      {n:'철벽 방어', ic:'🛡', tag:'방어', p:0, acc:100, crit:0, guard:true, heal:.12}]

function duelSigPow(x){ return Math.round(38 + clamp(Math.round(x.lv || 0), 0, GROW_MAX) * 2.4); }
function aceInst(){ const c = growCur(); return c ? {i:c.i, b:baseOvrOf(c.i), lv:growLv(), c:0} : null; }
function duelMoves(role, lv){
  const g = grp(role);
  const base = (DUEL_SET[g] || DUEL_SET.MF).map(m => ({...m}));
  base.push({n:'각성 필살기', ic:'🔥', tag:'필살', sig:true, p:0, acc:82 + Math.min(8, Math.round(lv || 0)), crit:.2});
  return base;
}
function duelPickOpp(target, skip){
  let best = null;
  for(let k = 0; k < 90; k++){
    const i = Math.floor(Math.random() * P.length);
    if(skip != null && i === skip) continue;
    const base = baseOvrOf(i), d = Math.abs(base - target);
    if(!best || d < best.d) best = {i, d, base};
    if(d <= 1) break;
  }
  const lv = clamp(Math.round((target - best.base) / GROW_STEP), 0, 12);
  return {i:best.i, name:P[best.i][0], role:posOf(best.i), lv, ovr:Math.max(40, Math.round(best.base + lv * GROW_STEP)), cond:0};
}
/* 배틀용 스탯 — HP·공격·수비·스피드 */
function duelSide(x){
  const g = grp(x.role);
  const ovr = clamp(Math.round(x.ovr || 70), 40, 140);
  const lv = clamp(Math.round(x.lv || 0), 0, GROW_MAX);
  const max = Math.round((152 + (ovr - 70) * 4.2) * (DUEL_HP_MUL[g] || 1));
  return {hp:max, max,
    atk:ovr + (DUEL_ATK[g] || 0) + lv * 1.6,
    def:ovr + (DUEL_DEF[g] || 0) + lv * 1.6,
    spd:ovr + (DUEL_SPD[g] || 0),
    atkMul:1, defMul:1};
}
function startDuel(kind){

/* 1대1 대전 상태 빌드 — 라이브·스킵이 같이 쓴다 */
function duelSetup(kind){
  kind = kind || 'normal';
  const cur = growCur();
  if(!cur){ toast('먼저 키울 선수를 뽑으세요'); return null; }
  if(kind === 'invite' && !U.ace){ toast('받은 1대1 초대가 없습니다'); return null; }
  const burnOn = burnState().on;
  const a = {i:cur.i, name:P[cur.i][0], role:posOf(cur.i), lv:growLv(), ovr:Math.round(ovrGrow(aceInst())) + (burnOn ? BURN_OVR : 0), cond:0};
  let b;
  if(kind === 'invite') b = {...U.ace};
  else {
    const target = a.ovr + (kind === 'ranked' ? clamp((tierOf(duelRec().r).idx - 2) * 3, -10, 14) : 0) + Math.round(Math.random() * 6 - 3);
    b = duelPickOpp(target, cur.i);
  }
  return {duel:true, kind, a, b, burn:burnOn, ms:duelSide(a), os:duelSide(b),
    turn:1, over:false, busy:false, auto:false,
    dmgMe:0, dmgOp:0, critMe:0, critOp:0, coins:0, ratingDelta:0, how:'ko',
    mMoves:duelMoves(a.role, a.lv), oMoves:duelMoves(b.role, b.lv),
    mCd:[0,0,0,0], oCd:[0,0,0,0]};
}
/* ---------- 계산 ---------- */
function duelStrike(M, isMe, mv){
  const A = isMe ? M.a : M.b, B = isMe ? M.b : M.a;
  const SA = isMe ? M.ms : M.os, SB = isMe ? M.os : M.ms;
  const out = {miss:false, dmg:0, crit:false, eff:1, lvBonus:1, heal:0, guard:false, buff:''};
  if(mv.guard){
    const before = SA.hp;
    SA.hp = Math.min(SA.max, SA.hp + Math.round(SA.max * (mv.heal || .12)));
    out.heal = Math.round(SA.hp - before);
    SA.defMul = clamp(SA.defMul + .12, .7, 1.4);
    out.guard = true;
    return out;
  }
  if(mv.self) Object.keys(mv.self).forEach(k => {
    const v = mv.self[k];
    if(k === 'atk') SA.atkMul = clamp(SA.atkMul + .12 * v, .7, 1.4);
    else SA.defMul = clamp(SA.defMul + .12 * v, .7, 1.4);
  });
  if(mv.foe) Object.keys(mv.foe).forEach(k => {
    const v = mv.foe[k];
    if(k === 'atk') SB.atkMul = clamp(SB.atkMul + .1 * v, .7, 1.4);
  });
  const dodge = clamp(.05 + (SB.spd - SA.spd) * .004, .03, .2);
  const hitChance = clamp((mv.acc || 95) / 100 - dodge, .45, .99);
  if(Math.random() >= hitChance){ out.miss = true; return out; }
  const pow = mv.sig ? duelSigPow(A) : mv.p;
  const atk = SA.atk * SA.atkMul, def = Math.max(1, SB.def * SB.defMul);
  let dmg = pow * ((atk / (atk + def)) * 2) * rnd(.9, 1.1);
  out.eff = (DUEL_EFF[grp(A.role)] || {})[grp(B.role)] || 1;
  dmg *= out.eff;
  out.lvBonus = 1 + clamp(Math.round(A.lv || 0), 0, GROW_MAX) * .025;
  dmg *= out.lvBonus;
  out.crit = Math.random() < (mv.crit || .1);
  if(out.crit) dmg *= 1.65;
  out.dmg = Math.max(3, Math.round(dmg));
  SB.hp = Math.max(0, SB.hp - out.dmg);
  if(isMe){ M.dmgMe += out.dmg; if(out.crit) M.critMe += 1; }
  else { M.dmgOp += out.dmg; if(out.crit) M.critOp += 1; }
  return out;
}
function duelAiPick(M, isMe){
  const SA = isMe ? M.ms : M.os;
  const moves = isMe ? M.mMoves : M.oMoves;
  const cd = isMe ? M.mCd : M.oCd;
  let best = 0, bestSc = -1;
  moves.forEach((mv, k) => {
    if(mv.sig && (cd[k] || 0) > 0) return;
    let sc;
    if(mv.guard) sc = (SA.hp / SA.max < .42 ? 52 : 10) + Math.random() * 14;
    else {
      const p = mv.sig ? duelSigPow(isMe ? M.a : M.b) : mv.p;
      sc = p * (mv.acc || 95) / 100 + Math.random() * 15;
      if(mv.foe) sc += 9;
      if(mv.self) sc += 6;
      if(mv.sig) sc += 12;
    }
    if(sc > bestSc){ bestSc = sc; best = k; }
  });
  return best;
}

function duelLog(M, cls, html, dmg){
