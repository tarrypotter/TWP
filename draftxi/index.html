<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DRAFT XI 26/27 · 드래프트 축구 시뮬</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d0b">
<meta name="description" content="매 경기 새로 뽑는 임대 드래프트 · 포지션별 무제한 영구 버프로 유럽 5대 리그 26/27 선수들과 붙는 축구 시뮬레이션.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DRAFT XI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cdf95f'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230a120c'%3ED%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#070d0b; --bg2:#0a120f; --card:#0f1a16; --card2:#14221c; --card3:#192a22;
  --line:#1d3128; --line2:#2b4438;
  --ink:#edf6f0; --sub:#8ba399; --dim:#5e7469;
  --lime:#cdf95f; --lime2:#a9e12f; --amber:#ffb43a; --red:#ff5b45; --sky:#63d7ff; --gold:#f5c96a;
  --navh:58px; --barh:54px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#030605}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:800}
.app{position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#0f2019 0%,#070d0b 60%,#050a08 100%);overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;border-bottom:1px solid var(--line);
  background:rgba(7,13,11,.94);backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.mark{width:27px;height:27px;border-radius:9px;background:var(--lime);color:#07120a;display:grid;place-items:center;
  font-weight:900;font-size:14px;letter-spacing:-.04em;box-shadow:0 0 0 1px #eaffbd inset,0 3px 10px rgba(205,249,95,.18)}
.bname{font-size:14px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.bname i{color:var(--lime);font-style:normal}
.season{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line2);
  border-radius:5px;padding:2px 4px;margin-left:1px}
.hud{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pill{display:flex;align-items:center;gap:5px;height:29px;padding:0 9px;border-radius:9px;background:var(--card2);
  border:1px solid var(--line2);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px rgba(205,249,95,.7)}
.pill.code{color:var(--sub);font-size:11px;background:transparent}
.pill.code b{color:var(--ink);font-weight:700}

/* ---------- main scroll area ---------- */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px 14px 22px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* ---------- bottom tabs ---------- */
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:rgba(8,15,12,.97);
  backdrop-filter:blur(12px);z-index:20}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10px;font-weight:800;letter-spacing:-.01em;transition:color .15s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--lime)}
.tab.on:before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:26px;height:2px;
  background:var(--lime);border-radius:0 0 3px 3px;box-shadow:0 0 10px rgba(205,249,95,.6)}
.tab .badge{position:absolute;top:8px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--lime);color:#0a120c;font-size:9px;font-weight:900;display:grid;place-items:center}

/* ---------- generic ---------- */
.eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}
.eyebrow.g{color:var(--dim)}
h2.title{font-size:22px;font-weight:900;letter-spacing:-.045em;line-height:1.22;margin:5px 0 0}
h3.sub{font-size:14px;font-weight:900;letter-spacing:-.02em}
.muted{color:var(--sub);font-size:11.5px;line-height:1.55;letter-spacing:-.005em}
.tiny{font-size:10px;color:var(--dim);letter-spacing:.01em}
.card{background:linear-gradient(180deg,#101c17,#0c1613);border:1px solid var(--line);border-radius:15px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.sect{margin-top:20px}
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:9px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:31px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  color:var(--sub);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px;letter-spacing:-.01em}
.chip.on{background:var(--lime);border-color:var(--lime);color:#0a120c}
.chip:active{transform:scale(.97)}
.btn{height:47px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  font-size:13.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn.primary{background:linear-gradient(180deg,#dcff7c,#b9ea3c);border-color:#e2ff9a;color:#0a1409;
  box-shadow:0 6px 20px rgba(180,235,60,.16)}
.btn.dark{background:var(--card);border-color:var(--line2)}
.btn.sm{height:37px;border-radius:10px;font-size:12px;padding:0 12px}
.btn:disabled{opacity:.4;filter:none}
.btn.wide{width:100%}
.hr{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:5px;background:var(--card3);
  color:var(--sub);font-size:9.5px;font-weight:800;letter-spacing:.02em}
.tag.lime{background:rgba(205,249,95,.13);color:var(--lime)}
.tag.amber{background:rgba(255,180,58,.13);color:var(--amber)}
.tag.red{background:rgba(255,91,69,.14);color:var(--red)}
.tag.sky{background:rgba(99,215,255,.13);color:var(--sky)}

/* ---------- hero / empty ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(140% 100% at 78% -10%,#1d3a2b 0%,#0d1915 55%,#0a1310 100%);padding:18px 16px 16px}
.hero:after{content:"";position:absolute;right:-52px;top:-46px;width:170px;height:170px;border-radius:50%;
  border:1px solid rgba(205,249,95,.16);box-shadow:0 0 0 24px rgba(205,249,95,.04),0 0 0 52px rgba(205,249,95,.025)}
.hero h2{font-size:25px;line-height:1.16;letter-spacing:-.055em;margin:7px 0 0;font-weight:900}
.hero h2 em{font-style:normal;color:var(--lime)}
.hero p{font-size:11.5px;color:var(--sub);line-height:1.6;margin:8px 0 0;max-width:270px;letter-spacing:-.01em}
.hero .facts{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap;position:relative;z-index:1}
.fact{border:1px solid var(--line2);background:rgba(6,12,10,.4);border-radius:8px;padding:5px 7px;font-size:9.5px;
  color:var(--sub);font-weight:800;letter-spacing:.01em}
.fact b{color:var(--ink)}

.empty{border:1px dashed var(--line2);border-radius:16px;padding:22px 16px;text-align:center;background:rgba(12,22,18,.5)}
.empty .ic{font-size:26px;line-height:1}
.empty b{display:block;font-size:14px;margin:8px 0 3px;letter-spacing:-.02em}
.empty .muted{max-width:240px;margin:0 auto}

/* ---------- draft ---------- */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.prog{display:flex;gap:3px}
.prog i{display:block;width:9px;height:3px;border-radius:2px;background:#233a30}
.prog i.on{background:var(--lime)}
.prog i.now{background:var(--amber)}

.mini{position:relative;border-radius:14px;overflow:hidden;border:1px solid #1b4531;height:158px;
  background:repeating-linear-gradient(0deg,#113326 0 19px,#0e2c21 19px 38px)}
.mini .line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.13)}
.mini .circ{position:absolute;left:50%;top:50%;width:54px;height:54px;border:1px solid rgba(255,255,255,.13);border-radius:50%;transform:translate(-50%,-50%)}
.mini .box{position:absolute;left:50%;transform:translateX(-50%);width:64px;height:22px;border:1px solid rgba(255,255,255,.13)}
.mini .box.t{top:0;border-top:0}.mini .box.b{bottom:0;border-bottom:0}
.mini .mdot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#0b1712;
  border:1.5px solid #2e5641;color:#7d9b8b;font-size:8px;font-weight:800;display:grid;place-items:center}
.mini .mdot.f{border-color:var(--lime);color:var(--lime);background:#0f2419}
.mini .mdot.n{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,58,.16);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(255,180,58,.18)}50%{box-shadow:0 0 0 6px rgba(255,180,58,.05)}}

.picks{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.pick{position:relative;display:flex;align-items:center;gap:11px;padding:11px 11px 11px 12px;border-radius:14px;text-align:left;
  border:1px solid var(--line);background:linear-gradient(100deg,#12201a,#0d1814);transition:transform .09s,border-color .15s}
.pick:active{transform:scale(.985);border-color:var(--lime)}
.pick .ovr{flex:0 0 auto;width:46px;text-align:center}
.pick .ovr b{display:block;font-family:var(--mono);font-size:25px;font-weight:800;line-height:1;letter-spacing:-.06em}
.pick .ovr small{display:block;font-size:8px;letter-spacing:.12em;color:var(--dim);margin-top:2px;font-weight:800}
.pick .who{flex:1 1 auto;min-width:0}
.pick .nm{font-size:13.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .cl{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .bars{display:flex;gap:3px;margin-top:7px}
.pick .bars i{display:block;height:3px;flex:1;border-radius:2px;background:#20362b;overflow:hidden}
.pick .bars i s{display:block;height:100%;background:var(--lime);text-decoration:none}
.pick .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pick .go{width:26px;height:26px;border-radius:8px;background:var(--card3);display:grid;place-items:center;color:var(--lime);font-size:13px;font-weight:900}
.pick .pos{position:absolute;top:-1px;right:56px;font-size:8.5px;font-weight:900;letter-spacing:.06em;color:var(--dim)}
.pick.off .ovr b{color:var(--amber)}

/* ---------- squad ---------- */
.teamhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border-radius:15px;
  background:linear-gradient(120deg,#16281f,#0d1713 70%);border:1px solid var(--line)}
.teamhead .ovr{text-align:right}
.teamhead .ovr b{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:-.07em;line-height:1}
.teamhead .ovr small{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--dim);font-weight:800;margin-top:3px}
.teamhead .nm{font-size:15px;font-weight:900;letter-spacing:-.03em}

.pitch{position:relative;border-radius:16px;overflow:hidden;border:1px solid #1b4531;aspect-ratio:.74;
  background:repeating-linear-gradient(0deg,#123527 0 26px,#0f2e22 26px 52px);box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.pitch .pl-line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.15)}
.pitch .pl-circ{position:absolute;left:50%;top:50%;width:74px;height:74px;border:1px solid rgba(255,255,255,.15);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .pl-box{position:absolute;left:50%;transform:translateX(-50%);width:46%;height:12%;border:1px solid rgba(255,255,255,.15)}
.pitch .pl-box.t{top:0;border-top:0}.pitch .pl-box.b{bottom:0;border-bottom:0}
.pitch .pl-arc{position:absolute;left:50%;top:12%;width:60px;height:30px;border:1px solid rgba(255,255,255,.15);border-bottom:0;border-radius:30px 30px 0 0;transform:translateX(-50%)}
.pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:64px;gap:2px;z-index:2}
.pdot .bead{width:32px;height:32px;border-radius:50%;background:#0a1611;border:1.5px solid var(--lime);color:var(--lime);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:800;
  box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(205,249,95,.08)}
.pdot.off .bead{border-color:var(--amber);color:var(--amber);border-style:dashed}
.pdot.empty .bead{border-color:#38604a;color:#436a52;border-style:dashed;background:transparent}
.pdot .pn{font-size:8.5px;font-weight:800;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;
  color:#d7e9de;text-shadow:0 1px 3px #000;letter-spacing:-.02em}
.pdot .pp{font-size:7.5px;color:#7fa590;font-weight:800;letter-spacing:.05em}
.pdot:active .bead{transform:scale(.94)}

.linesum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.linesum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px}
.linesum span{display:block;font-size:8.5px;letter-spacing:.11em;color:var(--dim);font-weight:800}
.linesum b{display:block;font-family:var(--mono);font-size:16px;font-weight:800;margin-top:1px}

/* ---------- stadium ---------- */
.mode{position:relative;display:block;width:100%;text-align:left;padding:13px 13px;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(115deg,#12201a,#0c1613);overflow:hidden}
.mode:active{transform:scale(.99)}
.mode .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--card3);border:1px solid var(--line2)}
.mode .ttl{font-size:14.5px;font-weight:900;letter-spacing:-.03em}
.mode .dsc{font-size:10.5px;color:var(--sub);margin-top:2px;letter-spacing:-.01em;line-height:1.45}
.mode .rw{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.mode.hot{border-color:#3d6a3a;background:linear-gradient(115deg,#1a2e1c,#0d1713)}
.mode.hot:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(205,249,95,.14),transparent 70%)}

.opps{display:flex;flex-direction:column;gap:7px}
.opp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.opp .cr{width:30px;height:30px;border-radius:9px;background:var(--card3);display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;font-weight:800;color:var(--lime)}
.opp .nm{flex:1 1 auto;min-width:0;font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .ov{font-family:var(--mono);font-size:12px;color:var(--sub);font-weight:700}
.opp .pl{width:52px;height:29px;border-radius:8px;background:var(--lime);color:#0a120c;font-size:11px;font-weight:900;display:grid;place-items:center}

/* ---------- match ---------- */
.board{padding:13px 13px 11px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#15241c,#0b1512)}
.board .tm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.side .n{font-size:12.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.side .o{font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.02em}
.sc{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sc b{font-family:var(--mono);font-size:31px;font-weight:800;letter-spacing:-.08em;line-height:1}
.sc i{font-style:normal;color:#3d5a4b;font-size:15px;font-weight:800}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px}
.clock .m{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--lime);letter-spacing:.02em}
.clock .live{display:inline-flex;align-items:center;gap:3px;font-size:8.5px;font-weight:900;letter-spacing:.13em;color:var(--red)}
.clock .live:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.mbar{height:3px;border-radius:2px;background:#1c3126;margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--lime);border-radius:2px;transition:width .4s linear}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats3 div{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.stats3 span{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.stats3 b{display:block;font-family:var(--mono);font-size:13px;margin-top:1px}

.ticker{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.tk{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:9px;background:rgba(18,32,26,.62);
  border:1px solid #16281f;animation:tin .28s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.tk .mm{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--dim);padding-top:2px;width:24px}
.tk .tx{font-size:11px;line-height:1.5;color:#c9dbd0;letter-spacing:-.01em}
.tk.goal{background:linear-gradient(100deg,rgba(205,249,95,.16),rgba(18,32,26,.6));border-color:#3f6a34}
.tk.goal .mm{color:var(--lime)}
.tk.goal .tx{color:#eaffc4;font-weight:800}
.tk.big .tx{font-weight:800;color:var(--ink)}
.tk.half{background:#101d17}

.result{padding:15px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(170deg,#15261c,#0b1512)}
.result .rb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 12px}
.result .rb .tag{font-size:10px}
.result .rb h3{font-size:26px;font-weight:900;letter-spacing:-.05em}
.result .rb .fs{font-family:var(--mono);font-size:36px;font-weight:800;letter-spacing:-.07em;margin-top:2px}
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rewards div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.rewards span{display:block;font-size:8.5px;letter-spacing:.11em;color:var(--dim);font-weight:800}
.rewards b{display:block;font-family:var(--mono);font-size:16px;margin-top:1px}

function josa(word, a, b){
  const s = String(word || '').trim();
  if(!s) return a;
  const c = s.charCodeAt(s.length - 1);
  if(c >= 0xac00 && c <= 0xd7a3) return ((c - 0xac00) % 28) ? a : b;
  if(c < 128) return 'aeiouy'.indexOf(String.fromCharCode(c).toLowerCase()) >= 0 ? b : a;

}

/* ---------- player math ---------- */
function baseStats(i){
  const sp = posOf(i), g = grp(sp), o = baseOvrOf(i), w = WEIGHTS[g];
  const raw = OFFS[g].map(v => o + v);
  const wsum = raw.reduce((s,v,k) => s + v*w[k], 0);
  const delta = wsum - o;
  return raw.map(v => Math.max(25, Math.round(v - delta)));
}
function bufLvOf(inst){ return (S.buf && S.buf[grp(posOf(inst.i))]) || 0; }
function statsOf(inst){
  const b = baseStats(inst.i), add = bufLvOf(inst);
  return b.map(v => v + add);
}
function ovrExact(inst){
  const a = statsOf(inst), w = WEIGHTS[grp(posOf(inst.i))];
  return a.reduce((s,v,k) => s + v*w[k], 0);
}
function ovrOf(inst){ return Math.round(ovrExact(inst)); }
function bonusOf(inst){ return ovrOf(inst) - baseOvrOf(inst.i); }
function fitOf(inst, role){
  const sp = posOf(inst.i);
  return sp === role || (role === 'ST' && sp === 'SS') || (role === 'SS' && sp === 'ST');
}

function aggregate(e){
  const gk = e.filter(x => x.role === 'GK').map(x => x.ovr);
  const df = e.filter(x => grp(x.role) === 'DF').map(x => x.ovr);
  const mf = e.filter(x => grp(x.role) === 'MF').map(x => x.ovr);
  const fw = e.filter(x => grp(x.role) === 'FW').map(x => x.ovr);
  const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : 60;
  const def = avg(df)*0.78 + (gk.length ? gk[0]*0.22 : 60*0.22);
  return {ovr: Math.round(e.reduce((s,x)=>s+x.ovr,0)/11), att: avg(fw), mid: avg(mf), def, gk: gk[0] || 60, entries:e};
}

function startDraft(){

function slotOrder(f){
  const idx = FORMS[f].map((s,i)=>i);
  const order = ['GK','DF','MF','FW'];
  return idx.sort((a,b) => order.indexOf(grp(FORMS[f][a][0])) - order.indexOf(grp(FORMS[f][b][0])) || a-b);
}
function sampleOptions(f, slotIdx, taken){
  const role = FORMS[f][slotIdx][0];
  const used = new Set(taken);
  const all = P.map((p,i)=>i).filter(i => !used.has(i));
  const exact = all.filter(i => posOf(i) === role || (role==='ST'&&posOf(i)==='SS'));
  const near = all.filter(i => NEAR[role].includes(posOf(i)));
  const group = all.filter(i => grp(posOf(i)) === grp(role));
  const chosen = [];
  pickBiased(exact, 3 - chosen.length, chosen);
  if(chosen.length < 3) pickBiased(near, 3 - chosen.length, chosen);
  if(chosen.length < 3) pickBiased(group, 3 - chosen.length, chosen);
  return chosen.slice(0,3);
}
function pickBiased(list, k, out){
  const pool = list.filter(i => !out.includes(i));
  for(let n=0; n<k && pool.length; n++){
    const sorted = pool.slice().sort((a,b) => baseOvrOf(b) - baseOvrOf(a));
    const idx = Math.min(sorted.length-1, Math.floor(Math.pow(Math.random(), 1.55) * sorted.length));
    const v = sorted[idx];
    out.push(v); pool.splice(pool.indexOf(v), 1);
  }
}

  d.picks.push({i:playerIdx});
  if(d.picks.length >= 11){

    S.formation = d.f;
    S.draft = null;
    S.squad.forEach(updateBest);

  save(); render();
}

/* ---------- 친구 대결 초대 (URL 해시) ---------- */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(str){
  let t = String(str || '').replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function inviteURL(){
  if(!S.squad || !S.formation) return '';
  const payload = {v:1, c:S.code, f:S.formation, p:S.squad.map(x => x.i), b:BUF_KEYS.map(k => S.buf[k] || 0)};
  return location.origin + location.pathname + '#vs=' + b64e(JSON.stringify(payload));
}
function parseInvite(hash){
  const h = String(hash || '');
  const m = h.match(/[#&?]vs=([A-Za-z0-9_-]+)/);
  if(!m) return null;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o || !FORMS[o.f] || !Array.isArray(o.p) || o.p.length !== 11) return null;
    const p = o.p.map(v => Number(v));
    if(p.some(i => !(i >= 0 && i < P.length))) return null;
    if(new Set(p).size !== 11) return null;
    const b = {};
    BUF_KEYS.forEach((k, i) => { b[k] = Math.max(0, Math.min(9999, Math.round(+((o.b || [])[i]) || 0))); });
    const c = String(o.c || '').replace(/\D/g,'').slice(0,6);
    return {code: c || '000000', f: o.f, p, b};
  }catch(e){ return null; }
}
function copyInvite(){

function ovrWith(inst, buf){
  const g = grp(posOf(inst.i)), add = (buf && buf[g]) || 0, w = WEIGHTS[g];

}

function freshQuests(){
  return {day:kstDay(), week:kstWeekKey(), month:kstMonthKey(),
    today:{draft:0, win:0, games:0}, weekC:{win:0, ranked:0, buff:0}, monthC:{win:0, buf:0},
    claimed:{day:{}, week:{}, month:{}}, login:{last:'', streak:0},
    rep:{games:0, wins:0}};
}
function ensureQuests(){
  if(!S.q || typeof S.q !== 'object') S.q = freshQuests();
  const q = S.q;
  if(!q.today || typeof q.today !== 'object') q.today = {draft:0, win:0, games:0};
  if(!q.weekC || typeof q.weekC !== 'object') q.weekC = {win:0, ranked:0, buff:0};
  if(!q.monthC || typeof q.monthC !== 'object') q.monthC = {win:0, buf:0};
  if(!q.claimed || typeof q.claimed !== 'object') q.claimed = {day:{}, week:{}, month:{}};
  q.claimed.day ||= {}; q.claimed.week ||= {}; q.claimed.month ||= {};
  if(!q.login || typeof q.login !== 'object') q.login = {last:'', streak:0};
  if(!q.rep || typeof q.rep !== 'object') q.rep = {games:0, wins:0};
  const d = kstDay(), w = kstWeekKey(), m = kstMonthKey();
  if(q.day !== d){ q.day = d; q.today = {draft:0, win:0, games:0}; q.claimed.day = {}; }
  if(q.week !== w){ q.week = w; q.weekC = {win:0, ranked:0, buff:0}; q.claimed.week = {}; }
  if(q.month !== m){ q.month = m; q.monthC = {win:0, buf:0}; q.claimed.month = {}; }
  return q;
}
function questAdd(kind, n){
  const q = ensureQuests(), inc = n || 1;
  if(kind === 'draft') q.today.draft += inc;
  else if(kind === 'game'){ q.today.games += inc; q.rep.games += inc; }
  else if(kind === 'win'){ q.today.win += inc; q.weekC.win += inc; q.monthC.win += inc; q.rep.wins += inc; }
  else if(kind === 'ranked'){ q.weekC.ranked += inc; }
  else if(kind === 'buff'){ q.weekC.buff += inc; q.monthC.buf += inc; }
}
function claimQuest(scope, id){
  const q = ensureQuests();
  const item = (QUESTS[scope] || {items:[]}).items.find(x => x.id === id);
  if(!item) return;
  if(scope === 'rep'){
    if(item.get(q) < item.goal) return;
    q.rep[id === 'w2' ? 'wins' : 'games'] -= item.goal;
  } else {
    if(q.claimed[scope][id] || item.get(q) < item.goal) return;
    q.claimed[scope][id] = 1;
  }
  addCoins(item.coin); save();
  toast('+' + fmt(item.coin) + ' 코인 · ' + item.name);
  render();
}
function claimCount(){
  const q = ensureQuests();
  let n = q.login.last !== kstDay() ? 1 : 0;
  ['day','week','month'].forEach(sc => {
    QUESTS[sc].items.forEach(it => { if(!q.claimed[sc][it.id] && it.get(q) >= it.goal) n++; });
  });
  QUESTS.rep.items.forEach(it => { if(it.get(q) >= it.goal) n++; });
  return n;
}
function attNext(){
  const q = ensureQuests();
  const done = q.login.last === kstDay();
  const streak = done ? (q.login.streak || 0) : ((q.login.last === kstDay(-1)) ? (q.login.streak || 0) + 1 : 1);
  return {done, streak, coin: ATT_REWARD[Math.min(streak, 7) - 1]};
}
function claimAtt(){
  const q = ensureQuests();
  if(q.login.last === kstDay()){ toast('오늘 출석은 이미 받았습니다'); return; }
  q.login.streak = (q.login.last === kstDay(-1)) ? (q.login.streak || 0) + 1 : 1;
  q.login.last = kstDay();
  const coin = ATT_REWARD[Math.min(q.login.streak, 7) - 1];
  addCoins(coin); save();
  toast('출석 ' + q.login.streak + '일차 · +' + fmt(coin) + ' 코인');
  render();
}

/* ---------- opponents ---------- */
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 9973; return h; }
function opponentOf(club){
  const o = OPP[club];
  const h = hashOf(club);
  const dAtt = ((h % 7) - 3) * 0.5, dDef = (((h>>3) % 7) - 3) * 0.5;
  return {club, league:o.l, base:o.o, att:o.o + 1.5 + dAtt, mid:o.o + ((h%5)-2)*0.35, def:o.o + 1 + dDef, xi:o.xi};
}
function mixOpponent(){
  const xi = [];
  const roles = ['GK','CB','CB','LB','RB','DM','CM','AM','LW','ST','RW'];
  const used = new Set();
  for(const r of roles){
    const cand = P.map((p,i)=>i).filter(i => !used.has(i) && (posOf(i) === r || (r==='ST' && posOf(i)==='SS')));
    const i = cand.length ? pick(cand) : 0;
    used.add(i); xi.push([P[i][0], r]);
  }
  const base = 85 + Math.round(rnd(-2, 3));
  return {club:'유럽 믹스', league:'MIX', base, att: base+1, mid: base, def: base+1, xi, mix:true};
}
function randomClub(){
  const keys = Object.keys(OPP);
  return pick(keys);
}
function rankedTarget(rating){
  return clamp(80 + (rating - 1000) * 0.022, 74, 120);
}
function rankedOpponent(target){
  let best = null, bd = 99;
  for(const k of Object.keys(OPP)){
    const d = Math.abs(OPP[k].o - Math.min(target, 90));
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}
function opponentFor(mode){
  if(mode === 'normal') return Math.random() < 0.28 ? mixOpponent() : opponentOf(randomClub());
  if(mode === 'ranked') {
    const target = rankedTarget(S.rank.r);
    const o = opponentOf(rankedOpponent(target));
    const boost = Math.max(0, target - o.base) + rnd(-1, 1.5);
    return {...o, base: Math.round(o.base + boost), att:o.att+boost, mid:o.mid+boost, def:o.def+boost};
  }
  return null;
}

/* ---------- match simulation ---------- */
function startMatch(mode, opp, opts){
  const t = teamStats();
  if(!t){ toast('먼저 드래프트로 스쿼드를 만드세요'); U.tab='squad'; render(); return; }
  let team = t, drain = 0;
  if(opts && opts.drain){
    if(drainLeft() <= 0){ toast('오늘 전력 흡수 5회를 다 썼습니다'); return; }
    if(S.coins < DRAIN_COST){ toast('코인이 ' + fmt(DRAIN_COST - S.coins) + ' 부족합니다'); return; }
    S.coins -= DRAIN_COST;
    drainInfo().used += 1;
    drain = DRAIN_BOOST;
    team = {...t, ovr: t.ovr + drain, att: t.att + drain, mid: t.mid + drain, def: t.def + drain};
    opp = {...opp, base: Math.max(0, opp.base - drain), att: opp.att - drain, mid: opp.mid - drain, def: opp.def - drain};
    save(); paintHud();
  }
  U.match = {mode, opp, t: team, f:S.formation, drain, min:0, me:0, op:0, ev:[], shotsMe:0, shotsOp:0, poss:50,
    over:false, timer:null, goals:[], rating:0, coins:0, diff:U.friendly.diff || 0};
  if(mode === 'friendly'){
    const d = U.friendly.diff;
    U.match.opp.att += d; U.match.opp.mid += d; U.match.opp.def += d;
  }
  U.tab = 'stadium';
  renderMatchScreen();
  U.match.timer = setInterval(matchTick, 520);
}
function matchTick(){
  const M = U.match; if(!M || M.over) return;
  M.min += 5;
  if(M.min === 45){
    pushEvent({type:'half', mm:"45'", text:'전반 종료. ' + scoreText(M) + '. ' + (M.me === M.op ? '균형을 이룬' : M.me > M.op ? '리드를 잡은' : '끌려가는') + ' 채 후반을 맞습니다.', cls:'half'});
  } else if(M.min === 90){
    finishMatch(); return;
  } else {
    simulateMinute(M);
  }
  paintMatch();
}
function scoreText(M){ return '임대 XI ' + M.me + ' - ' + M.op + ' ' + M.opp.club; }
function attackerName(M, side){
  if(side === 'me'){
    const e = squadEntries();
    const pool = e.flatMap(x => x.role==='FW'?[x,x,x,x,x]:grp(x.role)==='MF'?[x,x,x]:grp(x.role)==='DF'?[x]:[]);
    const c = pool.length ? pick(pool) : e[0];
    return P[c.inst.i][0];
  }
  const xi = M.opp.xi.filter(p => p[1] !== 'GK');
  return pick(xi.map(p => p[0]));
}
function mateName(M, side, scorer){
  if(side === 'me'){
    const e = squadEntries().filter(x => P[x.inst.i][0] !== scorer && x.role !== 'GK');
    return e.length ? P[pick(e).inst.i][0] : '';
  }
  const xi = M.opp.xi.filter(p => p[1] !== 'GK' && p[0] !== scorer);
  return xi.length ? pick(xi)[0] : '';
}
function simulateMinute(M){
  const pMe = clamp(0.5 + (M.t.mid - M.opp.mid) * 0.016, 0.26, 0.74);
  M.poss = Math.round(M.poss * 0.82 + pMe * 100 * 0.18);
  const side = Math.random() < pMe ? 'me' : 'op';
  const atk = side === 'me' ? M.t.att : M.opp.att;
  const dfn = side === 'me' ? M.opp.def : M.t.def;
  const diff = clamp(atk - dfn, -14, 14);
  const gp = clamp(0.185 + diff * 0.011, 0.06, 0.38);
  const team = side === 'me' ? '임대 XI' : M.opp.club;
  const p = attackerName(M, side);
  const mm = M.min + "'";
  if(Math.random() < gp){
    if(side === 'me') M.me++; else M.op++;
    const a = mateName(M, side, p);
    const tpl = [
      p + ', 골망을 가릅니다! ' + (a ? a + '의 패스를 받아 ' : '') + '침착하게 마무리.',
      p + '의 헤더! 골키퍼 손끝을 스치고 골문 안으로 들어갑니다.',
      '역습 한 방! ' + p + ', 수비수 두 명을 제치고 골망을 흔듭니다.',
      '문전 혼전! ' + p + ', 끝까지 밀어 넣습니다.',
      p + '의 감아차기, 반대편 구석에 정확히 꽂힙니다!'
    ];
    pushEvent({type:'goal', side, text: pickV(tpl), mm, cls:'goal', score: scoreText(M)});
    if(side === 'me') M.shotsMe++; else M.shotsOp++;
    return;
  }
  const r = Math.random();
  if(r < 0.34){
    if(side === 'me') M.shotsMe++; else M.shotsOp++;
    pushEvent({type:'shot', side, mm, text: pickV([
      p + '의 중거리포, 골키퍼가 몸을 날려 쳐냅니다.',
      p + '의 감아차기, 골키퍼 정면으로 향합니다.',
      p + '의 슛이 수비수 발에 굴절되어 골키퍼가 잡습니다.',
      p + ', 수비 뒤 공간으로 침투했지만 슈팅이 막힙니다.',
    ])});
  } else if(r < 0.53){
    if(side === 'me') M.shotsMe++; else M.shotsOp++;
    pushEvent({type:'shot', side, mm, text: pickV([
      p + '의 슛이 골대 위로 날아갑니다.',
      p + '의 헤더, 크로스바를 살짝 넘어갑니다.',
      p + '의 왼발 슛, 옆그물을 흔듭니다.',
      p + '의 발리슛이 허공을 갈랐습니다.'
    ])});
  } else if(r < 0.7){
    pushEvent({type:'corner', side, mm, text: pickV([
      team + ' 코너킥. 문전으로 날카로운 공이 올라옵니다.',
      team + ' 프리킥 기회, 벽을 넘기지 못합니다.',
      '수비수 몸에 맞고 코너킥. ' + team + ga(team) + ' 압박을 이어갑니다.'
    ])});
  } else if(r < 0.84){
    pushEvent({type:'info', side, mm, text: pickV([
      team + ga(team) + ' 후방에서 볼을 돌리며 상대를 흔듭니다.',
      '중원 싸움이 치열합니다. ' + team + ga(team) + ' 압박 강도를 높입니다.',
      team + ' 벤치가 몸을 일으킵니다. 흐름을 바꿀 교체 카드.',
      '주심이 파울을 선언합니다. 경기가 잠시 끊깁니다.',
      team + '의 측면 돌파가 이어집니다. 크로스가 수비에 막힙니다.'
    ])});
  } else {
    pushEvent({type:'info', side, mm, text: pickV([
      p + ', 드리블로 공간을 만듭니다. 수비가 따라붙습니다.',
      '경고 카드가 나옵니다. 거친 태클이었습니다.',
      team + '의 오프사이드. 아쉽게 무산됩니다.',
      'VAR 체크. 득점 여부를 확인하지만 그대로 진행됩니다.'
    ])});
  }
}
function pushEvent(ev){
  const M = U.match;
  M.ev.unshift(ev);
  if(M.ev.length > 40) M.ev.pop();
  if(document.getElementById('tkHost')) addTick(ev);
}
function finishMatch(){
  const M = U.match; if(!M || M.over) return;
  M.over = true;
  clearInterval(M.timer); M.timer = null;
  const res = M.me > M.op ? 'w' : M.me === M.op ? 'd' : 'l';
  const base = MODES[M.mode].coins[res === 'w' ? 0 : res === 'd' ? 1 : 2];
  const gd = Math.abs(M.me - M.op);
  let coins = base + (res === 'w' ? gd * 35 : 0);
  if(M.mode === 'ranked'){
    const oppOvr = Math.round(M.opp.base);
    const delta = res === 'w' ? Math.round(clamp(21 + (oppOvr - M.t.ovr) * 1.3, 14, 48))
      : res === 'd' ? Math.round(clamp(2 + (oppOvr - M.t.ovr) * 0.4, -6, 10))
      : -Math.round(clamp(10 + (M.t.ovr - oppOvr) * 0.8, 5, 26));
    M.ratingDelta = delta;
    S.rank.r = Math.max(0, S.rank.r + delta);
    S.rank[res] = (S.rank[res] || 0) + 1;
  }
  M.coins = coins;
  S.record[res] = (S.record[res] || 0) + 1;
  S.matches = (S.matches || 0) + 1;
  ensureQuests();
  questAdd('game', 1);
  if(M.mode === 'ranked') questAdd('ranked', 1);
  if(res === 'w') questAdd('win', 1);
  S.recent = [{m:M.mode, o:M.opp.club, me:M.me, op:M.op, res}].concat(S.recent || []).slice(0,4);
  S.coins += coins;
  if(M.t.ovr > (S.bestTeam.ovr || 0)) S.bestTeam = {ovr: M.t.ovr, f: M.f || ''};
  /* 임대 스쿼드는 이 경기로 계약 종료 */
  M.expired = true;
  S.squad = null; S.formation = null; S.draft = null;
  save(); paintHud();
  renderResult();
}

      <div class="tr"><s style="width:${pct}%"></s></div>
      <div class="ft">
        <div class="tiny">${b.ex} <b style="color:var(--lime)">+${lv}</b></div>
        <div class="btns">
          <button class="up ${S.coins<p1?'poor':''}" data-act="buf" data-k="${b.k}" data-n="1">+1 <span style="color:var(--dim);font-size:9.5px">${fmt(p1)}</span></button>
          <button class="up ${S.coins<p5?'poor':''}" data-act="buf" data-k="${b.k}" data-n="5">+5 <span style="color:var(--dim);font-size:9.5px">${fmt(p5)}</span></button>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="eyebrow">BUFF · NO LIMIT</div>
    <div class="between"><h2 class="title">버프 강화</h2><span class="pill" style="height:27px"><span class="dot"></span><b>${fmt(S.coins)}</b></span></div>
    <div class="up-head" style="margin-top:11px">
      <div>
        <div class="eyebrow">POSITION BUFF</div>
        <div class="nm">총 버프 Lv</div>
        <div class="cl">${bufLine()}</div>
      </div>
      <div style="text-align:right"><div class="big ${tb>0?'up':''}">${fmt(tb)}</div><div class="tiny">드래프트에 그대로 합산</div></div>
    </div>
    <div class="stack" style="margin-top:10px">${rows}</div>
    <div class="rental" style="margin-top:10px"><span class="ic">⚡</span><span class="tx">버프는 선수 개인이 아니라 <b>포지션 전체</b>에 걸립니다. 드래프트 3택 카드, 피치, 경기 시뮬레이션 모두 버프가 더해진 능력치로 돌아갑니다.</span></div>
    <div class="stack" style="margin-top:11px">
      <button class="btn dark wide" data-act="go-stadium">경기장으로 → 코인 벌기</button>
      <div class="tiny" style="text-align:center">Lv 상한 없음 · 코인이 닿는 만큼 계속 올라갑니다</div>
    </div>
    <div class="card" style="padding:12px 13px;margin-top:12px">
      <div class="between"><span class="eyebrow g">TEAM</span><span class="tiny">${t ? S.formation + ' · 팀 OVR <b style="color:var(--ink)">' + t.ovr + '</b>' : '임대 스쿼드 없음'}</span></div>
      <div class="muted" style="margin-top:6px">${t
        ? '지금 임대 스쿼드는 버프가 더해진 OVR ' + t.ovr + '입니다. 버프를 더 올리면 다음 드래프트부터 바로 반영됩니다.'
        : '아직 임대 스쿼드가 없습니다. 드래프트하면 위 버프가 포지션별로 합산되어 카드와 경기에 적용됩니다.'}</div>
    </div>`;
}
function renderBuff(keepScroll){
  const m = $('#main');
  const top = keepScroll ? m.scrollTop : 0;
  m.innerHTML = buffHTML();
  if(keepScroll) m.scrollTop = top;
}

/* ---------- quest board ---------- */
function questHTML(){
  const q = ensureQuests();
  const a = attNext();
  const att = ATT_REWARD.map((c,i) => {
    const n = i + 1, now = !a.done && n === Math.min(a.streak, 7);
    const doneDay = a.done && n <= Math.min(a.streak, 7);
    return `<div class="${now ? 'now' : (doneDay ? 'done' : '')}"><span>${n}일</span><b>${fmt(c)}</b></div>`;
  }).join('');
  const sec = scope => {
    const def = QUESTS[scope];
    const rows = def.items.map(it => {
      const raw = it.get(q), v = Math.min(raw, it.goal), ok = raw >= it.goal;
      const claimed = scope !== 'rep' && !!q.claimed[scope][it.id];
      const btn = claimed ? `<div class="q-claim done">완료</div>`
        : `<button class="q-claim ${ok ? '' : 'off'}" data-act="qclaim" data-sc="${scope}" data-id="${it.id}">${ok ? '+' + fmt(it.coin) : fmt(it.coin)}</button>`;
      return `<div class="q ${ok && !claimed ? 'on' : ''}">
        <div class="q-row">
          <div class="qi"><b>${it.name}</b><span>${fmt(v)}/${fmt(it.goal)} · 보상 ${fmt(it.coin)}C</span>
            <div class="q-bar"><s style="width:${clamp(v / it.goal * 100, 0, 100)}%"></s></div></div>
          ${btn}
        </div></div>`;
    }).join('');
    return `<div class="sect stack">
      <div class="sect-h"><div class="eyebrow g">${def.label}</div><div class="tiny">${def.reset}</div></div>
      <div class="stack" style="gap:7px">${rows}</div></div>`;
  };
  const hint = claimCount();
  return `<div class="eyebrow">QUEST · KST</div>
    <div class="between"><h2 class="title">퀘스트</h2><span class="pill" style="height:27px"><span class="dot"></span><b>${fmt(S.coins)}</b></span></div>
    <div class="card" style="padding:12px 13px;margin-top:11px">
      <div class="between">
        <div><b style="font-size:13px;letter-spacing:-.02em">출석체크</b>
        <div class="tiny" style="margin-top:2px">연속 ${a.streak}일${a.done ? ' · 오늘 완료' : ' · KST 00:00 초기화'}</div></div>
        <button class="q-claim ${a.done ? 'done' : ''}" data-act="qatt">${a.done ? '완료' : '+' + fmt(a.coin)}</button>
      </div>
      <div class="att">${att}</div>
    </div>
    <div class="tiny" style="margin-top:9px">${hint ? '받을 수 있는 보상 ' + hint + '개' : '받을 수 있는 보상이 없습니다'} · 모든 기간은 한국시간(KST) 기준입니다</div>
    ${sec('day')}${sec('week')}${sec('month')}${sec('rep')}`;
}

/* ---------- ranking ---------- */
function tierOf(r){
  let t = TIERS[0];
  for(const x of TIERS) if(r >= x.min) t = x;
  const i = TIERS.indexOf(t);
  return {...t, idx:i, next:TIERS[i+1] || null};
}
function recordText(){ return `${S.rank.w}승 ${S.rank.d}무 ${S.rank.l}패`; }
function shareText(){
  const t = tierOf(S.rank.r);
  const total = S.record.w + S.record.d + S.record.l;
  const wr = total ? Math.round(S.record.w / total * 100) : 0;
  const tOvr = S.bestTeam.ovr || (teamStats() ? teamStats().ovr : 0) || '-';
  return '⚽ DRAFT XI 26/27\n'
    + '식별코드 #' + S.code + '\n'
    + 'AI 랭킹전 ' + t.n + ' ' + S.rank.r + '점 (' + recordText() + ')\n'
    + '총 버프 Lv ' + fmt(totalBuf()) + ' · ' + bufLine() + '\n'
    + '최고 팀 OVR ' + tOvr + (S.bestTeam.f ? ' (' + S.bestTeam.f + ')' : '') + '\n'
    + '경기 ' + S.matches + '회 · 승률 ' + wr + '%';
}
function rankingHTML(){
  const t = tierOf(S.rank.r);
  const nxt = t.next;
  const pct = nxt ? clamp((S.rank.r - t.min) / (nxt.min - t.min) * 100, 2, 100) : 100;
  const total = S.record.w + S.record.d + S.record.l;
  const wr = total ? Math.round(S.record.w / total * 100) : 0;
  const tOvr = teamStats() ? teamStats().ovr : 0;
  const ladder = TIERS.map((x,i)=>{
    const on = i === t.idx;
    return `<div class="lad ${on?'on':''}"><span class="d" style="background:${x.c}"></span><span class="n" style="${on?`color:${x.c}`:''}">${x.n}</span><span class="r">${x.min}+</span></div>`;
  }).join('');
  return `<div class="eyebrow">RANKING · AI LADDER</div>
    <h2 class="title">랭킹</h2>
    <div class="tier" style="margin-top:11px">
      <span class="badge" style="background:${t.c}22;color:${t.c};border:1px solid ${t.c}55">${t.n.toUpperCase()}</span>
      <div class="rt">${fmt(S.rank.r)}<small>RATING</small></div>
      <div class="tiny" style="margin-top:5px">${nxt ? `${nxt.n}까지 ${fmt(nxt.min - S.rank.r)}점` : '최고 티어 · 레전드'} · ${recordText()}</div>
      <div class="tierp"><i style="width:${pct}%"></i></div>
    </div>
    <div class="grid2" style="margin-top:9px">
      <div class="gcard"><span>최고 팀 OVR</span><b>${S.bestTeam.ovr || tOvr || '—'}</b><small>${esc(S.bestTeam.f || '기록 없음')}</small></div>
      <div class="gcard"><span>총 버프 Lv</span><b>${fmt(totalBuf())}</b><small>${esc(bufLine())}</small></div>
      <div class="gcard"><span>전체 전적</span><b>${S.record.w}-${S.record.d}-${S.record.l}</b><small>승률 ${wr}%</small></div>
      <div class="gcard"><span>경기 수</span><b>${fmt(S.matches || 0)}</b><small>임대 스쿼드 소진 ${fmt(S.matches || 0)}회</small></div>
    </div>
    <div class="sect stack">
      <div class="sect-h"><div class="eyebrow g">TIER LADDER</div><div class="tiny">AI 랭킹전 기준</div></div>
      <div class="ladder">${ladder}</div>
    </div>
    <div class="sect stack">
      <div class="between"><div class="eyebrow g">SHARE</div><div class="tiny">식별코드 #${S.code}</div></div>
      <div class="share" id="shareBox">${esc(shareText())}</div>
      <button class="btn primary wide" data-act="copy">전적 문구 복사</button>
      <button class="btn dark wide" data-act="reset">전체 초기화</button>
    </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'start-draft'){ startDraft(); }
  else if(act === 'reroll'){
    if(!S.draft) return;
    if(S.coins < 80){ toast('코인이 부족합니다'); return; }
    spendCoins(80);
    S.draft.opts = sampleOptions(S.draft.f, S.draft.picks.length, S.draft.picks.map(p=>p.i));
    save(); render();
  }
  else if(act === 'pick'){
    const i = +el.dataset.i;
    choosePick(i);
  }
  else if(act === 'player'){ openPlayer(+el.dataset.k); }
  else if(act === 'close-sheet'){ $('#sheetHost').classList.remove('on'); }
  else if(act === 'sheet-buff'){ $('#sheetHost').classList.remove('on'); U.match = null; U.tab='upgrade'; render(); }
  else if(act === 'new-draft'){
    if(S.draft) openConfirm('드래프트를 버릴까요?', '진행 중인 선택이 사라집니다.', '버리고 새로 시작', 'confirm-draft');
    else openConfirm('새 드래프트를 시작할까요?', '지금 스쿼드는 사라지고, 코인과 전적은 그대로 남습니다.', '새 드래프트', 'confirm-draft');
  }
  else if(act === 'confirm-draft'){
    $('#sheetHost').classList.remove('on');
    S.squad = null; S.formation = null; S.draft = null; save(); startDraft();
  }
  else if(act === 'go-stadium'){ if(U.match && U.match.timer) clearInterval(U.match.timer); U.match=null; U.tab='stadium'; render(); }
  else if(act === 'go-upgrade'){ if(U.match && U.match.timer) clearInterval(U.match.timer); U.match=null; U.tab='upgrade'; render(); }
  else if(act === 'mode'){
    const m = el.dataset.mode;
    if(m === 'friendly'){ U.friendly.open = true; render(); }
    else if(m === 'ranked'){ openRankedSheet(); }
    else startMatch(m, opponentFor(m));
  }
  else if(act === 'start-ranked'){ $('#sheetHost').classList.remove('on'); startMatch('ranked', opponentFor('ranked')); }
  else if(act === 'start-drain'){ $('#sheetHost').classList.remove('on'); startMatch('ranked', opponentFor('ranked'), {drain:true}); }
  else if(act === 'play-invite'){ if(U.invite){ U.match = null; startMatch('invite', opponentFromInvite(U.invite)); } }
  else if(act === 'copy-invite'){ copyInvite(); }
  else if(act === 'cancel-invite'){ U.invite = null; try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} render(); }
  else if(act === 'qclaim'){ claimQuest(el.dataset.sc, el.dataset.id); }
  else if(act === 'qatt'){ claimAtt(); }
  else if(act === 'fleague'){ U.friendly.league = el.dataset.l; render(); }
  else if(act === 'fdiff'){ U.friendly.diff = +el.dataset.v; render(); }
  else if(act === 'close-friendly'){ U.friendly.open = false; render(); }
  else if(act === 'play-friendly'){
    const club = el.dataset.c;
    const o = opponentOf(club);
    startMatch('friendly', o);
  }
  else if(act === 'skip'){
    const M = U.match; if(!M || M.over) return;
    clearInterval(M.timer); M.timer = null;
    while(M.min < 90 && !M.over){
      M.min += 5;
      if(M.min === 90){ finishMatch(); break; }
      if(M.min === 45){ pushEvent({type:'half', mm:"45'", text:'전반 종료. ' + scoreText(M) + '.', cls:'half'}); continue; }
      simulateMinute(M);
    }
    paintMatch();
  }
  else if(act === 'next-draft'){
    if(U.match && U.match.timer) clearInterval(U.match.timer);
    U.match = null;
    startDraft();
  }
  else if(act === 'quit-match'){
    if(U.match && !U.match.over) openConfirm('중계를 나갈까요?', '진행 중인 경기는 기록되지 않습니다.', '나가기', 'confirm-quit');
    else { U.match = null; U.tab='stadium'; render(); }
  }
  else if(act === 'confirm-quit'){
    $('#sheetHost').classList.remove('on');
    if(U.match && U.match.timer) clearInterval(U.match.timer);
    U.match = null; U.tab='stadium'; render();
  }
  else if(act === 'quit-result'){ U.match = null; U.tab='stadium'; render(); }
  else if(act === 'buf'){ buyBuf(el.dataset.k, +el.dataset.n); }
  else if(act === 'resume-draft'){ U.tab='squad'; render(); }
  else if(act === 'go-squad'){ U.tab='squad'; render(); }
  else if(act === 'copy'){ copyShare(); }
  else if(act === 'reset'){ openConfirm('전체 초기화', '스쿼드, 코인, 전적, 식별코드까지 모두 지워집니다.', '모두 지우기', 'confirm-reset'); }
  else if(act === 'confirm-reset'){
    $('#sheetHost').classList.remove('on');
    localStorage.removeItem(KEY); S = freshState(); U = {tab:'squad', sel:0, match:null, friendly:{open:false, league:'EPL', diff:0}, busy:false};
    save(); render(); toast('초기화 완료');
  }
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  if(U.match && !U.match.over){ toast('경기 중에는 이동할 수 없습니다'); return; }
  U.match = null;
  U.tab = b.dataset.tab; render();
}));
$('#codePill').addEventListener('click', () => {
  copyText('#' + S.code).then(()=>toast('식별코드 복사됨'), ()=>toast('#' + S.code));
});

function copyText(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove(); return Promise.resolve();
}
function copyShare(){ copyText(shareText()).then(()=>toast('전적 문구를 복사했습니다'), ()=>toast('복사 실패')); }

/* ---------- zoom / gesture guard ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, {passive:false});
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['+','-','=','0'].includes(e.key)) e.preventDefault(); });

/* ---------- boot ---------- */
U.invite = parseInvite(typeof location !== 'undefined' ? location.hash : '');
if(U.invite) toast('초대 대결 도착 · #' + U.invite.code);
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('hashchange', () => { U.invite = parseInvite(location.hash); render(); });
}
paintHud();
render();

</script>
</body>
</html>
