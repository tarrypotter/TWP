<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DRAFT XI 26/27 · 드래프트 축구 시뮬</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d0b">
<meta name="description" content="매 경기 새로 뽑는 임대 드래프트 · 포지션별 무제한 영구 버프로 유럽 5대 리그 26/27 선수들과 붙는 축구 시뮬레이션.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DRAFT XI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cdf95f'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%230a120c'%3ED%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#070d0b; --bg2:#0a120f; --card:#0f1a16; --card2:#14221c; --card3:#192a22;
  --line:#1d3128; --line2:#2b4438;
  --ink:#edf6f0; --sub:#8ba399; --dim:#5e7469;
  --lime:#cdf95f; --lime2:#a9e12f; --amber:#ffb43a; --red:#ff5b45; --sky:#63d7ff; --gold:#f5c96a;
  --navh:50px; --barh:46px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#030605}
body{font-family:var(--sans);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:800}
.app{position:relative;width:100%;max-width:390px;height:100vh;height:100dvh;height:var(--app-h,100dvh);margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#0f2019 0%,#070d0b 60%,#050a08 100%);overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:5.5px;
  padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;border-bottom:1px solid var(--line);
  background:rgba(7,13,11,.94);backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:6.5px;min-width:0;flex:0 1 auto;overflow:hidden}
.bname{overflow:hidden;text-overflow:ellipsis}
.mark{width:24px;height:24px;border-radius:8px;background:var(--lime);color:#07120a;display:grid;place-items:center;
  font-weight:900;font-size:13px;letter-spacing:-.04em;box-shadow:0 0 0 1px #eaffbd inset,0 3px 10px rgba(205,249,95,.18)}
.bname{font-size:13px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.bname i{color:var(--lime);font-style:normal}
.season{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line2);
  border-radius:4.5px;padding:1.5px 3.5px;margin-left:1px}
.hud{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.pill{display:flex;align-items:center;gap:4px;height:26px;padding:0 7px;min-width:0;flex:0 0 auto;border-radius:8px;background:var(--card2);
  border:1px solid var(--line2);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px rgba(205,249,95,.7)}
.pill.code{color:var(--sub);font-size:10px;background:transparent;max-width:96px;padding:0 5px}
.pill b{flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.code b{color:var(--ink);font-weight:700}
/* 패스 티켓 — 코인 옆 제2 재화 */
.pill.tk{padding:0 6px;gap:3px;background:rgba(255,180,58,.11);border-color:rgba(255,180,58,.4)}
/* 컴팩트 상단 필 — 보이는 크기는 그대로, 터치 영역만 가로·세로로 넓힌다 */
.pill.tk,.pill.code{position:relative}
.pill.tk:after,.pill.code:after{content:"";position:absolute;left:-2px;right:-2px;top:-5px;bottom:-5px}
.pill.tk .ic{font-size:10px;line-height:1}
.pill.tk b{color:var(--amber)}
.pill.tk.zero{opacity:.55;background:var(--card2);border-color:var(--line2)}
.pill.tk.zero b{color:var(--sub)}
.chip.tk{background:rgba(255,180,58,.11);border-color:rgba(255,180,58,.42);color:var(--amber)}
.chip.tk b{color:var(--amber);font-family:var(--mono);font-size:10px}
.chip.tk.on{background:var(--amber);border-color:var(--amber);color:#1b1204}
.chip.tk.poor{opacity:.45}
.chip.tk:disabled{opacity:.4}
/* 상단 버닝타임 아이콘 — 대기 중엔 차분하게, 진행 중엔 불이 살아난다 */
.pill.fire{width:27px;height:26px;padding:0;justify-content:center;gap:0;background:var(--card2);border:1px solid var(--line2);
  opacity:.6;transition:opacity .18s,border-color .18s,background .18s,box-shadow .18s}
.pill.fire .ic{font-size:12.5px;line-height:1;filter:grayscale(.55);transition:filter .18s}
.pill.fire.on{opacity:1;background:linear-gradient(160deg,rgba(255,124,58,.3),rgba(255,180,58,.07));
  border-color:rgba(255,138,66,.75);box-shadow:0 0 0 1px rgba(255,140,70,.18) inset,0 0 11px rgba(255,110,50,.32)}
.pill.fire.on .ic{filter:none;animation:fireGlow 1.9s ease-in-out infinite}
@keyframes fireGlow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.88}}
/* 버닝타임 시트 */
.bst-t{font-size:16px;font-weight:900;letter-spacing:-.03em;margin-top:3px}
.bst-now{margin-top:9px;border-radius:13px;padding:9.5px 12px;border:1px solid var(--line2);background:var(--card)}
.bst-now.on{border-color:rgba(255,131,64,.55);background:linear-gradient(100deg,rgba(255,120,60,.16),rgba(255,180,58,.04))}
.bst-now .lb{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--dim)}
.bst-now .clk{font-family:var(--mono);font-size:25px;font-weight:800;letter-spacing:-.05em;line-height:1.1;margin-top:2px}
.bst-now.on .clk{color:#ff9a63}
.bst-now .sub{font-size:9.5px;font-weight:800;color:var(--sub);margin-top:3px}
.bst-eff{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.bst-eff div{border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);padding:7.5px 9px}
.bst-eff b{display:block;font-size:10.5px;letter-spacing:-.02em;font-family:var(--mono)}
.bst-eff span{display:block;font-size:8.5px;font-weight:800;color:var(--dim);margin-top:2px;line-height:1.3}
.bst-sec{margin-top:9.5px}
.bst-h{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;letter-spacing:-.01em;color:var(--sub);margin-bottom:3px}
.bst-h i{font-style:normal;font-size:8.5px;font-weight:800;color:var(--dim)}
.bst-h .now{margin-left:auto;font-size:8.5px;color:var(--lime)}
.bst-win{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8.5px;border:1px solid var(--line);
  background:rgba(255,255,255,.02);margin-top:3px;font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--ink)}
.bst-win .dash{color:var(--dim)}
.bst-win .ln{margin-left:auto;font-family:var(--sans);font-size:8.5px;font-weight:800;color:var(--dim)}
.bst-win.on{border-color:rgba(255,138,66,.6);background:linear-gradient(100deg,rgba(255,120,60,.18),rgba(255,180,58,.04))}
.bst-win.on .ln{color:#ff9a63}
.bst-note{margin-top:9px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);padding:7px 9.5px;
  font-size:8.5px;font-weight:800;color:var(--dim);line-height:1.4}
.tkcard{border-radius:12.5px;border:1px solid rgba(255,180,58,.32);background:linear-gradient(160deg,rgba(255,180,58,.09),rgba(255,180,58,.02));padding:9.5px 10px}
.tkcard .hd{display:flex;align-items:center;justify-content:space-between;gap:6.5px}
.tkcard .hd b{font-size:11px;letter-spacing:-.02em}
.skrow{display:flex;align-items:center;gap:5px;margin-top:7px;min-width:0}
.skrow .lb{flex:0 0 auto;width:66px;font-size:9.5px;font-weight:900;letter-spacing:-.03em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skrow .chip{flex:1 1 0;min-width:0;justify-content:center;height:26px;padding:0 5px;font-size:9.5px;white-space:nowrap}
.tkmission{border-radius:11px;border:1px solid rgba(255,180,58,.3);background:rgba(255,180,58,.05);padding:7.5px 9.5px;display:flex;align-items:center;gap:7px}
.tkmission .ic{flex:0 0 auto;font-size:14px}
.tkmission .tx{flex:1 1 auto;min-width:0}
.tkmission b{font-size:10.5px;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkmission small{font-size:9px;color:var(--dim);font-weight:800}

/* ---------- main scroll area ---------- */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:10px 10px calc(18px + env(safe-area-inset-bottom));scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* ---------- bottom tabs ---------- */
.tabs-fade{position:absolute;left:0;right:0;height:20px;pointer-events:none;z-index:19;
  background:linear-gradient(180deg,rgba(7,13,11,0),rgba(7,13,11,.92));display:none}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:rgba(8,15,12,.97);
  backdrop-filter:blur(12px);z-index:20}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5px;min-height:42px;
  padding:4px 0 3.5px;-webkit-tap-highlight-color:transparent;
  color:var(--dim);font-size:8.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;transition:color .15s}
.tab span:not(.badge){white-space:nowrap}
.tab:active{opacity:.65}
.tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--lime)}
.tab.on:before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;
  background:var(--lime);border-radius:0 0 3px 3px;box-shadow:0 0 10px rgba(205,249,95,.6)}
.tab .badge{position:absolute;top:8px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 2.5px;border-radius:7px;
  background:var(--lime);color:#0a120c;font-size:8.5px;font-weight:900;display:grid;place-items:center}

/* ---------- tactics ---------- */
.tacbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7.5px}
.tacbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2.5px;border-radius:9px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--sub);transition:all .15s}
.tacbtn b{font-size:9.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.tacbtn small{font-size:7.5px;font-weight:800;letter-spacing:-.02em;color:var(--dim);white-space:nowrap}
.tacbtn.on{background:rgba(205,249,95,.14);border-color:rgba(205,249,95,.55);color:var(--lime);box-shadow:0 0 0 1px rgba(205,249,95,.18) inset}
.tacbtn.on small{color:#a9e12f}
.hbtop{display:flex;align-items:baseline;gap:5.5px;font-size:10px;font-weight:800}

/* ---------- box score · MVP ---------- */
.boxscore{display:grid;grid-template-columns:1fr 1fr;gap:5.5px;margin-top:7.5px}
.bscol{background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:10px;padding:7px 7.5px;min-width:0}
.bshead{font-size:8.5px;font-weight:800;letter-spacing:-.02em;color:var(--dim);display:flex;justify-content:space-between;gap:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.bshead b{font-family:var(--mono);font-size:12px;color:var(--ink)}
.bshead.mine b{color:var(--lime)}
.bsrow{display:flex;gap:5px;align-items:baseline;padding:2.5px 0;border-top:1px solid rgba(255,255,255,.04);min-width:0}
.bsrow:first-of-type{border-top:0}
.bsrow .mm{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--lime);width:20px}
.bsrow .nm{font-size:9.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsrow.empty .nm{color:var(--dim);font-weight:700}
.mvp{display:flex;align-items:center;gap:8px;padding:8.5px 9.5px;border-radius:11px;
  background:linear-gradient(100deg,rgba(205,249,95,.13),rgba(205,249,95,.03));border:1px solid rgba(205,249,95,.4)}
.mvpic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:rgba(205,249,95,.16);color:var(--lime)}
.mvp .nm{font-size:12px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvpr{flex:0 0 auto;text-align:right}
.mvpr b{font-family:var(--mono);font-size:19.5px;font-weight:800;letter-spacing:-.06em;color:var(--lime);line-height:1}
.mvpr small{display:block;font-size:7px;font-weight:800;letter-spacing:.12em;color:var(--dim);margin-top:1.5px}
.honor{margin-top:8.5px;display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:-.02em;
  padding:7px 9.5px;border-radius:9px;color:#ffe8a3;
  background:linear-gradient(100deg,rgba(255,196,60,.18),rgba(255,196,60,.05));border:1px solid rgba(255,196,60,.45);
  animation:grpop .35s ease both}
.honor b{font-family:var(--mono);font-size:11px;color:#ffd97a}
.honor.top{background:linear-gradient(100deg,rgba(255,224,120,.3),rgba(255,160,60,.12));border-color:rgba(255,224,120,.75);
  box-shadow:0 0 18px rgba(255,200,70,.25);color:#fff3c4}

/* ---------- 1대1 턴제 배틀 ---------- */
main.duel{padding:8px 10px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5.5px;overflow:hidden}
.dh{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6.5px;padding:0 1px;min-height:28px}
.dh-l{flex:1 1 auto;min-width:0}
.dh .eyebrow{font-size:8.5px;letter-spacing:.13em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .tiny{margin-top:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .chip{flex:0 0 auto;height:24px;padding:0 7px;font-size:9.5px}
.dh .chip:active{transform:scale(.97)}

.stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;padding:7px 7px 6px;
  border-radius:14.5px;border:1px solid #24402f;overflow:hidden;
  background:radial-gradient(120% 78% at 50% 44%,#16291f 0%,#0d1814 58%,#0a120e 100%)}
.arena{position:relative;flex:1 1 auto;min-height:0}
.arena:before{content:"";position:absolute;left:50%;top:50%;width:226px;height:226px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(205,249,95,.09);box-shadow:0 0 0 24px rgba(205,249,95,.022),0 0 0 54px rgba(205,249,95,.012)}
.vsmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;
  font-family:var(--mono);font-size:14px;font-weight:900;letter-spacing:.18em;color:rgba(205,249,95,.22)}
.arena:after{content:"";position:absolute;left:4%;right:4%;bottom:9%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent)}
.fighter{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.fighter .av{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26.5px;line-height:1;
  background:radial-gradient(circle at 34% 26%,#2c4c39,#0d1b15 74%);border:2px solid #43724f;
  box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(205,249,95,.1);animation:bob 3.4s ease-in-out infinite}
.fighter .av b{position:absolute;right:-8px;bottom:-2px;height:16px;min-width:21px;padding:0 3.5px;border-radius:8px;
  display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;font-weight:900;
  background:#0b1a12;border:1px solid #46774f;color:var(--lime)}
.fighter.op{right:2px;top:0}
.fighter.op .av{border-color:#6d463b;background:radial-gradient(circle at 34% 26%,#4a2f28,#170f0c 74%);
  box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(255,120,90,.1);animation-delay:-1.7s}
.fighter.op .av b{border-color:#7d4f42;color:#ffb59f;background:#1a0f0c}
.fighter.me{left:2px;bottom:0}
.fighter .lb{font-size:8.5px;font-weight:900;letter-spacing:.02em;color:#c3d8cb;text-shadow:0 1px 4px #000;white-space:nowrap}
.fighter.op .lb{color:#e6c3b9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fighter.act .av{animation:lunge .42s ease}
@keyframes lunge{0%{transform:none}45%{transform:translateX(var(--lx,9px)) scale(1.06)}100%{transform:none}}
.fighter.op.act .av{--lx:-9px}
.fighter.hit .av{animation:hit .44s ease}
@keyframes hit{0%,100%{transform:none}18%{transform:translateX(-6px) rotate(-4deg)}38%{transform:translateX(5px) rotate(3deg)}58%{transform:translateX(-4px)}78%{transform:translateX(3px)}}
.pop2{position:absolute;left:50%;top:6px;margin-left:-24px;width:56px;text-align:center;z-index:6;
  font-family:var(--mono);font-size:17.5px;font-weight:900;letter-spacing:-.05em;color:#ff9c86;
  text-shadow:0 2px 10px rgba(0,0,0,.85);opacity:0;pointer-events:none}
.pop2.mine{color:var(--lime)}
.pop2.on{animation:popup .82s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translateY(6px) scale(.82)}22%{opacity:1;transform:translateY(-2px) scale(1.1)}68%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-24px) scale(.95)}}

.bcard{flex:0 0 auto;width:calc(100% - 30px);padding:5px 7.5px 6px;border-radius:10px;
  border:1px solid #2c4a3a;background:linear-gradient(120deg,rgba(17,31,25,.97),rgba(11,21,17,.94))}
.bcard.op{align-self:flex-end;border-color:#5a3a31}
.bcard.me{align-self:flex-start;border-color:#3d6a3a}
.bcard .pc-h{display:flex;align-items:center;gap:4px;min-width:0}
.bcard .pc-side{flex:0 0 auto;font-size:7.5px;font-weight:900;letter-spacing:.1em;padding:1px 3.5px;border-radius:3.5px;
  background:rgba(255,255,255,.07);color:#9db4a8}
.bcard.me .pc-side{color:var(--lime);background:rgba(205,249,95,.13)}
.bcard.op .pc-side{color:#ffb3a3;background:rgba(255,120,90,.13)}
.bcard .pc-n{font-size:11.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .pc-ovr{flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:800;color:var(--lime)}
.bcard.op .pc-ovr{color:#ffb59f}
.bcard .pc-m{display:flex;align-items:center;gap:3px;margin:1px 0 3.5px;font-size:8.5px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .pc-m b{color:#cfe3d6}
.bcard .pc-m .lv{color:var(--amber);font-family:var(--mono);font-weight:800}
.bcard .pc-m .st{margin-left:auto;flex:0 0 auto;font-size:7.5px;font-weight:900;letter-spacing:.02em;color:var(--sky)}
.bcard .hp{height:6px;border-radius:3.5px;background:#16261e;border:1px solid #22392d;overflow:hidden}
.bcard .hp i{display:block;height:100%;width:100%;border-radius:3px;
  background:linear-gradient(90deg,#5fd35a,#a9f06a);transition:width .5s cubic-bezier(.25,.9,.3,1),background .3s}
.bcard.warn .hp i{background:linear-gradient(90deg,#f0b23c,#ffd479)}
.bcard.low .hp i{background:linear-gradient(90deg,#ff6f52,#ff4d3d);animation:hpwarn .9s infinite}
@keyframes hpwarn{50%{opacity:.55}}
.bcard .pc-hp{display:flex;justify-content:space-between;gap:5px;margin-top:1.5px;
  font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--sub)}
.bcard .pc-hp b{color:var(--ink);font-weight:800}
.bcard.low .pc-hp b{color:#ff8f7a}

.turnbar{flex:0 0 auto;display:flex;align-items:center;gap:5.5px}
.turnbar .tb{flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--lime)}
.turnbar .tb small{color:var(--dim);font-size:8.5px;letter-spacing:0}
.tbseg{flex:1 1 auto;display:flex;gap:2px;min-width:0}
.tbseg i{flex:1 1 0;height:3px;border-radius:3px;background:#1e3327}
.tbseg i.on{background:#3f6a44}
.tbseg i.now{background:var(--lime);box-shadow:0 0 6px rgba(205,249,95,.5)}
.chip.auto{flex:0 0 auto;height:22px;padding:0 6.5px;font-size:9.5px}
.chip.auto.on{background:rgba(205,249,95,.16);border-color:rgba(205,249,95,.6);color:var(--lime)}

.moves{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mv{display:flex;align-items:center;gap:5.5px;padding:6px 7px;min-width:0;border-radius:10px;
  border:1px solid var(--line2);background:linear-gradient(150deg,#15241d,#0e1a15);text-align:left;
  transition:transform .08s,border-color .15s}
.mv:active{transform:scale(.975);border-color:var(--lime)}
.mv .ic{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;
  background:rgba(205,249,95,.1);border:1px solid rgba(205,249,95,.22)}
.mv .tx{flex:1 1 auto;min-width:0}
.mv .tx b{display:block;font-size:9.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .tx small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv.sig{border-color:#6a4a2a;background:linear-gradient(150deg,#2a1f14,#150f0b)}
.mv.sig .ic{background:rgba(255,180,58,.13);border-color:rgba(255,180,58,.35)}
.mv.sig .tx b{color:#ffd79a}
.mv.sig .tx small{color:#c39a63}
.mv:disabled{opacity:.42}
.mv:disabled .ic{border-color:var(--line2);background:rgba(255,255,255,.04)}

.blog{flex:0 0 auto;height:82px;overflow-y:auto;display:flex;flex-direction:column;gap:2.5px;padding:5px 6px;
  border-radius:10px;border:1px solid var(--line);background:rgba(9,17,14,.8);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.blog::-webkit-scrollbar{display:none}
.bl{display:flex;gap:5px;align-items:flex-start;animation:blin .22s ease-out}
@keyframes blin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.bl .t{flex:0 0 auto;width:18px;font-family:var(--mono);font-size:8px;font-weight:800;color:var(--dim);padding-top:1.5px}
.bl .x{flex:1 1 auto;min-width:0;font-size:9.5px;line-height:1.42;color:#c7dbcf;letter-spacing:-.01em}
.bl .x b{color:var(--ink);font-weight:900}
.bl .x em{font-style:normal;display:inline-block;margin-left:2.5px;padding:0 3.5px;border-radius:3.5px;
  font-size:8px;font-weight:900;letter-spacing:0;background:rgba(205,249,95,.14);color:var(--lime)}
.bl .d{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:900;color:#ff8f7a;padding-top:1px}
.bl.crit .x em{background:rgba(255,180,58,.18);color:var(--amber)}
.bl.crit .d{color:#ffb43a}
.bl.eff .x em{background:rgba(99,215,255,.16);color:var(--sky)}
.bl.miss .x{color:#8fa79b}
.bl.miss .x em{background:rgba(255,255,255,.08);color:var(--sub)}
.bl.heal .x em{background:rgba(120,230,140,.16);color:#8ef0a6}
.bl.start .x{color:#eaffc4;font-weight:800}

.result .hpres{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:1.5px}
.hpres > div{padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.hpres span{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpres b{display:block;font-family:var(--mono);font-size:11.5px;margin-top:1px;letter-spacing:-.03em;white-space:nowrap}
.hpres .bar{height:4px;border-radius:3px;background:#1b2f24;margin-top:3.5px;overflow:hidden;padding:0;border:0}
.hpres .bar i{display:block;height:4px;border-radius:3px;background:linear-gradient(90deg,#5fd35a,#a9f06a)}
.hpres .bar.low i{background:linear-gradient(90deg,#ff6f52,#ff4d3d)}
.hpres .bar.mid i{background:linear-gradient(90deg,#f0b23c,#ffd479)}
.result .dstats{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dstats div{padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-width:0}
.dstats span{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.dstats b{display:block;font-family:var(--mono);font-size:13px;margin-top:1px;letter-spacing:-.03em}
.dstats small{display:block;font-size:8.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 키우기 보관함 ---------- */
.groster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:7.5px 0 2.5px}
.gchip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 7px;border-radius:9px;min-width:0;
  background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--sub);transition:all .15s}
.gchip b{font-size:9.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gchip small{font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--dim);letter-spacing:-.02em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gchip.on{background:rgba(205,249,95,.14);border-color:rgba(205,249,95,.55);color:var(--lime)}
.gchip.on small{color:#a9e12f}
.gchip.add{border-style:dashed;color:var(--dim);align-items:center;justify-content:center;white-space:nowrap;text-align:center}
/* 1대1 대전 모드 — 한 줄에 3개 타일 */
.duelmodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.dmode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 7px;border-radius:10px;min-width:0;
  border:1px solid var(--line2);background:var(--card2);color:var(--ink);text-align:center;transition:transform .35s var(--spring),border-color .18s ease,background .18s ease}
.dmode .ic{font-size:15px;line-height:1}
.dmode b{font-size:9.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dmode small{font-size:7.5px;font-weight:800;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:-.02em}
.dmode:active{transform:scale(.95)}
.dmode:disabled{opacity:.42;transform:none}
.dmode.hot{border-color:rgba(205,248,95,.45);background:linear-gradient(170deg,rgba(205,249,95,.14),rgba(205,249,95,.03))}
.dmode.hot small{color:#a9e12f}

/* ---------- generic ---------- */
.eyebrow{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}
.eyebrow.g{color:var(--dim)}
h2.title{font-size:20px;font-weight:900;letter-spacing:-.045em;line-height:1.22;margin:4px 0 0}
h3.sub{font-size:13px;font-weight:900;letter-spacing:-.02em}
.muted{color:var(--sub);font-size:10.5px;line-height:1.55;letter-spacing:-.005em}
.tiny{font-size:9.5px;color:var(--dim);letter-spacing:.01em}
.card{background:linear-gradient(180deg,#101c17,#0c1613);border:1px solid var(--line);border-radius:13.5px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex;flex-direction:column;gap:7px}
.sect{margin-top:12px}
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:6.5px;margin-bottom:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{height:26px;padding:0 8.5px;border-radius:7.5px;border:1px solid var(--line2);background:var(--card);
  color:var(--sub);font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:4px;letter-spacing:-.01em}
.chip.on{background:var(--lime);border-color:var(--lime);color:#0a120c}
.chip:active{transform:scale(.97)}
.btn{height:37px;border-radius:10.5px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  font-size:12px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn.primary{background:linear-gradient(180deg,#dcff7c,#b9ea3c);border-color:#e2ff9a;color:#0a1409;
  box-shadow:0 6px 20px rgba(180,235,60,.16)}
.btn.dark{background:var(--card);border-color:var(--line2)}
.btn.sm{height:31px;border-radius:8.5px;font-size:10.5px;padding:0 9px}
.btn:disabled{opacity:.4;filter:none}
.btn.wide{width:100%}
.hr{height:1px;background:var(--line);margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 5px;border-radius:4.5px;background:var(--card3);
  color:var(--sub);font-size:9px;font-weight:800;letter-spacing:.02em}
.tag.lime{background:rgba(205,249,95,.13);color:var(--lime)}
.tag.amber{background:rgba(255,180,58,.13);color:var(--amber)}
.tag.red{background:rgba(255,91,69,.14);color:var(--red)}
.tag.sky{background:rgba(99,215,255,.13);color:var(--sky)}

/* ---------- hero / empty ---------- */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(140% 100% at 78% -10%,#1d3a2b 0%,#0d1915 55%,#0a1310 100%);padding:15.5px 13.5px 13.5px}
.hero:after{content:"";position:absolute;right:-52px;top:-46px;width:170px;height:170px;border-radius:50%;
  border:1px solid rgba(205,249,95,.16);box-shadow:0 0 0 24px rgba(205,249,95,.04),0 0 0 52px rgba(205,249,95,.025)}
.hero h2{font-size:23px;line-height:1.16;letter-spacing:-.055em;margin:6px 0 0;font-weight:900}
.hero h2 em{font-style:normal;color:var(--lime)}
.hero p{font-size:10.5px;color:var(--sub);line-height:1.6;margin:7px 0 0;max-width:none;letter-spacing:-.01em}
.hero .facts{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap;position:relative;z-index:1}
.fact{border:1px solid var(--line2);background:rgba(6,12,10,.4);border-radius:7px;padding:4px 6px;font-size:9px;
  color:var(--sub);font-weight:800;letter-spacing:.01em}
.fact b{color:var(--ink)}

.empty{border:1px dashed var(--line2);border-radius:14.5px;padding:18.5px 13.5px;text-align:center;background:rgba(12,22,18,.5)}
.empty .ic{font-size:24px;line-height:1}
.empty b{display:block;font-size:13px;margin:7px 0 2.5px;letter-spacing:-.02em}
.empty .muted{max-width:240px;margin:0 auto}
.grow-empty .empty{min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grow-empty .empty .btn{margin-top:12px}

/* ---------- draft ---------- */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6.5px;margin-bottom:8.5px}
.prog{display:flex;gap:2.5px}
.prog i{display:block;width:9px;height:3px;border-radius:3px;background:#233a30}
.prog i.on{background:var(--lime)}
.prog i.now{background:var(--amber)}

.mini{position:relative;border-radius:12.5px;overflow:hidden;border:1px solid #1b4531;height:124px;
  background:repeating-linear-gradient(0deg,#113326 0 19px,#0e2c21 19px 38px)}
.mini .line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.13)}
.mini .circ{position:absolute;left:50%;top:50%;width:48px;height:48px;border:1px solid rgba(255,255,255,.13);border-radius:50%;transform:translate(-50%,-50%)}
.mini .box{position:absolute;left:50%;transform:translateX(-50%);width:64px;height:20px;border:1px solid rgba(255,255,255,.13)}
.mini .box.t{top:0;border-top:0}.mini .box.b{bottom:0;border-bottom:0}
.mini .mdot{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#0b1712;
  border:1.5px solid #2e5641;color:#7d9b8b;font-size:8px;font-weight:800;display:grid;place-items:center}
.mini .mdot.f{border-color:var(--lime);color:var(--lime);background:#0f2419}
.mini .mdot.n{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,58,.16);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(255,180,58,.18)}50%{box-shadow:0 0 0 6px rgba(255,180,58,.05)}}

/* 후보 카드 — 한 줄에 3개 게시판형 그리드 */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:7.5px}
.pick{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:6px 7px 6.5px;border-radius:11px;text-align:left;min-width:0;
  border:1px solid var(--line);background:linear-gradient(150deg,#12201a,#0d1814);transition:transform .09s,border-color .15s}
.pick:active{transform:scale(.985);border-color:var(--lime)}
.pick .pk-h{display:flex;align-items:center;justify-content:space-between;gap:3px;min-width:0}
.pick .ovr{flex:0 0 auto;display:flex;align-items:baseline;gap:2px;min-width:0}
.pick .ovr b{display:block;font-family:var(--mono);font-size:18px;font-weight:800;line-height:1;letter-spacing:-.06em}
.pick .ovr small{display:block;font-size:7.5px;letter-spacing:.06em;color:var(--dim);font-weight:800}
.pick .ps{flex:0 0 auto;height:15px;padding:0 3.5px;border-radius:4px;display:grid;place-items:center;
  background:rgba(205,249,95,.13);color:var(--lime);font-size:8.5px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.pick.off .ps{background:rgba(255,180,58,.15);color:var(--amber)}
.pick .nm{display:block;font-size:10px;font-weight:900;letter-spacing:-.02em;margin-top:3px;line-height:1.25;
  white-space:normal;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pick .cl{font-size:8px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pick .pk-m{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:3px;min-width:0}
.pick .pk-m .cond{font-size:8.5px;font-weight:900;letter-spacing:0;font-family:var(--mono)}
.pick .pk-m .base{font-family:var(--mono);font-size:8px;font-weight:800;color:var(--dim);white-space:nowrap}
.pick .bars{display:flex;gap:2px;margin-top:4px}
.pick .bars i{display:block;height:3px;flex:1;border-radius:3px;background:#20362b;overflow:hidden}
.pick .bars i s{display:block;height:100%;background:var(--lime);text-decoration:none}
.pick .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pick .go{width:21px;height:21px;border-radius:6.5px;background:var(--card3);display:grid;place-items:center;color:var(--lime);font-size:11px;font-weight:900}
.pick .pos{position:absolute;top:-1px;right:56px;font-size:8.5px;font-weight:900;letter-spacing:.06em;color:var(--dim)}
.pick.off{background:linear-gradient(150deg,#1a1712,#0d1814)}
.pick.off .ovr b{color:var(--amber)}

/* ---------- squad ---------- */
.teamhead{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:9px 10.5px;border-radius:12.5px;
  background:linear-gradient(120deg,#16281f,#0d1713 70%);border:1px solid var(--line)}
.teamhead .ovr{text-align:right}
.teamhead .ovr b{font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:-.07em;line-height:1}
.teamhead .ovr small{display:block;font-size:8px;letter-spacing:.12em;color:var(--dim);font-weight:800;margin-top:2px}
.teamhead .nm{font-size:13px;font-weight:900;letter-spacing:-.03em}
.teamhead .tiny{font-size:9.5px}

/* 피치 — 스크롤 없이 한 화면에 버튼까지 들어오도록 높이 고정, 도트 줄은 JS가 균등 배치 */
.pitch{position:relative;border-radius:13px;overflow:hidden;border:1px solid #1b4531;height:296px;
  background:repeating-linear-gradient(0deg,#123527 0 26px,#0f2e22 26px 52px);box-shadow:inset 0 0 60px rgba(0,0,0,.35);transition:none}
.pitch .pl-line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.15)}
.pitch .pl-circ{position:absolute;left:50%;top:50%;width:74px;height:74px;border:1px solid rgba(255,255,255,.15);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .pl-box{position:absolute;left:50%;transform:translateX(-50%);width:46%;height:12%;border:1px solid rgba(255,255,255,.15)}
.pitch .pl-box.t{top:0;border-top:0}.pitch .pl-box.b{bottom:0;border-bottom:0}
.pitch .pl-arc{position:absolute;left:50%;top:12%;width:60px;height:28px;border:1px solid rgba(255,255,255,.15);border-bottom:0;border-radius:27px 27px 0 0;transform:translateX(-50%)}
.pdot{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:58px;gap:1px;z-index:2}
.pdot .bead{width:27px;height:27px;border-radius:50%;background:#0a1611;border:1.5px solid var(--lime);color:var(--lime);
  display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:800;line-height:1;
  box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(205,249,95,.08)}
.pdot.off .bead{border-color:var(--amber);color:var(--amber);border-style:dashed}
.pdot.empty .bead{border-color:#38604a;color:#436a52;border-style:dashed;background:transparent}
.pdot .pn{font-size:8px;line-height:1.05;font-weight:800;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis;
  color:#d7e9de;text-shadow:0 1px 3px #000;letter-spacing:-.02em;margin-top:1px}
.pdot .pp{font-size:7px;line-height:1.05;color:#7fa590;font-weight:800;letter-spacing:.04em}
.pitch.tight .pdot .pp{display:none}
.pitch.tight .pdot .pn{font-size:7.5px}
.pdot:active .bead{transform:scale(.94)}

.linesum{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.linesum div{display:flex;align-items:baseline;justify-content:space-between;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8.5px;padding:5px 8px}
.linesum span{font-size:8.5px;letter-spacing:.06em;color:var(--dim);font-weight:800}
.linesum b{font-family:var(--mono);font-size:13.5px;font-weight:800}

/* ---------- stadium ---------- */
.mode{position:relative;display:block;width:100%;text-align:left;padding:11px 11px;border-radius:13.5px;border:1px solid var(--line);
  background:linear-gradient(115deg,#12201a,#0c1613);overflow:hidden}
.mode:active{transform:scale(.99)}
.mode .ic{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:15.5px;background:var(--card3);border:1px solid var(--line2)}
.mode .ttl{font-size:13.5px;font-weight:900;letter-spacing:-.03em}
.mode .dsc{font-size:9.5px;color:var(--sub);margin-top:1.5px;letter-spacing:-.01em;line-height:1.45}
.mode .rw{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}

.duelcard{display:flex;align-items:center;gap:8px;padding:8.5px 9.5px;border-radius:11.5px;border:1px solid #3d6a3a;
  background:linear-gradient(110deg,#1b2f1c,#0d1713)}
.duelcard .dc-l{flex:1 1 auto;min-width:0}
.duelcard .dc-l span{display:block;font-size:8px;letter-spacing:.14em;color:var(--lime);font-weight:800}
.duelcard .dc-l b{display:block;font-size:12.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.duelcard .dc-l small{display:block;font-size:9px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duelcard .dc-r{flex:0 0 auto;text-align:right}
.duelcard .dc-r b{display:block;font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--lime)}
.duelcard .dc-r span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--amber);margin-top:2.5px}

/* ---------- upgrade ---------- */
.pscroll{display:flex;gap:5.5px;overflow-x:auto;padding:1.5px 1px 3.5px;scrollbar-width:none;-webkit-overflow-scrolling:touch }
.pscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 auto;width:76px;padding:7.5px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);text-align:center}
.pcard.on{border-color:var(--lime);background:linear-gradient(180deg,#1b2f22,#101c16)}
.pcard .o{font-family:var(--mono);font-size:16.5px;font-weight:800;letter-spacing:-.05em;line-height:1}
.pcard .n{font-size:9px;font-weight:800;margin-top:3.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.pcard .p{font-size:8px;color:var(--dim);font-weight:800;letter-spacing:.06em;margin-top:1px}
.pcard .b{font-family:var(--mono);font-size:8.5px;color:var(--lime);margin-top:1.5px}

.up-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:13.5px;
  background:linear-gradient(120deg,#17291f,#0c1613);border:1px solid var(--line)}
.up-head .big{font-family:var(--mono);font-size:36.5px;font-weight:800;letter-spacing:-.08em;line-height:.95}
.up-head .big.up{color:var(--lime)}
.up-head .nm{font-size:13px;font-weight:900;letter-spacing:-.03em;margin-top:1.5px}
.up-head .cl{font-size:9.5px;color:var(--sub);margin-top:1px}
.stat{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #17261f}
.stat:last-child{border-bottom:0}
.stat .lb{width:33px;font-size:9.5px;font-weight:800;color:var(--sub);letter-spacing:-.01em}
.stat .vl{width:30px;text-align:right;font-family:var(--mono);font-size:13px;font-weight:800}
.stat .tr{flex:1 1 auto;height:5px;border-radius:3px;background:#1b2f24;overflow:hidden}
.stat .tr s{display:block;height:100%;background:linear-gradient(90deg,#7bbf35,var(--lime));text-decoration:none;border-radius:3px;transition:width .18s}
.stat .btns{display:flex;gap:3px}
.up{height:26px;min-width:38px;padding:0 6px;border-radius:7px;background:var(--card3);border:1px solid var(--line2);
  font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink);display:grid;place-items:center;line-height:1}
.up:active{background:var(--lime);color:#0a120c}
.up.poor{opacity:.38}
.brow{padding:9.5px 10px;border-radius:11.5px;border:1px solid var(--line);background:linear-gradient(110deg,#12201a,#0c1613)}
.brow.on{border-color:#3d6a3a}
.brow .hd{display:flex;align-items:center;gap:7px}
.brow .ic{width:28px;height:28px;border-radius:8px;background:var(--card3);border:1px solid var(--line2);display:grid;place-items:center;font-size:13px}
.brow .nm{flex:1 1 auto;min-width:0}
.brow .nm b{display:block;font-size:11.5px;font-weight:900;letter-spacing:-.02em}
.brow .nm span{display:block;font-size:9px;color:var(--sub);margin-top:1px;letter-spacing:-.01em}
.brow .lv{font-family:var(--mono);font-size:17.5px;font-weight:800;letter-spacing:-.05em;color:var(--lime);line-height:1}
.brow .lv small{font-size:8px;color:var(--dim);letter-spacing:.08em;margin-left:1.5px}
.brow .tr{height:4px;border-radius:3px;background:#1b2f24;margin-top:7.5px;overflow:hidden}
.brow .tr s{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7bbf35,var(--lime));text-decoration:none;transition:width .2s}
.brow .ft{display:flex;align-items:center;justify-content:space-between;gap:6.5px;margin-top:7px}
.brow .btns{display:flex;gap:4px}
.rental{display:flex;align-items:center;gap:7px;padding:7.5px 9.5px;border-radius:10px;border:1px dashed var(--line2);background:rgba(255,180,58,.05)}
.rental .ic{font-size:13px}
.rental .tx{flex:1 1 auto;font-size:9.5px;line-height:1.5;color:var(--sub);letter-spacing:-.01em}
.rental .tx b{color:var(--amber)}
.inv{display:flex;align-items:center;gap:8px;padding:9.5px 10px;border-radius:11.5px;border:1px solid #4a6b2f;
  background:linear-gradient(110deg,#22381c,#0d1713)}
.inv .ic{width:29px;height:29px;border-radius:8px;background:rgba(205,249,95,.14);display:grid;place-items:center;font-size:14px}
.inv .tx{flex:1 1 auto;min-width:0}
.inv .tx b{display:block;font-size:11px;font-weight:900;letter-spacing:-.02em}
.inv .tx span{display:block;font-size:9px;color:var(--sub);margin-top:1px}
.q{padding:8.5px 9.5px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.q.on{border-color:#3d6a3a;background:linear-gradient(110deg,#1a2e1c,#0d1713)}
.q-row{display:flex;align-items:center;gap:8px}
.q-row .qi{flex:1 1 auto;min-width:0}
.q-row .qi b{font-size:10.5px;font-weight:900;letter-spacing:-.02em}
.q-row .qi span{display:block;font-size:9px;color:var(--sub);margin-top:1px}
.q-bar{height:3px;border-radius:3px;background:#1b2f24;margin-top:5px;overflow:hidden}
.q-bar s{display:block;height:100%;background:linear-gradient(90deg,#7bbf35,var(--lime));text-decoration:none}
.q-claim{flex:0 0 auto;height:28px;min-width:56px;padding:0 7.5px;border-radius:7px;background:var(--lime);color:#0a120c;
  font-size:9.5px;font-weight:900;display:grid;place-items:center}
.q-claim.off{background:var(--card3);color:var(--dim)}
.q-claim.tk{background:rgba(255,180,58,.14);color:var(--amber);min-width:42px}
.q-claim.off.tk{background:var(--card3);color:var(--dim)}
.q-claim.done{background:transparent;border:1px solid var(--line2);color:var(--dim);font-size:9.5px}
.qall{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:42px;border-radius:11.5px;
  border:1px solid #e2ff9a;background:linear-gradient(180deg,#dcff7c,#b9ea3c);color:#0a1409;
  box-shadow:0 6px 20px rgba(180,235,60,.16),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .35s var(--spring),filter .2s ease}
.qall b{font-size:12px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.qall small{font-size:9px;font-weight:800;color:rgba(10,20,9,.6);letter-spacing:-.01em}
.qall.off{border-color:var(--line2);background:var(--card3);color:var(--dim);box-shadow:none;filter:none}
.qall.off small{color:var(--dim);opacity:.75}
.qall:active{transform:scale(.97)}
.att{display:flex;gap:3px;margin-top:8.5px}
.att div{flex:1 1 0;text-align:center;padding:5px 1.5px;border-radius:7px;border:1px solid var(--line);background:rgba(6,12,10,.4)}
.att div.now{border-color:var(--lime);background:rgba(205,249,95,.1)}
.att div.done{opacity:.45}
.att span{display:block;font-size:8px;color:var(--dim);font-weight:800}
.att b{display:block;font-family:var(--mono);font-size:9.5px;margin-top:1.5px}
.att div.now b{color:var(--lime)}
.gr-hero{position:relative;overflow:hidden;border-radius:14.5px;border:1px solid var(--line);padding:12px;
  background:radial-gradient(120% 100% at 85% -10%,#24391f 0%,#101d16 60%,#0b1512 100%)}
.gr-hero .ovr{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:-.08em;line-height:.95}
.gr-hero .between>div{min-width:0}
.gr-hero .nm{font-size:15.5px;font-weight:900;letter-spacing:-.04em;margin-top:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-lv{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7.5px;border-radius:6.5px;
  background:rgba(255,180,58,.14);border:1px solid rgba(255,180,58,.4);color:var(--amber);font-family:var(--mono);font-size:10px;font-weight:800}
.gr-seg{display:flex;gap:2.5px;margin-top:9.5px}
.gr-seg i{flex:1 1 0;height:6px;border-radius:3px;background:#22392c}
.gr-seg i.on{background:linear-gradient(180deg,#f5c96a,#e0a52f);box-shadow:0 0 8px rgba(245,201,106,.35)}
.gr-go{height:48px;border-radius:13.5px;border:1px solid #e2ff9a;background:linear-gradient(180deg,#dcff7c,#b9ea3c);color:#0a1409;
  font-size:14px;font-weight:900;letter-spacing:-.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 8px 24px rgba(180,235,60,.2);transition:transform .07s}
.gr-go:active{transform:scale(.97)}
.gr-go small{font-size:9.5px;font-weight:800;opacity:.7}
.gr-go:disabled{opacity:.45}
.gr-res{margin-top:9.5px;padding:11px;border-radius:11.5px;text-align:center;font-size:13px;font-weight:900;letter-spacing:-.02em;
  animation:grpop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes grpop{0%{transform:scale(.86);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
.gr-res.ok{background:rgba(205,249,95,.14);border:1px solid #4d7a35;color:#dcff8c}
.gr-res.keep{background:rgba(99,215,255,.12);border:1px solid #2f6376;color:#a8ecff}
.gr-res.drop{background:rgba(255,180,58,.13);border:1px solid #6d5222;color:#ffcf85}
.gr-res.boom{background:rgba(255,91,69,.14);border:1px solid #7a332a;color:#ffb0a4;animation:grshake .4s}
@keyframes grshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.impbox{width:100%;height:76px;padding:8.5px;border-radius:10px;border:1px solid var(--line2);background:#0b1512;
  color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.5;resize:none}
.cond{font-family:var(--mono);font-size:9px;font-weight:900;letter-spacing:-.02em}
.halfbox{margin-top:7.5px;padding:7.5px 9.5px;border-radius:9px;border:1px solid #3d6a3a;
  background:rgba(205,249,95,.08);text-align:center;font-size:10px;font-weight:800;color:var(--lime);letter-spacing:-.01em}
.pop{position:fixed;z-index:120;font-family:var(--mono);font-size:13px;font-weight:800;color:var(--lime);
  pointer-events:none;animation:pop .8s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes pop{0%{opacity:0;transform:translateY(4px) scale(.9)}30%{opacity:1;transform:translateY(-10px) scale(1.05)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

/* ---------- ranking ---------- */
.tier{border-radius:14.5px;border:1px solid var(--line);padding:13px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#17281f,#0b1512)}
.tier:after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(205,249,95,.10),transparent 70%)}
.tier .badge{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7.5px;border-radius:6.5px;font-size:9.5px;font-weight:900;letter-spacing:.08em}
.tier .rt{font-family:var(--mono);font-size:34.5px;font-weight:800;letter-spacing:-.08em;line-height:1;margin-top:7.5px}
.tier .rt small{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-left:7.5px;vertical-align:2px}
.tierp{height:5px;border-radius:3px;background:#1b2f24;margin-top:9.5px;overflow:hidden}
.tierp i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8ecf36,var(--lime));transition:width .3s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5.5px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8.5px 9.5px}
.gcard span{display:block;font-size:8.5px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.gcard b{display:block;font-family:var(--mono);font-size:15.5px;font-weight:800;margin-top:1.5px;letter-spacing:-.04em}
.gcard small{display:block;font-size:9px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladder{display:flex;flex-direction:column;gap:3px}
.lad{display:flex;align-items:center;gap:6.5px;padding:6px 7.5px;border-radius:8px;background:rgba(15,26,22,.6);border:1px solid transparent}
.lad.on{background:#17291f;border-color:#31543c}
.lad .d{width:8px;height:8px;border-radius:50%}
.lad .n{flex:1 1 auto;min-width:0;font-size:10px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad .r{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.lad.on .r{color:var(--lime)}
.share{background:#0c1713;border:1px dashed var(--line2);border-radius:10px;padding:8.5px 9.5px;font-size:9.5px;line-height:1.7;
  color:#b9cdc2;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}

/* ---------- 26/27 리그 · 순위표 ---------- */
.seg.two{grid-template-columns:1fr 1fr}
.stbl{display:flex;flex-direction:column;gap:2px;padding:5px 6px;border-radius:11px;border:1px solid var(--line);
  background:rgba(11,21,18,.6)}
.stbl > div{display:grid;grid-template-columns:17px minmax(0,1fr) 23px 16px 16px 16px 29px 25px;gap:2.5px;align-items:center;
  padding:3.5px 2.5px;border-radius:6.5px;min-width:0}
.stbl .sth{padding:0 2.5px 4px;border-bottom:1px solid var(--line);border-radius:0}
.stbl .sth span{font-size:8px;font-weight:800;letter-spacing:.02em;color:var(--dim);text-align:center;white-space:nowrap}
.stbl .sth span:nth-child(2){text-align:left}
.stbl .str span{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--sub);text-align:center}
.stbl .str .rk{font-size:9px;color:var(--dim)}
.stbl .str .nm{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:-.03em;color:#dceee2;
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbl .str b{font-family:var(--mono);font-size:9.5px;font-weight:900;color:var(--ink);text-align:center}
.stbl .str .gdp{color:var(--lime)}
.stbl .str .gdn{color:var(--red)}
.stbl .str.top .rk{color:var(--gold)}
.stbl .str.me{background:rgba(205,249,95,.1);box-shadow:inset 0 0 0 1px rgba(205,249,95,.28)}
.stbl .str.me .nm,.stbl .str.me b{color:var(--lime)}
.opp.mine{border-color:#3d6a3a;background:linear-gradient(100deg,#17281a,#0d1713)}

/* ---------- 리그 업그레이드 · 레전드 컵 업그레이드 ---------- */
.scrbox{display:flex;flex-direction:column;gap:2px;padding:5px 6px;border-radius:11px;border:1px solid var(--line);background:rgba(11,21,18,.6)}
.scrbox > div{display:grid;grid-template-columns:17px minmax(0,1fr) 22px 34px;gap:3px;align-items:center;padding:3.5px 2.5px;border-radius:6.5px;min-width:0}
.scrbox .sch{padding:0 2.5px 4px;border-bottom:1px solid var(--line)}
.scrbox .sch span{font-size:8px;font-weight:800;color:var(--dim);text-align:center}
.scrbox .sch span:nth-child(2){text-align:left}
.scrbox .rk{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center}
.scrbox .nm{font-size:9.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dceee2;min-width:0}
.scrbox .nm i{font-style:normal;font-size:8.5px;color:var(--dim);font-weight:700;margin-left:4px}
.scrbox b{font-family:var(--mono);font-size:9.5px;font-weight:900;text-align:center;color:var(--ink)}
.scrbox .rt{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--sub);text-align:right}
.scrbox .scr.me{background:rgba(205,249,95,.1);box-shadow:inset 0 0 0 1px rgba(205,249,95,.24)}
.scrbox .scr.me .nm,.scrbox .scr.me b{color:var(--lime)}
.joker{border:1px solid rgba(255,180,58,.34);background:linear-gradient(160deg,rgba(255,180,58,.08),rgba(255,180,58,.015));border-radius:12.5px;padding:9.5px 10px}
.jrow{display:flex;flex-direction:column;gap:4px}
.jcand{display:flex;align-items:center;gap:5.5px;padding:7px 7.5px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);width:100%;text-align:left;min-width:0}
.jcand .ps{flex:0 0 auto;width:22px;font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--dim)}
.jcand .nm{flex:1 1 auto;min-width:0;font-size:10px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jcand .nm i{font-style:normal;font-size:8.5px;color:var(--dim);margin-left:4px}
.jcand b{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:900;color:var(--amber)}
.jcand .go{flex:0 0 auto;font-size:9.5px;font-weight:900;color:#0a120c;background:var(--amber);border-radius:6.5px;padding:2.5px 6px}
.jkb{display:flex;align-items:center;gap:7px;padding:8.5px 9.5px;border-radius:11px;border:1px solid rgba(255,180,58,.4);background:linear-gradient(110deg,rgba(255,180,58,.14),rgba(255,180,58,.02))}
.jkb .ic{flex:0 0 auto;width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:rgba(255,180,58,.16);border:1px solid rgba(255,180,58,.35)}
.jkb .tx{flex:1 1 auto;min-width:0}
.jkb .tx b{display:block;font-size:10.5px;font-weight:900;letter-spacing:-.02em}
.jkb .tx span{display:block;font-size:9px;color:var(--sub);margin-top:1.5px}
.bigm{display:flex;align-items:center;gap:5px;margin-top:7px;padding:6px 7.5px;border-radius:8px;border:1px solid rgba(255,92,69,.5);background:linear-gradient(100deg,rgba(255,92,69,.18),rgba(255,180,58,.05));font-size:9.5px;font-weight:900;letter-spacing:-.02em;color:#ffb9a8}
.bnrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.bnrow span{font-size:8.5px;font-weight:800;letter-spacing:-.02em;color:#dff9a6;background:rgba(205,249,95,.1);border:1px solid rgba(205,249,95,.28);border-radius:6.5px;padding:2.5px 6px}
.magic{margin-top:7.5px;padding:7.5px 9.5px;border-radius:10px;border:1px solid rgba(205,249,95,.4);background:linear-gradient(100deg,rgba(205,249,95,.14),rgba(205,249,95,.02));font-size:9.5px;font-weight:800;letter-spacing:-.02em;color:#dff9a6}
.magic b{font-family:var(--mono);font-size:11px;color:var(--lime)}
.magic.champ{border-color:rgba(245,201,106,.55);background:linear-gradient(100deg,rgba(245,201,106,.18),rgba(245,201,106,.03));color:#ffe3ad}
.magic.chase{border-color:rgba(99,215,255,.4);background:linear-gradient(100deg,rgba(99,215,255,.12),rgba(99,215,255,.02));color:#bfeeff}
.tprev{display:flex;align-items:flex-start;gap:5.5px;margin-top:7px;padding:6px 7.5px;border-radius:9px;border:1px solid rgba(255,180,58,.3);background:rgba(255,180,58,.06)}
.tprev .ic{flex:0 0 auto;font-size:13px;line-height:1.2}
.tprev .tx{flex:1 1 auto;min-width:0}
.tprev b{display:block;font-size:9.5px;font-weight:900;letter-spacing:-.02em;color:#ffd79a}
.tprev span{display:block;font-size:9px;color:var(--sub);margin-top:1px;line-height:1.45}
.tprev small{display:block;font-size:9px;font-weight:900;color:var(--lime);margin-top:1.5px}

/* ---------- sheet / toast ---------- */

.sheet{width:100%;max-height:86%;overflow-y:auto;background:#0e1a15;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  padding:13px 13px calc(15px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}

/* ---------- DesignBookmark polish · 촉감형 마이크로 인터랙션 오버레이 ----------
   1px 헤어라인 보더 + 은은한 상단 하이라이트 + 스프링 press + 플로팅 러버 독.
   그린/라임 팔레트와 기능은 그대로, 층위와 촉감만 한 단계 올린다. */
:root{
  --spring:cubic-bezier(0.34, 1.56, 0.64, 1);
  --hair:rgba(255,255,255,.08);
  --hl:rgba(255,255,255,.06);
}
/* 상단 바 · 헤어라인 */
.bar{border-bottom:1px solid rgba(255,255,255,.06);background:rgba(7,13,11,.86)}
/* 하단 네비게이션 — 플로팅 러버 독 캡슐 */
.tabs{height:var(--navh);margin:0 8px calc(env(safe-area-inset-bottom) + 6px);padding:4px;gap:2px;
  border:1px solid var(--hair);border-radius:23.5px;
  background:#0a1210;backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);
  box-shadow:0 14px 34px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.tab{border-radius:18px;transition:color .18s ease,transform .38s var(--spring),background .22s ease,box-shadow .22s ease}
.tab:active{transform:scale(.9);opacity:1}
.tab.on{background:rgba(205,249,95,.13);box-shadow:inset 0 0 0 1px rgba(205,249,95,.24),inset 0 1px 0 rgba(255,255,255,.07);
  animation:tabspring .42s var(--spring)}
@keyframes tabspring{0%{transform:scale(.84)}62%{transform:scale(1.05)}100%{transform:scale(1)}}
.tab.on:before{top:auto;bottom:3px;width:18px;animation:indspring .42s var(--spring)}
@keyframes indspring{0%{transform:translateX(-50%) scaleX(.2);opacity:0}60%{transform:translateX(-50%) scaleX(1.15)}100%{transform:translateX(-50%) scaleX(1);opacity:1}}
.tab .badge{top:5px}
/* 스크롤 화면 — 부드러운 전환 */
@keyframes viewin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
main>*{animation:viewin .2s ease-out both}
/* 카드 · 보더 깊이감 — 1px 헤어라인 + 미세한 상단 inner highlight
   :where 로 특정도 0 → 상태용 box-shadow(활성 링·glow)를 건드리지 않는다 */
:where(.card,.mode,.cupcard,.cupick,.mrow,.gcard,.q,.brow,.tie,.srow,.opp,.bscol,.pick,.mv,.tacbtn,.fact,
  .stats3 div,.rewards div,.linesum div,.dstats div,.hpres>div,.path .pr,.gline,.att div,.bfrow span,.rental){
  box-shadow:inset 0 1px 0 var(--hl)}
:where(.card,.cupcard,.cupick,.mrow,.gcard,.q,.srow,.opp,.tie){border-color:var(--hair)}
.hero,.gr-hero,.teamhead,.up-head,.tier,.stage{box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.sheet{border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -18px 50px rgba(0,0,0,.5)}
.tag{background:rgba(255,255,255,.055)}
/* 버튼 · 칩 · 카드 — 스프링 press */
.btn{transition:transform .35s var(--spring),filter .2s ease,box-shadow .25s ease}
.btn:active{transform:scale(.96);filter:brightness(1.06)}
.btn.primary{box-shadow:0 6px 20px rgba(180,235,60,.16),inset 0 1px 0 rgba(255,255,255,.55)}
.chip{transition:transform .35s var(--spring),background .18s ease,border-color .18s ease,color .18s ease}
.chip:active{transform:scale(.95)}
.pick{transition:transform .35s var(--spring),border-color .18s ease,background .2s ease}
.pick:active{transform:scale(.975)}
.mv{transition:transform .35s var(--spring),border-color .18s ease}
.mv:active{transform:scale(.96)}
.mode,.mrow,.cupick,.cupcard,.brow,.q,.tie{transition:transform .35s var(--spring),border-color .2s ease}
.mode:active,.mrow:active,.cupick:active{transform:scale(.982)}
.gchip,.tacbtn,.up,.q-claim{transition:transform .35s var(--spring),background .18s ease,border-color .18s ease,color .18s ease}
.gchip:active,.tacbtn:active,.up:active,.q-claim:active{transform:scale(.94)}
button.pill{transition:transform .35s var(--spring),box-shadow .25s ease}
button.pill:active{transform:scale(.93)}
.gr-go{transition:transform .35s var(--spring),box-shadow .25s ease}
.gr-go:active{transform:scale(.965)}
.gr-go:disabled{transform:none}
.tab:disabled,.btn:disabled,.chip:disabled,.mv:disabled,.pick:disabled,.gchip:disabled{transform:none}
/* Springy input — 검색창(버프 탭) · 가져오기 textarea */
.srch,.impbox{border-radius:11.5px;border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.045);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .2s ease,box-shadow .3s var(--spring),background .2s ease}
.srch:focus,.impbox:focus{outline:none;border-color:rgba(205,249,95,.6);
  box-shadow:0 0 0 3.5px rgba(205,249,95,.13),inset 0 1px 0 rgba(255,255,255,.06);background:rgba(205,249,95,.04)}
/* 배틀 카드 · 대진표 위계 다듬기 */
.bcard{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 22px rgba(0,0,0,.3)}
.tie{border-radius:11px}
.cupvs{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 26px rgba(0,0,0,.3)}
.honor,.cuptro{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
@media (prefers-reduced-motion:reduce){.tab.on{animation:none}.tab.on:before{animation:none}main>*{animation:none}}
/* ============ 게시판형 3열 그리드 — 목록형 선택 UI 공통 ============ */
.modegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.modegrid .mode{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:8px 7px;border-radius:11px;min-width:0}

.modegrid .mode .ttl{font-size:10px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin-top:3px;overflow-wrap:anywhere}

.modegrid .mode .rw{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}

.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}

.qgrid .q .q-row{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.qgrid .q .qi{width:100%;min-width:0}
.qgrid .q .qi b{font-size:9.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere}
.qgrid .q .qi span{font-size:7.5px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.qgrid .q .q-bar{margin-top:3px}
.qgrid .q .q-claim{width:100%;min-width:0;height:30px;font-size:9.5px;border-radius:7px;margin-top:auto}
.qgrid .q .q-claim.done{font-size:8.5px}
.slist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.slist .srow{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 7px 6.5px;border-radius:10px;min-width:0}
.slist .srow .nm{flex:0 0 auto;width:100%}
.slist .srow .nm > b{font-size:9.5px}
.slist .srow .nm span{font-size:7.5px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.slist .srow .tr{margin-top:3px}

/* ---------- player math ---------- */
function baseStats(inst){
  const sp = posOf(inst.i), g = grp(sp), o = baseOf(inst), w = WEIGHTS[g];
  const raw = OFFS[g].map(v => o + v);
  const wsum = raw.reduce((s,v,k) => s + v*w[k], 0);

  return raw.map(v => Math.max(25, Math.round(v - delta)));
}
function bufLvOf(inst){ return (S.buf && S.buf[grp(posOf(inst.i))]) || 0; }
function pbufOf(inst){ return Math.max(0, Math.round(+(((S.pbuf || {})[String(inst.i)])) || 0)); }
function tbufOf(inst){
  const c = P[inst.i] ? P[inst.i][1] : '';

  return Math.min(TBUF_MAX, Math.max(0, Math.round(+v || 0)));

}
function statsOf(inst){

}
/* 1대1 키우기는 포지션 버프·강화만 — 팀컬러·선수 버프는 11대11 전용 */

/* 피치 안 도트 줄(row)을 실제 높이 기준으로 균등 배치 — 어떤 포메이션이든 원·라벨이 겹치지 않는다 */
const PDOT_R = 13.5, PDOT_LB = 32;
function layoutPitch(){
  const el = document.querySelector('.pitch');
  if(!el) return;
  const H = el.clientHeight;
  if(!H) return;
  const rows = [];
  el.querySelectorAll('.pdot').forEach(d => {
    const y = +d.dataset.y || 0;
    let r = null;
    rows.forEach(x => { if(Math.abs(x.y - y) <= 6.5 && (!r || Math.abs(x.y - y) < Math.abs(r.y - y))) r = x; });
    if(!r){ r = {y, n:0, items:[]}; rows.push(r); }
    r.n += 1; r.y += (y - r.y) / r.n; r.items.push(d);
  });
  rows.sort((a, b) => a.y - b.y);
  const top = PDOT_R + 2, bot = PDOT_R + PDOT_LB - 2;
  const gap = rows.length > 1 ? (H - top - bot) / (rows.length - 1) : 0;
  el.classList.toggle('tight', gap < 46);
  const W = 58, pw = el.clientWidth || 370;
  rows.forEach((r, i) => {
    const cy = rows.length > 1 ? top + gap * i : (H - bot + top) / 2;
    r.items.forEach(d => { d.style.top = Math.round(cy - PDOT_R) + 'px'; });
    /* 같은 줄 안에서 원·이름 상자가 붙지 않도록 좌우로 살짝 밀어내고 피치 안으로 붙잡는다 */
    const items = r.items.map(d => ({d, x: (+String(d.style.left).replace('%','') || 0) / 100 * pw}));
    items.sort((a, b) => a.x - b.x);
    for(let k = 1; k < items.length; k++) if(items[k].x - items[k-1].x < W) items[k].x = items[k-1].x + W;
    const limit = pw - W / 2 - 2;
    let over = items.length ? items[items.length - 1].x - limit : 0;
    if(over > 0) items.forEach(it => { it.x -= over; });
    let under = items.length ? W / 2 + 2 - items[0].x : 0;
    if(under > 0) items.forEach(it => { it.x += under; });
    items.forEach(it => { it.d.style.left = Math.round(it.x / pw * 1000) / 10 + '%'; });
  });
}
function slotOrder(f){
  const idx = FORMS[f].map((s,i)=>i);
  const order = ['GK','DF','MF','FW'];
  return idx.sort((a,b) => order.indexOf(grp(FORMS[f][a][0])) - order.indexOf(grp(FORMS[f][b][0])) || a-b);
}
function sampleOptions(f, slotIdx, taken){
  const role = FORMS[f][slotIdx][0];
  const used = new Set(taken);
  const all = P.map((p,i)=>i).filter(i => !used.has(i));
  const exact = all.filter(i => posOf(i) === role || (role==='ST'&&posOf(i)==='SS'));
  const near = all.filter(i => NEAR[role].includes(posOf(i)));
  const group = all.filter(i => grp(posOf(i)) === grp(role));
  const chosen = [];
  pickBiased(exact, DRAFT_OPTS - chosen.length, chosen);
  if(chosen.length < DRAFT_OPTS) pickBiased(near, DRAFT_OPTS - chosen.length, chosen);
  if(chosen.length < DRAFT_OPTS) pickBiased(group, DRAFT_OPTS - chosen.length, chosen);
  /* 티켓 부스트 — 좋아요 선수를 확률만큼 후보에 끌어올린다 */
  injectFavs(chosen, role);
  /* 최종 적용 OVR(기본+포지션+팀컬러+선수 버프) 높은 순으로 정렬 */
  return chosen.slice(0, DRAFT_OPTS).map(i => ({i, b: rollBase(i), c: rollCond()}))
    .sort((a, b) => ovrOf(b) - ovrOf(a) || b.b - a.b);
}
/* ---------- 좋아요 선수 + 티켓 등장 부스트 ---------- */
function favIds(){ return (S.favs || []).filter(i => i >= 0 && i < P.length); }
function isFav(i){ return favIds().indexOf(i) >= 0; }
/* 지금 유효한 부스트 단계 — 드래프트 중이면 그 드래프트에 묶인 단계 */
function favBoostLv(){
  if(S.draft && typeof S.draft.fb === 'number') return clamp(Math.round(S.draft.fb), 0, 3);
  return clamp(Math.round(+S.favB || 0), 0, 3);
}
function favBoostOf(){ return FAV_B[favBoostLv()] || FAV_B[0]; }
function injectFavs(chosen, role){
  const p = favBoostOf().p;
  if(p <= 0) return;
  const favs = favIds();
  if(!favs.length) return;
  const favSet = new Set(favs);
  const poss = favs.filter(i => posOf(i) === role || (role === 'ST' && posOf(i) === 'SS')
    || NEAR[role].includes(posOf(i)) || grp(posOf(i)) === grp(role));
  if(!poss.length) return;
  for(let k = 0; k < DRAFT_OPTS; k++){
    if(Math.random() >= p) continue;
    const pool = poss.filter(i => chosen.indexOf(i) < 0);
    if(!pool.length) return;
    const ex = pool.filter(i => posOf(i) === role || (role === 'ST' && posOf(i) === 'SS'));
    const nr = pool.filter(i => NEAR[role].includes(posOf(i)));
    const cand = ex.length ? ex : nr.length ? nr : pool;
    const v = pick(cand);
    let at = -1;
    for(let j = chosen.length - 1; j >= 0; j--) if(!favSet.has(chosen[j])){ at = j; break; }
    if(at >= 0) chosen[at] = v;
    else if(chosen.length < DRAFT_OPTS) chosen.push(v);
    else return;
  }
}
function pickBiased(list, k, out){
  const pool = list.filter(i => !out.includes(i));
  for(let n=0; n<k && pool.length; n++){
    const sorted = pool.slice().sort((a,b) => baseOvrOf(b) - baseOvrOf(a));
    const idx = Math.min(sorted.length-1, Math.floor(Math.pow(Math.random(), 1.55) * sorted.length));
    const v = sorted[idx];
    out.push(v); pool.splice(pool.indexOf(v), 1);
  }
}
function bandOfSquad(squad){
  if(!squad || !squad.length) return null;
  const bs = squad.map(x => baseOf(x));
  if(bs.every(v => v >= 70 && v <= 79)) return '70';
  if(bs.every(v => v >= 80 && v <= 89)) return '80';
  if(bs.every(v => v >= 90)) return '90';
  return null;
}
function choosePick(opt){
  const d = S.draft; if(!d || !opt) return;
  const minB = d.opts.reduce((m,o) => Math.min(m, o.b), 99);
  if(opt.b === minB) d.low = (d.low || 0) + 1;
  d.picks.push({i:opt.i, b:opt.b, c:opt.c});
  if(d.picks.length >= 11){
    S.squad = d.picks.map(p => ({i:p.i, b:p.b, c:p.c}));
    S.formation = d.f;
    S.squadInfo = {low: d.low || 0, band: bandOfSquad(S.squad)};
    S.draft = null;
    S.squad.forEach(updateBest);
    updateBestTeam();
    U.sel = -1;
    save();
    U.tab = 'stadium';
    render();
    toast('임대 스쿼드 완성 · 1경기만 뛸 수 있습니다');
    return;
  }
  d.opts = sampleOptions(d.f, d.picks.length, d.picks.map(p=>p.i));
  save(); render();
}
function currentRole(d){
  const order = slotOrder(d.f);
  return FORMS[d.f][d.picks.length][0];
}

/* ---------- coins ---------- */
function addCoins(n){ S.coins = Math.max(0, S.coins + n); save(); paintHud(); }
function spendCoins(n){ if(S.coins < n) return false; S.coins -= n; save(); paintHud(); return true; }
/* 패스 티켓 */
function ticketCount(){ return Math.max(0, Math.round(+(S.tickets || 0))); }
function addTickets(n){ S.tickets = Math.max(0, Math.min(999, ticketCount() + Math.round(n || 0))); save(); paintHud(); }
function spendTickets(n){
  if(ticketCount() < n){ toast('패스 티켓이 ' + (n - ticketCount()) + '장 부족합니다'); return false; }
  S.tickets = ticketCount() - n; save(); paintHud(); return true;
}

/* ---------- 포지션별 영구 버프 ---------- */
function buyBuf(k, n){
  if(BUF_KEYS.indexOf(k) < 0) return;
  const L = S.buf[k] || 0;
  const price = bufCostN(L, n);
  if(S.coins < price){ toast('코인이 ' + fmt(price - S.coins) + ' 부족합니다'); return; }
  S.coins -= price;
  S.buf[k] = L + n;
  ensureQuests(); questAdd('buff', n);
  save(); paintHud(); renderBuff(true);
  toast(k + ' 버프 Lv.' + S.buf[k] + ' · ' + k + ' 전 스탯 +' + S.buf[k]);
  popFx('Lv.' + S.buf[k]);
}

/* ---------- 친구 대결 초대 (URL 해시) ---------- */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(str){
  let t = String(str || '').replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function inviteURL(squadArg, formArg){
  const sq = squadArg || S.squad, f = formArg || S.formation;
  if(!sq || !f) return '';
  const payload = {v:1, c:S.code, f, p:sq.map(x => [x.i, baseOf(x), (typeof x.c === 'number' ? x.c : 0), (x.lv || 0)]), b:BUF_KEYS.map(k => S.buf[k] || 0)};
  return location.origin + location.pathname + '#vs=' + b64e(JSON.stringify(payload));
}
function parseInvite(hash){
  const h = String(hash || '');
  const m = h.match(/[#&?]vs=([A-Za-z0-9_-]+)/);
  if(!m) return null;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o || !FORMS[o.f] || !Array.isArray(o.p) || o.p.length !== 11) return null;
    const p = o.p.map(v => Array.isArray(v) ? [Number(v[0]), Math.round(Number(v[1])), Math.round(Number(v[2])), Math.round(Number(v[3]))] : [Number(v), null, 0, 0]);
    if(p.some(x => !(x[0] >= 0 && x[0] < P.length))) return null;
    if(new Set(p.map(x => x[0])).size !== 11) return null;
    const b = {};
    BUF_KEYS.forEach((k, i) => { b[k] = Math.max(0, Math.min(9999, Math.round(+((o.b || [])[i]) || 0))); });
    const c = String(o.c || '').replace(/\D/g,'').slice(0,6);
    return {code: c || '000000', f: o.f,
      p: p.map(x => ({i:x[0], b: (x[1] == null || !isFinite(x[1])) ? baseOvrOf(x[0]) : Math.max(40, Math.min(140, x[1])),
        c: isFinite(x[2]) ? Math.max(-2, Math.min(2, x[2])) : 0,
        lv: isFinite(x[3]) ? Math.max(0, Math.min(99, x[3])) : 0})), b};
  }catch(e){ return null; }
}
function aceInviteURL(){
  const cur = growCur();
  if(!cur) return '';
  const inst = {i:cur.i, b:baseOvrOf(cur.i), lv:growLv(), c:0};
  const payload = {v:1, k:'grow1v1', c:S.code, i:cur.i, lv:growLv(), o:Math.round(ovrGrow(inst))};
  return location.origin + location.pathname + '#ace=' + b64e(JSON.stringify(payload));
}
function parseAceInvite(hash){
  const m = String(hash || '').match(/[#&?]ace=([A-Za-z0-9_-]+)/);
  if(!m) return null;
  try{
    const o = JSON.parse(b64d(m[1]));
    if(!o || !(o.i >= 0 && o.i < P.length)) return null;
    const lv = Math.max(0, Math.min(GROW_MAX, Math.round(+o.lv || 0)));
    return {code:String(o.c || '').replace(/\D/g, '').slice(0, 6) || '000000', i:o.i, name:P[o.i][0],
      role:posOf(o.i), lv, ovr:Math.max(40, Math.min(140, Math.round(+o.o || 0))), cond:0};
  }catch(e){ return null; }
}
function copyInvite(){
  const url = inviteURL();
  if(!url){ toast('임대 스쿼드가 있을 때 초대 링크를 만들 수 있습니다'); return; }
  copyText(url).then(() => toast('친구 대결 초대 링크를 복사했습니다'), () => toast('복사 실패'));
}
function ovrWith(inst, buf){
  const g = grp(posOf(inst.i)), add = ((buf && buf[g]) || 0) + (inst.lv || 0) * GROW_STEP, w = WEIGHTS[g];
  return baseStats(inst).reduce((s,v,k) => s + (v + add) * w[k], 0);
}
function opponentFromInvite(inv){
  const f = inv.f;
  const entries = inv.p.map((pi, idx) => {
    const inst = (pi && typeof pi === 'object') ? {i:pi.i, b:pi.b, c:pi.c, lv:pi.lv} : {i:pi};
    const slot = FORMS[f][idx] || ['CM',50,50], fit = fitOf(inst, slot[0]);
    return {inst, role:slot[0], fit, ovr: Math.round(ovrWith(inst, inv.b)) - (fit ? 0 : 3), c:(typeof inst.c === 'number' ? inst.c : 0)};
  });
  const t = aggregate(entries);
  return {club:'초대 XI #' + inv.code, league:'INVITE', base:t.ovr, att:t.att, mid:t.mid, def:t.def,
    xi: entries.map(e => [P[e.inst.i][0], e.role]), invite:true, inviteCode:inv.code};
}
