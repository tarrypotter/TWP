":"## 개요\n매독균(트레포네마)이 일으키는 성매개 감염입니다.\n\n## 원인과 위험 요인\n성 접촉과 임신 중 태아로 전파됩니다.\n\n## 주요 증상\n통증 없는 궤양(1기), 발진(2기), 오랜 잠복 후 심장·신경 손상(3기).\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sexually transmitted infection caused by Treponema pallidum.\n\n## Causes and risk factors\nSpread sexually and from mother to fetus.\n\n## Key symptoms\nPainless sore (primary), rash (secondary) and, after latency, heart and nerve damage (tertiary).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299873000,"updated":1794299873000},{"id":"dz-gonorrhea","kind":"disease","category":"세균 감염","title_ko":"임질","title_orig":"Gonorrhoea","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gonorrhoea","tags":["질병 백과","성매개","항생제 내성"],"body_ko":"## 개요\n임균이 일으키는 성매개 감염으로 항생제 내성이 문제입니다.\n\n## 원인과 위험 요인\n성 접촉으로 전파됩니다.\n\n## 주요 증상\n요도 분비물, 소변 시 통증. 여성은 증상이 없는 경우가 많고 골반염·난임이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sexually transmitted infection by Neisseria gonorrhoeae, with growing antibiotic resistance.\n\n## Causes and risk factors\nSpread through sexual contact.\n\n## Key symptoms\nUrethral discharge and painful urination; women are often symptomless and risk pelvic inflammatory disease and infertility.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299872000,"updated":1794299872000},{"id":"dz-chlamydia","kind":"disease","category":"세균 감염","title_ko":"클라미디아 감염","title_orig":"Chlamydia infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chlamydia%20infection","tags":["질병 백과","성매개"],"body_ko":"## 개요\n가장 흔한 세균성 성매개 감염입니다.\n\n## 원인과 위험 요인\n성 접촉으로 전파됩니다.\n\n## 주요 증상\n대부분 증상이 없고, 분비물·배뇨통이 생깁니다. 치료하지 않으면 난임이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common bacterial sexually transmitted infection.\n\n## Causes and risk factors\nSpread through sexual contact.\n\n## Key symptoms\nMostly silent; may cause discharge or painful urination; untreated it can cause infertility.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299871000,"updated":1794299871000},{"id":"dz-scrub","kind":"disease","category":"세균 감염","title_ko":"쯔쯔가무시증","title_orig":"Scrub typhus","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Scrub%20typhus","tags":["질병 백과","진드기","한국"],"body_ko":"## 개요\n털진드기 유충이 옮기는 오리엔티아균 감염으로, 한국에서 가을에 많이 발생합니다.\n\n## 원인과 위험 요인\n풀밭 작업, 등산, 성묘 중 털진드기에 물려 감염됩니다.\n\n## 주요 증상\n고열, 두통, 발진, 물린 자리의 검은 딱지(가피).\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn Orientia infection spread by chigger mites, common in Korea in autumn.\n\n## Causes and risk factors\nCaught from chigger bites during fieldwork, hiking or visiting graves.\n\n## Key symptoms\nHigh fever, headache, rash and a black scab (eschar) at the bite site.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299870000,"updated":1794299870000},{"id":"dz-lepto","kind":"disease","category":"세균 감염","title_ko":"렙토스피라증","title_orig":"Leptospirosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Leptospirosis","tags":["질병 백과","동물","홍수"],"body_ko":"## 개요\n렙토스피라균이 일으키는 동물 매개 감염입니다.\n\n## 원인과 위험 요인\n쥐 등 동물의 소변에 오염된 물이나 흙에 피부가 닿아 감염되며, 홍수·논일 후 많습니다.\n\n## 주요 증상\n고열, 근육통(특히 종아리), 결막 충혈. 중증이면 황달·콩팥 손상·폐출혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA zoonotic infection caused by Leptospira bacteria.\n\n## Causes and risk factors\nCaught through skin contact with water or soil contaminated by animal (often rat) urine, especially after floods or rice farming.\n\n## Key symptoms\nHigh fever, muscle pain (especially calves) and red eyes; severe cases bring jaundice, kidney failure or lung bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299869000,"updated":1794299869000},{"id":"dz-leprosy","kind":"disease","category":"세균 감염","title_ko":"한센병","title_orig":"Leprosy (Hansen's disease)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Leprosy","tags":["질병 백과","피부","신경"],"body_ko":"## 개요\n나균이 피부와 말초신경을 침범하는 만성 감염입니다.\n\n## 원인과 위험 요인\n오랜 밀접 접촉으로 비말을 통해 전파되며 전염력은 낮습니다. 다제 병합요법으로 완치됩니다.\n\n## 주요 증상\n감각이 둔한 피부 반점, 신경 비대, 손발 감각 소실.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic infection of skin and peripheral nerves by Mycobacterium leprae.\n\n## Causes and risk factors\nSpread by droplets after prolonged close contact, with low infectivity; curable with multidrug therapy.\n\n## Key symptoms\nNumb skin patches, thickened nerves and loss of sensation in hands and feet.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299868000,"updated":1794299868000},{"id":"dz-anthrax","kind":"disease","category":"세균 감염","title_ko":"탄저병","title_orig":"Anthrax","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Anthrax","tags":["질병 백과","동물"],"body_ko":"## 개요\n탄저균 포자가 일으키는 감염입니다.\n\n## 원인과 위험 요인\n감염된 가축이나 동물 제품과 접촉해 감염됩니다.\n\n## 주요 증상\n피부형은 검은 딱지 궤양, 흡입형은 심한 호흡기 증상과 쇼크.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection caused by Bacillus anthracis spores.\n\n## Causes and risk factors\nCaught from infected livestock or animal products.\n\n## Key symptoms\nCutaneous form causes a black eschar; inhalational form causes severe respiratory illness and shock.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299867000,"updated":1794299867000},{"id":"dz-plague","kind":"disease","category":"세균 감염","title_ko":"페스트","title_orig":"Plague","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Plague","tags":["질병 백과","설치류"],"body_ko":"## 개요\n페스트균이 일으키는 감염으로 역사적으로 흑사병을 일으켰습니다.\n\n## 원인과 위험 요인\n설치류의 벼룩에 물리거나 폐페스트 환자의 비말로 전파됩니다.\n\n## 주요 증상\n열, 매우 아픈 림프절 비대(가래톳), 폐렴, 패혈증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with Yersinia pestis, historically the Black Death.\n\n## Causes and risk factors\nSpread by fleas from rodents or droplets from people with pneumonic plague.\n\n## Key symptoms\nFever, very painful swollen lymph nodes (buboes), pneumonia and sepsis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299866000,"updated":1794299866000},{"id":"dz-botulism","kind":"disease","category":"세균 감염","title_ko":"보툴리눔 독소증","title_orig":"Botulism","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Botulism","tags":["질병 백과","식중독","독소"],"body_ko":"## 개요\n보툴리눔균 독소가 신경과 근육의 연결을 막아 마비를 일으키는 질환입니다.\n\n## 원인과 위험 요인\n잘못 만든 통조림·저장 식품, 영아는 꿀 섭취, 상처 감염으로 생깁니다.\n\n## 주요 증상\n눈꺼풀 처짐, 겹보임, 삼킴 곤란, 아래로 퍼지는 마비, 호흡 곤란.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nParalysis caused by Clostridium botulinum toxin blocking nerve–muscle signalling.\n\n## Causes and risk factors\nCaused by improperly preserved foods, honey in infants or wound infection.\n\n## Key symptoms\nDrooping eyelids, double vision, difficulty swallowing, descending paralysis and breathing failure.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299865000,"updated":1794299865000},{"id":"dz-legionella","kind":"disease","category":"세균 감염","title_ko":"레지오넬라증","title_orig":"Legionnaires' disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Legionnaires%27%20disease","tags":["질병 백과","폐렴","물"],"body_ko":"## 개요\n레지오넬라균이 일으키는 폐렴입니다.\n\n## 원인과 위험 요인\n냉각탑, 온수 시설, 분수 등에서 오염된 물 입자를 들이마셔 감염됩니다.\n\n## 주요 증상\n고열, 기침, 숨참, 설사, 혼란.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPneumonia caused by Legionella bacteria.\n\n## Causes and risk factors\nCaught by inhaling water droplets from contaminated cooling towers, hot water systems or fountains.\n\n## Key symptoms\nHigh fever, cough, breathlessness, diarrhoea and confusion.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299864000,"updated":1794299864000},{"id":"dz-cellulitis","kind":"disease","category":"세균 감염","title_ko":"봉와직염","title_orig":"Cellulitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cellulitis","tags":["질병 백과","피부"],"body_ko":"## 개요\n피부 깊은 층과 피하조직의 세균 감염입니다.\n\n## 원인과 위험 요인\n연쇄상구균과 포도알균이 상처, 무좀, 부종 부위를 통해 들어갑니다.\n\n## 주요 증상\n붉고 뜨겁고 아프게 부으며 퍼지는 피부, 열.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA bacterial infection of the deeper skin and subcutaneous tissue.\n\n## Causes and risk factors\nStreptococci and staphylococci enter through wounds, athlete's foot or swollen skin.\n\n## Key symptoms\nSpreading red, hot, painful swelling of the skin, with fever.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299863000,"updated":1794299863000},{"id":"dz-vibrio","kind":"disease","category":"세균 감염","title_ko":"비브리오 패혈증","title_orig":"Vibrio vulnificus infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Vibrio%20vulnificus%20infection","tags":["질병 백과","해산물","간"],"body_ko":"## 개요\n비브리오 불니피쿠스균이 일으키는 치명적인 감염으로, 한국에서 여름철 발생합니다.\n\n## 원인과 위험 요인\n날 해산물을 먹거나 상처가 바닷물에 닿아 감염되며 간질환자와 과음하는 사람에게 특히 위험합니다.\n\n## 주요 증상\n열, 오한, 다리의 물집과 피부 괴사, 쇼크.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA potentially fatal Vibrio vulnificus infection, seen in Korea in summer.\n\n## Causes and risk factors\nCaught from raw seafood or wounds exposed to seawater; especially dangerous with liver disease or heavy drinking.\n\n## Key symptoms\nFever, chills, blistering and skin necrosis on the legs, and shock.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299862000,"updated":1794299862000},{"id":"dz-listeria","kind":"disease","category":"세균 감염","title_ko":"리스테리아증","title_orig":"Listeriosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Listeriosis","tags":["질병 백과","식중독","임신"],"body_ko":"## 개요\n리스테리아균이 일으키는 식중독으로 임신부·신생아·노인·면역 저하자에게 위험합니다.\n\n## 원인과 위험 요인\n냉장 상태에서도 자라며 살균하지 않은 유제품, 가공육, 훈제 해산물로 감염됩니다.\n\n## 주요 증상\n열, 근육통, 설사. 수막염이나 유산·사산을 일으킬 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA foodborne infection by Listeria, dangerous for pregnant women, newborns, older adults and the immunocompromised.\n\n## Causes and risk factors\nGrows at fridge temperature; spread by unpasteurised dairy, deli meats and smoked seafood.\n\n## Key symptoms\nFever, muscle aches and diarrhoea; can cause meningitis, miscarriage or stillbirth.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299861000,"updated":1794299861000},{"id":"dz-mycoplasma","kind":"disease","category":"세균 감염","title_ko":"마이코플라스마 폐렴","title_orig":"Mycoplasma pneumoniae infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Mycoplasma%20pneumoniae%20infection","tags":["질병 백과","폐렴","소아"],"body_ko":"## 개요\n마이코플라스마균이 일으키는 비교적 가벼운 '비정형' 폐렴으로 소아·청소년에 흔합니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 몇 년 주기로 유행합니다.\n\n## 주요 증상\n오래가는 마른기침, 열, 두통, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA usually mild 'atypical' pneumonia caused by Mycoplasma pneumoniae, common in children and adolescents.\n\n## Causes and risk factors\nSpread by droplets, with epidemics every few years.\n\n## Key symptoms\nPersistent dry cough, fever, headache and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299860000,"updated":1794299860000},{"id":"dz-bv","kind":"disease","category":"여성 건강","title_ko":"세균성 질염","title_orig":"Bacterial vaginosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bacterial%20vaginosis","tags":["질병 백과","미생물","여성"],"body_ko":"## 개요\n질 안의 유산균이 줄고 다른 세균이 늘어나는 상태입니다.\n\n## 원인과 위험 요인\n질 세정, 새로운 성 파트너 등이 관련됩니다.\n\n## 주요 증상\n생선 비린내 나는 회색 분비물. 증상이 없기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn imbalance in which vaginal lactobacilli decline and other bacteria overgrow.\n\n## Causes and risk factors\nAssociated with douching and new sexual partners.\n\n## Key symptoms\nThin grey discharge with a fishy odour; may be symptomless.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299859000,"updated":1794299859000},{"id":"dz-candida","kind":"disease","category":"진균·기생충","title_ko":"칸디다증","title_orig":"Candidiasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Candidiasis","tags":["질병 백과","곰팡이"],"body_ko":"## 개요\n칸디다 곰팡이가 입안, 질, 피부, 혈액 등에 일으키는 감염입니다.\n\n## 원인과 위험 요인\n항생제, 당뇨병, 면역 저하, 흡입 스테로이드, 의치가 위험 요인입니다.\n\n## 주요 증상\n입안 흰 반점(아구창), 질 가려움과 흰 분비물, 겹치는 피부의 붉은 발진.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection by Candida yeasts of the mouth, vagina, skin or bloodstream.\n\n## Causes and risk factors\nRisk factors include antibiotics, diabetes, immunosuppression, inhaled steroids and dentures.\n\n## Key symptoms\nWhite patches in the mouth (thrush), vaginal itching with white discharge, and red rash in skin folds.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299858000,"updated":1794299858000},{"id":"dz-asperg","kind":"disease","category":"진균·기생충","title_ko":"아스페르길루스증","title_orig":"Aspergillosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Aspergillosis","tags":["질병 백과","곰팡이","폐"],"body_ko":"## 개요\n아스페르길루스 곰팡이가 주로 폐에 일으키는 질환입니다.\n\n## 원인과 위험 요인\n공기 중 포자를 들이마셔 생기며, 면역 저하자나 결핵·COPD 등 폐질환자에게 생깁니다.\n\n## 주요 증상\n기침, 객혈, 열, 천식 악화(알레르기형).\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDisease, mainly of the lungs, caused by Aspergillus moulds.\n\n## Causes and risk factors\nCaused by inhaled spores; affects immunocompromised people and those with lung disease such as old TB or COPD.\n\n## Key symptoms\nCough, coughing blood, fever or worsening asthma (allergic form).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299857000,"updated":1794299857000},{"id":"dz-tinea","kind":"disease","category":"진균·기생충","title_ko":"백선 (무좀)","title_orig":"Tinea (dermatophytosis)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Tinea","tags":["질병 백과","곰팡이","피부"],"body_ko":"## 개요\n피부사상균이 피부, 손발톱, 두피에 일으키는 곰팡이 감염입니다.\n\n## 원인과 위험 요인\n덥고 습한 환경, 공용 샤워실, 꽉 끼는 신발이 위험 요인입니다.\n\n## 주요 증상\n발가락 사이 가려움·각질·갈라짐, 둥근 붉은 반점, 두껍고 변색된 손발톱.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nFungal infection of skin, nails or scalp by dermatophytes.\n\n## Causes and risk factors\nFavoured by warm, moist conditions, shared showers and tight footwear.\n\n## Key symptoms\nItchy, scaly or cracked skin between toes, ring-shaped patches and thick discoloured nails.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299856000,"updated":1794299856000},{"id":"dz-crypto","kind":"disease","category":"진균·기생충","title_ko":"크립토코쿠스증","title_orig":"Cryptococcosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cryptococcosis","tags":["질병 백과","곰팡이","면역"],"body_ko":"## 개요\n크립토코쿠스 곰팡이가 폐와 뇌수막에 일으키는 감염입니다.\n\n## 원인과 위험 요인\n비둘기 배설물이 섞인 흙의 포자를 들이마셔 감염되며 HIV 등 면역 저하자에게 심합니다.\n\n## 주요 증상\n두통, 열, 목 경직, 기침.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of the lungs and meninges by Cryptococcus fungi.\n\n## Causes and risk factors\nCaught by inhaling spores from soil contaminated with bird droppings; severe in HIV and immunosuppression.\n\n## Key symptoms\nHeadache, fever, stiff neck and cough.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299855000,"updated":1794299855000},{"id":"dz-malaria","kind":"disease","category":"진균·기생충","title_ko":"말라리아","title_orig":"Malaria","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Malaria","tags":["질병 백과","모기","기생충"],"body_ko":"## 개요\n얼룩날개모기가 옮기는 말라리아 원충이 적혈구에 감염되는 질환입니다.\n\n## 원인과 위험 요인\n열대 지역에서 흔하며, 한국에서도 휴전선 근처에서 삼일열 말라리아가 발생합니다.\n\n## 주요 증상\n주기적인 오한·고열·땀, 두통, 빈혈. 열대열 말라리아는 치명적일 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of red blood cells by Plasmodium parasites transmitted by Anopheles mosquitoes.\n\n## Causes and risk factors\nCommon in the tropics; in Korea vivax malaria occurs near the DMZ.\n\n## Key symptoms\nCyclical chills, high fever and sweats, headache and anaemia; falciparum malaria can be fatal.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299854000,"updated":1794299854000},{"id":"dz-toxo","kind":"disease","category":"진균·기생충","title_ko":"톡소플라스마증","title_orig":"Toxoplasmosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Toxoplasmosis","tags":["질병 백과","기생충","임신"],"body_ko":"## 개요\n톡소포자충이라는 기생충에 감염되는 질환입니다.\n\n## 원인과 위험 요인\n덜 익힌 고기, 고양이 배설물로 오염된 흙·물로 감염됩니다.\n\n## 주요 증상\n대부분 증상이 없으나 임신 중 첫 감염은 태아에, 면역 저하자에게는 뇌에 해를 줄 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with the parasite Toxoplasma gondii.\n\n## Causes and risk factors\nCaught from undercooked meat or soil and water contaminated by cat faeces.\n\n## Key symptoms\nMostly silent, but a first infection in pregnancy can harm the fetus, and it can affect the brain in the immunocompromised.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299853000,"updated":1794299853000},{"id":"dz-ascaris","kind":"disease","category":"진균·기생충","title_ko":"회충증","title_orig":"Ascariasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ascariasis","tags":["질병 백과","기생충"],"body_ko":"## 개요\n회충이 장에 기생하는 질환입니다.\n\n## 원인과 위험 요인\n기생충 알에 오염된 흙·채소를 통해 감염됩니다.\n\n## 주요 증상\n대부분 가볍고, 많으면 복통, 장폐색, 영양 결핍.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nIntestinal infection with the roundworm Ascaris lumbricoides.\n\n## Causes and risk factors\nCaught from soil or vegetables contaminated with worm eggs.\n\n## Key symptoms\nUsually mild; heavy infection causes abdominal pain, bowel obstruction and malnutrition.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299852000,"updated":1794299852000},{"id":"dz-clonorch","kind":"disease","category":"진균·기생충","title_ko":"간흡충증","title_orig":"Clonorchiasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Clonorchiasis","tags":["질병 백과","기생충","민물고기"],"body_ko":"## 개요\n간흡충(간디스토마)이 담관에 기생하는 질환으로, 한국 강 유역에서 여전히 발생합니다.\n\n## 원인과 위험 요인\n민물고기를 날로 먹어 감염됩니다. 담도암의 원인입니다.\n\n## 주요 증상\n대부분 증상이 없고 오래되면 담관염, 담석, 담도암.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of the bile ducts with the liver fluke Clonorchis sinensis, still found along Korean rivers.\n\n## Causes and risk factors\nCaught by eating raw freshwater fish; a cause of bile duct cancer.\n\n## Key symptoms\nOften silent; long-term cholangitis, stones and bile duct cancer.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299851000,"updated":1794299851000},{"id":"dz-amoeba","kind":"disease","category":"진균·기생충","title_ko":"아메바 이질","title_orig":"Amoebiasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Amoebiasis","tags":["질병 백과","기생충","설사"],"body_ko":"## 개요\n이질아메바가 대장과 간에 감염되는 질환입니다.\n\n## 원인과 위험 요인\n오염된 물과 음식으로 전파됩니다.\n\n## 주요 증상\n피 섞인 설사, 복통. 간농양이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of the colon and liver by Entamoeba histolytica.\n\n## Causes and risk factors\nSpread through contaminated water and food.\n\n## Key symptoms\nBloody diarrhoea and abdominal pain; liver abscess can develop.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299850000,"updated":1794299850000},{"id":"dz-scabies","kind":"disease","category":"진균·기생충","title_ko":"옴","title_orig":"Scabies","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Scabies","tags":["질병 백과","피부","진드기"],"body_ko":"## 개요\n옴진드기가 피부에 굴을 파고 사는 질환입니다.\n\n## 원인과 위험 요인\n오래 피부를 맞대는 접촉으로 퍼지며 요양시설에서 집단 발생합니다.\n\n## 주요 증상\n밤에 심해지는 가려움, 손가락 사이·손목의 작은 굴과 발진.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSkin infestation by the burrowing mite Sarcoptes scabiei.\n\n## Causes and risk factors\nSpread by prolonged skin-to-skin contact; outbreaks occur in care homes.\n\n## Key symptoms\nIntense itching worse at night, with burrows and rash between fingers and on wrists.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299849000,"updated":1794299849000},{"id":"dz-pinworm","kind":"disease","category":"진균·기생충","title_ko":"요충증","title_orig":"Enterobiasis (pinworm)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Enterobiasis","tags":["질병 백과","기생충","소아"],"body_ko":"## 개요\n요충이 장에 기생하는 질환으로 어린이에게 흔합니다.\n\n## 원인과 위험 요인\n알이 손에 묻어 입으로 들어가 감염되고 가족 내에 퍼집니다.\n\n## 주요 증상\n밤에 항문 주위 가려움, 수면 방해.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nIntestinal infection with pinworms, common in children.\n\n## Causes and risk factors\nEggs pass from hands to mouth and spread within households.\n\n## Key symptoms\nItching around the anus at night and disturbed sleep.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299848000,"updated":1794299848000},{"id":"dz-trich","kind":"disease","category":"진균·기생충","title_ko":"트리코모나스증","title_orig":"Trichomoniasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Trichomoniasis","tags":["질병 백과","성매개","기생충"],"body_ko":"## 개요\n트리코모나스 원충이 일으키는 성매개 감염입니다.\n\n## 원인과 위험 요인\n성 접촉으로 전파됩니다.\n\n## 주요 증상\n거품 섞인 노란·초록 분비물, 가려움, 배뇨통. 증상이 없기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sexually transmitted infection by the parasite Trichomonas vaginalis.\n\n## Causes and risk factors\nSpread through sexual contact.\n\n## Key symptoms\nFrothy yellow-green discharge, itching and painful urination; may be silent.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299847000,"updated":1794299847000},{"id":"dz-asthma","kind":"disease","category":"호흡기","title_ko":"천식","title_orig":"Asthma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Asthma","tags":["질병 백과","알레르기","기도"],"body_ko":"## 개요\n기도에 만성 염증이 있어 기도가 예민하게 좁아지는 질환입니다.\n\n## 원인과 위험 요인\n아토피 체질, 유전, 집먼지진드기·꽃가루 등 알레르겐, 흡연, 대기오염, 바이러스 감염이 관여합니다.\n\n## 주요 증상\n쌕쌕거림, 숨참, 가슴 답답함, 밤이나 새벽에 심한 기침.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory airway disease with reversible airway narrowing.\n\n## Causes and risk factors\nLinked to atopy, genetics, allergens such as dust mites and pollen, smoking, air pollution and viral infections.\n\n## Key symptoms\nWheezing, breathlessness, chest tightness and night-time or early-morning cough.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299846000,"updated":1794299846000},{"id":"dz-copd","kind":"disease","category":"호흡기","title_ko":"만성 폐쇄성 폐질환 (COPD)","title_orig":"Chronic obstructive pulmonary disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chronic%20obstructive%20pulmonary%20disease","tags":["질병 백과","흡연","성인병"],"body_ko":"## 개요\n폐와 기도가 손상되어 숨길이 점점 좁아지는 진행성 질환입니다.\n\n## 원인과 위험 요인\n흡연이 가장 큰 원인이며 직업성 먼지, 실내 연료 연기, 대기오염도 원인입니다.\n\n## 주요 증상\n만성 기침과 가래, 점점 심해지는 숨참, 잦은 악화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA progressive disease of persistent airflow limitation from airway and lung damage.\n\n## Causes and risk factors\nSmoking is the main cause; occupational dust, indoor fuel smoke and air pollution also contribute.\n\n## Key symptoms\nChronic cough with sputum, worsening breathlessness and flare-ups.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299845000,"updated":1794299845000},{"id":"dz-bronchiect","kind":"disease","category":"호흡기","title_ko":"기관지확장증","title_orig":"Bronchiectasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bronchiectasis","tags":["질병 백과","기관지"],"body_ko":"## 개요\n기관지가 영구적으로 넓어져 가래가 고이고 감염이 반복되는 질환입니다.\n\n## 원인과 위험 요인\n이전 결핵·폐렴, 면역 결핍, 낭포성 섬유증이 원인입니다.\n\n## 주요 증상\n매일 나오는 많은 가래, 잦은 폐 감염, 객혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPermanent widening of the airways with mucus build-up and recurrent infection.\n\n## Causes and risk factors\nCaused by previous TB or pneumonia, immune deficiency or cystic fibrosis.\n\n## Key symptoms\nDaily copious sputum, frequent chest infections and coughing blood.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299844000,"updated":1794299844000},{"id":"dz-ipf","kind":"disease","category":"호흡기","title_ko":"특발성 폐섬유증","title_orig":"Idiopathic pulmonary fibrosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Idiopathic%20pulmonary%20fibrosis","tags":["질병 백과","폐"],"body_ko":"## 개요\n원인 모르게 폐에 흉터 조직이 생겨 점점 굳어지는 질환입니다.\n\n## 원인과 위험 요인\n나이, 남성, 흡연, 일부 유전자, 위식도역류와 관련됩니다.\n\n## 주요 증상\n서서히 심해지는 숨참, 마른기침, 손가락 곤봉.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nProgressive scarring of the lungs of unknown cause.\n\n## Causes and risk factors\nAssociated with age, male sex, smoking, certain genes and reflux.\n\n## Key symptoms\nGradually worsening breathlessness, dry cough and finger clubbing.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299843000,"updated":1794299843000},{"id":"dz-osa","kind":"disease","category":"호흡기","title_ko":"폐쇄성 수면무호흡","title_orig":"Obstructive sleep apnoea","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Obstructive%20sleep%20apnoea","tags":["질병 백과","수면","비만"],"body_ko":"## 개요\n잘 때 목의 기도가 반복해서 막혀 숨이 멈추는 질환입니다.\n\n## 원인과 위험 요인\n비만, 큰 편도, 짧은 턱, 음주, 나이, 남성이 위험 요인입니다.\n\n## 주요 증상\n심한 코골이, 수면 중 숨 멈춤, 낮 졸림, 아침 두통. 고혈압과 심방세동 위험을 높입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nRepeated collapse of the upper airway during sleep causing pauses in breathing.\n\n## Causes and risk factors\nRisk factors include obesity, large tonsils, small jaw, alcohol, age and male sex.\n\n## Key symptoms\nLoud snoring, witnessed pauses, daytime sleepiness and morning headache; raises hypertension and atrial fibrillation risk.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299842000,"updated":1794299842000},{"id":"dz-pneumothorax","kind":"disease","category":"호흡기","title_ko":"기흉","title_orig":"Pneumothorax","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pneumothorax","tags":["질병 백과","폐"],"body_ko":"## 개요\n폐와 흉벽 사이에 공기가 차서 폐가 쪼그라드는 상태입니다.\n\n## 원인과 위험 요인\n키 크고 마른 젊은 남성, 흡연, 기저 폐질환, 외상이 원인입니다.\n\n## 주요 증상\n갑작스러운 한쪽 가슴 통증과 숨참.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAir in the pleural space causing lung collapse.\n\n## Causes and risk factors\nOccurs in tall thin young men, smokers, people with lung disease or after trauma.\n\n## Key symptoms\nSudden one-sided chest pain and breathlessness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299841000,"updated":1794299841000},{"id":"dz-sarcoid","kind":"disease","category":"호흡기","title_ko":"사르코이드증","title_orig":"Sarcoidosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sarcoidosis","tags":["질병 백과","면역","폐"],"body_ko":"## 개요\n폐 등 여러 장기에 육아종이라는 염증 덩어리가 생기는 원인 불명 질환입니다.\n\n## 원인과 위험 요인\n유전적 소인과 환경 자극에 대한 면역 반응으로 추정됩니다.\n\n## 주요 증상\n기침, 숨참, 피로, 피부 결절, 눈 염증. 증상 없이 발견되기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA disease of unknown cause with granulomas in the lungs and other organs.\n\n## Causes and risk factors\nThought to be an immune response to environmental triggers in genetically susceptible people.\n\n## Key symptoms\nCough, breathlessness, fatigue, skin nodules and eye inflammation; may be found incidentally.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299840000,"updated":1794299840000},{"id":"dz-ards","kind":"disease","category":"호흡기","title_ko":"급성 호흡곤란 증후군","title_orig":"Acute respiratory distress syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20respiratory%20distress%20syndrome","tags":["질병 백과","응급","폐"],"body_ko":"## 개요\n폐에 광범위한 염증과 체액이 차서 산소 교환이 심하게 떨어지는 상태입니다.\n\n## 원인과 위험 요인\n폐렴, 패혈증, 흡인, 외상, 췌장염이 원인입니다.\n\n## 주요 증상\n빠르게 심해지는 숨참과 저산소증, 인공호흡이 필요할 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nWidespread lung inflammation and fluid causing severe failure of oxygen exchange.\n\n## Causes and risk factors\nTriggered by pneumonia, sepsis, aspiration, trauma or pancreatitis.\n\n## Key symptoms\nRapidly worsening breathlessness and low oxygen, often needing ventilation.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299839000,"updated":1794299839000},{"id":"dz-rhinitis","kind":"disease","category":"호흡기","title_ko":"알레르기 비염","title_orig":"Allergic rhinitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Allergic%20rhinitis","tags":["질병 백과","알레르기"],"body_ko":"## 개요\n알레르겐에 코 점막이 과민 반응하는 질환입니다.\n\n## 원인과 위험 요인\n꽃가루, 집먼지진드기, 동물 털, 곰팡이가 원인이며 아토피 가족력이 있습니다.\n\n## 주요 증상\n재채기, 맑은 콧물, 코막힘, 코·눈 가려움.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAllergic inflammation of the nasal lining.\n\n## Causes and risk factors\nTriggered by pollen, dust mites, pet dander and moulds, often with a family history of atopy.\n\n## Key symptoms\nSneezing, clear runny nose, blocked nose and itchy nose and eyes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299838000,"updated":1794299838000},{"id":"dz-sinusitis","kind":"disease","category":"호흡기","title_ko":"부비동염 (축농증)","title_orig":"Sinusitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sinusitis","tags":["질병 백과","코"],"body_ko":"## 개요\n코 주위 빈 공간(부비동)에 생기는 염증입니다.\n\n## 원인과 위험 요인\n감기 후 바이러스·세균 감염, 알레르기, 비용종이 원인입니다.\n\n## 주요 증상\n코막힘, 누런 콧물, 얼굴 압통, 후각 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of the paranasal sinuses.\n\n## Causes and risk factors\nFollows viral or bacterial infection, allergies or nasal polyps.\n\n## Key symptoms\nNasal blockage, discoloured discharge, facial pressure and reduced smell.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299837000,"updated":1794299837000},{"id":"dz-pah","kind":"disease","category":"호흡기","title_ko":"폐동맥 고혈압","title_orig":"Pulmonary arterial hypertension","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pulmonary%20arterial%20hypertension","tags":["질병 백과","심폐"],"body_ko":"## 개요\n폐로 가는 동맥의 압력이 높아져 오른쪽 심장에 부담을 주는 질환입니다.\n\n## 원인과 위험 요인\n원인 불명, 유전, 결합조직 질환, 선천성 심장병, 일부 약물이 원인입니다.\n\n## 주요 증상\n운동 시 숨참, 피로, 실신, 다리 부종.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nRaised pressure in the lung arteries straining the right side of the heart.\n\n## Causes and risk factors\nIdiopathic, heritable or associated with connective tissue disease, congenital heart disease or certain drugs.\n\n## Key symptoms\nBreathlessness on exertion, fatigue, fainting and leg swelling.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299836000,"updated":1794299836000},{"id":"dz-cf","kind":"disease","category":"호흡기","title_ko":"낭포성 섬유증","title_orig":"Cystic fibrosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cystic%20fibrosis","tags":["질병 백과","유전","폐"],"body_ko":"## 개요\nCFTR 유전자 변이로 끈적한 점액이 폐와 췌장을 막는 유전 질환입니다. 서양인에게 흔하고 한국인에게는 드뭅니다.\n\n## 원인과 위험 요인\n부모 양쪽에서 변이 유전자를 물려받아 생깁니다(상염색체 열성).\n\n## 주요 증상\n만성 기침, 반복 폐 감염, 소화 흡수 장애, 성장 지연.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited disease from CFTR mutations in which thick mucus clogs the lungs and pancreas; common in people of European descent, rare in Koreans.\n\n## Causes and risk factors\nAutosomal recessive: inherited from both parents.\n\n## Key symptoms\nChronic cough, recurrent lung infections, malabsorption and poor growth.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299835000,"updated":1794299835000},{"id":"dz-bronchitis","kind":"disease","category":"호흡기","title_ko":"급성 기관지염","title_orig":"Acute bronchitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20bronchitis","tags":["질병 백과","기침"],"body_ko":"## 개요\n기관지에 생기는 일시적인 염증으로, 대부분 바이러스가 원인입니다.\n\n## 원인과 위험 요인\n감기·독감 바이러스가 흔한 원인입니다. 항생제가 필요한 경우는 드뭅니다.\n\n## 주요 증상\n기침(가래 동반 가능)이 1~3주 지속됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nShort-term inflammation of the bronchi, mostly viral.\n\n## Causes and risk factors\nCommon cold and flu viruses are typical causes; antibiotics are rarely needed.\n\n## Key symptoms\nCough, sometimes with sputum, lasting 1–3 weeks.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299834000,"updated":1794299834000},{"id":"dz-ibs","kind":"disease","category":"과민성 대장 증후군","title_ko":"과민성 대장 증후군 (개요)","title_orig":"Irritable bowel syndrome (overview)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Irritable%20bowel%20syndrome","tags":["질병 백과","장-뇌 축","스트레스"],"body_ko":"## 개요\n구조적 이상 없이 복통과 배변 습관 변화가 반복되는 장-뇌 상호작용 장애입니다.\n\n## 원인과 위험 요인\n내장 과민성, 장 운동 변화, 장내 미생물 변화, 감염성 장염 후 발생, 스트레스·불안이 관여합니다.\n\n## 주요 증상\n복통이 배변과 관련되어 나타나고, 설사·변비·혼합형, 복부 팽만.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA disorder of gut–brain interaction with recurrent abdominal pain and altered bowel habit without structural disease.\n\n## Causes and risk factors\nInvolves visceral hypersensitivity, altered motility, gut microbiota changes, onset after gastroenteritis, and stress or anxiety.\n\n## Key symptoms\nAbdominal pain related to defecation, with diarrhoea, constipation or both, and bloating.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299833000,"updated":1794299833000},{"id":"dz-piibs","kind":"disease","category":"과민성 대장 증후군","title_ko":"감염 후 과민성 대장 증후군","title_orig":"Post-infection irritable bowel syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Post-infection%20irritable%20bowel%20syndrome","tags":["질병 백과","장염","장내미생물"],"body_ko":"## 개요\n세균·바이러스성 장염을 앓은 뒤 새로 생기는 과민성 대장 증후군입니다.\n\n## 원인과 위험 요인\n장염 후 지속되는 낮은 수준의 염증, 장 투과성 증가, 장내 미생물 변화가 관여합니다. 장염이 심했거나 당시 불안·우울이 있었으면 위험이 높습니다.\n\n## 주요 증상\n장염 이후 계속되는 설사 위주의 배변 변화와 복통.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nIBS that develops after an episode of bacterial or viral gastroenteritis.\n\n## Causes and risk factors\nLinked to persistent low-grade inflammation, increased gut permeability and microbiota changes; risk is higher after severe gastroenteritis or with anxiety or depression at the time.\n\n## Key symptoms\nOngoing, often diarrhoea-predominant bowel changes and pain after gastroenteritis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299832000,"updated":1794299832000},{"id":"dz-sibo","kind":"disease","category":"과민성 대장 증후군","title_ko":"소장 세균 과증식","title_orig":"Small intestinal bacterial overgrowth","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Small%20intestinal%20bacterial%20overgrowth","tags":["질병 백과","장내미생물"],"body_ko":"## 개요\n소장에 세균이 비정상적으로 많아진 상태입니다.\n\n## 원인과 위험 요인\n장 운동 저하, 장 수술, 위산 억제, 당뇨병성 신경병증과 관련되며, 과민성 대장 증후군과 증상이 겹칩니다.\n\n## 주요 증상\n복부 팽만, 가스, 설사, 복통, 흡수 장애.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn abnormal increase in bacteria in the small intestine.\n\n## Causes and risk factors\nLinked to reduced motility, bowel surgery, acid suppression and diabetic neuropathy; symptoms overlap with IBS.\n\n## Key symptoms\nBloating, gas, diarrhoea, abdominal pain and malabsorption.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299831000,"updated":1794299831000},{"id":"dz-gerd","kind":"disease","category":"소화기","title_ko":"위식도역류질환","title_orig":"Gastro-oesophageal reflux disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gastro-oesophageal%20reflux%20disease","tags":["질병 백과","위산","소화기"],"body_ko":"## 개요\n위산이 식도로 역류해 증상이나 식도 손상을 일으키는 질환입니다.\n\n## 원인과 위험 요인\n비만, 과식, 늦은 식사, 기름진 음식, 흡연, 음주, 임신, 식도 열공 탈장이 원인입니다.\n\n## 주요 증상\n가슴 쓰림, 신물 올라옴, 목 이물감, 만성 기침.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nReflux of stomach acid into the oesophagus causing symptoms or damage.\n\n## Causes and risk factors\nLinked to obesity, large or late meals, fatty foods, smoking, alcohol, pregnancy and hiatus hernia.\n\n## Key symptoms\nHeartburn, acid regurgitation, throat discomfort and chronic cough.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299830000,"updated":1794299830000},{"id":"dz-pud","kind":"disease","category":"소화기","title_ko":"소화성 궤양","title_orig":"Peptic ulcer disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Peptic%20ulcer%20disease","tags":["질병 백과","헬리코박터","위"],"body_ko":"## 개요\n위나 십이지장 점막이 깊게 헐어 생기는 궤양입니다.\n\n## 원인과 위험 요인\n헬리코박터 파일로리 감염과 소염진통제(NSAIDs)·아스피린이 두 가지 주원인입니다. 흡연과 스트레스는 악화 요인입니다.\n\n## 주요 증상\n명치 통증(공복이나 식후), 속쓰림. 출혈 시 흑변, 토혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nOpen sores in the lining of the stomach or duodenum.\n\n## Causes and risk factors\nThe two main causes are Helicobacter pylori and NSAIDs or aspirin; smoking and stress are aggravating factors.\n\n## Key symptoms\nUpper abdominal pain (fasting or after meals) and heartburn; bleeding causes black stools or vomiting blood.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299829000,"updated":1794299829000},{"id":"dz-fd","kind":"disease","category":"소화기","title_ko":"기능성 소화불량","title_orig":"Functional dyspepsia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Functional%20dyspepsia","tags":["질병 백과","장-뇌 축","스트레스"],"body_ko":"## 개요\n검사에서 이상이 없는데 명치 통증이나 더부룩함이 반복되는 장-뇌 상호작용 장애입니다.\n\n## 원인과 위험 요인\n위 운동 이상, 위 과민성, 감염 후 변화, 스트레스·불안이 관여합니다.\n\n## 주요 증상\n식후 더부룩함, 조기 포만감, 명치 통증·쓰림.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA gut–brain interaction disorder with recurrent upper abdominal pain or fullness without structural cause.\n\n## Causes and risk factors\nInvolves impaired gastric motility, hypersensitivity, post-infection changes, stress and anxiety.\n\n## Key symptoms\nPost-meal fullness, early satiety and epigastric pain or burning.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299828000,"updated":1794299828000},{"id":"dz-crohn","kind":"disease","category":"소화기","title_ko":"크론병","title_orig":"Crohn's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Crohn%27s%20disease","tags":["질병 백과","염증성 장질환","면역"],"body_ko":"## 개요\n입부터 항문까지 소화관 어디에나 생길 수 있는 만성 염증성 장질환입니다.\n\n## 원인과 위험 요인\n유전적 소인, 장내 미생물, 면역 이상, 흡연, 서구화된 식습관이 관여합니다. 한국에서 빠르게 늘고 있습니다.\n\n## 주요 증상\n복통, 설사, 체중 감소, 항문 주위 농양·누공, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory bowel disease that can affect any part of the gut from mouth to anus.\n\n## Causes and risk factors\nInvolves genetic susceptibility, gut microbes, immune dysregulation, smoking and Westernised diets; incidence is rising fast in Korea.\n\n## Key symptoms\nAbdominal pain, diarrhoea, weight loss, perianal abscess or fistula and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299827000,"updated":1794299827000},{"id":"dz-uc","kind":"disease","category":"소화기","title_ko":"궤양성 대장염","title_orig":"Ulcerative colitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ulcerative%20colitis","tags":["질병 백과","염증성 장질환","면역"],"body_ko":"## 개요\n직장부터 대장 점막에 연속적인 염증과 궤양이 생기는 만성 염증성 장질환입니다.\n\n## 원인과 위험 요인\n유전, 장내 미생물, 면역 이상이 관여합니다.\n\n## 주요 증상\n피와 점액 섞인 설사, 급한 변의, 복통.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory bowel disease with continuous inflammation of the colonic lining starting at the rectum.\n\n## Causes and risk factors\nInvolves genetics, gut microbes and immune dysregulation.\n\n## Key symptoms\nBloody mucoid diarrhoea, urgency and abdominal pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299826000,"updated":1794299826000},{"id":"dz-celiac","kind":"disease","category":"소화기","title_ko":"셀리악병","title_orig":"Coeliac disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Coeliac%20disease","tags":["질병 백과","자가면역","글루텐"],"body_ko":"## 개요\n밀·보리·호밀의 글루텐에 면역 반응이 일어나 소장 융모가 손상되는 자가면역 질환입니다.\n\n## 원인과 위험 요인\nHLA-DQ2/DQ8 유전자형을 가진 사람에게 생깁니다. 한국인에게는 드뭅니다.\n\n## 주요 증상\n설사, 복부 팽만, 체중 감소, 빈혈, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune reaction to gluten in wheat, barley and rye that damages small-intestinal villi.\n\n## Causes and risk factors\nOccurs in people with HLA-DQ2/DQ8; uncommon in Koreans.\n\n## Key symptoms\nDiarrhoea, bloating, weight loss, anaemia and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299825000,"updated":1794299825000},{"id":"dz-gallstone","kind":"disease","category":"소화기","title_ko":"담석증","title_orig":"Gallstones","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gallstones","tags":["질병 백과","담낭"],"body_ko":"## 개요\n담낭이나 담관에 돌이 생기는 질환입니다.\n\n## 원인과 위험 요인\n여성, 비만, 급격한 체중 감소, 임신, 나이가 위험 요인입니다.\n\n## 주요 증상\n대부분 증상이 없고, 기름진 식사 후 오른쪽 윗배 통증. 담낭염·췌장염이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nStones forming in the gallbladder or bile ducts.\n\n## Causes and risk factors\nRisk factors include female sex, obesity, rapid weight loss, pregnancy and age.\n\n## Key symptoms\nOften silent; right upper abdominal pain after fatty meals; can cause cholecystitis or pancreatitis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299824000,"updated":1794299824000},{"id":"dz-acutepanc","kind":"disease","category":"소화기","title_ko":"급성 췌장염","title_orig":"Acute pancreatitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20pancreatitis","tags":["질병 백과","췌장","음주"],"body_ko":"## 개요\n췌장에 갑자기 염증이 생기는 질환입니다.\n\n## 원인과 위험 요인\n담석과 과음이 가장 흔한 원인이며 고중성지방혈증, 일부 약물도 원인입니다.\n\n## 주요 증상\n등으로 뻗는 심한 윗배 통증, 구토.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSudden inflammation of the pancreas.\n\n## Causes and risk factors\nGallstones and alcohol are the commonest causes; high triglycerides and some drugs are others.\n\n## Key symptoms\nSevere upper abdominal pain radiating to the back, with vomiting.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299823000,"updated":1794299823000},{"id":"dz-chronpanc","kind":"disease","category":"소화기","title_ko":"만성 췌장염","title_orig":"Chronic pancreatitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chronic%20pancreatitis","tags":["질병 백과","췌장","음주"],"body_ko":"## 개요\n췌장에 반복적인 염증으로 영구적인 손상이 생기는 질환입니다.\n\n## 원인과 위험 요인\n장기간 과음과 흡연이 주원인입니다.\n\n## 주요 증상\n반복되는 복통, 기름진 변, 체중 감소, 당뇨병.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPermanent pancreatic damage from ongoing inflammation.\n\n## Causes and risk factors\nMainly caused by long-term heavy drinking and smoking.\n\n## Key symptoms\nRecurrent abdominal pain, fatty stools, weight loss and diabetes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299822000,"updated":1794299822000},{"id":"dz-cirrhosis","kind":"disease","category":"소화기","title_ko":"간경변증","title_orig":"Liver cirrhosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Liver%20cirrhosis","tags":["질병 백과","간","간염","음주"],"body_ko":"## 개요\n간에 오랜 손상으로 흉터 조직이 생겨 간이 굳고 기능이 떨어지는 상태입니다.\n\n## 원인과 위험 요인\nB형·C형 간염, 과음, 지방간 질환, 자가면역 간질환이 원인입니다.\n\n## 주요 증상\n피로, 황달, 복수, 다리 부종, 식도정맥류 출혈, 혼란(간성뇌증).\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAdvanced scarring of the liver from long-term damage, impairing function.\n\n## Causes and risk factors\nCaused by hepatitis B and C, alcohol, fatty liver disease and autoimmune liver disease.\n\n## Key symptoms\nFatigue, jaundice, ascites, leg swelling, variceal bleeding and confusion (encephalopathy).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299821000,"updated":1794299821000},{"id":"dz-ald","kind":"disease","category":"소화기","title_ko":"알코올성 간질환","title_orig":"Alcohol-related liver disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Alcohol-related%20liver%20disease","tags":["질병 백과","음주","간"],"body_ko":"## 개요\n과음으로 간에 지방간, 간염, 간경변이 생기는 질환입니다.\n\n## 원인과 위험 요인\n오랜 기간의 과음이 원인이며 여성과 비만인 사람에게 더 빨리 진행합니다.\n\n## 주요 증상\n초기에는 증상이 없고, 진행하면 황달·복수 등 간경변 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nLiver damage from alcohol, ranging from fatty liver to hepatitis and cirrhosis.\n\n## Causes and risk factors\nCaused by prolonged heavy drinking; progresses faster in women and people with obesity.\n\n## Key symptoms\nSilent early; later cirrhosis features such as jaundice and ascites.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299820000,"updated":1794299820000},{"id":"dz-aih","kind":"disease","category":"소화기","title_ko":"자가면역 간염","title_orig":"Autoimmune hepatitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Autoimmune%20hepatitis","tags":["질병 백과","자가면역","간"],"body_ko":"## 개요\n면역 체계가 간세포를 공격하는 만성 간염입니다.\n\n## 원인과 위험 요인\n여성에게 많고 유전적 소인과 다른 자가면역 질환이 관련됩니다.\n\n## 주요 증상\n피로, 황달, 관절통. 증상 없이 간 수치 상승으로 발견되기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nChronic liver inflammation in which the immune system attacks liver cells.\n\n## Causes and risk factors\nMore common in women; linked to genetic susceptibility and other autoimmune diseases.\n\n## Key symptoms\nFatigue, jaundice and joint pain; may be found from raised liver enzymes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299819000,"updated":1794299819000},{"id":"dz-diverticulitis","kind":"disease","category":"소화기","title_ko":"게실염","title_orig":"Diverticulitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diverticulitis","tags":["질병 백과","대장"],"body_ko":"## 개요\n대장 벽의 작은 주머니(게실)에 염증이 생기는 질환입니다.\n\n## 원인과 위험 요인\n나이, 저섬유 식사, 비만, 운동 부족이 관련됩니다. 한국인은 오른쪽 대장에 잘 생깁니다.\n\n## 주요 증상\n아랫배 통증(서양인은 왼쪽, 한국인은 오른쪽이 흔함), 열.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of small pouches (diverticula) in the colon wall.\n\n## Causes and risk factors\nAssociated with age, low-fibre diet, obesity and inactivity; in Koreans it often affects the right colon.\n\n## Key symptoms\nLower abdominal pain (left-sided in Western patients, often right-sided in Koreans) and fever.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299818000,"updated":1794299818000},{"id":"dz-hemorrhoid","kind":"disease","category":"소화기","title_ko":"치핵 (치질)","title_orig":"Haemorrhoids","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Haemorrhoids","tags":["질병 백과","항문","변비"],"body_ko":"## 개요\n항문 주위 혈관 조직이 부풀어 튀어나오는 질환입니다.\n\n## 원인과 위험 요인\n변비, 배변 시 힘주기, 오래 앉아 있기, 임신이 원인입니다.\n\n## 주요 증상\n배변 시 선홍색 출혈, 항문 덩어리, 가려움, 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSwollen vascular cushions in and around the anus.\n\n## Causes and risk factors\nLinked to constipation, straining, prolonged sitting and pregnancy.\n\n## Key symptoms\nBright red bleeding with stools, anal lumps, itching and pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299817000,"updated":1794299817000},{"id":"dz-append","kind":"disease","category":"소화기","title_ko":"급성 충수염 (맹장염)","title_orig":"Acute appendicitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20appendicitis","tags":["질병 백과","응급","수술"],"body_ko":"## 개요\n충수(맹장 끝 돌기)에 염증이 생기는 질환입니다.\n\n## 원인과 위험 요인\n충수 입구가 막혀 세균이 증식하며 생깁니다.\n\n## 주요 증상\n배꼽 주위에서 시작해 오른쪽 아랫배로 옮겨가는 통증, 구역, 열.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of the appendix.\n\n## Causes and risk factors\nCaused by obstruction of the appendix with bacterial overgrowth.\n\n## Key symptoms\nPain starting around the navel and moving to the lower right abdomen, with nausea and fever.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299816000,"updated":1794299816000},{"id":"dz-lactose","kind":"disease","category":"소화기","title_ko":"유당불내증","title_orig":"Lactose intolerance","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Lactose%20intolerance","tags":["질병 백과","소화"],"body_ko":"## 개요\n우유의 유당을 분해하는 효소(락타아제)가 부족해 소화 증상이 생기는 상태입니다.\n\n## 원인과 위험 요인\n성인이 되면서 락타아제가 줄어드는 것은 동아시아인에게 매우 흔합니다.\n\n## 주요 증상\n우유를 마신 뒤 복부 팽만, 가스, 설사.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDigestive symptoms from insufficient lactase to digest milk sugar.\n\n## Causes and risk factors\nAge-related lactase decline is very common in East Asian populations.\n\n## Key symptoms\nBloating, gas and diarrhoea after dairy.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299815000,"updated":1794299815000},{"id":"dz-constip","kind":"disease","category":"소화기","title_ko":"만성 기능성 변비","title_orig":"Chronic functional constipation","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chronic%20functional%20constipation","tags":["질병 백과","장"],"body_ko":"## 개요\n구조적 원인 없이 배변이 드물거나 힘든 상태가 지속되는 것입니다.\n\n## 원인과 위험 요인\n섬유질·수분 부족, 운동 부족, 장 운동 저하, 골반저 협조 장애, 일부 약물이 원인입니다.\n\n## 주요 증상\n딱딱한 변, 힘주기, 잔변감.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPersistent infrequent or difficult bowel movements without structural cause.\n\n## Causes and risk factors\nLinked to low fibre and fluid intake, inactivity, slow transit, pelvic floor dyssynergia and some drugs.\n\n## Key symptoms\nHard stools, straining and incomplete evacuation.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299814000,"updated":1794299814000},{"id":"dz-gastroparesis","kind":"disease","category":"소화기","title_ko":"위 마비 (위 무력증)","title_orig":"Gastroparesis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gastroparesis","tags":["질병 백과","자율신경","당뇨"],"body_ko":"## 개요\n막힌 곳이 없는데 위가 음식을 너무 늦게 내보내는 질환입니다.\n\n## 원인과 위험 요인\n당뇨병성 자율신경병증, 바이러스 감염 후, 수술 후, 원인 불명이 있습니다.\n\n## 주요 증상\n구역, 구토, 조기 포만감, 복부 팽만.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDelayed stomach emptying without mechanical obstruction.\n\n## Causes and risk factors\nCaused by diabetic autonomic neuropathy, post-viral changes, surgery or unknown causes.\n\n## Key symptoms\nNausea, vomiting, early fullness and bloating.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299813000,"updated":1794299813000},{"id":"dz-istroke","kind":"disease","category":"뇌·신경","title_ko":"허혈성 뇌졸중 (뇌경색)","title_orig":"Ischaemic stroke","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ischaemic%20stroke","tags":["질병 백과","응급","뇌혈관","성인병"],"body_ko":"## 개요\n뇌혈관이 막혀 뇌 조직이 손상되는 질환으로, 뇌졸중의 대부분을 차지합니다.\n\n## 원인과 위험 요인\n고혈압, 심방세동, 당뇨병, 흡연, 이상지질혈증, 동맥경화가 원인입니다.\n\n## 주요 증상\n갑자기 한쪽 얼굴·팔다리 마비, 말이 어눌함, 시야 장애, 어지럼. 몇 시간 안의 치료가 중요합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBrain damage from blockage of a cerebral artery; the majority of strokes.\n\n## Causes and risk factors\nCaused by hypertension, atrial fibrillation, diabetes, smoking, dyslipidaemia and atherosclerosis.\n\n## Key symptoms\nSudden one-sided face or limb weakness, slurred speech, vision loss or dizziness; treatment within hours is crucial.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299812000,"updated":1794299812000},{"id":"dz-hstroke","kind":"disease","category":"뇌·신경","title_ko":"출혈성 뇌졸중 (뇌내출혈)","title_orig":"Intracerebral haemorrhage","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Intracerebral%20haemorrhage","tags":["질병 백과","응급","고혈압"],"body_ko":"## 개요\n뇌 속 혈관이 터져 출혈이 생기는 뇌졸중입니다.\n\n## 원인과 위험 요인\n고혈압이 가장 흔한 원인이며 아밀로이드 혈관병증, 항응고제, 과음도 원인입니다.\n\n## 주요 증상\n갑작스러운 두통, 구토, 마비, 의식 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA stroke caused by bleeding within the brain.\n\n## Causes and risk factors\nHypertension is the commonest cause; amyloid angiopathy, anticoagulants and alcohol are others.\n\n## Key symptoms\nSudden headache, vomiting, weakness and reduced consciousness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299811000,"updated":1794299811000},{"id":"dz-sah","kind":"disease","category":"뇌·신경","title_ko":"지주막하출혈","title_orig":"Subarachnoid haemorrhage","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Subarachnoid%20haemorrhage","tags":["질병 백과","응급","동맥류"],"body_ko":"## 개요\n뇌 표면의 공간에 출혈이 생기는 질환으로, 대부분 뇌동맥류 파열이 원인입니다.\n\n## 원인과 위험 요인\n흡연, 고혈압, 과음, 가족력이 위험 요인입니다.\n\n## 주요 증상\n생애 최악의 갑작스러운 두통, 목 경직, 구토, 의식 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBleeding into the space around the brain, usually from a ruptured aneurysm.\n\n## Causes and risk factors\nRisk factors include smoking, hypertension, heavy drinking and family history.\n\n## Key symptoms\nSudden 'worst-ever' headache, stiff neck, vomiting and reduced consciousness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299810000,"updated":1794299810000},{"id":"dz-alz","kind":"disease","category":"뇌·신경","title_ko":"알츠하이머병","title_orig":"Alzheimer's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Alzheimer%27s%20disease","tags":["질병 백과","치매","신경퇴행"],"body_ko":"## 개요\n치매의 가장 흔한 원인으로, 기억력부터 시작해 인지 기능이 점점 떨어지는 신경퇴행성 질환입니다.\n\n## 원인과 위험 요인\n뇌에 아밀로이드 베타 판과 타우 단백질 엉킴이 쌓입니다. 나이, APOE ε4 유전자, 고혈압, 당뇨병, 청력 손실, 신체·사회 활동 부족이 위험 요인입니다.\n\n## 주요 증상\n최근 일을 잊음, 길 잃음, 말하기 어려움, 판단력 저하, 성격 변화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common cause of dementia: a neurodegenerative disease with progressive cognitive decline, starting with memory.\n\n## Causes and risk factors\nAmyloid-beta plaques and tau tangles accumulate. Risk factors include age, APOE ε4, hypertension, diabetes, hearing loss and physical or social inactivity.\n\n## Key symptoms\nForgetting recent events, getting lost, word-finding difficulty, poor judgement and personality change.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299809000,"updated":1794299809000},{"id":"dz-vascdem","kind":"disease","category":"뇌·신경","title_ko":"혈관성 치매","title_orig":"Vascular dementia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Vascular%20dementia","tags":["질병 백과","치매","뇌혈관"],"body_ko":"## 개요\n뇌혈관 질환으로 뇌가 손상되어 생기는 치매입니다.\n\n## 원인과 위험 요인\n뇌졸중, 작은 혈관 질환, 고혈압, 당뇨병, 흡연이 원인입니다.\n\n## 주요 증상\n계단식으로 나빠지는 인지 기능, 느린 사고, 보행 장애.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDementia caused by cerebrovascular disease.\n\n## Causes and risk factors\nCaused by strokes, small-vessel disease, hypertension, diabetes and smoking.\n\n## Key symptoms\nStepwise cognitive decline, slowed thinking and gait problems.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299808000,"updated":1794299808000},{"id":"dz-pd","kind":"disease","category":"뇌·신경","title_ko":"파킨슨병","title_orig":"Parkinson's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Parkinson%27s%20disease","tags":["질병 백과","신경퇴행","자율신경"],"body_ko":"## 개요\n도파민을 만드는 뇌 신경세포가 줄어드는 진행성 신경퇴행성 질환입니다.\n\n## 원인과 위험 요인\n알파-시누클레인이 쌓이며 나이, 유전, 농약 노출이 관련됩니다.\n\n## 주요 증상\n떨림, 느린 움직임, 근육 경직, 보행 장애. 변비, 후각 저하, 렘수면 행동장애, 기립성 저혈압이 먼저 오기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA progressive neurodegenerative disease with loss of dopamine-producing neurons.\n\n## Causes and risk factors\nAlpha-synuclein accumulates; age, genetics and pesticide exposure are associated.\n\n## Key symptoms\nTremor, slowness, rigidity and gait problems; constipation, loss of smell, REM sleep behaviour disorder and orthostatic hypotension may come first.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299807000,"updated":1794299807000},{"id":"dz-ms","kind":"disease","category":"뇌·신경","title_ko":"다발성 경화증","title_orig":"Multiple sclerosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Multiple%20sclerosis","tags":["질병 백과","자가면역","EBV"],"body_ko":"## 개요\n면역 체계가 뇌와 척수 신경의 수초를 공격하는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n유전, 엡스타인-바 바이러스 감염, 비타민 D 부족, 흡연이 관련됩니다.\n\n## 주요 증상\n시력 저하(시신경염), 저림, 근력 약화, 균형 장애, 피로가 재발과 완화를 반복합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease in which the immune system attacks the myelin of the brain and spinal cord.\n\n## Causes and risk factors\nAssociated with genetics, Epstein–Barr virus infection, low vitamin D and smoking.\n\n## Key symptoms\nRelapsing and remitting vision loss (optic neuritis), numbness, weakness, imbalance and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299806000,"updated":1794299806000},{"id":"dz-als","kind":"disease","category":"뇌·신경","title_ko":"근위축성 측삭경화증 (루게릭병)","title_orig":"Amyotrophic lateral sclerosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Amyotrophic%20lateral%20sclerosis","tags":["질병 백과","신경퇴행"],"body_ko":"## 개요\n운동신경세포가 점차 죽어 근육이 약해지고 마비되는 질환입니다.\n\n## 원인과 위험 요인\n대부분 원인 불명이며 약 10%는 유전(SOD1, C9orf72 등)입니다.\n\n## 주요 증상\n팔다리 근력 약화, 근육 위축과 떨림, 말하기·삼키기 어려움, 호흡근 약화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nProgressive death of motor neurons causing muscle weakness and paralysis.\n\n## Causes and risk factors\nMostly of unknown cause; about 10% are inherited (SOD1, C9orf72 and others).\n\n## Key symptoms\nLimb weakness, muscle wasting and twitching, speech and swallowing difficulty and respiratory weakness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299805000,"updated":1794299805000},{"id":"dz-epilepsy","kind":"disease","category":"뇌·신경","title_ko":"뇌전증 (간질)","title_orig":"Epilepsy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Epilepsy","tags":["질병 백과","발작"],"body_ko":"## 개요\n뇌의 비정상적인 전기 활동으로 발작이 반복되는 질환입니다.\n\n## 원인과 위험 요인\n유전, 뇌손상, 뇌졸중, 뇌종양, 뇌염, 발달 이상이 원인이며 원인 불명도 많습니다.\n\n## 주요 증상\n경련, 멍해짐, 의식 소실, 이상 감각.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA tendency to recurrent seizures from abnormal brain electrical activity.\n\n## Causes and risk factors\nCaused by genetics, brain injury, stroke, tumours, infection or developmental abnormalities; often no cause is found.\n\n## Key symptoms\nConvulsions, absence spells, loss of awareness or unusual sensations.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299804000,"updated":1794299804000},{"id":"dz-migraine","kind":"disease","category":"뇌·신경","title_ko":"편두통","title_orig":"Migraine","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Migraine","tags":["질병 백과","두통","스트레스"],"body_ko":"## 개요\n반복되는 중등도~심한 박동성 두통이 특징인 신경 질환입니다.\n\n## 원인과 위험 요인\n유전적 소인에 수면 부족, 스트레스, 호르몬 변화, 굶기, 특정 음식 등이 유발 요인이 됩니다. 여성에게 많습니다.\n\n## 주요 증상\n한쪽의 박동성 두통, 구역, 빛·소리 과민, 일부는 전조(섬광).\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA neurological disorder of recurrent moderate to severe throbbing headaches.\n\n## Causes and risk factors\nGenetic susceptibility with triggers such as poor sleep, stress, hormonal changes, skipped meals and certain foods; more common in women.\n\n## Key symptoms\nOne-sided throbbing headache, nausea and sensitivity to light and sound, sometimes with aura.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299803000,"updated":1794299803000},{"id":"dz-tth","kind":"disease","category":"뇌·신경","title_ko":"긴장형 두통","title_orig":"Tension-type headache","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Tension-type%20headache","tags":["질병 백과","두통","스트레스"],"body_ko":"## 개요\n가장 흔한 두통으로, 머리를 조이는 듯한 양측성 통증입니다.\n\n## 원인과 위험 요인\n스트레스, 수면 부족, 자세, 목·어깨 근육 긴장이 관련됩니다.\n\n## 주요 증상\n머리 띠를 두른 듯한 압박감, 대개 구역은 없습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common headache: a bilateral pressing or tightening pain.\n\n## Causes and risk factors\nAssociated with stress, poor sleep, posture and neck and shoulder muscle tension.\n\n## Key symptoms\nBand-like pressure around the head, usually without nausea.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299802000,"updated":1794299802000},{"id":"dz-cluster","kind":"disease","category":"뇌·신경","title_ko":"군발두통","title_orig":"Cluster headache","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cluster%20headache","tags":["질병 백과","두통"],"body_ko":"## 개요\n한쪽 눈 주위에 극심한 통증이 몰려서 반복되는 두통입니다.\n\n## 원인과 위험 요인\n시상하부 이상이 관여하며 남성과 흡연자에게 많고 음주가 유발합니다.\n\n## 주요 증상\n15분~3시간 지속되는 눈 주위 통증, 눈물, 콧물, 안절부절.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nExcruciating one-sided pain around the eye occurring in clusters.\n\n## Causes and risk factors\nInvolves the hypothalamus; more common in men and smokers, often triggered by alcohol.\n\n## Key symptoms\nAttacks of 15 minutes to 3 hours with eye pain, tearing, runny nose and restlessness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299801000,"updated":1794299801000},{"id":"dz-dpn","kind":"disease","category":"뇌·신경","title_ko":"당뇨병성 말초신경병증","title_orig":"Diabetic peripheral neuropathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diabetic%20peripheral%20neuropathy","tags":["질병 백과","당뇨","신경"],"body_ko":"## 개요\n오랜 고혈당으로 손발의 말초신경이 손상되는 당뇨병 합병증입니다.\n\n## 원인과 위험 요인\n당뇨병 유병 기간, 혈당 조절 불량, 고혈압, 흡연, 과음이 위험 요인입니다.\n\n## 주요 증상\n발끝부터 저림, 화끈거림, 감각 저하. 발 궤양과 절단 위험이 커집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDamage to peripheral nerves of the hands and feet from long-term high blood glucose.\n\n## Causes and risk factors\nRisk rises with duration and poor control of diabetes, hypertension, smoking and alcohol.\n\n## Key symptoms\nNumbness, burning and loss of feeling starting in the toes; raises the risk of foot ulcers and amputation.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299800000,"updated":1794299800000},{"id":"dz-gbs","kind":"disease","category":"뇌·신경","title_ko":"길랭-바레 증후군","title_orig":"Guillain–Barré syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Guillain%E2%80%93Barr%C3%A9%20syndrome","tags":["질병 백과","자가면역","감염 후"],"body_ko":"## 개요\n면역 체계가 말초신경을 공격해 빠르게 마비가 오는 질환입니다.\n\n## 원인과 위험 요인\n캄필로박터 장염, 호흡기 감염, 지카 바이러스 감염 후에 생기는 경우가 많습니다.\n\n## 주요 증상\n다리부터 올라오는 근력 약화, 저림, 반사 소실. 호흡근 마비가 올 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn immune attack on peripheral nerves causing rapidly progressive weakness.\n\n## Causes and risk factors\nOften follows Campylobacter gastroenteritis, respiratory infections or Zika virus.\n\n## Key symptoms\nAscending weakness from the legs, tingling and loss of reflexes; breathing muscles may be affected.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299799000,"updated":1794299799000},{"id":"dz-mg","kind":"disease","category":"뇌·신경","title_ko":"중증근무력증","title_orig":"Myasthenia gravis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Myasthenia%20gravis","tags":["질병 백과","자가면역"],"body_ko":"## 개요\n신경과 근육의 연결 부위를 공격하는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n아세틸콜린 수용체 항체가 원인이며 흉선 이상과 관련됩니다.\n\n## 주요 증상\n쓸수록 심해지는 근력 약화, 눈꺼풀 처짐, 겹보임, 삼킴 곤란.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease attacking the junction between nerves and muscles.\n\n## Causes and risk factors\nCaused by antibodies against acetylcholine receptors; linked to thymus abnormalities.\n\n## Key symptoms\nWeakness that worsens with use, drooping eyelids, double vision and swallowing difficulty.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299798000,"updated":1794299798000},{"id":"dz-huntington","kind":"disease","category":"뇌·신경","title_ko":"헌팅턴병","title_orig":"Huntington's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Huntington%27s%20disease","tags":["질병 백과","유전","신경퇴행"],"body_ko":"## 개요\n운동, 인지, 정신 증상이 함께 진행하는 유전성 신경퇴행 질환입니다.\n\n## 원인과 위험 요인\nHTT 유전자의 CAG 반복 확장이 원인이며 상염색체 우성으로 유전됩니다.\n\n## 주요 증상\n불수의적 춤추는 듯한 움직임, 인지 저하, 우울·성격 변화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited neurodegenerative disease with movement, cognitive and psychiatric symptoms.\n\n## Causes and risk factors\nCaused by a CAG repeat expansion in HTT, inherited in an autosomal dominant pattern.\n\n## Key symptoms\nInvoluntary dance-like movements, cognitive decline, depression and personality change.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299797000,"updated":1794299797000},{"id":"dz-cts","kind":"disease","category":"뇌·신경","title_ko":"손목터널증후군","title_orig":"Carpal tunnel syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Carpal%20tunnel%20syndrome","tags":["질병 백과","신경","직업"],"body_ko":"## 개요\n손목에서 정중신경이 눌려 손이 저리는 질환입니다.\n\n## 원인과 위험 요인\n반복적 손목 사용, 임신, 당뇨병, 갑상선기능저하증, 비만이 관련됩니다.\n\n## 주요 증상\n엄지·검지·중지 저림, 밤에 심해짐, 손 힘 약화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCompression of the median nerve at the wrist.\n\n## Causes and risk factors\nLinked to repetitive wrist use, pregnancy, diabetes, hypothyroidism and obesity.\n\n## Key symptoms\nTingling in the thumb, index and middle fingers, worse at night, and hand weakness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299796000,"updated":1794299796000},{"id":"dz-bell","kind":"disease","category":"뇌·신경","title_ko":"벨 마비 (특발성 안면신경마비)","title_orig":"Bell's palsy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bell%27s%20palsy","tags":["질병 백과","신경","바이러스"],"body_ko":"## 개요\n얼굴 한쪽 근육이 갑자기 마비되는 질환입니다.\n\n## 원인과 위험 요인\n안면신경의 염증으로, 단순포진 바이러스 재활성화가 관여하는 것으로 추정됩니다.\n\n## 주요 증상\n한쪽 눈이 감기지 않고 입이 처짐. 대부분 몇 주~몇 달 안에 회복됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSudden weakness of the muscles on one side of the face.\n\n## Causes and risk factors\nInflammation of the facial nerve, possibly linked to herpes simplex reactivation.\n\n## Key symptoms\nInability to close one eye and a drooping mouth; most recover within weeks to months.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299795000,"updated":1794299795000},{"id":"dz-et","kind":"disease","category":"뇌·신경","title_ko":"본태성 떨림","title_orig":"Essential tremor","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Essential%20tremor","tags":["질병 백과","떨림"],"body_ko":"## 개요\n손을 쓸 때 떨리는 가장 흔한 운동 장애입니다.\n\n## 원인과 위험 요인\n가족력이 흔하고 나이와 함께 늘어납니다.\n\n## 주요 증상\n글씨 쓰기, 컵 들기 때 손 떨림, 머리·목소리 떨림. 술을 마시면 일시적으로 줄기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common movement disorder: tremor during action.\n\n## Causes and risk factors\nOften familial and increases with age.\n\n## Key symptoms\nHand tremor when writing or holding cups, head or voice tremor; may briefly improve with alcohol.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299794000,"updated":1794299794000},{"id":"dz-rls","kind":"disease","category":"뇌·신경","title_ko":"하지불안 증후군","title_orig":"Restless legs syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Restless%20legs%20syndrome","tags":["질병 백과","수면","철분"],"body_ko":"## 개요\n쉬거나 누울 때 다리에 불편한 느낌이 들어 움직이고 싶은 충동이 생기는 질환입니다.\n\n## 원인과 위험 요인\n철 결핍, 임신, 콩팥병, 유전, 일부 약물이 관련됩니다.\n\n## 주요 증상\n저녁·밤에 심한 다리 불편감, 움직이면 나아짐, 수면 장애.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn urge to move the legs with uncomfortable sensations at rest.\n\n## Causes and risk factors\nAssociated wi
