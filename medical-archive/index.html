th iron deficiency, pregnancy, kidney disease, genetics and some drugs.\n\n## Key symptoms\nEvening and night leg discomfort relieved by movement, disrupting sleep.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299793000,"updated":1794299793000},{"id":"dz-dlb","kind":"disease","category":"뇌·신경","title_ko":"루이소체 치매","title_orig":"Dementia with Lewy bodies","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Dementia%20with%20Lewy%20bodies","tags":["질병 백과","치매","자율신경"],"body_ko":"## 개요\n뇌에 루이소체(알파-시누클레인)가 쌓여 생기는 치매입니다.\n\n## 원인과 위험 요인\n원인은 밝혀지지 않았으며 나이가 위험 요인입니다.\n\n## 주요 증상\n인지 기능 기복, 생생한 환시, 파킨슨 증상, 렘수면 행동장애, 기립성 저혈압.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDementia caused by Lewy body (alpha-synuclein) deposits in the brain.\n\n## Causes and risk factors\nCause unknown; age is a risk factor.\n\n## Key symptoms\nFluctuating cognition, vivid visual hallucinations, parkinsonism, REM sleep behaviour disorder and orthostatic hypotension.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299792000,"updated":1794299792000},{"id":"dz-nph","kind":"disease","category":"뇌·신경","title_ko":"정상압 수두증","title_orig":"Normal pressure hydrocephalus","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Normal%20pressure%20hydrocephalus","tags":["질병 백과","치매"],"body_ko":"## 개요\n뇌실에 뇌척수액이 고여 뇌실이 커지는 노인 질환입니다.\n\n## 원인과 위험 요인\n대부분 원인 불명이며 지주막하출혈, 뇌막염, 외상 후 생기기도 합니다.\n\n## 주요 증상\n보행 장애, 소변 실금, 인지 저하. 션트 수술로 좋아질 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nEnlarged brain ventricles from cerebrospinal fluid build-up in older adults.\n\n## Causes and risk factors\nMostly idiopathic; may follow haemorrhage, meningitis or head injury.\n\n## Key symptoms\nGait disturbance, urinary incontinence and cognitive decline; may improve with shunt surgery.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299791000,"updated":1794299791000},{"id":"dz-narcolepsy","kind":"disease","category":"뇌·신경","title_ko":"기면증","title_orig":"Narcolepsy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Narcolepsy","tags":["질병 백과","수면"],"body_ko":"## 개요\n낮에 참기 어려운 졸음이 반복되는 수면 질환입니다.\n\n## 원인과 위험 요인\n1형은 각성을 유지하는 오렉신(하이포크레틴) 신경세포 소실이 원인입니다.\n\n## 주요 증상\n낮 졸림, 감정에 따른 갑작스러운 근력 소실(탈력발작), 수면 마비, 입면 환각.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sleep disorder with excessive daytime sleepiness.\n\n## Causes and risk factors\nType 1 is caused by loss of orexin (hypocretin) neurons.\n\n## Key symptoms\nDaytime sleepiness, sudden emotion-triggered weakness (cataplexy), sleep paralysis and hallucinations.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299790000,"updated":1794299790000},{"id":"dz-mdd","kind":"disease","category":"정신건강","title_ko":"주요 우울장애","title_orig":"Major depressive disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Major%20depressive%20disorder","tags":["질병 백과","우울","스트레스"],"body_ko":"## 개요\n우울한 기분이나 흥미 상실이 2주 이상 지속되어 일상 기능이 떨어지는 질환입니다.\n\n## 원인과 위험 요인\n유전, 뇌 신경회로 변화, 만성 스트레스, 상실 경험, 만성 질환, 염증이 관여합니다.\n\n## 주요 증상\n우울감, 흥미 상실, 수면·식욕 변화, 피로, 집중력 저하, 무가치감.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA disorder of persistent low mood or loss of interest for at least two weeks impairing daily function.\n\n## Causes and risk factors\nInvolves genetics, brain circuit changes, chronic stress, loss, chronic illness and inflammation.\n\n## Key symptoms\nLow mood, loss of interest, sleep and appetite change, fatigue, poor concentration and worthlessness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299789000,"updated":1794299789000},{"id":"dz-gad","kind":"disease","category":"정신건강","title_ko":"범불안장애","title_orig":"Generalised anxiety disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Generalised%20anxiety%20disorder","tags":["질병 백과","불안","스트레스"],"body_ko":"## 개요\n여러 일에 대한 지나친 걱정이 6개월 이상 계속되는 질환입니다.\n\n## 원인과 위험 요인\n유전, 기질, 스트레스, 어린 시절 경험이 관여합니다.\n\n## 주요 증상\n안절부절, 피로, 집중 어려움, 짜증, 근육 긴장, 수면 장애.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nExcessive, hard-to-control worry about many things for six months or more.\n\n## Causes and risk factors\nInvolves genetics, temperament, stress and early life experiences.\n\n## Key symptoms\nRestlessness, fatigue, poor concentration, irritability, muscle tension and sleep problems.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299788000,"updated":1794299788000},{"id":"dz-panic","kind":"disease","category":"정신건강","title_ko":"공황장애","title_orig":"Panic disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Panic%20disorder","tags":["질병 백과","불안","스트레스"],"body_ko":"## 개요\n예기치 못한 공황발작이 반복되고 또 올까 봐 걱정하는 질환입니다.\n\n## 원인과 위험 요인\n유전, 스트레스, 몸의 감각에 대한 과민 해석이 관여합니다.\n\n## 주요 증상\n갑작스러운 두근거림, 숨막힘, 가슴 통증, 어지러움, 죽을 것 같은 공포.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nRecurrent unexpected panic attacks with persistent worry about further attacks.\n\n## Causes and risk factors\nInvolves genetics, stress and catastrophic interpretation of bodily sensations.\n\n## Key symptoms\nSudden palpitations, choking, chest pain, dizziness and fear of dying.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299787000,"updated":1794299787000},{"id":"dz-bipolar","kind":"disease","category":"정신건강","title_ko":"양극성 장애","title_orig":"Bipolar disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bipolar%20disorder","tags":["질병 백과","기분장애"],"body_ko":"## 개요\n조증(또는 경조증)과 우울증이 번갈아 나타나는 기분 장애입니다.\n\n## 원인과 위험 요인\n유전의 영향이 크며 수면 부족과 스트레스가 발병을 촉발합니다.\n\n## 주요 증상\n조증 시 들뜬 기분, 수면 욕구 감소, 과도한 활동·소비. 우울기에는 우울증 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mood disorder with episodes of mania (or hypomania) and depression.\n\n## Causes and risk factors\nStrongly heritable; sleep loss and stress can trigger episodes.\n\n## Key symptoms\nIn mania: elevated mood, reduced need for sleep, overactivity and overspending; depressive episodes as in depression.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299786000,"updated":1794299786000},{"id":"dz-schizo","kind":"disease","category":"정신건강","title_ko":"조현병","title_orig":"Schizophrenia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Schizophrenia","tags":["질병 백과","정신증"],"body_ko":"## 개요\n현실을 인식하는 능력이 손상되는 만성 정신 질환입니다.\n\n## 원인과 위험 요인\n유전, 뇌 발달 이상, 도파민 신호 이상이 관여하며 대마 사용과 스트레스가 위험을 높입니다.\n\n## 주요 증상\n환청, 망상, 와해된 말과 행동, 의욕 저하, 감정 둔화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic mental illness affecting perception of reality.\n\n## Causes and risk factors\nInvolves genetics, neurodevelopment and dopamine signalling; cannabis use and stress raise the risk.\n\n## Key symptoms\nHallucinations, delusions, disorganised speech and behaviour, low motivation and flattened emotion.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299785000,"updated":1794299785000},{"id":"dz-ocd","kind":"disease","category":"정신건강","title_ko":"강박장애","title_orig":"Obsessive–compulsive disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Obsessive%E2%80%93compulsive%20disorder","tags":["질병 백과","불안"],"body_ko":"## 개요\n원치 않는 생각(강박사고)과 이를 줄이려는 반복 행동(강박행동)이 생활을 방해하는 질환입니다.\n\n## 원인과 위험 요인\n유전과 뇌 회로(피질-선조체) 이상이 관여합니다.\n\n## 주요 증상\n오염 걱정과 반복 손 씻기, 확인하기, 정렬하기 등.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nUnwanted intrusive thoughts (obsessions) and repetitive behaviours (compulsions) that disrupt life.\n\n## Causes and risk factors\nInvolves genetics and cortico-striatal circuit dysfunction.\n\n## Key symptoms\nContamination fears with repeated washing, checking or ordering.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299784000,"updated":1794299784000},{"id":"dz-adhd","kind":"disease","category":"정신건강","title_ko":"주의력결핍 과잉행동장애 (ADHD)","title_orig":"Attention-deficit/hyperactivity disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Attention-deficit/hyperactivity%20disorder","tags":["질병 백과","신경발달"],"body_ko":"## 개요\n어릴 때 시작되는 부주의, 과잉행동, 충동성이 특징인 신경발달 장애로 성인까지 이어지기도 합니다.\n\n## 원인과 위험 요인\n유전의 영향이 크며 조산, 저체중 출생, 임신 중 흡연·음주 노출이 관련됩니다.\n\n## 주요 증상\n집중 어려움, 잊어버림, 가만있지 못함, 충동적 행동.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA neurodevelopmental disorder of inattention, hyperactivity and impulsivity beginning in childhood and often persisting into adulthood.\n\n## Causes and risk factors\nHighly heritable; linked to preterm birth, low birth weight and prenatal tobacco or alcohol exposure.\n\n## Key symptoms\nDifficulty focusing, forgetfulness, restlessness and impulsive behaviour.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299783000,"updated":1794299783000},{"id":"dz-insomnia","kind":"disease","category":"정신건강","title_ko":"불면증","title_orig":"Insomnia disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Insomnia%20disorder","tags":["질병 백과","수면","스트레스"],"body_ko":"## 개요\n잠들기 어렵거나 자주 깨는 상태가 주 3회 이상, 3개월 이상 계속되어 낮 기능이 떨어지는 질환입니다.\n\n## 원인과 위험 요인\n스트레스, 불안·우울, 불규칙한 생활, 카페인·음주, 통증, 잠에 대한 걱정이 악순환을 만듭니다.\n\n## 주요 증상\n잠들기 어려움, 새벽에 깸, 낮 피로, 집중력 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDifficulty falling or staying asleep at least three nights a week for three months, impairing daytime function.\n\n## Causes and risk factors\nDriven by stress, anxiety or depression, irregular schedules, caffeine, alcohol, pain and worry about sleep.\n\n## Key symptoms\nTrouble falling asleep, early waking, daytime fatigue and poor concentration.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299782000,"updated":1794299782000},{"id":"dz-aud","kind":"disease","category":"정신건강","title_ko":"알코올 사용장애","title_orig":"Alcohol use disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Alcohol%20use%20disorder","tags":["질병 백과","음주","중독"],"body_ko":"## 개요\n음주를 조절하지 못하고 해로운 결과에도 계속 마시는 질환입니다.\n\n## 원인과 위험 요인\n유전, 스트레스, 주변 음주 문화, 정신 질환 동반이 관여합니다.\n\n## 주요 증상\n음주 갈망, 내성, 금단 증상, 일·관계 문제. 간질환, 췌장염, 암 위험을 높입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInability to control drinking despite harmful consequences.\n\n## Causes and risk factors\nInvolves genetics, stress, drinking culture and co-occurring mental illness.\n\n## Key symptoms\nCraving, tolerance, withdrawal and problems at work or in relationships; raises the risk of liver disease, pancreatitis and cancer.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299781000,"updated":1794299781000},{"id":"dz-asd_aut","kind":"disease","category":"정신건강","title_ko":"자폐 스펙트럼 장애","title_orig":"Autism spectrum disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Autism%20spectrum%20disorder","tags":["질병 백과","신경발달"],"body_ko":"## 개요\n사회적 소통의 어려움과 제한적·반복적 행동이 특징인 신경발달 장애입니다.\n\n## 원인과 위험 요인\n유전의 영향이 크며 고령 부모, 조산 등이 관련됩니다. 백신은 원인이 아닙니다.\n\n## 주요 증상\n눈맞춤·상호작용의 어려움, 반복 행동, 특정 관심사 몰두, 감각 과민.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA neurodevelopmental condition with differences in social communication and restricted, repetitive behaviours.\n\n## Causes and risk factors\nHighly heritable; associated with older parental age and preterm birth. Vaccines do not cause autism.\n\n## Key symptoms\nDifferences in eye contact and social interaction, repetitive behaviours, focused interests and sensory sensitivities.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299780000,"updated":1794299780000},{"id":"dz-ptsd","kind":"disease","category":"스트레스","title_ko":"외상 후 스트레스 장애 (PTSD)","title_orig":"Post-traumatic stress disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Post-traumatic%20stress%20disorder","tags":["질병 백과","트라우마","스트레스"],"body_ko":"## 개요\n생명을 위협하는 사건을 겪은 뒤 증상이 한 달 넘게 지속되는 질환입니다.\n\n## 원인과 위험 요인\n사고, 폭력, 재난, 전쟁 등 외상 경험 뒤 생기며, 사회적 지지 부족과 이전 외상이 위험을 높입니다.\n\n## 주요 증상\n사건이 자꾸 떠오름(플래시백), 악몽, 회피, 과각성, 부정적 감정.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSymptoms persisting more than a month after a life-threatening or traumatic event.\n\n## Causes and risk factors\nFollows trauma such as accidents, violence, disasters or war; low social support and prior trauma raise the risk.\n\n## Key symptoms\nIntrusive memories and flashbacks, nightmares, avoidance, hyperarousal and negative mood.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299779000,"updated":1794299779000},{"id":"dz-asd_stress","kind":"disease","category":"스트레스","title_ko":"급성 스트레스 장애","title_orig":"Acute stress disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20stress%20disorder","tags":["질병 백과","트라우마","스트레스"],"body_ko":"## 개요\n외상 사건 직후 3일~1개월 사이에 나타나는 강한 스트레스 반응입니다.\n\n## 원인과 위험 요인\n외상 경험이 직접적 원인이며, 일부는 PTSD로 이어집니다.\n\n## 주요 증상\n멍함, 현실감 상실, 플래시백, 회피, 불면.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn intense stress reaction from 3 days to 1 month after a traumatic event.\n\n## Causes and risk factors\nDirectly caused by trauma; some go on to develop PTSD.\n\n## Key symptoms\nNumbness, detachment, flashbacks, avoidance and insomnia.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299778000,"updated":1794299778000},{"id":"dz-adjust","kind":"disease","category":"스트레스","title_ko":"적응장애","title_orig":"Adjustment disorder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Adjustment%20disorder","tags":["질병 백과","스트레스"],"body_ko":"## 개요\n이별, 실직, 이사 같은 스트레스 사건 후 예상보다 큰 정서·행동 반응이 생기는 상태입니다.\n\n## 원인과 위험 요인\n생활 변화 스트레스가 원인이며 대개 6개월 안에 좋아집니다.\n\n## 주요 증상\n우울감, 불안, 짜증, 일상 기능 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn emotional or behavioural reaction to a stressful life change that is stronger than expected.\n\n## Causes and risk factors\nTriggered by life stressors; usually resolves within six months.\n\n## Key symptoms\nLow mood, anxiety, irritability and reduced functioning.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299777000,"updated":1794299777000},{"id":"dz-burnout","kind":"disease","category":"스트레스","title_ko":"번아웃 (직업적 소진)","title_orig":"Burnout","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Burnout","tags":["질병 백과","직장","스트레스"],"body_ko":"## 개요\n세계보건기구(ICD-11)가 질병이 아닌 '직업 관련 현상'으로 분류한, 관리되지 않은 만성 업무 스트레스의 결과입니다.\n\n## 원인과 위험 요인\n과도한 업무량, 통제감 부족, 보상 부족, 불공정, 가치 충돌이 관련됩니다.\n\n## 주요 증상\n탈진감, 일에 대한 냉소와 거리감, 업무 효율 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nClassified by the WHO (ICD-11) as an occupational phenomenon, not a medical condition, resulting from unmanaged chronic workplace stress.\n\n## Causes and risk factors\nLinked to excessive workload, lack of control, insufficient reward, unfairness and value conflicts.\n\n## Key symptoms\nExhaustion, cynicism and mental distance from work, and reduced professional efficacy.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299776000,"updated":1794299776000},{"id":"dz-stresscardio","kind":"disease","category":"스트레스","title_ko":"스트레스성 심근병증 (타코츠보 증후군)","title_orig":"Takotsubo (stress) cardiomyopathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Takotsubo","tags":["질병 백과","스트레스","심장"],"body_ko":"## 개요\n강한 정신적·신체적 스트레스 뒤 심장 근육 일부가 일시적으로 약해지는 질환으로 '상심 증후군'이라고도 합니다.\n\n## 원인과 위험 요인\n급격히 늘어난 스트레스 호르몬(카테콜아민)이 원인으로 추정되며 폐경 후 여성에게 많습니다.\n\n## 주요 증상\n심근경색과 비슷한 가슴 통증과 숨참. 대부분 몇 주 안에 회복됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nTemporary weakening of part of the heart muscle after intense emotional or physical stress; also called 'broken heart syndrome'.\n\n## Causes and risk factors\nThought to result from a surge of stress hormones (catecholamines); most common in postmenopausal women.\n\n## Key symptoms\nChest pain and breathlessness mimicking a heart attack; most recover within weeks.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299775000,"updated":1794299775000},{"id":"dz-ra","kind":"disease","category":"근골격·면역","title_ko":"류마티스 관절염","title_orig":"Rheumatoid arthritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rheumatoid%20arthritis","tags":["질병 백과","자가면역","관절"],"body_ko":"## 개요\n면역 체계가 관절 활막을 공격해 관절이 붓고 파괴되는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n유전, 흡연, 여성이 위험 요인이며 잇몸병과의 관련도 연구되고 있습니다.\n\n## 주요 증상\n손가락·손목 등 여러 관절이 양쪽으로 붓고 아픔, 1시간 이상 아침 강직, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease in which the immune system attacks joint linings, causing swelling and destruction.\n\n## Causes and risk factors\nRisk factors include genetics, smoking and female sex; links to gum disease are being studied.\n\n## Key symptoms\nSymmetrical swelling and pain in small joints of the hands and wrists, morning stiffness over an hour and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299774000,"updated":1794299774000},{"id":"dz-oa","kind":"disease","category":"근골격·면역","title_ko":"골관절염 (퇴행성 관절염)","title_orig":"Osteoarthritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Osteoarthritis","tags":["질병 백과","관절","노화"],"body_ko":"## 개요\n관절 연골이 닳고 주변 뼈가 변하는 가장 흔한 관절염입니다.\n\n## 원인과 위험 요인\n나이, 비만, 관절 손상, 반복 사용, 유전이 원인입니다.\n\n## 주요 증상\n움직일 때 심해지는 무릎·엉덩이·손 관절 통증, 짧은 아침 강직, 관절 변형.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common arthritis, with cartilage loss and changes in underlying bone.\n\n## Causes and risk factors\nLinked to age, obesity, joint injury, repetitive use and genetics.\n\n## Key symptoms\nPain in knees, hips or hands worse with use, brief morning stiffness and joint deformity.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299773000,"updated":1794299773000},{"id":"dz-sle","kind":"disease","category":"근골격·면역","title_ko":"전신홍반루푸스","title_orig":"Systemic lupus erythematosus","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Systemic%20lupus%20erythematosus","tags":["질병 백과","자가면역"],"body_ko":"## 개요\n피부, 관절, 콩팥, 혈액 등 여러 장기를 공격하는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n가임기 여성에게 많으며 유전, 호르몬, 자외선, 일부 약물이 관여합니다.\n\n## 주요 증상\n얼굴 나비 모양 발진, 관절통, 피로, 열, 광과민성, 단백뇨.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease affecting skin, joints, kidneys, blood and other organs.\n\n## Causes and risk factors\nMost common in women of childbearing age; involves genetics, hormones, UV light and some drugs.\n\n## Key symptoms\nButterfly facial rash, joint pain, fatigue, fever, photosensitivity and protein in urine.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299772000,"updated":1794299772000},{"id":"dz-as_spine","kind":"disease","category":"근골격·면역","title_ko":"강직성 척추염","title_orig":"Ankylosing spondylitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ankylosing%20spondylitis","tags":["질병 백과","자가면역","척추"],"body_ko":"## 개요\n척추와 골반 관절에 만성 염증이 생겨 척추가 굳을 수 있는 질환입니다.\n\n## 원인과 위험 요인\nHLA-B27 유전자와 강하게 관련되며 젊은 남성에게 많습니다.\n\n## 주요 증상\n아침에 심하고 움직이면 나아지는 허리 통증과 강직, 눈 포도막염.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nChronic inflammation of the spine and sacroiliac joints that can fuse the spine.\n\n## Causes and risk factors\nStrongly associated with HLA-B27; more common in young men.\n\n## Key symptoms\nBack pain and stiffness worse in the morning and better with exercise, and uveitis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299771000,"updated":1794299771000},{"id":"dz-sjogren","kind":"disease","category":"근골격·면역","title_ko":"쇼그렌 증후군","title_orig":"Sjögren's syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sj%C3%B6gren%27s%20syndrome","tags":["질병 백과","자가면역"],"body_ko":"## 개요\n침샘과 눈물샘을 공격하는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n중년 여성에게 많고 다른 자가면역 질환과 동반되기도 합니다.\n\n## 주요 증상\n입 마름, 눈 마름, 피로, 관절통.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease targeting the salivary and tear glands.\n\n## Causes and risk factors\nMost common in middle-aged women; may accompany other autoimmune diseases.\n\n## Key symptoms\nDry mouth, dry eyes, fatigue and joint pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299770000,"updated":1794299770000},{"id":"dz-ssc","kind":"disease","category":"근골격·면역","title_ko":"전신경화증","title_orig":"Systemic sclerosis (scleroderma)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Systemic%20sclerosis","tags":["질병 백과","자가면역"],"body_ko":"## 개요\n피부와 내부 장기가 섬유화되어 딱딱해지는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n원인은 불명이며 면역, 혈관, 섬유화 이상이 함께 관여합니다.\n\n## 주요 증상\n레이노 현상, 손가락 피부가 두꺼워짐, 삼킴 곤란, 폐섬유증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease with fibrosis and hardening of skin and internal organs.\n\n## Causes and risk factors\nCause unknown; immune, vascular and fibrotic processes are involved.\n\n## Key symptoms\nRaynaud's phenomenon, thickened finger skin, swallowing difficulty and lung fibrosis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299769000,"updated":1794299769000},{"id":"dz-fibro","kind":"disease","category":"근골격·면역","title_ko":"섬유근육통","title_orig":"Fibromyalgia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Fibromyalgia","tags":["질병 백과","통증","스트레스"],"body_ko":"## 개요\n온몸의 만성 통증과 피로, 수면 장애가 특징인 질환입니다.\n\n## 원인과 위험 요인\n중추신경계의 통증 처리 과민(중추 감작)이 핵심이며 스트레스, 수면 부족, 외상이 관여합니다.\n\n## 주요 증상\n온몸 통증, 피로, 개운하지 않은 잠, 인지 저하('섬유 안개').\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA condition of chronic widespread pain, fatigue and sleep disturbance.\n\n## Causes and risk factors\nCentral sensitisation of pain processing is key; stress, poor sleep and trauma contribute.\n\n## Key symptoms\nWidespread pain, fatigue, unrefreshing sleep and cognitive difficulties ('fibro fog').\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299768000,"updated":1794299768000},{"id":"dz-psa","kind":"disease","category":"근골격·면역","title_ko":"건선 관절염","title_orig":"Psoriatic arthritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Psoriatic%20arthritis","tags":["질병 백과","자가면역","피부"],"body_ko":"## 개요\n건선 환자에게 생기는 염증성 관절염입니다.\n\n## 원인과 위험 요인\n유전과 면역 이상이 관여합니다.\n\n## 주요 증상\n관절 통증과 부기, 손가락 전체가 붓는 소시지 손가락, 손발톱 변화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inflammatory arthritis that occurs in people with psoriasis.\n\n## Causes and risk factors\nInvolves genetics and immune dysregulation.\n\n## Key symptoms\nJoint pain and swelling, 'sausage' fingers or toes and nail changes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299767000,"updated":1794299767000},{"id":"dz-pmr","kind":"disease","category":"근골격·면역","title_ko":"류마티스성 다발근육통","title_orig":"Polymyalgia rheumatica","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Polymyalgia%20rheumatica","tags":["질병 백과","염증","노인"],"body_ko":"## 개요\n노인의 어깨와 엉덩이 주변에 통증과 강직이 생기는 염증 질환입니다.\n\n## 원인과 위험 요인\n50세 이상에서 생기며 거대세포동맥염과 함께 오기도 합니다.\n\n## 주요 증상\n아침에 심한 양쪽 어깨·엉덩이 통증과 강직.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inflammatory condition causing pain and stiffness around the shoulders and hips in older adults.\n\n## Causes and risk factors\nOccurs after age 50 and can coexist with giant cell arteritis.\n\n## Key symptoms\nMorning pain and stiffness in both shoulders and hips.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299766000,"updated":1794299766000},{"id":"dz-gca","kind":"disease","category":"근골격·면역","title_ko":"거대세포동맥염","title_orig":"Giant cell arteritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Giant%20cell%20arteritis","tags":["질병 백과","혈관염"],"body_ko":"## 개요\n머리 쪽 큰 동맥에 염증이 생기는 혈관염입니다.\n\n## 원인과 위험 요인\n50세 이상에서 생깁니다.\n\n## 주요 증상\n새로운 두통, 관자놀이 압통, 씹을 때 턱 통증, 갑작스러운 시력 소실 위험.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of large arteries, especially in the head.\n\n## Causes and risk factors\nOccurs in people over 50.\n\n## Key symptoms\nNew headache, scalp tenderness, jaw pain on chewing and risk of sudden vision loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299765000,"updated":1794299765000},{"id":"dz-kawasaki","kind":"disease","category":"근골격·면역","title_ko":"가와사키병","title_orig":"Kawasaki disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Kawasaki%20disease","tags":["질병 백과","소아","혈관염","한국"],"body_ko":"## 개요\n5세 이하 어린이에게 생기는 전신 혈관염으로, 한국과 일본에서 많습니다.\n\n## 원인과 위험 요인\n원인은 밝혀지지 않았으며 감염 자극에 대한 면역 반응으로 추정됩니다.\n\n## 주요 증상\n5일 이상 고열, 눈 충혈, 딸기 혀, 손발 부종, 발진, 목 림프절 비대. 관상동맥류가 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA systemic vasculitis of children under five, common in Korea and Japan.\n\n## Causes and risk factors\nCause unknown; thought to be an immune response to an infectious trigger.\n\n## Key symptoms\nFever over five days, red eyes, strawberry tongue, swollen hands and feet, rash and neck lymph nodes; can cause coronary aneurysms.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299764000,"updated":1794299764000},{"id":"dz-behcet","kind":"disease","category":"근골격·면역","title_ko":"베체트병","title_orig":"Behçet's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Beh%C3%A7et%27s%20disease","tags":["질병 백과","혈관염","한국"],"body_ko":"## 개요\n입·생식기 궤양과 눈 염증이 반복되는 혈관염입니다.\n\n## 원인과 위험 요인\n실크로드 지역(터키, 중동, 한국, 일본)에 많고 HLA-B51과 관련됩니다.\n\n## 주요 증상\n반복되는 구강 궤양, 생식기 궤양, 포도막염, 피부 병변.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA vasculitis with recurrent mouth and genital ulcers and eye inflammation.\n\n## Causes and risk factors\nCommon along the Silk Road (Turkey, Middle East, Korea, Japan) and associated with HLA-B51.\n\n## Key symptoms\nRecurrent mouth and genital ulcers, uveitis and skin lesions.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299763000,"updated":1794299763000},{"id":"dz-hnp","kind":"disease","category":"근골격·면역","title_ko":"요추 추간판 탈출증 (허리 디스크)","title_orig":"Lumbar disc herniation","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Lumbar%20disc%20herniation","tags":["질병 백과","척추","통증"],"body_ko":"## 개요\n허리 디스크의 수핵이 튀어나와 신경을 누르는 질환입니다.\n\n## 원인과 위험 요인\n퇴행, 무거운 물건 들기, 흡연, 비만이 관련됩니다.\n\n## 주요 증상\n허리 통증과 다리로 뻗치는 통증(좌골신경통), 저림. 대부분 보존 치료로 좋아집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nProtrusion of a lumbar disc pressing on a nerve root.\n\n## Causes and risk factors\nLinked to degeneration, heavy lifting, smoking and obesity.\n\n## Key symptoms\nBack pain with pain shooting down the leg (sciatica) and numbness; most improve with conservative care.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299762000,"updated":1794299762000},{"id":"dz-frozen","kind":"disease","category":"근골격·면역","title_ko":"유착성 관절낭염 (오십견)","title_orig":"Frozen shoulder (adhesive capsulitis)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Frozen%20shoulder","tags":["질병 백과","어깨","당뇨"],"body_ko":"## 개요\n어깨 관절막이 두꺼워지고 굳어 움직임이 제한되는 질환입니다.\n\n## 원인과 위험 요인\n40~60대, 당뇨병, 갑상선 질환이 위험 요인입니다.\n\n## 주요 증상\n어깨 통증과 모든 방향의 움직임 제한. 1~3년에 걸쳐 회복됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThickening and stiffening of the shoulder capsule restricting movement.\n\n## Causes and risk factors\nRisk factors include age 40–60, diabetes and thyroid disease.\n\n## Key symptoms\nShoulder pain and restricted movement in all directions, recovering over 1–3 years.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299761000,"updated":1794299761000},{"id":"dz-sarcopenia","kind":"disease","category":"근골격·면역","title_ko":"근감소증","title_orig":"Sarcopenia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sarcopenia","tags":["질병 백과","노화","근육"],"body_ko":"## 개요\n나이가 들며 근육량과 근력이 병적으로 줄어드는 질환입니다.\n\n## 원인과 위험 요인\n노화, 운동 부족, 단백질 섭취 부족, 만성 질환이 원인입니다.\n\n## 주요 증상\n걷는 속도 저하, 쉽게 지침, 넘어짐, 일상 활동 어려움.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAge-related loss of muscle mass and strength.\n\n## Causes and risk factors\nCaused by ageing, inactivity, low protein intake and chronic disease.\n\n## Key symptoms\nSlow walking, weakness, falls and difficulty with daily activities.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299760000,"updated":1794299760000},{"id":"dz-ckd","kind":"disease","category":"신장·비뇨","title_ko":"만성 콩팥병","title_orig":"Chronic kidney disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chronic%20kidney%20disease","tags":["질병 백과","콩팥","성인병"],"body_ko":"## 개요\n콩팥 기능이 3개월 이상 떨어져 있거나 콩팥 손상이 지속되는 상태입니다.\n\n## 원인과 위험 요인\n당뇨병과 고혈압이 가장 흔한 원인이며 사구체신염, 다낭신도 원인입니다.\n\n## 주요 증상\n초기 증상이 거의 없고, 진행하면 부종, 피로, 빈혈, 가려움. 말기에는 투석이 필요합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nReduced kidney function or kidney damage lasting more than three months.\n\n## Causes and risk factors\nDiabetes and hypertension are the commonest causes; glomerulonephritis and polycystic kidney disease are others.\n\n## Key symptoms\nSilent early; later swelling, fatigue, anaemia and itching; end-stage disease needs dialysis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299759000,"updated":1794299759000},{"id":"dz-aki","kind":"disease","category":"신장·비뇨","title_ko":"급성 신손상","title_orig":"Acute kidney injury","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20kidney%20injury","tags":["질병 백과","콩팥","응급"],"body_ko":"## 개요\n콩팥 기능이 며칠 안에 갑자기 떨어지는 상태입니다.\n\n## 원인과 위험 요인\n탈수, 패혈증, 수술, 소염진통제·조영제 등 약물, 요로 막힘이 원인입니다.\n\n## 주요 증상\n소변량 감소, 부종, 피로, 혼란.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sudden fall in kidney function over hours to days.\n\n## Causes and risk factors\nCaused by dehydration, sepsis, surgery, drugs such as NSAIDs or contrast, and urinary obstruction.\n\n## Key symptoms\nReduced urine output, swelling, fatigue and confusion.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299758000,"updated":1794299758000},{"id":"dz-iga","kind":"disease","category":"신장·비뇨","title_ko":"IgA 신병증","title_orig":"IgA nephropathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=IgA%20nephropathy","tags":["질병 백과","콩팥","면역"],"body_ko":"## 개요\n면역글로불린 A가 콩팥 사구체에 쌓여 염증을 일으키는 가장 흔한 사구체신염으로, 동아시아에 많습니다.\n\n## 원인과 위험 요인\n면역 이상이 원인이며 감기 등 감염 뒤 악화되기도 합니다.\n\n## 주요 증상\n감기 직후 콜라색 혈뇨, 현미경적 혈뇨, 단백뇨, 고혈압.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common glomerulonephritis, with IgA deposits in the glomeruli, especially prevalent in East Asia.\n\n## Causes and risk factors\nCaused by immune abnormalities; flares often follow infections such as colds.\n\n## Key symptoms\nCola-coloured urine soon after a cold, microscopic haematuria, proteinuria and hypertension.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299757000,"updated":1794299757000},{"id":"dz-nephrotic","kind":"disease","category":"신장·비뇨","title_ko":"신증후군","title_orig":"Nephrotic syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Nephrotic%20syndrome","tags":["질병 백과","콩팥"],"body_ko":"## 개요\n콩팥으로 단백질이 대량으로 빠져나가는 상태입니다.\n\n## 원인과 위험 요인\n소아는 미세변화병, 성인은 막성 신병증·당뇨병 등이 원인입니다.\n\n## 주요 증상\n심한 부종(눈 주위, 다리), 거품뇨, 고지혈증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nHeavy loss of protein in the urine.\n\n## Causes and risk factors\nMinimal change disease in children; membranous nephropathy and diabetes in adults.\n\n## Key symptoms\nMarked swelling (around the eyes and legs), frothy urine and high cholesterol.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299756000,"updated":1794299756000},{"id":"dz-adpkd","kind":"disease","category":"신장·비뇨","title_ko":"상염색체 우성 다낭신","title_orig":"Autosomal dominant polycystic kidney disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Autosomal%20dominant%20polycystic%20kidney%20disease","tags":["질병 백과","유전","콩팥"],"body_ko":"## 개요\n양쪽 콩팥에 물혹이 많이 생겨 콩팥 기능이 떨어지는 유전 질환입니다.\n\n## 원인과 위험 요인\nPKD1 또는 PKD2 유전자 변이가 원인입니다.\n\n## 주요 증상\n고혈압, 옆구리 통증, 혈뇨, 콩팥 기능 저하. 뇌동맥류가 동반될 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited disease with many cysts in both kidneys leading to kidney failure.\n\n## Causes and risk factors\nCaused by PKD1 or PKD2 mutations.\n\n## Key symptoms\nHypertension, flank pain, blood in urine and declining kidney function; brain aneurysms may coexist.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299755000,"updated":1794299755000},{"id":"dz-kidneystone","kind":"disease","category":"신장·비뇨","title_ko":"요로결석","title_orig":"Kidney stones","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Kidney%20stones","tags":["질병 백과","콩팥","수분"],"body_ko":"## 개요\n소변 속 물질이 뭉쳐 콩팥이나 요관에 돌이 생기는 질환입니다.\n\n## 원인과 위험 요인\n수분 부족, 짠 음식, 동물성 단백질 과다, 비만, 통풍, 부갑상선기능항진증이 원인입니다.\n\n## 주요 증상\n옆구리에서 아랫배로 뻗치는 극심한 통증, 혈뇨, 구역.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nHard deposits forming in the kidneys or ureters.\n\n## Causes and risk factors\nLinked to low fluid intake, salty diets, high animal protein, obesity, gout and hyperparathyroidism.\n\n## Key symptoms\nSevere colicky flank pain radiating to the groin, blood in urine and nausea.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299754000,"updated":1794299754000},{"id":"dz-bph","kind":"disease","category":"신장·비뇨","title_ko":"양성 전립선 비대증","title_orig":"Benign prostatic hyperplasia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Benign%20prostatic%20hyperplasia","tags":["질병 백과","남성","노화"],"body_ko":"## 개요\n나이가 들며 전립선이 커져 소변 길을 누르는 질환입니다.\n\n## 원인과 위험 요인\n나이와 남성호르몬이 관여합니다.\n\n## 주요 증상\n약한 소변 줄기, 잦은 소변, 야간뇨, 잔뇨감.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAge-related enlargement of the prostate obstructing urine flow.\n\n## Causes and risk factors\nDriven by ageing and male hormones.\n\n## Key symptoms\nWeak stream, frequency, night-time urination and incomplete emptying.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299753000,"updated":1794299753000},{"id":"dz-oab","kind":"disease","category":"신장·비뇨","title_ko":"과민성 방광","title_orig":"Overactive bladder","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Overactive%20bladder","tags":["질병 백과","방광"],"body_ko":"## 개요\n갑자기 참기 어려운 요의(절박뇨)가 반복되는 질환입니다.\n\n## 원인과 위험 요인\n방광 근육의 과민성, 나이, 신경 질환, 비만이 관련됩니다.\n\n## 주요 증상\n절박뇨, 빈뇨, 야간뇨, 절박성 요실금.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nRecurrent sudden, hard-to-defer urges to urinate.\n\n## Causes and risk factors\nLinked to detrusor overactivity, age, neurological disease and obesity.\n\n## Key symptoms\nUrgency, frequency, nocturia and urge incontinence.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299752000,"updated":1794299752000},{"id":"dz-dkd","kind":"disease","category":"신장·비뇨","title_ko":"당뇨병성 신증","title_orig":"Diabetic kidney disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diabetic%20kidney%20disease","tags":["질병 백과","당뇨","콩팥"],"body_ko":"## 개요\n당뇨병으로 콩팥 사구체가 손상되는 합병증으로, 투석의 가장 흔한 원인입니다.\n\n## 원인과 위험 요인\n오랜 고혈당과 고혈압이 원인입니다.\n\n## 주요 증상\n초기엔 미세알부민뇨만 있고, 진행하면 부종과 콩팥 기능 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nKidney damage from diabetes; the leading cause of dialysis.\n\n## Causes and risk factors\nCaused by long-standing high blood glucose and hypertension.\n\n## Key symptoms\nEarly microalbuminuria only; later swelling and declining kidney function.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299751000,"updated":1794299751000},{"id":"dz-ad","kind":"disease","category":"피부·알레르기","title_ko":"아토피 피부염","title_orig":"Atopic dermatitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Atopic%20dermatitis","tags":["질병 백과","알레르기","피부"],"body_ko":"## 개요\n가려움과 습진이 반복되는 만성 염증성 피부 질환입니다.\n\n## 원인과 위험 요인\n피부 장벽 이상(필라그린 변이 등), 면역 이상, 유전, 환경이 관여합니다.\n\n## 주요 증상\n심한 가려움, 건조하고 붉은 피부, 팔꿈치 안쪽·무릎 뒤 습진.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory skin disease with itchy, recurrent eczema.\n\n## Causes and risk factors\nInvolves skin barrier defects (e.g. filaggrin mutations), immune dysregulation, genetics and environment.\n\n## Key symptoms\nIntense itching, dry red skin and eczema in elbow and knee creases.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299750000,"updated":1794299750000},{"id":"dz-psoriasis","kind":"disease","category":"피부·알레르기","title_ko":"건선","title_orig":"Psoriasis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Psoriasis","tags":["질병 백과","자가면역","스트레스"],"body_ko":"## 개요\n피부 세포가 너무 빨리 자라 두꺼운 은백색 각질 판이 생기는 면역 매개 질환입니다.\n\n## 원인과 위험 요인\n유전, 면역(IL-17/IL-23 경로), 스트레스, 감염, 흡연, 비만이 관여합니다.\n\n## 주요 증상\n팔꿈치·무릎·두피의 붉고 두꺼운 각질 판, 손발톱 변화. 대사 질환과 관련됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn immune-mediated disease with thick, silvery scaly plaques from rapid skin cell turnover.\n\n## Causes and risk factors\nInvolves genetics, IL-17/IL-23 immune pathways, stress, infections, smoking and obesity.\n\n## Key symptoms\nRed, thick, scaly plaques on elbows, knees and scalp, and nail changes; linked to metabolic disease.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299749000,"updated":1794299749000},{"id":"dz-urticaria","kind":"disease","category":"피부·알레르기","title_ko":"두드러기","title_orig":"Urticaria","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Urticaria","tags":["질병 백과","알레르기"],"body_ko":"## 개요\n피부가 부풀어 오르고 가려운 팽진이 생기는 질환입니다.\n\n## 원인과 위험 요인\n급성은 음식, 약물, 감염, 만성(6주 이상)은 자가면역이나 원인 불명이 많습니다.\n\n## 주요 증상\n가렵고 붉게 부푼 팽진이 수시간 안에 사라졌다 다시 생김, 입술·눈꺼풀 부기.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nItchy raised wheals on the skin.\n\n## Causes and risk factors\nAcute cases follow foods, drugs or infections; chronic cases (over six weeks) are often autoimmune or idiopathic.\n\n## Key symptoms\nItchy red wheals that fade within hours and recur, sometimes with lip or eyelid swelling.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299748000,"updated":1794299748000},{"id":"dz-acne","kind":"disease","category":"피부·알레르기","title_ko":"여드름","title_orig":"Acne vulgaris","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acne%20vulgaris","tags":["질병 백과","피부","호르몬"],"body_ko":"## 개요\n모낭과 피지샘에 생기는 흔한 염증성 피부 질환입니다.\n\n## 원인과 위험 요인\n피지 과다, 모공 막힘, 큐티박테리움 아크네스균, 호르몬이 관여합니다.\n\n## 주요 증상\n면포, 붉은 구진, 고름집, 결절과 흉터.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA common inflammatory disease of hair follicles and sebaceous glands.\n\n## Causes and risk factors\nInvolves excess sebum, blocked pores, Cutibacterium acnes and hormones.\n\n## Key symptoms\nComedones, red papules, pustules, nodules and scarring.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299747000,"updated":1794299747000},{"id":"dz-vitiligo","kind":"disease","category":"피부·알레르기","title_ko":"백반증","title_orig":"Vitiligo","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Vitiligo","tags":["질병 백과","자가면역","피부"],"body_ko":"## 개요\n피부의 색소 세포가 파괴되어 흰 반점이 생기는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n유전과 자가면역이 원인입니다.\n\n## 주요 증상\n경계가 뚜렷한 흰 피부 반점.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune loss of pigment cells producing white skin patches.\n\n## Causes and risk factors\nCaused by genetics and autoimmunity.\n\n## Key symptoms\nWell-defined white patches of skin.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299746000,"updated":1794299746000},{"id":"dz-aa","kind":"disease","category":"피부·알레르기","title_ko":"원형 탈모증","title_orig":"Alopecia areata","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Alopecia%20areata","tags":["질병 백과","자가면역","스트레스"],"body_ko":"## 개요\n면역 체계가 모낭을 공격해 동그랗게 머리카락이 빠지는 질환입니다.\n\n## 원인과 위험 요인\n유전과 자가면역이 원인이며 스트레스가 악화 요인이 될 수 있습니다.\n\n## 주요 증상\n동전 모양의 갑작스러운 탈모, 손발톱 함몰.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune attack on hair follicles causing round patches of hair loss.\n\n## Causes and risk factors\nCaused by genetics and autoimmunity; stress may trigger flares.\n\n## Key symptoms\nSudden coin-shaped bald patches and nail pitting.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299745000,"updated":1794299745000},{"id":"dz-rosacea","kind":"disease","category":"피부·알레르기","title_ko":"주사 (딸기코)","title_orig":"Rosacea","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rosacea","tags":["질병 백과","피부"],"body_ko":"## 개요\n얼굴 중앙이 붉어지고 혈관이 보이는 만성 염증성 피부 질환입니다.\n\n## 원인과 위험 요인\n혈관 반응성, 면역, 모낭충이 관여하며 열, 음주, 매운 음식, 자외선이 악화시킵니다.\n\n## 주요 증상\n얼굴 홍조, 화끈거림, 구진·고름집, 코가 두꺼워짐.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory condition of facial redness and visible vessels.\n\n## Causes and risk factors\nInvolves vascular reactivity, immunity and Demodex mites; worsened by heat, alcohol, spicy food and sunlight.\n\n## Key symptoms\nFacial flushing, burning, papules and pustules, and thickened nose.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299744000,"updated":1794299744000},{"id":"dz-anaphylaxis","kind":"disease","category":"피부·알레르기","title_ko":"아나필락시스","title_orig":"Anaphylaxis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Anaphylaxis","tags":["질병 백과","응급","알레르기"],"body_ko":"## 개요\n몇 분 안에 온몸에 생기는 생명을 위협하는 알레르기 반응입니다.\n\n## 원인과 위험 요인\n음식(땅콩, 갑각류 등), 벌 독, 약물(항생제, 진통제)이 흔한 원인입니다.\n\n## 주요 증상\n두드러기, 입술·목 부기, 숨참, 쌕쌕거림, 혈압 저하, 실신. 에피네프린 주사가 1차 치료입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA severe, life-threatening systemic allergic reaction developing within minutes.\n\n## Causes and risk factors\nCommon triggers are foods (peanuts, shellfish), insect stings and drugs (antibiotics, painkillers).\n\n## Key symptoms\nHives, lip and throat swelling, breathlessness, wheezing, low blood pressure and collapse; adrenaline is first-line treatment.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299743000,"updated":1794299743000},{"id":"dz-foodallergy","kind":"disease","category":"피부·알레르기","title_ko":"식품 알레르기","title_orig":"Food allergy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Food%20allergy","tags":["질병 백과","알레르기"],"body_ko":"## 개요\n특정 음식 단백질에 면역 체계가 과민 반응하는 질환입니다.\n\n## 원인과 위험 요인\n우유, 달걀, 땅콩, 견과류, 갑각류, 밀, 메밀 등이 흔한 원인이며 아토피와 관련됩니다.\n\n## 주요 증상\n두드러기, 입술 부기, 구토, 쌕쌕거림, 심하면 아나필락시스.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn immune overreaction to specific food proteins.\n\n## Causes and risk factors\nCommon triggers include milk, egg, peanut, tree nuts, shellfish, wheat and buckwheat; associated with atopy.\n\n## Key symptoms\nHives, lip swelling, vomiting, wheezing or anaphylaxis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299742000,"updated":1794299742000},{"id":"dz-contactderm","kind":"disease","category":"피부·알레르기","title_ko":"접촉 피부염","title_orig":"Contact dermatitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Contact%20dermatitis","tags":["질병 백과","피부","알레르기"],"body_ko":"## 개요\n피부에 닿은 물질 때문에 생기는 피부염입니다.\n\n## 원인과 위험 요인\n자극물(세제, 물)이나 알레르겐(니켈, 향료, 고무, 옻)이 원인입니다.\n\n## 주요 증상\n닿은 부위의 붉음, 가려움, 물집, 각질.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nSkin inflammation caused by substances touching the skin.\n\n## Causes and risk factors\nCaused by irritants (detergents, water) or allergens (nickel, fragrances, rubber, lacquer tree).\n\n## Key symptoms\nRedness, itching, blisters and scaling where the substance touched.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299741000,"updated":1794299741000},{"id":"dz-ida","kind":"disease","category":"혈액","title_ko":"철결핍성 빈혈","title_orig":"Iron-deficiency anaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Iron-deficiency%20anaemia","tags":["질병 백과","철분","피로"],"body_ko":"## 개요\n철분이 부족해 헤모글로빈을 충분히 만들지 못하는 가장 흔한 빈혈입니다.\n\n## 원인과 위험 요인\n월경·위장관 출혈, 임신, 섭취 부족, 흡수 장애가 원인입니다. 남성·폐경 여성은 위장관 출혈을 확인해야 합니다.\n\n## 주요 증상\n피로, 창백함, 숨참, 두근거림, 얼음 먹고 싶음.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common anaemia, from insufficient iron to make haemoglobin.\n\n## Causes and risk factors\nCaused by menstrual or gastrointestinal blood loss, pregnancy, poor intake or malabsorption; in men and postmenopausal women gut bleeding must be ruled out.\n\n## Key symptoms\nFatigue, pallor, breathlessness, palpitations and craving for ice.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299740000,"updated":1794299740000},{"id":"dz-b12","kind":"disease","category":"혈액","title_ko":"비타민 B12 결핍 (악성 빈혈)","title_orig":"Vitamin B12 deficiency (pernicious anaemia)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Vitamin%20B12%20deficiency","tags":["질병 백과","비타민","신경"],"body_ko":"## 개요\n비타민 B12 부족으로 큰 적혈구 빈혈과 신경 손상이 생기는 질환입니다.\n\n## 원인과 위험 요인\n자가면역 위염(악성 빈혈), 위 절제, 메트포르민·위산억제제 장기 복용, 엄격한 채식이 원인입니다.\n\n## 주요 증상\n피로, 혀 통증, 손발 저림, 균형 장애, 기억력 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDeficiency of vitamin B12 causing large-cell anaemia and nerve damage.\n\n## Causes and risk factors\nCaused by autoimmune gastritis (pernicious anaemia), gastrectomy, long-term metformin or acid suppressants, and strict vegan diets.\n\n## Key symptoms\nFatigue, sore tongue, tingling hands and feet, imbalance and memory problems.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299739000,"updated":1794299739000},{"id":"dz-scd","kind":"disease","category":"혈액","title_ko":"겸상적혈구병","title_orig":"Sickle cell disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sickle%20cell%20disease","tags":["질병 백과","유전"],"body_ko":"## 개요\n헤모글로빈 유전자 변이로 적혈구가 낫 모양으로 변해 혈관을 막는 유전 질환입니다.\n\n## 원인과 위험 요인\nHBB 유전자 변이를 부모 양쪽에서 물려받아 생기며 아프리카계에 많습니다.\n\n## 주요 증상\n극심한 통증 발작, 빈혈, 감염, 뇌졸중.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited haemoglobin disorder in which red cells sickle and block blood vessels.\n\n## Causes and risk factors\nCaused by inheriting HBB mutations from both parents; common in people of African descent.\n\n## Key symptoms\nSevere pain crises, anaemia, infections and stroke.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299738000,"updated":1794299738000},{"id":"dz-thal","kind":"disease","category":"혈액","title_ko":"지중해빈혈 (탈라세미아)","title_orig":"Thalassaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Thalassaemia","tags":["질병 백과","유전","빈혈"],"body_ko":"## 개요\n헤모글로빈을 이루는 글로빈 사슬이 부족하게 만들어지는 유전성 빈혈입니다.\n\n## 원인과 위험 요인\n지중해, 중동, 동남아, 남아시아계에 많습니다.\n\n## 주요 증상\n가벼운 경우 증상이 없고, 중증이면 심한 빈혈과 수혈 의존.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited anaemia from reduced production of globin chains.\n\n## Causes and risk factors\nCommon in Mediterranean, Middle Eastern, Southeast and South Asian populations.\n\n## Key symptoms\nMild forms are silent; severe forms cause profound anaemia and transfusion dependence.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299737000,"updated":1794299737000},{"id":"dz-hemophilia","kind":"disease","category":"혈액","title_ko":"혈우병","title_orig":"Haemophilia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Haemophilia","tags":["질병 백과","유전","출혈"],"body_ko":"## 개요\n혈액 응고 인자(8번 또는 9번)가 부족해 피가 잘 멈추지 않는 유전 질환입니다.\n\n## 원인과 위험 요인\nX 염색체 열성으로 유전되어 주로 남성에게 생깁니다.\n\n## 주요 증상\n관절·근육 출혈, 멍, 상처나 수술 후 지혈 곤란.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited deficiency of clotting factor VIII or IX causing prolonged bleeding.\n\n## Causes and risk factors\nX-linked recessive, so mainly affects males.\n\n## Key symptoms\nBleeding into joints and muscles, bruising and prolonged bleeding after injury or surgery.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299736000,"updated":1794299736000},{"id":"dz-itp","kind":"disease","category":"혈액","title_ko":"면역 혈소판 감소증 (ITP)","title_orig":"Immune thrombocytopenia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Immune%20thrombocytopenia","tags":["질병 백과","자가면역","출혈"],"body_ko":"## 개요\n면역 체계가 혈소판을 파괴해 혈소판이 줄어드는 질환입니다.\n\n## 원인과 위험 요인\n어린이는 바이러스 감염 후, 성인은 만성으로 오는 경우가 많습니다.\n\n## 주요 증상\n점 같은 출혈 반점, 멍, 잇몸·코피.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAutoimmune destruction of platelets causing a low platelet count.\n\n## Causes and risk factors\nOften follows viral infection in children; tends to be chronic in adults.\n\n## Key symptoms\nPinpoint bleeding spots, bruising and gum or nose bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299735000,"updated":1794299735000},{"id":"dz-aplastic","kind":"disease","category":"혈액","title_ko":"재생불량성 빈혈","title_orig":"Aplastic anaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Aplastic%20anaemia","tags":["질병 백과","골수"],"body_ko":"## 개요\n골수가 혈액세포를 충분히 만들지 못하는 질환입니다.\n\n## 원인과 위험 요인\n대부분 면역 매개이며 약물, 화학물질(벤젠), 바이러스 감염도 원인입니다.\n\n## 주요 증상\n피로, 감염, 출혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBone marrow failure to produce enough blood cells.\n\n## Causes and risk factors\nMostly immune-mediated; also caused by drugs, chemicals such as benzene and viral infections.\n\n## Key symptoms\nFatigue, infections and bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299734000,"updated":1794299734000},{"id":"dz-pv","kind":"disease","category":"혈액","title_ko":"진성 적혈구 증가증","title_orig":"Polycythaemia vera","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Polycythaemia%20vera","tags":["질병 백과","골수","혈전"],"body_ko":"## 개요\n골수에서 적혈구가 지나치게 만들어지는 혈액 질환(골수증식종양)입니다.\n\n## 원인과 위험 요인\n대부분 JAK2 유전자 변이가 원인입니다.\n\n## 주요 증상\n두통, 어지러움, 목욕 후 가려움, 얼굴 붉음, 혈전 위험.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA myeloproliferative neoplasm with excess red blood cell production.\n\n## Causes and risk factors\nUsually caused by a JAK2 mutation.\n\n## Key symptoms\nHeadache, dizziness, itching after bathing, facial redness and clotting risk.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299733000,"updated":1794299733000},{"id":"dz-hemochrom","kind":"disease","category":"혈액","title_ko":"유전성 혈색소증","title_orig":"Hereditary haemochromatosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hereditary%20haemochromatosis","tags":["질병 백과","유전","철분"],"body_ko":"## 개요\n몸에 철분이 과다하게 흡수되어 장기에 쌓이는 유전 질환입니다. 북유럽계에 흔하고 한국인에게는 드뭅니다.\n\n## 원인과 위험 요인\nHFE 유전자 변이가 가장 흔한 원인입니다.\n\n## 주요 증상\n피로, 관절통, 피부가 검어짐, 간질환, 당뇨병.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited disorder of excess iron absorption and organ deposition; common in Northern Europeans and rare in Koreans.\n\n## Causes and risk factors\nMost commonly caused by HFE mutations.\n\n## Key symptoms\nFatigue, joint pain, skin darkening, liver disease and diabetes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299732000,"updated":1794299732000},{"id":"dz-glaucoma","kind":"disease","category":"눈·귀","title_ko":"녹내장","title_orig":"Glaucoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Glaucoma","tags":["질병 백과","눈","실명"],"body_ko":"## 개요\n시신경이 점차 손상되어 시야가 좁아지는 질환으로, 실명의 주요 원인입니다.\n\n## 원인과 위험 요인\n높은 안압, 나이, 가족력, 근시가 위험 요인입니다. 한국인은 정상 안압 녹내장이 많습니다.\n\n## 주요 증상\n초기 증상이 거의 없고 주변 시야부터 좁아집니다. 급성 폐쇄각 녹내장은 심한 눈 통증과 두통을 일으킵니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nProgressive optic nerve damage narrowing the visual field; a leading cause of blindness.\n\n## Causes and risk factors\nRisk factors include raised eye pressure, age, family history and myopia; normal-tension glaucoma is common in Koreans.\n\n## Key symptoms\nUsually silent until peripheral vision is lost; acute angle-closure causes severe eye pain and headache.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299731000,"updated":1794299731000},{"id":"dz-cataract","kind":"disease","category":"눈·귀","title_ko":"백내장","title_orig":"Cataract","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cataract","tags":["질병 백과","눈","노화"],"body_ko":"## 개요\n눈의 수정체가 혼탁해져 시야가 흐려지는 질환입니다.\n\n## 원인과 위험 요인\n노화가 가장 흔한 원인이며 당뇨병, 스테로이드, 흡연, 자외선이 관여합니다.\n\n## 주요 증상\n흐린 시야, 눈부심, 밤 시력 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nClouding of the eye's lens causing blurred vision.\n\n## Causes and risk factors\nMostly age-related; diabetes, steroids, smoking and UV exposure contribute.\n\n## Key symptoms\nBlurred vision, glare and poor night vision.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299730000,"updated":1794299730000},{"id":"dz-amd","kind":"disease","category":"눈·귀","title_ko":"나이 관련 황반변성","title_orig":"Age-related macular degeneration","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Age-related%20macular%20degeneration","tags":["질병 백과","눈","노화"],"body_ko":"## 개요\n망막 중심부(황반)가 손상되어 중심 시력이 떨어지는 질환입니다.\n\n## 원인과 위험 요인\n나이, 흡연, 유전, 심혈관 위험 요인이 관련됩니다.\n\n## 주요 증상\n중심이 흐리거나 비어 보임, 직선이 휘어 보임.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDamage to the central retina (macula) causing loss of central vision.\n\n## Causes and risk factors\nAssociated with age, smoking, genetics and cardiovascular risk factors.\n\n## Key symptoms\nBlurred or missing central vision and wavy straight lines.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299729000,"updated":1794299729000},{"id":"dz-dr","kind":"disease","category":"눈·귀","title_ko":"당뇨병성 망막병증","title_orig":"Diabetic retinopathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diabetic%20retinopathy","tags":["질병 백과","당뇨","눈"],"body_ko":"## 개요\n당뇨병으로 망막 혈관이 손상되는 합병증으로, 성인 실명의 주요 원인입니다.\n\n## 원인과 위험 요인\n당뇨병 유병 기간, 혈당·혈압 조절 불량이 원인입니다.\n\n## 주요 증상\n초기엔 증상이 없어 정기 안저 검사가 중요합니다. 진행하면 시력 저하, 비문증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDamage to retinal blood vessels from diabetes; a leading cause of adult blindness.\n\n## Causes and risk factors\nCaused by duration of diabetes and poor glucose and blood pressure control.\n\n## Key symptoms\nSilent early, so regular eye checks are essential; later blurred vision and floaters.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299728000,"updated":1794299728000},{"id":"dz-meniere","kind":"disease","category":"눈·귀","title_ko":"메니에르병","title_orig":"Ménière's disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=M%C3%A9ni%C3%A8re%27s%20disease","tags":["질병 백과","어지럼","귀"],"body_ko":"## 개요\n속귀의 림프액이 늘어나 어지럼, 난청, 이명이 반복되는 질환입니다.\n\n## 원인과 위험 요인\n원인은 불명이며 염분, 스트레스가 악화 요인으로 거론됩니다.\n\n## 주요 증상\n20분~수시간의 회전성 어지럼, 귀 먹먹함, 저음 난청, 이명.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inner-ear disorder with recurrent vertigo, hearing loss and tinnitus from endolymphatic hydrops.\n\n## Causes and risk factors\nCause unknown; salt and stress are suggested aggravating factors.\n\n## Key symptoms\nSpinning vertigo lasting 20 minutes to hours, ear fullness, low-pitch hearing loss and tinnitus.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299727000,"updated":1794299727000},{"id":"dz-bppv","kind":"disease","category":"눈·귀","title_ko":"양성 돌발성 체위성 현기증 (이석증)","title_orig":"Benign paroxysmal positional vertigo","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Benign%20paroxysmal%20positional%20vertigo","tags":["질병 백과","어지럼","귀"],"body_ko":"## 개요\n속귀의 이석이 반고리관으로 들어가 머리 위치를 바꿀 때 어지럼이 생기는 질환입니다.\n\n## 원인과 위험 요인\n나이, 머리 외상, 골다공증, 오래 누워 있음이 관련됩니다.\n\n## 주요 증상\n눕거나 고개를 돌릴 때 1분 이내의 심한 회전성 어지럼. 이석 정복술로 좋아집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDisplaced inner-ear crystals entering a semicircular canal cause vertigo with head movements.\n\n## Causes and risk factors\nAssociated with age, head injury, osteoporosis and prolonged bed rest.\n\n## Key symptoms\nBrief (under a minute) spinning vertigo on lying down or turning the head; treated with repositioning manoeuvres.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299726000,"updated":1794299726000},{"id":"dz-ssnhl","kind":"disease","category":"눈·귀","title_ko":"돌발성 난청","title_orig":"Sudden sensorineural hearing loss","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sudden%20sensorineural%20hearing%20loss","tags":["질병 백과","귀","응급"],"body_ko":"## 개요\n72시간 안에 갑자기 한쪽 청력이 떨어지는 응급 질환입니다.\n\n## 원인과 위험 요인\n대부분 원인 불명이며 바이러스 감염, 혈류 장애, 면역 이상이 추정됩니다.\n\n## 주요 증상\n갑작스러운 청력 저하, 이명, 귀 먹먹함, 어지럼. 빨리 치료할수록 회복률이 높습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA sudden loss of hearing, usually in one ear, over up to 72 hours.\n\n## Causes and risk factors\nMostly idiopathic; viral, vascular and immune causes are suspected.\n\n## Key symptoms\nSudden hearing loss, tinnitus, ear fullness and dizziness; early treatment improves recovery.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299725000,"updated":1794299725000},{"id":"dz-endometriosis","kind":"disease","category":"여성 건강","title_ko":"자궁내막증","title_orig":"Endometriosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Endometriosis","tags":["질병 백과","여성","호르몬"],"body_ko":"## 개요\n자궁내막과 비슷한 조직이 자궁 밖에서 자라는 만성 염증 질환입니다.\n\n## 원인과 위험 요인\n월경혈 역류, 면역, 호르몬, 유전이 관여합니다.\n\n## 주요 증상\n심한 생리통, 만성 골반통, 성교통, 난임.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic inflammatory condition in which endometrial-like tissue grows outside the uterus.\n\n## Causes and risk factors\nInvolves retrograde menstruation, immunity, hormones and genetics.\n\n## Key symptoms\nSevere period pain, chronic pelvic pain, painful sex and subfertility.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299724000,"updated":1794299724000},{"id":"dz-fibroid","kind":"disease","category":"여성 건강","title_ko":"자궁근종","title_orig":"Uterine fibroids","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Uterine%20fibroids","tags":["질병 백과","여성","호르몬"],"body_ko":"## 개요\n자궁 근육에 생기는 양성 종양으로 매우 흔합니다.\n\n## 원인과 위험 요인\n에스트로겐·프로게스테론, 유전, 나이가 관여합니다.\n\n## 주요 증상\n많은 생리량, 빈혈, 골반 압박감. 증상이 없기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nVery common benign tumours of the uterine muscle.\n\n## Causes and risk factors\nInfluenced by estrogen and progesterone, genetics and age.\n\n## Key symptoms\nHeavy periods, anaemia and pelvic pressure; may be symptomless.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299723000,"updated":1794299723000},{"id":"dz-preeclampsia","kind":"disease","category":"여성 건강","title_ko":"전자간증 (임신중독증)","title_orig":"Pre-eclampsia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pre-eclampsia","tags":["질병 백과","임신","고혈압"],"body_ko":"## 개요\n임신 20주 이후 고혈압과 단백뇨 또는 장기 손상이 생기는 질환입니다.\n\n## 원인과 위험 요인\n태반 혈관 발달 이상이 원인이며 첫 임신, 고령, 비만, 만성 고혈압, 당뇨병, 다태 임신이 위험 요인입니다.\n\n## 주요 증상\n두통, 시야 이상, 윗배 통증, 부종. 경련(자간증)으로 진행할 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nNew hypertension after 20 weeks of pregnancy with proteinuria or organ damage.\n\n## Causes and risk factors\nCaused by abnormal placental development; risk factors include first pregnancy, older age, obesity, chronic hypertension, diabetes and multiple pregnancy.\n\n## Key symptoms\nHeadache, visual disturbance, upper abdominal pain and swelling; may progress to seizures (eclampsia).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299722000,"updated":1794299722000}]</script>

function parseBackup(text){

  if(!Array.isArray(arr))throw new Error('글 목록(배열)을 찾지 못했어요.');
  return{posts:normalize(arr),extras:(j&&!Array.isArray(j)&&j.extras&&typeof j.extras==='object')?j.extras:null,meta:Array.isArray(j)?null:j,rawCount:arr.length};

function validateBackup(text){
  const r={ok:false,errors:[],warns:[],info:[]};
  let pb;
  try{pb=parseBackup(text)}catch(e){r.errors.push(e.message);return r}
  const list=pb.posts;
  if(!list.length){r.errors.push('가져올 글이 하나도 없어요.');return r}
  const meta=pb.meta;
  r.info.push(meta?('형식: 백업 파일'+(meta.app?` (${meta.app}`+(meta.version?` v${meta.version}`:'')+')':'')+(meta.exportedAt?` · 만든 날 ${fmtDate(Date.parse(meta.exportedAt)||0)}`:'')):'형식: 글 배열만 있는 JSON');
  const kinds={paper:0,disease:0};list.forEach(p=>kinds[p.kind]++);
  r.info.push(`글 ${list.length}개 — 질병 백과 ${kinds.disease}개 · 연구 노트 ${kinds.paper}개`);
  const ids=new Set();let dup=0;list.forEach(p=>{if(ids.has(p.id))dup++;ids.add(p.id)});
  let overwrite=0;ids.forEach(id=>{if(IDX.has(id))overwrite++});
  r.info.push(`현재 자료와 id가 같은 글 ${overwrite}개 (합치기 시 새 내용으로 덮어씀) · 새로 추가될 글 ${ids.size-overwrite}개`);
  if(pb.rawCount!==list.length)r.warns.push(`올바르지 않은 항목 ${pb.rawCount-list.length}개는 건너뜁니다.`);
  const notitle=list.filter(p=>!p.title_ko&&!p.title_orig).length;
  if(notitle)r.warns.push(`제목이 없는 글 ${notitle}개가 있어요.`);
  if(dup)r.warns.push(`같은 id가 중복된 글 ${dup}개 — 마지막 항목이 남습니다.`);
  if(pb.extras)r.info.push(`북마크 ${(pb.extras.bookmarks||[]).length}개 · 메모 ${Object.keys(pb.extras.memos||{}).length}개 포함`);
  r.ok=true;r.parsed=pb;return r;
}

const plain=t=>String(t||'').replace(/^#+\s.*$/gm,'').replace(/^[-*•]\s/gm,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();

const inl=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function mdBlock(text){
  const out=[];let para=[],list=null;
  const fp=()=>{if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}};
  const fl=()=>{if(list){out.push('<ul>'+list.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');list=null}};
  String(text||'').split('\n').forEach(l=>{
    const r=l.trim();
    if(!r){fp();fl();return}
    if(/^#{1,4}\s/.test(r)){fp();fl();out.push('<h4>'+inl(r.replace(/^#+\s/,''))+'</h4>');return}
    if(/^[-*•]\s/.test(r)){fp();(list=list||[]).push(r.replace(/^[-*•]\s/,''));return}
    fl();para.push(r);
  });
  fp();fl();return out.join('');
}
function parseSections(text){
  const secs=[];let cur={title:'',lines:[]};
  const push=()=>{if(cur.title||cur.lines.some(x=>x.trim()))secs.push({title:cur.title,body:cur.lines.join('\n').trim()})};
  String(text||'').split('\n').forEach(l=>{
    const m=l.trim().match(/^#{1,4}\s+(.*)$/);
    if(m){push();cur={title:m[1].trim(),lines:[]}}else cur.lines.push(l);
  });
  push();return secs;
}
function secIcon(t){
  t=String(t||'').toLowerCase();
  if(/개요|overview|정의|definition|how the/.test(t))return'info';
  if(/원인|cause|기전|mechanism|이유/.test(t))return'cause';
  if(/증상|symptom|특징|feature|hallmark/.test(t))return'pulse';
  if(/진단|diagnos|기준|criteria|검사/.test(t))return'clip';
  if(/치료|관리|treat|manage|therapy/.test(t))return'cross';
  if(/위험|risk/.test(t))return'alert';

  if(/연구|research|study|변형|variant|형태/.test(t))return'flask';

}
function summaryOf(p){
  const secs=parseSections(p.body_ko||p.body_orig);

  const first=s.body.split(/\n\s*\n/).find(b=>b.trim())||'';

}

const BLOB=new Map();
function blob(p){
  let b=BLOB.get(p.id);
  if(!b||b.p!==p){b={p,t:((p.title_ko||'')+' '+(p.title_orig||'')).toLowerCase(),all:[p.title_ko,p.title_orig,p.category,p.body_ko,p.body_orig,p.authors,p.journal,p.year,(p.tags||[]).join(' ')].join('\n').toLowerCase()};BLOB.set(p.id,b)}
  return b;
}
const tokens=q=>String(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
function hl(text,toks){
  const s=esc(text);if(!toks||!toks.length)return s;
  const re=new RegExp('('+toks.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return s.replace(re,'<mark>$1</mark>');
}
function recentTs(id){return RECENT[id]||0}
function sorter(sort,toks){
  const nm=p=>(p.title_ko||p.title_orig||'');
  const rank=toks&&toks.length?(p=>{const t=blob(p).t;return toks.every(x=>t.includes(x))?0:1}):null;
  const base={
    new:(a,b)=>(b.created||0)-(a.created||0),
    upd:(a,b)=>(b.updated||0)-(a.updated||0),
    name:(a,b)=>COLL.compare(nm(a),nm(b)),
    year:(a,b)=>(parseInt(b.year,10)||0)-(parseInt(a.year,10)||0),
    rec:(a,b)=>recentTs(b.id)-recentTs(a.id)||(b.created||0)-(a.created||0),
    bm:(a,b)=>BM.indexOf(b.id)-BM.indexOf(a.id)
  }[sort]||((a,b)=>0);
  return rank?((a,b)=>rank(a)-rank(b)||base(a,b)):base;
}
function runQuery(o){
  const toks=tokens(o.q);
  let arr=S.posts.filter(p=>(!o.kind||(p.kind||'paper')===o.kind));
  if(o.cat&&o.cat!=='전체')arr=arr.filter(p=>p.category===o.cat);
  if(o.tag)arr=arr.filter(p=>(p.tags||[]).includes(o.tag));
  if(o.bm)arr=arr.filter(p=>BM.includes(p.id));
  if(toks.length)arr=arr.filter(p=>{const b=blob(p).all;return toks.every(t=>b.includes(t))});
  return arr.sort(sorter(o.sort,toks));
}

  let meta='';
  if(!isD){
    const src=[p.journal?p.journal.split(/\s\d/)[0]:'',p.year].filter(Boolean).map(esc).join(' · ');
    meta=`<div class="meta">${src?`<span>${src}</span>`:''}<span>작성 ${fmtDate(p.created)}</span>${p.updated&&p.updated!==p.created?`<span>수정 ${fmtDate(p.updated)}</span>`:''}</div>`;
