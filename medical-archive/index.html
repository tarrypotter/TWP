<style>
:root{
  --primary:#0F5132;--primary-d:#0A3622;--accent:#10B981;--accent-d:#059669;--on-primary:#fff;
  --bg:#F8FAFC;--surface:#ffffff;--surface2:#F1F5F9;--surface3:#E2E8F0;
  --text:#0F172A;--text2:#64748B;--text-muted:#94A3B8;--border:#E2E8F0;
  --primary-soft:#ECFDF5;--primary-soft-border:#A7F3D0;
  --danger:#EF4444;--danger-soft:#FEF2F2;--danger-border:#FECACA;
  --warn-bg:#FFFBEB;--warn-bd:#FCD34D;--warn-tx:#92400E;
  --orig-bg:#F1F5F9;--hl:#FEF08A;
  --r:16px;--r-lg:22px;--r-sm:12px;--r-pill:9999px;--fs:15.5px;--lh:1.75;
  --hh:calc(60px + env(safe-area-inset-top));--nav-h:calc(64px + env(safe-area-inset-bottom));
  --sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top);
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
  --shadow:0 4px 16px -2px rgba(15,81,50,0.06), 0 2px 6px -1px rgba(0,0,0,0.02);
  --shadow-pop:0 16px 36px -4px rgba(15,23,42,0.12), 0 6px 16px rgba(0,0,0,0.04);
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"Pretendard",system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --primary:#10B981;--primary-d:#059669;--accent:#34D399;--on-primary:#0B1110;
  --bg:#0B1110;--surface:#131C1A;--surface2:#1B2724;--surface3:#253733;
  --text:#F1F5F9;--text2:#94A3B8;--text-muted:#64748B;--border:#20302C;
  --primary-soft:#152A24;--primary-soft-border:#1F4339;
  --danger:#F87171;--danger-soft:#321C1C;--danger-border:#4D2525;
  --warn-bg:#261E0F;--warn-bd:#5E461A;--warn-tx:#FDE68A;
  --orig-bg:#162320;--hl:#4A3B12;
  --shadow-sm:none;
  --shadow:0 4px 20px rgba(0,0,0,0.25);
  --shadow-pop:0 16px 36px rgba(0,0,0,0.6);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#10B981;--primary-d:#059669;--accent:#34D399;--on-primary:#0B1110;
    --bg:#0B1110;--surface:#131C1A;--surface2:#1B2724;--surface3:#253733;
    --text:#F1F5F9;--text2:#94A3B8;--text-muted:#64748B;--border:#20302C;
    --primary-soft:#152A24;--primary-soft-border:#1F4339;
    --danger:#F87171;--danger-soft:#321C1C;--danger-border:#4D2525;
    --warn-bg:#261E0F;--warn-bd:#5E461A;--warn-tx:#FDE68A;
    --orig-bg:#162320;--hl:#4A3B12;
    --shadow-sm:none;
    --shadow:0 4px 20px rgba(0,0,0,0.25);
    --shadow-pop:0 16px 36px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;
  letter-spacing:-0.015em;word-break:keep-all;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .2s ease,color .2s ease;
}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
button,input,textarea,select{font:inherit;font-size:16px;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--accent-d)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease,stroke .15s ease}
svg.i.s{width:18px;height:18px}
.serif{font-family:var(--serif)}
#app{min-height:100vh;min-height:100dvh}

/* ---------- Shell & Header ---------- */
.hdr{
  position:sticky;top:0;z-index:30;padding-top:var(--sat);
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  -webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);
  border-bottom:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  transition:all .2s ease;
}
.hdr-in{display:flex;align-items:center;gap:8px;height:58px;padding:0 12px 0 16px;max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:var(--text)}
.brand .logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg, #0F5132 0%, #10B981 100%);
  box-shadow:0 3px 10px rgba(16,185,129,.28);
  color:#fff;display:grid;place-items:center;flex:none;
  transition:transform .2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
:root[data-theme="dark"] .brand .logo{
  background:linear-gradient(135deg, #10B981 0%, #059669 100%);
  box-shadow:0 3px 12px rgba(16,185,129,.4);
}
.brand:hover .logo{transform:scale(1.06)}
.brand .logo svg{width:20px;height:20px;stroke-width:2.4}
.brand b{
  font-family:"Plus Jakarta Sans",var(--sans);font-size:14.5px;letter-spacing:.12em;font-weight:800;
  white-space:nowrap;color:var(--text);display:flex;align-items:center;gap:6px;
}
.brand small{display:block;font-size:11px;letter-spacing:.02em;color:var(--text2);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title{flex:1;min-width:0;font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;letter-spacing:-.02em}
.ib{
  min-width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--text);
  position:relative;background:transparent;transition:all .18s cubic-bezier(0.4, 0, 0.2, 1);
}
.ib:hover{background:var(--surface2);color:var(--primary)}
.ib:active{background:var(--primary-soft);transform:scale(.95)}
.ib.on{color:var(--accent);background:var(--primary-soft)}
.ib.on svg{fill:currentColor}
.ib.txt{padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:12px}
.progress{height:3px;background:transparent;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg, var(--primary), var(--accent));transition:width .08s linear}

main{display:block;max-width:1040px;margin:0 auto;padding:0 18px calc(var(--nav-h) + 32px);min-height:60vh;outline:0}
body.noNav main{padding-bottom:calc(96px + var(--sab))}

/* ---------- Bottom Nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);
  border-top:1px solid color-mix(in srgb, var(--border) 80%, transparent);
  padding:6px 8px calc(6px + var(--sab));
  box-shadow:0 -4px 24px rgba(15,23,42,0.04);
  transition:all .2s ease;
}
.nav a{
  flex:1;max-width:100px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--text2);font-size:11px;font-weight:600;border-radius:14px;position:relative;
  -webkit-user-select:none;user-select:none;transition:all .18s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav a svg{width:22px;height:22px}
.nav a:hover{color:var(--text);background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--primary);font-weight:750}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"]::before{
  content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg, var(--primary), var(--accent));
}
.nav a[aria-current="page"] svg{stroke-width:2.3;filter:drop-shadow(0 2px 6px rgba(16,185,129,.25))}
.nav a .dot{
  position:absolute;top:5px;right:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:750;line-height:17px;text-align:center;padding:0 4px;
  box-shadow:0 2px 6px rgba(239,68,68,.35);
}
body.kb .nav{display:none}
body.noNav .nav{display:none}

@media(min-width:880px){
  #app{display:grid;grid-template-columns:240px minmax(0,1fr);}
  .nav{
    position:sticky;top:0;grid-column:1;grid-row:1/span 2;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;
    border-top:0;border-right:1px solid var(--border);padding:20px 14px 20px;box-shadow:none;
  }
  .nav::before{
    content:"MEDICAL ARCHIVE";display:block;font-family:"Plus Jakarta Sans",var(--sans);font-size:12px;letter-spacing:.16em;
    font-weight:800;padding:8px 14px 20px;color:var(--text2);
  }
  .nav a{flex:none;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:0 16px;min-height:48px;border-radius:12px}
  .nav a svg{width:20px;height:20px}
  .nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .nav a[aria-current="page"]::before{display:none}
  .nav a .dot{position:static;margin-left:auto}
  .hdr{grid-column:2}
  main{grid-column:2;padding-bottom:60px}
}

/* ---------- Common Components ---------- */
.card-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow);transition:border-color .2s ease;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 18px;
  border-radius:13px;border:1px solid var(--border);background:var(--surface);font-size:14.5px;font-weight:650;
  color:var(--text);text-decoration:none;line-height:1.2;text-align:center;box-shadow:var(--shadow-sm);
  transition:all .18s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--border) 80%,var(--text));transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.pri{
  background:linear-gradient(135deg, var(--primary) 0%, #137547 100%);
  border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(15,81,50,.28);
}
.btn.pri:hover{background:linear-gradient(135deg, var(--primary-d) 0%, var(--primary) 100%);box-shadow:0 6px 18px rgba(15,81,50,.35)}
.btn.sub{background:var(--primary-soft);border-color:var(--primary-soft-border);color:var(--primary)}
.btn.sub:hover{background:color-mix(in srgb,var(--primary-soft) 80%,var(--accent))}
.btn.dan{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger)}
.btn.dan:hover{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* Search Box */
.searchbox{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r);padding:0 10px 0 16px;min-height:52px;box-shadow:0 4px 16px -2px rgba(15,81,50,0.04);
  transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.searchbox:focus-within{
  border-color:var(--accent);box-shadow:0 0 0 4px rgba(16,185,129,.14), 0 4px 16px -2px rgba(15,81,50,0.08);
}
.searchbox svg{color:var(--accent);stroke-width:2.2}
.searchbox input{
  flex:1;min-width:0;height:48px;border:0;background:transparent;outline:0;font-size:15px;font-weight:500;
  color:var(--text);letter-spacing:-.01em;
}
.searchbox input::placeholder{color:var(--text-muted);font-weight:400}

/* Badges & Tags */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;
  border-radius:var(--r-pill);background:var(--surface2);color:var(--text2);border:1px solid var(--border);
  letter-spacing:-.01em;line-height:1.3;white-space:nowrap;
}
.badge-d{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-soft-border)}
:root[data-theme="dark"] .badge-d{color:var(--accent)}
.badge-n{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
:root[data-theme="dark"] .badge-n{background:#1E293B;color:#60A5FA;border-color:#334155}
.badge-c{background:var(--surface2);color:var(--text2);border-color:var(--border)}
.badge-accent{background:var(--primary-soft);color:var(--accent-d);border-color:var(--primary-soft-border)}

/* Cards / List Items */
.card{
  position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:18px 18px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow);min-width:0;-webkit-user-select:none;user-select:none;
  transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover{
  transform:translateY(-2px);border-color:var(--primary-soft-border);
  box-shadow:0 8px 26px -4px rgba(15,81,50,.1);
}
.card:active{transform:scale(.985);background:var(--surface2)}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{
  font-family:var(--sans);font-size:17.5px;font-weight:750;letter-spacing:-.03em;line-height:1.35;
  margin:2px 0 0;color:var(--text);word-break:keep-all;
}
.card .orig{font-size:13.5px;color:var(--text2);font-weight:500;line-height:1.3;margin-top:2px}
.card .ex{font-size:14px;line-height:1.6;color:var(--text2);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--text2)}
.card .go{color:var(--primary);display:inline-flex;align-items:center;font-size:12.5px;font-weight:650;gap:3px;transition:transform .15s ease}
:root[data-theme="dark"] .card .go{color:var(--accent)}
.card:hover .go{transform:translateX(3px)}
.card .go svg{width:16px;height:16px}

/* Mini Rows (Recent List) */
.rows{display:flex;flex-direction:column;gap:10px}
.row-i{
  display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);
  transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.row-i:hover{transform:translateY(-1.5px);border-color:var(--primary-soft-border);box-shadow:var(--shadow)}
.row-i:active{transform:scale(.985);background:var(--surface2)}
.row-i .body{flex:1;min-width:0}
.row-i .body b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .body span{display:block;font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .arr{color:var(--text-muted);flex:none;transition:transform .15s ease,color .15s ease}
.row-i:hover .arr{transform:translateX(2px);color:var(--primary)}

/* ---------- Home Specifics ---------- */
.hero{padding:26px 0 10px;position:relative}
.hero p.eyebrow{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--r-pill);
  background:var(--primary-soft);border:1px solid var(--primary-soft-border);color:var(--accent-d);
  font-family:"Plus Jakarta Sans",var(--sans);font-size:11px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;margin:0 0 12px;
}
:root[data-theme="dark"] .hero p.eyebrow{color:var(--accent);background:var(--primary-soft)}
.hero h1.h1{
  font-size:29px;font-weight:850;letter-spacing:-.038em;line-height:1.25;margin:0;color:var(--text);
}
.hero p.lead{
  margin:10px 0 0;color:var(--text2);font-size:15px;line-height:1.6;letter-spacing:-.015em;max-width:540px;
}

/* Stat Cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 20px}
.stat{
  background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px 14px 14px;
  text-align:left;min-width:0;box-shadow:var(--shadow);min-height:50px;position:relative;overflow:hidden;
  transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
}
.stat:hover{transform:translateY(-2px);border-color:var(--primary-soft-border);box-shadow:0 8px 24px -4px rgba(15,81,50,.12)}

@media (min-width:900px){.edbar{left:232px}}
.sv{font-size:12px;color:var(--text2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding-right:4px}
.sv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--border)}
.sv.dirty::before{background:#D99A2B}
.sv.draft::before{background:#6A9DC0}
.sv.ok::before{background:#3FA374}
.sv.err{color:var(--danger)}
.sv.err::before{background:var(--danger)}
.metaline{font-size:12.5px;color:var(--text2);margin:-6px 0 16px}

/* ---------- Settings ---------- */
.group{margin-top:22px}
.group>h2{font-size:12.5px;letter-spacing:.08em;color:var(--text2);margin:0 4px 8px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:12px}
.panel h3{font-size:15.5px;margin:0 0 4px}
.panel p{margin:4px 0 12px;font-size:14px;color:var(--text2);line-height:1.6}
.panel p.t{color:var(--text)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);min-height:52px}
.srow:first-child{border-top:0;padding-top:0}
.srow:last-child{padding-bottom:0}
.srow .l{font-size:15px;font-weight:500}
.srow .l small{display:block;color:var(--text2);font-weight:400;font-size:12.5px;margin-top:1px}
.srow .v{color:var(--text2);font-size:14px;text-align:right}
.seg.inline{margin:0;min-width:210px}
.stack-col{display:block}
.stack-col .srow{display:block}
.stack-col .seg{margin-top:8px}
.fsrow{display:flex;align-items:center;gap:10px}
.fsrow input[type=range]{flex:1;min-width:0;accent-color:var(--primary);height:44px;margin:0}
.fsrow .btn{min-width:44px;padding:0}
.prev{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface2);font-size:var(--fs);line-height:var(--lh)}
.stor{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:10px 0 4px}
.stor i{display:block;height:100%;background:var(--primary);width:0}
textarea.raw{width:100%;min-height:140px;max-height:260px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-size:16px;line-height:1.5;resize:vertical;font-family:ui-monospace,Menlo,monospace}
.rep{margin-top:10px;font-size:14px;line-height:1.6}
.rep ul{margin:6px 0 0;padding-left:1.2em}
.rep .good{color:var(--accent);font-weight:700}
.rep .bad{color:var(--danger);font-weight:700}
details.help{border-top:1px solid var(--border);padding:2px 0}
details.help:first-of-type{border-top:0}
details.help summary{min-height:48px;display:flex;align-items:center;font-weight:600;font-size:15px;cursor:pointer;list-style:none;justify-content:space-between;gap:8px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"+";font-size:20px;color:var(--text2);font-weight:400}
details.help[open] summary::after{content:"–"}
details.help .hb{padding:0 0 12px;font-size:14px;color:var(--text2);line-height:1.7}
.cl h4{margin:14px 0 4px;font-size:14px}
.cl ul{margin:0;padding-left:1.2em;font-size:14px;color:var(--text2);line-height:1.7}

/* ---------- Overlays ---------- */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(10,20,17,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.ov.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sab));max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  animation:up .2s ease-out;box-shadow:var(--shadow-pop);overscroll-behavior:contain}
.ov.center .sheet{border-radius:var(--r-lg);padding:20px;max-height:80dvh}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 10px}
.ov.center .grab{display:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet-h h2{font-size:17px;margin:0}
.sheet .sec-label{font-size:12.5px;color:var(--text2);font-weight:700;margin:16px 0 6px;letter-spacing:.04em}
.sheet .opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 4px;border-top:1px solid var(--border);font-size:15.5px;text-align:left;gap:10px;color:var(--text)}
.sheet .opt:first-of-type{border-top:0}
.sheet .opt svg{color:var(--text2)}
.sheet .opt[aria-checked="true"]{font-weight:700;color:var(--accent)}
.sheet .opt[aria-checked="true"]::after{content:"✓";font-size:17px}
.sheet .opt.danger{color:var(--danger)}
.sheet .opt .oi{display:flex;align-items:center;gap:12px}
.sheet .chips{margin:0;padding:4px 0;flex-wrap:wrap;overflow:visible}
.sheet p.msg{margin:8px 0 16px;font-size:15.5px;line-height:1.6}
.sheet .btns{justify-content:flex-end}
.sheet .btns .btn{flex:1 1 120px}
.sheet input.txt{width:100%;min-height:48px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 14px;background:var(--surface);margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translate(-50%,16px);z-index:120;max-width:min(92vw,520px);min-width:200px;background:#1F2B28;color:#fff;border-radius:14px;padding:12px 16px;
  font-size:14px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-pop)}
:root[data-theme="dark"] .toast{background:#2B3C38}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:#8E3526}
.toast button{color:#9FE0C8;font-weight:700;min-height:36px;padding:0 6px;flex:none}
body.noNav .toast,body.kb .toast{bottom:calc(var(--sab) + 92px)}
@media (min-width:900px){.toast{bottom:28px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- Tiny screens ---------- */
@media (max-width:360px){
  main{padding-left:12px;padding-right:12px}
  .chips{margin:0 -12px;padding-left:12px;padding-right:12px}
  .toc{margin:14px -12px 0;padding:8px 12px}
  .h1{font-size:22px}
  .stat b{font-size:22px}
  .stats{gap:8px}
  .brand small{display:none}
}
@media print{.hdr,.nav,.totop,.toc,.actions,.pn,.edbar{display:none!important}}

/* ---------- Additions ---------- */
.ri{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--accent)}
@supports (background:color-mix(in srgb,red,blue)){.ri{background:color-mix(in srgb,var(--bc,var(--primary)) 13%,var(--surface));color:color-mix(in srgb,var(--bc,var(--primary)) 80%,var(--text))}}
.toolrow{display:flex;gap:8px;align-items:flex-start}
.toolrow .seg{flex:1;margin:12px 0 0;min-width:0}
.toolrow .tbtn{margin-left:auto;flex:none}
.pair{scroll-margin-top:calc(var(--hh) + 60px)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px);z-index:35;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow-pop)}
.fab:active{background:var(--primary-d)}
.fab svg{width:22px;height:22px}
body.kb .fab,body.kb .edbar{display:none}
.totop{right:auto;left:16px}
@media (min-width:900px){.fab{bottom:28px;right:32px}.totop{left:auto;right:32px;bottom:96px}.hdr{grid-row:1}main{grid-row:2}}
.list{padding-bottom:70px}

</style>

<script type="application/json" id="seed-papers">[{"id":"oh-consensus-2011","category":"기립성 저혈압","title_ko":"기립성 저혈압·신경매개성 실신·체위성 빈맥 증후군의 정의에 관한 합의문","title_orig":"Consensus statement on the definition of orthostatic hypotension, neurally mediated syncope and the postural tachycardia syndrome","authors":"Freeman R, Wieling W, Axelrod FB, et al.","journal":"Clinical Autonomic Research 21(2):69–72","year":"2011","link":"https://doi.org/10.1007/s10286-011-0119-5","tags":["정의","진단 기준","자율신경"],"body_ko":"## 핵심 정의\n기립성 저혈압은 일어선 뒤(또는 60도 이상 기울기 검사에서) 3분 안에 수축기 혈압이 20mmHg 이상, 또는 이완기 혈압이 10mmHg 이상 떨어진 상태가 지속되는 것을 말합니다.\n\n## 변형 형태\n- 초기 기립성 저혈압: 일어선 직후 15초 안에 일시적으로 혈압이 크게 떨어졌다가 회복되는 경우\n- 지연성 기립성 저혈압: 3분이 지난 뒤에야 기준만큼 떨어지는 경우\n\n누워 있을 때 혈압이 높은 사람(누운 자세 고혈압)은 원래 혈압이 높아 떨어지는 폭도 크게 나타나므로, 수축기 30mmHg 감소를 기준으로 보는 것이 더 적절할 수 있다고 제안합니다.\n\n## 정리 메모\n원인은 크게 자율신경 자체의 문제(신경성: 파킨슨병, 다계통 위축증, 당뇨병성 신경병증 등)와 그 밖의 원인(비신경성: 탈수·출혈 같은 체액 부족, 혈압약·이뇨제 등 약물)으로 나뉩니다.","body_orig":"## Core definition\nOrthostatic hypotension is a sustained reduction of systolic blood pressure of at least 20 mmHg or diastolic blood pressure of at least 10 mmHg within 3 minutes of standing or head-up tilt to at least 60 degrees.\n\n## Variants\n- Initial orthostatic hypotension: a transient blood pressure drop within 15 seconds after standing\n- Delayed orthostatic hypotension: the drop meeting the criteria occurs beyond 3 minutes\n\nIn patients with supine hypertension, a reduction in systolic pressure of 30 mmHg may be a more appropriate criterion, because the magnitude of the fall depends on baseline pressure.\n\n## Summary note\nCauses are broadly divided into neurogenic (autonomic failure, e.g. Parkinson's disease, multiple system atrophy, diabetic neuropathy) and non-neurogenic (volume depletion such as dehydration or bleeding, and drugs such as antihypertensives and diuretics).","created":1794300000000,"updated":1794300000000},{"id":"cancer-hallmarks-2011","category":"암","title_ko":"암의 특징: 차세대 개정판","title_orig":"Hallmarks of Cancer: The Next Generation","authors":"Hanahan D, Weinberg RA","journal":"Cell 144(5):646–674","year":"2011","link":"https://doi.org/10.1016/j.cell.2011.02.013","tags":["발생 원리","유전체 불안정성","염증","면역"],"body_ko":"## 무엇을 말하는 논문인가\n정상 세포가 암세포가 되는 과정에서 공통적으로 얻게 되는 능력들을 '암의 특징(hallmarks)'으로 정리한 대표적인 개관 논문입니다.\n\n## 6가지 기본 특징\n- 증식 신호를 스스로 계속 유지함\n- 성장 억제 신호를 피함\n- 세포 죽음(세포자멸사)에 저항함\n- 무한히 분열할 수 있게 됨\n- 새 혈관 생성을 유도함\n- 주변 조직 침범과 전이를 일으킴\n\n## 새로 추가된 특징\n- 에너지 대사의 재프로그래밍\n- 면역 체계의 공격을 피함\n\n## 이를 가능하게 하는 바탕\n유전체 불안정성과 돌연변이, 그리고 종양을 돕는 염증이 위 특징들을 얻는 바탕이 된다고 설명합니다.\n\n## 정리 메모\n2022년 Hanahan은 후속 논문(Cancer Discovery 12(1):31–46)에서 표현형 가소성, 비돌연변이성 후성유전 재프로그래밍, 다양한 미생물군, 노화 세포를 추가 후보로 제시했습니다.","body_orig":"## What the paper is about\nA landmark review organizing the capabilities that cells commonly acquire as they progress from normal to cancerous into a set of 'hallmarks of cancer'.\n\n## Six core hallmarks\n- Sustaining proliferative signaling\n- Evading growth suppressors\n- Resisting cell death\n- Enabling replicative immortality\n- Inducing angiogenesis\n- Activating invasion and metastasis\n\n## Emerging hallmarks\n- Reprogramming energy metabolism\n- Evading immune destruction\n\n## Enabling characteristics\nGenome instability and mutation, together with tumor-promoting inflammation, are described as the characteristics that make acquisition of the hallmarks possible.\n\n## Summary note\nIn 2022, Hanahan (Cancer Discovery 12(1):31–46) proposed phenotypic plasticity, non-mutational epigenetic reprogramming, polymorphic microbiomes and senescent cells as further candidates.","created":1794300100000,"updated":1794300100000},{"id":"ibs-lancet-2020","category":"과민성 대장 증후군","title_ko":"과민성 대장 증후군","title_orig":"Irritable bowel syndrome","authors":"Ford AC, Sperber AD, Corsetti M, Camilleri M","journal":"The Lancet 396(10263):1675–1688","year":"2020","link":"https://doi.org/10.1016/S0140-6736(20)31548-8","tags":["장-뇌 축","로마 IV","내장 과민성"],"body_ko":"## 어떤 질환으로 보는가\n과민성 대장 증후군은 구조적 이상이 보이지 않는데도 복통과 배변 습관 변화가 반복되는 질환으로, 오늘날에는 '장-뇌 상호작용 장애'로 분류됩니다.\n\n## 진단 기준(로마 IV)\n최근 3개월 동안 평균 주 1회 이상 반복되는 복통이 있고, 다음 중 2가지 이상과 관련될 때:\n- 배변과 관련됨\n- 배변 횟수의 변화\n- 대변 모양(굳기)의 변화\n\n대변 양상에 따라 변비형(IBS-C), 설사형(IBS-D), 혼합형(IBS-M), 미분류형(IBS-U)으로 나눕니다.\n\n## 원인으로 거론되는 기전\n- 내장 과민성(장이 자극을 더 아프게 느낌)\n- 장 운동의 변화\n- 장과 뇌 사이 신호 전달의 이상\n- 감염성 장염 이후 발생(감염 후 IBS)\n- 장내 미생물 변화와 낮은 수준의 면역 활성화\n- 불안·우울 등 심리적 요인의 동반","body_orig":"## How the condition is understood\nIrritable bowel syndrome is characterized by recurrent abdominal pain and altered bowel habit without a detectable structural cause, and is now classified as a disorder of gut-brain interaction.\n\n## Diagnostic criteria (Rome IV)\nRecurrent abdominal pain on average at least one day per week in the last 3 months, associated with two or more of:\n- Related to defecation\n- A change in stool frequency\n- A change in stool form (appearance)\n\nSubtypes are defined by predominant stool pattern: constipation (IBS-C), diarrhoea (IBS-D), mixed (IBS-M) and unclassified (IBS-U).\n\n## Proposed mechanisms\n- Visceral hypersensitivity\n- Altered gut motility\n- Dysregulated gut-brain signalling\n- Onset after infectious gastroenteritis (post-infection IBS)\n- Changes in the gut microbiota and low-grade immune activation\n- Coexisting psychological factors such as anxiety and depression","created":1794300200000,"updated":1794300200000},{"id":"stress-mcewen-1998","category":"스트레스","title_ko":"스트레스 매개물질의 보호 효과와 손상 효과","title_orig":"Protective and damaging effects of stress mediators","authors":"McEwen BS","journal":"New England Journal of Medicine 338(3):171–179","year":"1998","link":"https://doi.org/10.1056/NEJM199801153380307","tags":["알로스타시스","코르티솔","만성 스트레스"],"body_ko":"## 핵심 개념\n몸은 스트레스를 받으면 코르티솔·아드레날린 같은 호르몬을 내보내 상황에 적응합니다. 이렇게 변화를 통해 안정을 유지하는 과정을 '알로스타시스(allostasis)'라고 부릅니다.\n\n단기적으로 이 반응은 몸을 보호하지만, 너무 자주 또는 너무 오래 작동하면 몸에 누적된 부담, 즉 '알로스타틱 부하(allostatic load)'가 쌓여 질병의 위험을 높인다고 설명합니다.\n\n## 부하가 쌓이는 4가지 경우\n- 스트레스가 반복해서 자주 찾아옴\n- 같은 스트레스에 익숙해지지(적응하지) 못함\n- 스트레스가 끝났는데도 반응이 꺼지지 않음\n- 반응이 너무 약해 다른 체계가 과도하게 보상함\n\n## 연결되는 건강 문제\n고혈압·동맥경화 같은 심혈관 질환, 대사 이상, 면역 기능 변화, 뇌(특히 해마)의 변화 등과 연결될 수 있다고 논의합니다.","body_orig":"## Key concept\nUnder stress, the body releases mediators such as cortisol and adrenaline to adapt. Achieving stability through such change is called allostasis.\n\nIn the short term these responses are protective, but when they are activated too often or for too long, the cumulative wear and tear, termed allostatic load, raises the risk of disease.\n\n## Four situations that produce allostatic load\n- Frequent, repeated stress\n- Failure to adapt (habituate) to repeated stressors of the same kind\n- Failure to shut off the response after the stress has ended\n- An inadequate response that leads other systems to overcompensate\n\n## Related health outcomes\nThe paper discusses links to cardiovascular disease such as hypertension and atherosclerosis, metabolic changes, altered immune function and changes in the brain, particularly the hippocampus.","created":1794300300000,"updated":1794300300000},{"id":"stress-cold-1991","category":"스트레스","title_ko":"심리적 스트레스와 감기에 걸리는 취약성","title_orig":"Psychological stress and susceptibility to the common cold","authors":"Cohen S, Tyrrell DA, Smith AP","journal":"New England Journal of Medicine 325(9):606–612","year":"1991","link":"https://doi.org/10.1056/NEJM199108293250903","tags":["면역","감염","실험 연구"],"body_ko":"## 연구 방법\n건강한 성인 약 400명에게 감기 바이러스를 코에 넣고(대조군은 식염수), 미리 측정해 둔 심리적 스트레스 정도에 따라 실제로 감염되고 감기 증상이 나타나는 비율을 비교했습니다.\n\n## 결과\n심리적 스트레스 점수가 높을수록 감염률과 감기 발병률이 단계적으로 높아졌습니다. 나이, 흡연, 음주, 운동 같은 다른 요인을 고려해도 이 관계는 유지되었습니다.\n\n## 의미\n심리적 스트레스가 실제로 면역 방어를 약하게 해 감염 위험을 높일 수 있다는 것을 통제된 실험으로 보여준 대표적인 연구입니다.","body_orig":"## Methods\nAbout 400 healthy adults received nasal drops containing respiratory viruses (or saline as a control), and the rates of infection and clinical colds were compared according to a previously measured index of psychological stress.\n\n## Results\nRates of both infection and clinical colds increased in a dose-response manner with higher psychological stress scores. The association remained after accounting for factors such as age, smoking, alcohol use and exercise.\n\n## Significance\nA landmark controlled study showing that psychological stress can weaken immune defence and increase susceptibility to infection.","created":1794300400000,"updated":1794300400000}]</script>
<script type="application/json" id="seed-diseases">[{"id":"dz-t1dm","kind":"disease","category":"대사·내분비","title_ko":"1형 당뇨병","title_orig":"Type 1 diabetes","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Type%201%20diabetes","tags":["질병 백과","자가면역","인슐린","혈당"],"body_ko":"## 개요\n면역 체계가 췌장의 인슐린 생산 세포(베타세포)를 파괴해 인슐린이 거의 만들어지지 않는 자가면역 질환입니다.\n\n## 원인과 위험 요인\n유전적 소인에 바이러스 감염 등 환경 요인이 더해져 자가면역 반응이 일어나는 것으로 추정됩니다. 어린이·청소년에게 흔하지만 어느 나이에나 생깁니다.\n\n## 주요 증상\n심한 갈증, 잦은 소변, 체중 감소, 피로. 인슐린이 부족하면 당뇨병성 케톤산증이 올 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn autoimmune disease in which the immune system destroys the insulin-producing beta cells of the pancreas, leaving little or no insulin.\n\n## Causes and risk factors\nThought to result from genetic susceptibility combined with environmental triggers such as viral infections. Common in children and adolescents but can occur at any age.\n\n## Key symptoms\nExcessive thirst, frequent urination, weight loss and fatigue. Insulin deficiency can lead to diabetic ketoacidosis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299999000,"updated":1794299999000},{"id":"dz-t2dm","kind":"disease","category":"대사·내분비","title_ko":"2형 당뇨병","title_orig":"Type 2 diabetes","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Type%202%20diabetes","tags":["질병 백과","인슐린 저항성","혈당","성인병"],"body_ko":"## 개요\n몸이 인슐린에 잘 반응하지 않고(인슐린 저항성) 췌장의 인슐린 분비도 점점 부족해져 혈당이 높아지는 질환으로, 당뇨병의 대부분을 차지합니다.\n\n## 원인과 위험 요인\n비만(특히 복부 비만), 운동 부족, 가족력, 나이, 임신성 당뇨 병력 등이 위험 요인입니다.\n\n## 주요 증상\n초기에는 증상이 없는 경우가 많고, 갈증·잦은 소변·피로·상처가 잘 낫지 않음 등이 나타날 수 있습니다. 오래되면 눈·콩팥·신경·혈관 합병증이 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA condition of high blood glucose caused by insulin resistance together with a progressive decline in insulin secretion; it accounts for most cases of diabetes.\n\n## Causes and risk factors\nRisk factors include obesity (especially abdominal), physical inactivity, family history, older age and a history of gestational diabetes.\n\n## Key symptoms\nOften symptomless at first; thirst, frequent urination, fatigue and slow wound healing may occur. Long-term complications affect the eyes, kidneys, nerves and blood vessels.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299998000,"updated":1794299998000},{"id":"dz-gdm","kind":"disease","category":"대사·내분비","title_ko":"임신성 당뇨병","title_orig":"Gestational diabetes","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gestational%20diabetes","tags":["질병 백과","임신","혈당"],"body_ko":"## 개요\n임신 중 처음 발견되는 고혈당 상태입니다.\n\n## 원인과 위험 요인\n태반 호르몬이 인슐린 작용을 방해해 생기며, 비만·고령 임신·가족력이 위험을 높입니다. 출산 후 2형 당뇨병 위험이 커집니다.\n\n## 주요 증상\n대개 증상이 없어 임신 중 선별 검사로 찾습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nHigh blood glucose first recognized during pregnancy.\n\n## Causes and risk factors\nPlacental hormones interfere with insulin action; obesity, older maternal age and family history raise the risk. It increases later risk of type 2 diabetes.\n\n## Key symptoms\nUsually symptomless and detected by screening during pregnancy.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299997000,"updated":1794299997000},{"id":"dz-dka","kind":"disease","category":"대사·내분비","title_ko":"당뇨병성 케톤산증","title_orig":"Diabetic ketoacidosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diabetic%20ketoacidosis","tags":["질병 백과","응급","케톤"],"body_ko":"## 개요\n인슐린이 심하게 부족해 몸이 지방을 태우며 케톤이 쌓여 혈액이 산성으로 변하는 응급 상황입니다.\n\n## 원인과 위험 요인\n1형 당뇨병에서 흔하며 인슐린 중단, 감염, 심한 스트레스가 계기가 됩니다.\n\n## 주요 증상\n구토, 복통, 깊고 빠른 호흡, 과일 냄새 나는 숨, 의식 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA medical emergency in which severe insulin deficiency causes fat breakdown, ketone accumulation and acidic blood.\n\n## Causes and risk factors\nMost common in type 1 diabetes; triggered by missed insulin, infection or severe physical stress.\n\n## Key symptoms\nVomiting, abdominal pain, deep rapid breathing, fruity-smelling breath and reduced consciousness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299996000,"updated":1794299996000},{"id":"dz-hypogly","kind":"disease","category":"대사·내분비","title_ko":"저혈당증","title_orig":"Hypoglycemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hypoglycemia","tags":["질병 백과","혈당"],"body_ko":"## 개요\n혈당이 정상보다 낮게 떨어진 상태입니다.\n\n## 원인과 위험 요인\n당뇨병 치료제(인슐린, 설포닐우레아)가 가장 흔한 원인이며, 식사 거름·과음·과한 운동도 원인이 됩니다.\n\n## 주요 증상\n떨림, 식은땀, 두근거림, 배고픔, 혼란. 심하면 의식을 잃을 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBlood glucose falling below the normal range.\n\n## Causes and risk factors\nMost often caused by diabetes medicines (insulin, sulfonylureas); skipped meals, heavy drinking or unusual exercise also contribute.\n\n## Key symptoms\nShakiness, sweating, palpitations, hunger and confusion; severe cases can cause loss of consciousness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299995000,"updated":1794299995000},{"id":"dz-obesity","kind":"disease","category":"대사·내분비","title_ko":"비만","title_orig":"Obesity","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Obesity","tags":["질병 백과","성인병","대사"],"body_ko":"## 개요\n건강을 해칠 정도로 체지방이 과도하게 쌓인 만성 질환입니다.\n\n## 원인과 위험 요인\n섭취 에너지와 소비 에너지의 불균형에 유전, 수면 부족, 일부 약물, 환경 요인이 함께 작용합니다.\n\n## 주요 증상\n2형 당뇨병, 고혈압, 지방간, 수면무호흡, 관절 질환, 일부 암의 위험을 높입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic disease of excess body fat that impairs health.\n\n## Causes and risk factors\nResults from energy imbalance shaped by genetics, short sleep, certain medicines and environment.\n\n## Key symptoms\nRaises the risk of type 2 diabetes, hypertension, fatty liver, sleep apnea, joint disease and some cancers.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299994000,"updated":1794299994000},{"id":"dz-dyslip","kind":"disease","category":"대사·내분비","title_ko":"이상지질혈증","title_orig":"Dyslipidemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Dyslipidemia","tags":["질병 백과","콜레스테롤","성인병"],"body_ko":"## 개요\n혈액 속 LDL 콜레스테롤이나 중성지방이 높거나 HDL 콜레스테롤이 낮은 상태입니다.\n\n## 원인과 위험 요인\n유전(가족성 고콜레스테롤혈증), 포화지방 많은 식사, 비만, 운동 부족, 당뇨병이 원인입니다.\n\n## 주요 증상\n증상은 거의 없지만 동맥경화를 일으켜 심근경색·뇌졸중 위험을 높입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAbnormal blood lipids: high LDL cholesterol or triglycerides, or low HDL cholesterol.\n\n## Causes and risk factors\nCauses include genetics (familial hypercholesterolemia), diets high in saturated fat, obesity, inactivity and diabetes.\n\n## Key symptoms\nUsually symptomless but drives atherosclerosis, increasing heart attack and stroke risk.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299993000,"updated":1794299993000},{"id":"dz-metsyn","kind":"disease","category":"대사·내분비","title_ko":"대사증후군","title_orig":"Metabolic syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Metabolic%20syndrome","tags":["질병 백과","인슐린 저항성","성인병"],"body_ko":"## 개요\n복부 비만, 높은 혈압, 높은 혈당, 높은 중성지방, 낮은 HDL 중 여러 가지가 한 사람에게 함께 나타나는 상태입니다.\n\n## 원인과 위험 요인\n인슐린 저항성이 중심 기전이며 운동 부족과 과식이 큰 영향을 줍니다.\n\n## 주요 증상\n자체 증상은 적지만 2형 당뇨병과 심혈관 질환 위험을 크게 높입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA cluster of abdominal obesity, raised blood pressure, high glucose, high triglycerides and low HDL cholesterol in one person.\n\n## Causes and risk factors\nInsulin resistance is the central mechanism, strongly influenced by inactivity and overeating.\n\n## Key symptoms\nFew symptoms itself but strongly raises the risk of type 2 diabetes and cardiovascular disease.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299992000,"updated":1794299992000},{"id":"dz-gout","kind":"disease","category":"대사·내분비","title_ko":"통풍","title_orig":"Gout","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Gout","tags":["질병 백과","요산","관절"],"body_ko":"## 개요\n혈액 속 요산이 높아 관절에 요산 결정이 쌓이며 생기는 염증성 관절염입니다.\n\n## 원인과 위험 요인\n요산 배설 저하, 과음(특히 맥주), 고기·내장·과당 음료 과다 섭취, 비만, 이뇨제가 원인입니다.\n\n## 주요 증상\n엄지발가락 등 관절이 갑자기 붓고 붉어지며 매우 아픕니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammatory arthritis caused by urate crystal deposits in joints due to high blood uric acid.\n\n## Causes and risk factors\nLinked to reduced uric acid excretion, alcohol (especially beer), high intake of meat, organ meats and fructose drinks, obesity and diuretics.\n\n## Key symptoms\nSudden, very painful, red, swollen joints, often the big toe.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299991000,"updated":1794299991000},{"id":"dz-hashimoto","kind":"disease","category":"대사·내분비","title_ko":"갑상선기능저하증 (하시모토 갑상선염)","title_orig":"Hypothyroidism (Hashimoto's thyroiditis)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hypothyroidism","tags":["질병 백과","갑상선","자가면역"],"body_ko":"## 개요\n갑상선 호르몬이 부족한 상태로, 가장 흔한 원인은 자가면역성 하시모토 갑상선염입니다.\n\n## 원인과 위험 요인\n자가항체가 갑상선을 공격하며 여성에게 많습니다. 갑상선 수술, 방사성 요오드 치료 후에도 생깁니다.\n\n## 주요 증상\n피로, 추위를 탐, 체중 증가, 변비, 피부 건조, 우울감.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDeficient thyroid hormone, most commonly due to autoimmune Hashimoto's thyroiditis.\n\n## Causes and risk factors\nAutoantibodies attack the thyroid; more common in women. Also follows thyroid surgery or radioiodine.\n\n## Key symptoms\nFatigue, cold intolerance, weight gain, constipation, dry skin and low mood.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299990000,"updated":1794299990000},{"id":"dz-graves","kind":"disease","category":"대사·내분비","title_ko":"갑상선기능항진증 (그레이브스병)","title_orig":"Hyperthyroidism (Graves' disease)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hyperthyroidism","tags":["질병 백과","갑상선","자가면역"],"body_ko":"## 개요\n갑상선 호르몬이 과다한 상태로, 흔한 원인은 자가항체가 갑상선을 자극하는 그레이브스병입니다.\n\n## 원인과 위험 요인\n자가면역, 유전, 흡연(눈 증상 악화)과 관련됩니다.\n\n## 주요 증상\n두근거림, 체중 감소, 더위를 탐, 손 떨림, 불안, 눈 돌출.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nExcess thyroid hormone, commonly from Graves' disease in which autoantibodies stimulate the thyroid.\n\n## Causes and risk factors\nAssociated with autoimmunity, genetics and smoking (which worsens eye disease).\n\n## Key symptoms\nPalpitations, weight loss, heat intolerance, tremor, anxiety and bulging eyes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299989000,"updated":1794299989000},{"id":"dz-cushing","kind":"disease","category":"대사·내분비","title_ko":"쿠싱 증후군","title_orig":"Cushing's syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cushing%27s%20syndrome","tags":["질병 백과","코르티솔","스테로이드"],"body_ko":"## 개요\n몸에 코르티솔이 오랫동안 과다한 상태입니다.\n\n## 원인과 위험 요인\n가장 흔한 원인은 스테로이드 약 복용이며, 뇌하수체 종양이나 부신 종양도 원인입니다.\n\n## 주요 증상\n얼굴이 둥글어짐, 복부 비만, 자주색 피부선, 고혈압, 고혈당, 근력 약화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nProlonged exposure to excess cortisol.\n\n## Causes and risk factors\nMost often caused by glucocorticoid medicines; pituitary or adrenal tumours are other causes.\n\n## Key symptoms\nRounded face, central obesity, purple stretch marks, high blood pressure, high glucose and muscle weakness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299988000,"updated":1794299988000},{"id":"dz-addison","kind":"disease","category":"대사·내분비","title_ko":"애디슨병 (원발성 부신기능저하증)","title_orig":"Addison's disease (primary adrenal insufficiency)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Addison%27s%20disease","tags":["질병 백과","부신","코르티솔"],"body_ko":"## 개요\n부신이 코르티솔과 알도스테론을 충분히 만들지 못하는 질환입니다.\n\n## 원인과 위험 요인\n선진국에서는 자가면역이 가장 흔하며 결핵도 원인이 됩니다.\n\n## 주요 증상\n피로, 체중 감소, 피부가 검어짐, 저혈압, 소금이 당김. 위기 시 쇼크가 올 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe adrenal glands fail to produce enough cortisol and aldosterone.\n\n## Causes and risk factors\nAutoimmunity is the most common cause in high-income countries; tuberculosis is another.\n\n## Key symptoms\nFatigue, weight loss, skin darkening, low blood pressure and salt craving; adrenal crisis can cause shock.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299987000,"updated":1794299987000},{"id":"dz-osteopor","kind":"disease","category":"대사·내분비","title_ko":"골다공증","title_orig":"Osteoporosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Osteoporosis","tags":["질병 백과","뼈","폐경"],"body_ko":"## 개요\n뼈의 양과 질이 떨어져 작은 충격에도 쉽게 부러지는 질환입니다.\n\n## 원인과 위험 요인\n폐경 후 에스트로겐 감소, 노화, 스테로이드 사용, 흡연, 저체중, 칼슘·비타민 D 부족이 원인입니다.\n\n## 주요 증상\n골절 전에는 증상이 없고, 척추 압박골절로 키가 줄거나 허리가 굽을 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nReduced bone mass and quality leading to fractures from minor trauma.\n\n## Causes and risk factors\nLinked to postmenopausal estrogen loss, ageing, glucocorticoids, smoking, low body weight and low calcium or vitamin D.\n\n## Key symptoms\nSilent until fracture; vertebral fractures can cause height loss and a stooped back.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299986000,"updated":1794299986000},{"id":"dz-masld","kind":"disease","category":"소화기","title_ko":"대사이상 관련 지방간 질환","title_orig":"Metabolic dysfunction-associated steatotic liver disease (MASLD)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Metabolic%20dysfunction-associated%20steatotic%20liver%20disease","tags":["질병 백과","간","지방간","대사"],"body_ko":"## 개요\n술을 많이 마시지 않는데 간에 지방이 쌓이는 질환으로, 예전에는 비알코올성 지방간 질환(NAFLD)으로 불렸습니다.\n\n## 원인과 위험 요인\n비만, 2형 당뇨병, 이상지질혈증 등 대사 이상이 원인입니다.\n\n## 주요 증상\n대부분 증상이 없으나 일부는 간염(MASH), 간경변, 간암으로 진행합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nFat accumulation in the liver without heavy alcohol use; formerly called non-alcoholic fatty liver disease (NAFLD).\n\n## Causes and risk factors\nDriven by metabolic risk factors such as obesity, type 2 diabetes and dyslipidemia.\n\n## Key symptoms\nMostly symptomless; some progress to steatohepatitis (MASH), cirrhosis or liver cancer.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299985000,"updated":1794299985000},{"id":"dz-pcos","kind":"disease","category":"여성 건강","title_ko":"다낭성 난소 증후군","title_orig":"Polycystic ovary syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Polycystic%20ovary%20syndrome","tags":["질병 백과","호르몬","인슐린 저항성"],"body_ko":"## 개요\n불규칙한 배란, 남성호르몬 과다, 난소의 작은 낭종들이 특징인 흔한 호르몬 질환입니다.\n\n## 원인과 위험 요인\n유전과 인슐린 저항성이 중요하게 관여합니다.\n\n## 주요 증상\n생리 불순, 여드름, 털 과다, 난임, 체중 증가.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA common hormonal disorder featuring irregular ovulation, excess androgens and polycystic ovaries.\n\n## Causes and risk factors\nGenetics and insulin resistance play key roles.\n\n## Key symptoms\nIrregular periods, acne, excess hair growth, subfertility and weight gain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299984000,"updated":1794299984000},{"id":"dz-aldost","kind":"disease","category":"대사·내분비","title_ko":"원발성 알도스테론증","title_orig":"Primary aldosteronism","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Primary%20aldosteronism","tags":["질병 백과","고혈압","부신"],"body_ko":"## 개요\n부신에서 알도스테론이 과다하게 나와 고혈압을 일으키는 질환입니다.\n\n## 원인과 위험 요인\n부신 선종이나 양쪽 부신 과형성이 원인입니다. 약에 잘 듣지 않는 고혈압의 흔한 원인입니다.\n\n## 주요 증상\n고혈압, 때로 저칼륨혈증으로 근력 약화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nExcess aldosterone production by the adrenal glands causing hypertension.\n\n## Causes and risk factors\nCaused by an adrenal adenoma or bilateral adrenal hyperplasia; a common cause of resistant hypertension.\n\n## Key symptoms\nHigh blood pressure, sometimes muscle weakness from low potassium.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299983000,"updated":1794299983000},{"id":"dz-pheo","kind":"disease","category":"대사·내분비","title_ko":"갈색세포종","title_orig":"Pheochromocytoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pheochromocytoma","tags":["질병 백과","부신","고혈압"],"body_ko":"## 개요\n부신에서 아드레날린 계열 호르몬을 과다하게 만드는 종양입니다.\n\n## 원인과 위험 요인\n일부는 유전 증후군과 관련됩니다.\n\n## 주요 증상\n발작적인 두통, 땀, 두근거림, 심한 고혈압.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn adrenal tumour that secretes excess catecholamines such as adrenaline.\n\n## Causes and risk factors\nSome are linked to inherited syndromes.\n\n## Key symptoms\nEpisodes of headache, sweating, palpitations and severe hypertension.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299982000,"updated":1794299982000},{"id":"dz-hyperpth","kind":"disease","category":"대사·내분비","title_ko":"부갑상선기능항진증","title_orig":"Hyperparathyroidism","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hyperparathyroidism","tags":["질병 백과","칼슘","뼈"],"body_ko":"## 개요\n부갑상선 호르몬이 과다해 혈중 칼슘이 높아지는 질환입니다.\n\n## 원인과 위험 요인\n대부분 부갑상선의 양성 선종이 원인입니다.\n\n## 주요 증상\n요로결석, 골다공증, 피로, 변비, 우울감. 증상 없이 검사에서 발견되기도 합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nExcess parathyroid hormone causing high blood calcium.\n\n## Causes and risk factors\nUsually caused by a benign parathyroid adenoma.\n\n## Key symptoms\nKidney stones, osteoporosis, fatigue, constipation and low mood; often found incidentally.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299981000,"updated":1794299981000},{"id":"dz-htn","kind":"disease","category":"심혈관","title_ko":"고혈압","title_orig":"Hypertension","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hypertension","tags":["질병 백과","혈압","성인병"],"body_ko":"## 개요\n혈압이 지속적으로 높은 상태로, 심장병·뇌졸중·콩팥병의 가장 중요한 위험 요인 중 하나입니다.\n\n## 원인과 위험 요인\n대부분은 뚜렷한 원인이 없는 본태성이며, 나이, 짠 음식, 비만, 운동 부족, 과음, 유전이 관여합니다.\n\n## 주요 증상\n대개 증상이 없어 '침묵의 살인자'라고 불립니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPersistently raised blood pressure; one of the leading risk factors for heart disease, stroke and kidney disease.\n\n## Causes and risk factors\nMostly essential (no single cause), influenced by age, high salt intake, obesity, inactivity, alcohol and genetics.\n\n## Key symptoms\nUsually symptomless, hence called the 'silent killer'.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299980000,"updated":1794299980000},{"id":"dz-ami","kind":"disease","category":"심혈관","title_ko":"급성 심근경색","title_orig":"Acute myocardial infarction","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20myocardial%20infarction","tags":["질병 백과","응급","관상동맥","성인병"],"body_ko":"## 개요\n심장 근육에 피를 보내는 관상동맥이 막혀 심장 근육이 손상되는 응급 질환입니다.\n\n## 원인과 위험 요인\n대부분 동맥경화반이 터지면서 혈전이 생겨 혈관을 막습니다. 흡연, 고혈압, 당뇨병, 이상지질혈증, 비만, 가족력이 위험 요인입니다.\n\n## 주요 증상\n가슴을 짓누르는 통증이 팔·턱·등으로 퍼지고, 식은땀·호흡곤란·구역이 동반됩니다. 여성·노인·당뇨병 환자는 증상이 덜 전형적일 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn emergency in which blockage of a coronary artery damages heart muscle.\n\n## Causes and risk factors\nUsually caused by rupture of an atherosclerotic plaque with clot formation. Risk factors include smoking, hypertension, diabetes, dyslipidemia, obesity and family history.\n\n## Key symptoms\nCrushing chest pain spreading to the arm, jaw or back, with sweating, breathlessness and nausea. Women, older adults and people with diabetes may have atypical symptoms.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299979000,"updated":1794299979000},{"id":"dz-angina","kind":"disease","category":"심혈관","title_ko":"협심증","title_orig":"Angina pectoris","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Angina%20pectoris","tags":["질병 백과","관상동맥"],"body_ko":"## 개요\n관상동맥이 좁아져 심장 근육에 산소가 부족할 때 생기는 가슴 통증입니다.\n\n## 원인과 위험 요인\n동맥경화가 주원인이며 위험 요인은 심근경색과 같습니다.\n\n## 주요 증상\n운동이나 스트레스 때 가슴이 조이고 쉬면 나아집니다. 쉬어도 계속되면 불안정 협심증으로 응급입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nChest pain caused by insufficient oxygen to heart muscle from narrowed coronary arteries.\n\n## Causes and risk factors\nMainly due to atherosclerosis, with the same risk factors as myocardial infarction.\n\n## Key symptoms\nChest tightness on exertion or stress that eases with rest; pain at rest suggests unstable angina, an emergency.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299978000,"updated":1794299978000},{"id":"dz-hf","kind":"disease","category":"심혈관","title_ko":"심부전","title_orig":"Heart failure","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Heart%20failure","tags":["질병 백과","심장"],"body_ko":"## 개요\n심장이 몸에 필요한 만큼 피를 내보내지 못하거나 채우지 못하는 상태입니다.\n\n## 원인과 위험 요인\n심근경색, 고혈압, 판막 질환, 심근병증, 부정맥이 원인입니다.\n\n## 주요 증상\n숨참(특히 누울 때), 다리 부종, 피로, 체중 증가.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe heart cannot pump or fill adequately to meet the body's needs.\n\n## Causes and risk factors\nCaused by myocardial infarction, hypertension, valve disease, cardiomyopathy or arrhythmias.\n\n## Key symptoms\nBreathlessness (especially lying flat), leg swelling, fatigue and weight gain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299977000,"updated":1794299977000},{"id":"dz-afib","kind":"disease","category":"심혈관","title_ko":"심방세동","title_orig":"Atrial fibrillation","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Atrial%20fibrillation","tags":["질병 백과","부정맥","뇌졸중"],"body_ko":"## 개요\n심방이 불규칙하고 빠르게 떨리는 가장 흔한 부정맥입니다.\n\n## 원인과 위험 요인\n나이, 고혈압, 심장 질환, 갑상선기능항진증, 과음, 수면무호흡, 비만이 위험 요인입니다.\n\n## 주요 증상\n두근거림, 어지러움, 피로. 혈전이 생겨 뇌졸중 위험이 크게 높아집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common sustained arrhythmia, with rapid irregular atrial activity.\n\n## Causes and risk factors\nRisk factors include age, hypertension, heart disease, hyperthyroidism, alcohol, sleep apnea and obesity.\n\n## Key symptoms\nPalpitations, dizziness and fatigue; clots in the atria greatly increase stroke risk.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299976000,"updated":1794299976000},{"id":"dz-athero","kind":"disease","category":"심혈관","title_ko":"죽상동맥경화증","title_orig":"Atherosclerosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Atherosclerosis","tags":["질병 백과","혈관","콜레스테롤","성인병"],"body_ko":"## 개요\n혈관 벽에 콜레스테롤과 염증 세포가 쌓여 동맥이 좁아지고 딱딱해지는 과정입니다.\n\n## 원인과 위험 요인\nLDL 콜레스테롤, 흡연, 고혈압, 당뇨병, 만성 염증, 나이가 관여합니다.\n\n## 주요 증상\n오랫동안 증상이 없다가 협심증, 심근경색, 뇌졸중, 말초동맥질환으로 나타납니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBuild-up of cholesterol and inflammatory cells in artery walls, narrowing and stiffening arteries.\n\n## Causes and risk factors\nDriven by LDL cholesterol, smoking, hypertension, diabetes, chronic inflammation and age.\n\n## Key symptoms\nSilent for years until it presents as angina, heart attack, stroke or peripheral artery disease.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299975000,"updated":1794299975000},{"id":"dz-pad","kind":"disease","category":"심혈관","title_ko":"말초동맥질환","title_orig":"Peripheral artery disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Peripheral%20artery%20disease","tags":["질병 백과","혈관"],"body_ko":"## 개요\n주로 다리로 가는 동맥이 동맥경화로 좁아지는 질환입니다.\n\n## 원인과 위험 요인\n흡연과 당뇨병이 특히 강한 위험 요인입니다.\n\n## 주요 증상\n걸을 때 종아리가 아프고 쉬면 나아지는 간헐적 파행, 상처가 잘 낫지 않음.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nNarrowing of arteries, mainly to the legs, due to atherosclerosis.\n\n## Causes and risk factors\nSmoking and diabetes are especially strong risk factors.\n\n## Key symptoms\nCalf pain on walking relieved by rest (claudication) and poorly healing wounds.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299974000,"updated":1794299974000},{"id":"dz-dvt","kind":"disease","category":"심혈관","title_ko":"심부정맥혈전증","title_orig":"Deep vein thrombosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Deep%20vein%20thrombosis","tags":["질병 백과","혈전"],"body_ko":"## 개요\n주로 다리의 깊은 정맥에 혈전이 생기는 질환입니다.\n\n## 원인과 위험 요인\n오래 움직이지 않음, 수술, 암, 임신, 경구피임약, 유전적 혈전 경향이 원인입니다.\n\n## 주요 증상\n한쪽 다리가 붓고 아프며 열감이 있습니다. 혈전이 폐로 가면 폐색전증이 됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA blood clot in a deep vein, usually in the leg.\n\n## Causes and risk factors\nLinked to immobility, surgery, cancer, pregnancy, oral contraceptives and inherited clotting disorders.\n\n## Key symptoms\nSwelling, pain and warmth in one leg; clots can travel to the lungs (pulmonary embolism).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299973000,"updated":1794299973000},{"id":"dz-pe","kind":"disease","category":"심혈관","title_ko":"폐색전증","title_orig":"Pulmonary embolism","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pulmonary%20embolism","tags":["질병 백과","응급","혈전"],"body_ko":"## 개요\n혈전이 폐동맥을 막는 응급 질환으로, 대개 다리 정맥 혈전에서 옵니다.\n\n## 원인과 위험 요인\n심부정맥혈전증과 같은 위험 요인을 가집니다.\n\n## 주요 증상\n갑작스러운 숨참, 숨 쉴 때 가슴 통증, 빠른 맥박, 객혈, 실신.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn emergency in which a clot blocks a pulmonary artery, usually from a leg vein.\n\n## Causes and risk factors\nShares the risk factors of deep vein thrombosis.\n\n## Key symptoms\nSudden breathlessness, pleuritic chest pain, rapid pulse, coughing blood or fainting.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299972000,"updated":1794299972000},{"id":"dz-aaa","kind":"disease","category":"심혈관","title_ko":"복부 대동맥류","title_orig":"Abdominal aortic aneurysm","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Abdominal%20aortic%20aneurysm","tags":["질병 백과","혈관","응급"],"body_ko":"## 개요\n배 속 대동맥이 풍선처럼 늘어나는 질환입니다.\n\n## 원인과 위험 요인\n흡연, 나이 많은 남성, 고혈압, 가족력이 위험 요인입니다.\n\n## 주요 증상\n대개 증상이 없으나 터지면 심한 복통·허리 통증과 쇼크로 생명이 위험합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBallooning of the abdominal aorta.\n\n## Causes and risk factors\nRisk factors include smoking, older male sex, hypertension and family history.\n\n## Key symptoms\nUsually silent; rupture causes severe abdominal or back pain and shock and is life-threatening.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299971000,"updated":1794299971000},{"id":"dz-dissect","kind":"disease","category":"심혈관","title_ko":"대동맥 박리","title_orig":"Aortic dissection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Aortic%20dissection","tags":["질병 백과","응급","혈관"],"body_ko":"## 개요\n대동맥 벽의 안쪽 막이 찢어져 벽 사이로 피가 파고드는 응급 질환입니다.\n\n## 원인과 위험 요인\n조절되지 않은 고혈압, 마판 증후군 등 결합조직 질환이 원인입니다.\n\n## 주요 증상\n찢어지는 듯한 갑작스러운 가슴·등 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA tear in the aortic inner lining allowing blood to split the wall layers.\n\n## Causes and risk factors\nCaused by uncontrolled hypertension and connective tissue disorders such as Marfan syndrome.\n\n## Key symptoms\nSudden tearing chest or back pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299970000,"updated":1794299970000},{"id":"dz-hcm","kind":"disease","category":"심혈관","title_ko":"비대성 심근병증","title_orig":"Hypertrophic cardiomyopathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hypertrophic%20cardiomyopathy","tags":["질병 백과","유전","심장"],"body_ko":"## 개요\n심장 근육이 비정상적으로 두꺼워지는 유전 질환입니다.\n\n## 원인과 위험 요인\n심장 근육 단백질 유전자 변이가 원인입니다.\n\n## 주요 증상\n숨참, 가슴 통증, 실신. 젊은 운동선수 돌연사의 원인 중 하나입니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn inherited condition in which heart muscle becomes abnormally thick.\n\n## Causes and risk factors\nCaused by mutations in heart muscle (sarcomere) protein genes.\n\n## Key symptoms\nBreathlessness, chest pain and fainting; a cause of sudden death in young athletes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299969000,"updated":1794299969000},{"id":"dz-dcm","kind":"disease","category":"심혈관","title_ko":"확장성 심근병증","title_orig":"Dilated cardiomyopathy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Dilated%20cardiomyopathy","tags":["질병 백과","심장"],"body_ko":"## 개요\n심장 근육이 늘어나고 약해져 수축력이 떨어지는 질환입니다.\n\n## 원인과 위험 요인\n유전, 바이러스 심근염, 과음, 일부 항암제가 원인입니다.\n\n## 주요 증상\n심부전 증상과 부정맥.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe heart muscle becomes dilated and weak with reduced pumping.\n\n## Causes and risk factors\nCauses include genetics, viral myocarditis, alcohol and some chemotherapy drugs.\n\n## Key symptoms\nHeart failure symptoms and arrhythmias.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299968000,"updated":1794299968000},{"id":"dz-myocard","kind":"disease","category":"심혈관","title_ko":"심근염","title_orig":"Myocarditis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Myocarditis","tags":["질병 백과","염증","바이러스"],"body_ko":"## 개요\n심장 근육에 생기는 염증입니다.\n\n## 원인과 위험 요인\n바이러스 감염이 가장 흔한 원인이며 자가면역 질환, 약물도 원인입니다.\n\n## 주요 증상\n가슴 통증, 숨참, 두근거림, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of the heart muscle.\n\n## Causes and risk factors\nViral infection is the most common cause; autoimmune disease and drugs are others.\n\n## Key symptoms\nChest pain, breathlessness, palpitations and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299967000,"updated":1794299967000},{"id":"dz-pericard","kind":"disease","category":"심혈관","title_ko":"심낭염","title_orig":"Pericarditis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pericarditis","tags":["질병 백과","염증"],"body_ko":"## 개요\n심장을 싸는 막(심낭)에 생기는 염증입니다.\n\n## 원인과 위험 요인\n대부분 바이러스 감염이나 원인 불명이며, 심근경색 후나 자가면역 질환에서도 생깁니다.\n\n## 주요 증상\n날카로운 가슴 통증이 앞으로 숙이면 나아지고 누우면 심해집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInflammation of the sac surrounding the heart.\n\n## Causes and risk factors\nMostly viral or idiopathic; also follows heart attack or occurs with autoimmune disease.\n\n## Key symptoms\nSharp chest pain that eases when leaning forward and worsens lying down.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299966000,"updated":1794299966000},{"id":"dz-endocard","kind":"disease","category":"심혈관","title_ko":"감염성 심내막염","title_orig":"Infective endocarditis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Infective%20endocarditis","tags":["질병 백과","감염","판막"],"body_ko":"## 개요\n심장 판막이나 심장 안쪽 막에 세균 등이 감염되는 질환입니다.\n\n## 원인과 위험 요인\n포도알균, 연쇄상구균이 흔하며 인공판막, 판막 질환, 주사 약물 사용이 위험 요인입니다.\n\n## 주요 증상\n열, 피로, 새로운 심잡음, 색전 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of the heart valves or inner lining of the heart.\n\n## Causes and risk factors\nCommonly caused by staphylococci or streptococci; risk factors include prosthetic or damaged valves and injection drug use.\n\n## Key symptoms\nFever, fatigue, new heart murmur and embolic events.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299965000,"updated":1794299965000},{"id":"dz-rhd","kind":"disease","category":"심혈관","title_ko":"류마티스 심장병","title_orig":"Rheumatic heart disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rheumatic%20heart%20disease","tags":["질병 백과","판막","연쇄상구균"],"body_ko":"## 개요\nA군 연쇄상구균 인두염 후 류마티스열이 반복되면서 심장 판막이 손상되는 질환입니다.\n\n## 원인과 위험 요인\n치료받지 못한 연쇄상구균 감염에 대한 면역 반응이 원인입니다.\n\n## 주요 증상\n숨참, 피로, 심잡음, 심부전.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nHeart valve damage resulting from rheumatic fever after group A streptococcal throat infection.\n\n## Causes and risk factors\nCaused by an immune reaction to untreated streptococcal infection.\n\n## Key symptoms\nBreathlessness, fatigue, heart murmurs and heart failure.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299964000,"updated":1794299964000},{"id":"dz-as","kind":"disease","category":"심혈관","title_ko":"대동맥판 협착증","title_orig":"Aortic stenosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Aortic%20stenosis","tags":["질병 백과","판막"],"body_ko":"## 개요\n대동맥 판막이 좁아져 심장에서 피가 나가기 어려워지는 질환입니다.\n\n## 원인과 위험 요인\n노화에 따른 판막 석회화가 가장 흔하고, 선천성 이첨판도 원인입니다.\n\n## 주요 증상\n운동 시 숨참, 가슴 통증, 실신.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nNarrowing of the aortic valve obstructing blood flow out of the heart.\n\n## Causes and risk factors\nMost often age-related calcification; a congenital bicuspid valve is another cause.\n\n## Key symptoms\nBreathlessness, chest pain and fainting on exertion.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299963000,"updated":1794299963000},{"id":"dz-asd","kind":"disease","category":"심혈관","title_ko":"심방중격결손","title_orig":"Atrial septal defect","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Atrial%20septal%20defect","tags":["질병 백과","선천성"],"body_ko":"## 개요\n좌우 심방 사이 벽에 구멍이 있는 선천성 심장 질환입니다.\n\n## 원인과 위험 요인\n태아기 심장 발달 이상입니다.\n\n## 주요 증상\n어릴 때는 증상이 없다가 성인이 되어 숨참, 부정맥이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA congenital hole in the wall between the heart's upper chambers.\n\n## Causes and risk factors\nArises from abnormal heart development before birth.\n\n## Key symptoms\nOften silent in childhood; may cause breathlessness or arrhythmias in adulthood.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299962000,"updated":1794299962000},{"id":"dz-varicose","kind":"disease","category":"심혈관","title_ko":"하지정맥류","title_orig":"Varicose veins","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Varicose%20veins","tags":["질병 백과","정맥"],"body_ko":"## 개요\n다리의 표재 정맥이 늘어나 구불구불하게 튀어나오는 질환입니다.\n\n## 원인과 위험 요인\n정맥 판막 기능 저하, 오래 서 있는 직업, 임신, 유전이 원인입니다.\n\n## 주요 증상\n다리 무거움, 부종, 저림, 피부 변화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nDilated, twisted superficial leg veins.\n\n## Causes and risk factors\nDue to faulty vein valves, prolonged standing, pregnancy and genetics.\n\n## Key symptoms\nHeavy legs, swelling, aching and skin changes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299961000,"updated":1794299961000},{"id":"dz-noh","kind":"disease","category":"기립성 저혈압","title_ko":"신경인성 기립성 저혈압","title_orig":"Neurogenic orthostatic hypotension","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Neurogenic%20orthostatic%20hypotension","tags":["질병 백과","자율신경","파킨슨"],"body_ko":"## 개요\n자율신경이 손상돼 일어설 때 혈관을 수축시키는 신호(노르아드레날린)가 충분히 나오지 않아 혈압이 떨어지는 질환입니다.\n\n## 원인과 위험 요인\n파킨슨병, 다계통 위축증, 루이소체 치매, 순수 자율신경부전, 당뇨병성 자율신경병증, 아밀로이드증이 원인입니다.\n\n## 주요 증상\n일어설 때 어지러움, 눈앞이 캄캄함, 목·어깨 통증(옷걸이 통증), 실신. 누우면 혈압이 오히려 높은 경우가 많습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA fall in blood pressure on standing because damaged autonomic nerves release too little noradrenaline to constrict blood vessels.\n\n## Causes and risk factors\nCaused by Parkinson's disease, multiple system atrophy, Lewy body dementia, pure autonomic failure, diabetic autonomic neuropathy and amyloidosis.\n\n## Key symptoms\nLightheadedness, dimmed vision, neck and shoulder ('coat-hanger') pain and fainting on standing; supine hypertension is common.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299960000,"updated":1794299960000},{"id":"dz-nonnoh","kind":"disease","category":"기립성 저혈압","title_ko":"비신경인성 기립성 저혈압","title_orig":"Non-neurogenic orthostatic hypotension","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Non-neurogenic%20orthostatic%20hypotension","tags":["질병 백과","탈수","약물"],"body_ko":"## 개요\n자율신경은 정상이지만 혈액량 부족이나 약물 때문에 일어설 때 혈압이 떨어지는 경우입니다.\n\n## 원인과 위험 요인\n탈수, 출혈, 구토·설사, 오래 누워 지냄, 혈압약·이뇨제·전립선약·항우울제 등 약물, 과음이 원인입니다.\n\n## 주요 증상\n일어설 때 어지러움, 피로, 흐린 시야, 넘어짐. 원인을 고치면 좋아지는 경우가 많습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA blood pressure fall on standing with intact autonomic nerves, due to low blood volume or drugs.\n\n## Causes and risk factors\nCauses include dehydration, bleeding, vomiting or diarrhoea, prolonged bed rest, antihypertensives, diuretics, alpha-blockers, antidepressants and alcohol.\n\n## Key symptoms\nDizziness, fatigue, blurred vision and falls on standing; often improves once the cause is corrected.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299959000,"updated":1794299959000},{"id":"dz-pots","kind":"disease","category":"기립성 저혈압","title_ko":"체위성 기립 빈맥 증후군","title_orig":"Postural orthostatic tachycardia syndrome (POTS)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Postural%20orthostatic%20tachycardia%20syndrome","tags":["질병 백과","빈맥","자율신경"],"body_ko":"## 개요\n일어설 때 혈압은 크게 떨어지지 않지만 맥박이 지나치게 빨라지는 증후군입니다(성인 기준 10분 안에 분당 30회 이상 증가).\n\n## 원인과 위험 요인\n젊은 여성에게 흔하며 바이러스 감염(코로나19 포함) 후, 혈액량 감소, 신체 탈조건화, 자율신경 이상과 관련됩니다.\n\n## 주요 증상\n일어서면 두근거림, 어지러움, 떨림, 피로, 머리가 멍함.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA syndrome in which heart rate rises excessively on standing (by 30 beats per minute or more within 10 minutes in adults) without marked hypotension.\n\n## Causes and risk factors\nMost common in young women; linked to post-viral states (including COVID-19), low blood volume, deconditioning and autonomic dysfunction.\n\n## Key symptoms\nPalpitations, lightheadedness, tremor, fatigue and brain fog on standing.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299958000,"updated":1794299958000},{"id":"dz-msa","kind":"disease","category":"기립성 저혈압","title_ko":"다계통 위축증","title_orig":"Multiple system atrophy","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Multiple%20system%20atrophy","tags":["질병 백과","자율신경","신경퇴행"],"body_ko":"## 개요\n자율신경, 운동 조절, 균형을 담당하는 뇌 부위가 함께 퇴화하는 진행성 신경 질환입니다.\n\n## 원인과 위험 요인\n알파-시누클레인 단백질이 신경교세포에 쌓이는 것이 특징이며 원인은 밝혀지지 않았습니다.\n\n## 주요 증상\n심한 기립성 저혈압, 배뇨 장애, 파킨슨 증상, 비틀거림, 말이 어눌함.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA progressive neurodegenerative disease affecting autonomic, movement and balance systems.\n\n## Causes and risk factors\nCharacterised by alpha-synuclein accumulation in glial cells; the cause is unknown.\n\n## Key symptoms\nSevere orthostatic hypotension, bladder dysfunction, parkinsonism, unsteadiness and slurred speech.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299957000,"updated":1794299957000},{"id":"dz-paf","kind":"disease","category":"기립성 저혈압","title_ko":"순수 자율신경부전","title_orig":"Pure autonomic failure","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pure%20autonomic%20failure","tags":["질병 백과","자율신경"],"body_ko":"## 개요\n다른 신경 증상 없이 자율신경만 서서히 망가지는 드문 질환입니다.\n\n## 원인과 위험 요인\n말초 자율신경에 알파-시누클레인이 쌓이며 일부는 나중에 파킨슨병이나 다계통 위축증으로 진행합니다.\n\n## 주요 증상\n기립성 저혈압, 땀 감소, 변비, 배뇨·성기능 장애.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA rare disorder of slowly progressive autonomic failure without other neurological signs.\n\n## Causes and risk factors\nAlpha-synuclein deposits in peripheral autonomic nerves; some later develop Parkinson's disease or MSA.\n\n## Key symptoms\nOrthostatic hypotension, reduced sweating, constipation, bladder and sexual dysfunction.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299956000,"updated":1794299956000},{"id":"dz-vvs","kind":"disease","category":"기립성 저혈압","title_ko":"혈관미주신경성 실신","title_orig":"Vasovagal syncope","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Vasovagal%20syncope","tags":["질병 백과","실신","반사"],"body_ko":"## 개요\n오래 서 있거나 통증·공포 같은 자극에 반응해 맥박과 혈압이 갑자기 떨어지며 잠깐 의식을 잃는 가장 흔한 실신입니다.\n\n## 원인과 위험 요인\n정상적인 반사가 과도하게 일어나는 것으로, 더위·탈수·피를 보는 상황이 유발합니다.\n\n## 주요 증상\n실신 전 메스꺼움, 식은땀, 창백함, 시야가 좁아짐.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common faint: a sudden reflex drop in heart rate and blood pressure triggered by prolonged standing, pain or fear.\n\n## Causes and risk factors\nAn exaggerated normal reflex, provoked by heat, dehydration or the sight of blood.\n\n## Key symptoms\nNausea, sweating, pallor and tunnel vision before fainting.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299955000,"updated":1794299955000},{"id":"dz-pph","kind":"disease","category":"기립성 저혈압","title_ko":"식후 저혈압","title_orig":"Postprandial hypotension","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Postprandial%20hypotension","tags":["질병 백과","노인","식사"],"body_ko":"## 개요\n식사 후 2시간 안에 혈압이 크게 떨어지는 상태입니다.\n\n## 원인과 위험 요인\n혈액이 소화기관으로 몰리는데 보상이 부족해 생기며, 노인과 자율신경 질환 환자에게 흔합니다.\n\n## 주요 증상\n식후 어지러움, 졸림, 넘어짐, 실신.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA significant fall in blood pressure within two hours of eating.\n\n## Causes and risk factors\nBlood pools in the gut without adequate compensation; common in older adult
