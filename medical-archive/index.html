function loadMore(kind){
  const u=kind==='lib'?UI.lib:UI[kind],arr=CUR.items||[];
  const list=$('#llist');if(!list||u.shown>=arr.length)return;
  const from=u.shown;u.shown=Math.min(arr.length,from+BATCH);
  list.insertAdjacentHTML('beforeend',arr.slice(from,u.shown).map(p=>(CUR.mapper||cardHTML)(p,CUR.toks)).join(''));
  const m=$('#msent'),b=$('[data-act="more"]');
  if(u.shown>=arr.length){if(m)m.remove();if(b)b.remove()}else if(b)b.textContent=`더 보기 (${arr.length-u.shown}개 남음)`;
}
function setupMore(fn){
  if(!('IntersectionObserver'in window))return null;
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))fn()},{rootMargin:'600px 0px'});
  CUR.io=io;CUR.watch=()=>{const m=$('#msent');if(m)io.observe(m)};
  const mo=new MutationObserver(()=>{if(CUR.watch)CUR.watch()});
  const box=$('#lres');if(box)mo.observe(box,{childList:true,subtree:true});
  CUR.watch();
  const prev=io.disconnect.bind(io);io.disconnect=()=>{prev();mo.disconnect()};
  return io;
}

/* ---------- Detail ---------- */
function relatedFor(p){
  const tags=new Set(dispTags(p));
  const score=q=>{let s=0;if(q.category===p.category)s+=2;dispTags(q).forEach(t=>{if(tags.has(t))s++});return s};
  const pick=kind=>S.posts.filter(q=>q.id!==p.id&&(q.kind||'paper')===kind).map(q=>[score(q),q]).filter(x=>x[0]>=2).sort((a,b)=>b[0]-a[0]||(b[1].updated||0)-(a[1].updated||0)).slice(0,kind==='paper'?3:4).map(x=>x[1]);
  return{notes:pick('paper'),dis:pick('disease')};
}
function detailHTML(p){
  const hasKo=!!p.body_ko,hasOr=!!p.body_orig,both=hasKo&&hasOr;
  let mode=DET.mode||SET.view||'ko';
  if(!['ko','orig','both'].includes(mode))mode='ko';
  if(!hasOr&&mode!=='ko')mode='ko';
  if(!hasKo&&mode==='ko')mode='orig';
  if(mode==='both'&&!both)mode=hasKo?'ko':'orig';
  const sk=parseSections(p.body_ko),so=parseSections(p.body_orig);
  const secs=mode==='orig'?so:sk;
  const titled=(mode==='both'?sk:secs).map((s,i)=>({s,i})).filter(x=>x.s.title);
  const toc=titled.length>=2?`<nav class="toc" aria-label="목차">${titled.map(x=>`<a href="#sec-${x.i}" data-act="toc" data-i="${x.i}">${esc(x.s.title)}</a>`).join('')}</nav>`:'';
  const secHTML=(s,i)=>{
    const muted=/^(참고|note|references?|참고 문헌)/i.test(s.title);
    return`<section class="sec${s.title?'':' lead'}${muted?' muted':''}" id="sec-${i}" data-sec="${i}">${s.title?`<h3 class="sec-h"><span class="si">${ic(secIcon(s.title))}</span>${esc(s.title)}</h3>`:''}<div class="md">${mdBlock(s.body)}</div></section>`;
  };
  let body;
  if(mode==='both'){
    const n=Math.max(sk.length,so.length);
    body=Array.from({length:n},(_,i)=>{
      const a=sk[i],b=so[i];
      const side=(s,lbl,lang)=>s?`<div class="${lang?'o':'k'}"${lang?' lang="en"':''}>${i===0?`<div class="lbl">${lbl}</div>`:''}${s.title?`<h3>${esc(s.title)}</h3>`:''}<div class="md">${mdBlock(s.body)}</div></div>`:`<div class="${lang?'o':'k'}"><div class="empty-side">—</div></div>`;
      return`<div class="pair" id="sec-${i}" data-sec="${i}">${side(a,'한국어',0)}${side(b,'ORIGINAL',1)}</div>`;
    }).join('');
  }else body=secs.map(secHTML).join('')||`<div class="empty-side" style="color:var(--text2)">본문이 없어요.</div>`;
  const title=mode==='orig'?(p.title_orig||p.title_ko):(p.title_ko||p.title_orig);
  const sub=p.title_ko&&p.title_orig?(mode==='orig'?p.title_ko:p.title_orig):'';
  const cite=citeLine(p);
  const link=p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">${p.kind==='disease'?'PubMed에서 관련 논문 찾기 →':esc(p.link)}</a>`:'';
  const dl=[['한글명',p.title_ko],['원문명',p.title_orig],['분야',p.category?badge(p.category):''],['태그',dispTags(p).length?`<div class="tags">${dispTags(p).map(t=>`<button type="button" class="tag" data-act="tag" data-tag="${esc(t)}" data-kind="${p.kind==='disease'?'disease':'notes'}">#${esc(t)}</button>`).join('')}</div>`:''],['출처',[esc(cite),link].filter(Boolean).join('<br>')]]
    .filter(x=>x[1]).map(([k,v],i)=>`<div><dt>${k}</dt><dd>${(k==='한글명'||k==='원문명')?esc(v):v}</dd></div>`).join('');
  const sum=summaryOf(p);
  const memo=MEMO[p.id]||'';
  const rel=relatedFor(p);
  const relH=(t,arr)=>arr.length?`<div class="sec-t"><h2>${t}</h2></div><div class="rows">${arr.map(q=>rowHTML(q,{stack:1,preview:70,sub:`${q.category||'기타'}${q.kind==='paper'?` · ${[q.authors,q.year].filter(Boolean).join(' ')}`:''}`})).join('')}</div>`:'';
  const same=S.posts.filter(q=>(q.kind||'paper')===(p.kind||'paper')).sort((a,b)=>(b.created||0)-(a.created||0));
  const i=same.findIndex(q=>q.id===p.id),prev=same[i-1],next=same[i+1];
  const modes=both?seg('mode',[['ko','한국어'],['orig','원문'],['both','함께 보기']],mode):'';

function detailScroll(){
  const art=$('#dbody');if(!art)return;
  const bar=$('.progress i');
  const top=art.getBoundingClientRect().top+window.scrollY,h=art.offsetHeight||1;
  const pct=Math.max(0,Math.min(1,(window.scrollY+window.innerHeight-top)/h));
  if(bar)bar.style.width=(pct*100).toFixed(1)+'%';
  const hh=($('.hdr')||{offsetHeight:56}).offsetHeight+80;
  let cur=-1;$$('[data-sec]',art).forEach(el=>{if(el.getBoundingClientRect().top<=hh)cur=+el.dataset.sec});
  const links=$$('.toc a');
  if(links.length){
    let hit=null;links.forEach(a=>{const on=+a.dataset.i===cur;a.classList.toggle('on',on);if(on)hit=a});
    if(hit&&CUR.lastToc!==cur){CUR.lastToc=cur;const t=$('.toc');if(t){const l=hit.offsetLeft-t.clientWidth/2+hit.offsetWidth/2;t.scrollLeft=l}}
  }
}

let OV=null,lockY=0,lockN=0;
function lock(){if(lockN++===0){lockY=window.scrollY;document.body.style.top=(-lockY)+'px';document.body.classList.add('lock')}}
function unlock(){if(--lockN<=0){lockN=0;document.body.classList.remove('lock');document.body.style.top='';window.scrollTo(0,lockY)}}
function openOv(o){
  return new Promise(res=>{
    if(OV)closeOv(false);
    const el=document.createElement('div');el.className='ov'+(o.center?' center':'');
    const acts=(o.actions||[]).map((a,i)=>`<button type="button" class="btn ${a.cls||''}" ${a.id?`id="${a.id}"`:''} ${a.disabled?'disabled':''} data-ov-i="${i}">${a.label}</button>`).join('');
    el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title||'')}" tabindex="-1"><div class="grab"></div><div class="sheet-h"><h2>${esc(o.title||'')}</h2><button type="button" class="ib" data-ov-close aria-label="닫기">${ic('close')}</button></div>${o.html||''}${acts?`<div class="btns" style="margin-top:6px">${acts}</div>`:''}</div>`;
    el.addEventListener('click',e=>{
      if(e.target===el||e.target.closest('[data-ov-close]'))return closeOv(false);
      const v=e.target.closest('[data-ov]');if(v)return closeOv(v.dataset.ov);
      const b=e.target.closest('[data-ov-i]');
      if(b){const a=o.actions[+b.dataset.ovI];if(a.keep){a.fn&&a.fn();return}closeOv(a.value)}
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Escape'){e.preventDefault();closeOv(false)}
      if(e.key==='Tab'){const f=$$('button:not([disabled]),input,textarea,select,[href]',el).filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    });
    lock();document.body.appendChild(el);
    OV={el,res,prev:document.activeElement};
    const sh=$('.sheet',el);if(o.mount)o.mount(el);if(!$('input:focus',el))sh.focus({preventScroll:true});
  });
}
function closeOv(v){
  if(!OV)return;const{el,res,prev}=OV;OV=null;el.remove();unlock();
  if(prev&&prev.focus&&document.contains(prev))try{prev.focus({preventScroll:true})}catch(e){}
  res(v);
}

    const t=e.target;
    if(t.id==='rfile'&&t.files&&t.files[0]){
      const f=t.files[0];
      try{const text=await f.text();RESTORE.text=text;RESTORE.src='file';RESTORE.name=f.name;RESTORE.size=f.size;RESTORE.report=validateBackup(text);renderRestoreUI();
        toast(RESTORE.report.ok?'파일을 읽었어요. 합치기 또는 전체 바꾸기를 누르세요.':'파일을 확인해 주세요.',{err:!RESTORE.report.ok})}
      catch(err){toast('파일을 읽지 못했어요.',{err:true})}
      t.value='';
    }
    if(t.dataset&&t.dataset.f==='kind')edInput(t);
  });
  document.addEventListener('focusin',e=>{
    const t=e.target;
    if(t.tagName==='TEXTAREA'&&ED&&t.dataset.f)ED.lastTA=t;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&t.type!=='range'&&t.type!=='search'&&!t.closest('.ov')){
      setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(err){}},380);
    }
  });
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return;ticking=true;
    requestAnimationFrame(()=>{ticking=false;if(!document.body.classList.contains('lock'))SCROLL[CUR.key]=window.scrollY;$('#totop').classList.toggle('show',window.scrollY>700&&CUR.view!=='edit');if(CUR.onScroll)CUR.onScroll()});
  },{passive:true});
  window.addEventListener('hashchange',()=>{
    const h=location.hash||'#/',n=NAVS.length;
    if(NAVS[n-1]!==h){if(n>1&&NAVS[n-2]===h)NAVS.pop();else NAVS.push(h)}
    if(OV)closeOv(false);
    render();
  });
  const flush=()=>{if(ED)flushDraft()};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
  window.addEventListener('pagehide',flush);
  window.addEventListener('beforeunload',e=>{if(edDirty()){flush();e.preventDefault();e.returnValue=''}});
  if(window.visualViewport){
    const vv=window.visualViewport,f=()=>document.body.classList.toggle('kb',window.innerHeight-vv.height>140);
    vv.addEventListener('resize',f);
  }
  if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');const h=()=>{if(SET.theme==='system')applyPrefs()};mq.addEventListener?mq.addEventListener('change',h):mq.addListener&&mq.addListener(h)}
  /* 확대 방지(기존 동작 유지) — 글자 크기는 설정의 읽기 환경으로 조절 */
  const o={passive:false},pd=ev=>ev.preventDefault();
  document.addEventListener('gesturestart',pd,o);document.addEventListener('gesturechange',pd,o);document.addEventListener('gestureend',pd,o);
  document.addEventListener('touchmove',ev=>{if(ev.touches&&ev.touches.length>1)ev.preventDefault()},o);
  let last=0;
  document.addEventListener('touchend',ev=>{
    const now=Date.now(),inter=ev.target.closest&&ev.target.closest('input,textarea,select,button,a,label,summary,[data-act],[role="link"],.nav');
    if(now-last<320&&!inter)ev.preventDefault();last=now;
  },o);
  document.addEventListener('dblclick',pd,o);
  window.addEventListener('wheel',ev=>{if(ev.ctrlKey||ev.metaKey)ev.preventDefault()},o);
  window.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&['+','-','=','_','0'].includes(ev.key))ev.preventDefault()});
}

/* ===================== Boot ===================== */
(function boot(){
  applyPrefs();
  Object.keys(DRAFTS).forEach(k=>{if(!k.startsWith('new:')&&!IDX.has(k))delete DRAFTS[k]});
  if(FRESH)persist();
  initEvents();
  const r=parseRoute();
  history.replaceState(null,'',location.hash||'#/');
  render();
})();

})();
</script>
</body>
