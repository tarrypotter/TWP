s and people with autonomic disorders.\n\n## Key symptoms\nDizziness, drowsiness, falls or fainting after meals.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299954000,"updated":1794299954000},{"id":"dz-lungca","kind":"disease","category":"암","title_ko":"폐암","title_orig":"Lung cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Lung%20cancer","tags":["질병 백과","흡연","호흡기"],"body_ko":"## 개요\n전 세계 암 사망 원인 1위인 암으로, 비소세포폐암과 소세포폐암으로 나뉩니다.\n\n## 원인과 위험 요인\n흡연이 가장 큰 원인이며 간접흡연, 라돈, 석면, 대기오염, 요리 매연도 관여합니다.\n\n## 주요 증상\n기침, 객혈, 숨참, 가슴 통증, 체중 감소. 초기에는 증상이 거의 없습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe leading cause of cancer death worldwide, divided into non-small cell and small cell types.\n\n## Causes and risk factors\nSmoking is the main cause; secondhand smoke, radon, asbestos, air pollution and cooking fumes also contribute.\n\n## Key symptoms\nCough, coughing blood, breathlessness, chest pain and weight loss; early disease is often silent.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299953000,"updated":1794299953000},{"id":"dz-gastricca","kind":"disease","category":"암","title_ko":"위암","title_orig":"Stomach cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Stomach%20cancer","tags":["질병 백과","헬리코박터","소화기"],"body_ko":"## 개요\n위 점막에서 생기는 암으로, 한국·일본 등 동아시아에서 많이 발생합니다.\n\n## 원인과 위험 요인\n헬리코박터 파일로리 감염, 짜고 절인 음식, 흡연, 가족력이 위험 요인입니다.\n\n## 주요 증상\n초기엔 증상이 거의 없고, 진행하면 소화불량, 체중 감소, 빈혈, 흑변이 나타납니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer arising from the stomach lining, common in East Asia including Korea and Japan.\n\n## Causes and risk factors\nRisk factors include Helicobacter pylori infection, salty and preserved foods, smoking and family history.\n\n## Key symptoms\nOften silent early; later indigestion, weight loss, anaemia and black stools.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299952000,"updated":1794299952000},{"id":"dz-crc","kind":"disease","category":"암","title_ko":"대장암","title_orig":"Colorectal cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Colorectal%20cancer","tags":["질병 백과","용종","소화기"],"body_ko":"## 개요\n대장과 직장에 생기는 암으로, 대부분 선종성 용종에서 시작합니다.\n\n## 원인과 위험 요인\n가공육·붉은 고기 과다, 비만, 운동 부족, 흡연, 과음, 염증성 장질환, 가족력이 위험 요인입니다.\n\n## 주요 증상\n혈변, 배변 습관 변화, 빈혈, 복통. 대장내시경으로 조기 발견할 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the colon or rectum, mostly developing from adenomatous polyps.\n\n## Causes and risk factors\nRisk factors include processed and red meat, obesity, inactivity, smoking, alcohol, inflammatory bowel disease and family history.\n\n## Key symptoms\nBlood in stool, change in bowel habit, anaemia and abdominal pain; colonoscopy allows early detection.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299951000,"updated":1794299951000},{"id":"dz-hcc","kind":"disease","category":"암","title_ko":"간암 (간세포암)","title_orig":"Liver cancer (hepatocellular carcinoma)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Liver%20cancer","tags":["질병 백과","간염","간"],"body_ko":"## 개요\n간세포에서 생기는 암입니다.\n\n## 원인과 위험 요인\nB형·C형 간염, 간경변, 과음, 지방간 질환, 아플라톡신이 원인입니다.\n\n## 주요 증상\n초기 증상이 거의 없고, 진행하면 오른쪽 윗배 통증, 황달, 체중 감소.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer arising from liver cells.\n\n## Causes and risk factors\nCaused by hepatitis B and C, cirrhosis, alcohol, fatty liver disease and aflatoxin.\n\n## Key symptoms\nLittle early warning; later right upper abdominal pain, jaundice and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299950000,"updated":1794299950000},{"id":"dz-breastca","kind":"disease","category":"암","title_ko":"유방암","title_orig":"Breast cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Breast%20cancer","tags":["질병 백과","호르몬","유전"],"body_ko":"## 개요\n여성에게 가장 흔한 암 중 하나로, 유방의 유관이나 소엽에서 생깁니다.\n\n## 원인과 위험 요인\n나이, 이른 초경·늦은 폐경, 출산 경험 없음, 호르몬 치료, 비만, 음주, BRCA1/2 유전자 변이가 위험 요인입니다.\n\n## 주요 증상\n유방 멍울, 피부 함몰, 유두 분비물. 검진으로 조기 발견이 중요합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nOne of the most common cancers in women, arising from breast ducts or lobules.\n\n## Causes and risk factors\nRisk factors include age, early menarche or late menopause, nulliparity, hormone therapy, obesity, alcohol and BRCA1/2 mutations.\n\n## Key symptoms\nA breast lump, skin dimpling or nipple discharge; screening aids early detection.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299949000,"updated":1794299949000},{"id":"dz-thyroidca","kind":"disease","category":"암","title_ko":"갑상선암","title_orig":"Thyroid cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Thyroid%20cancer","tags":["질병 백과","갑상선"],"body_ko":"## 개요\n갑상선에 생기는 암으로, 대부분 진행이 느린 유두암입니다.\n\n## 원인과 위험 요인\n어린 시절 방사선 노출과 가족력이 위험 요인입니다. 한국에서는 검진 증가로 발견이 크게 늘었습니다.\n\n## 주요 증상\n목 앞쪽 멍울, 대부분 증상이 없습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the thyroid gland, mostly slow-growing papillary carcinoma.\n\n## Causes and risk factors\nRisk factors include childhood radiation exposure and family history; in Korea detection rose sharply with screening.\n\n## Key symptoms\nA lump in the front of the neck; usually symptomless.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299948000,"updated":1794299948000},{"id":"dz-prostateca","kind":"disease","category":"암","title_ko":"전립선암","title_orig":"Prostate cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Prostate%20cancer","tags":["질병 백과","남성","호르몬"],"body_ko":"## 개요\n남성의 전립선에 생기는 암으로, 진행이 느린 경우가 많습니다.\n\n## 원인과 위험 요인\n나이, 가족력, 아프리카계 혈통, BRCA2 변이가 위험 요인입니다.\n\n## 주요 증상\n초기엔 증상이 없고, 진행하면 배뇨 곤란, 혈뇨, 뼈 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the prostate gland, often slow-growing.\n\n## Causes and risk factors\nRisk factors include age, family history, African ancestry and BRCA2 mutations.\n\n## Key symptoms\nSilent early; later urinary difficulty, blood in urine and bone pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299947000,"updated":1794299947000},{"id":"dz-pancca","kind":"disease","category":"암","title_ko":"췌장암","title_orig":"Pancreatic cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pancreatic%20cancer","tags":["질병 백과","소화기"],"body_ko":"## 개요\n췌장에 생기는 암으로, 늦게 발견되는 경우가 많아 예후가 나쁩니다.\n\n## 원인과 위험 요인\n흡연, 비만, 당뇨병, 만성 췌장염, 가족력이 위험 요인입니다.\n\n## 주요 증상\n황달, 등으로 퍼지는 윗배 통증, 체중 감소, 새로 생긴 당뇨병.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the pancreas, often diagnosed late with poor prognosis.\n\n## Causes and risk factors\nRisk factors include smoking, obesity, diabetes, chronic pancreatitis and family history.\n\n## Key symptoms\nJaundice, upper abdominal pain radiating to the back, weight loss and new-onset diabetes.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299946000,"updated":1794299946000},{"id":"dz-biliaryca","kind":"disease","category":"암","title_ko":"담도암","title_orig":"Biliary tract cancer (cholangiocarcinoma)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Biliary%20tract%20cancer","tags":["질병 백과","간흡충","담관"],"body_ko":"## 개요\n담즙이 흐르는 담관에 생기는 암입니다.\n\n## 원인과 위험 요인\n간흡충 감염, 원발 경화성 담관염, 담석, 담관 낭종이 위험 요인입니다.\n\n## 주요 증상\n황달, 가려움, 회색 변, 체중 감소.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the bile ducts.\n\n## Causes and risk factors\nRisk factors include liver fluke infection, primary sclerosing cholangitis, gallstones and choledochal cysts.\n\n## Key symptoms\nJaundice, itching, pale stools and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299945000,"updated":1794299945000},{"id":"dz-esophca","kind":"disease","category":"암","title_ko":"식도암","title_orig":"Esophageal cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Esophageal%20cancer","tags":["질병 백과","흡연","음주"],"body_ko":"## 개요\n식도에 생기는 암으로, 편평세포암과 선암이 있습니다.\n\n## 원인과 위험 요인\n편평세포암은 흡연·음주, 선암은 위식도역류·바렛 식도·비만과 관련됩니다.\n\n## 주요 증상\n삼키기 어려움, 체중 감소, 가슴 뒤쪽 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the oesophagus, either squamous cell carcinoma or adenocarcinoma.\n\n## Causes and risk factors\nSquamous type is linked to smoking and alcohol; adenocarcinoma to reflux, Barrett's oesophagus and obesity.\n\n## Key symptoms\nDifficulty swallowing, weight loss and chest pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299944000,"updated":1794299944000},{"id":"dz-cervicalca","kind":"disease","category":"암","title_ko":"자궁경부암","title_orig":"Cervical cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cervical%20cancer","tags":["질병 백과","HPV","바이러스","여성"],"body_ko":"## 개요\n자궁 입구인 자궁경부에 생기는 암입니다.\n\n## 원인과 위험 요인\n대부분 고위험 인유두종바이러스(HPV) 지속 감염이 원인이며, 백신과 검진으로 예방할 수 있습니다.\n\n## 주요 증상\n비정상 질 출혈, 성관계 후 출혈, 질 분비물.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the cervix.\n\n## Causes and risk factors\nAlmost always caused by persistent high-risk human papillomavirus (HPV) infection; preventable by vaccination and screening.\n\n## Key symptoms\nAbnormal vaginal bleeding, bleeding after sex and discharge.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299943000,"updated":1794299943000},{"id":"dz-ovarianca","kind":"disease","category":"암","title_ko":"난소암","title_orig":"Ovarian cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ovarian%20cancer","tags":["질병 백과","여성","유전"],"body_ko":"## 개요\n난소나 나팔관에서 생기는 암으로, 늦게 발견되는 경우가 많습니다.\n\n## 원인과 위험 요인\n나이, BRCA1/2 변이, 가족력, 자궁내막증이 위험 요인입니다.\n\n## 주요 증상\n배부름, 복부 팽만, 골반 통증, 잦은 소변 등 모호한 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the ovary or fallopian tube, often diagnosed late.\n\n## Causes and risk factors\nRisk factors include age, BRCA1/2 mutations, family history and endometriosis.\n\n## Key symptoms\nVague bloating, abdominal distension, pelvic pain and urinary frequency.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299942000,"updated":1794299942000},{"id":"dz-endomca","kind":"disease","category":"암","title_ko":"자궁내막암","title_orig":"Endometrial cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Endometrial%20cancer","tags":["질병 백과","여성","호르몬"],"body_ko":"## 개요\n자궁 안쪽 막에 생기는 암입니다.\n\n## 원인과 위험 요인\n에스트로겐에 오래 노출됨, 비만, 당뇨병, 다낭성 난소 증후군, 린치 증후군이 위험 요인입니다.\n\n## 주요 증상\n폐경 후 질 출혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the lining of the uterus.\n\n## Causes and risk factors\nRisk factors include unopposed estrogen, obesity, diabetes, polycystic ovary syndrome and Lynch syndrome.\n\n## Key symptoms\nPostmenopausal vaginal bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299941000,"updated":1794299941000},{"id":"dz-bladderca","kind":"disease","category":"암","title_ko":"방광암","title_orig":"Bladder cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bladder%20cancer","tags":["질병 백과","흡연"],"body_ko":"## 개요\n방광 안쪽 막에서 생기는 암입니다.\n\n## 원인과 위험 요인\n흡연이 가장 큰 원인이며 염료·화학물질 직업 노출도 관여합니다.\n\n## 주요 증상\n통증 없는 혈뇨.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer arising from the bladder lining.\n\n## Causes and risk factors\nSmoking is the main cause; occupational exposure to dyes and chemicals also contributes.\n\n## Key symptoms\nPainless blood in the urine.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299940000,"updated":1794299940000},{"id":"dz-kidneyca","kind":"disease","category":"암","title_ko":"신장암","title_orig":"Kidney cancer (renal cell carcinoma)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Kidney%20cancer","tags":["질병 백과","콩팥"],"body_ko":"## 개요\n콩팥 세포에서 생기는 암입니다.\n\n## 원인과 위험 요인\n흡연, 비만, 고혈압, 일부 유전 증후군이 위험 요인입니다.\n\n## 주요 증상\n혈뇨, 옆구리 통증, 덩어리. 다른 검사 중 우연히 발견되는 경우가 많습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer arising from kidney cells.\n\n## Causes and risk factors\nRisk factors include smoking, obesity, hypertension and inherited syndromes.\n\n## Key symptoms\nBlood in urine, flank pain or a mass; often found incidentally on imaging.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299939000,"updated":1794299939000},{"id":"dz-melanoma","kind":"disease","category":"암","title_ko":"흑색종","title_orig":"Melanoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Melanoma","tags":["질병 백과","피부","자외선"],"body_ko":"## 개요\n피부의 색소 세포에서 생기는 공격적인 피부암입니다.\n\n## 원인과 위험 요인\n자외선 노출(특히 어릴 때 화상), 많은 점, 흰 피부, 가족력이 위험 요인입니다. 동양인은 손발바닥·손발톱에 생기기도 합니다.\n\n## 주요 증상\n모양이 비대칭이고 경계가 불규칙하며 색이 고르지 않고 커지는 점.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn aggressive skin cancer arising from pigment cells.\n\n## Causes and risk factors\nRisk factors include UV exposure (especially childhood sunburn), many moles, fair skin and family history; in Asian people it often occurs on palms, soles and nails.\n\n## Key symptoms\nAn asymmetric, irregular, multicoloured or enlarging mole.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299938000,"updated":1794299938000},{"id":"dz-bcc","kind":"disease","category":"암","title_ko":"기저세포암","title_orig":"Basal cell carcinoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Basal%20cell%20carcinoma","tags":["질병 백과","피부","자외선"],"body_ko":"## 개요\n가장 흔한 피부암으로, 천천히 자라고 전이는 드뭅니다.\n\n## 원인과 위험 요인\n누적된 자외선 노출이 주원인입니다.\n\n## 주요 증상\n진주처럼 반짝이는 작은 혹이나 잘 낫지 않는 상처.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common skin cancer; slow-growing and rarely spreads.\n\n## Causes and risk factors\nMainly caused by cumulative UV exposure.\n\n## Key symptoms\nA pearly bump or a sore that does not heal.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299937000,"updated":1794299937000},{"id":"dz-aml","kind":"disease","category":"암","title_ko":"급성 골수성 백혈병","title_orig":"Acute myeloid leukaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20myeloid%20leukaemia","tags":["질병 백과","혈액암"],"body_ko":"## 개요\n골수에서 미성숙한 골수계 세포가 빠르게 늘어나는 혈액암입니다.\n\n## 원인과 위험 요인\n나이, 이전 항암·방사선 치료, 벤젠 노출, 흡연, 골수형성이상증후군이 관련됩니다.\n\n## 주요 증상\n피로, 감염이 잦음, 쉽게 멍이 들고 피가 남.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA blood cancer with rapid growth of immature myeloid cells in the bone marrow.\n\n## Causes and risk factors\nLinked to age, prior chemotherapy or radiation, benzene, smoking and myelodysplastic syndromes.\n\n## Key symptoms\nFatigue, frequent infections and easy bruising or bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299936000,"updated":1794299936000},{"id":"dz-all","kind":"disease","category":"암","title_ko":"급성 림프모구 백혈병","title_orig":"Acute lymphoblastic leukaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Acute%20lymphoblastic%20leukaemia","tags":["질병 백과","혈액암","소아"],"body_ko":"## 개요\n미성숙한 림프구가 골수에서 빠르게 늘어나는 혈액암으로, 소아암 중 가장 흔합니다.\n\n## 원인과 위험 요인\n대부분 원인이 뚜렷하지 않으며 다운증후군 등 일부 유전 질환에서 위험이 높습니다.\n\n## 주요 증상\n창백함, 열, 멍, 뼈 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA blood cancer of immature lymphocytes; the most common childhood cancer.\n\n## Causes and risk factors\nMostly no clear cause; risk is higher in some genetic conditions such as Down syndrome.\n\n## Key symptoms\nPallor, fever, bruising and bone pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299935000,"updated":1794299935000},{"id":"dz-cll","kind":"disease","category":"암","title_ko":"만성 림프구성 백혈병","title_orig":"Chronic lymphocytic leukaemia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chronic%20lymphocytic%20leukaemia","tags":["질병 백과","혈액암"],"body_ko":"## 개요\n성숙한 B림프구가 천천히 늘어나는 혈액암으로, 서양 노인에게 흔합니다.\n\n## 원인과 위험 요인\n나이와 가족력이 위험 요인입니다.\n\n## 주요 증상\n대부분 증상이 없고 혈액 검사에서 발견됩니다. 림프절 비대, 피로.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA slowly progressive cancer of mature B lymphocytes, common in older Western adults.\n\n## Causes and risk factors\nAge and family history are risk factors.\n\n## Key symptoms\nOften found on blood tests; lymph node enlargement and fatigue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299934000,"updated":1794299934000},{"id":"dz-hodgkin","kind":"disease","category":"암","title_ko":"호지킨 림프종","title_orig":"Hodgkin lymphoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hodgkin%20lymphoma","tags":["질병 백과","림프종"],"body_ko":"## 개요\n림프절에 생기는 혈액암으로, 리드-스턴버그 세포가 특징입니다.\n\n## 원인과 위험 요인\n엡스타인-바 바이러스 감염과 면역 저하가 관련됩니다.\n\n## 주요 증상\n통증 없는 림프절 비대, 열, 밤에 땀, 체중 감소.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA lymph node cancer characterised by Reed–Sternberg cells.\n\n## Causes and risk factors\nAssociated with Epstein–Barr virus and immunosuppression.\n\n## Key symptoms\nPainless lymph node swelling, fever, night sweats and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299933000,"updated":1794299933000},{"id":"dz-nhl","kind":"disease","category":"암","title_ko":"비호지킨 림프종","title_orig":"Non-Hodgkin lymphoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Non-Hodgkin%20lymphoma","tags":["질병 백과","림프종"],"body_ko":"## 개요\n호지킨 림프종을 제외한 다양한 림프구 암을 묶은 이름입니다.\n\n## 원인과 위험 요인\n면역 저하, 일부 감염(EBV, 헬리코박터, HIV), 자가면역 질환이 관련됩니다.\n\n## 주요 증상\n림프절 비대, 열, 밤에 땀, 체중 감소.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA diverse group of lymphocyte cancers other than Hodgkin lymphoma.\n\n## Causes and risk factors\nLinked to immunosuppression, some infections (EBV, H. pylori, HIV) and autoimmune disease.\n\n## Key symptoms\nLymph node enlargement, fever, night sweats and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299932000,"updated":1794299932000},{"id":"dz-myeloma","kind":"disease","category":"암","title_ko":"다발골수종","title_orig":"Multiple myeloma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Multiple%20myeloma","tags":["질병 백과","혈액암"],"body_ko":"## 개요\n골수의 형질세포가 비정상적으로 늘어나는 혈액암입니다.\n\n## 원인과 위험 요인\n나이가 가장 큰 위험 요인이며, 대부분 MGUS라는 전단계를 거칩니다.\n\n## 주요 증상\n뼈 통증, 빈혈, 고칼슘혈증, 콩팥 기능 저하.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA cancer of plasma cells in the bone marrow.\n\n## Causes and risk factors\nAge is the main risk factor; it is usually preceded by MGUS.\n\n## Key symptoms\nBone pain, anaemia, high calcium and kidney damage.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299931000,"updated":1794299931000},{"id":"dz-gbm","kind":"disease","category":"암","title_ko":"교모세포종","title_orig":"Glioblastoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Glioblastoma","tags":["질병 백과","뇌종양"],"body_ko":"## 개요\n어른에게 가장 흔하고 공격적인 원발성 뇌종양입니다.\n\n## 원인과 위험 요인\n대부분 원인이 뚜렷하지 않으며, 이전 뇌 방사선 노출이 알려진 위험 요인입니다.\n\n## 주요 증상\n두통, 경련, 성격 변화, 팔다리 마비.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common and aggressive primary brain tumour in adults.\n\n## Causes and risk factors\nUsually no clear cause; prior brain irradiation is a known risk factor.\n\n## Key symptoms\nHeadache, seizures, personality change and weakness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299930000,"updated":1794299930000},{"id":"dz-hnca","kind":"disease","category":"암","title_ko":"두경부암 (구인두암)","title_orig":"Head and neck cancer (oropharyngeal cancer)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Head%20and%20neck%20cancer","tags":["질병 백과","HPV","흡연"],"body_ko":"## 개요\n입, 목, 후두 등에 생기는 암으로, 대부분 편평세포암입니다.\n\n## 원인과 위험 요인\n흡연, 음주, HPV 감염(특히 구인두암)이 원인입니다.\n\n## 주요 증상\n낫지 않는 입안 상처, 목 멍울, 삼킴 곤란, 목소리 변화.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancers of the mouth, throat and larynx, mostly squamous cell carcinoma.\n\n## Causes and risk factors\nCaused by smoking, alcohol and HPV infection (especially oropharyngeal cancer).\n\n## Key symptoms\nNon-healing mouth sores, neck lumps, difficulty swallowing and voice change.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299929000,"updated":1794299929000},{"id":"dz-testisca","kind":"disease","category":"암","title_ko":"고환암","title_orig":"Testicular cancer","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Testicular%20cancer","tags":["질병 백과","남성"],"body_ko":"## 개요\n젊은 남성에게 가장 흔한 고형암입니다.\n\n## 원인과 위험 요인\n잠복고환 병력과 가족력이 위험 요인입니다.\n\n## 주요 증상\n통증 없는 고환 멍울이나 붓기.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common solid cancer in young men.\n\n## Causes and risk factors\nRisk factors include undescended testis and family history.\n\n## Key symptoms\nA painless lump or swelling in the testicle.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299928000,"updated":1794299928000},{"id":"dz-sarcoma","kind":"disease","category":"암","title_ko":"육종","title_orig":"Sarcoma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sarcoma","tags":["질병 백과","희귀암"],"body_ko":"## 개요\n뼈, 근육, 지방 등 결합조직에서 생기는 드문 암입니다.\n\n## 원인과 위험 요인\n일부 유전 증후군과 이전 방사선 치료가 관련됩니다.\n\n## 주요 증상\n커지는 덩어리, 뼈 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nRare cancers of connective tissues such as bone, muscle and fat.\n\n## Causes and risk factors\nLinked to some inherited syndromes and prior radiotherapy.\n\n## Key symptoms\nA growing lump or bone pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299927000,"updated":1794299927000},{"id":"dz-net","kind":"disease","category":"암","title_ko":"신경내분비종양","title_orig":"Neuroendocrine tumours","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Neuroendocrine%20tumours","tags":["질병 백과","호르몬"],"body_ko":"## 개요\n호르몬을 만드는 신경내분비 세포에서 생기는 종양으로, 장·췌장·폐에 흔합니다.\n\n## 원인과 위험 요인\n대부분 원인이 뚜렷하지 않고, 다발성 내분비 종양증 등 유전 질환과 관련되기도 합니다.\n\n## 주요 증상\n증상이 없거나 얼굴 홍조, 설사(카르시노이드 증후군) 등이 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nTumours of hormone-producing neuroendocrine cells, commonly in the gut, pancreas and lungs.\n\n## Causes and risk factors\nMostly no clear cause; some are linked to inherited syndromes such as MEN1.\n\n## Key symptoms\nMay be silent or cause flushing and diarrhoea (carcinoid syndrome).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299926000,"updated":1794299926000},{"id":"dz-mesothel","kind":"disease","category":"암","title_ko":"중피종","title_orig":"Mesothelioma","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Mesothelioma","tags":["질병 백과","석면","직업병"],"body_ko":"## 개요\n흉막 등 장기를 싸는 막에 생기는 암입니다.\n\n## 원인과 위험 요인\n대부분 석면 노출이 원인이며, 노출 수십 년 뒤에 생깁니다.\n\n## 주요 증상\n숨참, 가슴 통증, 흉수.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nCancer of the lining of the chest or abdomen.\n\n## Causes and risk factors\nMostly caused by asbestos exposure, decades after exposure.\n\n## Key symptoms\nBreathlessness, chest pain and pleural effusion.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299925000,"updated":1794299925000},{"id":"dz-flu","kind":"disease","category":"바이러스 감염","title_ko":"인플루엔자 (독감)","title_orig":"Influenza","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Influenza","tags":["질병 백과","호흡기","백신"],"body_ko":"## 개요\n인플루엔자 바이러스가 일으키는 급성 호흡기 감염으로, 해마다 겨울철에 유행합니다.\n\n## 원인과 위험 요인\n기침·재채기 비말과 오염된 손으로 퍼집니다. 노인, 영유아, 임신부, 만성 질환자는 합병증 위험이 높습니다.\n\n## 주요 증상\n갑작스러운 고열, 근육통, 두통, 기침, 심한 피로. 폐렴으로 이어질 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn acute respiratory infection caused by influenza viruses, with seasonal winter epidemics.\n\n## Causes and risk factors\nSpread by respiratory droplets and contaminated hands; older adults, infants, pregnant women and people with chronic illness face higher complication risk.\n\n## Key symptoms\nSudden high fever, muscle aches, headache, cough and exhaustion; can lead to pneumonia.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299924000,"updated":1794299924000},{"id":"dz-covid","kind":"disease","category":"바이러스 감염","title_ko":"코로나19","title_orig":"COVID-19","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=COVID-19","tags":["질병 백과","호흡기","코로나"],"body_ko":"## 개요\nSARS-CoV-2 바이러스가 일으키는 감염병으로, 2020년 세계적 대유행을 일으켰습니다.\n\n## 원인과 위험 요인\n비말과 공기 중 미세 입자로 퍼집니다. 노인과 기저질환자는 중증 위험이 높습니다.\n\n## 주요 증상\n열, 기침, 인후통, 피로, 후각·미각 저하. 일부는 장기간 증상(롱코비드)이 남습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with the SARS-CoV-2 virus, which caused the 2020 pandemic.\n\n## Causes and risk factors\nSpread by droplets and airborne aerosols; older adults and people with underlying conditions face higher risk of severe illness.\n\n## Key symptoms\nFever, cough, sore throat, fatigue and loss of smell or taste; some develop long-lasting symptoms (long COVID).\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299923000,"updated":1794299923000},{"id":"dz-cold","kind":"disease","category":"바이러스 감염","title_ko":"감기","title_orig":"Common cold","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Common%20cold","tags":["질병 백과","호흡기"],"body_ko":"## 개요\n코와 목에 생기는 가벼운 바이러스 감염입니다.\n\n## 원인과 위험 요인\n리노바이러스가 가장 흔하며 코로나바이러스, 아데노바이러스 등 200여 종 바이러스가 원인입니다.\n\n## 주요 증상\n콧물, 코막힘, 재채기, 인후통, 기침. 대개 7~10일 안에 낫습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mild viral infection of the nose and throat.\n\n## Causes and risk factors\nMost often rhinoviruses, among more than 200 viruses including coronaviruses and adenoviruses.\n\n## Key symptoms\nRunny or blocked nose, sneezing, sore throat and cough; usually resolves within 7–10 days.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299922000,"updated":1794299922000},{"id":"dz-rsv","kind":"disease","category":"바이러스 감염","title_ko":"RSV 감염 (호흡기세포융합바이러스)","title_orig":"Respiratory syncytial virus infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Respiratory%20syncytial%20virus%20infection","tags":["질병 백과","호흡기","소아"],"body_ko":"## 개요\n영유아 세기관지염과 폐렴의 가장 흔한 원인 바이러스입니다.\n\n## 원인과 위험 요인\n비말과 접촉으로 퍼지며 영아, 미숙아, 노인에게 위험합니다.\n\n## 주요 증상\n콧물, 기침, 쌕쌕거림, 숨참.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe leading viral cause of bronchiolitis and pneumonia in infants.\n\n## Causes and risk factors\nSpread by droplets and contact; most dangerous for infants, premature babies and older adults.\n\n## Key symptoms\nRunny nose, cough, wheezing and breathing difficulty.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299921000,"updated":1794299921000},{"id":"dz-measles","kind":"disease","category":"바이러스 감염","title_ko":"홍역","title_orig":"Measles","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Measles","tags":["질병 백과","백신","소아"],"body_ko":"## 개요\n전염력이 매우 강한 바이러스 감염입니다.\n\n## 원인과 위험 요인\n공기로 퍼지며, MMR 백신으로 예방할 수 있습니다.\n\n## 주요 증상\n고열, 기침, 콧물, 결막염, 입안의 흰 반점(코플릭 반점), 온몸 발진. 폐렴·뇌염 합병증이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA highly contagious viral infection.\n\n## Causes and risk factors\nAirborne spread; preventable with the MMR vaccine.\n\n## Key symptoms\nHigh fever, cough, runny nose, conjunctivitis, Koplik spots and a widespread rash; complications include pneumonia and encephalitis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299920000,"updated":1794299920000},{"id":"dz-mumps","kind":"disease","category":"바이러스 감염","title_ko":"유행성 이하선염 (볼거리)","title_orig":"Mumps","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Mumps","tags":["질병 백과","백신"],"body_ko":"## 개요\n침샘(이하선)이 붓는 바이러스 감염입니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 MMR 백신으로 예방합니다.\n\n## 주요 증상\n귀 아래 볼이 붓고 아픔, 열. 고환염·수막염이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA viral infection causing swelling of the parotid salivary glands.\n\n## Causes and risk factors\nSpread by droplets; prevented by the MMR vaccine.\n\n## Key symptoms\nPainful swelling below the ears and fever; orchitis or meningitis can occur.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299919000,"updated":1794299919000},{"id":"dz-rubella","kind":"disease","category":"바이러스 감염","title_ko":"풍진","title_orig":"Rubella","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rubella","tags":["질병 백과","백신","임신"],"body_ko":"## 개요\n가벼운 발진을 일으키는 바이러스 감염이지만 임신 초기 감염 시 태아에 심각한 기형을 일으킵니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 MMR 백신으로 예방합니다.\n\n## 주요 증상\n미열, 발진, 귀 뒤 림프절 비대.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mild rash illness that can cause severe birth defects if contracted in early pregnancy.\n\n## Causes and risk factors\nSpread by droplets; prevented by the MMR vaccine.\n\n## Key symptoms\nLow fever, rash and swollen lymph nodes behind the ears.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299918000,"updated":1794299918000},{"id":"dz-varicella","kind":"disease","category":"바이러스 감염","title_ko":"수두","title_orig":"Chickenpox (varicella)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Chickenpox","tags":["질병 백과","소아","백신"],"body_ko":"## 개요\n수두-대상포진 바이러스(VZV)의 첫 감염입니다.\n\n## 원인과 위험 요인\n공기와 물집 접촉으로 퍼지며 백신으로 예방합니다.\n\n## 주요 증상\n열과 함께 가려운 물집이 온몸에 차례로 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPrimary infection with varicella-zoster virus (VZV).\n\n## Causes and risk factors\nSpread through the air and contact with blisters; preventable by vaccine.\n\n## Key symptoms\nFever with itchy blisters appearing in crops over the body.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299917000,"updated":1794299917000},{"id":"dz-zoster","kind":"disease","category":"바이러스 감염","title_ko":"대상포진","title_orig":"Shingles (herpes zoster)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Shingles","tags":["질병 백과","면역","스트레스"],"body_ko":"## 개요\n신경에 숨어 있던 수두 바이러스가 다시 활성화되는 질환입니다.\n\n## 원인과 위험 요인\n나이, 면역 저하, 스트레스가 재활성화 위험을 높입니다. 백신으로 예방할 수 있습니다.\n\n## 주요 증상\n몸 한쪽 띠 모양의 통증과 물집. 신경통이 오래 남을 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nReactivation of latent varicella-zoster virus in a nerve.\n\n## Causes and risk factors\nAgeing, immunosuppression and stress raise the risk; vaccines are available.\n\n## Key symptoms\nPainful band of blisters on one side of the body; nerve pain can persist.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299916000,"updated":1794299916000},{"id":"dz-hsv","kind":"disease","category":"바이러스 감염","title_ko":"단순포진","title_orig":"Herpes simplex","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Herpes%20simplex","tags":["질병 백과","스트레스","재발"],"body_ko":"## 개요\n단순포진 바이러스(HSV-1, HSV-2)가 입술이나 생식기에 물집을 일으키는 감염입니다.\n\n## 원인과 위험 요인\n접촉으로 퍼지며 신경에 숨어 있다가 피로·스트레스·자외선에 재발합니다.\n\n## 주요 증상\n따끔거림 후 작은 물집 무리가 생기고 딱지가 집니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with herpes simplex virus (HSV-1, HSV-2) causing oral or genital blisters.\n\n## Causes and risk factors\nSpread by contact; the virus stays latent in nerves and reactivates with fatigue, stress or sunlight.\n\n## Key symptoms\nTingling followed by clusters of small blisters that crust over.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299915000,"updated":1794299915000},{"id":"dz-hav","kind":"disease","category":"바이러스 감염","title_ko":"A형 간염","title_orig":"Hepatitis A","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hepatitis%20A","tags":["질병 백과","간","식수"],"body_ko":"## 개요\nA형 간염 바이러스가 일으키는 급성 간염입니다.\n\n## 원인과 위험 요인\n오염된 음식이나 물로 전파됩니다. 성인이 걸리면 더 심하며 백신으로 예방합니다.\n\n## 주요 증상\n열, 피로, 구역, 황달, 짙은 소변.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAcute liver inflammation caused by hepatitis A virus.\n\n## Causes and risk factors\nTransmitted through contaminated food or water; more severe in adults; preventable by vaccine.\n\n## Key symptoms\nFever, fatigue, nausea, jaundice and dark urine.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299914000,"updated":1794299914000},{"id":"dz-hbv","kind":"disease","category":"바이러스 감염","title_ko":"B형 간염","title_orig":"Hepatitis B","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hepatitis%20B","tags":["질병 백과","간","간암"],"body_ko":"## 개요\nB형 간염 바이러스가 간에 감염되어 만성화될 수 있는 질환입니다.\n\n## 원인과 위험 요인\n혈액, 성 접촉, 출산 시 어머니에게서 아기로 전파됩니다. 백신으로 예방합니다.\n\n## 주요 증상\n급성기 황달·피로, 만성이면 대부분 증상이 없다가 간경변·간암으로 진행할 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection of the liver with hepatitis B virus that can become chronic.\n\n## Causes and risk factors\nSpread by blood, sexual contact and from mother to baby at birth; preventable by vaccine.\n\n## Key symptoms\nAcute jaundice and fatigue; chronic infection is often silent but can progress to cirrhosis and liver cancer.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299913000,"updated":1794299913000},{"id":"dz-hcv","kind":"disease","category":"바이러스 감염","title_ko":"C형 간염","title_orig":"Hepatitis C","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hepatitis%20C","tags":["질병 백과","간","간암"],"body_ko":"## 개요\nC형 간염 바이러스가 간에 만성 감염을 일으키는 질환입니다.\n\n## 원인과 위험 요인\n주로 혈액으로 전파됩니다(오염된 주사기, 비위생적 시술). 먹는 항바이러스제로 대부분 완치됩니다.\n\n## 주요 증상\n대부분 증상이 없다가 간경변·간암으로 진행할 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nChronic liver infection with hepatitis C virus.\n\n## Causes and risk factors\nMainly blood-borne (shared needles, unsafe procedures); oral antivirals cure most cases.\n\n## Key symptoms\nUsually silent until cirrhosis or liver cancer develops.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299912000,"updated":1794299912000},{"id":"dz-hiv","kind":"disease","category":"바이러스 감염","title_ko":"HIV 감염 / 에이즈","title_orig":"HIV infection / AIDS","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=HIV%20infection%20/%20AIDS","tags":["질병 백과","면역","성매개"],"body_ko":"## 개요\n사람면역결핍바이러스(HIV)가 면역세포(CD4 T세포)를 파괴하는 감염으로, 치료하지 않으면 에이즈로 진행합니다.\n\n## 원인과 위험 요인\n성 접촉, 혈액, 출산·수유로 전파됩니다. 항레트로바이러스 치료로 정상에 가까운 수명이 가능합니다.\n\n## 주요 증상\n초기 독감 같은 증상 후 오랫동안 증상이 없고, 진행하면 기회감염과 체중 감소가 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with human immunodeficiency virus, which destroys CD4 T cells and, untreated, progresses to AIDS.\n\n## Causes and risk factors\nTransmitted sexually, through blood and from mother to child; antiretroviral therapy allows near-normal life expectancy.\n\n## Key symptoms\nFlu-like illness early, then years without symptoms; later opportunistic infections and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299911000,"updated":1794299911000},{"id":"dz-hpv","kind":"disease","category":"바이러스 감염","title_ko":"인유두종바이러스 (HPV) 감염","title_orig":"Human papillomavirus infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Human%20papillomavirus%20infection","tags":["질병 백과","백신","암"],"body_ko":"## 개요\n가장 흔한 성매개 바이러스 감염으로, 사마귀와 여러 암의 원인입니다.\n\n## 원인과 위험 요인\n피부·성 접촉으로 퍼지며 백신으로 예방할 수 있습니다.\n\n## 주요 증상\n대부분 증상 없이 사라지지만, 고위험형이 지속되면 자궁경부암·구인두암·항문암을 일으킵니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common sexually transmitted viral infection, causing warts and several cancers.\n\n## Causes and risk factors\nSpread by skin and sexual contact; preventable by vaccination.\n\n## Key symptoms\nMostly clears silently; persistent high-risk types cause cervical, oropharyngeal and anal cancers.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299910000,"updated":1794299910000},{"id":"dz-ebv","kind":"disease","category":"바이러스 감염","title_ko":"전염성 단핵구증 (엡스타인-바 바이러스)","title_orig":"Infectious mononucleosis (Epstein–Barr virus)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Infectious%20mononucleosis","tags":["질병 백과","피로","림프"],"body_ko":"## 개요\n엡스타인-바 바이러스가 일으키는 감염으로 청소년과 젊은 성인에게 흔합니다.\n\n## 원인과 위험 요인\n침으로 전파되어 '키스병'이라고도 합니다. EBV는 일부 림프종·위암·비인두암, 다발성 경화증과도 관련됩니다.\n\n## 주요 증상\n열, 심한 인후통, 목 림프절 비대, 오래가는 피로, 비장 비대.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with Epstein–Barr virus, common in adolescents and young adults.\n\n## Causes and risk factors\nSpread through saliva ('kissing disease'); EBV is also linked to some lymphomas, stomach and nasopharyngeal cancers and multiple sclerosis.\n\n## Key symptoms\nFever, severe sore throat, swollen neck glands, prolonged fatigue and enlarged spleen.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299909000,"updated":1794299909000},{"id":"dz-cmv","kind":"disease","category":"바이러스 감염","title_ko":"거대세포바이러스 감염","title_orig":"Cytomegalovirus infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cytomegalovirus%20infection","tags":["질병 백과","면역","임신"],"body_ko":"## 개요\n흔한 헤르페스 계열 바이러스로, 건강한 사람은 대개 증상이 없습니다.\n\n## 원인과 위험 요인\n체액으로 전파되며 면역 저하자와 태아(선천 감염)에게 위험합니다.\n\n## 주요 증상\n면역 저하자에게 폐렴·망막염·장염, 선천 감염 시 청력 손실을 일으킵니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA common herpesvirus that usually causes no symptoms in healthy people.\n\n## Causes and risk factors\nSpread through body fluids; dangerous for immunocompromised people and unborn babies.\n\n## Key symptoms\nIn the immunocompromised it causes pneumonia, retinitis and colitis; congenital infection can cause hearing loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299908000,"updated":1794299908000},{"id":"dz-dengue","kind":"disease","category":"바이러스 감염","title_ko":"뎅기열","title_orig":"Dengue","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Dengue","tags":["질병 백과","모기","열대"],"body_ko":"## 개요\n모기가 옮기는 뎅기 바이러스 감염으로, 열대·아열대 지역에서 유행합니다.\n\n## 원인과 위험 요인\n이집트숲모기 등이 전파하며, 다른 형으로 다시 걸리면 중증 위험이 높아집니다.\n\n## 주요 증상\n고열, 심한 두통, 눈 뒤 통증, 근육·관절통, 발진. 중증이면 출혈과 쇼크.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mosquito-borne viral infection common in tropical and subtropical regions.\n\n## Causes and risk factors\nSpread by Aedes mosquitoes; a second infection with a different serotype raises the risk of severe disease.\n\n## Key symptoms\nHigh fever, severe headache, pain behind the eyes, muscle and joint pain and rash; severe dengue causes bleeding and shock.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299907000,"updated":1794299907000},{"id":"dz-zika","kind":"disease","category":"바이러스 감염","title_ko":"지카 바이러스 감염","title_orig":"Zika virus infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Zika%20virus%20infection","tags":["질병 백과","모기","임신"],"body_ko":"## 개요\n모기가 옮기는 바이러스 감염입니다.\n\n## 원인과 위험 요인\n숲모기와 성 접촉으로 전파되며 임신 중 감염 시 태아 소두증을 일으킬 수 있습니다.\n\n## 주요 증상\n대부분 가볍거나 증상이 없고 발진, 미열, 결막염이 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mosquito-borne viral infection.\n\n## Causes and risk factors\nSpread by Aedes mosquitoes and sexually; infection in pregnancy can cause microcephaly.\n\n## Key symptoms\nUsually mild or silent, with rash, low fever and conjunctivitis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299906000,"updated":1794299906000},{"id":"dz-yellowfever","kind":"disease","category":"바이러스 감염","title_ko":"황열","title_orig":"Yellow fever","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Yellow%20fever","tags":["질병 백과","모기","백신"],"body_ko":"## 개요\n모기가 옮기는 황열 바이러스 감염으로, 아프리카와 남미에서 발생합니다.\n\n## 원인과 위험 요인\n숲모기가 전파하며 백신으로 예방합니다.\n\n## 주요 증상\n열, 두통, 근육통. 일부는 황달과 출혈로 중증화됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA mosquito-borne viral infection occurring in Africa and South America.\n\n## Causes and risk factors\nSpread by mosquitoes; preventable by vaccine.\n\n## Key symptoms\nFever, headache and muscle pain; some develop jaundice and bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299905000,"updated":1794299905000},{"id":"dz-je","kind":"disease","category":"바이러스 감염","title_ko":"일본뇌염","title_orig":"Japanese encephalitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Japanese%20encephalitis","tags":["질병 백과","모기","뇌염","백신"],"body_ko":"## 개요\n작은빨간집모기가 옮기는 바이러스성 뇌염입니다.\n\n## 원인과 위험 요인\n아시아에서 발생하며 돼지와 물새가 바이러스 저장소입니다. 백신으로 예방합니다.\n\n## 주요 증상\n대부분 증상이 없으나, 뇌염이 생기면 고열, 의식 저하, 경련이 생기고 후유증이 남을 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA viral brain infection spread by Culex mosquitoes.\n\n## Causes and risk factors\nOccurs in Asia, with pigs and wading birds as reservoirs; preventable by vaccine.\n\n## Key symptoms\nMostly silent; encephalitis causes high fever, reduced consciousness and seizures, often with lasting damage.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299904000,"updated":1794299904000},{"id":"dz-rabies","kind":"disease","category":"바이러스 감염","title_ko":"광견병","title_orig":"Rabies","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rabies","tags":["질병 백과","동물","백신"],"body_ko":"## 개요\n감염된 동물에게 물려 전파되는 바이러스성 뇌염으로, 증상이 생기면 거의 대부분 사망합니다.\n\n## 원인과 위험 요인\n개, 박쥐, 너구리 등에게 물리거나 긁혀 전파됩니다. 노출 후 즉시 백신을 맞으면 예방됩니다.\n\n## 주요 증상\n열, 물린 부위 이상감각 후 흥분, 물 공포, 마비.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA viral encephalitis transmitted by animal bites; almost always fatal once symptoms appear.\n\n## Causes and risk factors\nSpread by bites or scratches from dogs, bats, raccoons and others; prompt post-exposure vaccination prevents it.\n\n## Key symptoms\nFever and tingling at the bite site, followed by agitation, fear of water and paralysis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299903000,"updated":1794299903000},{"id":"dz-polio","kind":"disease","category":"바이러스 감염","title_ko":"소아마비 (폴리오)","title_orig":"Poliomyelitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Poliomyelitis","tags":["질병 백과","백신","신경"],"body_ko":"## 개요\n폴리오바이러스가 척수의 운동신경을 손상시켜 마비를 일으킬 수 있는 감염입니다.\n\n## 원인과 위험 요인\n분변-구강 경로로 전파되며 백신으로 거의 퇴치되었습니다.\n\n## 주요 증상\n대부분 증상이 없고, 일부에서 갑작스러운 팔다리 마비가 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with poliovirus that can damage spinal motor neurons and cause paralysis.\n\n## Causes and risk factors\nSpread by the faecal-oral route; nearly eradicated by vaccination.\n\n## Key symptoms\nMostly silent; a minority develop sudden limb paralysis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299902000,"updated":1794299902000},{"id":"dz-noro","kind":"disease","category":"바이러스 감염","title_ko":"노로바이러스 장염","title_orig":"Norovirus gastroenteritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Norovirus%20gastroenteritis","tags":["질병 백과","식중독","장염"],"body_ko":"## 개요\n급성 위장염의 가장 흔한 원인 바이러스로, 겨울철 집단 식중독을 일으킵니다.\n\n## 원인과 위험 요인\n오염된 음식(특히 굴), 물, 손, 환경 표면으로 쉽게 퍼집니다.\n\n## 주요 증상\n갑작스러운 구토, 설사, 복통. 대개 1~3일 안에 낫습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nThe most common cause of acute gastroenteritis, causing winter outbreaks.\n\n## Causes and risk factors\nSpreads easily via contaminated food (especially oysters), water, hands and surfaces.\n\n## Key symptoms\nSudden vomiting, diarrhoea and cramps; usually resolves in 1–3 days.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299901000,"updated":1794299901000},{"id":"dz-rota","kind":"disease","category":"바이러스 감염","title_ko":"로타바이러스 장염","title_orig":"Rotavirus gastroenteritis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Rotavirus%20gastroenteritis","tags":["질병 백과","소아","장염"],"body_ko":"## 개요\n영유아 심한 설사의 주요 원인 바이러스입니다.\n\n## 원인과 위험 요인\n분변-구강 경로로 전파되며 먹는 백신으로 예방합니다.\n\n## 주요 증상\n구토, 물 설사, 열, 탈수.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA leading cause of severe diarrhoea in infants and young children.\n\n## Causes and risk factors\nSpread by the faecal-oral route; prevented by oral vaccine.\n\n## Key symptoms\nVomiting, watery diarrhoea, fever and dehydration.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299900000,"updated":1794299900000},{"id":"dz-mpox","kind":"disease","category":"바이러스 감염","title_ko":"엠폭스 (원숭이두창)","title_orig":"Mpox","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Mpox","tags":["질병 백과","발진"],"body_ko":"## 개요\n엠폭스 바이러스가 일으키는 감염으로 2022년 여러 나라에서 유행했습니다.\n\n## 원인과 위험 요인\n피부 병변, 체액, 밀접 접촉(성 접촉 포함)으로 전파됩니다.\n\n## 주요 증상\n열, 림프절 비대, 물집과 고름집 형태의 발진.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with monkeypox virus, which spread across many countries in 2022.\n\n## Causes and risk factors\nSpread through skin lesions, body fluids and close contact including sexual contact.\n\n## Key symptoms\nFever, swollen lymph nodes and a blistering, pustular rash.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299899000,"updated":1794299899000},{"id":"dz-ebola","kind":"disease","category":"바이러스 감염","title_ko":"에볼라바이러스병","title_orig":"Ebola virus disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Ebola%20virus%20disease","tags":["질병 백과","출혈열"],"body_ko":"## 개요\n치명률이 높은 바이러스성 출혈열입니다.\n\n## 원인과 위험 요인\n감염된 사람이나 동물의 혈액·체액과 직접 접촉해 전파되며 과일박쥐가 자연 숙주로 추정됩니다.\n\n## 주요 증상\n고열, 심한 피로, 구토, 설사, 출혈.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA severe viral haemorrhagic fever with high fatality.\n\n## Causes and risk factors\nSpread by direct contact with blood or body fluids of infected people or animals; fruit bats are the likely reservoir.\n\n## Key symptoms\nHigh fever, profound weakness, vomiting, diarrhoea and bleeding.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299898000,"updated":1794299898000},{"id":"dz-sfts","kind":"disease","category":"바이러스 감염","title_ko":"중증열성혈소판감소증후군 (SFTS)","title_orig":"Severe fever with thrombocytopenia syndrome","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Severe%20fever%20with%20thrombocytopenia%20syndrome","tags":["질병 백과","진드기","한국"],"body_ko":"## 개요\n진드기가 옮기는 바이러스 감염으로, 한국·중국·일본에서 발생합니다.\n\n## 원인과 위험 요인\n작은소피참진드기에 물려 감염되며 환자 혈액·체액으로도 전파될 수 있습니다.\n\n## 주요 증상\n고열, 구토, 설사, 혈소판·백혈구 감소. 치명률이 높습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA tick-borne viral infection occurring in Korea, China and Japan.\n\n## Causes and risk factors\nTransmitted by Haemaphysalis ticks and sometimes via patients' blood or body fluids.\n\n## Key symptoms\nHigh fever, vomiting, diarrhoea and low platelet and white cell counts; fatality is high.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299897000,"updated":1794299897000},{"id":"dz-hfmd","kind":"disease","category":"바이러스 감염","title_ko":"수족구병","title_orig":"Hand, foot and mouth disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Hand%2C%20foot%20and%20mouth%20disease","tags":["질병 백과","소아"],"body_ko":"## 개요\n손, 발, 입안에 물집이 생기는 영유아 바이러스 감염입니다.\n\n## 원인과 위험 요인\n콕사키바이러스와 엔테로바이러스 71형이 원인이며 침·분변·물집 접촉으로 퍼집니다.\n\n## 주요 증상\n열, 입안 궤양, 손발 물집. 드물게 뇌염이 생깁니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA viral illness of young children causing blisters on the hands, feet and mouth.\n\n## Causes and risk factors\nCaused by coxsackieviruses and enterovirus 71, spread through saliva, faeces and blister fluid.\n\n## Key symptoms\nFever, mouth ulcers and blisters on hands and feet; rarely encephalitis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299896000,"updated":1794299896000},{"id":"dz-adeno","kind":"disease","category":"바이러스 감염","title_ko":"유행성 각결막염 (아데노바이러스)","title_orig":"Epidemic keratoconjunctivitis (adenovirus)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Epidemic%20keratoconjunctivitis","tags":["질병 백과","눈","전염"],"body_ko":"## 개요\n아데노바이러스가 일으키는 전염성 강한 눈병입니다.\n\n## 원인과 위험 요인\n손과 수건 등 접촉으로 퍼집니다.\n\n## 주요 증상\n눈 충혈, 눈물, 이물감, 눈곱, 귀 앞 림프절 비대.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA highly contagious eye infection caused by adenovirus.\n\n## Causes and risk factors\nSpread by hands and shared items such as towels.\n\n## Key symptoms\nRed, watery, gritty eyes with discharge and swollen nodes in front of the ear.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299895000,"updated":1794299895000},{"id":"dz-mers","kind":"disease","category":"바이러스 감염","title_ko":"중동호흡기증후군 (메르스)","title_orig":"Middle East respiratory syndrome (MERS)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Middle%20East%20respiratory%20syndrome","tags":["질병 백과","코로나","호흡기"],"body_ko":"## 개요\n메르스 코로나바이러스가 일으키는 중증 호흡기 감염입니다.\n\n## 원인과 위험 요인\n낙타가 숙주이며 병원 내 사람 간 전파가 일어날 수 있습니다. 한국에서는 2015년 유행했습니다.\n\n## 주요 증상\n열, 기침, 숨참, 폐렴.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA severe respiratory infection caused by MERS coronavirus.\n\n## Causes and risk factors\nCamels are the reservoir; human-to-human spread occurs in hospitals. Korea had an outbreak in 2015.\n\n## Key symptoms\nFever, cough, breathlessness and pneumonia.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299894000,"updated":1794299894000},{"id":"dz-hfrs","kind":"disease","category":"바이러스 감염","title_ko":"신증후군출혈열 (한타바이러스)","title_orig":"Haemorrhagic fever with renal syndrome (hantavirus)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Haemorrhagic%20fever%20with%20renal%20syndrome","tags":["질병 백과","설치류","한국"],"body_ko":"## 개요\n들쥐가 옮기는 한타바이러스 감염으로, 한국에서 발견된 한탄바이러스가 대표적입니다.\n\n## 원인과 위험 요인\n감염된 설치류의 배설물이 섞인 먼지를 들이마셔 감염됩니다.\n\n## 주요 증상\n고열, 두통, 출혈, 급성 콩팥 손상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nInfection with rodent-borne hantaviruses, notably Hantaan virus first identified in Korea.\n\n## Causes and risk factors\nCaught by inhaling dust contaminated with infected rodent excreta.\n\n## Key symptoms\nHigh fever, headache, bleeding and acute kidney injury.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299893000,"updated":1794299893000},{"id":"dz-tb","kind":"disease","category":"세균 감염","title_ko":"결핵","title_orig":"Tuberculosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Tuberculosis","tags":["질병 백과","호흡기","세균"],"body_ko":"## 개요\n결핵균(Mycobacterium tuberculosis)이 주로 폐에 일으키는 만성 감염입니다.\n\n## 원인과 위험 요인\n기침으로 나온 공기 중 입자로 전파됩니다. HIV, 당뇨병, 영양 결핍, 흡연이 발병 위험을 높입니다. 한국은 OECD 국가 중 결핵 발생률이 높은 편입니다.\n\n## 주요 증상\n2주 이상 기침, 객혈, 밤에 땀, 열, 체중 감소.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA chronic infection, mainly of the lungs, caused by Mycobacterium tuberculosis.\n\n## Causes and risk factors\nSpread through airborne particles from coughing; HIV, diabetes, malnutrition and smoking raise the risk. Korea has one of the higher incidence rates among OECD countries.\n\n## Key symptoms\nCough for over two weeks, coughing blood, night sweats, fever and weight loss.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299892000,"updated":1794299892000},{"id":"dz-pneumo","kind":"disease","category":"세균 감염","title_ko":"폐렴구균 폐렴","title_orig":"Pneumococcal pneumonia","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pneumococcal%20pneumonia","tags":["질병 백과","호흡기","백신"],"body_ko":"## 개요\n폐렴구균(Streptococcus pneumoniae)이 일으키는 폐렴으로, 지역사회 폐렴의 가장 흔한 세균 원인입니다.\n\n## 원인과 위험 요인\n노인, 영유아, 흡연, 만성 질환이 위험 요인이며 백신으로 예방합니다.\n\n## 주요 증상\n고열, 오한, 가래 기침, 숨참, 숨 쉴 때 가슴 통증.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nPneumonia caused by Streptococcus pneumoniae, the most common bacterial cause of community-acquired pneumonia.\n\n## Causes and risk factors\nRisk factors include older age, infancy, smoking and chronic illness; preventable by vaccine.\n\n## Key symptoms\nHigh fever, chills, productive cough, breathlessness and pleuritic chest pain.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299891000,"updated":1794299891000},{"id":"dz-hpylori","kind":"disease","category":"세균 감염","title_ko":"헬리코박터 파일로리 감염","title_orig":"Helicobacter pylori infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Helicobacter%20pylori%20infection","tags":["질병 백과","위암","소화기"],"body_ko":"## 개요\n위 점막에 사는 세균으로, 위염·위궤양·위암의 주요 원인입니다.\n\n## 원인과 위험 요인\n주로 어릴 때 가족 내에서 입을 통해 감염됩니다. 제균 치료로 위암 위험을 낮출 수 있습니다.\n\n## 주요 증상\n대부분 증상이 없고 속쓰림, 소화불량, 궤양 증상이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA bacterium living in the stomach lining; a major cause of gastritis, peptic ulcers and stomach cancer.\n\n## Causes and risk factors\nUsually acquired in childhood within families by the oral route; eradication lowers stomach cancer risk.\n\n## Key symptoms\nMostly silent; may cause heartburn, indigestion or ulcer symptoms.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299890000,"updated":1794299890000},{"id":"dz-uti","kind":"disease","category":"세균 감염","title_ko":"요로감염 (방광염)","title_orig":"Urinary tract infection (cystitis)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Urinary%20tract%20infection","tags":["질병 백과","대장균","비뇨"],"body_ko":"## 개요\n요로에 세균이 감염되는 질환으로, 여성에게 매우 흔합니다.\n\n## 원인과 위험 요인\n대장균이 가장 흔한 원인이며 짧은 요도, 성관계, 폐경, 요로 막힘이 위험 요인입니다.\n\n## 주요 증상\n소변 볼 때 따가움, 잦은 소변, 아랫배 통증. 열과 옆구리 통증은 신우신염을 시사합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nBacterial infection of the urinary tract, very common in women.\n\n## Causes and risk factors\nE. coli is the most common cause; risk factors include short urethra, sexual activity, menopause and urinary obstruction.\n\n## Key symptoms\nBurning urination, frequency and lower abdominal pain; fever and flank pain suggest pyelonephritis.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299889000,"updated":1794299889000},{"id":"dz-sepsis","kind":"disease","category":"세균 감염","title_ko":"패혈증","title_orig":"Sepsis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Sepsis","tags":["질병 백과","응급","감염"],"body_ko":"## 개요\n감염에 대한 몸의 반응이 조절되지 않아 장기가 손상되는 생명을 위협하는 상태입니다.\n\n## 원인과 위험 요인\n폐렴, 요로감염, 복부·피부 감염 등이 출발점이 되며 노인, 영아, 면역 저하자가 위험합니다.\n\n## 주요 증상\n열이나 저체온, 빠른 호흡과 맥박, 혼란, 저혈압. 응급 치료가 필요합니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nLife-threatening organ dysfunction caused by a dysregulated response to infection.\n\n## Causes and risk factors\nOften starts from pneumonia, urinary, abdominal or skin infection; older adults, infants and the immunocompromised are at risk.\n\n## Key symptoms\nFever or low temperature, rapid breathing and heart rate, confusion and low blood pressure; requires emergency treatment.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299888000,"updated":1794299888000},{"id":"dz-meningitis","kind":"disease","category":"세균 감염","title_ko":"세균성 수막염","title_orig":"Bacterial meningitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Bacterial%20meningitis","tags":["질병 백과","응급","백신"],"body_ko":"## 개요\n뇌와 척수를 싸는 막에 세균이 감염되는 응급 질환입니다.\n\n## 원인과 위험 요인\n폐렴구균, 수막구균, b형 헤모필루스균이 흔한 원인이며 백신으로 상당 부분 예방됩니다.\n\n## 주요 증상\n고열, 심한 두통, 목 경직, 빛 공포, 의식 저하, (수막구균) 점상 발진.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn emergency infection of the membranes covering the brain and spinal cord.\n\n## Causes and risk factors\nCommonly caused by pneumococcus, meningococcus and Haemophilus influenzae type b; largely vaccine-preventable.\n\n## Key symptoms\nHigh fever, severe headache, stiff neck, light sensitivity, confusion and, with meningococcus, a petechial rash.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299887000,"updated":1794299887000},{"id":"dz-strep","kind":"disease","category":"세균 감염","title_ko":"연쇄상구균 인두염","title_orig":"Streptococcal pharyngitis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Streptococcal%20pharyngitis","tags":["질병 백과","소아","목"],"body_ko":"## 개요\nA군 연쇄상구균이 일으키는 목감염입니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 학령기 아동에게 흔합니다. 치료하지 않으면 류마티스열이 생길 수 있습니다.\n\n## 주요 증상\n갑작스러운 인후통, 열, 편도 삼출물, 목 림프절 압통. 기침은 대개 없습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA throat infection caused by group A Streptococcus.\n\n## Causes and risk factors\nSpread by droplets, common in school-age children; untreated infection can lead to rheumatic fever.\n\n## Key symptoms\nSudden sore throat, fever, tonsillar exudate and tender neck glands, usually without cough.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299886000,"updated":1794299886000},{"id":"dz-scarlet","kind":"disease","category":"세균 감염","title_ko":"성홍열","title_orig":"Scarlet fever","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Scarlet%20fever","tags":["질병 백과","소아"],"body_ko":"## 개요\nA군 연쇄상구균의 독소로 온몸에 붉은 발진이 생기는 감염입니다.\n\n## 원인과 위험 요인\n연쇄상구균 인두염과 같은 경로로 퍼집니다.\n\n## 주요 증상\n인후통, 열, 사포처럼 까칠한 붉은 발진, 딸기 모양 혀.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA group A streptococcal infection with a toxin-mediated red rash.\n\n## Causes and risk factors\nSpread in the same way as strep throat.\n\n## Key symptoms\nSore throat, fever, a sandpaper-like red rash and 'strawberry' tongue.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299885000,"updated":1794299885000},{"id":"dz-mrsa","kind":"disease","category":"세균 감염","title_ko":"황색포도알균 감염 (MRSA 포함)","title_orig":"Staphylococcus aureus infection (including MRSA)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Staphylococcus%20aureus%20infection","tags":["질병 백과","항생제 내성","피부"],"body_ko":"## 개요\n피부 감염부터 폐렴·혈류감염까지 일으키는 세균으로, 메티실린 내성균(MRSA)은 치료가 더 어렵습니다.\n\n## 원인과 위험 요인\n피부 상처, 병원 시술, 카테터를 통해 감염되며 항생제 남용이 내성을 키웁니다.\n\n## 주요 증상\n종기, 고름, 붉고 뜨거운 부기. 깊은 감염이면 열과 전신 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA bacterium causing infections from skin abscesses to pneumonia and bloodstream infection; methicillin-resistant strains (MRSA) are harder to treat.\n\n## Causes and risk factors\nEnters through skin breaks, hospital procedures and catheters; antibiotic overuse drives resistance.\n\n## Key symptoms\nBoils, pus and red, hot swelling; deeper infection causes fever and systemic illness.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299884000,"updated":1794299884000},{"id":"dz-tetanus","kind":"disease","category":"세균 감염","title_ko":"파상풍","title_orig":"Tetanus","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Tetanus","tags":["질병 백과","백신","상처"],"body_ko":"## 개요\n파상풍균 독소가 신경을 자극해 근육이 강하게 굳는 질환입니다.\n\n## 원인과 위험 요인\n흙 속의 포자가 상처로 들어가 감염되며 백신으로 예방합니다(10년마다 추가 접종).\n\n## 주요 증상\n턱이 굳음(개구 장애), 목·등 근육 경직, 전신 경련.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA disease in which toxin from Clostridium tetani causes severe muscle spasms.\n\n## Causes and risk factors\nSpores from soil enter wounds; prevented by vaccination with boosters every 10 years.\n\n## Key symptoms\nLockjaw, neck and back stiffness and generalised spasms.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299883000,"updated":1794299883000},{"id":"dz-diphtheria","kind":"disease","category":"세균 감염","title_ko":"디프테리아","title_orig":"Diphtheria","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Diphtheria","tags":["질병 백과","백신"],"body_ko":"## 개요\n디프테리아균 독소가 목에 막을 만들고 심장·신경을 손상시킬 수 있는 감염입니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 DTaP 백신으로 예방합니다.\n\n## 주요 증상\n인후통, 열, 목의 회색 막, 목이 부음.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn infection in which Corynebacterium diphtheriae toxin forms a throat membrane and can damage the heart and nerves.\n\n## Causes and risk factors\nSpread by droplets; prevented by DTaP vaccination.\n\n## Key symptoms\nSore throat, fever, a grey throat membrane and a swollen 'bull neck'.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299882000,"updated":1794299882000},{"id":"dz-pertussis","kind":"disease","category":"세균 감염","title_ko":"백일해","title_orig":"Pertussis (whooping cough)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Pertussis","tags":["질병 백과","백신","소아"],"body_ko":"## 개요\n백일해균이 일으키는 호흡기 감염으로, 오래 가는 발작성 기침이 특징입니다.\n\n## 원인과 위험 요인\n비말로 퍼지며 영아에게 특히 위험합니다. 임신부와 가족 백신 접종이 중요합니다.\n\n## 주요 증상\n연이은 기침 발작 후 '흡' 소리가 나며 숨을 들이쉼, 기침 후 구토. 수주간 지속됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA respiratory infection by Bordetella pertussis with prolonged paroxysmal cough.\n\n## Causes and risk factors\nSpread by droplets; especially dangerous for infants, so vaccination of pregnant women and family members matters.\n\n## Key symptoms\nCoughing fits followed by a 'whoop' and post-cough vomiting, lasting weeks.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299881000,"updated":1794299881000},{"id":"dz-cholera","kind":"disease","category":"세균 감염","title_ko":"콜레라","title_orig":"Cholera","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Cholera","tags":["질병 백과","식수","설사"],"body_ko":"## 개요\n콜레라균 독소가 심한 물 설사를 일으키는 감염입니다.\n\n## 원인과 위험 요인\n오염된 물과 음식으로 전파되며 위생이 열악한 지역에서 유행합니다.\n\n## 주요 증상\n쌀뜨물 같은 대량 설사, 구토, 빠른 탈수.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nAn infection in which Vibrio cholerae toxin causes profuse watery diarrhoea.\n\n## Causes and risk factors\nSpread through contaminated water and food in areas with poor sanitation.\n\n## Key symptoms\nMassive 'rice-water' diarrhoea, vomiting and rapid dehydration.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299880000,"updated":1794299880000},{"id":"dz-typhoid","kind":"disease","category":"세균 감염","title_ko":"장티푸스","title_orig":"Typhoid fever","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Typhoid%20fever","tags":["질병 백과","식수"],"body_ko":"## 개요\n살모넬라 타이피균이 일으키는 전신 감염입니다.\n\n## 원인과 위험 요인\n오염된 물과 음식으로 전파됩니다.\n\n## 주요 증상\n오래가는 고열, 두통, 복통, 변비나 설사, 장미 모양 반점.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA systemic infection caused by Salmonella Typhi.\n\n## Causes and risk factors\nSpread through contaminated food and water.\n\n## Key symptoms\nProlonged high fever, headache, abdominal pain, constipation or diarrhoea and rose spots.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299879000,"updated":1794299879000},{"id":"dz-salmonella","kind":"disease","category":"세균 감염","title_ko":"살모넬라 식중독","title_orig":"Salmonellosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Salmonellosis","tags":["질병 백과","식중독"],"body_ko":"## 개요\n비장티푸스성 살모넬라균이 일으키는 장염입니다.\n\n## 원인과 위험 요인\n덜 익힌 달걀·닭고기, 오염된 음식, 파충류 접촉으로 감염됩니다.\n\n## 주요 증상\n설사, 열, 복통이 섭취 후 6시간~6일 사이에 시작됩니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nGastroenteritis caused by non-typhoidal Salmonella.\n\n## Causes and risk factors\nCaught from undercooked eggs and poultry, contaminated food and contact with reptiles.\n\n## Key symptoms\nDiarrhoea, fever and cramps starting 6 hours to 6 days after exposure.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299878000,"updated":1794299878000},{"id":"dz-ehec","kind":"disease","category":"세균 감염","title_ko":"장출혈성 대장균 감염 (O157)","title_orig":"Enterohaemorrhagic E. coli infection (O157)","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Enterohaemorrhagic%20E.%20coli%20infection","tags":["질병 백과","식중독","대장균"],"body_ko":"## 개요\n시가 독소를 만드는 대장균이 일으키는 장염입니다.\n\n## 원인과 위험 요인\n덜 익힌 다진 고기, 오염된 채소, 살균하지 않은 우유로 감염됩니다.\n\n## 주요 증상\n심한 복통, 피 섞인 설사. 어린이는 용혈성 요독 증후군(콩팥 손상)이 생길 수 있습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nGut infection with Shiga toxin-producing E. coli.\n\n## Causes and risk factors\nCaught from undercooked ground beef, contaminated produce and unpasteurised milk.\n\n## Key symptoms\nSevere cramps and bloody diarrhoea; children may develop haemolytic uraemic syndrome.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299877000,"updated":1794299877000},{"id":"dz-shigella","kind":"disease","category":"세균 감염","title_ko":"세균성 이질 (시겔라증)","title_orig":"Shigellosis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Shigellosis","tags":["질병 백과","설사"],"body_ko":"## 개요\n시겔라균이 일으키는 전염성 강한 장염입니다.\n\n## 원인과 위험 요인\n적은 양의 균으로도 감염되며 손과 오염된 음식·물로 퍼집니다.\n\n## 주요 증상\n열, 복통, 피와 점액 섞인 설사, 뒤가 무지근함.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA highly contagious gut infection caused by Shigella.\n\n## Causes and risk factors\nA small dose causes infection; spreads by hands and contaminated food or water.\n\n## Key symptoms\nFever, cramps, bloody mucoid diarrhoea and straining.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299876000,"updated":1794299876000},{"id":"dz-cdiff","kind":"disease","category":"세균 감염","title_ko":"클로스트리디오이데스 디피실 감염","title_orig":"Clostridioides difficile infection","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Clostridioides%20difficile%20infection","tags":["질병 백과","항생제","장내미생물"],"body_ko":"## 개요\n항생제 사용 후 장내 세균 균형이 무너지면서 디피실균이 독소를 만들어 생기는 장염입니다.\n\n## 원인과 위험 요인\n항생제, 입원, 고령, 위산억제제가 위험 요인입니다.\n\n## 주요 증상\n물 설사, 복통, 열. 재발이 잦습니다.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nColitis caused by toxin-producing C. difficile after antibiotics disrupt the gut flora.\n\n## Causes and risk factors\nRisk factors include antibiotics, hospitalisation, older age and acid-suppressing drugs.\n\n## Key symptoms\nWatery diarrhoea, abdominal pain and fever; recurrence is common.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299875000,"updated":1794299875000},{"id":"dz-lyme","kind":"disease","category":"세균 감염","title_ko":"라임병","title_orig":"Lyme disease","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Lyme%20disease","tags":["질병 백과","진드기"],"body_ko":"## 개요\n진드기가 옮기는 보렐리아균 감염입니다.\n\n## 원인과 위험 요인\n참진드기에 물려 감염되며 북미와 유럽에 흔합니다.\n\n## 주요 증상\n물린 곳 주변 과녁 모양 홍반, 열, 피로. 치료하지 않으면 관절염·신경 증상.\n\n## 참고\n일반적인 의학 지식을 요약한 항목입니다. 진단과 치료는 의료진과 상의하세요. 위 링크에서 관련 논문을 찾아볼 수 있습니다.","body_orig":"## Overview\nA tick-borne infection with Borrelia bacteria.\n\n## Causes and risk factors\nTransmitted by Ixodes ticks; common in North America and Europe.\n\n## Key symptoms\nA bull's-eye rash, fever and fatigue; untreated, arthritis and neurological problems.\n\n## Note\nA general medical-knowledge summary. Consult a clinician for diagnosis and treatment. Use the link above to search related research papers.","created":1794299874000,"updated":1794299874000},{"id":"dz-syphilis","kind":"disease","category":"세균 감염","title_ko":"매독","title_orig":"Syphilis","authors":"","journal":"질병 백과","year":"","link":"https://pubmed.ncbi.nlm.nih.gov/?term=Syphilis","tags":["질병 백과","성매개"],"body_ko
