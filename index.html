const categories=['전체','도구','생산성','업무·시뮬','게임·실험','교육','라이프'];
const state={viewer:null,category:'전체',search:'',favoritesOnly:false,favorites:new Set(),theme:'light',modal:null};
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){try{const f=JSON.parse(localStorage.getItem('tw-portfolio-favs-v1')||'[]');if(Array.isArray(f))state.favorites=new Set(f.filter(x=>typeof x==='string'));state.theme=localStorage.getItem('tw-portfolio-theme')==='dark'?'dark':'light'}catch(e){}document.documentElement.dataset.theme=state.theme;$('#themeColor').content=state.theme==='dark'?'#101217':'#f6f7fa';$('#year').textContent=new Date().getFullYear();$('#statCount').textContent=projects.length;$('#statCategory').textContent=new Set(projects.map(p=>p.category)).size;renderFilters();render();bind()}
function poster(p){return `<div class="poster" style="--poster:${p.bg};--fg:${p.fg}"><span class="num">PROJECT / ${p.number}</span><span class="pattern"></span><span class="pattern two"></span><span class="${p.visual.length>3?'poster-word'+(p.visual.length>4?' light':''):'poster-icon'}">${escapeHtml(p.visual)}</span></div>`}
function filtered(){const q=state.search.toLocaleLowerCase('ko');return projects.filter(p=>(state.category==='전체'||p.category===state.category)&&(!state.favoritesOnly||state.favorites.has(p.id))&&(!q||[p.name,p.caption,p.description,p.category,p.platform,...p.tags,...p.stack].join(' ').toLocaleLowerCase('ko').includes(q)))}
function renderFilters(){const c=$('#chips');c.innerHTML=categories.map(cat=>`<button type="button" class="chip ${cat===state.category?'active':''}" data-cat="${escapeHtml(cat)}" aria-pressed="${cat===state.category}">${escapeHtml(cat)}</button>`).join('')}
function render(){const arr=filtered();$('#countLabel').textContent=`${arr.length}개 표시 중`;$('#projectHeading').innerHTML=state.favoritesOnly?'즐겨찾기 컬렉션<span style="color:var(--brand)">.</span>':'프로젝트 컬렉션<span style="color:var(--brand)">.</span>';$('#projectGrid').innerHTML=arr.length?arr.map(p=>`<article class="project" data-id="${p.id}"><div style="position:relative"><button type="button" data-open="${p.id}" aria-label="${escapeHtml(p.name)} 상세 보기" style="border:0;padding:0;width:100%;background:none">${poster(p)}</button><button type="button" class="favorite ${state.favorites.has(p.id)?'saved':''}" aria-label="${escapeHtml(p.name)} 즐겨찾기 ${state.favorites.has(p.id)?'해제':'추가'}" aria-pressed="${state.favorites.has(p.id)}" data-fav="${p.id}">${state.favorites.has(p.id)?'♥':'♡'}</button></div><div class="project-body"><div class="meta-line"><span class="mini-label">${escapeHtml(p.category)}</span></div><h3 class="project-title">${escapeHtml(p.name)}</h3><p class="project-desc">${escapeHtml(p.caption)}</p><div class="project-bottom"><button type="button" class="see-more" data-open="${p.id}">자세히 보기 <span>→</span></button>${p.url?`<button type="button" class="site-link" data-launch="${p.id}" aria-label="${escapeHtml(p.name)} 웹앱 열기">웹앱 실행 ↗</button>`:`<span class="site-link" title="원본 URL 확인 필요">주소 확인 필요</span>`}</div><div class="tech-tags">${p.tags.slice(0,4).map(t=>`<span class="tech">${escapeHtml(t)}</span>`).join('')}</div></div></article>`).join(''):`<div class="empty"><div style="font-size:38px;margin-bottom:8px">⌕</div><b>${state.favoritesOnly?'즐겨찾기한 프로젝트가 없어요':'검색 결과가 없어요'}</b><p>${state.favoritesOnly?'카드의 하트 버튼을 눌러 프로젝트를 모아보세요.':'다른 검색어나 분류를 선택해보세요.'}</p><button type="button" class="secondary" id="resetFilters">전체 보기</button></div>`;const reset=$('#resetFilters');if(reset)reset.addEventListener('click',()=>{state.favoritesOnly=false;state.category='전체';state.search='';$('#searchInput').value='';renderFilters();render();setActive('projects')})}
function openModal(id){const p=projects.find(x=>x.id===id);if(!p)return;state.modal=id;$('#dialogContent').innerHTML=`${poster(p)}<div class="dialog-body"><span class="mini-label">${escapeHtml(p.category)} · PROJECT ${p.number}</span><h2 id="dialogTitle">${escapeHtml(p.name)}</h2><p class="dialog-desc">${escapeHtml(p.description)}</p><div class="facts"><div class="fact"><small>배포 환경</small><strong>${escapeHtml(p.platform)}</strong></div></div><h3>개발 기술 · STACK</h3><div class="tech-tags">${(p.stack.length?p.stack:['기술 정보 없음']).map(t=>`<span class="tech">${escapeHtml(t)}</span>`).join('')}</div><h3>주요 구현 내용 · FEATURES</h3><ul class="feature-list">${p.features.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul><h3>데이터 저장 · STORAGE</h3><div class="notice">${escapeHtml(p.storage)}</div>${p.rawUrl?`<h3>입력된 원본 URL</h3><div class="notice" style="overflow-wrap:anywhere">${escapeHtml(p.rawUrl)}<br>공백이 포함돼 있어 정확한 주소 확인 전까지 실행 버튼을 비활성화했어요.</div>`:''}<div class="dialog-actions">${p.url?`<button type="button" class="launch-primary" id="modalLaunch">웹앱 실행 ↗</button><button type="button" id="copyBtn">링크 복사</button>`:`<a class="disabled" aria-disabled="true">실행 주소 확인 필요</a>`}<button type="button" id="modalFav">${state.favorites.has(p.id)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기 추가'}</button></div></div>`;$('#dialogBack').classList.add('open');$('#dialogBack').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';history.pushState({portfolioModal:id},'',location.pathname+location.search+'#project-'+id);$('#dialogClose').focus();$('#copyBtn')?.addEventListener('click',()=>copyText(p.url));$('#modalLaunch')?.addEventListener('click',()=>openViewer(p.id));$('#modalFav').addEventListener('click',()=>{toggleFav(p.id);$('#modalFav').textContent=state.favorites.has(p.id)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기 추가'})}

function openViewer(id){
 const p=projects.find(x=>x.id===id);if(!p||!p.url)return;
 state.viewer=id;
 $('#viewerName').textContent=p.name;
 $('#viewerExternal').href=p.url;
 $('#viewerFrame').src=p.url;
 $('#webappViewer').classList.add('open');
 $('#webappViewer').setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
 $('#viewerBack').focus();
}
function closeViewer(closeAll=false){
 if(!state.viewer)return;
 state.viewer=null;
 $('#viewerFrame').src='about:blank';
 $('#webappViewer').classList.remove('open');
 $('#webappViewer').setAttribute('aria-hidden','true');
 if(closeAll && state.modal)closeModal();
 if(!state.modal)document.body.style.overflow='';
}
function closeModal(fromPop=false){if(!state.modal)return;state.modal=null;$('#dialogBack').classList.remove('open');$('#dialogBack').setAttribute('aria-hidden','true');document.body.style.overflow='';if(!fromPop&&location.hash.startsWith('#project-')){history.back()}}
function toggleFav(id){if(state.favorites.has(id))state.favorites.delete(id);else state.favorites.add(id);try{localStorage.setItem('tw-portfolio-favs-v1',JSON.stringify([...state.favorites]))}catch(e){}render();toast(state.favorites.has(id)?'즐겨찾기에 저장했어요':'즐겨찾기를 해제했어요')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('링크를 복사했어요')}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('링크를 복사했어요')}catch(err){toast('복사할 수 없어요')}ta.remove()}}
let toastTimer;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function setActive(n){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===n))}
function go(n){if(state.modal)closeModal();if(n==='favorites'){state.favoritesOnly=true;state.category='전체';state.search='';$('#searchInput').value='';renderFilters();render();$('#projects').scrollIntoView({behavior:'smooth',block:'start'})}else if(n==='projects'){state.favoritesOnly=false;render();$('#projects').scrollIntoView({behavior:'smooth',block:'start'})}else{window.scrollTo({top:0,behavior:'smooth'})}setActive(n)}
function bind(){document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.nav)));$('#helloBtn').addEventListener('click',()=>go('projects'));$('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;$('#themeColor').content=state.theme==='dark'?'#101217':'#f6f7fa';try{localStorage.setItem('tw-portfolio-theme',state.theme)}catch(e){}});$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.category=b.dataset.cat;state.favoritesOnly=false;setActive('projects');renderFilters();render()});$('#searchInput').addEventListener('input',e=>{state.search=e.target.value.trim();render()});$('#projectGrid').addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){toggleFav(f.dataset.fav);return}const launch=e.target.closest('[data-launch]');if(launch){openViewer(launch.dataset.launch);return}const a=e.target.closest('[data-open]');if(a)openModal(a.dataset.open)});$('#viewerBack').addEventListener('click',()=>closeViewer(false));$('#viewerClose').addEventListener('click',()=>closeViewer(true));$('#dialogClose').addEventListener('click',()=>closeModal());$('#dialogBack').addEventListener('click',e=>{if(e.target===$('#dialogBack'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.viewer)closeViewer(false);else if(e.key==='Escape'&&state.modal)closeModal()});window.addEventListener('popstate',()=>{if(state.viewer)closeViewer(false);if(state.modal)closeModal(true)});window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#project-')&&state.modal)closeModal(true)});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false})}
init();
</script>
</body>
</html>
