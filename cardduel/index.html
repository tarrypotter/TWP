<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SHADOWDUEL</title>
<style>
:root{
  --bg:#070910; --bg2:#0b0f18; --panel:#111725; --panel2:#151d2e;
  --line:#26314a; --line2:#38455f; --ink:#e9eef8; --dim:#8895ad; --dim2:#5c687e;
  --gold:#e6bd63; --gold2:#8a6a2a; --cyan:#6fd6e8; --red:#ff6b6b; --green:#7ee0a3;
  --bronze:#c98a4b; --silver:#b9c3d1; --goldt:#e3b64b; --plat:#7fd0c8; --dia:#8fb3ff; --master:#c47fe0; --gm:#ff8a5c;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",system-ui,sans-serif;
  overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(120% 70% at 50% 0%,#101828 0%,#080b12 55%,#05070c 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:relative;height:100dvh;width:100%;max-width:470px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ---------- 공용 ---------- */
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hd{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.hd h2{font-size:15px;margin:0;letter-spacing:.02em}
.hd .back{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:15px}
.hd .grow{flex:1}
.btn{border:1px solid var(--line2);background:linear-gradient(#1a2335,#121a29);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink);transition:transform .06s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.primary{background:linear-gradient(#2b3d5e,#1a2740);border-color:#46618f;box-shadow:0 0 0 1px #0b1120 inset,0 6px 18px -8px #6fd6e855}
.btn.gold{background:linear-gradient(#3a2f16,#241c0d);border-color:#7a6229;color:#f0d79a}
.btn.ghost{background:#0e1420}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- 홈 ---------- */
#home{padding:0 16px 16px;gap:12px}
.brand{padding:22px 2px 4px;display:flex;align-items:flex-end;gap:10px}
.brand .logo{font-size:25px;font-weight:800;letter-spacing:.14em;background:linear-gradient(#fff,#9fb4d8 70%,#5d7096);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:10px;color:var(--dim2);letter-spacing:.14em;padding-bottom:4px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:14px;background:
  radial-gradient(120% 130% at 0% 0%,#1b2740 0%,#101826 45%,#0b111c 100%);
  box-shadow:0 16px 40px -28px #6fd6e8aa,0 1px 0 #ffffff0c inset}
.pcard .row1{display:flex;align-items:center;gap:10px}
.pcard .code{font-size:11px;color:var(--gold);letter-spacing:.06em;border:1px solid #4a3d1e;background:#161204;padding:3px 7px;border-radius:7px}
.pcard .nm{font-size:18px;font-weight:700}
.pcard .rl{font-size:11px;color:var(--dim)}
.pcard .tier{margin-left:auto;text-align:right}
.pcard .tier b{font-size:13px;letter-spacing:.02em}
.pcard .tier small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.pcard .stats{display:flex;gap:6px;margin-top:12px}
.pcard .stat{flex:1;background:#0a0f19;border:1px solid #1d273a;border-radius:9px;padding:7px 8px}
.pcard .stat b{display:block;font-size:14px;letter-spacing:.01em}
.pcard .stat span{font-size:9.5px;color:var(--dim2);letter-spacing:.06em}
.meter{height:4px;border-radius:3px;background:#0b1019;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#4d7fb8,#7fd0c8);border-radius:3px}
.menu{display:flex;flex-direction:column;gap:9px}
.mbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:linear-gradient(#141c2b,#0d131f);text-align:left}
.mbtn:active{filter:brightness(1.2)}
.mbtn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#0b111c;border:1px solid #23304a;font-size:15px;color:var(--cyan)}
.mbtn .tx{flex:1}
.mbtn .tx b{display:block;font-size:14px}
.mbtn .tx span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.mbtn .go{color:var(--dim2);font-size:15px}
.mbtn.hl{border-color:#4a5f86;background:linear-gradient(#1d2b44,#131c2c)}
.mbtn.hl .ic{color:var(--gold);border-color:#4a3d1e;background:#141005}
.ladder{margin-top:2px;border:1px solid #1e283c;border-radius:13px;padding:11px 12px;background:linear-gradient(#0f1523,#0a0f18)}
.ladder .ladTop{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--dim2);margin-bottom:9px;letter-spacing:.02em}
.ladder .ladTop b{color:var(--dim);font-weight:600}
.ladder .ladRow{display:flex;gap:4px}
.ladder .lad{flex:1;text-align:center}
.ladder .lad i{display:block;height:4px;border-radius:2px;background:#1b2434;margin-bottom:5px}
.ladder .lad span{font-size:8px;color:#45536c;letter-spacing:-.02em}
.ladder .lad.on i{background:#3d5a80}
.ladder .lad.on span{color:#7f93b3}
.ladder .lad.cur i{background:linear-gradient(90deg,#6fd6e8,#e6bd63);box-shadow:0 0 10px -2px #6fd6e888}
.ladder .lad.cur span{color:#fff}
.foot{display:flex;gap:8px;padding-top:2px;margin-top:auto}
.rules{border:1px solid #1b2436;border-radius:12px;padding:10px 12px;background:#0a0f18;display:flex;flex-direction:column;gap:6px}
.rules div{font-size:10.5px;color:#7d8ba4;line-height:1.4;display:flex;gap:7px}
.rules div b{color:#a9b8cf;font-weight:600;min-width:38px;display:inline-block}
.foot .btn{flex:1}
.tiny{font-size:10px;color:var(--dim2);text-align:center;letter-spacing:.04em;line-height:1.5}

/* ---------- 듀얼 ---------- */
#duel{display:none;flex-direction:column;height:100%}
#duel.on{display:flex}
.hud{padding:8px 10px 6px;display:flex;flex-direction:column;gap:5px;background:linear-gradient(#0b1220ee,#080c14aa);border-bottom:1px solid #141c2b}
.hud .side{display:flex;align-items:center;gap:7px}
.hud .who{font-size:11px;font-weight:700;letter-spacing:.04em}
.hud .tierchip{font-size:9.5px;padding:2px 6px;border-radius:6px;border:1px solid #2d3a52;color:var(--dim)}
.hud .lp{flex:1;display:flex;align-items:center;gap:6px}
.lpbar{flex:1;height:7px;border-radius:4px;background:#0a0f18;border:1px solid #1b2436;overflow:hidden;position:relative}
.lpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3f6f9e,#78c6d8);transition:width .45s cubic-bezier(.2,.9,.2,1)}
.hud.foe .lpbar i{background:linear-gradient(90deg,#8a3f4f,#e06b7a)}
.hud .lpv{font-size:12px;font-weight:700;min-width:46px;text-align:right;letter-spacing:.02em}
.hud .code{font-size:9px;color:var(--gold);border:1px solid #3d3218;border-radius:5px;padding:1px 4px;background:#120f05}
.hud .cnt{font-size:9.5px;color:var(--dim2);display:flex;gap:6px}
.hud .cnt b{color:var(--dim);font-weight:600}

.board{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;
  background:
   radial-gradient(60% 40% at 50% 50%,#18223866 0%,#0a0f1800 70%),
   repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 26px),
   repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 26px)}
.half{display:flex;flex-direction:column;gap:5px;padding:4px 8px}
.half.foe{flex:1}
.half.me{flex:1}
.rowZ{display:flex;justify-content:center;gap:5px}
.rowZ.foehand{gap:3px;height:16px;align-items:center;margin-bottom:2px}
.mini{width:11px;height:16px;border-radius:2px;border:1px solid #3f5170;background:linear-gradient(#243550,#131c2b)}
.half.foe{justify-content:flex-end;padding-bottom:3px}
.half.me{justify-content:flex-start;padding-top:3px}
.rowZ.st{gap:6px}
.slot{width:var(--cw,68px);height:var(--ch,94px);border-radius:8px;border:1px dashed #253048;background:#0a0f18a8;position:relative;display:grid;place-items:center;transition:border-color .15s,box-shadow .15s}
.slot.st{--cw:48px;--ch:36px;border-style:dashed}
.slot.hot{border-color:#6fd6e8;box-shadow:0 0 0 1px #6fd6e855,0 0 18px -6px #6fd6e8;background:#0d1a24}
.slot.tgt{border-color:#ff7b7b;box-shadow:0 0 0 1px #ff7b7b66,0 0 20px -8px #ff6b6b;background:#1a0e12}
.slot .ph{font-size:9px;color:#33405a;letter-spacing:.1em}
.mid{height:62px;display:flex;flex-direction:row;align-items:center;gap:9px;padding:5px 11px 5px 12px;border-top:1px solid #121a28;border-bottom:1px solid #121a28;background:#080d15cc;position:relative;overflow:hidden}
.mid .phz{flex:0 0 auto;max-width:92px;font-size:9px;letter-spacing:.08em;line-height:1.35;color:var(--dim2)}
.mid .phz b{color:var(--cyan);letter-spacing:.06em}
.mid .say{flex:1;font-size:9px;line-height:1.35;color:#b9c6dc;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left;width:100%}
.mid .turnbar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);opacity:.6}
.mid.foe .turnbar{background:var(--red)}

.card{position:relative;width:var(--cw,68px);height:var(--ch,94px);border-radius:7px;overflow:hidden;
  background:linear-gradient(#1b2233,#0d121c);border:1px solid #35415a;box-shadow:0 4px 10px -6px #000,0 1px 0 #ffffff10 inset;
  display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s}
.card.m{--acc:#d9a24a}
.card.s{--acc:#4fc0b8}
.card.t{--acc:#a86fd6}
.card .top{display:flex;align-items:center;gap:2px;padding:2px 3px;background:#00000055;border-bottom:1px solid #ffffff12}
.card .lv{font-size:7px;color:#0b0e15;background:var(--acc);border-radius:2px;padding:0 2px;font-weight:800;line-height:1.4}
.card .nm{font-size:8px;line-height:1.15;color:#dbe4f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:-.01em}
.card .art{flex:1;position:relative;background:radial-gradient(70% 70% at 50% 35%,#ffffff10,#00000030);display:block;overflow:hidden}
.card .art svg{width:100%;height:100%;display:block}
.card .bot{display:flex;align-items:center;justify-content:space-between;padding:1.5px 3px;background:#00000066;font-size:7.5px;letter-spacing:.01em}
.card .bot b{font-weight:700}
.card .bot .a{color:#ffc98a}
.card.foe .nm{color:#e4d6dd}
.card .bot .d{color:#8fd2ff}
.card .bot .tag{font-size:6.5px;color:#0d1119;background:var(--acc);border-radius:2px;padding:0 2px;font-weight:800}
.card.foe{border-color:#7c4f5b;box-shadow:0 4px 10px -6px #000,0 0 0 1px #7c4f5b33}
.card.def{transform:rotate(90deg) scale(.73)}
.card.set{transform:rotate(90deg) scale(.73)}
.card .back{position:absolute;inset:0;background:
   radial-gradient(50% 50% at 50% 50%,#2a3a5c 0%,#111a2b 60%,#0a0f19 100%);
   display:grid;place-items:center}
.card .back:after{content:"";width:46%;height:46%;border:1px solid #6d84ad66;border-radius:50%;box-shadow:0 0 0 3px #6d84ad22 inset}
.card .back:before{content:"";position:absolute;width:1px;height:60%;background:#6d84ad33;transform:rotate(45deg)}
.card.stc{--cw:48px;--ch:36px;border-color:#4a5c7d}
.card.stc .back:after{width:38%;height:38%}
.card .eq{position:absolute;right:2px;top:2px;font-size:6px;background:#000000aa;border:1px solid #8a6a2a;color:var(--gold);border-radius:3px;padding:0 2px}
.card.sel{box-shadow:0 0 0 1.5px var(--cyan),0 0 20px -6px var(--cyan)}
.card.tgt{box-shadow:0 0 0 1.5px #ff6b6b,0 0 20px -6px #ff6b6b}
.card.dim{opacity:.45}
.card.hit{animation:hit .34s ease}
@keyframes hit{0%{transform:translateY(0)}30%{transform:translateY(-5px) scale(1.04);filter:brightness(1.5)}100%{transform:translateY(0)}}
.card.atk{animation:atk .3s ease}
@keyframes atk{0%{transform:translateY(0)}45%{transform:translateY(-9px)}100%{transform:translateY(0)}}

.handwrap{padding:4px 8px 2px;background:linear-gradient(#0a0f18cc,#07091000)}
.handrow{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:2px 0 4px;scrollbar-width:none}
.handrow::-webkit-scrollbar{display:none}
.handrow .card{--cw:68px;--ch:96px;flex:0 0 auto}
.handrow .card .nm{font-size:8px}
.bar{display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #141c2b;background:#080c14ee}
.bar .btn{flex:1;padding:12px 6px;font-size:13px}
.bar .btn.wide{flex:2.1}
.me .lpv{color:#9fd8ff}
.foe .lpv{color:#ffb0b0}
.anchor{position:relative;display:flex;flex-direction:column;align-items:center}
.anchor .lbl{font-size:8px;color:#3b4a66;letter-spacing:.1em;margin-top:2px}
.sheet{position:absolute;left:8px;right:8px;bottom:6px;background:#0d1522f5;border:1px solid #2a3852;border-radius:12px;padding:8px;display:none;z-index:30;box-shadow:0 -12px 30px -16px #000}
.sheet.on{display:block}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sheet .sh b{font-size:12px}
.sheet .sh span{font-size:10px;color:var(--dim)}
.sheet .acts{display:flex;gap:6px;flex-wrap:wrap}
.sheet .acts .btn{flex:1;min-width:72px}
.hint{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;font-size:10px;color:#7fd0c8;letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .2s}
.hint.on{opacity:1}

/* ---------- 모달 ---------- */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#03060bcc;backdrop-filter:blur(3px);z-index:100}
#modal.on{display:flex}
.sheetbox{width:100%;max-width:360px;background:linear-gradient(#141c2c,#0c1220);border:1px solid #2c3a56;border-radius:16px;padding:16px;box-shadow:0 30px 60px -30px #000}
.sheetbox h3{margin:0 0 6px;font-size:15px}
.sheetbox p{margin:0 0 12px;font-size:12px;color:var(--dim);line-height:1.5}
.sheetbox .row{display:flex;gap:8px}
.sheetbox .row .btn{flex:1}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #26314a;border-radius:10px;padding:10px;margin-bottom:7px;background:#0d1420}
.opt b{font-size:12px}
.opt span{font-size:10px;color:var(--dim)}
.opt .cost{margin-left:auto;font-size:11px;color:var(--gold)}

/* ---------- 전적 카드 ---------- */
.sharecard{border-radius:16px;padding:16px;background:
  radial-gradient(120% 100% at 0% 0%,#1d2c47 0%,#0e1626 55%,#080d16 100%);
  border:1px solid #38496b;position:relative;overflow:hidden}
.sharecard:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(#7fd0c822,#0000 70%)}
.sharecard .s1{font-size:10px;letter-spacing:.3em;color:#8fa6c9}
.sharecard .s2{font-size:25px;font-weight:800;letter-spacing:.01em;margin-top:5px}
.sharecard .tierpill{font-size:10.5px;border:1px solid;border-radius:6px;padding:1px 7px;font-weight:700;letter-spacing:.02em}
.sharecard .s3{display:flex;align-items:center;gap:8px;margin-top:12px}
.sharecard .s3 .code{font-size:12px;color:var(--gold);border:1px solid #4a3d1e;border-radius:6px;padding:2px 6px;background:#151105}
.sharecard .s3 .nm{font-size:15px;font-weight:700}
.sharecard .s4{font-size:13px;margin-top:10px;color:#cfe0f5}
.sharecard .s4 b{color:#fff}
.sharecard .s5{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--dim)}
.sharecard .s6{margin-top:12px;padding-top:9px;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;font-size:9.5px;color:#6f7f99;letter-spacing:.05em}

/* ---------- 덱/도감 ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 16px}
.gitem{position:relative;display:flex;flex-direction:column;gap:4px}
.gitem .gtop{position:relative;border-radius:9px;overflow:hidden}
.gitem .gtop .card{--cw:100%;--ch:112px;width:100%;height:112px}
.gitem .cnt{position:absolute;left:4px;top:4px;background:#05080ed0;border:1px solid #3a4a68;border-radius:5px;font-size:9px;padding:1px 4px;color:var(--cyan);font-weight:700}
.gitem .lock{position:absolute;inset:0;background:#04070cd0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--dim)}
.gitem .lock b{color:var(--gold);font-size:11px}
.gbar{display:flex;align-items:center;gap:4px}
.gbar .btn{flex:1;padding:6px 0;font-size:13px;line-height:1}
.gbar .n{font-size:9px;color:var(--cyan);min-width:26px;text-align:center;font-weight:700}
.deckbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #131b2a;background:#080d15}
.deckbar .n{font-size:12px;color:var(--dim)}
.deckbar .n b{color:var(--ink);font-size:15px}
.deckbar .n.warn b{color:var(--red)}
.tabs{display:flex;gap:6px;padding:8px 14px 10px}
.tab{flex:1;text-align:center;font-size:11px;padding:7px 0;border:1px solid #26314a;border-radius:8px;color:var(--dim);background:#0b111c}
.tab.on{color:#fff;border-color:#4d6a99;background:#16202f}
#result .box{padding:0 16px;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center;padding-bottom:24px}
.res{text-align:center;padding:8px 0 2px}
.res .t{font-size:34px;font-weight:800;letter-spacing:.16em}
.res .t.win{color:#ffe08a;text-shadow:0 0 24px #ffd76a55}
.res .t.lose{color:#8f9bb1}
.res .sub{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:4px}
.rescard{border:1px solid #26314a;border-radius:14px;background:#0c1220;padding:14px}
.rescard .l{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #ffffff08}
.rescard .l:last-child{border:0}
.rescard .l span{color:var(--dim)}
.rescard .l b{letter-spacing:.02em}
.rescard .l b.up{color:var(--green)}
.rescard .l b.down{color:var(--red)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:#0b1421f2;border:1px solid #2c3c5a;color:#dfe8f7;padding:9px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:88%;text-align:center;line-height:1.4}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 홈 ================= -->
  <section id="home" class="screen on">
    <div class="brand"><div class="logo">SHADOWDUEL</div><div class="tag">RUST·WASM ENGINE</div></div>
    <div class="pcard" id="pcard"></div>
    <div class="menu">
      <button class="mbtn hl" data-t="ranked">
        <div class="ic">▲</div>
        <div class="tx"><b>랭킹전 · 티어 등반</b><span id="rankdesc">브론즈부터 그랜드마스터까지 로컬 AI 상대</span></div>
        <div class="go">›</div>
      </button>
      <button class="mbtn" data-t="normal">
        <div class="ic">≋</div>

/* ================= WASM ================= */
function rd(lenFn, ptrFn, arg){
  const n = arg === undefined ? exp[lenFn]() : exp[lenFn](arg);
  const p = exp[ptrFn]();
  if(!n) return '';
  return dec.decode(new Uint8Array(mem.buffer, p, n));
}
function readState(){ return JSON.parse(rd('cd_state_len','cd_state_ptr')); }
function readLog(){ return rd('cd_log_len','cd_log_ptr'); }
function readPending(){ return JSON.parse(rd('cd_pending_len','cd_pending_ptr')); }
function lastErr(){ return rd('cd_err_len','cd_err_ptr') || '할 수 없는 행동이다.'; }

function loadCards(){
  CARD = [];
  for(let i=1;i<exp.cd_card_n();i++){
    const name = rd('cd_card_name_len','cd_card_name_ptr', i);
    if(!name) { CARD[i] = null; continue; }
    CARD[i] = {
      id:i, name,
      text: rd('cd_card_text_len','cd_card_text_ptr', i),
      kind: exp.cd_card_kind(i), lv: exp.cd_card_lv(i),
      atk: exp.cd_card_atk(i), def: exp.cd_card_def(i),
      fam: exp.cd_card_fam(i), pierce: exp.cd_card_pierce(i),
      eff: exp.cd_card_eff(i), cost: exp.cd_card_cost(i), rarity: exp.cd_card_rarity(i)
    };
  }
}

/* ================= 저장 ================= */
function createProfileCode(){
  const d = new Date(), year = String(d.getFullYear()).padStart(4,'0');
  const head = Number(year.slice(0,2)) + Number(year.slice(2,4)) + (d.getMonth()+1);
  const tail = d.getDate() + d.getHours() + d.getMinutes();
  const random = (()=>{ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % 100); }catch(e){ return 1 + Math.floor(Math.random()*100); } })();
  return String(head) + String(tail).padStart(2,'0') + String(random).padStart(2,'0');
}
function defaultSave(){
  return {
    v:1,
    prof:{ name:'태웅', code:createProfileCode(), created:Date.now() },
    rating:0, bestTier:0, streak:0, bestStreak:0, duels:0, wins:0, losses:0,
    dp:200, unlocked:STARTER_UNLOCK.slice(), deck:STARTER_DECK.slice(), sfx:true
  };
}
function normalizeDeck(list){
  const out = [];
  const cnt = {};
  for(const id of list){
    if(!CARD[id] || !S.unlocked.includes(id)) continue;
    cnt[id] = (cnt[id]||0)+1;
    if(cnt[id] > 3) continue;
    out.push(id);
  }
  return out;
}
function loadSave(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){}
  const d = defaultSave();
  if(!s || typeof s !== 'object'){ S = d; }
  else {
    S = Object.assign(d, s);
    S.prof = (s.prof && typeof s.prof === 'object') ? s.prof : d.prof;
    if(!S.prof.name) S.prof.name = '태웅';
    if(!/^\d{5,10}$/.test(String(S.prof.code||''))) S.prof.code = createProfileCode();
    if(!Array.isArray(S.unlocked)) S.unlocked = STARTER_UNLOCK.slice();
    S.unlocked = S.unlocked.filter(id => CARD[id]);
    for(const id of STARTER_UNLOCK) if(!S.unlocked.includes(id)) S.unlocked.push(id);
    if(!Array.isArray(S.deck)) S.deck = STARTER_DECK.slice();
    S.deck = normalizeDeck(S.deck);
    S.rating = Math.max(0, Number(S.rating)||0);
    S.dp = Math.max(0, Number(S.dp)||0);
    S.sfx = S.sfx !== false;
  }
  if(S.deck.length !== 30) S.deck = STARTER_DECK.slice();
  saveSave();
}
function saveSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ toastMsg('저장 공간이 부족합니다.'); }
}

/* ================= 등급 ================= */
function tierIdx(r){ let i = 0; TIERS.forEach((t,k)=>{ if(r >= t[1]) i = k; }); return i; }
function tierName(i){ return TIERS[clamp(i,0,6)][0]; }
function tierLabel(r){
  const i = tierIdx(r), lo = TIERS[i][1], hi = i < 6 ? TIERS[i+1][1] : lo + 900;
  const p = clamp((r - lo) / Math.max(1, hi - lo), 0, 1);
  return TIERS[i][0] + ' ' + (p >= .66 ? 'I' : p >= .33 ? 'II' : 'III');
}
function tierColorVar(i){ return 'var(' + TIERS[clamp(i,0,6)][2] + ')'; }

        <path d="M19 33 L41 33 M22 37 L38 37" stroke="${acc}" stroke-width="1" opacity=".6"/>`;
    }
  } else if(c.kind === 1){
    body = `<circle cx="30" cy="22" r="13" fill="none" stroke="${acc}" stroke-width="1.1" opacity=".9"/>
      <circle cx="30" cy="22" r="8" fill="none" stroke="${acc}" stroke-width=".7" opacity=".55"/>
      <path d="M30 7 L30 37 M15 22 L45 22 M20 12 L40 32 M40 12 L20 32" stroke="${acc}" stroke-width=".55" opacity=".5"/>
      <path d="M30 14 L34 22 L30 30 L26 22 Z" fill="${acc}" opacity=".9"/>`;
  } else {
    body = `<path d="M12 12 L48 12 L44 20 L12 20 Z" fill="url(#g${c.id})" stroke="${acc}" stroke-width=".8"/>
      <path d="M14 20 L20 30 L26 20 L32 30 L38 20 L44 30" fill="none" stroke="${acc}" stroke-width="1.1"/>
      <path d="M30 4 L30 11 M24 6 L30 4 L36 6" stroke="${acc}" stroke-width=".8" fill="none" opacity=".7"/>
      <circle cx="30" cy="32" r="2.4" fill="none" stroke="${acc}" stroke-width=".9"/>`;
  }
  return `<svg viewBox="0 0 60 44" preserveAspectRatio="xMidYMid slice">${g}${body}</svg>`;
}

/* ================= 카드 DOM ================= */
function cardHTML(id, o){
  o = o || {};
  const c = CARD[id]; if(!c) return '';
  const cls = ['card', c.kind === 0 ? 'm' : c.kind === 1 ? 's' : 't'];
  if(o.foe) cls.push('foe');
  if(o.hidden){ cls.push('set'); }
  else if(o.pos === 1 || o.pos === 2){ cls.push('def'); }
  if(o.sel) cls.push('sel');
  if(o.tgt) cls.push('tgt');
  if(o.dim) cls.push('dim');
  const dz = (o.z === undefined || o.z === null) ? '' : o.z;
  const di = (o.i === undefined || o.i === null) ? '' : o.i;
  const dataT = o.t ? ` data-t="${o.t}" data-z="${dz}" data-i="${di}"` : '';
  const style = o.w ? ` style="--cw:${o.w}px;--ch:${o.h}px"` : '';
  if(o.st){
    return `<div class="card t stc"${dataT}><div class="back"></div></div>`;
  }
  if(o.hidden){
    return `<div class="${cls.join(' ')}"${dataT}${style}><div class="back"></div></div>`;
  }
  const atk = Math.max(0, c.atk + (o.ab||0));
  const def = Math.max(0, c.def + (o.db||0));
  const lv = c.kind === 0 ? `<span class="lv">${c.lv}</span>` : `<span class="lv">${c.kind===1?'魔':'陷'}</span>`;
  let bot;
  if(c.kind === 0){
    bot = `<span class="a">${atk}</span><span class="d">${def}</span>`;
    if(c.pierce) bot = `<span class="a">${atk}</span><span class="tag">관통</span><span class="d">${def}</span>`;
  } else {
    bot = `<span style="color:#c9d6ea;font-size:6.5px">${c.kind===1?'마법':'함정'}</span>`;
  }
  return `<div class="${cls.join(' ')}"${dataT}${style}>
    <div class="top">${lv}<span class="nm">${esc(c.name)}</span></div>
    <div class="art">${artOf(c)}</div>
    <div class="bot">${bot}</div>
  </div>`;
}

/* ================= 듀얼 시작 ================= */
function startDuel(mode, tier){
  M = { mode, tier, over:false };
  const buf = new Uint8Array(mem.buffer, exp.cd_buf_ptr(), 1024);
  const csv = enc.encode(S.deck.join(','));
  buf.set(csv);
  const seed = (Math.random() * 0x7fffffff) | 0;
  exp.cd_new_duel(seed, tier, csv.length);
  G = readState();
  ui.sel = null; ui.busy = false; ui.prompt = null;
  show('duel');
  el('sheet').classList.remove('on');
  el('foeName').textContent = '상대';
  el('foeTier').textContent = tierName(tier);
  el('foeTier').style.color = tierColorVar(tier);
  el('myTier').textContent = tierLabel(S.rating);
  el('myTier').style.color = tierColorVar(tierIdx(S.rating));
  renderDuel();
  sfx('start');
}

/* ================= 듀얼 렌더 ================= */
function renderDuel(){
  if(!G) return;
  const raw = readLog().split('\n');
  const logLines = raw.slice(-6);
  el('say').innerHTML = logLines.slice(-2).map(esc).join('<br>');

  const fo = G.a, me = G.p;
  el('foeLp').textContent = fo.lp;
  el('meLp').textContent = me.lp;
  el('foeBar').style.width = clamp(fo.lp/8000*100,0,100) + '%';
  el('meBar').style.width = clamp(me.lp/8000*100,0,100) + '%';
  el('foeDeck').textContent = fo.dk; el('foeGrave').textContent = fo.gr; el('foeHand').textContent = fo.hk;
  el('meDeck').textContent = me.dk; el('meGrave').textContent = me.gr;

  const myTurn = G.turn === 0;
  el('phz').innerHTML = `<b>${myTurn ? '내 턴' : '상대 턴'}</b> · ${G.ph === 0 ? '메인' : '배틀'}`;
  el('mid').classList.toggle('foe', !myTurn);

  // 상대 몬스터
  let fh = '';
  for(let z=0; z<5; z++){
    const inst = G.a.mz[z];
    if(!inst){ fh += `<div class="slot" data-t="azone" data-k="m" data-z="${z}"><span class="ph"></span></div>`; continue; }
    const hidden = inst.p === 2;
    const tgt = ui.sel && ui.sel.type === 'attack' && !hidden ? true : (ui.sel && ui.sel.type === 'attack');
    fh += `<div class="anchor">${cardHTML(inst.i, {foe:true, pos:inst.p, hidden, ab:inst.ab, db:inst.db,
      t: ui.sel && ui.sel.type==='attack' ? 'atarget' : '', z, tgt: !!(ui.sel && ui.sel.type==='attack')})}</div>`;
  }
  el('foeMon').innerHTML = fh;

  let fs = '';
  for(let z=0; z<3; z++){
    const inst = G.a.sz[z];
    if(!inst){ fs += `<div class="slot st" data-t="azone" data-k="s" data-z="${z}"></div>`; continue; }
    fs += `<div class="anchor">${cardHTML(inst.i, {st:true})}</div>`;
  }
  el('foeSt').innerHTML = fs;
  let fh2 = '';
  for(let i=0;i<Math.min(7, G.a.hk);i++) fh2 += `<div class="mini"></div>`;
  el('foeHandRow').innerHTML = fh2;

  // 내 필드
  let ms = '';
  for(let z=0; z<3; z++){
    const inst = G.p.sz[z];
    const hot = !!(ui.sel && ui.sel.type === 'place' && ui.sel.kind === 's');
    if(!inst){
      ms += `<div class="slot st ${hot?'hot':''}" data-t="mzone" data-k="s" data-z="${z}"></div>`;
    } else {
      ms += `<div class="anchor">${cardHTML(inst.i, {st:true})}</div>`;
    }
  }
  el('meSt').innerHTML = ms;

  let mm = '';
  for(let z=0; z<5; z++){
    const inst = G.p.mz[z];
    const hot = !!(ui.sel && ((ui.sel.type === 'place' && ui.sel.kind === 'm') || ui.sel.type === 'tribute'));
    if(!inst){
      mm += `<div class="slot ${hot?'hot':''}" data-t="mzone" data-k="m" data-z="${z}"></div>`;
      continue;
    }
    const sel = ui.sel && ui.sel.type === 'mon' && ui.sel.z === z;
    const picked = ui.sel && ui.sel.type === 'tribute' && ui.sel.picked.includes(z);
    mm += `<div class="anchor">${cardHTML(inst.i, {pos:inst.p, hidden: inst.p === 2, ab:inst.ab, db:inst.db, sel,
      t:'mymon', z})}${picked?'<div style="position:absolute;inset:0;border:2px solid #7fd0c8;border-radius:7px;pointer-events:none"></div>':''}</div>`;
  }
  el('meMon').innerHTML = mm;

  // 내 패
  let hand = '';
  G.p.hand.forEach((id, i) => {
    const sel = ui.sel && ui.sel.type === 'hand' && ui.sel.i === i;
    hand += cardHTML(id, {i, t:'hand', sel});
  });
  el('myHand').innerHTML = hand || `<div style="color:#3a4760;font-size:11px;padding:26px 4px">패가 비었다</div>`;

  // 버튼 상태
  const b = el('btnPhase');
  if(G.over){ b.textContent = '결과'; b.disabled = true; }
  else if(!myTurn){ b.textContent = '상대 차례'; b.disabled = true; }
  else if(G.ph === 0){ b.textContent = '배틀 페이즈'; b.disabled = false; }
  else { b.textContent = '배틀 중'; b.disabled = true; }
  el('btnPhase').dataset.t = 'battle';
  document.querySelector('[data-t="end"]').disabled = !myTurn || G.over || ui.busy;

  // 시트
  renderSheet();
  el('hint').textContent = '';
  if(ui.sel && ui.sel.type === 'tribute'){
    el('hint').textContent = `제물 ${ui.sel.picked.length}/${ui.sel.need} 선택`;
    el('hint').classList.add('on');
  } else if(ui.sel && ui.sel.type === 'place'){
    el('hint').textContent = ui.sel.kind === 's' ? '마법·함정 존을 고르라' : '몬스터 존을 고르라';
    el('hint').classList.add('on');
  } else if(ui.sel && ui.sel.type === 'target'){
    el('hint').textContent = '대상을 고르라';
    el('hint').classList.add('on');
  } else if(ui.sel && ui.sel.type === 'attack'){
    el('hint').textContent = G.a.mz.some(x=>x) ? '공격 대상을 고르라' : '직접 공격';
    el('hint').classList.add('on');
  } else {
    el('hint').classList.remove('on');
    el('hint').textContent = '';
  }
}

function renderSheet(){
  const sh = el('sheet');
  const s = ui.sel;
  if(!s || ui.busy || G.over){ sh.classList.remove('on'); sh.innerHTML=''; return; }
  let html = '';
  if(s.type === 'hand'){
    const id = G.p.hand[s.i], c = CARD[id];
    if(!c){ sh.classList.remove('on'); sh.innerHTML=''; return; }
    html = `<div class="sh"><b>${esc(c.name)}</b><span>${c.kind===0?`Lv${c.lv} · ${c.atk}/${c.def}`:c.kind===1?'마법':'함정'}</span></div><div class="acts">`;
    if(c.kind === 0){
      html += `<button class="btn primary" data-t="summon">${c.lv>4?'제물 소환':'소환'}</button>
               <button class="btn" data-t="setmon">세트</button>`;
    } else if(c.kind === 1){
      html += `<button class="btn primary" data-t="cast">발동</button>`;
    } else {
      html += `<button class="btn primary" data-t="setst">세트</button>`;
    }
    html += `<button class="btn ghost" data-t="cancel">취소</button></div>`;
  } else if(s.type === 'mon'){
    const inst = G.p.mz[s.z], c = inst && CARD[inst.i];
    if(!c){ sh.classList.remove('on'); sh.innerHTML=''; return; }
    html = `<div class="sh"><b>${esc(c.name)}</b><span>${inst.p===0?'공격 표시':inst.p===1?'수비 표시':'뒷면'} · ${c.atk+(inst.ab||0)}/${c.def+(inst.db||0)}</span></div><div class="acts">`;
    const canSwitch = G.turn===0 && G.ph===0 && inst.p<=1 && !inst.sw;
    const canAtk = G.turn===0 && G.ph===1 && inst.p===0 && !inst.at && !inst.sw;
    if(canAtk) html += `<button class="btn primary" data-t="attack">공격</button>`;
    if(canSwitch) html += `<button class="btn" data-t="switch">${inst.p===0?'수비 표시로':'공격 표시로'}</button>`;
    html += `<button class="btn ghost" data-t="cancel">취소</button></div>`;
  }
  if(html){ sh.innerHTML = html; sh.classList.add('on'); }
  else { sh.classList.remove('on'); sh.innerHTML=''; }
}

/* ================= 입력 ================= */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-t]');
  if(!t) return;
  const act = t.dataset.t;
  if(ui.busy && !['quit','log'].includes(act)) return;
  try{
    switch(act){
      case 'ranked': {
        const nt = clamp(tierIdx(S.rating) + (S.streak>=3?1:0), 0, 6);
        startDuel('ranked', nt); break;
      }
      case 'normal': openNormal(); break;
      case 'deck': ui.deck = S.deck.slice(); ui.dfilter = 0; show('deck'); break;
      case 'codex': ui.filter = 0; show('codex'); break;
      case 'home': closeModal(); show('home'); break;
      case 'settings': openSettings(); break;
      case 'share': openShare(); break;
      case 'quit': confirmQuit(); break;
      case 'hand': pickHand(+t.dataset.i); break;
      case 'summon': doSummon(false); break;
      case 'setmon': doSummon(true); break;
      case 'cast': doCast(); break;
      case 'setst': doSetSt(); break;
      case 'switch': doSwitch(); break;
      case 'attack': enterAttack(); break;
      case 'mymon': pickMon(+t.dataset.z); break;
      case 'mzone': onMyZone(t.dataset.k, +t.dataset.z); break;
      case 'atarget': onAttackTarget(+t.dataset.z); break;
      case 'azone': onFoeZone(t.dataset.k, +t.dataset.z); break;
      case 'cancel': ui.sel = null; renderDuel(); break;
      case 'battle': toBattle(); break;
      case 'end': endTurn(); break;
      case 'log': showLog(); break;
      case 'again': {
        if(M.mode === 'ranked'){
          const nt = clamp(tierIdx(S.rating) + (S.streak>=3?1:0), 0, 6);
          startDuel('ranked', nt);
        } else startDuel('normal', M.tier);
        break;
      }
      case 'backTier': ui.sel = null; show('home'); break;
      case 'deckSave': saveDeck(); break;
      case 'deckReset': resetDeck(); break;
      case 'deckAdd': deckAdd(+t.dataset.i, 1); break;
      case 'deckSub': deckAdd(+t.dataset.i, -1); break;
      case 'unlock': unlockCard(+t.dataset.i); break;
      case 'closeModal': closeModal(); break;
      case 'confirmQuitYes': closeModal(); show('home'); break;
      case 'copyShare': copyShare(); break;
      case 'saveName': saveName(); break;
      case 'export': exportSave(); break;
      case 'import': el('importFile').click(); break;
      case 'resetSave': resetSave(); break;
      case 'trapYes': trapAnswer(+t.dataset.z); break;
      case 'trapNo': trapAnswer(-1); break;
      case 'graveM': showGrave(0); break;
      case 'graveA': showGrave(1); break;
      case 'sfxToggle': S.sfx = !S.sfx; saveSave(); openSettings(); break;
      case 'diff': pickDiff(+t.dataset.i); break;
    }
  } catch(err){
    console.error(err); toastMsg('오류: ' + (err && err.message ? err.message : err));
  }
});

function pickHand(i){
  if(!G || G.over || G.turn !== 0 || ui.busy) return;
  if(G.ph !== 0) { toastMsg('배틀 페이즈에는 패에서 낼 수 없다.'); return; }
  ui.sel = { type:'hand', i };
  renderDuel();
}

function pickMon(z){
  if(!G || G.over || G.turn !== 0 || ui.busy) return;
  if(ui.sel && ui.sel.type === 'target'){
    if(!G.p.mz[z]) return;
    const r = exp.cd_cast_spell(ui.sel.hand, z);
    if(r === 1){ toastMsg(lastErr()); return; }
    ui.sel = null; afterPlayerAction(r); return;
  }
  if(ui.sel && ui.sel.type === 'tribute'){
    const k = ui.sel.picked.indexOf(z);
    if(k >= 0) ui.sel.picked.splice(k,1);
    else if(ui.sel.picked.length < ui.sel.need) ui.sel.picked.push(z);
    renderDuel();
    return;
  }
  ui.sel = { type:'mon', z };
  renderDuel();
}

function doSummon(set){
  const s = ui.sel; if(!s || s.type !== 'hand') return;
  const id = G.p.hand[s.i], c = CARD[id];
  const need = c.lv <= 4 ? 0 : c.lv <= 6 ? 1 : 2;
  if(need > 0 && G.p.mz.filter(x=>x).length < need){
    toastMsg(`제물 ${need}장이 필요하다.`); return;
  }
  ui.sel = { type: need>0 ? 'tribute' : 'place', action:'summon', hand:s.i, need, picked:[], set, kind:'m' };
  renderDuel();
}

function onMyZone(kind, z){
  const s = ui.sel; if(!s) return;
  if(s.type === 'tribute'){
    if(kind === 'm'){
      if(!G.p.mz[z]) { toastMsg('제물로 쓸 내 몬스터를 골라라.'); return; }
      ui.sel = { type:'place', action:'summon', hand:s.hand, set:s.set, kind:'m', mask:s.picked.reduce((a,x)=>a|(1<<x),0) };
      renderDuel();
      if(!el('hint').textContent) el('hint').textContent = '몬스터 존을 고르라';
    }
    return;
  }
  if(s.type === 'place'){
    if(kind !== s.kind){ toastMsg(s.kind === 's' ? '마법·함정 존을 골라라.' : '몬스터 존을 골라라.'); return; }
    let r;
    if(s.action === 'summon') r = s.set ? exp.cd_set_monster(s.hand, z, s.mask||0) : exp.cd_summon(s.hand, z, s.mask||0);
    else if(s.action === 'setst') r = exp.cd_set_st(s.hand, z);
    if(r === 1){ toastMsg(lastErr()); return; }
    ui.sel = null;
    afterPlayerAction(r);
    return;
  }
  if(s.type === 'target'){
    // 마법 대상
    let r;
    if(s.action === 'cast') r = exp.cd_cast_spell(s.hand, z);
    if(r === 1){ toastMsg(lastErr()); return; }
    ui.sel = null;
    afterPlayerAction(r);
  }
}

function onFoeZone(kind, z){
  const s = ui.sel; if(!s) return;
  if(s.type === 'target' && kind === 'm'){
    const r = exp.cd_cast_spell(s.hand, z);
    if(r === 1){ toastMsg(lastErr()); return; }
    ui.sel = null; afterPlayerAction(r);
  }
}

function doCast(){
  const s = ui.sel; if(!s || s.type !== 'hand') return;
  const id = G.p.hand[s.i], c = CARD[id];
  const eff = c.eff;
  if(eff === 3 || eff === 4){
    if(!G.p.mz.some(x=>x)) { toastMsg('장착할 몬스터가 없다.'); return; }
    ui.sel = { type:'target', action:'cast', hand:s.i, side:'me' };
    renderDuel(); toastMsg('내 몬스터를 골라라.'); return;
  }
  if(eff === 5 || eff === 10){
    if(!G.a.mz.some(x=>x)) { toastMsg('상대 몬스터가 없다.'); return; }
    ui.sel = { type:'target', action:'cast', hand:s.i, side:'foe' };
    renderDuel(); toastMsg('상대 몬스터를 골라라.'); return;
  }
  const r = exp.cd_cast_spell(s.i, -1);
  if(r === 1){ toastMsg(lastErr()); return; }
  ui.sel = null; afterPlayerAction(r);
}

function doSetSt(){
  const s = ui.sel; if(!s || s.type !== 'hand') return;
  if(!G.p.sz.some(x=>!x)){ toastMsg('마법·함정 존이 가득 찼다.'); return; }
  ui.sel = { type:'place', action:'setst', hand:s.i, kind:'s' };
  renderDuel();
}

/* ================= 행동 후 처리 ================= */
function afterPlayerAction(r){
  G = readState();
  renderDuel();
  sfx('act');
  if(G.over || r === 2){ finishDuel(); return; }
  if(G.turn === 1){ aiTurn(); }
}

async function aiTurn(){
  if(ui.busy) return;
  ui.busy = true;
  if(ui.sel){ ui.sel = null; renderDuel(); }
  await sleep(360);
  let guard = 0;
  while(!G.over && G.turn === 1 && guard++ < 220){
    const r = exp.cd_ai_step();
    G = readState();
    renderDuel();
    if(r === 3){
      // 플레이어 함정 발동 기회
      ui.busy = false;
      openTrapPrompt();
      return;
    }
    if(r === 2 || G.over) break;
    await sleep(r === 1 ? 380 : 620);
  }
  ui.busy = false;
  G = readState();
  renderDuel();
  if(G.over) finishDuel();
}

/* ================= 결과 ================= */
let pendingResult = null;
function finishDuel(){
  if(M.over) return;
  M.over = true;
  const win = G.win === 0;
  let gain = 0, dp = 0;
  if(M.mode === 'ranked'){
    if(win){
      gain = 40 + M.tier * 12;
      S.rating += gain;
      S.streak += 1;
      S.bestStreak = Math.max(S.bestStreak, S.streak);
      dp = 40 + M.tier * 15;
    } else {
      gain = -Math.max(8, 18 + M.tier * 5);
      S.rating = Math.max(0, S.rating + gain);
      S.streak = 0;
      dp = 6;
    }
    S.bestTier = Math.max(S.bestTier, tierIdx(S.rating));
  } else {
    gain = 0;
    dp = win ? 18 : 4;
  }
  S.duels += 1;
  if(win) S.wins += 1; else S.losses += 1;
  S.dp += dp;
  saveSave();

  el('resTitle').textContent = win ? 'WIN' : 'LOSE';
  el('resTitle').className = 't ' + (win ? 'win' : 'lose');
  el('resSub').textContent = win ? '상대 LP를 0으로 만들었다' : 'LP가 0이 되었다';
  const rows = [];
  if(M.mode === 'ranked'){
    rows.push(['레이팅', `${S.rating - gain} → <b>${S.rating}</b>`, gain >= 0 ? 'up' : 'down', (gain>=0?'+':'') + gain]);
    rows.push(['현재 티어', tierLabel(S.rating), '', '']);
    rows.push(['연승', `${S.streak}연승 · 최고 ${S.bestStreak}`, '', '']);
  } else {
    rows.push(['모드', '일반 대전 · ' + tierName(M.tier), '', '']);
  }
  rows.push(['듀얼 포인트', `+${dp} → ${S.dp}`, 'up', '']);
  rows.push(['통산', `${S.wins}승 ${S.losses}패`, '', '']);
  el('resCard').innerHTML = rows.map(r => `<div class="l"><span>${r[0]}</span><b class="${r[2]}">${r[1]}</b></div>`).join('');
  el('resShare').innerHTML = shareCardHTML();
  sfx(win ? 'win' : 'lose');
  show('result');
}

function fnv(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).toUpperCase().padStart(8,'0');
}
function shareData(){
  const lab = tierLabel(S.rating);
  const payload = [S.prof.code, S.prof.name, lab, S.streak, S.rating, S.duels, S.wins].join('|');

}

let AC = null;
function sfx(kind){
  if(!S || !S.sfx) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const tone = (f, d, type, g0) => {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      gn.gain.value = g0 || .05;
      o.connect(gn); gn.connect(AC.destination);
      o.start(t); o.frequency.exponentialRampToValueAtTime(Math.max(50, f*.7), t+d);
      gn.gain.exponentialRampToValueAtTime(.0001, t+d); o.stop(t+d+.02);
    };
    if(kind === 'start'){ tone(220,.18,'triangle',.05); setTimeout(()=>tone(330,.22,'triangle',.05),120); }
    else if(kind === 'phase'){ tone(520,.1,'sine',.03); }
    else if(kind === 'act'){ tone(640,.08,'sine',.028); }
    else if(kind === 'win'){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.05), i*110)); }
    else if(kind === 'lose'){ [392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.05), i*150)); }
  }catch(e){}
}

  try{
    const bin = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
    const mod = await WebAssembly.instantiate(bin, {});
    exp = mod.instance.exports;
    mem = exp.memory;
    loadCards();
    loadSave();
    renderHome();
    show('home');
    document.body.dataset.ready = '1';
  }catch(err){
    document.body.innerHTML = '<div style="padding:24px;color:#ff9b9b;font:13px/1.6 monospace">WASM 엔진 로드 실패<br>' + esc(err && err.message || err) + '</div>';
  }
}
boot();
</script>
</body>
</html>
