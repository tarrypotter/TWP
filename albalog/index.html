<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>알바로그</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#17191f; --ink2:#5d6472; --ink3:#8b92a1;
  --line:#eaecf1; --line2:#dcdfe6; --accent:#2f4bdb; --accent-soft:#edf0fe;
  --green:#0e7a52; --red:#c62f2f; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums;
}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom));}

/* top */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:rgba(244,245,247,.94);backdrop-filter:saturate(1.2) blur(12px);
}
.brand{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-right:auto}
.mode-pill{
  border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:999px;
  height:32px;padding:0 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;
}
.mode-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.mode-pill.on{background:var(--accent-soft);border-color:#ccd4fb;color:var(--accent)}
.mode-pill.on .dot{background:var(--accent)}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);
}
.icon-btn svg{width:19px;height:19px}

main{padding:0 16px 8px}

/* month bar */
.monthbar{display:flex;align-items:center;gap:6px;padding:2px 0 12px}
.mnav{
  width:32px;height:32px;border:0;background:transparent;color:var(--ink2);
  font-size:20px;line-height:1;border-radius:9px;font-family:inherit;
}
.mlabel{font-size:15px;font-weight:700;letter-spacing:-.2px;padding:0 2px}
.mtoday{margin-left:auto;border:1px solid var(--line2);background:#fff;color:var(--ink2);
  border-radius:999px;height:28px;padding:0 10px;font-size:12px;font-weight:600;font-family:inherit}

/* cards */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h3{margin:0;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:0}
.card-head .muted{margin-left:auto;font-size:12px;color:var(--ink3)}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 8px}

/* hero */
.hero-head{display:flex;align-items:center;justify-content:space-between}
.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.chip-soft{font-size:11.5px;font-weight:600;color:var(--ink2);background:#f1f2f5;border-radius:999px;padding:3px 9px}
.amount{font-size:31px;font-weight:750;letter-spacing:-1.2px;margin:6px 0 2px;color:var(--ink)}
.amount.zero{color:var(--ink3)}
.amount.mid{font-size:24px;letter-spacing:-.8px;margin:2px 0 6px}
.hero-sub{font-size:12.5px;color:var(--ink3)}
.hero-grid{display:flex;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.hero-grid > div{flex:1;display:flex;flex-direction:column;gap:2px}
.hero-grid span{font-size:11.5px;color:var(--ink3)}
.hero-grid b{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.proj{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.proj-l{display:flex;align-items:baseline;justify-content:space-between}
.proj-l span{font-size:12.5px;color:var(--ink2);font-weight:600}
.proj-l b{font-size:17px;letter-spacing:-.4px;color:var(--green)}
.proj-cap{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.4}

/* notice */
.notice{
  display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:var(--ink2);line-height:1.5;
}
.notice b{color:var(--ink);font-weight:700}
.notice button{
  margin-left:auto;flex:none;border:0;background:transparent;color:var(--accent);
  font-size:12.5px;font-weight:700;font-family:inherit;padding:0;
}

/* buttons */
.btn{
  border:0;border-radius:13px;height:50px;padding:0 18px;font-size:15px;font-weight:700;
  font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:#fff}
.btn.wide{width:100%;margin-bottom:12px}
.btn.ghost{background:#f2f3f6;color:var(--ink2)}
.btn.danger{background:#fdf0f0;color:var(--red)}
.btn.sm{height:40px;font-size:13.5px;border-radius:11px;padding:0 14px}

/* calendar */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:2px 0 4px}
.cal-head span{text-align:center;font-size:11px;color:var(--ink3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{
  border:0;background:transparent;border-radius:11px;height:50px;padding:4px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--ink);
}
.cal-cell .d{font-size:13px;font-weight:600;line-height:1.2}
.cal-cell .h{font-size:9.5px;color:var(--ink3);line-height:1.1;white-space:nowrap}
.cal-cell.sun .d{color:#c0483f}
.cal-cell.sat .d{color:#3f6ac0}
.cal-cell.worked{background:#f2f4fa}
.cal-cell.worked .h{color:var(--accent);font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-cell.blank{background:transparent}

/* list */
.day-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 0 6px;font-size:12px;color:var(--ink3);font-weight:600;border-top:1px solid var(--line)}
.list .day-head:first-of-type{border-top:0;padding-top:2px}
.day-head b{color:var(--ink2);font-weight:700}
.row{
  width:100%;border:0;background:transparent;text-align:left;padding:9px 0;
  display:flex;align-items:center;gap:10px;font-family:inherit;color:var(--ink);
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-l b{font-size:14px;font-weight:700;letter-spacing:-.2px}
.row-l i{font-size:11.5px;color:var(--ink3);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{flex:none;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.row .go{flex:none;color:#c3c8d2;font-size:16px;margin-left:2px}

/* kv */
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13.5px}
.kv span{color:var(--ink2)}
.kv b{font-weight:700;letter-spacing:-.2px}
.kv.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.kv.total b{font-size:17px;letter-spacing:-.4px}
.kv .minus{color:var(--red)}
.kv .plus{color:var(--green)}
.meta{font-size:12px;color:var(--ink3);margin:-2px 0 8px}

/* empty */
.empty{padding:26px 8px;text-align:center}
.empty p{margin:0 0 4px;font-size:14px;font-weight:700}
.empty span{font-size:12.5px;color:var(--ink3);line-height:1.5;display:block}
.empty .btn{margin-top:14px}

/* workplace list */
.wp-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.wp-item:last-child{border-bottom:0}
.wp-item .wi{flex:1;min-width:0}
.wp-item .wi b{font-size:14.5px;font-weight:700;letter-spacing:-.2px;display:block;margin-bottom:3px}
.wp-item .wi span{font-size:12px;color:var(--ink3);display:block;line-height:1.45}
.wp-item .ww{flex:none;text-align:right}
.wp-item .ww b{font-size:13.5px;font-weight:700}
.wp-item .ww span{font-size:11px;color:var(--ink3);display:block}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10.5px;font-weight:700;color:var(--ink2);background:#f1f2f5;border-radius:5px;padding:2px 6px}
.tag.acc{color:var(--accent);background:var(--accent-soft)}

/* tabbar */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:40;
  display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;border:0;background:transparent;padding:9px 0 10px;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:11px;font-weight:600;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{stroke-width:2.1}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(18,20,26,.42);z-index:50;opacity:0;transition:opacity .18s ease}
.backdrop.show{opacity:1}
.sheet{
  position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:100%;max-width:430px;
  background:#fff;border-radius:22px 22px 0 0;z-index:60;max-height:92dvh;display:flex;flex-direction:column;
  transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 40px rgba(16,24,40,.13);
}
.sheet.show{transform:translate(-50%,0)}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:#dfe2e8;margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;padding:12px 18px 6px;flex:none}
.sheet-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px;flex:1}
.sheet-head .x{border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:700;font-family:inherit;padding:6px 0 6px 12px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(22px + env(safe-area-inset-bottom))}

.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=text],.field select{
  width:100%;height:48px;border:1px solid var(--line2);border-radius:12px;background:#fff;
  padding:0 13px;font-size:16px;font-family:inherit;color:var(--ink);appearance:none;
}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b92a1' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:17px;padding-right:36px}
.field input:focus,.field select:focus{outline:none;border-color:var(--ink)}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.hint{font-size:11.5px;color:var(--ink3);margin:-8px 0 14px;line-height:1.5}
.check{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.preview{
  background:#f6f7f9;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);
  margin:4px 0 16px;line-height:1.5;
}
.preview b{color:var(--ink);font-weight:700}
.preview .money{display:block;font-size:17px;font-weight:750;color:var(--ink);letter-spacing:-.4px;margin-top:3px}
.sheet-actions{display:flex;gap:8px}
.sheet-actions .btn{flex:1}
.sheet-actions .btn.ghost,.sheet-actions .btn.danger{flex:none;padding:0 16px}

/* switch rows */
.switchrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switchrow:last-of-type{border-bottom:0}
.switchrow .tx{flex:1;min-width:0}
.switchrow .tx b{display:block;font-size:14px;font-weight:700;letter-spacing:-.2px}
.switchrow .tx span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
input.sw{appearance:none;width:46px;height:28px;border-radius:999px;background:#e2e5ea;position:relative;flex:none;margin:0;transition:background .16s}
input.sw:checked{background:var(--ink)}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
input.sw:checked::after{transform:translateX(18px)}

/* segmented */
.seg{display:flex;gap:6px;background:#f2f3f6;border-radius:12px;padding:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.25}
.seg input:checked + span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}

/* weekday chips */
.wd{display:flex;gap:5px}
.wd label{flex:1;position:relative}
.wd input{position:absolute;opacity:0;pointer-events:none}
.wd span{display:block;text-align:center;height:40px;line-height:40px;border-radius:10px;background:#f2f3f6;
  font-size:12.5px;font-weight:700;color:var(--ink2)}
.wd input:checked + span{background:var(--ink);color:#fff}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(23,25,31,.94);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;
  z-index:80;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* data rows in settings */
.datarow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;font-family:inherit;color:var(--ink)}
.datarow:last-child{border-bottom:0}
.datarow .tx{flex:1}
.datarow b{display:block;font-size:14px;font-weight:700}
.datarow span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.datarow .arrow{color:#c3c8d2;font-size:16px}
.datarow.dangerous b{color:var(--red)}
textarea.import{width:100%;height:120px;border:1px solid var(--line2);border-radius:12px;padding:11px;
  font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">알바로그</div>
    <button class="mode-pill" id="modePill" data-act="toggleMode"><span class="dot"></span><span id="modePillTx">간단 모드</span></button>
    <button class="icon-btn" data-act="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toast"></div>

<script>
/* ============================================================
   알바로그 3.0 — 로컬 전용 근무 기록·급여 계산
   모든 데이터는 이 브라우저의 localStorage 에만 저장됩니다.
   ============================================================ */

/* ---------- 계산 (순수 함수) ---------- */
/* CALC_START */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymdOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ var p=String(s||'').split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function hhmmToMin(s){ if(!s) return null; var p=String(s).split(':').map(Number); if(p.length<2||isNaN(p[0])||isNaN(p[1])) return null; return p[0]*60+p[1]; }
function minToHhmm(v){ v=((Math.round(v)%1440)+1440)%1440; return pad2(Math.floor(v/60))+':'+pad2(v%60); }
function durLabel(min){
  min=Math.max(0,Math.round(Number(min)||0));
  var h=Math.floor(min/60), m=min%60;
  if(h && m) return h+'시간 '+m+'분';
  if(h) return h+'시간';
  return m+'분';
}
function comma(n){
  var v=Math.round(Number(n)||0), sign=v<0?'-':'', s=String(Math.abs(v)), out='';
  for(var i=0;i<s.length;i++){
    out+=s[i];
    var left=s.length-i-1;
    if(left>0 && left%3===0) out+=',';
  }
  return sign+out;
}
function won(n){ return comma(n)+'원'; }

/* 출근~퇴근 구간. 퇴근이 출근보다 이르면 다음 날로 넘김 */
function shiftRange(start, end){
  var s=hhmmToMin(start), e0=hhmmToMin(end);
  if(s===null||e0===null) return null;
  if(e0===s) return null;
  var e=e0<s ? e0+1440 : e0;
  var gross=e-s;
  if(gross<=0||gross>1440) return null;
  return {s:s, e:e, gross:gross};
}
/* 22:00~06:00 과 겹치는 분 */
function nightOverlapMin(s, e){
  var t=0;
  for(var k=-1;k<=2;k++){
    var ws=1320+1440*k, we=1800+1440*k;
    var a=Math.max(s,ws), b=Math.min(e,we);
    if(b>a) t+=b-a;
  }
  return t;
}
/* 실제 적용할 휴게시간 */
function resolveBreak(log, wp){
  if(log && log.breakMin!==null && log.breakMin!==undefined && log.breakMin!=='') return Math.max(0, Number(log.breakMin)||0);
  if(!wp) return 0;
  var type=wp.breakType||'none';
  if(type==='none') return 0;
  var r=shiftRange(log&&log.start, log&&log.end);
  if(!r) return 0;
  if(type==='auto') return Math.floor(r.gross/240)*30;
  var fixed = type==='custom' ? (Number(wp.breakCustom)||0) : (Number(type)||0);
  if(!fixed) return 0;
  if(r.gross<240) return 0;            /* 4시간 미만 근무에는 고정 휴게를 빼지 않음 */
  return fixed;
}
/* 근무 1건 계산 */
function computeShift(log, wp, defaultWage){
  var out={grossMin:0, netMin:0, breakMin:0, nightMin:0, base:0, nightPay:0, holidayPay:0, gross:0, wage:0, nightOn:false, holidayOn:false};
  if(!log) return out;
  var r=shiftRange(log.start, log.end);
  if(!r) return out;
  var wage = wp ? (Number(wp.wage)||0) : (Number(defaultWage)||0);
  var br = Math.min(resolveBreak(log, wp), Math.max(r.gross-30, 0));
  var net = Math.max(r.gross-br, 0);
  var nightGross = nightOverlapMin(r.s, r.e);
  var night = r.gross>0 ? Math.round(nightGross*net/r.gross) : 0;
  var base = net/60*wage;
  var nightOn = !!(wp && wp.night);
  var nightPay = nightOn ? night/60*wage*0.5 : 0;
  var holidayOn = !!(wp && wp.holiday && log.holiday);
  var holidayPay = 0;
  if(holidayOn){
    var h=net/60;
    holidayPay = (Math.min(h,8)*0.5 + Math.max(h-8,0)*1.0)*wage;   /* 8시간까지 1.5배, 초과분 2배 */
  }
  out.grossMin=r.gross; out.netMin=net; out.breakMin=br; out.nightMin=night;
  out.wage=wage; out.base=base; out.nightPay=nightPay; out.holidayPay=holidayPay;
  out.gross=base+nightPay+holidayPay; out.nightOn=nightOn; out.holidayOn=holidayOn;
  return out;
}
function taxRate(t){ return t==='3.3'?0.033 : (t==='insurance'?0.094 : 0); }
/* 월~일 주의 월요일 */
function weekStartOf(ds){
  var d=parseYmd(ds); var wd=(d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);
  return ymdOf(d);
}
/* 한 달 정산 */
function computeMonth(allLogs, workplaces, defaultWage, y, m){
  var wps=workplaces||[], logs=allLogs||[];
  var wpMap={}; for(var i=0;i<wps.length;i++) wpMap[wps[i].id]=wps[i];
  var prefix=y+'-'+pad2(m)+'-';
  var mLos=logs.filter(function(l){ return String(l.date||'').indexOf(prefix)===0; })
    .sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return (hhmmToMin(a.start)||0)-(hhmmToMin(b.start)||0);
    });
  var byKey={};
  function slot(key, wp){
    if(!byKey[key]){
      byKey[key]={key:key, wp:wp||null, name: wp?wp.name:'근무지 없이', tax: wp?(wp.tax||'none'):'none',
        netMin:0, base:0, night:0, holiday:0, weekly:0, gross:0, deduction:0, net:0, days:0, logCount:0, _d:{}};
    }
    return byKey[key];
  }
  var rows=[];
  for(var j=0;j<mLos.length;j++){
    var log=mLos[j], wp=wpMap[log.wpId]||null;
    var c=computeShift(log, wp, defaultWage);
    rows.push({log:log, wp:wp, calc:c});
    var s=slot(wp?wp.id:'__none', wp);
    s.netMin+=c.netMin; s.base+=c.base; s.night+=c.nightPay; s.holiday+=c.holidayPay;
    s.logCount++; s._d[log.date]=1;
  }
  /* 주휴수당: 이 달에 걸친 주들을 계산하고, 그 주 일요일이 이 달에 있을 때만 이 달에 잡음 */
  var weekStarts={}, dim=new Date(y,m,0).getDate();
  for(var d=1; d<=dim; d++){ weekStarts[weekStartOf(y+'-'+pad2(m)+'-'+pad2(d))]=1; }
  var monthKey=prefix.slice(0,7);
  var weekRows=[];
  Object.keys(weekStarts).sort().forEach(function(ws){
    var start=parseYmd(ws), end=new Date(start); end.setDate(end.getDate()+7);
    var endStr=ymdOf(end), sunStr=ymdOf(new Date(start.getTime()+6*86400000));
    var info={weekStart:ws, weekEnd:ymdOf(new Date(end.getTime()-86400000)), sun:sunStr,
      hours:{}, pay:{}, logs:0, inMonth: sunStr.slice(0,7)===monthKey};
    for(var k=0;k<wps.length;k++){
      var wp2=wps[k], mins=0, cnt=0;
      for(var q=0;q<logs.length;q++){
        var l2=logs[q];
        if(l2.wpId!==wp2.id) continue;
        if(!(l2.date>=ws && l2.date<endStr)) continue;
        mins+=computeShift(l2, wp2, defaultWage).netMin; cnt++;
      }
      if(cnt){ info.logs+=cnt; info.hours[wp2.id]=mins/60; }
      if(wp2.weekly && mins/60>=15 && info.inMonth){
        var pay=Math.min(mins/60,40)/40*8*(Number(wp2.wage)||0);
        info.pay[wp2.id]=pay;
        slot(wp2.id, wp2).weekly+=pay;
      }
    }
    if(info.logs>0) weekRows.push(info);
  });
  var byWp=Object.keys(byKey).map(function(k){ return byKey[k]; });
  byWp.forEach(function(s){
    s.days=Object.keys(s._d).length; delete s._d;
    s.base=Math.round(s.base); s.night=Math.round(s.night); s.holiday=Math.round(s.holiday); s.weekly=Math.round(s.weekly);
    s.gross=s.base+s.night+s.holiday+s.weekly;
    s.deduction=Math.round(s.gross*taxRate(s.tax));
    s.net=s.gross-s.deduction;
  });
  byWp.sort(function(a,b){ return b.gross-a.gross; });
  var total={netMin:0, days:0, logCount:0, base:0, night:0, holiday:0, weekly:0, gross:0, deduction:0, net:0, _d:{}};
  byWp.forEach(function(s){
    total.netMin+=s.netMin; total.logCount+=s.logCount;
    total.base+=s.base; total.night+=s.night; total.holiday+=s.holiday; total.weekly+=s.weekly;
    total.gross+=s.gross; total.deduction+=s.deduction; total.net+=s.net;
  });
  rows.forEach(function(r){ total._d[r.log.date]=1; });
  total.days=Object.keys(total._d).length; delete total._d;
  return {y:y, m:m, rows:rows, byWp:byWp, total:total, weeks:weekRows};
}
/* 월말 예상: 고정 근무일이 있으면 그 일정으로, 없으면 지금까지 하루 평균으로 */
function projectMonth(stats, allLogs, workplaces, defaultWage, y, m, todayStr){
  var today=parseYmd(todayStr);
  if(today.getFullYear()!==y || today.getMonth()+1!==m) return null;
  var dim=new Date(y,m,0).getDate(), todayDay=today.getDate();
  var hasToday=(allLogs||[]).some(function(l){ return l.date===todayStr; });
  var startDay=hasToday ? todayDay+1 : todayDay;
  var cnt=0, hours=0, net=0, plan=[];
  for(var d=startDay; d<=dim; d++){
    var dt=new Date(y,m-1,d), wd=dt.getDay(), ds=ymdOf(dt);
    for(var i=0;i<(workplaces||[]).length;i++){
      var wp=workplaces[i];
      if(!wp || !wp.weekdays || !wp.weekdays.length) continue;
      if(wp.weekdays.indexOf(wd)<0) continue;
      if(!wp.startTime || !wp.endTime) continue;
      if((allLogs||[]).some(function(l){ return l.date===ds && l.wpId===wp.id; })) continue;
      var c=computeShift({start:wp.startTime, end:wp.endTime, breakMin:null, holiday:false}, wp, defaultWage);
      if(!c.gross) continue;
      net+=(c.base+c.nightPay)*(1-taxRate(wp.tax));
      hours+=c.netMin/60; cnt++;
      plan.push({date:ds, name:wp.name, netMin:c.netMin});
    }
  }
  if(cnt>0) return {basis:'fixed', amount:Math.round(stats.total.net+net), count:cnt, hours:hours, plan:plan, daysLeft:dim-startDay+1};
  if(stats.logCount===0) return null;
  if(todayDay<=0) return null;
  var daily=stats.total.net/todayDay;
  return {basis:'pace', amount:Math.round(daily*dim), daily:daily, daysLeft:dim-todayDay+1, count:0};
}

function normalizeState(s){
  var out=emptyState();
  if(!s || typeof s!=='object') return out;
  out.version='3.0';
  out.mode = s.mode==='simple' ? 'simple' : 'full';
  out.defaultWage = Number(s.defaultWage) || MIN_WAGE_2026;

    return {

      wage:Number(w.wage)||MIN_WAGE_2026,
      weekly:!!w.weekly, night:!!w.night, holiday:!!w.holiday,
      tax: (w.tax==='3.3'||w.tax==='insurance') ? w.tax : 'none',
      breakType:['none','30','60','90','auto','custom'].indexOf(String(w.breakType))>=0 ? String(w.breakType) : 'none',
      breakCustom:Number(w.breakCustom)||60,
      weekdays:Array.isArray(w.weekdays)? w.weekdays.map(Number).filter(function(n){ return n>=0&&n<=6; }) : [],
      startTime:/^\d{2}:\d{2}$/.test(w.startTime||'') ? w.startTime : '',
      endTime:/^\d{2}:\d{2}$/.test(w.endTime||'') ? w.endTime : ''
    };
  }) : [];
  var ids={}; out.workplaces.forEach(function(w){ ids[w.id]=1; });
  out.logs = Array.isArray(s.logs) ? s.logs.filter(function(l){
    return l && /^\d{4}-\d{2}-\d{2}$/.test(l.date||'') && hhmmToMin(l.start)!==null && hhmmToMin(l.end)!==null;

      start:l.start, end:l.end,

      holiday: !!l.holiday
    };
  }) : [];
  return out;
}
/* 2.x 데이터가 있으면 3.0 으로 옮겨 담기 */
function migrateOld(){
  for(var i=0;i<OLD_KEYS.length;i++){
    var raw=null;
    try{ raw=localStorage.getItem(OLD_KEYS[i]); }catch(e){ raw=null; }
    if(!raw) continue;
    var o=null;
    try{ o=JSON.parse(raw); }catch(e){ continue; }
    if(!o || (!Array.isArray(o.workplaces) && !Array.isArray(o.logs))) continue;
    var st=emptyState();
    st.defaultWage = Number(o.hourly)||MIN_WAGE_2026;
    st.workplaces = (o.workplaces||[]).map(function(w){
      return {
        id: uid('wp'), name: String(w.name||'근무지'), wage: Number(w.hourly||w.wage)||MIN_WAGE_2026,
        weekly:false, night: w.calcNight!==false, holiday: !!w.calcHoliday,
        tax: o.taxType==='3.3' ? '3.3' : 'none',
        breakType:'none', breakCustom:60, weekdays:[], startTime:'', endTime:''
      };
    });
    var map={};
    st.workplaces.forEach(function(w,idx){ map[(o.workplaces||[])[idx] && (o.workplaces||[])[idx].id]=w.id; });
    st.logs=(o.logs||[]).filter(function(l){ return l && l.date && l.start && l.end; }).map(function(l){
      return {
        id: uid('lg'), date:l.date, wpId: map[l.wpId]||'',
        start:l.start, end:l.end,
        breakMin: (l.breakMin===null||l.breakMin===undefined||l.breakMin==='') ? null : Number(l.breakMin)||0,
        holiday: !!l.holiday
      };
    });
    return st;
  }
  return null;
}
function load(){
  var raw=null;
  try{ raw=localStorage.getItem(STORAGE_KEY); }catch(e){ raw=null; }
  if(raw){
    try{ state=normalizeState(JSON.parse(raw)); }
    catch(e){ state=emptyState(); }
    return;
  }
  var old=migrateOld();
  if(old){ state=normalizeState(old); save(); }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ toast('저장 공간이 부족해요'); }
}

    + '<div class="kv"><span>공제</span><b class="minus">-'+(st.total.deduction?won(st.total.deduction):'0원')+'</b></div>'
    + '<div class="kv total"><span>실수령</span><b>'+won(st.total.net)+'</b></div>'
    + '</div>';

  if(!st.byWp.length){
    html+='<div class="card"><div class="empty"><p>정산할 기록이 없어요</p>'
      + '<span>'+monthLabel(ui.y,ui.m)+'에 출근한 날을 적으면 근무지별로 나눠서 계산해요.</span>'
      + '<button class="btn primary sm" data-act="addLog">기록 추가</button></div></div>';
  }else{
    st.byWp.forEach(function(s){
      html+='<div class="card">'
        + '<div class="card-head"><h3>'+s.name+'</h3><span class="chip-soft">'+taxShort(s.tax)+'</span></div>'
        + '<div class="meta">'+durLabel(s.netMin)+' · '+s.days+'일 · '+s.logCount+'건</div>'
        + kv('기본급', won(s.base))
        + (s.weekly? kv('주휴수당', won(s.weekly)) : '')
        + (s.night? kv('야간수당 (가산)', won(s.night)) : '')
        + (s.holiday? kv('공휴일 수당 (가산)', won(s.holiday)) : '')
        + kv('세전', won(s.gross), 'sep')
        + (s.deduction? '<div class="kv"><span>공제 ('+taxLabel(s.tax)+')</span><b class="minus">-'+won(s.deduction)+'</b></div>' : '')
        + '<div class="kv total"><span>실수령</span><b>'+won(s.net)+'</b></div>'
        + '</div>';
    });
  }

  html+='<div class="card">'
    + '<div class="card-head"><h3>월말 예상</h3></div>';
  if(pr){
    html+='<div class="amount mid">'+won(pr.amount)+'</div>';
    if(pr.basis==='fixed'){
      html+='<p class="proj-cap">고정 근무일('+pr.count+'일 '+durLabel(pr.hours*60)+')을 더한 값이에요. 주휴수당은 빼고 계산했어요.</p>';
    }else{
      html+='<p class="proj-cap">지금까지 하루 평균 '+won(pr.daily)+'으로 남은 '+pr.daysLeft+'일을 채웠을 때예요. 주휴수당은 빼고 계산했어요.</p>';
    }
  }else if(!isThisMonth()){
    html+='<p class="proj-cap">지난 달이라 월말 예상은 없어요.</p>';
  }else{
    html+='<p class="proj-cap">기록이 쌓이면 월말 예상 금액을 계산해 드려요. 근무지에 고정 근무일을 넣으면 남은 근무까지 더해서 계산해요.</p>';
  }
  html+='</div>';

  if(st.weeks.length){
    html+='<h2 class="sec">주별</h2><div class="card">';
    st.weeks.slice().reverse().forEach(function(w){
      var mins=0, pay=0;
      Object.keys(w.hours).forEach(function(k){ mins+=w.hours[k]*60; });
      Object.keys(w.pay).forEach(function(k){ pay+=w.pay[k]; });
      var label=pad2(parseYmd(w.weekStart).getMonth()+1)+'/'+pad2(parseYmd(w.weekStart).getDate())
        +' ~ '+pad2(parseYmd(w.weekEnd).getMonth()+1)+'/'+pad2(parseYmd(w.weekEnd).getDate());
      html+='<div class="kv"><span>'+label+'</span><b>'+durLabel(mins)+(pay?' <span style="color:var(--green);font-weight:600;font-size:12px">+주휴 '+won(pay)+'</span>':'')+'</b></div>';
    });
    html+='</div>';
  }
  return html;
}
function kv(label, value, cls){
  return '<div class="kv'+(cls?' '+cls:'')+'"><span>'+label+'</span><b>'+value+'</b></div>';
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- 시트 ---------- */
function openSheet(title, bodyHtml){
  clearTimeout(closeSheet._t);
  var root=document.getElementById('sheetRoot');
  root.innerHTML='<div class="backdrop" data-act="closeSheet"></div>'
    + '<div class="sheet" id="sheet">'
    +   '<div class="sheet-grab"></div>'
    +   '<div class="sheet-head"><h2>'+title+'</h2><button class="x" data-act="closeSheet">닫기</button></div>'
    +   '<div class="sheet-body">'+bodyHtml+'</div>'
    + '</div>';
  requestAnimationFrame(function(){
    var bd=root.querySelector('.backdrop'), sh=document.getElementById('sheet');
    if(bd) bd.classList.add('show');
    if(sh) sh.classList.add('show');
  });
}
function closeSheet(){
  var root=document.getElementById('sheetRoot');
  clearTimeout(closeSheet._t);
  if(!root.innerHTML) return;
  var bd=root.querySelector('.backdrop'), sh=document.getElementById('sheet');
  if(bd) bd.classList.remove('show');
  if(sh) sh.classList.remove('show');
  closeSheet._t=setTimeout(function(){ root.innerHTML=''; }, 200);
}

/* ---------- 시트: 기록 ---------- */
function openRecordSheet(opts){
  opts=opts||{};
  var editing = opts.id ? logById(opts.id) : null;
  var simple = state.mode==='simple';
  var l = editing ? Object.assign({}, editing) : {
    id:'', date: opts.date || todayStr(), wpId:'', start:'', end:'', breakMin:null, holiday:false
  };
  /* 새 기록이면 그 요일의 고정 근무표로 미리 채움 */
  if(!editing){
    var wd=parseYmd(l.date).getDay();
    var matched=null;
    for(var i=0;i<state.workplaces.length;i++){
      var w=state.workplaces[i];
      if(w.weekdays && w.weekdays.indexOf(wd)>=0 && w.startTime && w.endTime){ matched=w; break; }
    }
    if(matched && !l.wpId){ l.wpId=matched.id; l.start=matched.startTime; l.end=matched.endTime; }
    if(!l.wpId && state.workplaces.length===1) l.wpId=state.workplaces[0].id;
  }
  var wp=l.wpId ? wpById(l.wpId) : null;
  var body='<form id="recordForm">'
    + '<input type="hidden" id="rId" value="'+escapeHtml(l.id||'')+'">'
    + '<div class="field"><label>날짜</label><input type="date" id="rDate" value="'+l.date+'"></div>';
  if(!simple){
    var optsWp='<option value="">근무지 없이 (기본 시급 '+comma(state.defaultWage)+'원)</option>';
    state.workplaces.forEach(function(w){
      optsWp+='<option value="'+escapeHtml(w.id)+'"'+(w.id===l.wpId?' selected':'')+'>'+escapeHtml(w.name)+' · '+comma(w.wage)+'원</option>';
    });
    body+='<div class="field"><label>근무지</label><select id="rWp">'+optsWp+'</select></div>';
    if(!state.workplaces.length){
      body+='<p class="hint">근무지를 안 만들었어도 기본 시급으로 계산해요. 근무지 탭에서 만들면 수당·공제까지 붙어요.</p>';
    }
  }
  body+='<div class="field-row">'
    + '<div class="field"><label>출근</label><input type="time" id="rStart" value="'+l.start+'"></div>'
    + '<div class="field"><label>퇴근</label><input type="time" id="rEnd" value="'+l.end+'"></div>'
    + '</div>'
    + '<p class="hint">퇴근이 출근보다 이르면 다음 날로 계산해요. (예: 22:00 → 08:00)</p>';
  if(!simple){
    var breakOpts=[{v:'',t:'근무지 설정대로'},{v:'0',t:'휴게 없음'},{v:'30',t:'30분'},{v:'60',t:'60분'},{v:'90',t:'90분'},{v:'120',t:'120분'}];
    var curBreak=(l.breakMin===null||l.breakMin===undefined)?'':String(l.breakMin);
    var bOptsHtml=breakOpts.map(function(o){
      var label=o.t;
      if(o.v==='' && wp) label='근무지 설정 ('+breakLabel(wp)+')';
      if(o.v==='' && !wp) label='기본 (없음)';
      return '<option value="'+o.v+'"'+(curBreak===o.v?' selected':'')+'>'+label+'</option>';
    }).join('');
    body+='<div class="field"><label>휴게시간</label><select id="rBreak">'+bOptsHtml+'</select></div>';
    body+='<label class="check" id="rHolidayWrap"><input type="checkbox" id="rHoliday"'+(l.holiday?' checked':'')+'> 공휴일 근무 (휴일근로 1.5배)</label>';
  }
  body+='<div class="preview" id="rPreview"></div>'
    + '<div class="sheet-actions">'
    +   '<button type="submit" class="btn primary">'+(editing?'수정 저장':'저장')+'</button>'
    +   (editing?'<button type="button" class="btn danger" data-act="delLog" data-id="'+escapeHtml(l.id)+'">삭제</button>':'')
    + '</div></form>';
  openSheet(editing?'기록 수정':(simple?'시간 적기':'출근·퇴근 기록'), body);
  var form=document.getElementById('recordForm');
  form.addEventListener('submit', saveRecord);
  ['rDate','rStart','rEnd','rWp','rBreak','rHoliday'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('input', updatePreview);
    if(el) el.addEventListener('change', updatePreview);
  });
  var wpSel=document.getElementById('rWp');
  if(wpSel) wpSel.addEventListener('change', function(){
    var w=wpById(wpSel.value);
    var hw=document.getElementById('rHolidayWrap');
    if(hw) hw.style.display = (w && w.holiday) ? 'flex' : 'none';
  });
  if(wpSel){
    var w0=wpById(wpSel.value);
    var hw0=document.getElementById('rHolidayWrap');
    if(hw0) hw0.style.display = (w0 && w0.holiday) ? 'flex' : 'none';
  }
  updatePreview();
}
function currentRecordDraft(){
  var d={
    date:(document.getElementById('rDate')||{}).value || todayStr(),
    start:(document.getElementById('rStart')||{}).value||'',
    end:(document.getElementById('rEnd')||{}).value||'',
    wpId:'', breakMin:null, holiday:false
  };
  var wpSel=document.getElementById('rWp');
  if(wpSel) d.wpId=wpSel.value;
  var br=document.getElementById('rBreak');
  if(br && br.value!=='') d.breakMin=Number(br.value);
  var hd=document.getElementById('rHoliday');
  if(hd) d.holiday=!!hd.checked;
  return d;
}
function updatePreview(){
  var el=document.getElementById('rPreview');
  if(!el) return;
  var d=currentRecordDraft();
  var wp=d.wpId?wpById(d.wpId):null;
  var r=shiftRange(d.start,d.end);
  if(!r){ el.innerHTML='출근·퇴근 시간을 넣으면 계산해 드려요.'; return; }
  var c=computeShift(d, wp, state.defaultWage);
  if(!c.netMin){ el.innerHTML='시간을 다시 확인해 주세요.'; return; }
  var parts=['실근무 <b>'+durLabel(c.netMin)+'</b>'];
  if(c.breakMin) parts.push('휴게 '+c.breakMin+'분');
  if(c.nightOn && c.nightMin) parts.push('야간 <b>'+durLabel(c.nightMin)+'</b>');
  var rate = wp ? taxRate(wp.tax) : 0;
  var gross=Math.round(c.base+c.nightPay+c.holidayPay);
  var out='<div>'+parts.join(' · ')+'</div>';
  if(gross>0){
    if(rate>0){
      out+='<span class="money">'+won(Math.round(gross*(1-rate)))+'</span><div style="font-size:11.5px;margin-top:2px">세전 '+won(gross)+' · 공제 '+taxLabel(wp.tax)+'</div>';
    }else{
      out+='<span class="money">'+won(gross)+'</span>';
    }
  }else{
    out+='<div style="font-size:11.5px;margin-top:4px;color:var(--ink3)">시급을 넣으면 금액도 계산해요.</div>';
  }
  el.innerHTML=out;
}
function saveRecord(e){
  e.preventDefault();
  var d=currentRecordDraft();
  var id=(document.getElementById('rId')||{}).value||'';
  if(!d.date){ toast('날짜를 넣어 주세요'); return; }
  if(!d.start||!d.end){ toast('출근·퇴근 시간을 넣어 주세요'); return; }
  if(d.start===d.end){ toast('출근과 퇴근 시간이 같아요'); return; }
  var wp=d.wpId?wpById(d.wpId):null;
  if(wp && wp.holiday){} /* 공휴일 여부는 사용자가 체크 */
  if(id){
    var cur=logById(id);
    if(cur){
      cur.date=d.date; cur.start=d.start; cur.end=d.end; cur.wpId=d.wpId;
      cur.breakMin=d.breakMin; cur.holiday=d.holiday;
      toast('수정했어요');
    }
  }else{
    state.logs.push({id:uid('lg'), date:d.date, start:d.start, end:d.end, wpId:d.wpId, breakMin:d.breakMin, holiday:d.holiday});
    toast('기록했어요 · '+durLabel(computeShift(d,wp,state.defaultWage).netMin)+(computeShift(d,wp,state.defaultWage).gross>0?' · '+won(computeShift(d,wp,state.defaultWage).gross):''));
  }
  save();
  closeSheet();
  var dt=parseYmd(d.date); ui.y=dt.getFullYear(); ui.m=dt.getMonth()+1;
  render();
}
function deleteLog(id){
  var l=logById(id);
  if(!l) return;
  if(!confirm(koDate(l.date)+' '+l.start+' → '+l.end+' 기록을 지울까요?')) return;
  state.logs=state.logs.filter(function(x){ return String(x.id)!==String(id); });
  save(); closeSheet(); render(); toast('지웠어요');
}
function openDaySheet(ds){

  var st=computeMonth(state.logs, state.workplaces, state.defaultWage, ui.y, ui.m);

    body+='<p class="hint" style="margin:0 0 16px">이 날 기록이 없어요.</p>';

      body+='<button class="row" data-act="editLog" data-id="'+l.id+'">'
        + '<span class="row-l"><b>'+l.start+' → '+l.end+'</b><i>'+(wp?escapeHtml(wp.name):'근무지 없이')+' · '+durLabel(c.netMin)+'</i></span>'
        + '<span class="row-r">'+(c.gross>0?won(c.gross*(1-taxRate(wp?(wp.tax||'none'):'none'))):'')+'</span><span class="go">›</span></button>';
    });
  }
  body+='<div class="sheet-actions" style="margin-top:16px">'
    + '<button class="btn primary" data-act="addLog" data-date="'+ds+'">이 날 기록 추가</button></div>';
  openSheet('날짜', body);

    + '<div class="switchrow"><div class="tx"><b>공휴일 수당</b><span>휴일근로 1.5배 (8시간 넘으면 2배)</span></div>'
    +   '<input class="sw" type="checkbox" id="wHoliday"'+(d.holiday?' checked':'')+'></div>'
    + '<p class="hint" style="margin:8px 0 16px">상시 5인 미만 매장은 야간·휴일 가산이 없어요. 그런 곳은 꺼 두면 돼요.</p>'

    + '<div class="sec" style="margin:0 2px 8px">공제</div>'
    + '<div class="seg" id="wTax">'
    +   '<label><input type="radio" name="tax" value="none"'+(d.tax==='none'?' checked':'')+'><span>공제 없음<br><span style="font-size:10.5px;font-weight:600;color:var(--ink3)">0%</span></span></label>'
    +   '<label><input type="radio" name="tax" value="3.3"'+(d.tax==='3.3'?' checked':'')+'><span>3.3%<br><span style="font-size:10.5px;font-weight:600;color:var(--ink3)">사업소득</span></span></label>'
    +   '<label><input type="radio" name="tax" value="insurance"'+(d.tax==='insurance'?' checked':'')+'><span>4대보험<br><span style="font-size:10.5px;font-weight:600;color:var(--ink3)">약 9.4%</span></span></label>'
    + '</div>'
    + '<p class="hint" style="margin:10px 0 16px">4대보험은 국민연금·건강·장기요양·고용 근로자 부담분이에요.</p>'

    + '<div class="sec" style="margin:0 2px 8px">휴게시간</div>'
    + '<div class="field"><select id="wBreak">'+breakSel+'</select></div>'
    + '<div class="field" id="wBreakCustomWrap" style="display:none"><label>직접 입력 (분)</label><input type="number" id="wBreakCustom" min="0" step="5" value="'+(d.breakCustom||60)+'"></div>'
    + '<p class="hint" style="margin:-8px 0 16px">30분·60분은 4시간 이상 근무할 때 빼요. 4시간마다 30분은 근무 길이에 맞춰 자동으로 계산해요.</p>'

    + '<div class="sec" style="margin:0 2px 8px">고정 근무일 <span style="font-weight:600;color:var(--ink3)">(선택)</span></div>'
    + '<div class="wd" id="wWd">'+wdHtml+'</div>'
    + '<div class="field-row" style="margin-top:12px">'
    +   '<div class="field"><label>출근</label><input type="time" id="wStart" value="'+d.startTime+'"></div>'
    +   '<div class="field"><label>퇴근</label><input type="time" id="wEnd" value="'+d.endTime+'"></div>'
    + '</div>'
    + '<p class="hint" style="margin:-8px 0 16px">넣어 두면 월말 예상 급여를 이 일정으로 계산하고, 기록할 때 시간이 미리 채워져요.</p>'

    + '<div class="sheet-actions">'
    +   '<button type="submit" class="btn primary">'+(w?'저장':'근무지 만들기')+'</button>'
    +   (w?'<button type="button" class="btn danger" data-act="delWp" data-id="'+escapeHtml(d.id)+'">삭제</button>':'')
    + '</div></form>';
  openSheet(w?'근무지 수정':'근무지 추가', body);
  document.getElementById('wpForm').addEventListener('submit', saveWorkplace);
  var brk=document.getElementById('wBreak');
  function toggleCustom(){ document.getElementById('wBreakCustomWrap').style.display = brk.value==='custom'?'block':'none'; }
  brk.addEventListener('change', toggleCustom);
  toggleCustom();
}
function saveWorkplace(e){
  e.preventDefault();
  var id=(document.getElementById('wId')||{}).value||'';
  var name=(document.getElementById('wName').value||'').trim();
  var wage=Math.max(0, Number(document.getElementById('wWage').value)||0);
  if(!name){ toast('근무지 이름을 넣어 주세요'); return; }
  if(!wage){ toast('시급을 넣어 주세요'); return; }
  var wds=[];
  document.querySelectorAll('#wWd input:checked').forEach(function(el){ wds.push(Number(el.value)); });
  var taxEl=document.querySelector('#wTax input:checked');
  var data={
    name:name.slice(0,30), wage:wage,
    weekly:document.getElementById('wWeekly').checked,
    night:document.getElementById('wNight').checked,
    holiday:document.getElementById('wHoliday').checked,
    tax: taxEl?taxEl.value:'none',
    breakType:document.getElementById('wBreak').value,
    breakCustom:Math.max(0,Number(document.getElementById('wBreakCustom').value)||0),
    weekdays:wds.sort(),
    startTime:document.getElementById('wStart').value||'',
    endTime:document.getElementById('wEnd').value||''
  };
  if(id){
    var cur=wpById(id);
    if(cur){ Object.assign(cur, data); toast('저장했어요'); }
  }else{
    data.id=uid('wp');
    state.workplaces.push(data);
    toast('근무지를 만들었어요');
  }
  save(); closeSheet(); render();
}
function deleteWp(id){
  var w=wpById(id);
  if(!w) return;
  var used=state.logs.filter(function(l){ return l.wpId===id; }).length;
  var msg=used
    ? '\''+w.name+'\' 근무지를 지울까요?\n이 근무지로 적은 기록 '+used+'건은 \'근무지 없이\'로 남아요.'
    : '\''+w.name+'\' 근무지를 지울까요?';
  if(!confirm(msg)) return;
  state.workplaces=state.workplaces.filter(function(x){ return x.id!==id; });
  state.logs.forEach(function(l){ if(l.wpId===id) l.wpId=''; });
  save(); closeSheet(); render(); toast('근무지를 지웠어요');
}

/* ---------- 시트: 설정 ---------- */
function openSettings(){
  var body='<div class="field"><label>기본 시급 (근무지 없이 기록할 때)</label>'
    + '<input type="number" id="sWage" inputmode="numeric" step="10" min="0" value="'+state.defaultWage+'">'
    + '<p class="hint" style="margin:6px 0 0">간단 모드에서 시간만 적어도 이 시급으로 계산해요.</p></div>'
    + '<div class="field"><button class="btn primary" data-act="saveDefaultWage" style="width:100%">저장</button></div>'
    + '<div class="sec" style="margin:16px 2px 8px">데이터</div>'
    + '<button class="datarow" data-act="exportJson"><div class="tx"><b>JSON 내보내기</b><span>근무지·기록 전부를 파일로 받아요</span></div><span class="arrow">›</span></button>'
    + '<button class="datarow" data-act="openImport"><div class="tx"><b>JSON 불러오기</b><span>내보낸 파일이나 붙여넣은 내용으로 되돌려요</span></div><span class="arrow">›</span></button>'
    + '<button class="datarow dangerous" data-act="resetAll"><div class="tx"><b>전부 지우기</b><span>근무지와 기록을 모두 지워요</span></div><span class="arrow">›</span></button>'
    + '<p class="hint" style="margin:16px 0 0">기록은 이 브라우저에만 저장돼요. 서버로 보내지 않아요. 알바로그 3.0</p>';
  openSheet('설정', body);
}
function openImportSheet(){
  var body='<div class="field"><label>파일</label><input type="file" id="impFile" accept="application/json,.json" style="padding:12px 0;font-size:13px;border:0"></div>'
    + '<div class="field"><label>또는 붙여넣기</label><textarea class="import" id="impText" placeholder="JSON 내용을 붙여넣으세요"></textarea></div>'
    + '<div class="sheet-actions"><button class="btn primary" data-act="importJson">불러오기</button>'
    + '<button class="btn ghost" data-act="openSettings">취소</button></div>';
  openSheet('JSON 불러오기', body);
}
function exportJson(){
  var data=JSON.stringify(state, null, 2);
  var blob=new Blob([data], {type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='albalog_'+todayStr().replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('파일로 내보냈어요');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='tab'){ ui.tab=el.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
  if(act==='prevMonth'){
    ui.m--; if(ui.m<1){ ui.m=12; ui.y--; } render(); return;
  }
  if(act==='nextMonth'){
    ui.m++; if(ui.m>12){ ui.m=1; ui.y++; } render(); return;
  }
  if(act==='thisMonth'){ var n=new Date(); ui.y=n.getFullYear(); ui.m=n.getMonth()+1; render(); return; }
  if(act==='toggleMode'){
    state.mode = state.mode==='simple' ? 'full' : 'simple';
    save(); render();
    toast(state.mode==='simple' ? '간단 모드 — 시간만 적고 끝내요' : '정식 모드 — 근무지·수당까지 계산해요');
    return;
  }
  if(act==='addLog'){ openRecordSheet({date: el.getAttribute('data-date')||null}); return; }
  if(act==='editLog'){
    var lid=el.getAttribute('data-id');
    openRecordSheet({id:lid});
    return;
  }
  if(act==='delLog'){ deleteLog(el.getAttribute('data-id')); return; }
  if(act==='day'){ openDaySheet(el.getAttribute('data-date')); return; }
  if(act==='closeSheet'){ closeSheet(); return; }
  if(act==='addWp'){ openWpSheet(null); return; }
  if(act==='editWp'){ openWpSheet(el.getAttribute('data-id')); return; }
  if(act==='delWp'){ deleteWp(el.getAttribute('data-id')); return; }
  if(act==='minWage'){ var wi=document.getElementById('wWage'); if(wi) wi.value=MIN_WAGE_2026; return; }
  if(act==='openSettings'){ openSettings(); return; }
  if(act==='saveDefaultWage'){
    var v=Math.max(0,Number(document.getElementById('sWage').value)||0);
    if(!v){ toast('시급을 넣어 주세요'); return; }
    state.defaultWage=v; save(); render(); toast('저장했어요');
    return;
  }
  if(act==='exportJson'){ exportJson(); return; }
  if(act==='openImport'){ openImportSheet(); return; }
  if(act==='importJson'){
    var text=(document.getElementById('impText')||{}).value||'';
    var fileInput=document.getElementById('impFile');
    function apply(raw){
      try{
        var parsed=JSON.parse(raw);
        var next=normalizeState(parsed);
        if(!next.workplaces.length && !next.logs.length){ toast('불러올 내용이 없어요'); return; }
        if(!confirm('지금 기록 '+(state.logs.length)+'건을 불러온 내용으로 바꿀까요?')) return;
        state=next; save(); closeSheet(); render(); toast('불러왔어요 · 기록 '+state.logs.length+'건');
      }catch(e){ toast('JSON 형식이 아니에요'); }
    }
    if(fileInput && fileInput.files && fileInput.files[0]){
      var fr=new FileReader();
      fr.onload=function(){ apply(String(fr.result)); };
      fr.readAsText(fileInput.files[0]);
    }else if(text.trim()){
      apply(text);
    }else{
      toast('파일을 고르거나 내용을 붙여넣어 주세요');
    }
    return;
  }
  if(act==='resetAll'){
    if(!confirm('근무지와 기록을 전부 지울까요? 되돌릴 수 없어요.')) return;
    state=emptyState(); save(); closeSheet(); render(); toast('전부 지웠어요');
    return;
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });

/* ---------- 시작 ---------- */
load();
(function init(){
  var n=new Date();
  ui.y=n.getFullYear(); ui.m=n.getMonth()+1;
  render();
})();
</script>
