<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세종카페">
<meta name="theme-color" content="#08080a">
<title>세종월드교회 카페 · 키오스크</title>
<link rel="stylesheet" href="./style.css?v=18">
<style>
  /* ---- 키오스크(태블릿) · 다크 글래스 ---- */
  .kiosk { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .k-top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: rgba(10, 10, 13, .82); backdrop-filter: blur(18px) saturate(150%);
    border-bottom: 1px solid var(--line); z-index: 10;
  }
  .k-top .k-name b { font-size: 17px; letter-spacing: -.02em; }
  .k-top .k-name span { display: block; font-size: 9.5px; letter-spacing: .18em; color: var(--muted); font-weight: 700; }
  .k-top .k-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .k-top .k-search { flex: 1 1 auto; max-width: 360px; min-width: 0; }
  .k-top .k-search .searchbar { padding: 0 10px 0 12px; }
  .k-top .k-search .searchbar input { padding: 9px 0; font-size: 16px; }
  .k-search-meta { display: flex; align-items: center; gap: 8px; padding: 14px 2px 4px; font-size: 12px; color: var(--muted); }
  .k-search-meta b { color: var(--brand-2); }
  .k-search-meta .btn { margin-left: 6px; }
  @media (max-width: 720px) { .k-top .k-search { max-width: none; } .k-top .k-name span { display: none; } }

  /* 실시간 주문 현황 */
  #kBoardBtn.on { background: var(--brand-soft); color: var(--brand-2); border-color: rgba(233, 189, 148, .32); }
  #kBoardBtn .n { font-variant-numeric: tabular-nums; }
  #kBoardBtn, #kStatus { white-space: nowrap; }
  #kBoardCard { max-height: 78dvh; overflow-y: auto; scrollbar-width: none; }
  #kBoardCard::-webkit-scrollbar { display: none; }
  .kb-sec { padding: 16px 0 4px; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 800; }
  .kb-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .kb-no { flex: 0 0 auto; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--brand); }
  .kb-nm { flex: 0 0 auto; max-width: 28%; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-mn { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-empty { padding: 28px 0; text-align: center; color: var(--muted); font-size: 13px; }

  .k-body { flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden; }

  /* 왼쪽: 카테고리 + 메뉴 그리드 */
  .k-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .k-cats { flex: 0 0 auto; display: flex; gap: 8px; padding: 14px clamp(14px, 2vw, 24px) 6px; overflow-x: auto; scrollbar-width: none; }
  .k-cats::-webkit-scrollbar { display: none; }
  .k-cats .chip { font-size: 13.5px; padding: 10px 17px; }
  .k-grid-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px clamp(14px, 2vw, 24px) 28px; scrollbar-width: none; }
  .k-grid-wrap::-webkit-scrollbar { display: none; }
  .k-cat-title { display: flex; align-items: center; gap: 10px; padding: 16px 2px 9px; }
  .k-cat-title b { font-size: 11px; letter-spacing: .18em; color: var(--brand); }
  .k-cat-title .line { flex: 1 1 auto; height: 1px; background: var(--line); }
  .k-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .k-item {
    text-align: left; padding: 15px 15px 13px; border-radius: 18px; background: var(--card);
    border: 1px solid var(--line); box-shadow: var(--card-shadow), inset 0 1px 0 var(--sheen);
    display: flex; flex-direction: column; gap: 7px; min-height: 104px;
    transition: .22s var(--spring);
  }
  .k-item:active { transform: scale(.975); border-color: rgba(233, 189, 148, .45); }
  .k-item.soldout { opacity: .34; }
  .k-item .n { font-size: 15px; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; }
  .k-item .d { font-size: 11px; color: var(--muted); }
  .k-item .p { margin-top: auto; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .k-item .p b { font-size: 14.5px; color: var(--brand); }
  .k-item .p span { font-size: 10px; color: var(--muted); }

  /* 오른쪽: 주문서 패널 — 가로 태블릿에서는 폭이 화면에 따라 늘어납니다 */
  .k-right-pane {
    flex: 0 0 clamp(320px, 31vw, 410px); display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line); background: rgba(12, 12, 16, .72);
    backdrop-filter: blur(14px) saturate(140%);
  }
  .k-pane-hdr { flex: 0 0 auto; padding: 15px 16px 11px; border-bottom: 1px solid var(--line); }
  .k-pane-hdr b { font-size: 14.5px; }
  .k-cust { display: grid; grid-template-columns: 1fr 82px; gap: 8px; }
  .k-cust .input { padding: 12px 13px; }
  .k-cart { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px; scrollbar-width: none; }
  .k-cart::-webkit-scrollbar { display: none; }
  .k-lines .k-line { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .k-line .li { flex: 1 1 auto; min-width: 0; }
  .k-line .li b { font-size: 13px; display: block; }
  .k-line .li span { font-size: 11px; color: var(--muted); }
  .k-line .q { display: flex; align-items: center; gap: 6px; }
  .k-line .q button {
    width: 30px; height: 30px; border-radius: 10px; background: rgba(255, 255, 255, .06);
    border: 1px solid var(--line-2); font-size: 15px; font-weight: 700; color: var(--brand-2);
    transition: .18s var(--spring);
  }
  .k-line .q button:active { transform: scale(.92); }
  .k-line .q b { min-width: 18px; text-align: center; font-size: 13.5px; }
  .k-pane-foot { flex: 0 0 auto; padding: 13px 16px calc(env(safe-area-inset-bottom) + 14px); border-top: 1px solid var(--line); background: rgba(10, 10, 13, .9); }
  .k-total { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .k-total b { font-size: 23px; color: var(--brand); font-variant-numeric: tabular-nums; }
  .k-big { width: 100%; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 800; }
  .k-memchips { display: flex; gap: 6px; overflow-x: auto; padding: 9px 2px 2px; scrollbar-width: none;
    mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); }
  .k-memchips:empty { display: none; }
  .k-memchips::-webkit-scrollbar { display: none; }
  .k-memchips button {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line); color: var(--sub); font-size: 12px; font-weight: 700; transition: .18s var(--spring);
  }
  .k-memchips button:active { transform: scale(.96); background: var(--brand-soft); color: var(--brand-2); }

  /* 옵션 모달 / 완료 오버레이 */
  .modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(4, 4, 6, .62); backdrop-filter: blur(6px); padding: 20px; }
  .modal.open { display: grid; }
  .modal .m-card {
    width: min(460px, 92vw); border-radius: 24px; padding: 22px;
    background: linear-gradient(180deg, #16161b, #101014); border: 1px solid var(--line-2);
    box-shadow: 0 40px 80px -40px #000, inset 0 1px 0 var(--sheen);
    animation: pop .3s var(--spring);
  }
  .done-ov {
    position: fixed; inset: 0; z-index: 85; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px; background: #08080b; backdrop-filter: blur(18px);
  }
  .done-ov::before {
    content: ''; position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(233, 189, 148, .18), transparent 66%); pointer-events: none;
  }
  .done-ov.open { display: flex; }
  .done-ov .big { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
  .done-ov .no { font-size: 52px; font-weight: 900; letter-spacing: .06em; margin: 4px 0 2px; color: var(--brand-2); }
  .done-ov .box {
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line-2); border-radius: 18px;
    padding: 16px 20px; margin-top: 18px; min-width: min(420px, 90vw); box-shadow: inset 0 1px 0 var(--sheen);
  }
  .done-ov .box b { font-size: 19px; color: var(--brand-2); }
  .done-ov .cd { margin-top: 20px; font-size: 13px; color: var(--sub); }
  .done-ov .cd b { font-size: 20px; color: var(--ink); }

  /* 900px 미만(세로 거치·좁은 태블릿)에서는 상하 2단으로 */
  @media (max-width: 1199px) {
    .k-grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
  }
  @media (max-width: 899px) {
    .k-body { flex-direction: column; }
    .k-right-pane { flex: 0 0 auto; max-height: 54dvh; border-left: 0; border-top: 1px solid var(--line); }
    .k-pane-hdr { padding: 9px 14px 7px; }
    .k-cust { grid-template-columns: 1fr 76px; }
    .k-cust .input { padding: 9px 11px; }
    .k-cust + .tiny { font-size: 11px; line-height: 1.35; }
    .check-row { padding: 9px 11px; }
    .k-memchips { display: none; }
    .k-cart { padding: 8px 14px; }
    .k-cart .textarea { height: 46px; min-height: 46px; }
    #kAcctNote { display: none; }        /* 세로에서는 아래 계좌번호 복사 버튼으로 기음 */
    .k-pane-foot { padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); }
    .k-total { margin-bottom: 8px; }
    .k-total b { font-size: 20px; }
    .k-big { padding: 13px; font-size: 15px; }
    .k-grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); }
    .k-item { min-height: 96px; padding: 13px 13px 11px; }
    .k-item .n { font-size: 14px; }
  }
  /* 좁은 세로 태블릿에서는 상단을 두 줄로 — 브랜드·상태 / 검색 */
  @media (max-width: 860px) {
    .k-top { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px 12px; }
    .k-top .hdr-mark { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
    .k-top .k-name { min-width: 0; }
    .k-top .k-name b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .k-top .k-name span { display: none; }
    .k-top .k-search { order: 3; flex: 1 1 100%; max-width: none; }
    .k-top .k-right { order: 2; gap: 6px; }
    #kBoardBtn, #kStatus { font-size: 11px; padding: 4px 9px; }
  }
  @media (max-height: 640px) {
    .k-top { padding: 9px 16px; }
    .k-cats { padding-top: 10px; }
    .k-pane-hdr { padding: 11px 14px 8px; }
  }
</style>
</head>
<body>
<div class="kiosk">
  <header class="k-top">
    <div class="hdr-mark" style="width:40px;height:40px;border-radius:13px;font-size:20px">☕</div>
    <div class="k-name"><b>세종월드교회 카페</b><span>SEJONG WORLD CAFE · 키오스크</span></div>
    <div class="k-search">
      <div class="searchbar" id="kSearch">
        <span class="s-ico">🔍</span>
        <input id="kQ" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="메뉴 이름 · 설명으로 찾기">
        <button class="s-clear" id="kQClear" type="button" aria-label="검색어 지우기">✕</button>
      </div>
    </div>
    <div class="k-right">
      <button class="badge" id="kBoardBtn" type="button">실시간 현황 0건</button>
      <span class="badge gray" id="kStatus">연결 중…</span>
    </div>
  </header>

  <div class="k-body">
    <section class="k-left">
      <div class="k-cats" id="kCats"></div>
      <div class="k-grid-wrap" id="kGrid"><div id="kGridInner"></div></div>
    </section>

    <aside class="k-right-pane">
      <div class="k-pane-hdr">
        <div class="between"><b>주문서</b><span class="badge" id="kTier">가격 확인 중</span></div>
        <div class="k-cust mt10">
          <input class="input" id="kName" placeholder="이름" maxlength="12" autocomplete="off">
          <input class="input" id="kAge" placeholder="나이" inputmode="numeric" maxlength="2" autocomplete="off">
        </div>
        <div class="tiny muted mt6" id="kCalc" style="font-size:12px;line-height:1.4">나이만 입력하면 기수·부서·가격이 자동 계산됩니다 (37세 이상 청년처)</div>
        <div class="k-memchips" id="kMembers"></div>
      </div>

      <div class="k-cart">
        <div class="k-lines" id="kLines"></div>
        <label class="field mt10" style="margin-bottom:0"><span>요청 메시지</span>
          <textarea class="textarea" id="kMsg" maxlength="120" placeholder="예) 얼음 적게 / 15분 뒤에 갈게요"></textarea>
        </label>
        <div class="note mt10" id="kAcctNote"></div>
      </div>

      <div class="k-pane-foot">
        <div class="k-total"><span class="sub small">결제할 금액</span><b class="tnum" id="kTotal">0원</b></div>
        <button class="btn primary k-big" id="kOrder" type="button">주문하기</button>
        <div class="row mt6" style="gap:6px">
          <button class="btn sm grow" id="kReset" type="button">처음부터</button>
          <button class="btn sm grow" id="kAcctCopy" type="button">계좌번호 복사</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="kModal"><div class="m-card" id="kModalCard"></div></div>
<div class="modal" id="kBoard"><div class="m-card" id="kBoardCard"></div></div>
<div class="done-ov" id="kDone"></div>

<script type="module">
import {
  db, BRAND, CATS, CAT_NAME, HANDDRIP_NOTE, DEFAULT_CONFIG, won, tierOf, tierShort,
  priceOf, shortId, esc, lockZoom, ensureMenus, watchConfig, collection, doc, addDoc, setDoc, getDoc, getDocs, onSnapshot, query, where,
  copyText, profileFrom, hydrateProfile, whoTag, ageTag, tierName, menuMatches, hhmm, itemsSummary, memberKeyOf, pushTokensOf
} from './core.js?v=18';

lockZoom();

const S = { menus: [], cart: {}, cat: 'all', q: '', queue: [], cfg: { ...DEFAULT_CONFIG }, members: [], memberList: [], modalItem: null, modalQty: 1, modalOpt: '' };
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = el('div', 'toast'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

const cust = () => {
  const p = profileFrom({ name: $('#kName').value, age: $('#kAge').value });
  return { name: $('#kName').value.trim(), age: p.age, gi: p.gi, dept: p.dept, senior: p.senior, tier: p.tier };
};
const tier = () => cust().tier;
const named = () => { const c = cust(); return c.name.length > 0 && c.age > 0; };

watchConfig(c => {
  S.cfg = c;
  $('#kAcctNote').innerHTML = `결제 단말기가 없어 <b>계좌이체</b>로 결제합니다.<br><b>${esc(c.bank)} ${esc(c.account)}</b> (예금주 ${esc(c.holder)})`;
  render();
});

onSnapshot(collection(db, 'menus'), snap => {
  S.menus = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.name)
    .sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'ko'));
  $('#kStatus').textContent = '실시간 연결됨';
  $('#kStatus').className = 'badge ok';
  render();
}, e => { $('#kStatus').textContent = '연결 오류'; $('#kStatus').className = 'badge warn'; });

onSnapshot(collection(db, 'members'), snap => {
  S.members = snap.docs.map(d => d.data()).filter(m => m.name)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 12);
  renderMembers();
}, () => { });

/* 실시간 주문 현황 */
onSnapshot(query(collection(db, 'orders'), where('status', 'in', ['new', 'made'])), snap => {
  S.queue = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const btn = $('#kBoardBtn');
  btn.textContent = `실시간 현황 ${S.queue.length}건`;
  btn.classList.toggle('on', S.queue.length > 0);
  if ($('#kBoard').classList.contains('open')) renderBoardPane();
}, () => { });

function renderBoardPane() {
  const q = S.queue || [];
  const wait = q.filter(o => o.status === 'new');
  const pick = q.filter(o => o.status === 'made');
  const row = (o, kind) => `<div class="kb-row">
      <span class="kb-no">#${shortId(o.id)}</span>
      <b class="kb-nm">${esc(o.name || '손님')}</b>
      <span class="kb-mn">${esc(itemsSummary(o.items))}</span>
      <span class="badge ${kind === 'pick' ? 'ok' : 'warn'}">${kind === 'pick' ? '픽업 대기' : '조리 중'}</span>
    </div>`;
  let html = `<div class="between"><b style="font-size:19px">실시간 주문 현황</b><button class="btn sm ghost" id="kBoardClose" type="button">닫기</button></div>
    <div class="tiny muted mt6"><span class="live-dot" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>주문이 들어오면 바로 바뀝니다 · ${q.length}건 진행 중</div>`;
  if (!q.length) {
    html += `<div class="kb-empty">지금은 대기 중인 주문이 없어요 ☕</div>`;
  } else {
    if (pick.length) html += `<div class="kb-sec">픽업 대기 · ${pick.length}</div>` + pick.map(o => row(o, 'pick')).join('');
    if (wait.length) html += `<div class="kb-sec">조리 중 · ${wait.length}</div>` + wait.map(o => row(o, 'wait')).join('');
  }
  $('#kBoardCard').innerHTML = html;
  $('#kBoardClose').onclick = () => $('#kBoard').classList.remove('open');
}
$('#kBoardBtn').onclick = () => { renderBoardPane(); $('#kBoard').classList.add('open'); };
$('#kBoard').onclick = e => { if (e.target.id === 'kBoard') $('#kBoard').classList.remove('open'); };

function renderMembers() {
  const box = $('#kMembers');
  if (!box) return;
  // 같은 사람이 기기를 여러 번 거쳤으면 최근 기록 하나만 남깁니다 (이름_나이 기준)
  const seen = new Set();
  const list = S.members.filter(m => {
    const k = m.memberKey || memberKeyOf(m);
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  }).slice(0, 12);
  S.memberList = list;
  box.innerHTML = list.map((m, i) => {
    const p = hydrateProfile(m);
    const tag = ageTag(p);
    return `<button type="button" data-m="${i}">${esc(p.name)} ${esc(tag)}</button>`;
  }).join('');
  box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const p = hydrateProfile(S.memberList[Number(b.dataset.m)]);
    $('#kName').value = p.name; $('#kAge').value = p.age || '';
    render();
  });
}

function render() {
  // 카테고리
  const cats = $('#kCats');
  const chips = [{ key: 'all', name: '전체' }, ...CATS];
  cats.innerHTML = chips.map(c => `<button class="chip ${S.cat === c.key ? 'on' : ''}" data-c="${c.key}" type="button">${c.name}</button>`).join('');
  cats.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.cat = b.dataset.c; render(); });

  // 그리드
  const list = S.cat === 'all' ? CATS : CATS.filter(c => c.key === S.cat);
  const t = tier();
  const q = S.q.trim();
  let html = '';
  let shown = 0;
  for (const c of list) {
    const items = S.menus.filter(m => m.cat === c.key && menuMatches(m, S.q));
    if (!items.length) continue;
    shown += items.length;
    html += `<div class="k-cat-title"><b>${c.name}</b><div class="line"></div></div>`;
    if (c.key === 'handdrip') html += `<div class="note" style="margin:0 0 8px">⏳ ${esc(HANDDRIP_NOTE)}</div>`;
    html += '<div class="k-grid">';
    for (const m of items) {
      const tags = (m.tags || []).map(x => `<span class="badge ${/BEST/.test(x) ? '' : /NEW/.test(x) ? 'new' : /HOT/.test(x) ? 'hot' : 'gray'}">${esc(x)}</span>`).join('');
      const price = named() ? `<b class="tnum">${won(priceOf(m, t))}</b><span>${tierShort(t)}</span>` : `<b class="tnum">${won(m.youth)}</b><span class="tiny">${esc(tierName('youth'))}</span><b class="tnum" style="color:var(--sub)">${won(m.college)}</b><span class="tiny">${esc(tierName('college'))}</span>`;
      html += `<button class="k-item ${m.soldout ? 'soldout' : ''}" data-i="${m.id}" type="button" ${m.soldout ? 'disabled' : ''}>
        <div class="n">${esc(m.name)}</div>
        <div class="row wrap" style="gap:4px">${tags}${m.soldout ? '<span class="badge gray">품절</span>' : ''}${m.temp === 'both' ? '<span class="badge gray">HOT/ICED</span>' : ''}</div>
        ${m.desc ? `<div class="d">${esc(m.desc)}</div>` : ''}
        <div class="p">${price}</div>
      </button>`;
    }
    html += '</div>';
  }
  if (q) html = `<div class="k-search-meta">‘<b>${esc(q)}</b>’ ${shown ? `${shown}종 찾았어요` : '검색 결과가 없어요'}<button class="btn sm" id="kQClear2" type="button">검색어 지우기</button></div>` + html;
  if (!shown) {
    html += q
      ? '<div class="empty"><span class="e-ico">🔍</span><b>찾는 메뉴가 없어요</b><span>다른 낱말로 찾아보세요</span></div>'
      : '<div class="empty"><b>메뉴를 준비 중입니다</b></div>';
  }
  $('#kGridInner').innerHTML = html;
  $('#kGridInner').querySelectorAll('[data-i]').forEach(b => b.onclick = () => pick(b.dataset.i));
  const c2 = $('#kQClear2'); if (c2) c2.onclick = () => clearQ();

  // 장바구니 — 이름·나이를 바꿔 가격대가 달라지면 담아 둔 줄의 가격도 지금 기준으로 다시 계산합니다
  for (const i of Object.values(S.cart)) {
    const m = S.menus.find(x => x.id === i.id);
    if (m) i.price = priceOf(m, t);
  }
  const lines = Object.entries(S.cart);
  $('#kLines').innerHTML = lines.length ? lines.map(([k, i]) => `
    <div class="k-line">
      <div class="li"><b>${esc(i.name)}${i.option ? ` <span class="badge gray">${esc(i.option)}</span>` : ''}</b><span class="tnum">${won(i.price)}</span></div>
      <div class="q"><button data-dec="${esc(k)}" type="button">−</button><b>${i.qty}</b><button data-inc="${esc(k)}" type="button">+</button></div>
    </div>`).join('') : '<div class="empty" style="padding:24px 0"><b>음료를 골라 주세요</b></div>';
  $('#kLines').querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { S.cart[b.dataset.inc].qty++; render(); });
  $('#kLines').querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
    const k = b.dataset.dec; S.cart[k].qty--; if (S.cart[k].qty <= 0) delete S.cart[k]; render();
  });
  const total = Object.values(S.cart).reduce((a, i) => a + i.qty * i.price, 0);
  $('#kTotal').textContent = won(total);
  const c = cust();
  $('#kCalc').textContent = c.age
    ? `${whoTag(c)} 가격`
    : '나이만 입력하면 기수·부서·가격이 자동 계산됩니다';
  $('#kCalc').style.color = c.age ? 'var(--brand-2)' : 'var(--muted)';
  $('#kTier').textContent = named() ? `${c.age}세 · ${tierShort(c.tier)}` : '이름·나이 입력';
  $('#kTier').className = named() ? 'badge' : 'badge gray';
}

/* 메뉴 검색 */
function clearQ() {
  S.q = '';
  $('#kQ').value = '';
  $('#kSearch').classList.remove('has-q');
  render();
}
$('#kQ').oninput = e => {
  S.q = e.target.value;
  $('#kSearch').classList.toggle('has-q', !!S.q.trim());
  render();
};
$('#kQ').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
$('#kQClear').onclick = () => { clearQ(); $('#kQ').focus(); };

/* 옵션 모달 */
function pick(id) {
  const m = S.menus.find(x => x.id === id);
  if (!m) return;
  if (!named()) { toast('이름과 나이를 먼저 입력해 주세요'); $('#kName').focus(); return; }
  const flavors = m.flavors || [];
  const needTemp = m.temp === 'both';
  if (!flavors.length && !needTemp) { addToCart(m, '', 1); return; }
  S.modalItem = m; S.modalQty = 1; S.modalOpt = flavors.length ? flavors[0] : (m.temp === 'hot' ? 'HOT' : 'ICED');
  renderModal();
  $('#kModal').classList.add('open');
}
function renderModal() {
  const m = S.modalItem, flavors = m.flavors || [];
  const t = tier();
  $('#kModalCard').innerHTML = `
    <div class="between"><b style="font-size:20px">${esc(m.name)}</b><b style="color:var(--brand);font-size:18px">${won(priceOf(m, t))}</b></div>
    <div class="mt14"><div class="small sub" style="margin-bottom:6px">${flavors.length ? '맛 선택' : '온도 선택'}</div>
      <div class="opt-grid">${(flavors.length ? flavors : ['HOT', 'ICED']).map(o =>
        `<button class="opt-btn ${S.modalOpt === o ? 'on' : ''}" data-o="${esc(o)}" type="button">${esc(o)}${o === 'HOT' ? ' 🔥' : o === 'ICED' ? ' 🧊' : ''}</button>`).join('')}</div></div>
    <div class="qty mt14">
      <button id="mQMinus" type="button" style="width:46px;height:46px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);font-size:22px;color:var(--brand)">−</button>
      <b style="font-size:22px;min-width:40px;text-align:center">${S.modalQty}</b>
      <button id="mQPlus" type="button" style="width:46px;height:46px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);font-size:22px;color:var(--brand)">+</button>
    </div>
    <div class="row mt20" style="gap:8px">
      <button class="btn grow" id="mCancel" type="button">취소</button>
      <button class="btn primary grow k-big" id="mAdd" type="button">담기</button>
    </div>`;
  $('#kModalCard').querySelectorAll('[data-o]').forEach(b => b.onclick = () => { S.modalOpt = b.dataset.o; renderModal(); });
  $('#mQMinus').onclick = () => { if (S.modalQty > 1) { S.modalQty--; renderModal(); } };
  $('#mQPlus').onclick = () => { if (S.modalQty < 20) { S.modalQty++; renderModal(); } };
  $('#mCancel').onclick = () => $('#kModal').classList.remove('open');
  $('#mAdd').onclick = () => { addToCart(S.modalItem, S.modalOpt, S.modalQty); $('#kModal').classList.remove('open'); };
}

function addToCart(m, option, qty) {
  const key = m.id + '|' + option;
  const price = priceOf(m, tier());
  if (S.cart[key]) { S.cart[key].qty += qty; S.cart[key].price = price; }
  else S.cart[key] = { id: m.id, name: m.name, option, price, qty };
  render();
}

/* 이름·기수 입력 */
$('#kName').oninput = render;
$('#kAge').oninput = () => { $('#kAge').value = $('#kAge').value.replace(/[^0-9]/g, ''); render(); };
$('#kAcctCopy').onclick = async () => { const ok = await copyText(`${S.cfg.bank} ${S.cfg.account}`); toast(ok ? '계좌번호를 복사했어요' : '복사 실패'); };
$('#kReset').onclick = () => resetAll(true);

/* 주문 */
let resetTimer = null;
$('#kOrder').onclick = async () => {
  const c = cust();
  if (!c.name) return toast('이름을 입력해 주세요');
  if (!c.age || c.age < 15 || c.age > 99) return toast('나이를 15~99 사이 숫자로 입력해 주세요');
  const items = Object.values(S.cart);
  if (!items.length) return toast('주문할 음료를 골라 주세요');
  for (const i of items) {
    const m = S.menus.find(x => x.id === i.id);
    if (m) i.price = priceOf(m, tier());
  }
  const btn = $('#kOrder');
  btn.disabled = true; btn.textContent = '접수 중…';
  try {
    const total = items.reduce((a, i) => a + i.qty * i.price, 0);
    /* 이름+나이로 회원키를 만들고, members에 있는 회원이면 그 계정에 연결합니다.
       → 같은 사람이 폰 앱에서도 같은 주문·알림을 볼 수 있습니다. */
    const key = memberKeyOf({ name: c.name, age: c.age });
    let known = S.members.find(m => (m.memberKey || memberKeyOf(m)) === key)
      || S.members.find(m => String(m.name || '') === c.name && Number(m.age) === Number(c.age));
    /* 최근 목록(12명)에 없으면 같은 이름_나이 회원을 서버에서 한 번 더 찾아봅니다 */
    if (!known || !(known.uid || known.accountId)) {
      try {
        const qs = await getDocs(query(collection(db, 'members'), where('memberKey', '==', key)));
        const docs = qs.docs.map(d4 => ({ id: d4.id, ...d4.data() }));
        const found = docs.find(m => m.accountId || m.pwHash) || docs.find(m => m.uid) || docs[0];
        if (found) known = found;
      } catch (e) { console.warn('member find', e); }
    }
    const muid = known ? (known.uid || known.accountId || known.id || '') : '';
    if (muid) {
      try { await setDoc(doc(db, 'members', muid), { memberKey: key, updatedAt: Date.now() }, { merge: true }); } catch (e) { console.warn('member link', e); }
    } else {
      try {
        await setDoc(doc(collection(db, 'members')), {
          uid: '', name: c.name, age: c.age, gi: c.gi, dept: c.dept, senior: !!c.senior, tier: c.tier,
          memberKey: key, source: 'kiosk', fav: [], updatedAt: Date.now()
        });
      } catch (e) { console.warn('member add', e); }
    }
    const ref = await addDoc(collection(db, 'orders'), {
      name: c.name.slice(0, 12), age: c.age, gi: c.gi, dept: c.dept, senior: !!c.senior, tier: c.tier,
      uid: 'kiosk', memberKey: key, memberUid: muid, channel: 'kiosk', mode: 'onsite',
      /* 폰 앱에서 알림을 켜 둔 회원이면 그 기기 토큰을 주문에 복사 → 키오스크 주문도 본인 폰으로 알림 */
      fcmTokens: pushTokensOf(known),
      items: items.map(i => ({ id: i.id, name: i.name, option: i.option || '', price: i.price, qty: i.qty })),
      total,
      message: ($('#kMsg').value || '').slice(0, 120),
      payMethod: 'transfer', payStatus: 'unpaid', status: 'new',
      ts: Date.now(), madeAt: 0, payRequestAt: 0, paidAt: 0
    });
    showDone(ref.id, total, c);
  } catch (e) {
    console.error(e); toast('주문이 접수되지 않았어요');
    btn.disabled = false; btn.textContent = '주문하기';
  }
};

function showDone(orderId, total, c) {
  const ov = $('#kDone');
  let left = 10;
  ov.innerHTML = `
    <div class="big">주문이 접수되었습니다</div>
    <div class="no">#${shortId(orderId)}</div>
    <div style="font-size:15px;opacity:.95">${esc(c.name)}님 · ${esc(whoTag(c))}</div>
    <div class="box">
      <div style="font-size:13px;opacity:.9">결제 금액</div>
      <b>${won(total)}</b>
      <div style="font-size:13px;opacity:.9;margin-top:10px">계좌이체</div>
      <b style="font-size:16px">${esc(S.cfg.bank)} ${esc(S.cfg.account)}</b>
      <div style="font-size:12.5px;opacity:.9">예금주 ${esc(S.cfg.holder)}</div>
    </div>
    <div class="cd"><b id="kCount">${left}</b>초 뒤 다음 손님을 위해 초기화됩니다</div>
    <button class="btn mt14" id="kDoneNow" type="button" style="background:rgba(255,255,255,.14);color:var(--ink);border-color:var(--line-2)">바로 초기화</button>`;
  ov.classList.add('open');
  $('#kDoneNow').onclick = () => { clearInterval(resetTimer); resetAll(false); };
  clearInterval(resetTimer);
  resetTimer = setInterval(() => {
    left--;
    const n = $('#kCount');
    if (n) n.textContent = left;
    if (left <= 0) { clearInterval(resetTimer); resetAll(false); }
  }, 1000);
}

function resetAll(ask) {
  S.cart = {}; $('#kMsg').value = ''; $('#kName').value = ''; $('#kAge').value = '';
  S.q = ''; $('#kQ').value = ''; $('#kSearch').classList.remove('has-q');
  $('#kDone').classList.remove('open');
  const btn = $('#kOrder'); btn.disabled = false; btn.textContent = '주문하기';
  render();
  if (ask) toast('처음부터 다시 시작합니다');
}

$('#kModal').onclick = e => { if (e.target.id === 'kModal') $('#kModal').classList.remove('open'); };

(async function boot() {
  try { await ensureMenus(); } catch (e) { console.warn(e); }
  render();
})();
</script>
</body>
</html>
